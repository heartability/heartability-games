<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Map — Heartability</title>
<style>
@font-face {
  font-family: "ZoesHandwriting";
  src: url(assets/fonts/ZoesHandwriting-Regular.ttf) format("truetype");
}

@font-face {
  font-family: "PFPixelscript";
  src: url(assets/fonts/PFPixelscriptProRegular.ttf) format("truetype");
}
@import url("https://fonts.googleapis.com/css2?family=VT323&display=swap");

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --wall: #6579e2;
  --wall-mid: #6579e2;
  --panel-bg: #f0ead6;
  --panel-border: #6579e2;
  --panel-border-light: #83d2e6;
  --text-dark: #0a1a2e;
  --text-mid: #1a3a5a;
  --aqua: #FDF6E3;
  --font-hand: "ZoesHandwriting", cursive;
  --font-game: "VT323", monospace;
  --font-nums: "ZoesHandwriting", "VT323", monospace;
}

body { min-height: 100vh; background: var(--wall); font-family: var(--font-game); display: flex; flex-direction: column; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }

.room { min-height: 100vh; display: flex; flex-direction: column; }

.wall {
  flex: 1; background: var(--wall); position: relative;
  display: flex; flex-direction: column; align-items: center;
  padding: 24px 16px 0;
  padding-bottom: calc(10dvh + 16px + 24px);
  overflow-y: auto;
}
.wall::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(255,255,255,0.04) 59px, rgba(255,255,255,0.04) 60px);
}

.room-title { 
  font-family: "PFPixelscript", cursive; 
  font-size: clamp(10px,5.5vw,58px); 
  color: #6578e2; 
  text-shadow: 2px 3px 0 rgba(0,0,0,0.14); 
  text-align: center; margin-bottom: 4px; position: relative; z-index: 1; }

.topbar { width: 100%; max-width: 960px; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; position: relative; z-index: 1; gap: 10px; flex-wrap: wrap; }
.instructions { font-family: var(--font-hand); font-size: clamp(12px,1.8vw,16px); color: #a8cce8; line-height: 1.7; }
.instructions .step { color: var(--aqua); }

.rpg-panel {
  position: relative; z-index: 1; background: var(--panel-bg);
  width: 100%; max-width: 960px;
  border: 3px solid var(--panel-border);
  outline: 3px solid var(--panel-border-light); outline-offset: -6px;
  box-shadow: 0 0 0 6px var(--wall-mid), 4px 6px 0 6px rgba(0,0,0,0.4);
  padding: 18px; display: flex; flex-direction: column; gap: 14px;
}
.rpg-panel::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--panel-border-light); pointer-events: none; }

.section-header { font-family: var(--font-hand); font-size: 17px; color: var(--text-mid); margin-bottom: 7px; letter-spacing: 0.5px; }

.map-input {
  width: 100%; background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  padding: 6px 10px; font-family: var(--font-hand); font-size: 20px; color: var(--text-dark); outline: none;
}
.map-input::placeholder { color: rgba(90,74,42,0.35); }
.map-input:focus { border-color: var(--aqua); outline: 1px solid var(--aqua); }

/* TWO COLUMN — map left, controls right on desktop */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* On mobile: stack with controls ABOVE map */
@media (max-width: 680px) {
  .two-col {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
  }
  .side-panel { order: 1; }
  .map-col { order: 2; }
}

/* MAP CANVAS */
.map-canvas {
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  min-height: 380px; position: relative; overflow: hidden;
  cursor: crosshair;
}

@media (max-width: 680px) {
  .map-canvas { min-height: 300px; }
}

.map-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.map-placeholder-text { font-family: var(--font-hand); font-size: 18px; color: rgba(90,74,42,0.25); text-align: center; line-height: 1.8; }

/* MAP ITEMS */
.map-item {
  position: absolute; user-select: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  z-index: 5; cursor: pointer;
  transform: translate(-50%, -50%);
}
.map-item.selected-for-feeling {
  filter: drop-shadow(0 0 6px rgba(59,191,191,0.9));
}
.map-item-wrap { position: relative; display: inline-block; }
.map-item-img { width: 72px; height: auto; display: block; pointer-events: none; }
.map-item-tint {
  position: absolute; inset: -40px;
  pointer-events: none; border-radius: 50%;
  mix-blend-mode: multiply;
}
.map-item-delete {
  position: absolute; top: -10px; right: -10px;
  width: 20px; height: 20px; background: #c04040; color: white;
  border: 1px solid #8a2020;
  font-size: 14px; cursor: pointer; display: none;
  align-items: center; justify-content: center; font-family: var(--font-game);
  z-index: 10; line-height: 1; border-radius: 0;
}
.map-item:hover .map-item-delete { display: flex; }
/* Always show delete on touch devices */
@media (hover: none) {
  .map-item-delete { display: flex !important; top: -8px; right: -8px; width: 18px; height: 18px; font-size: 12px; }
}

@media (max-width: 625px) {
  .room-title { font-size: 22px !important; white-space: nowrap; }
}

.map-item-label {
  font-family: var(--font-hand); font-size: 13px; color: var(--text-dark);
  white-space: nowrap; pointer-events: none; text-align: center; line-height: 1.3;
  background: rgba(240,234,214,0.75); padding: 1px 4px;
}
.map-item-label .terrain-name { display: block; }
.map-item-label .feeling-name { display: block; font-size: 11px; color: #5a4a2a; }

/* SIDE PANEL */
.side-panel { display: flex; flex-direction: column; gap: 12px; }

/* STATUS BAR */
.status-bar {
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  padding: 8px 12px; font-family: var(--font-hand); font-size: 15px; color: var(--text-mid);
  min-height: 40px; line-height: 1.4;
}
.status-bar .status-active { color: var(--text-dark); font-size: 17px; }
.status-bar .status-hint { font-size: 13px; color: #7a6a5a; }

/* TERRAIN PALETTE */
.palette-section {
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  padding: 10px 12px;
}
.palette-items { display: flex; flex-wrap: wrap; gap: 6px; }
.palette-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 8px; background: #f0ead6;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  cursor: pointer; user-select: none; transition: filter 0.1s;
}
.palette-item:hover { filter: brightness(1.06); }
.palette-item.active {
  border-color: var(--aqua);
  outline: 2px solid var(--aqua); outline-offset: 1px;
  background: #e0f0f0;
}
.palette-item img { width: 38px; height: 32px; object-fit: contain; pointer-events: none; }
.palette-item-name { font-family: var(--font-game); font-size: 10px; color: var(--text-mid); pointer-events: none; letter-spacing: 0.5px; }

/* WEATHER CATEGORIES */
.weather-categories { display: flex; flex-direction: column; gap: 8px; }
.weather-category {
  padding: 8px 10px;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
}
.weather-category.sunny { background: #d289c0; ; border-color: #966089; }
.weather-category.rainy { background: #c8c8c7; border-color: #90908f; }
.weather-category.windy { background: #b4e76b; border-color: #90c544; }
.weather-category.snowy { background: #83d2e6; border-color: #5fa3b4; }

.weather-cat-header { font-family: var(--font-hand); font-size: 20px; margin-bottom: 6px; }
.sunny .weather-cat-header { color: #690a24; }
.rainy .weather-cat-header { color: #3d4656; }
.windy .weather-cat-header { color: #395d07; }
.snowy .weather-cat-header { color: #2a4a6a; }

.feeling-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.feeling-chip {
  padding: 4px 10px; font-family: var(--font-game); font-size: 13px;
  cursor: pointer; letter-spacing: 0.5px; border: 2px solid;
  user-select: none; transition: filter 0.1s;
}
.feeling-chip:hover { filter: brightness(0.92); }
.feeling-chip.active { outline: 2px solid var(--text-dark); outline-offset: 1px; }

.sunny .feeling-chip { background: #d289c0; border-color: #966089; color: #690a24; }
.rainy .feeling-chip { background: #c8c8c7; border-color: #90908f; color: #3d4656; }
.windy .feeling-chip { background: #b4e76b; border-color: #90c544; color: #395d07; }
.snowy .feeling-chip { background: #83d2e6; border-color: #5fa3b4; color: #2a4a6a; }

/* BUTTONS */
.action-row { display: flex; gap: 8px; flex-wrap: wrap; }
.rpg-btn {
  background: var(--wall-mid); border: 3px solid var(--panel-border);
  outline: 2px solid var(--panel-border-light); outline-offset: -4px;
  box-shadow: 2px 3px 0 2px rgba(0,0,0,0.4);
  padding: 7px 16px; font-family: var(--font-game); font-size: 15px;
  color: #a8cce8; cursor: pointer; letter-spacing: 1px;
}
.rpg-btn:hover { filter: brightness(1.15); }
.rpg-btn:active { transform: translate(2px,3px); box-shadow: none; }
.rpg-btn.primary { background: var(--aqua); color: #0a1a2e; }

/* READING */
.reading-panel {
  display: none; background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  padding: 14px 16px;
}
.reading-panel.show { display: block; }
.reading-title { font-family: var(--font-hand); font-size: 24px; color: var(--text-dark); margin-bottom: 6px; }
.reading-text { font-family: var(--font-game); font-size: 14px; color: var(--text-mid); line-height: 1.6; }

/* ── GAME ROOM OVERLAY ─────────────────────────────────────────── */
body, .wall { background: #f5f0ea; }


@keyframes gr-intro-wiggle {
  0%   { transform: rotate(0deg) scale(1); }
  18%  { transform: rotate(-11deg) scale(1.06); }
  38%  { transform: rotate(11deg) scale(1.06); }
  58%  { transform: rotate(-6deg) scale(1.02); }
  78%  { transform: rotate(6deg) scale(1.02); }
  100% { transform: rotate(0deg) scale(1); }
}
@keyframes gr-idle-pulse {
  0%,100% { transform: translateY(0)    rotate(-2deg) scale(1); }
  50%      { transform: translateY(-8px) rotate(2deg)  scale(1.03); }
}
/* ── SPIRAL MODE ─────────────────────────────────── */
.mode-toggle { display: flex; gap: 8px; margin-bottom: 10px; }

.rpg-btn.mode-active {
  background: var(--aqua);
  color: var(--text-dark);
  outline-color: var(--panel-border);
}

.spiral-canvas {
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  position: relative; overflow: hidden;
  display: none;
}

.spiral-canvas svg {
  width: 100%; height: auto; display: block;
}

.zone-prompt-box {
  margin-top: 8px;
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  padding: 10px 14px;
  font-family: var(--font-hand);
  font-size: 15px;
  color: var(--text-mid);
  min-height: 44px;
  line-height: 1.5;
  display: none;
}

.zone-prompt-box.show { display: block; }

</style>
</head>
<body>
<div class="room">
  <div class="wall">
    <h1 class="room-title">treasure map</h1>

    <div class="topbar">
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button class="rpg-btn" onclick="clearMap()">&#x25BA; CLEAR</button>
        <button class="rpg-btn primary" onclick="readMap()">&#x2605; READ MAP</button>
        <button class="rpg-btn primary" id="btn-save-today" onclick="saveToday()">&#x2665; SAVE TODAY</button>
      </div>
      <span id="save-status" style="font-family:var(--font-game);font-size:16px;color:#83d2e6;"></span>
    </div>

    <div class="rpg-panel">

      <div class="two-col">

        <!-- SIDE PANEL — name input + terrain + feelings -->
        <div class="side-panel">

          <div>
            <div class="section-header">name your map</div>
            <input class="map-input" id="mapName" type="text" placeholder="the map of..." maxlength="60" oninput="onNameInput()">
          </div>

          <div class="status-bar" id="statusBar">
            tap a terrain piece to select it, then tap the map to place it
          </div>

          <div class="palette-section">
            <div class="section-header">terrain</div>
            <div class="palette-items" id="terrainPalette"></div>
          </div>

          <div>
            <div class="section-header">feelings</div>
            <div class="weather-categories" id="weatherCategories"></div>
          </div>

        </div>

        <!-- MAP AREA -->
        <div class="map-col">
          <div class="section-header">your map</div>

          <!-- Freeform canvas -->
          <div class="map-canvas" id="mapCanvas">
            <div class="map-placeholder" id="mapPlaceholder">
              <div class="map-placeholder-text">your map will appear here</div>
            </div>
          </div>

          <!-- Spiral canvas -->
          <div class="spiral-canvas" id="spiralCanvas">
            <svg id="spiralSvg" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
              <defs id="spiralDefs"></defs>
              <line x1="250" y1="0" x2="250" y2="400" stroke="rgba(138,122,90,0.15)" stroke-width="1"/>
              <line x1="0" y1="200" x2="500" y2="200" stroke="rgba(138,122,90,0.15)" stroke-width="1"/>
              <path id="spiralPath" fill="none" stroke="#b8a88a" stroke-width="1.5" stroke-linecap="round"/>
              <g id="zoneGroup"></g>
            </svg>
            <div class="zone-prompt-box" id="zonePrompt"></div>
          </div>

          <!-- Mode toggle UNDER the map -->
          <div class="mode-toggle" style="margin-top:10px;">
            <button class="rpg-btn mode-active" id="btn-freeform" onclick="setMode('freeform')">◆ FREEFORM</button>
            <button class="rpg-btn" id="btn-spiral" onclick="setMode('spiral')">◉ SPIRAL</button>
          </div>

        </div>

      </div>

      <div class="reading-panel" id="readingPanel">
        <div class="reading-title" id="readingTitle"></div>
        <div class="reading-text" id="readingText"></div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const TERRAIN_IMGS = {
  dunes: "assets/elements/maps/dunes.png",
  forest: "assets/elements/maps/forest.png",
  meadow: "assets/elements/maps/meadow.png",
  mountains: "assets/elements/maps/mountains.png",
  ocean: "assets/elements/maps/ocean.png",
  orchard: "assets/elements/maps/orchard.png",
  plateu: "assets/elements/maps/plateu.png",
  pond: "assets/elements/maps/pond.png",
  river: "assets/elements/maps/river.png",
  spring: "assets/elements/maps/spring.png",
  waterfall: "assets/elements/maps/waterfall.png",
};

const TERRAIN = [
  { id:"mountains", label:"mountains" },
  { id:"forest", label:"forest" },
  { id:"orchard", label:"orchard" },
  { id:"meadow", label:"meadow" },
  { id:"dunes", label:"dunes" },
  { id:"pond", label:"pond" },
  { id:"river", label:"river" },
  { id:"ocean", label:"ocean" },
  { id:"waterfall", label:"waterfall" },
  { id:"spring", label:"spring" },
  { id:"plateu", label:"plateau" },
];

const WEATHER_CATS = [
  { id:"sunny",  label:"sunny",  cls:"sunny",  tint:"rgba(210,137,192,1)",   feelings:["trust","peace","joy","hope","confidence"] },
  { id:"rainy",  label:"rainy",  cls:"rainy",  tint:"rgba(200,200,199,1)",   feelings:["shadows","worry","fear","depression","regret"] },
  { id:"windy",  label:"windy",  cls:"windy",  tint:"rgba(180,231,107,1)",   feelings:["surprise","curiosity","inspiration","excitement","courage"] },
  { id:"snowy",  label:"snowy",  cls:"snowy",  tint:"rgba(131,210,230,1)",   feelings:["anger","avoidance","bitterness","apathy","shock"] },
];

const READINGS = {
  sunny: { title:"a bright season",      text:"The light is favorable right now. Things that felt obscure are becoming clearer. This is a good time to move toward what you want." },
  rainy: { title:"a season of softening", text:"Rain dissolves what was hardened. Something in you is releasing. Let it go." },
  windy: { title:"a season of motion",    text:"Things are moving fast. You may not be able to control the direction but you can choose what to hold close." },
  snowy: { title:"a season of stillness", text:"The cold quiets everything. This is not absence — it is preservation. What are you keeping safe under the surface?" },
};

const ZONE_PROMPTS = [
  "1 — what is the core emotion that gives you the sense you have to 'start over again'?",
  "2 — what does taking the first step feel like?",
  "3 — what does it feel like when you get into a good rhythm and it feels like things are finally changing?",
  "4 — what does it feel like when you slip?",
  "5 — what does it feel like when you are tested?"
];

// ── MODE ─────────────────────────────────────────────────
let currentMode = 'freeform';

function setMode(mode) {
  currentMode = mode;
  const freeEl   = document.getElementById("mapCanvas");
  const spiralEl = document.getElementById("spiralCanvas");
  const btnF     = document.getElementById("btn-freeform");
  const btnS     = document.getElementById("btn-spiral");

  if (mode === 'freeform') {
    freeEl.style.display   = 'block';
    spiralEl.style.display = 'none';
    btnF.classList.add('mode-active');
    btnS.classList.remove('mode-active');
    document.getElementById("mapName").value = state.name || "";
    document.getElementById("readingPanel").classList.remove("show");
    updateStatus();
  } else {
    freeEl.style.display   = 'none';
    spiralEl.style.display = 'block';
    btnS.classList.add('mode-active');
    btnF.classList.remove('mode-active');
    document.getElementById("mapName").value = spiralState.name || "";
    document.getElementById("readingPanel").classList.remove("show");
    updateSpiralStatus();
  }
  // Clear panel selections
  document.querySelectorAll(".palette-item").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".feeling-chip").forEach(c => c.classList.remove("active"));
  state.activeTerrain = null;
  state.activeFeeling = null;
  state.activeCat     = null;
  state.activeTint    = null;
}

function onNameInput() {
  if (currentMode === 'freeform') saveState();
  else spiralSaveState();
}

// ─────────────────────────────────────────────────────────
// FREEFORM STATE
// ─────────────────────────────────────────────────────────
let state = { name:"", items:[], activeTerrain:null, activeFeeling:null, activeCat:null, activeTint:null };

function loadState() {
  try { const s = localStorage.getItem("hb-map"); if(s) state = JSON.parse(s); } catch(e) {}
}
function saveState() {
  state.name = document.getElementById("mapName").value;
  try { localStorage.setItem("hb-map", JSON.stringify(state)); } catch(e) {}
}

function updateStatus() {
  const bar = document.getElementById("statusBar");
  if(state.activeTerrain && state.activeFeeling) {
    bar.innerHTML = `<span class="status-active">placing: ${state.activeTerrain.label}</span> &nbsp; <span class="status-hint">tap map to place · feeling: ${state.activeFeeling} will auto-apply</span>`;
  } else if(state.activeTerrain) {
    bar.innerHTML = `<span class="status-active">placing: ${state.activeTerrain.label}</span> &nbsp; <span class="status-hint">tap the map to place it</span>`;
  } else if(state.activeFeeling) {
    bar.innerHTML = `<span class="status-active">feeling: ${state.activeFeeling}</span> &nbsp; <span class="status-hint">tap a terrain piece on your map to apply it</span>`;
  } else {
    bar.innerHTML = `tap a terrain piece to select it, then tap the map to place it`;
  }
}

// ─────────────────────────────────────────────────────────
// SPIRAL STATE
// ─────────────────────────────────────────────────────────
let spiralState = { name:"", zones:[{},{},{},{},{}] };
let activeZone  = null;
let ZONE_POSITIONS = [];

function spiralLoadState() {
  try {
    const s = localStorage.getItem("hb-spiral");
    if (s) spiralState = JSON.parse(s);
    while (spiralState.zones.length < 5) spiralState.zones.push({});
  } catch(e) {}
}

function spiralSaveState() {
  spiralState.name = document.getElementById("mapName").value;
  try { localStorage.setItem("hb-spiral", JSON.stringify(spiralState)); } catch(e) {}
}

function updateSpiralStatus() {
  const bar = document.getElementById("statusBar");
  const prompt = document.getElementById("zonePrompt");
  if (activeZone === null) {
    bar.innerHTML = 'click a zone on the spiral to begin';
    prompt.textContent = '';
    prompt.classList.remove('show');
  } else {
    bar.innerHTML = `<span class="status-active">zone ${activeZone + 1} selected</span> <span class="status-hint">· choose terrain and feeling below</span>`;
    prompt.textContent = ZONE_PROMPTS[activeZone];
    prompt.classList.add('show');
  }
}

function selectZone(i) {
  activeZone = i;
  renderZoneCircles();
  updateSpiralStatus();
}

// ─────────────────────────────────────────────────────────
// SPIRAL SVG BUILDER
// ─────────────────────────────────────────────────────────
function buildSpiralSVG() {
  const svgEl = document.getElementById('spiralSvg');
  const W = 500, H = 400;
  const cx = W / 2, cy = H / 2 - 10;
  const b = 17;           // px per radian — controls spacing between turns
  const thetaMin = 0.05;
  const thetaMax = 8.6;   // ~1.37 full rotations
  const steps = 500;

  // Generate spiral points (counterclockwise visually — -sin due to SVG y-flip)
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = thetaMin + (thetaMax - thetaMin) * i / steps;
    const r = b * t;
    pts.push([ cx + r * Math.cos(t), cy - r * Math.sin(t) ]);
  }

  // Build SVG path
  const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  document.getElementById('spiralPath').setAttribute('d', d);

  // Cumulative arc lengths
  const arcLens = [0];
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i-1][0];
    const dy = pts[i][1] - pts[i-1][1];
    arcLens.push(arcLens[i-1] + Math.sqrt(dx*dx + dy*dy));
  }
  const total = arcLens[arcLens.length - 1];

  // 5 zone positions at equal arc-length intervals
  ZONE_POSITIONS = [];
  for (let z = 0; z < 5; z++) {
    const target = total * z / 4;
    let idx = 0;
    while (idx < arcLens.length - 1 && arcLens[idx] < target) idx++;
    ZONE_POSITIONS.push({ x: pts[idx][0], y: pts[idx][1] });
  }

  renderZoneCircles();
}

function renderZoneCircles() {
  const zoneGroup = document.getElementById('zoneGroup');
  const defs      = document.getElementById('spiralDefs');
  zoneGroup.innerHTML = '';
  defs.innerHTML = '';

  const R = 36; // zone circle radius

  ZONE_POSITIONS.forEach((pos, i) => {
    const zone     = spiralState.zones[i] || {};
    const isActive = activeZone === i;

    // Tint halo
    if (zone.tint) {
      const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      halo.setAttribute('cx', pos.x); halo.setAttribute('cy', pos.y);
      halo.setAttribute('r', R + 22);
      halo.setAttribute('fill', zone.tint);
      halo.setAttribute('opacity', '0.32');
      halo.style.pointerEvents = 'none';
      zoneGroup.appendChild(halo);
    }

    // Main circle
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', pos.x); circle.setAttribute('cy', pos.y);
    circle.setAttribute('r', R);
    circle.setAttribute('fill', isActive ? 'rgba(101,121,226,0.18)' : 'rgba(200,196,180,0.82)');
    circle.setAttribute('stroke', isActive ? '#6579e2' : '#8a7a5a');
    circle.setAttribute('stroke-width', isActive ? '2.5' : '1.5');
    circle.style.cursor = 'pointer';
    zoneGroup.appendChild(circle);

    // Terrain image clipped to circle
    if (zone.terrain && TERRAIN_IMGS[zone.terrain]) {
      const clipId = `clip-z${i}`;
      const clip = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
      clip.setAttribute('id', clipId);
      const cc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      cc.setAttribute('cx', pos.x); cc.setAttribute('cy', pos.y); cc.setAttribute('r', R - 2);
      clip.appendChild(cc);
      defs.appendChild(clip);

      const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      img.setAttribute('x', pos.x - R); img.setAttribute('y', pos.y - R);
      img.setAttribute('width', R * 2);  img.setAttribute('height', R * 2);
      img.setAttribute('href', TERRAIN_IMGS[zone.terrain]);
      img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      img.setAttribute('clip-path', `url(#${clipId})`);
      img.style.pointerEvents = 'none';
      zoneGroup.appendChild(img);
    }

    // Number
    const numEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    numEl.setAttribute('x', pos.x);
    numEl.setAttribute('y', pos.y + (zone.terrain ? R - 10 : 5));
    numEl.setAttribute('text-anchor', 'middle');
    numEl.setAttribute('dominant-baseline', 'middle');
    numEl.setAttribute('fill', isActive ? '#6579e2' : '#5a4a2a');
    numEl.setAttribute('font-family', '"ZoesHandwriting", cursive');
    numEl.setAttribute('font-size', zone.terrain ? '15' : '26');
    numEl.style.pointerEvents = 'none';
    numEl.textContent = i + 1;
    zoneGroup.appendChild(numEl);

    // Feeling label under circle
    if (zone.feeling) {
      const feelEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      feelEl.setAttribute('x', pos.x);
      feelEl.setAttribute('y', pos.y + R + 13);
      feelEl.setAttribute('text-anchor', 'middle');
      feelEl.setAttribute('fill', '#5a4a2a');
      feelEl.setAttribute('font-family', '"ZoesHandwriting", cursive');
      feelEl.setAttribute('font-size', '11');
      feelEl.style.pointerEvents = 'none';
      feelEl.textContent = zone.feeling;
      zoneGroup.appendChild(feelEl);
    }

    // Transparent click target
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    hit.setAttribute('cx', pos.x); hit.setAttribute('cy', pos.y);
    hit.setAttribute('r', R + 6);
    hit.setAttribute('fill', 'transparent');
    hit.style.cursor = 'pointer';
    hit.addEventListener('click', () => selectZone(i));
    zoneGroup.appendChild(hit);
  });
}

// ─────────────────────────────────────────────────────────
// TERRAIN PALETTE
// ─────────────────────────────────────────────────────────
function buildTerrain() {
  const tp = document.getElementById("terrainPalette");
  TERRAIN.forEach(t => {
    const el = document.createElement("div");
    el.className = "palette-item";
    el.id = "terrain-btn-" + t.id;
    el.innerHTML = `<img src="${TERRAIN_IMGS[t.id]}" alt="${t.label}"><div class="palette-item-name">${t.label}</div>`;
    el.addEventListener("click", () => selectTerrain(t, el));
    tp.appendChild(el);
  });
}

function selectTerrain(t, el) {
  document.querySelectorAll(".palette-item").forEach(p => p.classList.remove("active"));
  el.classList.add("active");

  if (currentMode === 'spiral') {
    if (activeZone !== null) {
      spiralState.zones[activeZone].terrain = t.id;
      spiralSaveState();
      renderZoneCircles();
    }
    return;
  }

  // Freeform mode
  if(state.activeTerrain && state.activeTerrain.id === t.id) {
    state.activeTerrain = null;
    el.classList.remove("active");
    updateStatus(); return;
  }
  state.activeTerrain = t;
  state.activeFeeling = null;
  state.activeCat = null;
  state.activeTint = null;
  document.querySelectorAll(".feeling-chip").forEach(c => c.classList.remove("active"));
  updateStatus();
}

// ─────────────────────────────────────────────────────────
// WEATHER / FEELINGS
// ─────────────────────────────────────────────────────────
function buildWeather() {
  const wc = document.getElementById("weatherCategories");
  WEATHER_CATS.forEach(cat => {
    const section = document.createElement("div");
    section.className = `weather-category ${cat.cls}`;
    const header = document.createElement("div");
    header.className = "weather-cat-header"; header.textContent = cat.label;
    const chips = document.createElement("div");
    chips.className = "feeling-chips";
    cat.feelings.forEach(feeling => {
      const chip = document.createElement("div");
      chip.className = "feeling-chip";
      chip.textContent = feeling;
      chip.addEventListener("click", () => selectFeeling(feeling, cat, chip));
      chips.appendChild(chip);
    });
    section.appendChild(header);
    section.appendChild(chips);
    wc.appendChild(section);
  });
}

function selectFeeling(feeling, cat, el) {
  document.querySelectorAll(".feeling-chip").forEach(c => c.classList.remove("active"));

  if (currentMode === 'spiral') {
    el.classList.add("active");
    if (activeZone !== null) {
      spiralState.zones[activeZone].feeling = feeling;
      spiralState.zones[activeZone].tint    = cat.tint;
      spiralState.zones[activeZone].cat     = cat.id;
      spiralSaveState();
      renderZoneCircles();
    }
    return;
  }

  // Freeform mode — toggle off if same
  if(state.activeFeeling === feeling) {
    state.activeFeeling = null; state.activeCat = null; state.activeTint = null;
    updateStatus(); return;
  }
  el.classList.add("active");
  state.activeTerrain = null;
  document.querySelectorAll(".palette-item").forEach(p => p.classList.remove("active"));
  state.activeFeeling = feeling;
  state.activeCat = cat.id;
  state.activeTint = cat.tint;
  updateStatus();
}

// ─────────────────────────────────────────────────────────
// FREEFORM MAP INTERACTIONS
// ─────────────────────────────────────────────────────────
function applyTint(el, tint) {
  if(!tint) { el.style.background = 'none'; return; }
  el.style.background = `radial-gradient(circle, ${tint} 0%, transparent 70%)`;
}

document.getElementById("mapCanvas").addEventListener("click", function(e) {
  if (currentMode !== 'freeform') return;
  const rect = this.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width)  * 100;
  const y = ((e.clientY - rect.top)  / rect.height) * 100;
  if(!state.activeTerrain) return;
  placeItem(state.activeTerrain.id, state.activeTerrain.label, x, y, state.activeFeeling, state.activeTint);
  saveMapItems();
});

function placeItem(id, label, x, y, feeling, tint) {
  const canvas = document.getElementById("mapCanvas");
  document.getElementById("mapPlaceholder").style.display = "none";
  const el = document.createElement("div");
  el.className = "map-item"; el.dataset.id = id; el.dataset.label = label;
  if(feeling) { el.dataset.feeling = feeling; el.dataset.tint = tint || ""; }
  el.style.left = x + "%"; el.style.top = y + "%";

  const wrap    = document.createElement("div"); wrap.className = "map-item-wrap";
  const img     = document.createElement("img"); img.src = TERRAIN_IMGS[id]; img.className = "map-item-img"; img.alt = label;
  const tintDiv = document.createElement("div"); tintDiv.className = "map-item-tint";
  const delBtn  = document.createElement("div"); delBtn.className = "map-item-delete"; delBtn.textContent = "×";
  const lbl     = document.createElement("div"); lbl.className = "map-item-label";

  if(feeling) {
    el.dataset.feeling = feeling; el.dataset.tint = tint;
    applyTint(tintDiv, tint);
    lbl.innerHTML = `<span class="terrain-name">${label}</span><span class="feeling-name">of ${feeling}</span>`;
  } else {
    lbl.innerHTML = `<span class="terrain-name">${label}</span>`;
  }

  delBtn.addEventListener("click", e => { e.stopPropagation(); el.remove(); saveMapItems(); });
  el.addEventListener("click", e => {
    if(e.target === delBtn) return;
    if(currentMode !== 'freeform') return;
    if(state.activeFeeling) {
      el.dataset.feeling = state.activeFeeling; el.dataset.tint = state.activeTint;
      applyTint(tintDiv, state.activeTint);
      lbl.innerHTML = `<span class="terrain-name">${label}</span><span class="feeling-name">of ${state.activeFeeling}</span>`;
      saveMapItems();
    }
  });

  wrap.appendChild(img); wrap.appendChild(tintDiv); wrap.appendChild(delBtn);
  el.appendChild(wrap); el.appendChild(lbl);
  canvas.appendChild(el);
  saveMapItems();
}

function saveMapItems() {
  const canvas = document.getElementById("mapCanvas");
  state.items = Array.from(canvas.querySelectorAll(".map-item")).map(el => ({
    id: el.dataset.id, label: el.dataset.label,
    feeling: el.dataset.feeling, tint: el.dataset.tint,
    x: parseFloat(el.style.left), y: parseFloat(el.style.top),
  }));
  saveState();
}

function restoreItems() {
  if(state.items && state.items.length > 0) {
    document.getElementById("mapPlaceholder").style.display = "none";
    state.items.forEach(item => placeItem(item.id, item.label, item.x, item.y, item.feeling||null, item.tint||null));
  }
}

// ─────────────────────────────────────────────────────────
// READ MAP
// ─────────────────────────────────────────────────────────
function readMap() {
  const panel   = document.getElementById("readingPanel");
  const mapName = document.getElementById("mapName").value;
  const label   = mapName ? `"${mapName}"` : "your map";
  let catId;

  if (currentMode === 'spiral') {
    const catCounts = {};
    spiralState.zones.forEach(z => {
      if (z.cat) catCounts[z.cat] = (catCounts[z.cat] || 0) + 1;
    });
    catId = Object.keys(catCounts).sort((a,b) => catCounts[b]-catCounts[a])[0];
  } else {
    const cats = {};
    state.items.forEach(item => {
      if(item.feeling) {
        const cat = WEATHER_CATS.find(c => c.feelings.includes(item.feeling));
        if(cat) cats[cat.id] = (cats[cat.id]||0) + 1;
      }
    });
    catId = Object.keys(cats).sort((a,b) => cats[b]-cats[a])[0];
    if(!catId) catId = state.activeCat;
  }

  if(!catId) {
    document.getElementById("readingTitle").textContent = "add a location and feeling first";
    document.getElementById("readingText").textContent  = "Select a feeling and apply it to your terrain pieces. Then come back here.";
  } else {
    const r = READINGS[catId];
    document.getElementById("readingTitle").textContent = `${label}: ${r.title}`;
    document.getElementById("readingText").textContent  = r.text;
  }
  panel.classList.add("show");
  panel.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

// ─────────────────────────────────────────────────────────
// CLEAR
// ─────────────────────────────────────────────────────────
function clearMap() {
  document.getElementById("readingPanel").classList.remove("show");
  document.getElementById("mapName").value = "";
  document.querySelectorAll(".feeling-chip").forEach(c => c.classList.remove("active"));
  document.querySelectorAll(".palette-item").forEach(p => p.classList.remove("active"));

  if (currentMode === 'spiral') {
    spiralState = { name:"", zones:[{},{},{},{},{}] };
    spiralSaveState();
    activeZone = null;
    renderZoneCircles();
    updateSpiralStatus();
    return;
  }

  const canvas = document.getElementById("mapCanvas");
  canvas.querySelectorAll(".map-item").forEach(el => el.remove());
  document.getElementById("mapPlaceholder").style.display = "flex";
  state = { name:"", items:[], activeTerrain:null, activeFeeling:null, activeCat:null, activeTint:null };
  saveState();
  updateStatus();
}

async function loadFromSupabase() {

  // Load most recent spiral save
