<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="../assets/elements/favicon.png">
  <link rel="stylesheet" href="../assets/css/modal.css">
  <script src="../assets/js/modal.js" defer></script>
  <link rel="stylesheet" href="../assets/css/room-slider.css">
  <script src="../assets/js/room-slider.js" defer></script>
  <link rel="stylesheet" href="../assets/css/nav.css">
  <link rel="stylesheet" href="../assets/css/room-nav.css">
  <title>Bedroom — Heartability</title>
  <meta name="description" content="Your Heartability bedroom — visit your dream archive, and manage your account settings.">
  <meta name="robots" content="noindex,follow">
  <meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
  <style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:     "ZoesHandwriting", cursive;
  --font-pixel:    "PFPixelscript", cursive;
  --purple:        #6e83d3;
  --purple-dark:   #4a5bc4;
  --purple-shadow: #3a4aaa;
  --blue-glow:     #83d2e6;
  --mint:          #c9fff5;
  --cream:         #dfe2ef;
  --cream-dark:    #cdd3ec;
  --line-col:      #111;
  --side-col:      #e8e4dc;
  --back-wall:     #6e83d3;
}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: #dfe2ef;
  font-family: var(--font-hand);
  user-select: none;
}

/* ── ROOM BACKGROUND ── */
.room-side-wall-left,
.room-side-wall-right {
  position: absolute;
  inset: 0;
  background: var(--back-wall) url("../assets/elements/patterns/wall-dots.jpg") repeat;
  background-size: 360px 360px;
  z-index: 0;
  pointer-events: none;
}
.room-side-wall-left  { clip-path: polygon(0% 0%, 0% 100%, 50% 30%); }
.room-side-wall-right { clip-path: polygon(100% 0%, 100% 100%, 50% 30%); }

.room-carpet {
  position: absolute;
  inset: 0;
  background: var(--side-col) url("../assets/elements/patterns/tile-speckle.jpg") repeat;
  background-size: 200px 200px;
  clip-path: polygon(0% 100%, 100% 100%, 50% 30%);
  z-index: 1;
  pointer-events: none;
}

.room-bg {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}
.room-bg svg { width: 100%; height: 100%; display: block; }
.room-back-wall {
  position: absolute;
  top: 9%; left: 15%;
  width: 70%; height: 70%;
  background: var(--back-wall) url("../assets/elements/patterns/wall-dots.jpg") repeat;
  background-size: 360px 360px;
  border: 2px solid var(--line-col);
  z-index: 3;
  pointer-events: none;
}

/* ── WALL BOARD — bulletin board of matrix photos, same box as .room-back-wall ── */
.wall-board {
  position: absolute;
  top: 9%; left: 15%;
  width: 70%; height: 70%;
  z-index: 11;
  overflow: hidden;
}
.wall-customize-btn {
  position: absolute; top: 10px; right: 12px; z-index: 6;
  background: none; border: none; padding: 0; cursor: pointer;
  transition: transform 0.1s;
}
.wall-customize-btn img { display: block; width: clamp(30px, 3.4vw, 46px); height: auto; }
.wall-customize-btn:hover  { transform: scale(1.08); }
.wall-customize-btn:active { transform: scale(0.96); }
.wall-board .adv-photo, .wall-board .adv-sticker, .wall-board .mx-note { cursor: grab; touch-action: none; }
.wall-board .adv-photo.dragging, .wall-board .adv-sticker.dragging, .wall-board .mx-note.dragging { cursor: grabbing; z-index: 60; }
.wall-board .adv-photo:hover .adv-resize-handle,
.wall-board .adv-photo:hover .adv-photo-remove,
.wall-board .adv-sticker:hover .adv-resize-handle,
.wall-board .adv-sticker:hover .adv-sticker-remove,
.wall-board .mx-note:hover .adv-resize-handle,
.wall-board .mx-note:hover .mx-note-remove { opacity: 1; }
@media (hover: none) {
  .wall-board .adv-resize-handle,
  .wall-board .adv-photo-remove,
  .wall-board .adv-sticker-remove,
  .wall-board .mx-note-remove { opacity: 1; }
}

/* ── TOP NAV ── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #6e83d3;
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(21px, 1.6vw, 25px);
  color: #fff;
}
.nav-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  pointer-events: none; white-space: nowrap;
  font-family: var(--font-hand); font-size: clamp(22px, 1.6vw, 28px);
  margin: 0; font-weight: normal;
}
.nav-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  color: inherit;
  text-decoration: none;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(0,0,0,0.08); }

/* ── ROOM ICONS — full room-stage ── */
.room-icons {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: none;
  pointer-events: none;
}
.room-icons.active { display: block; }

.room-icon {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 10px;
  border-radius: 4px;
  transition: transform 0.15s;
  transform-origin: bottom center;
  pointer-events: auto;
}
.room-icon:hover { transform: translateY(-5px); }
.room-icon:active { transform: translateY(-2px); }

/* ── PER-ICON POSITION & SIZE — adjust these ── */

/* BED — lower-center/right, sits on floor */
#icon-bed {
  bottom: 8cqh;
  left: 18cqw;
}
#icon-bed img { width: clamp(120px, 45cqw, 650px); }

/* matrix — enter the matrix, upper-right wall */
#icon-matrix {
  bottom:  43cqh;
  right: 2cqw;
}
#icon-matrix img { width: clamp(60px, 9cqw, 130px); }

/* Portrait/vertical viewports are handled by the room slider
   (assets/css/room-slider.css) instead of squeezing this layout. */

.room-icon img {
  height: auto;
}

.room-icon-label {
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.1vw, 15px);
  color: #555;
  text-align: center;
  line-height: 1.3;
  white-space: nowrap;
}

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position: absolute;
  left: calc(100% - 8px);
  bottom: 62%;
  min-width: clamp(140px, 16cqw, 220px);
  max-width: clamp(160px, 20cqw, 260px);
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 12px 18px;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.2cqw, 16px);
  color: #000;
  text-align: center;
  line-height: 1.5;
  z-index: 21;
  opacity: 0;
  transform: scale(0.92) translateY(4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}
.thought-bubble.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

/* ── HEART CHARACTER ── */
@keyframes idle-pulse {
  0%,100% { transform: translateY(0) rotate(-2deg) scale(1); }
  50%      { transform: translateY(-8px) rotate(2deg) scale(1.03); }
}
.char-heart {
  position: absolute;
  right: 18cqw;
  bottom: 18cqh;
  width: clamp(120px, 16cqw, 260px);
  z-index: 20;
  pointer-events: none;
  transition: left 0.7s cubic-bezier(0.4,0,0.2,1), bottom 0.7s cubic-bezier(0.4,0,0.2,1);
}

/* The fixed-width portrait stage is much more square than the fluid desktop
   canvas these cqw/cqh values were tuned for, so the heart guide (anchored
   near the settings icon's much larger artwork) needs to run smaller here to
   avoid overlapping it. */
@media (orientation: portrait) {
  .char-heart { width: clamp(70px, 10cqw, 180px); }
  #icon-bed img { width: clamp(140px, 30cqw, 400px); }
}

.char-heart img {
  display: block;
  width: 100%; height: auto;
  animation: idle-pulse 3.6s ease-in-out 1s infinite;
}

/* ── WALL PHOTO DETAIL MODAL ── */
.wall-detail-body { padding: 0 !important; overflow: hidden; flex: 1; min-height: 0; }
.wall-detail-iframe { width: 100%; height: 100%; border: none; display: block; }

/* ── LOADING ── */
#loading-state {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-pixel);
  font-size: clamp(21px, 2vw, 28px);
  color: var(--blue-glow);
  text-shadow: 0 0 20px rgba(131,210,230,0.6);
  z-index: 50;
}

  </style>
</head>

<div class="room-scroll"><div class="scene room-stage">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-init.js"></script>
<script src="../assets/js/sentry-init.js"></script>
<script src="../assets/js/nav.js" defer></script>
<script src="../assets/js/room-nav.js" defer></script>

<script>
(function () {
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (customizePanel) customizePanel.close(); closeWallDetail(); }
  });

  // ── Wall board — bulletin board of matrix photos/stickers/text ──
  let currentUserId = null;
  let isPaid = false;
  let wallItems = [];

  // ── Wallpaper / floor pattern picker — one shared pool, usable on either surface ──
  const PATTERNS_BASE = '../assets/elements/patterns/';
  const PATTERN_OPTIONS = [
    { key: 'dots',    label: 'dots',    file: PATTERNS_BASE + 'wall-dots.jpg',    swatchSize: '90px 90px', appliedSize: '360px 360px' },
    { key: 'texture', label: 'texture', file: PATTERNS_BASE + 'wall-texture.jpg', swatchSize: '90px 90px', appliedSize: '360px 360px' },
    { key: 'speckle', label: 'speckle', file: PATTERNS_BASE + 'tile-speckle.jpg', swatchSize: '50px 50px', appliedSize: '200px 200px' },
    { key: 'circle',  label: 'circle',  file: PATTERNS_BASE + 'tile-circle.jpg',  swatchSize: '50px 50px', appliedSize: '200px 200px' },
    { key: 'stars',   label: 'stars',   file: PATTERNS_BASE + 'tile-stars.jpg',   swatchSize: '50px 50px', appliedSize: '200px 200px' },
    { key: 'square',  label: 'square',  file: PATTERNS_BASE + 'tile-square.jpg',  swatchSize: '50px 50px', appliedSize: '200px 200px' },
    { key: 'ovals',   label: 'ovals',   file: PATTERNS_BASE + 'tile-ovals.jpg',   swatchSize: '50px 50px', appliedSize: '200px 200px' },
    { key: 'stripes', label: 'stripes', file: PATTERNS_BASE + 'tile-stripes.jpg', swatchSize: '50px 50px', appliedSize: '200px 200px' },
  ];
  let currentWall = 'dots';
  let currentFloor = 'speckle';

  function applyWallPattern(key) {
    const opt = PATTERN_OPTIONS.find(o => o.key === key) || PATTERN_OPTIONS[0];
    currentWall = opt.key;
    [document.querySelector('.room-side-wall-left'), document.querySelector('.room-side-wall-right'), document.querySelector('.room-back-wall')]
      .forEach(el => { el.style.background = `url("${opt.file}") repeat`; el.style.backgroundSize = opt.appliedSize; });
  }
  function applyFloorPattern(key) {
    const opt = PATTERN_OPTIONS.find(o => o.key === key) || PATTERN_OPTIONS.find(o => o.key === 'speckle');
    currentFloor = opt.key;
    const carpet = document.querySelector('.room-carpet');
    carpet.style.background = `url("${opt.file}") repeat`;
    carpet.style.backgroundSize = opt.appliedSize;
  }
  async function onSetWall(key) {
    await sb.from('user-profiles').update({ bedroom_wall_pattern: key }).eq('id', currentUserId);
    applyWallPattern(key);
  }
  async function onSetFloor(key) {
    await sb.from('user-profiles').update({ bedroom_floor_pattern: key }).eq('id', currentUserId);
    applyFloorPattern(key);
  }

  function escAttr(s) { return String(s).replace(/"/g, '&quot;'); }
  function escHtml(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  function buildWallItemEl(item) {
    const el = document.createElement('div');
    el.dataset.id = item.id;
    el.dataset.kind = item.kind;
    el.style.left = item.x + '%';
    el.style.top = item.y + '%';
    el.style.transform = `translate(-50%,-50%) rotate(${item.rot || 0}deg) scale(${item.scale})`;

    const resizeHandle = `<button class="adv-resize-handle" type="button" title="resize" aria-label="resize"></button>`;

    if (item.kind === 'sticker') {
      el.className = 'adv-sticker';
      const removeBtn = `<button class="adv-sticker-remove" type="button" title="remove sticker" aria-label="remove sticker">✕</button>`;
      el.innerHTML = `<img src="${escAttr(item.sticker_url)}" alt="" onerror="this.parentElement.style.display='none'">${resizeHandle}${removeBtn}`;
      return el;
    }

    if (item.kind === 'text') {
      const removeBtn = `<button class="mx-note-remove" type="button" title="remove text" aria-label="remove text">✕</button>`;
      if (item.stationery && MatrixRender.STATIONERY_FILE[item.stationery]) {
        el.className = 'mx-note stationery';
        const box = MatrixRender.STATIONERY_BOX[item.stationery];
        el.innerHTML = `<img class="mx-note-stationery-img" src="${MatrixRender.STATIONERY_BASE}${MatrixRender.STATIONERY_FILE[item.stationery]}" alt="">
            <div class="mx-note-stationery-body" style="left:${box.l}%;top:${box.t}%;width:${box.w}%;height:${box.h}%;">${escHtml(item.text_content)}</div>
            ${resizeHandle}${removeBtn}`;
      } else {
        el.className = 'mx-note';
        el.innerHTML = `${escHtml(item.text_content)}${resizeHandle}${removeBtn}`;
      }
      return el;
    }

    // photo
    el.className = 'adv-photo';
    const removeBtn = `<button class="adv-photo-remove" type="button" title="remove photo" aria-label="remove photo">&times;</button>`;
    if (item.frame === MatrixRender.NO_FRAME_KEY) {
      el.innerHTML = `<img class="adv-photo-img-plain" src="${escAttr(item.photo_url)}" alt="" onerror="this.parentElement.style.display='none'">${resizeHandle}${removeBtn}`;
    } else {
      const frameFile = MatrixRender.PHOTO_FRAME_FILE[item.frame] || MatrixRender.PHOTO_FRAME_FILE.polaroid;
      el.innerHTML = `<div class="adv-photo-inner" style="${MatrixRender.photoFrameMaskStyle(item.frame)}">
          <img class="adv-photo-img" src="${escAttr(item.photo_url)}" alt="" style="${MatrixRender.photoMatteStyle(item.frame)}object-position:${item.img_pos_x}% ${item.img_pos_y}%;transform:rotate(${item.img_rot}deg) scale(${item.img_scale});" onerror="this.parentElement.parentElement.style.display='none'">
          <img class="adv-photo-frame" src="${MatrixRender.PHOTO_FRAME_BASE}${frameFile}" alt="">
        </div>${resizeHandle}${removeBtn}`;
    }
    return el;
  }

  function openArchiveEntry(item) {
    if (item.kind !== 'photo') return;
    let url;
    if (item.source_table === 'dream_matrix' && item.source_id && item.source_map_id) {
      url = `../matrix/archive.html?openEntry=dream:${item.source_id}:${item.source_map_id}`;
    } else if (item.source_table === 'daily_matrix' && item.source_id) {
      url = `../matrix/archive.html?openEntry=daily:${item.source_id}`;
    } else if (item.source_table === 'cosmic_matrix' && item.source_map_phase) {
      url = `../matrix/archive.html?openEntry=cosmic:${item.source_map_phase}`;
    } else {
      return;
    }
    const body = document.getElementById('wall-detail-body');
    body.innerHTML = `<iframe class="wall-detail-iframe" src="${escAttr(url)}"></iframe>`;
    document.getElementById('wall-detail-overlay').classList.add('open');
  }

  function closeWallDetail() {
    document.getElementById('wall-detail-overlay').classList.remove('open');
    document.getElementById('wall-detail-body').innerHTML = '';
  }
  document.getElementById('wall-detail-close').addEventListener('click', closeWallDetail);
  document.getElementById('wall-detail-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('wall-detail-overlay')) closeWallDetail();
  });

  function attachWallInteractions(el, item) {
    let dragging = false, moved = false, startX, startY, startLeftPx, startTopPx, boardRect;
    const rot = item.rot || 0;

    el.addEventListener('pointerdown', e => {
      if (e.target.closest('.adv-resize-handle') || e.target.closest('.adv-photo-remove, .adv-sticker-remove, .mx-note-remove')) return;
      dragging = true; moved = false;
      boardRect = document.getElementById('wall-board').getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      startLeftPx = (item.x / 100) * boardRect.width;
      startTopPx  = (item.y / 100) * boardRect.height;
      el.setPointerCapture(e.pointerId);
      el.classList.add('dragging');
    });
    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      item.x = Math.min(96, Math.max(4, ((startLeftPx + dx) / boardRect.width) * 100));
      item.y = Math.min(96, Math.max(4, ((startTopPx + dy) / boardRect.height) * 100));
      el.style.left = item.x + '%';
      el.style.top = item.y + '%';
    });
    el.addEventListener('pointerup', async e => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if (moved) {
        await sb.from('bed_wall_items').update({ x: item.x, y: item.y }).eq('id', item.id);
      } else {
        openArchiveEntry(item);
      }
    });

    let resizing = false, startDist = 1, startScale = 1;
    const resizeHandle = el.querySelector('.adv-resize-handle');
    resizeHandle.addEventListener('pointerdown', e => {
      e.stopPropagation();
      resizing = true;
      const rect = el.getBoundingClientRect();
      startDist = Math.hypot(e.clientX - (rect.left + rect.width / 2), e.clientY - (rect.top + rect.height / 2)) || 1;
      startScale = item.scale;
      resizeHandle.setPointerCapture(e.pointerId);
    });
    resizeHandle.addEventListener('pointermove', e => {
      if (!resizing) return;
      const rect = el.getBoundingClientRect();
      const dist = Math.hypot(e.clientX - (rect.left + rect.width / 2), e.clientY - (rect.top + rect.height / 2));
      item.scale = Math.min(2.5, Math.max(0.4, startScale * (dist / startDist)));
      el.style.transform = `translate(-50%,-50%) rotate(${rot}deg) scale(${item.scale})`;
    });
    resizeHandle.addEventListener('pointerup', async e => {
      if (!resizing) return;
      resizing = false;
      await sb.from('bed_wall_items').update({ scale: item.scale }).eq('id', item.id);
    });

    const removeBtn = el.querySelector('.adv-photo-remove, .adv-sticker-remove, .mx-note-remove');
    removeBtn.addEventListener('click', async e => {
      e.stopPropagation();
      await sb.from('bed_wall_items').delete().eq('id', item.id);
      wallItems = wallItems.filter(w => w.id !== item.id);
      el.remove();
    });
  }

  function renderWallItems() {
    const wrap = document.getElementById('wall-photos');
    wrap.innerHTML = '';
    wallItems.forEach(item => {
      const el = buildWallItemEl(item);
      wrap.appendChild(el);
      attachWallInteractions(el, item);
    });
  }

  async function loadWallItems() {
    const { data, error } = await sb.from('bed_wall_items')
      .select('*').eq('user_id', currentUserId).order('created_at', { ascending: true });
    if (error) { console.error('[wall board] load failed:', error); return; }
    wallItems = data || [];
    renderWallItems();
  }

  function wallJitter() { return Math.min(85, Math.max(15, 50 + (Math.random() * 30 - 15))); }

  // ── customize modal wiring (assets/js/matrix-customize.js) ──
  async function loadAlbum() {
    const [dreamRes, dailyRes, cosmicRes] = await Promise.all([
      sb.from('dream_matrix').select('id, map_id, matrix_images').eq('user_id', currentUserId),
      sb.from('daily_matrix').select('id, matrix_images').eq('user_id', currentUserId),
      sb.from('cosmic_matrix').select('transit_id, matrix_images').eq('user_id', currentUserId),
    ]);
    const items = [];
    (dreamRes.data || []).forEach(row => (row.matrix_images || []).forEach(img => {
      if (img && img.url) items.push({ img, sourceTable: 'dream_matrix', sourceId: row.id, sourceMapId: row.map_id, sourceMapPhase: null });
    }));
    (dailyRes.data || []).forEach(row => (row.matrix_images || []).forEach(img => {
      if (img && img.url) items.push({ img, sourceTable: 'daily_matrix', sourceId: row.id, sourceMapId: null, sourceMapPhase: null });
    }));
    (cosmicRes.data || []).forEach(row => (row.matrix_images || []).forEach(img => {
      if (img && img.url) items.push({ img, sourceTable: 'cosmic_matrix', sourceId: null, sourceMapId: null, sourceMapPhase: row.transit_id });
    }));
    return items;
  }

  function albumThumb(raw) {
    const img = raw.img;
    return {
      url: img.url, frame: img.frame,
      imgPosX: img.imgPosX != null ? img.imgPosX : 50, imgPosY: img.imgPosY != null ? img.imgPosY : 50,
      label: { dream_matrix: 'dream', daily_matrix: 'daily', cosmic_matrix: 'cosmic' }[raw.sourceTable] || '',
    };
  }

  async function onPickAlbumPhoto(raw) {
    const img = raw.img;
    const row = {
      user_id: currentUserId, kind: 'photo',
      photo_url: img.url,
      frame: img.frame || 'polaroid',
      img_scale: img.imgScale || 1,
      img_pos_x: img.imgPosX != null ? img.imgPosX : 50,
      img_pos_y: img.imgPosY != null ? img.imgPosY : 50,
      img_rot: img.imgRot || 0,
      x: wallJitter(), y: wallJitter(), scale: 1,
      source_table: raw.sourceTable, source_id: raw.sourceId,
      source_map_id: raw.sourceMapId, source_map_phase: raw.sourceMapPhase,
    };
    const { data, error } = await sb.from('bed_wall_items').insert(row).select().single();
    if (error) throw error;
    wallItems.push(data);
    renderWallItems();
  }

  async function onUploadPhoto({ file, frame, imgScale, imgPosX, imgPosY, imgRot }) {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    const path = `${currentUserId}/bedroom/${crypto.randomUUID()}.${ext}`;
    const { error: upErr } = await sb.storage.from('matrix-photos').upload(path, file, { contentType: file.type, upsert: false });
    if (upErr) throw upErr;
    const { data: pub } = sb.storage.from('matrix-photos').getPublicUrl(path);
    const publicUrl = pub && pub.publicUrl;
    if (!publicUrl) throw new Error('could not resolve image url');
    const row = {
      user_id: currentUserId, kind: 'photo',
      photo_url: publicUrl, frame, img_scale: imgScale, img_pos_x: imgPosX, img_pos_y: imgPosY, img_rot: imgRot,
      x: wallJitter(), y: wallJitter(), scale: 1,
    };
    const { data, error } = await sb.from('bed_wall_items').insert(row).select().single();
    if (error) throw error;
    wallItems.push(data);
    renderWallItems();
  }

  async function onAddSticker(url) {
    const row = {
      user_id: currentUserId, kind: 'sticker', sticker_url: url,
      x: wallJitter(), y: wallJitter(), scale: 1, rot: +((Math.random() * 2 - 1) * 15).toFixed(1),
    };
    const { data, error } = await sb.from('bed_wall_items').insert(row).select().single();
    if (error) throw error;
    wallItems.push(data);
    renderWallItems();
  }

  async function onAddText({ text, stationery }) {
    const row = {
      user_id: currentUserId, kind: 'text', text_content: text, stationery: stationery || null,
      x: wallJitter(), y: wallJitter(), scale: 1, rot: +((Math.random() * 2 - 1) * 8).toFixed(1),
    };
    const { data, error } = await sb.from('bed_wall_items').insert(row).select().single();
    if (error) throw error;
    wallItems.push(data);
    renderWallItems();
  }

  // Created lazily (not at module load) — this inline script runs before the
  // deferred matrix-render.js/matrix-customize.js scripts execute, so
  // window.MatrixCustomize isn't defined yet at top level.
  let customizePanel = null;
  function getCustomizePanel() {
    if (!customizePanel) {
      customizePanel = MatrixCustomize.createPanel({
        title: 'customize', addLabel: 'pin to wall', showAlbum: true,
        loadAlbum, albumThumb, onPickAlbumPhoto, onUploadPhoto, onAddSticker, onAddText,
        showWallpaper: true, patternOptions: PATTERN_OPTIONS,
        getCurrentWall: () => currentWall, getCurrentFloor: () => currentFloor,
        onSetWall, onSetFloor,
      });
    }
    return customizePanel;
  }

  window.openCustomizePanel = async function () {
    if (!isPaid) {
      const go = await HGModal.action('become a member', 'become a member to decorate your room.', { label: 'see membership options' });
      if (go) window.location.href = '../users/membership.html';
      return;
    }
    getCustomizePanel().open();
  };

  // ── Auth check ───────────────────────────────────────────
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = '../users/login.html'; return; }
    await loadProfile(session.user);
  }

  async function loadProfile(user) {
    currentUserId = user.id;
    const { data: profile } = await sb
      .from('user-profiles')
      .select('*')
      .eq('id', user.id)
      .single();

    isPaid = HeartabilityMembership.isPaid(profile?.membership_status);
    const username = profile?.username || 'explorer';
    document.getElementById('display-username').textContent = username;

    applyWallPattern(profile?.bedroom_wall_pattern || 'dots');
    applyFloorPattern(profile?.bedroom_floor_pattern || 'speckle');

    HeartabilityNav.init({
      mount: '#gear-slot',
      assetsBase: '../assets',
      authMode: 'protected',
      sb: sb,
      profileHref: '../users/account-settings.html',
      music: { src: 'https://dn720704.ca.archive.org/0/items/HildegardVonBingenCanticlesOfEcstasy/Hildegard%20von%20Bingen%20-%20Canticles%20Of%20Ecstasy.mp3' },
      onSignOut: () => { window.location.href = '../users/login.html'; },
    });
    HeartabilityRoomNav.init({ mount: '#map-slot', currentRoom: 'bed' });

    await loadWallItems();

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').classList.add('active');
  }

  // ── Thought bubble ────────────────────────────────────────
  const bubble = document.getElementById('thought-bubble');
  const bubbleMessages = {
    'icon-bed':     'view the dream archive',
    'icon-matrix': 'enter the matrix',
  };

  document.querySelectorAll('.room-icon').forEach(icon => {
    icon.addEventListener('mouseenter', () => {
      bubble.textContent = bubbleMessages[icon.id] || '';
      bubble.classList.add('visible');
    });
    icon.addEventListener('mouseleave', () => {
      bubble.classList.remove('visible');
    });
  });

  document.addEventListener('DOMContentLoaded', init);
})();
</script>

</body>
</html>
