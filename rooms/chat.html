<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<link rel="stylesheet" href="../assets/css/modal.css">
<link rel="stylesheet" href="../assets/css/detail-view.css">
<link rel="stylesheet" href="../assets/css/room-nav.css">
<script src="../assets/js/modal.js" defer></script>
<script src="../assets/js/room-nav.js" defer></script>
<title>Chat Room — Heartability</title>
<meta name="robots" content="noindex,follow">
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --line-col:   #111;
}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background-image: url('../assets/elements/gradient.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  font-family: var(--font-hand);
  user-select: none;
}

/* ─────────────────────────────────────────────────
   TOP NAV BAR  (matches game-select exactly)
───────────────────────────────────────────────── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #6e83d3;
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(21px, 1.6vw, 25px);
  color: #fff;
}
.nav-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  pointer-events: none; white-space: nowrap;
  font-family: var(--font-hand); font-size: clamp(22px, 1.6vw, 28px);
}
.nav-btn { cursor: pointer; padding: 4px 8px; border-radius: 2px; transition: background 0.15s; color: inherit; text-decoration: none; }
.nav-btn:hover { background: rgba(0,0,0,0.08); }

/* ── Gear dropdown ── */
.gear-wrap { position: relative; }
.gear-btn {
  width: 30px; height: 30px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px; transition: background 0.15s; padding: 3px;
}
.gear-btn:hover { background: rgba(0,0,0,0.08); }
.gear-btn img { width: 22px; height: 22px; display: block; }
.gear-dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; min-width: 170px;
  background: #6e83d3; border: 2px solid var(--line-col);
  box-shadow: 3px 4px 0 rgba(0,0,0,0.12);
  z-index: 201; display: none; flex-direction: column; overflow: hidden;
}
.gear-dropdown.open { display: flex; }
.gear-item {
  font-family: var(--font-hand); font-size: clamp(15px, 1.3vw, 18px); color: #fff;
  padding: 9px 14px; cursor: pointer; border: none; background: none;
  text-align: left; white-space: nowrap; transition: background 0.12s;
}
.gear-item:hover { background: rgba(0,0,0,0.07); }


/* ─────────────────────────────────────────────────
   PAGE LAYOUT
───────────────────────────────────────────────── */
.page-body {
  position: fixed;
  top: 44px;
  left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* ── EMBED MODE (?embed=1) — hides this page's own nav bar when it's
   iframed inside another page's modal, which supplies its own chrome ── */
body.embed-mode .room-nav { display: none; }
body.embed-mode { background: none; }
body.embed-mode .page-body { top: 0; padding: 0; }
body.embed-mode .chat-window { width: 100%; height: 100%; box-shadow: none; }

/* ─────────────────────────────────────────────────
   CHAT WINDOW  (modal-window aesthetic)
───────────────────────────────────────────────── */
.chat-window {
  position: relative;
  width: clamp(320px, 92vw, 980px);
  height: clamp(400px, 84dvh, 700px);
  background: #dfe2ef;
  box-shadow: 0 0 0 4px #6e83d3, 6px 10px 40px rgba(0,0,0,0.35);
  display: flex;
  flex-direction: row;
  overflow: hidden;
}

/* ─── sidebar (buddy list of rooms) ─── */
.chat-sidebar {
  flex-shrink: 0;
  width: 190px;
  background: #cdd3ec;
  border-right: 2px solid #bbb;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.chat-sidebar-header {
  flex-shrink: 0;
  padding: 10px 14px 6px;
  font-family: var(--font-hand);
  font-size: var(--tl-font-small);
  color: #7a83a8;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.chat-room-item {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  cursor: pointer;
  font-family: var(--font-hand);
  font-size: var(--tl-font-card-title);
  color: #333;
  border-left: 3px solid transparent;
  transition: background 0.12s;
}
.chat-room-item:hover { background: rgba(0,0,0,0.05); }
.chat-room-item.active {
  background: #6e83d3;
  color: #fff;
  border-left-color: #4a5bc4;
}
.chat-room-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #5cb85c;
  flex-shrink: 0;
}

.chat-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── title bar ─── */
.chat-titlebar {
  flex-shrink: 0;
  min-height: 42px;
  background: #cdd3ec;
  border-bottom: 2px solid #bbb;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 40px;
  font-family: var(--font-hand);
  color: #333;
  letter-spacing: 0.5px;
  position: relative;
  text-align: center;
}
.ct-title {
  font-size: var(--tl-font-heading);
}

/* ─── online indicator ─── */
.online-count {
  position: absolute;
  right: 14px;
  font-size: var(--tl-font-small);
  color: #888;
  font-family: var(--font-hand);
}
.online-dot {
  display: inline-block;
  width: 7px; height: 7px;
  background: #5cb85c;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}

/* ─── messages area ─── */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

.chat-message {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-width: 80%;
}
.chat-message.mine { align-self: flex-end; align-items: flex-end; }
.chat-message.theirs { align-self: flex-start; align-items: flex-start; }

.chat-bubble {
  padding: 9px 14px;
  font-family: var(--font-hand);
  font-size: var(--tl-font-control);
  line-height: 1.5;
  word-break: break-word;
  user-select: text;
}
.chat-message.mine .chat-bubble {
  background: #6e83d3;
  color: #fff;
  border: 1.5px solid #4a5bc4;
}
.chat-message.theirs .chat-bubble {
  background: #fff;
  color: #222;
  border: 1.5px solid #ccc;
}

.chat-meta {
  font-size: var(--tl-font-small);
  color: #aaa;
  font-family: var(--font-hand);
  padding: 0 4px;
}

.chat-empty {
  text-align: center;
  color: #bbb;
  font-size: var(--tl-font-control);
  padding: 40px 0;
  font-style: italic;
  align-self: center;
  margin: auto;
}

/* ─── date divider ─── */
.chat-date-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 0;
  align-self: stretch;
}
.chat-date-divider span {
  font-size: var(--tl-font-small);
  color: #bbb;
  font-family: var(--font-hand);
  white-space: nowrap;
}
.chat-date-divider::before,
.chat-date-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #ddd;
}

/* ─── input area ─── */
.chat-input-area {
  flex-shrink: 0;
  border-top: 2px solid #ccc;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: #d1d4e1;
}

.chat-as-label {
  font-size: var(--tl-font-small);
  color: #999;
  font-family: var(--font-hand);
}

.chat-msg-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.chat-msg-input {
  flex: 1;
  font-family: var(--font-hand);
  font-size: var(--tl-font-control);
  color: #222;
  background: #dfe2ef;
  border: 1.5px solid #bbb;
  padding: 8px 12px;
  outline: none;
  resize: none;
  height: 60px;
  line-height: 1.5;
}
.chat-msg-input:focus { border-color: #6e83d3; }

.chat-msg-actions {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  height: 60px;
}

.chat-photo-btn {
  flex: 1;
  padding: 0 14px;
  background: #dfe2ef;
  border: 2px solid #4a5bc4;
  box-shadow: 2px 2px 0 #3a4aaa;
  font-family: var(--font-hand);
  font-size: var(--tl-font-btn);
  color: #4a5bc4;
  cursor: pointer;
  line-height: 1;
  transition: all 0.05s;
}
.chat-photo-btn:hover { background: #cdd3ec; }
.chat-photo-btn:active { box-shadow: none; transform: translate(2px,2px); }
.chat-photo-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.chat-send-btn {
  flex: 1;
  padding: 0 18px;
  background: #6e83d3;
  border: 2px solid #4a5bc4;
  box-shadow: 2px 2px 0 #3a4aaa;
  font-family: var(--font-hand);
  font-size: var(--tl-font-btn);
  color: #fff;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.05s;
  white-space: nowrap;
}
.chat-send-btn:hover { background: #4a5bc4; }
.chat-send-btn:active { box-shadow: none; transform: translate(2px,2px); }
.chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.chat-photo-preview {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: #dfe2ef;
  border: 1.5px solid #bbb;
}
.chat-photo-preview.showing { display: flex; }
.chat-photo-preview img {
  width: 44px; height: 44px; object-fit: cover; border: 1.5px solid #bbb;
}
.chat-photo-preview-name {
  flex: 1;
  font-family: var(--font-hand);
  font-size: var(--tl-font-small);
  color: #666;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chat-photo-preview-remove {
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--font-hand);
  font-size: var(--tl-font-small);
  color: #c0392b;
}

.chat-bubble img {
  display: block;
  max-width: 100%;
  max-height: 260px;
  border-radius: 2px;
}

.chat-status {
  font-size: var(--tl-font-small);
  color: #999;
  font-family: var(--font-hand);
  min-height: 13px;
}

/* ─────────────────────────────────────────────────
   MOBILE
───────────────────────────────────────────────── */
@media (max-width: 768px) {
  .room-nav { font-size: clamp(18px, 3.5vw, 21px); }
  .page-body { padding: 12px; }
  .chat-window { width: 94vw; height: calc(88dvh - 44px - 24px); flex-direction: column; }
  .chat-sidebar {
    width: auto;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    border-right: none;
    border-bottom: 2px solid #bbb;
  }
  .chat-sidebar-header { display: none; }
  .chat-room-item { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
  .chat-room-item.active { border-left-color: transparent; border-bottom-color: #4a5bc4; }
}

</style>
</head>
<body>

<!-- TOP NAV BAR -->
<nav class="room-nav">
  <div class="gear-wrap" id="gear-wrap">
    <div class="gear-btn" id="gear-btn" onclick="toggleGear()">
      <img src="../assets/elements/gear icon.png" alt="menu">
    </div>
    <div class="gear-dropdown" id="gear-dropdown">
      <button class="gear-item" onclick="window.location.href='../rooms/bed.html'">view profile</button>
      <button class="gear-item" id="gear-logout">sign out</button>
    </div>
  </div>
  <span class="nav-title">chat room</span>
  <div id="map-slot"></div>
</nav>

<div class="page-body">
  <div class="chat-window">

    <div class="chat-sidebar" id="chat-sidebar">
      <div class="chat-sidebar-header">chatrooms</div>
      <!-- room items injected by JS -->
    </div>

    <div class="chat-main">
      <div class="chat-titlebar">
        <span class="ct-title" id="ct-title"></span>
        <span class="online-count" id="online-count"></span>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="chat-empty" id="chat-empty">you could be the first</div>
      </div>

      <div class="chat-input-area">
        <div class="chat-photo-preview" id="chat-photo-preview">
          <img id="chat-photo-preview-img" src="" alt="">
          <span class="chat-photo-preview-name" id="chat-photo-preview-name"></span>
          <button class="chat-photo-preview-remove" id="chat-photo-remove" type="button">remove</button>
        </div>
        <div class="chat-msg-row">
          <textarea class="chat-msg-input" id="chat-msg"
                    placeholder="where do you go to feel hopeful again?" maxlength="500"></textarea>
          <div class="chat-msg-actions">
            <button class="chat-photo-btn" id="chat-photo-btn" type="button" title="attach a photo">+</button>
            <button class="chat-send-btn" id="chat-send" onclick="sendMessage()">Send</button>
          </div>
          <input type="file" id="chat-photo-input" accept="image/*" hidden>
        </div>
        <div class="chat-status" id="chat-status"></div>
      </div>
    </div>

  </div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPA_URL = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
  const TABLE         = 'chatroom';
  const PHOTO_BUCKET  = 'chat-pics';
  const MAX_PHOTO_MB  = 8;

  const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  const ROOMS = [
    { slug: 'hopeful',   title: 'feeling hopeful', prompt: 'where do you go to feel hopeful again?' },
    { slug: 'outside',   title: 'going outside',   prompt: 'what is your favorite thing to do outside?' },
    { slug: 'relax',     title: 'relaxation',      prompt: 'when do you like to relax?' },
    { slug: 'gratitude', title: 'gratitude',       prompt: 'why did you smile this week?' },
  ];

  let currentUserId    = null;
  let currentUsername  = 'explorer';
  let activeRoom        = ROOMS[0].slug;
  let selectedPhotoFile = null;

  /* ─── Helpers ─── */
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function renderMessage(msg) {
    const isMine = msg.user_id && msg.user_id === currentUserId;
    const el      = document.createElement('div');
    el.className  = 'chat-message ' + (isMine ? 'mine' : 'theirs');
    el.dataset.id = msg.id;
    const bubbleParts = [];
    if (msg.image_url) bubbleParts.push(`<img src="${escapeHtml(msg.image_url)}" alt="shared photo" loading="lazy">`);
    if (msg.message)   bubbleParts.push(`<div>${escapeHtml(msg.message)}</div>`);
    el.innerHTML = `
      <div class="chat-bubble">${bubbleParts.join('')}</div>
      <div class="chat-meta">${escapeHtml(msg.name || 'anonymous')} · ${formatTime(msg.created_at)}</div>
    `;
    return el;
  }

  function scrollToBottom() {
    const container = document.getElementById('chat-messages');
    container.scrollTop = container.scrollHeight;
  }

  /* ─── Sidebar ─── */
  function renderSidebar() {
    const sidebar = document.getElementById('chat-sidebar');
    ROOMS.forEach(room => {
      const item = document.createElement('div');
      item.className = 'chat-room-item' + (room.slug === activeRoom ? ' active' : '');
      item.dataset.slug = room.slug;
      item.innerHTML = `<span class="chat-room-dot"></span><span>${escapeHtml(room.title)}</span>`;
      item.addEventListener('click', () => switchRoom(room.slug));
      sidebar.appendChild(item);
    });
  }

  function switchRoom(slug) {
    if (slug === activeRoom) return;
    activeRoom = slug;
    document.querySelectorAll('.chat-room-item').forEach(el => {
      el.classList.toggle('active', el.dataset.slug === slug);
    });
    updateTitlebar();
    loadMessages();
    document.getElementById('chat-msg').focus();
  }

  function updateTitlebar() {
    const room = ROOMS.find(r => r.slug === activeRoom);
    document.getElementById('ct-title').textContent  = room.title;
    document.getElementById('chat-msg').placeholder  = room.prompt;
  }

  /* ─── Load existing messages for the active room ─── */
  async function loadMessages() {
    const container = document.getElementById('chat-messages');
    const empty     = document.getElementById('chat-empty');

    container.querySelectorAll('.chat-message, .chat-date-divider').forEach(e => e.remove());
    empty.style.display = 'none';

    const { data, error } = await supa
      .from(TABLE)
      .select('*')
      .eq('room', activeRoom)
      .order('created_at', { ascending: true })
      .limit(200);

    if (error) { console.error('Chat load error:', error); return; }

    if (data && data.length > 0) {
      let lastDate = null;
      data.forEach(msg => {
        const msgDate = new Date(msg.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
        if (msgDate !== lastDate) {
          const divider = document.createElement('div');
          divider.className = 'chat-date-divider';
          divider.innerHTML = `<span>${msgDate}</span>`;
          container.appendChild(divider);
          lastDate = msgDate;
        }
        container.appendChild(renderMessage(msg));
      });
      scrollToBottom();
    } else {
      empty.style.display = 'block';
    }
  }

  /* ─── Photo attach ─── */
  function showPhotoPreview(file) {
    const preview = document.getElementById('chat-photo-preview');
    document.getElementById('chat-photo-preview-img').src  = URL.createObjectURL(file);
    document.getElementById('chat-photo-preview-name').textContent = file.name;
    preview.classList.add('showing');
  }

  function clearPhotoPreview() {
    selectedPhotoFile = null;
    document.getElementById('chat-photo-input').value = '';
    document.getElementById('chat-photo-preview').classList.remove('showing');
    document.getElementById('chat-photo-preview-img').src = '';
  }

  document.getElementById('chat-photo-btn').addEventListener('click', () => {
    document.getElementById('chat-photo-input').click();
  });

  document.getElementById('chat-photo-input').addEventListener('change', (e) => {
    const file   = e.target.files[0];
    const statusEl = document.getElementById('chat-status');
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      statusEl.textContent = 'please choose an image file';
      clearPhotoPreview();
      return;
    }
    if (file.size > MAX_PHOTO_MB * 1024 * 1024) {
      statusEl.textContent = `photo must be under ${MAX_PHOTO_MB}MB`;
      clearPhotoPreview();
      return;
    }
    selectedPhotoFile = file;
    showPhotoPreview(file);
  });

  document.getElementById('chat-photo-remove').addEventListener('click', clearPhotoPreview);

  async function uploadChatPhoto(file) {
    const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    const path = `${activeRoom}/${currentUserId}/${crypto.randomUUID()}.${ext}`;
    const { error } = await supa.storage.from(PHOTO_BUCKET).upload(path, file, { contentType: file.type, upsert: false });
    if (error) throw error;
    const { data: pub } = supa.storage.from(PHOTO_BUCKET).getPublicUrl(path);
    if (!pub || !pub.publicUrl) throw new Error('could not resolve photo url');
    return pub.publicUrl;
  }

  /* ─── Send message ─── */
  window.sendMessage = async function () {
    const msgEl    = document.getElementById('chat-msg');
    const statusEl = document.getElementById('chat-status');
    const sendBtn  = document.getElementById('chat-send');
    const photoBtn = document.getElementById('chat-photo-btn');

    const message = msgEl.value.trim();
    if (!message && !selectedPhotoFile) return;

    sendBtn.disabled  = true;
    photoBtn.disabled = true;

    let imageUrl = null;
    try {
      if (selectedPhotoFile) {
        statusEl.textContent = 'uploading photo…';
        imageUrl = await uploadChatPhoto(selectedPhotoFile);
      }
    } catch (err) {
      console.error('Chat photo upload error:', err);
      statusEl.textContent = 'photo upload failed, try again';
      sendBtn.disabled  = false;
      photoBtn.disabled = false;
      return;
    }

    const { error } = await supa.from(TABLE).insert({
      name:      currentUsername,
      message:   message || null,
      user_id:   currentUserId,
      room:      activeRoom,
      image_url: imageUrl,
    });

    if (error) {
      statusEl.textContent = 'something went wrong, try again';
      sendBtn.disabled  = false;
      photoBtn.disabled = false;
      return;
    }

    msgEl.value       = '';
    statusEl.textContent = 'chatting as ' + currentUsername;
    clearPhotoPreview();
    sendBtn.disabled  = false;
    photoBtn.disabled = false;
    msgEl.focus();
  };

  /* ─── Send on Enter (Shift+Enter for newline) ─── */
  document.getElementById('chat-msg').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  /* ─── Realtime (single channel, filtered client-side to the active room) ─── */
  supa
    .channel('chat-room')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: TABLE }, payload => {
      if (payload.new.room !== activeRoom) return;
      const container = document.getElementById('chat-messages');
      const empty     = document.getElementById('chat-empty');
      empty.style.display = 'none';
      container.appendChild(renderMessage(payload.new));
      scrollToBottom();
    })
    .subscribe();

  /* ─── Nav ─── */
  window.toggleGear = function () {
    document.getElementById('gear-dropdown').classList.toggle('open');
  };
  document.addEventListener('click', e => {
    const wrap = document.getElementById('gear-wrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('gear-dropdown').classList.remove('open');
    }
  });
  document.addEventListener('DOMContentLoaded', () => {
    HeartabilityRoomNav.init({ mount: '#map-slot' });
  });
  document.getElementById('gear-logout').addEventListener('click', async () => {
    await supa.auth.signOut();
    window.location.href = '../users/login.html';
  });

  /* ─── Init ─── */
  async function init() {
    if (new URLSearchParams(location.search).get('embed') === '1') {
      document.body.classList.add('embed-mode');
    }

    const { data: { session } } = await supa.auth.getSession();
    if (!session) {
      window.location.href = '../users/login.html';
      return;
    }
    currentUserId = session.user.id;

    const { data: profile } = await supa
      .from('user-profiles')
      .select('username')
      .eq('id', currentUserId)
      .single();
    currentUsername = (profile && profile.username) || 'explorer';
    document.getElementById('chat-status').textContent = 'chatting as ' + currentUsername;

    renderSidebar();
    updateTitlebar();
    loadMessages();
  }

  init();

})();
</script>

</body>
</html>
