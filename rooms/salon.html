<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<link rel="stylesheet" href="../assets/css/modal.css">
<script src="../assets/js/modal.js" defer></script>
<link rel="stylesheet" href="../assets/css/room-slider.css">
<script src="../assets/js/room-slider.js" defer></script>
<link rel="stylesheet" href="../assets/css/nav.css">
<link rel="stylesheet" href="../assets/css/room-nav.css">
<title>The Salon — Heartability</title>
<meta name="description" content="Drop into the Heartability conversation pit and chat with others.">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --blue:       #6e83d3;
  --aqua:       #83d2e6;
  --line-col:   #111;
  --side-col:   #e8e4dc;
  --room-stage-width: 1300px;
}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: #dfe2ef;
  font-family: var(--font-hand);
  user-select: none;
}

/* ── ROOM BACKGROUND (bed.html pattern) ── */
/* Pre-warped trapezoid art: tall/full-height at the outer room corner (image's
   own left/right edge), short at the inner seam with the back wall (image's
   other edge). At the seam edge the art's own trim/floor lines sit at 28.5%/
   74.2% of image height, not the 45.75%/79% the back wall shows at its own
   left edge — so the image is scaled+shifted (not just stretched 1:1) to pull
   those two points onto the back wall's actual trim/bottom. That leaves slivers
   uncovered above and below the art (outer corner only); a two-tone backing
   fill (light upper-wall blue / dark baseboard blue) covers both. The
   clip-path removes the wedge above the roofline (the same (0,0)→(15%,9%)
   line the .room-bg diagonals already draw), so the wallpaper doesn't poke
   up past the ceiling — matching how the back wall's own gap is just bare
   background there. */
.room-side-wall-left {
  position: absolute; top: 0; left: 0; width: 15%; height: 100%;
  background-image: url("../assets/elements/wall-wainscoting-l.png"),
    linear-gradient(to bottom, rgb(186, 201, 255) 0% 50%, rgb(94, 128, 254) 50% 100%);
  background-repeat: no-repeat, no-repeat;
  background-position: 0 25.01cqh, 0 0;
  background-size: 100% 72.76%, 100% 100%;
  clip-path: polygon(0% 0%, 100% 9%, 100% 100%, 0% 100%);
  z-index: 0; pointer-events: none;
}
.room-side-wall-right {
  position: absolute; top: 0; right: 0; width: 15%; height: 100%;
  background-image: url("../assets/elements/wall-wainscoting-r.png"),
    linear-gradient(to bottom, rgb(186, 201, 255) 0% 50%, rgb(94, 128, 254) 50% 100%);
  background-repeat: no-repeat, no-repeat;
  background-position: 0 25.01cqh, 0 0;
  background-size: 100% 72.76%, 100% 100%;
  clip-path: polygon(0% 9%, 100% 0%, 100% 100%, 0% 100%);
  z-index: 0; pointer-events: none;
}

.room-carpet {
  position: absolute; inset: 0;
  background: var(--side-col) url("../assets/elements/tile-circle.jpg") repeat;
  background-size: 200px 200px;
  /* Top edge matches the wainscoting art's floor line, which lands exactly
     on the back wall's own bottom edge: 9% + 70% = 79%. */
  clip-path: polygon(0% 100%, 100% 100%, 85% 79%, 15% 79%);
  z-index: 1; pointer-events: none;
}

.room-bg { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.room-bg svg { width: 100%; height: 100%; display: block; }
.room-back-wall {
  position: absolute; top: 9%; left: 15%; width: 70%; height: 70%;
  background: #f0ece4 url("../assets/elements/wall-wainscoting.jpg") repeat-x;
  background-size: auto 100%;
  border: 2px solid var(--line-col);
  z-index: 3; pointer-events: none;
}

/* ── TOP NAV ── */
.room-nav {
  position: fixed; top: 0; left: 0; right: 0; height: 44px;
  background: #6e83d3; border-bottom: 2px solid var(--line-col);
  z-index: 200; display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand); font-size: clamp(21px, 1.6vw, 25px); color: #fff;
}
.nav-title { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; white-space: nowrap; margin: 0; font: inherit; }
.nav-btn { cursor: pointer; padding: 4px 8px; border-radius: 2px; color: inherit; text-decoration: none; transition: background 0.15s; }
.nav-btn:hover { background: rgba(0,0,0,0.08); }

/* ── ROOM ICONS ── */
.room-icon {
  position: absolute;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer; padding: 10px; border-radius: 4px;
  transition: transform 0.15s; transform-origin: bottom center;
  z-index: 10;
}
.room-icon:hover { transform: translateY(-5px); }
.room-icon:active { transform: translateY(-2px); }

#icon-couch  { left: 50%; bottom: 0cqh; width: clamp(440px, 70cqw, 1200px); transform: translateX(-50%); }
.room-icon img { width: 100%; height: auto; display: block; }

.room-icon-label { font-family: var(--font-hand); font-size: clamp(14px, 1.6vw, 19px); color: #444; text-align: center; }

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position: absolute;
  left: calc(100% - 8px);
  bottom: 62%;
  min-width: clamp(140px, 16cqw, 220px);
  max-width: clamp(160px, 20cqw, 260px);
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 12px 18px;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.2cqw, 16px);
  color: #000;
  text-align: center;
  line-height: 1.5;
  z-index: 21;
  opacity: 0;
  transform: scale(0.92) translateY(4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}
.thought-bubble.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

/* ── HEART CHARACTER ── */
@keyframes idle-pulse {
  0%,100% { transform: translateY(0) rotate(-2deg) scale(1); }
  50%      { transform: translateY(-8px) rotate(2deg) scale(1.03); }
}
.char-heart {
  position: absolute;
  left: 10cqw;
  bottom: 6cqh;
  width: clamp(120px, 16cqw, 260px);
  z-index: 20;
  pointer-events: none;
  transition: left 0.7s cubic-bezier(0.4,0,0.2,1), bottom 0.7s cubic-bezier(0.4,0,0.2,1);
}
@media (orientation: portrait) {
  .char-heart { width: clamp(70px, 10cqw, 180px); }
  #icon-couch { width: clamp(250px, 45cqw, 600px); }
}
.char-heart img {
  display: block;
  width: 100%; height: auto;
  animation: idle-pulse 3.6s ease-in-out 1s infinite;
}

/* ── CHAT MODAL ── */
.chat-modal-body { padding: 0 !important; overflow: hidden; flex: 1; min-height: 0; }
.chat-modal-iframe { width: 100%; height: 100%; border: none; display: block; }

</style>
</head>
<body>

<!-- TOP NAV -->
<nav class="room-nav">
  <div id="gear-slot"></div>
  <h1 class="nav-title">salon</h1>
  <div id="map-slot"></div>
</nav>

<div class="room-scroll"><div class="scene room-stage">

  <!-- ROOM BACKGROUND -->
  <div class="room-side-wall-left" aria-hidden="true"></div>
  <div class="room-side-wall-right" aria-hidden="true"></div>
  <div class="room-carpet" aria-hidden="true"></div>
  <div class="room-bg" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0"   y1="0"   x2="50" y2="30" stroke="#111" stroke-width=".18"/>
      <line x1="100" y1="0"   x2="50" y2="30" stroke="#111" stroke-width=".18"/>
      <line x1="0"   y1="100" x2="50" y2="30" stroke="#111" stroke-width=".18"/>
      <line x1="100" y1="100" x2="50" y2="30" stroke="#111" stroke-width=".18"/>
    </svg>
  </div>
  <div class="room-back-wall" aria-hidden="true"></div>

  <!-- ROOM ICONS -->
  <div class="room-icon" id="icon-couch" onclick="openChat()">
    <img src="../assets/elements/couch.png" alt="couch (chat)">
  </div>

  <!-- HEART CHARACTER -->
  <div class="char-heart" id="char-heart">
    <div class="thought-bubble" id="thought-bubble">hello!</div>
    <img src="../assets/elements/guides/heart.png" alt="" />
  </div>

</div></div>

<!-- CHAT MODAL -->
<div class="hg-modal-overlay" id="chat-overlay">
  <div class="hg-modal" style="width:min(94vw,820px); height:min(86vh,700px); display:flex; flex-direction:column;">
    <div class="hg-modal-titlebar">
      <span>the conversation pit</span>
      <span class="hg-modal-close" id="chat-close">&#x2715;</span>
    </div>
    <div class="hg-modal-body chat-modal-body" id="chat-modal-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-init.js"></script>
<script src="../assets/js/sentry-init.js"></script>
<script src="../assets/js/dom-utils.js"></script>
<script src="../assets/js/nav.js" defer></script>
<script src="../assets/js/room-nav.js" defer></script>
<script>
let currentUser = null;

// ── CHAT MODAL ──
function openChat() {
  const body = document.getElementById('chat-modal-body');
  if (!body.querySelector('iframe')) {
    body.innerHTML = `<iframe class="chat-modal-iframe" src="../rooms/chat.html?embed=1"></iframe>`;
  }
  document.getElementById('chat-overlay').classList.add('open');
}
function closeChat() { document.getElementById('chat-overlay').classList.remove('open'); }

document.getElementById('chat-close').addEventListener('click', closeChat);
document.getElementById('chat-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('chat-overlay')) closeChat();
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closeChat();
});

// ── Thought bubble ──
const bubble = document.getElementById('thought-bubble');
const bubbleMessages = {
  'icon-couch': "jump in the conversation pit",
};
document.querySelectorAll('.room-icon').forEach(icon => {
  icon.addEventListener('mouseenter', () => {
    bubble.textContent = bubbleMessages[icon.id] || '';
    bubble.classList.add('visible');
  });
  icon.addEventListener('mouseleave', () => {
    bubble.classList.remove('visible');
  });
});

// ── Gear / login / music (dynamic — logged-out visitors can still browse) ──
async function resolveUsername(user) {
  try {
    const { data: profile } = await sb.from('user-profiles').select('username').eq('id', user.id).single();
    return profile?.username || user.email.split('@')[0];
  } catch (e) { return user.email.split('@')[0]; }
}

document.addEventListener('DOMContentLoaded', () => {
  HeartabilityNav.init({
    mount: '#gear-slot', assetsBase: '../assets', authMode: 'dynamic', sb,
    profileHref: '../users/account-settings.html',
  });
  HeartabilityRoomNav.init({ mount: '#map-slot', currentRoom: 'salon' });

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      currentUser = session.user;
      resolveUsername(session.user).then(username => HeartabilityNav.setAuthState({ loggedIn: true, username }));
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      HeartabilityNav.setAuthState({ loggedIn: false });
    }
  });

  sb.auth.getSession().then(async ({ data: { session } }) => {
    if (session) {
      currentUser = session.user;
      const username = await resolveUsername(session.user);
      HeartabilityNav.setAuthState({ loggedIn: true, username });
    }
  });
});
</script>

</body>
</html>
