<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<link rel="stylesheet" href="../assets/css/modal.css">
<script src="../assets/js/modal.js" defer></script>
<link rel="stylesheet" href="../assets/css/room-slider.css">
<script src="../assets/js/room-slider.js" defer></script>
<link rel="stylesheet" href="../assets/css/nav.css">
<title>The Castle — Heartability</title>
<meta name="description" content="Choose where to visit in the castle.">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview.png">
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand: "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --room-stage-width: 1300px;
}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  user-select: none;
  background: #6e83d3;
}

/* ── TOP NAV BAR  z:200 ── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #6e83d3;
  border-bottom: 2px solid #111;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(21px, 1.6vw, 25px);
  color: #fff;
}
.nav-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  color: inherit;
  text-decoration: none;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(0,0,0,0.08); }
.nav-title { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; white-space: nowrap; margin: 0; font: inherit; }

/* ── Map dropdown ── */
.map-wrap { position: relative; }
.map-btn {
  display: flex; align-items: center; gap: 4px;
  background: none; border: none; font-family: inherit; font-size: inherit; color: inherit;
}
.map-dropdown {
  position: absolute; top: calc(100% + 4px); right: 0; min-width: 170px;
  background: #6e83d3; border: 2px solid #111;
  box-shadow: 3px 4px 0 rgba(0,0,0,0.12);
  z-index: 201; display: none; flex-direction: column; overflow: hidden;
}
.map-dropdown.open { display: flex; }
.map-item {
  display: block;
  font-family: var(--font-hand); font-size: clamp(15px, 1.3vw, 18px); color: #fff;
  padding: 9px 14px; cursor: pointer; border: none; background: none;
  text-align: left; white-space: nowrap; transition: background 0.12s;
  text-decoration: none;
}
.map-item:hover { background: rgba(0,0,0,0.07); }
.map-item.current { color: rgba(255,255,255,0.55); cursor: default; }
.map-item.current:hover { background: none; }

/* ── GARDEN ELEMENTS ── */
.garden-el img {
  display: block;
  width: 100%;
  height: 100%
  height: auto;
}


/* ── HEART GUIDE  z:4 ── */
.char-heart {
  position: absolute;
  left: 30cqw;
  bottom: 4cqh;
  width: clamp(120px, 16cqw, 260px);
  display: flex;
  align-items: flex-start;
  cursor: pointer;
  z-index: 4;
}
.char-heart .char-img {
  display: block;
  width: 100%;
  height: auto;
  animation:
    heart-intro 0.85s ease-out 0.35s 1 backwards,
    heart-idle  4s ease-in-out 1.5s infinite;
}
@keyframes heart-intro {
  0%   { transform: scale(0.7) translateY(-20px); opacity: 0; }
  100% { transform: scale(1) translateY(0);       opacity: 1; }
}
@keyframes heart-idle {
  0%,100% { transform: translateY(0)     rotate(-1deg); }
  50%      { transform: translateY(-10px) rotate(1deg);  }
}
.char-heart.active .char-img {
  animation: heart-bounce 0.6s ease-in-out infinite;
}
@keyframes heart-bounce {
  0%,100% { transform: translateY(0)     rotate(-2deg) scale(1.04); }
  50%      { transform: translateY(-12px) rotate(2deg)  scale(1.08); }
}

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position: absolute;
  left: calc(100% - 10px);
  top: 10px;
  min-width: clamp(160px, 18cqw, 280px);
  max-width: clamp(200px, 21cqw, 300px);
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 14px 24px;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.4cqw, 18px);
  color: #000000;
  text-align: center;
  line-height: 1.4;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
  z-index: 5;
}
.char-heart.active .thought-bubble { opacity: 1; }

/* ── Narrow landscape (small landscape phones) ──
   Portrait/vertical viewports are handled by the room slider
   (assets/css/room-slider.css) instead of squeezing this layout. */
@media (max-width: 768px) and (orientation: landscape) {
  .el-fountain   { left: 25cqw;  bottom: 14cqh; width: 50cqw; }
  .el-phonebooth { left: 2cqw;   bottom: 11cqh; width: 16cqw; }
  .el-leaderboard{ right: 2cqw;  bottom: 11cqh; width: 14cqw; }
  .el-mailbox    { right: 2cqw;  bottom: 11cqh; width: 14cqw; }
  .char-heart    { left: 12cqw;  top: 28cqh;   width: clamp(60px, 18cqw, 100px); }
  .thought-bubble { max-width: clamp(140px, 52cqw, 260px); font-size: clamp(12px, 2.8cqw, 17px); }
  .room-nav { font-size: clamp(18px, 3.5vw, 21px); }
}

</style>
</head>
<body>

<!-- TOP NAV BAR -->
<nav class="room-nav">
  <div id="gear-slot"></div>
  <h1 class="nav-title">Reception</h1>
  <div class="map-wrap" id="map-wrap">
    <button class="nav-btn map-btn" id="map-btn">map ▾</button>
    <div class="map-dropdown" id="map-dropdown">
      <a class="map-item" href="../rooms/bed.html">bedroom</a>
      <a class="map-item" href="../rooms/courtroom.html">courtroom</a>
      <span class="map-item current">reception</span>
      <a class="map-item" href="../rooms/garden.html">garden</a>
      <a class="map-item" href="../rooms/library.html">library</a>
    </div>
  </div>
</nav>

<div class="room-scroll">
<div class="scene room-stage">

  <!-- Grass ground -->
  <div class="garden-el el-sky">
    <img src="../assets/elements/reception-sky.png" alt="">
  </div>


  <!-- Heart guide -->
  <div class="char-heart" id="char-heart">
    <div class="thought-bubble" id="heart-bubble"></div>
    <img class="char-img" src="../assets/elements/guides/heart.png" alt="Heart guide">
  </div>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/nav.js" defer></script>
<script>
(function () {

  const SUPABASE_URL      = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ── Heart guide bubble ── */
  const heart  = document.getElementById('char-heart');
  const bubble = document.getElementById('heart-bubble');

  heart.addEventListener('mouseenter', () => {
    bubble.textContent = 'welcome to the castle';
    heart.classList.add('active');
  });
  heart.addEventListener('mouseleave', () => heart.classList.remove('active'));


  /* ── Map ── */
  document.getElementById('map-btn').addEventListener('click', () => {
    document.getElementById('map-dropdown').classList.toggle('open');
  });
  document.addEventListener('click', e => {
    const mw = document.getElementById('map-wrap');
    if (mw && !mw.contains(e.target)) document.getElementById('map-dropdown').classList.remove('open');
  });

  /* ── Gear / login / music (assets/js/nav.js, loaded deferred) ── */
  async function resolveUsername(user) {
    try {
      const { data: profile } = await sb.from('user-profiles').select('username').eq('id', user.id).single();
      return profile?.username || user.email.split('@')[0];
    } catch (e) { return user.email.split('@')[0]; }
  }

  document.addEventListener('DOMContentLoaded', () => {
    HeartabilityNav.init({
      mount: '#gear-slot',
      assetsBase: '../assets',
      authMode: 'dynamic',
      sb: sb,
      profileHref: '../users/account-settings.html',
      music: { src: 'https://dn720704.ca.archive.org/0/items/HildegardVonBingenCanticlesOfEcstasy/Hildegard%20von%20Bingen%20-%20Canticles%20Of%20Ecstasy.mp3' },
    });

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        resolveUsername(session.user).then(username => {
          HeartabilityNav.setAuthState({ loggedIn: true, username });
        });
      } else if (event === 'SIGNED_OUT') {
        HeartabilityNav.setAuthState({ loggedIn: false });
      }
    });

    sb.auth.getSession().then(async ({ data: { session } }) => {
      if (session) {
        const username = await resolveUsername(session.user);
        HeartabilityNav.setAuthState({ loggedIn: true, username });
      }
    });
  });

})();
</script>

</body>
</html>
