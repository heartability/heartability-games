<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<link rel="stylesheet" href="../assets/css/modal.css">
<script src="../assets/js/modal.js" defer></script>
<title>The Secret Garden — Heartability</title>
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview.png">
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand: "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  user-select: none;
  background: #6578e2;
}

/* ── SCENE ── */
.scene {
  position: relative;
  width: 100vw;
  height: 100dvh;
}

/* ── TOP NAV BAR  z:200 ── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #4970fc;
  border-bottom: 2px solid #111;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(18px, 1.6vw, 22px);
  color: #fff;
}
.nav-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  color: inherit;
  text-decoration: none;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(0,0,0,0.08); }
.nav-title { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; white-space: nowrap; margin: 0; font: inherit; }

/* ── GARDEN ELEMENTS ── */
.garden-el {
  position: fixed;
  pointer-events: none;
}
.garden-el img {
  display: block;
  width: 100%;
  height: auto;
}

.el-grass      { bottom: 0;   left: 0;      width: 100vw; z-index: 2; }
.el-sky        {top: 0;       left: 0       width: 100vw; z-index: 1; }
.el-fountain   { left: 35vw;  bottom: 18vh; width: 30vw;  z-index: 3; }
.el-phonebooth { left: 8vw;   bottom: 11vh; width: 15vw;  z-index: 3; }
.el-mailbox    { right: 8vw; bottom: 11vh; width: 13vw;   z-index: 3; }
.el-cloud-l    { left: 8vw;   top: 16vh;   width: 14vw;  z-index: 2; }
.el-cloud-r    { right: 20vw; top: 12vh;   width: 12vw;  z-index: 2; }

/* ── CLOUD GUIDE  z:4 ── */
.char-cloud {
  position: fixed;
  left: 20vw;
  top: 35vh;
  width: clamp(80px, 14vw, 130px);
  display: flex;
  align-items: flex-start;
  cursor: pointer;
  z-index: 4;
}
.char-cloud .char-img {
  display: block;
  width: 100%;
  height: auto;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.28));
  animation:
    cloud-intro 0.85s ease-out 0.35s 1 backwards,
    cloud-idle  4s ease-in-out 1.5s infinite;
}
@keyframes cloud-intro {
  0%   { transform: scale(0.7) translateY(-20px); opacity: 0; }
  100% { transform: scale(1) translateY(0);       opacity: 1; }
}
@keyframes cloud-idle {
  0%,100% { transform: translateY(0)     rotate(-1deg); }
  50%      { transform: translateY(-10px) rotate(1deg);  }
}
.char-cloud.active .char-img {
  animation: cloud-bounce 0.6s ease-in-out infinite;
}
@keyframes cloud-bounce {
  0%,100% { transform: translateY(0)     rotate(-2deg) scale(1.04); }
  50%      { transform: translateY(-12px) rotate(2deg)  scale(1.08); }
}

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position: absolute;
  left: calc(100% - 10px);
  top: 10px;
  min-width: clamp(160px, 18vw, 280px);
  max-width: clamp(200px, 21vw, 300px);
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 14px 24px;
  font-family: var(--font-hand);
  font-size: clamp(10px, 1.4vw, 16px);
  color: #000000;
  text-align: center;
  line-height: 1.4;
  filter: drop-shadow(1px 3px 5px rgba(0,0,0,.2));
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
  z-index: 5;
}
.char-cloud.active .thought-bubble { opacity: 1; }

/* ── MOBILE ── */
@media (max-width: 768px) {
  .el-fountain   { left: 25vw;  bottom: 14vh; width: 50vw; }
  .el-phonebooth { left: 2vw;   bottom: 11vh; width: 16vw; }
  .el-mailbox    { right: 2vw;  bottom: 11vh; width: 14vw; }
  .el-cloud-l    { left: 2vw;   top: 18vh;   width: 22vw; }
  .el-cloud-r    { right: 8vw;  top: 14vh;   width: 18vw; }
  .char-cloud    { left: 12vw;  top: 28vh;   width: clamp(60px, 18vw, 100px); }
  .thought-bubble { max-width: clamp(140px, 52vw, 260px); font-size: clamp(10px, 2.8vw, 15px); }
  .side-wall { width: 12vw; }
  .room-nav { font-size: clamp(16px, 3.5vw, 18px); }
}

</style>
</head>
<body>

<!-- TOP NAV BAR -->
<nav class="room-nav">
  <a class="nav-btn" id="nav-back" href="../games/game-room.html">← back</a>
  <h1 class="nav-title">secret garden</h1>
  <span class="nav-btn" id="nav-next">next →</span>
</nav>

<div class="scene">

  <!-- Grass ground -->
  <div class="garden-el el-sky">
    <img src="../assets/elements/sky.png" alt="">
  </div>

  <div class="garden-el el-grass">
    <img src="../assets/elements/grass.png" alt="">
  </div>

 

  <!-- Fountain (swap to .gif when ready) -->
  <div class="garden-el el-fountain">
    <img src="../assets/elements/fountain.png" alt="Fountain" id="fountain-img">
  </div>

  <!-- Phone booth -->
  <div class="garden-el el-phonebooth">
    <img src="../assets/elements/phonebooth.png" alt="Dream Hotline">
  </div>

  <!-- Mailbox -->
  <div class="garden-el el-mailbox">
    <img src="../assets/elements/mailbox.png" alt="Love Letters mailbox">
  </div>

  <!-- Decorative heart clouds -->
  <div class="garden-el el-cloud-l">
    <img src="../assets/elements/heart-cloud-L.png" alt="">
  </div>
  <div class="garden-el el-cloud-r">
    <img src="../assets/elements/heart-cloud-R.png" alt="">
  </div>

  <!-- Purple cloud guide -->
  <div class="char-cloud" id="char-cloud">
    <div class="thought-bubble" id="cloud-bubble"></div>
    <img class="char-img" src="../assets/elements/guides/cloud.png" alt="Cloud guide">
  </div>

</div>

<script>
(function () {

  /* ── Cloud guide bubble ── */
  const cloud  = document.getElementById('char-cloud');
  const bubble = document.getElementById('cloud-bubble');

  cloud.addEventListener('mouseenter', () => {
    bubble.textContent = 'welcome to the secret garden';
    cloud.classList.add('active');
  });
  cloud.addEventListener('mouseleave', () => cloud.classList.remove('active'));

  /* ── Navigation ── */
  document.getElementById('nav-back').addEventListener('click', (e) => { if (history.length > 1) { e.preventDefault(); history.back(); } });

  document.getElementById('nav-next').addEventListener('click',   nextRoom);

  /* ── Randomized room queue ─────────────────────────
     Add new room slugs to ROOMS as pages are built.
     Queue is stored in localStorage so all rooms are
     visited before cycling back to game-select.
  ─────────────────────────────────────────────────── */
  const ROOMS       = ['garden']; /* add: 'library', 'gallery', 'chatroom', etc. */
  const STORAGE_KEY = 'hb_room_queue';
  const CURRENT     = 'garden';

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function nextRoom() {
    let queue = [];
    try { queue = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { queue = []; }

    /* Filter out current page just in case */
    queue = queue.filter(r => r !== CURRENT);

    if (queue.length === 0) {
      /* All rooms visited — back to game-select, reset queue */
      localStorage.removeItem(STORAGE_KEY);
      window.location.href = '../games/game-room.html';
      return;
    }

    const next = queue.shift();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(queue));
    window.location.href = next + '.html';
  }

  /* Seed a fresh queue on first visit */
  try {
    const existing = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!existing || existing.length === 0) {
      const fresh = shuffle(ROOMS.filter(r => r !== CURRENT));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    }
  } catch(e) {}

})();
</script>

</body>
</html>
