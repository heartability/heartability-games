<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --blue:       #6e83d3;
  --aqua:       #83d2e6;
  --line-col:   #111;
  --side-col:   #e8e4dc;
  --room-stage-width: 1300px;
}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: #dfe2ef;
  font-family: var(--font-hand);
  user-select: none;
}

/* ── ROOM BACKGROUND (bed.html pattern) ── */
/* Pre-warped trapezoid art: tall/full-height at the outer room corner (image's
   own left/right edge), short at the inner seam with the back wall (image's
   other edge). At the seam edge the art's own trim/floor lines sit at 28.5%/
   74.2% of image height, not the 45.75%/79% the back wall shows at its own
   left edge — so the image is scaled+shifted (not just stretched 1:1) to pull
   those two points onto the back wall's actual trim/bottom. That leaves slivers
   uncovered above and below the art (outer corner only); a two-tone backing
   fill (light upper-wall blue / dark baseboard blue) covers both. The
   clip-path removes the wedge above the roofline (the same (0,0)→(15%,9%)
   line the .room-bg diagonals already draw), so the wallpaper doesn't poke
   up past the ceiling — matching how the back wall's own gap is just bare
   background there. */
.room-side-wall-left {
  position: absolute; top: 0; left: 0; width: 15%; height: 100%;
  background-image: url("../assets/elements/wall-wainscoting-l.png"),
    linear-gradient(to bottom, rgb(186, 201, 255) 0% 50%, rgb(94, 128, 254) 50% 100%);
  background-repeat: no-repeat, no-repeat;
  background-position: 0 25.01cqh, 0 0;
  background-size: 100% 72.76%, 100% 100%;
  clip-path: polygon(0% 0%, 100% 9%, 100% 100%, 0% 100%);
  z-index: 0; pointer-events: none;
}
.room-side-wall-right {
  position: absolute; top: 0; right: 0; width: 15%; height: 100%;
  background-image: url("../assets/elements/wall-wainscoting-r.png"),
    linear-gradient(to bottom, rgb(186, 201, 255) 0% 50%, rgb(94, 128, 254) 50% 100%);
  background-repeat: no-repeat, no-repeat;
  background-position: 0 25.01cqh, 0 0;
  background-size: 100% 72.76%, 100% 100%;
  clip-path: polygon(0% 9%, 100% 0%, 100% 100%, 0% 100%);
  z-index: 0; pointer-events: none;
}

.room-carpet {
  position: absolute; inset: 0;
  background: var(--side-col) url("../assets/elements/tile-circle.jpg") repeat;
  background-size: 200px 200px;
  /* Top edge matches the wainscoting art's (now-corrected) floor line, which
     lands exactly on the back wall's own bottom edge: 9% + 70% = 79%. */
  clip-path: polygon(0% 100%, 100% 100%, 85% 79%, 15% 79%);
  z-index: 1; pointer-events: none;
}

.room-bg { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.room-bg svg { width: 100%; height: 100%; display: block; }
.room-back-wall {
  position: absolute; top: 9%; left: 15%; width: 70%; height: 70%;
  background: #f0ece4 url("../assets/elements/wall-wainscoting.jpg") repeat-x;
  background-size: auto 100%;
  border: 2px solid var(--line-col);
  z-index: 3; pointer-events: none;
}

/* ── TOP NAV ── */
.room-nav {
  position: fixed; top: 0; left: 0; right: 0; height: 44px;
  background: #6e83d3; border-bottom: 2px solid var(--line-col);
  z-index: 200; display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand); font-size: clamp(21px, 1.6vw, 25px); color: #fff;
}
.nav-title { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; white-space: nowrap; margin: 0; font: inherit; }
.nav-btn { cursor: pointer; padding: 4px 8px; border-radius: 2px; color: inherit; text-decoration: none; transition: background 0.15s; }
.nav-btn:hover { background: rgba(0,0,0,0.08); }


/* ── ROOM ICONS ── */
.room-icon {
  position: absolute;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer; padding: 10px; border-radius: 4px;
  transition: transform 0.15s; transform-origin: bottom center;
  z-index: 10;
}
.room-icon:hover { transform: translateY(-5px); }
.room-icon:active { transform: translateY(-2px); }

#icon-bookshelf { bottom: 10cqh; left: 18cqw; width: clamp(90px, 38cqw, 480px) }
#icon-projector { bottom: 10cqh; right: 18cqw; width: clamp(90px, 24cqw, 350px)}
/* Pinned to the back wall's actual top-right corner (.room-back-wall: top 9%,
   right edge at 15%+70%=85%) with a small inset — top-anchored so it holds
   its spot near the ceiling on resize instead of drifting down toward the TV. */
#icon-tools { top: 15cqh; right: 19cqw; width: clamp(250px, 29cqw, 450px); }
.room-icon img { width: 100%; height: auto; display: block; }

.room-icon-label { font-family: var(--font-hand); font-size: clamp(14px, 1.6vw, 19px); color: #444; text-align: center; }

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position: absolute;
  left: calc(100% - 8px);
  bottom: 62%;
  min-width: clamp(140px, 16cqw, 220px);
  max-width: clamp(160px, 20cqw, 260px);
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 12px 18px;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.2cqw, 16px);
  color: #000;
  text-align: center;
  line-height: 1.5;
  z-index: 21;
  opacity: 0;
  transform: scale(0.92) translateY(4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}
.thought-bubble.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

/* ── HEART CHARACTER ── */
@keyframes idle-pulse {
  0%,100% { transform: translateY(0) rotate(-2deg) scale(1); }
  50%      { transform: translateY(-8px) rotate(2deg) scale(1.03); }
}
.char-heart {
  position: absolute;
  left: 10cqw;
  bottom: 6cqh;
  width: clamp(120px, 16cqw, 260px);
  z-index: 20;
  pointer-events: none;
  transition: left 0.7s cubic-bezier(0.4,0,0.2,1), bottom 0.7s cubic-bezier(0.4,0,0.2,1);
}
@media (orientation: portrait) {
  .char-heart { width: clamp(70px, 10cqw, 180px); }
  #icon-bookshelf { width: clamp(140px, 30cqw, 315px); }
  #icon-projector { width: clamp(120px, 24cqw, 290px); }
  #icon-tools { width: clamp(120px, 20cqw, 220px); }
}
.char-heart img {
  display: block;
  width: 100%; height: auto;
  animation: idle-pulse 3.6s ease-in-out 1s infinite;
}

/* ── LIBRARY MODAL ── */
.hg-modal-body.lib-body { overflow-y: auto; flex: 1; padding-left: clamp(24px, 4vw, 64px); padding-right: clamp(24px, 4vw, 64px); }
.lib-tabs { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.lib-add-top { margin-left: auto; font-family: var(--font-hand); font-size: var(--tl-font-nav-link); color: var(--blue); text-decoration: underline; cursor: pointer; white-space: nowrap; }
.lib-tab-btn {
  font-family: var(--font-hand); font-size: var(--tl-font-btn); color: #555; background: #cdd3ec;
  border: 2px solid var(--blue); padding: 7px 16px; cursor: pointer;
}
.lib-tab-btn.active { background: var(--blue); color: #fff; border-color: #3a4aaa; }
.lib-status-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.lib-status-btn { font-family: var(--font-hand); font-size: var(--tl-font-btn); color: #555; background: #cdd3ec; border: 2px solid var(--blue); padding: 5px 12px; cursor: pointer; }
.lib-status-btn.active { background: var(--blue); color: #fff; border-color: #3a4aaa; }
.lib-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.lib-filters select {
  font-family: var(--font-hand); font-size: var(--tl-font-control); padding: 5px 8px;
  border: 2px solid #bbb; background: #fff; color: #333;
}
.lib-loading, .lib-empty { font-family: var(--font-hand); font-size: 16px; color: #888; padding: 20px 0; text-align: center; }
.lib-empty a { color: var(--blue); }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }
.lib-card { cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.lib-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #ddd; border: 2px solid #ccc; }
.lib-card-noimg { width: 100%; aspect-ratio: 2/3; background: #ddd; border: 2px solid #ccc; }
.lib-card-title { font-family: var(--font-hand); font-size: var(--tl-font-card-title); color: #222; line-height: 1.25; }
.lib-card-meta { font-family: var(--font-hand); font-size: var(--tl-font-small); color: #888; }
.lib-detail-title { font-family: var(--font-hand); font-size: var(--tl-font-heading); color: #222; margin: 10px 0 6px; }
.lib-detail-header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 4px; }
.lib-detail-header .lib-detail-title { margin-top: 0; }
.lib-detail-cover { width: 110px; aspect-ratio: 2/3; object-fit: cover; background: #ddd; border: 2px solid #ccc; flex-shrink: 0; }
.lib-detail-cover.lib-card-noimg { display: flex; align-items: center; justify-content: center; padding: 6px; text-align: center; }
.lib-cover-upload-btn { font-family: var(--font-hand); font-size: 12px; color: var(--blue); text-decoration: underline; cursor: pointer; line-height: 1.3; }
.lib-cover-upload-status { display: block; font-family: var(--font-hand); font-size: 10px; color: #888; margin-top: 4px; }
.lib-detail-meta { flex: 1; min-width: 0; }
.lib-detail-fact { font-family: var(--font-hand); font-size: 15px; color: #555; margin-bottom: 2px; }
.lib-author-link { color: var(--blue); text-decoration: underline; cursor: pointer; }
.lib-add-cta { font-family: var(--font-hand); font-size: 15px; color: #555; margin-bottom: 14px; }
.lib-add-cta a { color: var(--blue); }
.lib-comments, .lib-own-entries { display: flex; flex-direction: column; gap: 12px; }
.lib-comment, .lib-own-entry { background: #cdd3ec; border: 2px solid var(--blue); padding: 10px 14px; }
.lib-comment-author { font-family: var(--font-hand); font-size: 15px; color: var(--blue); margin-bottom: 4px; }
.lib-comment-text { font-family: var(--font-hand); font-size: 16px; color: #222; margin-bottom: 6px; }
.lib-comment-zones { font-family: var(--font-hand); font-size: 13px; color: #4a5bc4; margin-bottom: 4px; }
.lib-comment-ratings { font-family: var(--font-hand); font-size: 13px; color: #e8b400; }
.link-btn { background: none; border: none; font-family: var(--font-hand); font-size: var(--tl-font-nav-link); color: var(--blue); text-decoration: underline; cursor: pointer; padding: 0; margin-bottom: 12px; display: inline-block; text-align: left; align-self: flex-start; }

/* ── story-arc editor "save" button (search-and-bookmark panel was removed
   in favor of the quick-save button below) ── */
.lib-save-btn { font-family: var(--font-hand); font-size: var(--tl-font-btn); padding: 6px 14px; background: var(--blue); color: #fff; border: 2px solid var(--blue); cursor: pointer; }
.lib-save-btn:hover { opacity: .85; }
.lib-save-btn:disabled { opacity: .5; cursor: not-allowed; }
.lib-save-actions { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 10px; border-top: 1.5px solid #ddd; }

/* ── quick-save (bookmark a title to read later, straight from its detail page) ── */
.lib-quicksave-btn {
  display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
  background: none; border: none; cursor: pointer; padding: 0;
  font-family: var(--font-hand); font-size: var(--tl-font-control); color: #333;
}
.lib-quicksave-circle {
  width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%;
  border: 2px solid var(--blue); color: var(--blue); background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1;
  transition: all 0.05s;
}
.lib-quicksave-btn:hover .lib-quicksave-circle { background: #e8ecf9; }
.lib-quicksave-btn.saved .lib-quicksave-circle { background: var(--blue); color: #fff; }

@media (max-width: 480px) {
  .lib-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
}

/* ── STORY ARC BOARD (crowd-sourced, votable, always anonymous) ── */
.lib-arc-section { margin-bottom: 16px; }
.lib-arc-section > .section-header { font-family: var(--font-hand); font-size: 20px; color: #222; margin-bottom: 8px; }
.lib-arc-frame { background: #cdd3ec; border: 2px solid var(--blue); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.lib-arc-card { display: flex; flex-direction: column; gap: 6px; }
.lib-arc-preview { max-width: 260px; }
.lib-arc-preview svg { width: 100%; height: auto; display: block; }
.lib-arc-vote-btn { font-family: var(--font-hand); font-size: 15px; background: #dfe2ef; border: 1.5px solid var(--blue); color: var(--blue); cursor: pointer; padding: 1px 8px; }
.lib-arc-vote-btn:hover:not(:disabled) { background: var(--blue); color: #fff; }
.lib-arc-vote-btn.active { background: var(--blue); color: #fff; }
.lib-arc-vote-btn:disabled { opacity: .4; cursor: not-allowed; }
.lib-arc-editor { background: #fff; border: 2px solid var(--blue); padding: 12px; margin-bottom: 4px; }
.lib-arc-editor .two-col-arc { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; align-items: start; }
@media (max-width: 560px) { .lib-arc-editor .two-col-arc { grid-template-columns: 1fr; } }
.lib-arc-editor .three-act-canvas { background: #e8ecf9; border: 2px solid var(--blue); padding: 16px; }
.lib-arc-editor .three-act-canvas svg { width: 100%; height: auto; display: block; }
.lib-arc-editor .status-bar { background: #e8ecf9; border: 2px solid var(--blue); padding: 6px 10px; font-family: var(--font-hand); font-size: 15px; color: #333; min-height: 32px; margin-bottom: 8px; }
.lib-arc-editor .section-header { font-family: var(--font-hand); font-size: 16px; color: #333; margin-bottom: 6px; }
.lib-arc-editor .palette-section { background: #e8ecf9; border: 2px solid var(--blue); padding: 8px 10px; }
.lib-arc-editor .terrain-cat-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.lib-arc-editor .terrain-cat-btn { padding: 3px 9px; background: #fff; border: 1.5px solid var(--blue); font-family: var(--font-hand); font-size: 12px; color: #333; cursor: pointer; user-select: none; }
.lib-arc-editor .terrain-cat-btn.active { background: var(--blue); color: #fff; }
.lib-arc-editor .palette-items { display: flex; flex-wrap: wrap; gap: 6px; }
.lib-arc-editor .palette-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 7px; background: #fff; border: 1.5px solid var(--blue); cursor: pointer; user-select: none; }
.lib-arc-editor .palette-item.active { background: var(--blue); }
.lib-arc-editor .palette-item.active .palette-item-name { color: #fff; }
.lib-arc-editor .palette-item img { width: 46px; height: 38px; object-fit: contain; pointer-events: none; }
.lib-arc-editor .palette-item-name { font-family: var(--font-hand); font-size: 11px; color: #333; pointer-events: none; }
.lib-arc-editor .weather-categories { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
@media (max-width: 560px) { .lib-arc-editor .weather-categories { grid-template-columns: 1fr; } }
.lib-arc-editor .weather-category { padding: 6px 8px; border: 1.5px solid; }
.lib-arc-editor .weather-category.sunny { background: #f2e6a8; border-color: #715f04; }
.lib-arc-editor .weather-category.rainy { background: #c9b3e7; border-color: #260156; }
.lib-arc-editor .weather-category.windy { background: #b6e6cf; border-color: #046957; }
.lib-arc-editor .weather-category.snowy { background: #a0d7e6; border-color: #033f50; }
.lib-arc-editor .weather-cat-header { font-family: var(--font-hand); font-size: 15px; margin-bottom: 4px; }
.lib-arc-editor .weather-cat-desc { font-size: 11px; font-weight: normal; opacity: .7; }
.lib-arc-editor .feeling-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.lib-arc-editor .feeling-chip { padding: 2px 8px; font-family: var(--font-hand); font-size: 12px; cursor: pointer; border: 1.5px solid; user-select: none; }
.lib-arc-editor .feeling-chip.active { outline: 2px solid #222; outline-offset: 1px; }
.lib-arc-editor .sunny .feeling-chip { background: #f8edb8; border-color: #715f04; color: #715f04; }
.lib-arc-editor .rainy .feeling-chip { background: #dcc9f0; border-color: #260156; color: #260156; }
.lib-arc-editor .windy .feeling-chip { background: #cdf0e0; border-color: #046957; color: #046957; }
.lib-arc-editor .snowy .feeling-chip { background: #c3e8f0; border-color: #033f50; color: #033f50; }

/* ── TOOLS MODAL ── */
.hg-modal-body.tl-body { overflow-y: auto; flex: 1; padding-left: clamp(24px, 4vw, 64px); padding-right: clamp(24px, 4vw, 64px); }
.tl-add-top { margin-left: auto; font-family: var(--font-hand); font-size: var(--tl-font-nav-link); color: var(--blue); text-decoration: underline; cursor: pointer; white-space: nowrap; }
.tl-top-row { display: flex; align-items: center; margin-bottom: 14px; }
.tl-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.tl-filters select {
  font-family: var(--font-hand); font-size: var(--tl-font-control); padding: 5px 8px;
  border: 2px solid #bbb; background: #fff; color: #333;
}
.tl-loading, .tl-empty { font-family: var(--font-hand); font-size: 16px; color: #888; padding: 20px 0; text-align: center; }
.tl-empty a { color: var(--blue); }
.tl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.tl-card { cursor: pointer; display: flex; flex-direction: column; gap: 4px; background: #cdd3ec; border: 2px solid var(--blue); padding: 10px 12px; }
.tl-card-type { font-family: var(--font-hand); font-size: 12px; color: var(--blue); text-transform: uppercase; letter-spacing: 0.4px; }
.tl-card-title { font-family: var(--font-hand); font-size: var(--tl-font-card-title); color: #222; line-height: 1.25; }
.tl-card-meta { font-family: var(--font-hand); font-size: var(--tl-font-small); color: #666; }
.tl-card-icon, .tl-card-icon-noimg { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #eef0f9; border: 1.5px solid var(--blue); display: block; }
.tl-card-icon-noimg { display: flex; align-items: center; justify-content: center; font-family: var(--font-hand); font-size: 20px; color: #aab; }
.tl-detail-fact { font-family: var(--font-hand); font-size: 15px; color: #555; margin-bottom: 6px; }

.tl-comment-author { font-family: var(--font-hand); font-size: 15px; color: var(--blue); margin-bottom: 4px; }
.tl-comment-text { font-family: var(--font-hand); font-size: 16px; color: #222; margin-bottom: 6px; }

/* ── tool recommendations (upvote/downvote community links) ── */
.tl-rec-section-label {
  font-family: var(--font-hand); font-size: 12px; color: var(--blue);
  text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 10px;
}
.tl-recs { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.tl-rec { background: #cdd3ec; border: 2px solid var(--blue); padding: 10px 14px; }
.tl-rec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.tl-rec-title { font-family: var(--font-hand); font-size: 17px; color: var(--blue); text-decoration: underline; word-break: break-word; }
.tl-rec-votes { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.tl-rec-score { font-family: var(--font-hand); font-size: 15px; color: #333; min-width: 18px; text-align: center; }
.tl-rec-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tl-add-rec { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.tl-add-rec input[type="text"], .tl-add-rec input[type="url"], .tl-add-rec textarea {
  font-family: var(--font-hand); font-size: var(--tl-font-control); padding: 8px 10px; border: 2px solid #bbb;
}
.tl-add-rec textarea { resize: vertical; min-height: 60px; }
.tl-tagpick-group { border: 1.5px solid #ccc; background: #f7f8fc; padding: 8px 10px; }

.tl-tagpick-chip.sunny.active, .tl-tagpick-chip.rainy.active, .tl-tagpick-chip.windy.active, .tl-tagpick-chip.snowy.active {

.tl-top-recs-panel { border: 2px solid var(--blue); padding: 16px 18px; background: #f4f6fc; }

.tl-top-rec-row a {
  font-family: var(--font-hand); font-size: 15px; color: var(--blue); text-decoration: underline;
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tl-top-rec-score { font-family: var(--font-hand); font-size: 13px; color: #888; flex-shrink: 0; }

@media (max-width: 480px) {
  .tl-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-init.js"></script>
<script src="../assets/js/sentry-init.js"></script>
<script src="../assets/js/dom-utils.js"></script>
<script src="../assets/js/nav.js" defer></script>
<script src="../assets/js/room-nav.js" defer></script>
<script src="../assets/js/three-act-map.js"></script>
<script src="../assets/js/treasure-map.js"></script>
<script>
const MEDIA_COVER_BUCKET = 'media-covers';
let currentUser = null;

const CATEGORY_META = {
  book:   { label: 'textual media',   types: ['book', 'essay', 'other'] },
  visual: { label: 'visual media', types: ['movie', 'tv'] },
};

// terrain -> terrain category, matching games/treasure-map.html's TERRAIN list
const TERRAIN_CATEGORY_MAP = {
  pond: 'water', waterfall: 'water', spring: 'water', river: 'water', ocean: 'water', glacier: 'water',
  marsh: 'barriers', dunes: 'barriers', mountains: 'barriers', cave: 'barriers', cliff: 'barriers', maze: 'barriers',
  plateau: 'landscapes', valley: 'landscapes', meadow: 'landscapes', jungle: 'landscapes', island: 'landscapes', forest: 'landscapes',
};
const TERRAIN_CATEGORIES = [
  { id: 'water', label: 'water' },
  { id: 'barriers', label: 'barriers' },
  { id: 'landscapes', label: 'landscapes' },
];

// feeling -> emotional climate, matching games/treasure-map.html's WEATHER list
const FEELING_CLIMATE_MAP = {
  trust: 'sunny', peace: 'sunny', joy: 'sunny', hope: 'sunny', confidence: 'sunny', truth: 'sunny', stability: 'sunny', acceptance: 'sunny', pressure: 'sunny', challenge: 'sunny', temptation: 'sunny', reclamation: 'sunny', redemption: 'sunny', reunion: 'sunny',
  shadows: 'rainy', worry: 'rainy', fear: 'rainy', depression: 'rainy', regret: 'rainy', confusion: 'rainy', boredom: 'rainy', loneliness: 'rainy', grief: 'rainy', sadness: 'rainy', betrayal: 'rainy', reckoning: 'rainy', surrender: 'rainy',
  surprise: 'windy', curiosity: 'windy', inspiration: 'windy', excitement: 'windy', courage: 'windy', progress: 'windy', chaos: 'windy', disruption: 'windy', departure: 'windy', initiation: 'windy', crossroads: 'windy', unraveling: 'windy', rebirth: 'windy', release: 'windy',
  anger: 'snowy', avoidance: 'snowy', bitterness: 'snowy', apathy: 'snowy', shock: 'snowy', stillness: 'snowy', quiet: 'snowy', melancholy: 'snowy', isolation: 'snowy', abandonment: 'snowy', exile: 'snowy', descent: 'snowy', confrontation: 'snowy',
};
const CLIMATE_CATEGORIES = [
  { id: 'sunny', label: 'sunny' },
  { id: 'rainy', label: 'rainy' },
  { id: 'windy', label: 'windy' },
  { id: 'snowy', label: 'snowy' },
];

let libState = { category: null, tab: 'public', detailMediaId: null, detailSaveId: null, filterTerrain: null, filterFeeling: null, minRating: 0, authorFilter: null, savesFilter: 'all', storyArcs: [], myArc: null, myVotes: {}, arcEditorOpen: false };
const publicCache = {};       // category -> rows from media_submissions_public
const catalogCache = {};      // category -> rows from media_catalog_public (every title, reviewed or not)
let privateAllCache = null;   // all of the current user's own submissions (any category)
let privateSavesCache = null; // all of the current user's own media_saves (any category) — titles saved without a full review
let authorBrowseCache = [];   // media_submissions_public rows for the currently browsed author

async function fetchPublic(category) {
  const { data, error } = await sb.from('media_submissions_public').select('*')
    .in('media_type', CATEGORY_META[category].types)
    .order('created_at', { ascending: false });
  if (error) { console.error('[library] public fetch failed:', error); publicCache[category] = []; return; }
  publicCache[category] = data || [];

  const { data: catalogData, error: catalogError } = await sb.from('media_catalog_public').select('*')
    .in('media_type', CATEGORY_META[category].types);
  if (catalogError) { console.error('[library] catalog fetch failed:', catalogError); catalogCache[category] = []; return; }
  catalogCache[category] = catalogData || [];
}

async function fetchPrivateAll() {
  const { data, error } = await sb.from('media_submissions').select('*, media(*)')
    .eq('submitted_by', currentUser.id).order('created_at', { ascending: false });
  if (error) { console.error('[library] private fetch failed:', error); privateAllCache = []; return; }
  privateAllCache = data || [];
}

async function fetchPrivateSaves() {
  const { data, error } = await sb.from('media_saves').select('*, media(*)')
    .eq('user_id', currentUser.id).order('created_at', { ascending: false });
  if (error) { console.error('[library] private saves fetch failed:', error); privateSavesCache = []; return; }
  privateSavesCache = data || [];
}

function groupByMedia(rows) {
  const map = new Map();
  rows.forEach(r => {
    const id = r.media_id;
    if (!map.has(id)) {
      map.set(id, {
        media_id: id,
        title: r.title || r.media?.title || 'untitled',
        cover_url: r.cover_url || r.media?.cover_url || null,
        media_type: r.media_type || r.media?.media_type,
        submissions: [],
      });
    }
    map.get(id).submissions.push(r);
  });
  return [...map.values()];
}

// Adds catalog entries (titles with zero reviews) as cards alongside the reviewed
// ones from groupByMedia, so unreviewed titles are still visible/openable.
function mergeCatalog(cards, catalogRows) {
  const seen = new Set(cards.map(c => c.media_id));
  catalogRows.forEach(r => {
    if (seen.has(r.media_id)) return;
    seen.add(r.media_id);
    cards.push({ media_id: r.media_id, title: r.title || 'untitled', cover_url: r.cover_url, media_type: r.media_type, submissions: [] });
  });
  return cards;
}

function zonesOf(sub) {
  const z1 = sub.map_data?.zones || [];
  const z2 = sub.story_arc_map_data?.zones || [];
  return [...z1, ...z2];
}
function cardAvgRating(card) {
  const vals = [];
  card.submissions.forEach(s => { if (s.quality_rating) vals.push(s.quality_rating); if (s.experience_rating) vals.push(s.experience_rating); });
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function cardHasTerrain(card, terrainCat) { return card.submissions.some(s => zonesOf(s).some(z => TERRAIN_CATEGORY_MAP[z.terrain] === terrainCat)); }
function cardHasFeeling(card, climateCat) { return card.submissions.some(s => zonesOf(s).some(z => FEELING_CLIMATE_MAP[z.feeling] === climateCat)); }
function computeFacets(cards) {
  const terrainCats = new Set(), climateCats = new Set();
  cards.forEach(c => c.submissions.forEach(s => zonesOf(s).forEach(z => {
    const tc = TERRAIN_CATEGORY_MAP[z.terrain]; if (tc) terrainCats.add(tc);
    const cc = FEELING_CLIMATE_MAP[z.feeling]; if (cc) climateCats.add(cc);
  })));
  return {
    terrains: TERRAIN_CATEGORIES.filter(t => terrainCats.has(t.id)),
    feelings: CLIMATE_CATEGORIES.filter(c => climateCats.has(c.id)),
  };
}
function filteredCards(cards) {
  return cards.filter(c => {
    if (libState.filterTerrain && !cardHasTerrain(c, libState.filterTerrain)) return false;
    if (libState.filterFeeling && !cardHasFeeling(c, libState.filterFeeling)) return false;
    if (libState.minRating > 0) {
      const avg = cardAvgRating(c);
      if (!avg || avg < libState.minRating) return false;
    }
    return true;
  });
}

function summarizeZones(mapData) {
  const zones = mapData?.zones || [];
  const labels = ['beginning', 'middle', 'end'];
  return zones.map((z, i) => `${labels[i]}: ${z.terrain || '—'} / ${z.feeling || '—'}`).join('  ·  ');
}
function ratingsLine(r) {
  const parts = [];
  if (r.quality_rating) parts.push(`quality ★${r.quality_rating}`);
  if (r.experience_rating) parts.push(`experience ★${r.experience_rating}`);
  return parts.join(' · ');
}

function sortByTitle(arr, titleOf) {
  return [...arr].sort((a, b) => (titleOf(a) || '').localeCompare(titleOf(b) || '', undefined, { sensitivity: 'base' }));
}

function cardHtml(c) {
  const avg = cardAvgRating(c);
  return `<div class="lib-card" onclick="openDetail('${c.media_id}')">
    ${c.cover_url ? `<img src="${_escapeHtml(c.cover_url)}" alt="">` : '<div class="lib-card-noimg"></div>'}
    <div class="lib-card-title">${_escapeHtml(c.title)}</div>
    <div class="lib-card-meta">${c.submissions.length ? `${c.submissions.length} ${c.submissions.length === 1 ? 'entry' : 'entries'}${avg ? ` · ★${avg.toFixed(1)}` : ''}` : 'no reviews yet'}</div>
  </div>`;
}

function buildPublicGridHtml() {
  const rows = publicCache[libState.category] || [];
  const cards = sortByTitle(mergeCatalog(groupByMedia(rows), catalogCache[libState.category] || []), c => c.title);
  const facets = computeFacets(cards);
  const shown = filteredCards(cards);
  const filterHtml = `<div class="lib-filters">
    <select onchange="setTerrainFilter(this.value)">
      <option value="">any terrain</option>
      ${facets.terrains.map(t => `<option value="${t.id}" ${libState.filterTerrain === t.id ? 'selected' : ''}>${t.label}</option>`).join('')}
    </select>
    <select onchange="setFeelingFilter(this.value)">
      <option value="">any climate</option>
      ${facets.feelings.map(f => `<option value="${f.id}" ${libState.filterFeeling === f.id ? 'selected' : ''}>${f.label}</option>`).join('')}
    </select>
    <select onchange="setMinRating(this.value)">
      <option value="0" ${libState.minRating == 0 ? 'selected' : ''}>any rating</option>
      <option value="3" ${libState.minRating == 3 ? 'selected' : ''}>3★ +</option>
      <option value="4" ${libState.minRating == 4 ? 'selected' : ''}>4★ +</option>
      <option value="5" ${libState.minRating == 5 ? 'selected' : ''}>5★ only</option>
    </select>
  </div>`;
  if (!cards.length) return filterHtml + `<div class="lib-empty">no public entries yet — be the first to <a href="../matrix/media.html">add one</a>.</div>`;
  if (!shown.length) return filterHtml + `<div class="lib-empty">nothing matches those filters.</div>`;
  return filterHtml + `<div class="lib-grid">${shown.map(cardHtml).join('')}</div>`;
}

function saveCardHtml(s) {
  const badge = s.status === 'done' ? 'done reading' : 'to be read';
  return `<div class="lib-card" onclick="openSaveDetail('${s.id}')">
    ${s.media?.cover_url ? `<img src="${_escapeHtml(s.media.cover_url)}" alt="">` : '<div class="lib-card-noimg"></div>'}
    <div class="lib-card-title">${_escapeHtml(s.media?.title || 'untitled')}</div>
    <div class="lib-card-meta">${badge}</div>
  </div>`;
}

function setSavesFilter(v) { libState.savesFilter = v; render(); }

// Combines full reviews (media_submissions, which imply the title is finished)
// with plain saves (media_saves, tagged to_read/done) into one shelf, filterable
// by reading status. Reviews only ever show up under "done" or "view all".
function buildPrivateGridHtml() {
  if (!currentUser) {
    return `<div class="lib-empty">log in to view your private shelf.<br><br><a href="../users/login.html">log in</a></div>`;
  }
  const types = CATEGORY_META[libState.category].types;
  const reviewRows = (privateAllCache || []).filter(r => types.includes(r.media?.media_type));
  const reviewCards = sortByTitle(groupByMedia(reviewRows), c => c.title);
  const saveRows = sortByTitle((privateSavesCache || []).filter(r => types.includes(r.media?.media_type)), r => r.media?.title);

  if (!reviewCards.length && !saveRows.length) {
    return `<div class="lib-empty">you haven't added anything here yet — <a href="../matrix/media.html">fill out the form</a>.</div>`;
  }

  const statusHtml = `<div class="lib-status-row">
    <button class="lib-status-btn ${libState.savesFilter === 'all' ? 'active' : ''}" onclick="setSavesFilter('all')">view all</button>
    <button class="lib-status-btn ${libState.savesFilter === 'to_read' ? 'active' : ''}" onclick="setSavesFilter('to_read')">to be read</button>
    <button class="lib-status-btn ${libState.savesFilter === 'done' ? 'active' : ''}" onclick="setSavesFilter('done')">done reading</button>
  </div>`;

  const shownReviews = libState.savesFilter === 'to_read' ? [] : reviewCards;
  const shownSaves = libState.savesFilter === 'all' ? saveRows : saveRows.filter(r => r.status === libState.savesFilter);
  const combined = shownReviews.map(cardHtml).join('') + shownSaves.map(saveCardHtml).join('');

  if (!combined) return statusHtml + `<div class="lib-empty">nothing matches that filter.</div>`;
  return statusHtml + `<div class="lib-grid">${combined}</div>`;
}

// `info` is either a media_submissions_public row (public tab) or a joined `media` row
// (private tab, via media_submissions.select('*, media(*)')) — both carry title/cover_url/
// author/media_type, and release_year once that column exists on `media`.
function detailHeaderHtml(info, fallbackTitle, mediaId) {
  const title = info?.title || fallbackTitle || 'untitled';
  const cover = info?.cover_url;
  const mediaType = info?.media_type;
  const isVisual = CATEGORY_META.visual.types.includes(mediaType);
  const authorLabel = isVisual ? 'director' : 'author';
  const uploadPrompt = (!cover && currentUser && mediaId)
    ? `<label class="lib-cover-upload-btn">+ add a cover photo<input type="file" accept="image/*" hidden onchange="uploadDetailCover(event, '${mediaId}')"></label>
       <span class="lib-cover-upload-status" id="lib-cover-upload-status"></span>`
    : '';
  return `<div class="lib-detail-header">
    ${cover ? `<img class="lib-detail-cover" src="${_escapeHtml(cover)}" alt="">` : `<div class="lib-detail-cover lib-card-noimg">${uploadPrompt}</div>`}
    <div class="lib-detail-meta">
      <div class="lib-detail-title">${_escapeHtml(title)}</div>
      ${info?.release_year ? `<div class="lib-detail-fact">released ${_escapeHtml(String(info.release_year))}</div>` : ''}
      ${info?.author ? `<div class="lib-detail-fact">${authorLabel}: <a href="#" class="lib-author-link" data-author="${_escapeHtml(info.author)}" data-type="${_escapeHtml(mediaType || '')}">${_escapeHtml(info.author)}</a></div>` : ''}
    </div>
  </div>`;
}

// Big-poster equivalent of detailHeaderHtml() above, used by the new
// full-page buildDetailHtml() layout (detailHeaderHtml stays as-is for the
// smaller save-a-title detail view).
function detailPosterAndSubtitle(info, mediaId) {
  const cover = info?.cover_url;
  const mediaType = info?.media_type;
  const isVisual = CATEGORY_META.visual.types.includes(mediaType);
  const authorLabel = isVisual ? 'director' : 'author';
  const uploadPrompt = (!cover && currentUser && mediaId)
    ? `<label class="lib-cover-upload-btn">+ add a cover photo<input type="file" accept="image/*" hidden onchange="uploadDetailCover(event, '${mediaId}')"></label>
       <span class="lib-cover-upload-status" id="lib-cover-upload-status"></span>`
    : '';
  const posterHtml = cover
    ? `<img class="detail-poster aspect-cover" src="${_escapeHtml(cover)}" alt="">`
    : `<div class="detail-poster-noimg aspect-cover">${uploadPrompt || '?'}</div>`;
  const subtitleHtml = `<div class="detail-subtitle-row">
    ${info?.author ? `<span class="detail-fact">${authorLabel}: <a href="#" class="lib-author-link" data-author="${_escapeHtml(info.author)}" data-type="${_escapeHtml(mediaType || '')}">${_escapeHtml(info.author)}</a></span>` : ''}
    ${info?.release_year ? `<span class="detail-fact">released ${_escapeHtml(String(info.release_year))}</span>` : ''}
  </div>`;
  const isSaved = !!(mediaId && (privateSavesCache || []).some(r => r.media_id === mediaId));
  const saveHtml = (currentUser && mediaId) ? `<button type="button" class="lib-quicksave-btn ${isSaved ? 'saved' : ''}" onclick="toggleQuickSave('${mediaId}')">
    <span class="lib-quicksave-circle">${isSaved ? '✓' : '+'}</span><span>${isSaved ? 'saved' : 'save'}</span>
  </button>` : '';
  return { posterHtml, subtitleHtml, saveHtml };
}

// Bookmarks/unbookmarks the media being viewed straight from its detail page —
// no search step, since we already know its media_id. Always saves as
// "to_read"; status can still be flipped to "done" from the my-shelf saved-item view.
async function toggleQuickSave(mediaId) {
  if (!currentUser) { window.location.href = '../users/login.html'; return; }
  const existing = (privateSavesCache || []).find(r => r.media_id === mediaId);
  try {
    if (existing) {
      const { error } = await sb.from('media_saves').delete().eq('id', existing.id);
      if (error) throw error;
      privateSavesCache = (privateSavesCache || []).filter(r => r.id !== existing.id);
    } else {
      const { data, error } = await sb.from('media_saves')
        .insert({ user_id: currentUser.id, media_id: mediaId, status: 'to_read' })
        .select('*, media(*)').single();
      if (error) throw error;
      privateSavesCache = [data, ...(privateSavesCache || [])];
    }
    render();
  } catch (e) {
    console.error('[library] quick save toggle failed:', e);
    HGModal.alert('oops', "couldn't update that — try again");
  }
}

function pooledZoneTags(rows) {
  const terrains = new Set(), feelings = new Set();
  rows.forEach(r => zonesOf(r).forEach(z => {
    if (z.terrain) terrains.add(z.terrain);
    if (z.feeling) feelings.add(z.feeling);
  }));
  return { terrains: [...terrains], feelings: [...feelings] };
}
function tagChipsOrEmpty(values) {
  return values.length
    ? `<div class="detail-tag-chips">${values.map(v => `<span class="detail-tag-chip">${_escapeHtml(v)}</span>`).join('')}</div>`
    : `<div class="detail-tag-empty">none yet</div>`;
}
function detailTagsPanelHtml(rows) {
  const { terrains, feelings } = pooledZoneTags(rows);
  return `<div class="detail-tags-panel cols-2">
    <div><div class="detail-tag-col-label">terrains</div>${tagChipsOrEmpty(terrains)}</div>
    <div><div class="detail-tag-col-label">emotions</div>${tagChipsOrEmpty(feelings)}</div>
  </div>`;
}

// Blended average across every row's quality_rating + experience_rating,
// same math as cardAvgRating() above but operating on raw rows directly.
function avgRatingFromRows(rows) {
  const vals = [];
  rows.forEach(r => { if (r.quality_rating) vals.push(r.quality_rating); if (r.experience_rating) vals.push(r.experience_rating); });
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function detailRatingsPanelHtml(rows) {
  const avg = avgRatingFromRows(rows);
  const ratedCount = rows.filter(r => r.quality_rating || r.experience_rating).length;
  return `<div class="detail-ratings-panel">
    <div class="detail-ratings-label">ratings</div>
    <div class="detail-rating-num">${avg ? avg.toFixed(1) : '—'}</div>
    <div class="detail-rating-stars">${avg ? '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg)) : 'no ratings yet'}</div>
    <div class="detail-rating-count">${ratedCount} ${ratedCount === 1 ? 'rating' : 'ratings'}</div>
  </div>`;
}

async function fetchStoryArcs(mediaId) {
  const { data, error } = await sb.from('media_story_arcs_public').select('*').eq('media_id', mediaId).order('score', { ascending: false });
  if (error) { console.error('[library] story arcs fetch failed:', error); libState.storyArcs = []; }
  else libState.storyArcs = data || [];

  if (!currentUser) { libState.myArc = null; libState.myVotes = {}; return; }
  const { data: mine } = await sb.from('media_story_arcs').select('id, map_data').eq('media_id', mediaId).eq('submitted_by', currentUser.id).maybeSingle();
  libState.myArc = mine || null;
  const arcIds = libState.storyArcs.map(a => a.id);
  if (!arcIds.length) { libState.myVotes = {}; return; }
  const { data: votes } = await sb.from('media_story_arc_votes').select('arc_id, vote').eq('voter_id', currentUser.id).in('arc_id', arcIds);
  libState.myVotes = Object.fromEntries((votes || []).map(v => [v.arc_id, v.vote]));
}

async function saveArc(mediaId) {

  const { error } = await sb.from('media_story_arcs').upsert(
    { media_id: mediaId, submitted_by: currentUser.id, map_data: arcEditorInstance.state, updated_at: new Date().toISOString() },

async function voteArc(mediaId, arcId, val) {

// Lets a logged-in visitor add a missing cover photo straight from the detail
// view, for either a public library entry or one of their own. Uses its own
// media-covers storage bucket (kept separate from matrix-photos so the two
// don't grow into one another as both collections scale up) — see the SQL
// in the media-covers bucket setup for the required bucket + RLS policies.
async function uploadDetailCover(event, mediaId) {
  const file = event.target.files?.[0];
  if (!file || !currentUser) return;
  const statusEl = document.getElementById('lib-cover-upload-status');
  if (statusEl) statusEl.textContent = 'uploading…';
  try {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    const path = `${currentUser.id}/${crypto.randomUUID()}.${ext}`;
    const { error: upErr } = await sb.storage.from('media-covers').upload(path, file, { contentType: file.type, upsert: false });
    if (upErr) throw upErr;
    const { data: pub } = sb.storage.from('media-covers').getPublicUrl(path);
    const coverUrl = pub?.publicUrl;
    const { error: updErr } = await sb.from('media').update({ cover_url: coverUrl }).eq('id', mediaId);
    if (updErr) throw updErr;
    (publicCache[libState.category] || []).forEach(r => { if (r.media_id === mediaId) r.cover_url = coverUrl; });
    (privateAllCache || []).forEach(r => { if (r.media_id === mediaId && r.media) r.media.cover_url = coverUrl; });
    (privateSavesCache || []).forEach(r => { if (r.media_id === mediaId && r.media) r.media.cover_url = coverUrl; });
    render();
  } catch (e) {
    console.error('[library] cover upload failed:', e);
    if (statusEl) statusEl.textContent = "couldn't upload — try again";
  }
}

  let { data } = await sb.from('media_submissions_public').select('media_id, media_type').eq('media_id', mediaId).limit(1);

  openDetail(mediaId);
}

let toolsState = { detailToolId: null, filterType: null, filterTerrain: null, minRating: 0 };
let toolsCache = null;      // approved tools (array) or null before first fetch
let toolRecsCache = {};     // toolId -> community recommendations array (from tool_recommendations_public, score desc)
let myRecVotes = {};        // recommendation_id -> current user's vote (1/-1) on the open tool's recommendations
let recDraftTags = { terrains: new Set(), feelings: new Set() }; // scratch state for the add-a-recommendation form
let savedToolIds = new Set(); // tool ids the current user has added to their personal inventory (tool_saves)

async function fetchSavedToolIds() {
  if (!currentUser) { savedToolIds = new Set(); return; }
  const { data, error } = await sb.from('tool_saves').select('tool_id').eq('user_id', currentUser.id);

async function toggleInventorySave(toolId) {
  if (!currentUser) return;
  if (savedToolIds.has(toolId)) {
    const { error } = await sb.from('tool_saves').delete().eq('user_id', currentUser.id).eq('tool_id', toolId);
    if (error) { console.error('[library] remove from inventory failed:', error); return; }

  } else {
    const { error } = await sb.from('tool_saves').insert({ user_id: currentUser.id, tool_id: toolId });
    if (error) { console.error('[library] add to inventory failed:', error); return; }

async function fetchMyRecVotes(toolId) {
  if (!currentUser) { myRecVotes = {}; return; }

async function voteToolRec(toolId, recId, val) {
  if (!currentUser) { window.location.href = '../users/login.html'; return; }
  if (myRecVotes[recId] === val) {
    const { error } = await sb.from('tool_recommendation_votes').delete()
      .eq('recommendation_id', recId).eq('voter_id', currentUser.id);
    if (error) { console.error('[library] retract tool rec vote failed:', error); return; }
  } else {
    const { error } = await sb.from('tool_recommendation_votes').upsert(
      { recommendation_id: recId, voter_id: currentUser.id, vote: val },
      { onConflict: 'recommendation_id,voter_id' }
    );
    if (error) { console.error('[library] tool rec vote failed:', error); return; }
  }
  await fetchToolRecommendations(toolId);
  await fetchMyRecVotes(toolId);
  renderTools();
}

function toolHasTerrain(tool, terrain) { return (tool.landscapes || []).some(z => z.terrain === terrain); }
function computeToolTerrainFacets(tools) {
  const terrains = new Set();
  tools.forEach(t => (t.landscapes || []).forEach(z => { if (z.terrain) terrains.add(z.terrain); }));
  return [...terrains].sort();
}
function filteredTools(tools) {
  return tools.filter(t => {
    if (toolsState.filterType && t.tool_type !== toolsState.filterType) return false;
    if (toolsState.filterTerrain && !toolHasTerrain(t, toolsState.filterTerrain)) return false;
    return true;
  });
}

function toolCardHtml(t) {
  return `<div class="tl-card" onclick="openToolDetail('${t.id}')">
    <div class="tl-card-type">${_escapeHtml(t.tool_type)}</div>
    <div class="tl-card-title">${_escapeHtml(t.title)}</div>
    ${t.icon_url ? `<img class="tl-card-icon" src="${_escapeHtml(t.icon_url)}" alt="">` : '<div class="tl-card-icon-noimg">?</div>'}
    <div class="tl-card-meta">${(t.landscapes || []).length} ${(t.landscapes || []).length === 1 ? 'landscape' : 'landscapes'}</div>
  </div>`;
}

function buildToolsGridHtml() {
  const tools = toolsCache || [];
  const terrains = computeToolTerrainFacets(tools);
  const shown = filteredTools(tools);
  const filterHtml = `<div class="tl-filters">
    <select onchange="setToolTypeFilter(this.value)">
      <option value="">any type</option>
      ${TOOL_TYPES.map(t => `<option value="${t}" ${toolsState.filterType === t ? 'selected' : ''}>${t}</option>`).join('')}
    </select>
    <select onchange="setToolTerrainFilter(this.value)">
      <option value="">any landscape</option>
      ${terrains.map(t => `<option value="${t}" ${toolsState.filterTerrain === t ? 'selected' : ''}>${t}</option>`).join('')}
    </select>
  </div>`;
  if (!tools.length) return filterHtml + `<div class="tl-empty">no tools yet — be the first to <a href="../matrix/tools.html">add one</a>.</div>`;
  if (!shown.length) return filterHtml + `<div class="tl-empty">nothing matches those filters.</div>`;
  return filterHtml + `<div class="tl-grid">${shown.map(toolCardHtml).join('')}</div>`;
}

function toggleRecTag(kind, value) {
  const set = recDraftTags[kind];
  if (set.has(value)) set.delete(value); else set.add(value);
  document.getElementById(`rec-tag-${kind}-${value}`)?.classList.toggle('active', set.has(value));
}

function recTerrainChipsHtml() {
  return (window.TreasureMap?.TERRAIN || []).map(t =>
    `<span class="tl-tagpick-chip" id="rec-tag-terrains-${t.id}" onclick="toggleRecTag('terrains','${t.id}')">${_escapeHtml(t.label)}</span>`
  ).join('');
}
function recFeelingGroupsHtml() {
  return (window.TreasureMap?.WEATHER_CATS || []).map(cat => `
    <div class="tl-tagpick-weather-block">
      <div class="tl-tagpick-weather-title">${_escapeHtml(cat.label)} — ${_escapeHtml(cat.desc)}</div>
      <div class="tl-tagpick-chips" style="max-height:none;">
        ${cat.feelings.map(f => `<span class="tl-tagpick-chip ${cat.id}" id="rec-tag-feelings-${f}" onclick="toggleRecTag('feelings','${f}')">${_escapeHtml(f)}</span>`).join('')}
      </div>
    </div>`).join('');
}

function buildAddRecFormHtml(toolId) {
  return `<div class="tl-add-rec">
    <div class="tl-detail-fact" style="margin-bottom:0;">share a recommendation</div>
    <input type="text" id="new-rec-title" maxlength="120" placeholder="title (e.g. a video, article, or product name)">
    <input type="url" id="new-rec-link" maxlength="500" placeholder="link (https://...)">
    <textarea id="new-rec-desc" maxlength="500" placeholder="why do you recommend it?"></textarea>
    <div class="tl-tagpick-group">
      <div class="tl-tagpick-label">mental landscapes</div>
      <div class="tl-tagpick-chips">${recTerrainChipsHtml()}</div>
    </div>
    <div class="tl-tagpick-group">
      <div class="tl-tagpick-label">emotional climates</div>
      <div class="tl-tagpick-feelings-scroll">${recFeelingGroupsHtml()}</div>
    </div>
    <button type="button" class="tl-save-btn" onclick="submitToolRecommendation('${toolId}')">post recommendation</button>
  </div>`;
}

function recTagChipsHtml(rec) {
  const chips = [...(rec.terrains || []), ...(rec.feelings || [])].map(v => `<span class="detail-tag-chip">${_escapeHtml(v)}</span>`).join('');
  return chips ? `<div class="tl-rec-tags">${chips}</div>` : '';
}

function toolRecCardHtml(toolId, rec) {
  const myVote = myRecVotes[rec.id];
  return `<div class="tl-rec">
    <div class="tl-rec-head">
      <a class="tl-rec-title" href="${_escapeHtml(rec.link_url)}" target="_blank" rel="noopener noreferrer">${_escapeHtml(rec.title)}</a>
      <div class="tl-rec-votes">
        <button type="button" class="lib-arc-vote-btn ${myVote === 1 ? 'active' : ''}" onclick="voteToolRec('${toolId}','${rec.id}',1)" ${currentUser ? '' : 'disabled'}>▲</button>
        <span class="tl-rec-score">${rec.score ?? 0}</span>
        <button type="button" class="lib-arc-vote-btn ${myVote === -1 ? 'active' : ''}" onclick="voteToolRec('${toolId}','${rec.id}',-1)" ${currentUser ? '' : 'disabled'}>▼</button>
      </div>
    </div>
    <div class="tl-comment-author">${rec.username ? _escapeHtml(rec.username) : 'anonymous'}</div>
    <div class="tl-comment-text">${_escapeHtml(rec.description)}</div>
    ${recTagChipsHtml(rec)}
  </div>`;
}

function buildToolRecsSectionHtml(toolId) {
  const recs = toolRecsCache[toolId] || [];
  const listHtml = recs.length
    ? `<div class="tl-recs">${recs.map(r => toolRecCardHtml(toolId, r)).join('')}</div>`
    : `<div class="tl-empty">no recommendations yet — be the first to share one.</div>`;
  const addHtml = currentUser
    ? buildAddRecFormHtml(toolId)
    : `<div class="tl-detail-fact">want to share a recommendation? <a href="../users/login.html">log in</a></div>`;
  return `<div class="tl-rec-section-label">community recommendations</div>${listHtml}${addHtml}`;
}

function toolTopRecsPanelHtml(toolId) {
  const recs = (toolRecsCache[toolId] || []).slice(0, 3);
  const rowsHtml = recs.length
    ? recs.map(r => `<div class="tl-top-rec-row"><a href="${_escapeHtml(r.link_url)}" target="_blank" rel="noopener noreferrer">${_escapeHtml(r.title)}</a><span class="tl-top-rec-score">${r.score ?? 0}</span></div>`).join('')
    : `<div class="detail-tag-empty">no recommendations yet</div>`;
  return `<div class="tl-top-recs-panel">
    <div class="tl-top-recs-label">top recommendations</div>
    ${rowsHtml}
  </div>`;
}

function buildToolsDetailHtml() {
  const id = toolsState.detailToolId;
  const backBtn = `<button type="button" class="link-btn" onclick="backToToolsGrid()">← back to list</button>`;
  const tool = (toolsCache || []).find(t => t.id === id);
  if (!tool) return backBtn + '<div class="tl-empty">not found.</div>';

  const landscapes = tool.landscapes || [];
  const terrains = [...new Set(landscapes.map(z => z.terrain).filter(Boolean))];
  const feelings = [...new Set(landscapes.map(z => z.feeling).filter(Boolean))];

  const chipsOrEmpty = (values) => values.length
    ? `<div class="detail-tag-chips">${values.map(v => `<span class="detail-tag-chip">${_escapeHtml(v)}</span>`).join('')}</div>`
    : `<div class="detail-tag-empty">none yet</div>`;

  const tagsPanelHtml = `<div class="detail-tags-panel">
    <div><div class="detail-tag-col-label">terrains</div>${chipsOrEmpty(terrains)}</div>
    <div><div class="detail-tag-col-label">emotions</div>${chipsOrEmpty(feelings)}</div>
    <div><div class="detail-tag-col-label">category of care</div><div class="detail-tag-chips"><span class="detail-tag-chip">${_escapeHtml(tool.tool_type)}</span></div></div>
  </div>`;

  const inventoryBtnHtml = currentUser
    ? `<button type="button" class="tl-save-btn" onclick="toggleInventorySave('${id}')">${savedToolIds.has(id) ? '− remove from my inventory' : '+ add to my inventory'}</button>`
    : `<div class="tl-detail-fact">want to add this to your inventory? <a href="../users/login.html">log in</a></div>`;

  const posterHtml = tool.icon_url
    ? `<img class="detail-poster aspect-square" src="${_escapeHtml(tool.icon_url)}" alt="">`
    : `<div class="detail-poster-noimg">?</div>`;

  return backBtn + `<div class="detail-layout tools-layout">
    <div class="detail-left">
      ${posterHtml}
      ${toolTopRecsPanelHtml(id)}
      ${inventoryBtnHtml}
    </div>
    <div class="detail-main">
      <div class="detail-title">${_escapeHtml(tool.title)}</div>
      <div class="detail-subtitle-row">
        <span class="detail-badge">${_escapeHtml(tool.tool_type)}</span>
        ${tool.author_name ? `<span class="detail-fact">added by ${_escapeHtml(tool.author_name)}</span>` : ''}
      </div>
      <div class="detail-summary">${_escapeHtml(tool.summary)}</div>
      ${tool.favorite_brands ? `<div class="detail-fact">favorite brands: ${_escapeHtml(tool.favorite_brands)}</div>` : ''}
      ${tagsPanelHtml}
      ${buildToolRecsSectionHtml(id)}
    </div>
  </div>`;
}

function buildToolsBodyHtml() {
  const addLink = currentUser
    ? `<a class="tl-add-top" href="../matrix/tools.html">+ add a tool</a>`
    : `<a class="tl-add-top" href="../users/login.html">log in to add a tool</a>`;
  const topRow = `<div class="tl-top-row">${addLink}</div>`;
  if (toolsState.detailToolId) return topRow + buildToolsDetailHtml();
  return topRow + buildToolsGridHtml();
}

function renderToolsModalBody(html) { document.getElementById('tools-modal-body').innerHTML = html; }
function renderTools() { renderToolsModalBody(buildToolsBodyHtml()); }

function setToolTypeFilter(v) { toolsState.filterType = v || null; renderTools(); }
function setToolTerrainFilter(v) { toolsState.filterTerrain = v || null; renderTools(); }

async function openToolDetail(toolId) {
  toolsState.detailToolId = toolId;
  document.querySelector('#tools-overlay .hg-modal').classList.add('detail-mode');
  renderToolsModalBody('<div class="tl-loading">loading…</div>');
  recDraftTags = { terrains: new Set(), feelings: new Set() };
  if (!toolRecsCache[toolId]) await fetchToolRecommendations(toolId);
  await fetchMyRecVotes(toolId);
  renderTools();
}
function backToToolsGrid() {
  toolsState.detailToolId = null;
  document.querySelector('#tools-overlay .hg-modal').classList.remove('detail-mode');
  renderTools();
}

async function submitToolRecommendation(toolId) {
  if (!currentUser) return;
  const title = (document.getElementById('new-rec-title').value || '').trim();
  const linkRaw = (document.getElementById('new-rec-link').value || '').trim();
  const description = (document.getElementById('new-rec-desc').value || '').trim();
  if (!title || !linkRaw || !description) {
    HGModal.alert('missing info', 'a title, link, and description are all required.');
    return;
  }
  let link_url;
  try {
    const url = new URL(linkRaw);
    if (!/^https?:$/.test(url.protocol)) throw new Error('bad protocol');
    link_url = url.toString();
  } catch (e) {
    HGModal.alert('bad link', "that link doesn't look like a valid web address — include https://");
    return;
  }
  const username = await resolveUsername(currentUser);
  const { error } = await sb.from('tool_recommendations').insert({
    tool_id: toolId, user_id: currentUser.id, username, title, link_url, description,
    terrains: [...recDraftTags.terrains], feelings: [...recDraftTags.feelings],
  });
  if (error) { console.error('[library] tool recommendation insert failed:', error); return; }
  recDraftTags = { terrains: new Set(), feelings: new Set() };
  await fetchToolRecommendations(toolId);
  await fetchMyRecVotes(toolId);
  renderTools();
}

async function openTools() {
  toolsState = { detailToolId: null, filterType: null, filterTerrain: null, minRating: 0 };
  document.querySelector('#tools-overlay .hg-modal').classList.remove('detail-mode');
  document.getElementById('tools-overlay').classList.add('open');
  renderToolsModalBody('<div class="tl-loading">loading…</div>');
  if (!toolsCache) await fetchTools();
  await fetchSavedToolIds();
  renderTools();
}
function closeTools() { document.getElementById('tools-overlay').classList.remove('open'); }

document.getElementById('tools-close').addEventListener('click', closeTools);
document.getElementById('tools-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('tools-overlay')) closeTools();
});

// ── Thought bubble ──
const bubble = document.getElementById('thought-bubble');
const bubbleMessages = {
  'icon-bookshelf': "browse the texts people've read",
  'icon-projector': "browse the films & shows people've watched",
  'icon-tools': "explore our collection of self care tools",
};
document.querySelectorAll('.room-icon').forEach(icon => {
  icon.addEventListener('mouseenter', () => {
    bubble.textContent = bubbleMessages[icon.id] || '';
    bubble.classList.add('visible');
  });
  icon.addEventListener('mouseleave', () => {
    bubble.classList.remove('visible');
  });
});

// ── Gear / login / music (dynamic — logged-out visitors can still browse) ──
async function resolveUsername(user) {
  try {
    const { data: profile } = await sb.from('user-profiles').select('username').eq('id', user.id).single();
    return profile?.username || user.email.split('@')[0];
  } catch (e) { return user.email.split('@')[0]; }
}

document.addEventListener('DOMContentLoaded', () => {
  HeartabilityNav.init({
    mount: '#gear-slot', assetsBase: '../assets', authMode: 'dynamic', sb,
    profileHref: '../users/account-settings.html',
  });
  HeartabilityRoomNav.init({ mount: '#map-slot', currentRoom: 'library' });

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      currentUser = session.user;
      privateAllCache = null;
      privateSavesCache = null;
      resolveUsername(session.user).then(username => HeartabilityNav.setAuthState({ loggedIn: true, username }));
      fetchSavedToolIds().then(renderTools);
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      privateAllCache = null;
      privateSavesCache = null;
      HeartabilityNav.setAuthState({ loggedIn: false });
      if (libState.tab === 'private') render();
      savedToolIds = new Set();
      renderTools();
    }
  });

  sb.auth.getSession().then(async ({ data: { session } }) => {
    if (session) {
      currentUser = session.user;
      const username = await resolveUsername(session.user);
      HeartabilityNav.setAuthState({ loggedIn: true, username });
    }
    handleDeepLink();
  });
});
</script>

</body>
