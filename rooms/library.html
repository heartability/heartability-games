* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --blue:       #6e83d3;

}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: #dfe2ef;

/* ── ROOM BACKGROUND (bed.html pattern) ── */
/* Pre-warped trapezoid art: tall/full-height at the outer room corner (image's
   own left/right edge), short at the inner seam with the back wall (image's
   other edge). At the seam edge the art's own trim/floor lines sit at 28.5%/
   74.2% of image height, not the 45.75%/79% the back wall shows at its own
   left edge — so the image is scaled+shifted (not just stretched 1:1) to pull
   those two points onto the back wall's actual trim/bottom. That leaves slivers
   uncovered above and below the art (outer corner only); a two-tone backing
   fill (light upper-wall blue / dark baseboard blue) covers both. The
   clip-path removes the wedge above the roofline (the same (0,0)→(15%,9%)
   line the .room-bg diagonals already draw), so the wallpaper doesn't poke
   up past the ceiling — matching how the back wall's own gap is just bare
   background there. */
.room-side-wall-left {
  position: absolute; top: 0; left: 0; width: 15%; height: 100%;
  background-image: url("../assets/elements/wall-wainscoting-l.png"),
    linear-gradient(to bottom, rgb(186, 201, 255) 0% 50%, rgb(94, 128, 254) 50% 100%);
  background-repeat: no-repeat, no-repeat;
  background-position: 0 25.01cqh, 0 0;
  background-size: 100% 72.76%, 100% 100%;
  clip-path: polygon(0% 0%, 100% 9%, 100% 100%, 0% 100%);
  z-index: 0; pointer-events: none;
}
.room-side-wall-right {
  position: absolute; top: 0; right: 0; width: 15%; height: 100%;
  background-image: url("../assets/elements/wall-wainscoting-r.png"),
    linear-gradient(to bottom, rgb(186, 201, 255) 0% 50%, rgb(94, 128, 254) 50% 100%);
  background-repeat: no-repeat, no-repeat;
  background-position: 0 25.01cqh, 0 0;
  background-size: 100% 72.76%, 100% 100%;
  clip-path: polygon(0% 9%, 100% 0%, 100% 100%, 0% 100%);
  z-index: 0; pointer-events: none;
}

.room-carpet {
  position: absolute; inset: 0;
  background: var(--side-col) url("../assets/elements/tile-circle.jpg") repeat;
  background-size: 200px 200px;
  /* Top edge matches the wainscoting art's (now-corrected) floor line, which
     lands exactly on the back wall's own bottom edge: 9% + 70% = 79%. */
  clip-path: polygon(0% 100%, 100% 100%, 85% 79%, 15% 79%);
  z-index: 1; pointer-events: none;
}

.room-bg { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.room-bg svg { width: 100%; height: 100%; display: block; }
.room-back-wall {
  position: absolute; top: 9%; left: 15%; width: 70%; height: 70%;
  background: #f0ece4 url("../assets/elements/wall-wainscoting.jpg") repeat-x;
  background-size: auto 100%;
  border: 2px solid var(--line-col);
  z-index: 3; pointer-events: none;
}

/* ── TOP NAV ── */
.room-nav {
  position: fixed; top: 0; left: 0; right: 0; height: 44px;
  background: #6e83d3; border-bottom: 2px solid var(--line-col);
  z-index: 200; display: flex; align-items: center; justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand); font-size: clamp(21px, 1.6vw, 25px); color: #fff;
}
.nav-title { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; white-space: nowrap; margin: 0; font: inherit; }
.nav-btn { cursor: pointer; padding: 4px 8px; border-radius: 2px; color: inherit; text-decoration: none; transition: background 0.15s; }
.nav-btn:hover { background: rgba(0,0,0,0.08); }

.map-wrap { position: relative; }
.map-btn { display: flex; align-items: center; gap: 4px; background: none; border: none; font-family: inherit; font-size: inherit; color: inherit; }
.map-dropdown {
  position: absolute; top: calc(100% + 4px); right: 0; min-width: 170px;
  background: #6e83d3; border: 2px solid var(--line-col);
  box-shadow: 3px 4px 0 rgba(0,0,0,0.12);
  z-index: 201; display: none; flex-direction: column; overflow: hidden;
}
.map-dropdown.open { display: flex; }
.map-item {
  display: block; font-family: var(--font-hand); font-size: clamp(15px, 1.3vw, 18px); color: #fff;
  padding: 9px 14px; cursor: pointer; border: none; background: none;
  text-align: left; white-space: nowrap; transition: background 0.12s; text-decoration: none;
}
.map-item:hover { background: rgba(0,0,0,0.07); }
.map-item.current { color: rgba(255,255,255,0.55); cursor: default; }
.map-item.current:hover { background: none; }

/* ── ROOM ICONS ── */
.room-icon {
  position: absolute;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer; padding: 10px; border-radius: 4px;
  transition: transform 0.15s; transform-origin: bottom center;
  z-index: 10;
}
.room-icon:hover { transform: translateY(-5px); }
.room-icon:active { transform: translateY(-2px); }

#icon-bookshelf { bottom: 10cqh; left: 22cqw; width: clamp(90px, 40cqw, 500px) }
#icon-projector { bottom: 10cqh; right: 22cqw; width: clamp(90px, 26cqw, 375px)}
.room-icon img { width: 100%; height: auto; display: block; }

.room-icon-label { font-family: var(--font-hand); font-size: clamp(14px, 1.6vw, 19px); color: #444; text-align: center; }

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position: absolute;
  left: calc(100% - 8px);
  bottom: 62%;
  min-width: clamp(140px, 16cqw, 220px);
  max-width: clamp(160px, 20cqw, 260px);
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 12px 18px;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.2cqw, 16px);
  color: #000;
  text-align: center;
  line-height: 1.5;
  z-index: 21;
  opacity: 0;
  transform: scale(0.92) translateY(4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}
.thought-bubble.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

/* ── HEART CHARACTER ── */
@keyframes idle-pulse {
  0%,100% { transform: translateY(0) rotate(-2deg) scale(1); }
  50%      { transform: translateY(-8px) rotate(2deg) scale(1.03); }
}
.char-heart {
  position: absolute;
  left: 10cqw;
  bottom: 6cqh;
  width: clamp(120px, 16cqw, 260px);
  z-index: 20;
  pointer-events: none;
  transition: left 0.7s cubic-bezier(0.4,0,0.2,1), bottom 0.7s cubic-bezier(0.4,0,0.2,1);
}
@media (orientation: portrait) {
  .char-heart { width: clamp(70px, 10cqw, 180px); }
  #icon-bookshelf { width: clamp(140px, 30cqw, 315px); }
  #icon-projector { width: clamp(120px, 24cqw, 290px); }
}
.char-heart img {
  display: block;
  width: 100%; height: auto;

}

function parseYear(v) { const n = parseInt(String(v || '').trim(), 10); return Number.isFinite(n) ? n : null; }

async function _fetchJSON(url, timeoutMs) {
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), timeoutMs);

  try {

async function fetchPublic(category) {
  const { data, error } = await sb.from('media_submissions_public').select('*')
    .in('media_type', CATEGORY_META[category].types)

  if (error) { console.error('[library] public fetch failed:', error); publicCache[category] = []; return; }
  publicCache[category] = data || [];

  const { data: catalogData, error: catalogError } = await sb.from('media_catalog_public').select('*')
    .in('media_type', CATEGORY_META[category].types);
  if (catalogError) { console.error('[library] catalog fetch failed:', catalogError); catalogCache[category] = []; return; }
  catalogCache[category] = catalogData || [];
}

async function fetchPrivateAll() {
  const { data, error } = await sb.from('media_submissions').select('*, media(*)')
    .eq('submitted_by', currentUser.id).order('created_at', { ascending: false });
  if (error) { console.error('[library] private fetch failed:', error); privateAllCache = []; return; }
  privateAllCache = data || [];
}

async function fetchPrivateSaves() {
  const { data, error } = await sb.from('media_saves').select('*, media(*)')
    .eq('user_id', currentUser.id).order('created_at', { ascending: false });
  if (error) { console.error('[library] private saves fetch failed:', error); privateSavesCache = []; return; }
  privateSavesCache = data || [];
}

function groupByMedia(rows) {
  const map = new Map();
  rows.forEach(r => {
    const id = r.media_id;
    if (!map.has(id)) {
      map.set(id, {
        media_id: id,
        title: r.title || r.media?.title || 'untitled',
        cover_url: r.cover_url || r.media?.cover_url || null,
        media_type: r.media_type || r.media?.media_type,
        submissions: [],
      });
    }
    map.get(id).submissions.push(r);
  });
  return [...map.values()];
}

// Adds catalog entries (titles with zero reviews) as cards alongside the reviewed
// ones from groupByMedia, so unreviewed titles are still visible/openable.
function mergeCatalog(cards, catalogRows) {
  const seen = new Set(cards.map(c => c.media_id));
  catalogRows.forEach(r => {
    if (seen.has(r.media_id)) return;
    seen.add(r.media_id);
    cards.push({ media_id: r.media_id, title: r.title || 'untitled', cover_url: r.cover_url, media_type: r.media_type, submissions: [] });
  });
  return cards;
}

function zonesOf(sub) {
  const z1 = sub.map_data?.zones || [];
  const z2 = sub.story_arc_map_data?.zones || [];
  return [...z1, ...z2];
}
function cardAvgRating(card) {
  const vals = [];
  card.submissions.forEach(s => { if (s.quality_rating) vals.push(s.quality_rating); if (s.experience_rating) vals.push(s.experience_rating); });
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function cardHasTerrain(card, terrainCat) { return card.submissions.some(s => zonesOf(s).some(z => TERRAIN_CATEGORY_MAP[z.terrain] === terrainCat)); }
function cardHasFeeling(card, climateCat) { return card.submissions.some(s => zonesOf(s).some(z => FEELING_CLIMATE_MAP[z.feeling] === climateCat)); }
function computeFacets(cards) {
  const terrainCats = new Set(), climateCats = new Set();
  cards.forEach(c => c.submissions.forEach(s => zonesOf(s).forEach(z => {
    const tc = TERRAIN_CATEGORY_MAP[z.terrain]; if (tc) terrainCats.add(tc);
    const cc = FEELING_CLIMATE_MAP[z.feeling]; if (cc) climateCats.add(cc);
  })));
  return {
    terrains: TERRAIN_CATEGORIES.filter(t => terrainCats.has(t.id)),
    feelings: CLIMATE_CATEGORIES.filter(c => climateCats.has(c.id)),
  };
}
function filteredCards(cards) {
  return cards.filter(c => {
    if (libState.filterTerrain && !cardHasTerrain(c, libState.filterTerrain)) return false;
    if (libState.filterFeeling && !cardHasFeeling(c, libState.filterFeeling)) return false;
    if (libState.minRating > 0) {
      const avg = cardAvgRating(c);
      if (!avg || avg < libState.minRating) return false;
    }
    return true;
  });
}

function summarizeZones(mapData) {
  const zones = mapData?.zones || [];
  const labels = ['beginning', 'middle', 'end'];
  return zones.map((z, i) => `${labels[i]}: ${z.terrain || '—'} / ${z.feeling || '—'}`).join('  ·  ');
}
function ratingsLine(r) {
  const parts = [];
  if (r.quality_rating) parts.push(`quality ★${r.quality_rating}`);
  if (r.experience_rating) parts.push(`experience ★${r.experience_rating}`);
  return parts.join(' · ');
}

function cardHtml(c) {
  const avg = cardAvgRating(c);
  return `<div class="lib-card" onclick="openDetail('${c.media_id}')">
    ${c.cover_url ? `<img src="${_escapeHtml(c.cover_url)}" alt="">` : '<div class="lib-card-noimg"></div>'}
    <div class="lib-card-title">${_escapeHtml(c.title)}</div>
    <div class="lib-card-meta">${c.submissions.length ? `${c.submissions.length} ${c.submissions.length === 1 ? 'entry' : 'entries'}${avg ? ` · ★${avg.toFixed(1)}` : ''}` : 'no reviews yet'}</div>
  </div>`;
}

function buildPublicGridHtml() {
  const rows = publicCache[libState.category] || [];
  const cards = mergeCatalog(groupByMedia(rows), catalogCache[libState.category] || []);
  const facets = computeFacets(cards);
  const shown = filteredCards(cards);
  const filterHtml = `<div class="lib-filters">
    <select onchange="setTerrainFilter(this.value)">
      <option value="">any terrain</option>
      ${facets.terrains.map(t => `<option value="${t.id}" ${libState.filterTerrain === t.id ? 'selected' : ''}>${t.label}</option>`).join('')}
    </select>
    <select onchange="setFeelingFilter(this.value)">
      <option value="">any climate</option>
      ${facets.feelings.map(f => `<option value="${f.id}" ${libState.filterFeeling === f.id ? 'selected' : ''}>${f.label}</option>`).join('')}
    </select>
    <select onchange="setMinRating(this.value)">
      <option value="0" ${libState.minRating == 0 ? 'selected' : ''}>any rating</option>
      <option value="3" ${libState.minRating == 3 ? 'selected' : ''}>3★ +</option>
      <option value="4" ${libState.minRating == 4 ? 'selected' : ''}>4★ +</option>
      <option value="5" ${libState.minRating == 5 ? 'selected' : ''}>5★ only</option>
    </select>
  </div>`;
  if (!cards.length) return filterHtml + `<div class="lib-empty">no public entries yet — be the first to <a href="../matrix/media.html">add one</a>.</div>`;
  if (!shown.length) return filterHtml + `<div class="lib-empty">nothing matches those filters.</div>`;
  return filterHtml + `<div class="lib-grid">${shown.map(cardHtml).join('')}</div>`;
}

function saveCardHtml(s) {
  const badge = s.status === 'done' ? 'done reading' : 'to be read';
  return `<div class="lib-card" onclick="openSaveDetail('${s.id}')">
    ${s.media?.cover_url ? `<img src="${_escapeHtml(s.media.cover_url)}" alt="">` : '<div class="lib-card-noimg"></div>'}
    <div class="lib-card-title">${_escapeHtml(s.media?.title || 'untitled')}</div>
    <div class="lib-card-meta">${badge}</div>
  </div>`;
}

function setSavesFilter(v) { libState.savesFilter = v; render(); }

// Combines full reviews (media_submissions, which imply the title is finished)
// with plain saves (media_saves, tagged to_read/done) into one shelf, filterable
// by reading status. Reviews only ever show up under "done" or "view all".
function buildPrivateGridHtml() {
  if (!currentUser) {
    return `<div class="lib-empty">log in to view your private shelf.<br><br><a href="../users/login.html">log in</a></div>`;
  }
  const types = CATEGORY_META[libState.category].types;
  const reviewRows = (privateAllCache || []).filter(r => types.includes(r.media?.media_type));
  const reviewCards = groupByMedia(reviewRows);
  const saveRows = (privateSavesCache || []).filter(r => types.includes(r.media?.media_type));

  if (!reviewCards.length && !saveRows.length) {
    return `<div class="lib-empty">you haven't added anything here yet — <a href="../matrix/media.html">fill out the form</a>.</div>`;
  }

  const statusHtml = `<div class="lib-status-row">
    <button class="lib-status-btn ${libState.savesFilter === 'all' ? 'active' : ''}" onclick="setSavesFilter('all')">view all</button>
    <button class="lib-status-btn ${libState.savesFilter === 'to_read' ? 'active' : ''}" onclick="setSavesFilter('to_read')">to be read</button>
    <button class="lib-status-btn ${libState.savesFilter === 'done' ? 'active' : ''}" onclick="setSavesFilter('done')">done reading</button>
  </div>`;

  const shownReviews = libState.savesFilter === 'to_read' ? [] : reviewCards;
  const shownSaves = libState.savesFilter === 'all' ? saveRows : saveRows.filter(r => r.status === libState.savesFilter);
  const combined = shownReviews.map(cardHtml).join('') + shownSaves.map(saveCardHtml).join('');

  if (!combined) return statusHtml + `<div class="lib-empty">nothing matches that filter.</div>`;
  return statusHtml + `<div class="lib-grid">${combined}</div>`;
}

// `info` is either a media_submissions_public row (public tab) or a joined `media` row
// (private tab, via media_submissions.select('*, media(*)')) — both carry title/cover_url/
// author/media_type, and release_year once that column exists on `media`.
function detailHeaderHtml(info, fallbackTitle, mediaId) {
  const title = info?.title || fallbackTitle || 'untitled';
  const cover = info?.cover_url;
  const mediaType = info?.media_type;
  const isVisual = CATEGORY_META.visual.types.includes(mediaType);
  const authorLabel = isVisual ? 'director' : 'author';
  const uploadPrompt = (!cover && currentUser && mediaId)
    ? `<label class="lib-cover-upload-btn">+ add a cover photo<input type="file" accept="image/*" hidden onchange="uploadDetailCover(event, '${mediaId}')"></label>
       <span class="lib-cover-upload-status" id="lib-cover-upload-status"></span>`
    : '';
  return `<div class="lib-detail-header">
    ${cover ? `<img class="lib-detail-cover" src="${_escapeHtml(cover)}" alt="">` : `<div class="lib-detail-cover lib-card-noimg">${uploadPrompt}</div>`}
    <div class="lib-detail-meta">
      <div class="lib-detail-title">${_escapeHtml(title)}</div>
      ${info?.release_year ? `<div class="lib-detail-fact">released ${_escapeHtml(String(info.release_year))}</div>` : ''}
      ${info?.author ? `<div class="lib-detail-fact">${authorLabel}: <a href="#" class="lib-author-link" data-author="${_escapeHtml(info.author)}" data-type="${_escapeHtml(mediaType || '')}">${_escapeHtml(info.author)}</a></div>` : ''}
    </div>
  </div>`;
}

// Big-poster equivalent of detailHeaderHtml() above, used by the new
// full-page buildDetailHtml() layout (detailHeaderHtml stays as-is for the
// smaller save-a-title detail view).
function detailPosterAndSubtitle(info, mediaId) {
  const cover = info?.cover_url;
  const mediaType = info?.media_type;
  const isVisual = CATEGORY_META.visual.types.includes(mediaType);
  const authorLabel = isVisual ? 'director' : 'author';
  const uploadPrompt = (!cover && currentUser && mediaId)
    ? `<label class="lib-cover-upload-btn">+ add a cover photo<input type="file" accept="image/*" hidden onchange="uploadDetailCover(event, '${mediaId}')"></label>
       <span class="lib-cover-upload-status" id="lib-cover-upload-status"></span>`
    : '';
  const posterHtml = cover
    ? `<img class="detail-poster aspect-cover" src="${_escapeHtml(cover)}" alt="">`
    : `<div class="detail-poster-noimg aspect-cover">${uploadPrompt || '?'}</div>`;
  const subtitleHtml = `<div class="detail-subtitle-row">
    ${info?.release_year ? `<span class="detail-fact">released ${_escapeHtml(String(info.release_year))}</span>` : ''}
    ${info?.author ? `<span class="detail-fact">${authorLabel}: <a href="#" class="lib-author-link" data-author="${_escapeHtml(info.author)}" data-type="${_escapeHtml(mediaType || '')}">${_escapeHtml(info.author)}</a></span>` : ''}
  </div>`;
  return { posterHtml, subtitleHtml };
}

function pooledZoneTags(rows) {
  const terrains = new Set(), feelings = new Set();
  rows.forEach(r => zonesOf(r).forEach(z => {
    if (z.terrain) terrains.add(z.terrain);
    if (z.feeling) feelings.add(z.feeling);
  }));
  return { terrains: [...terrains], feelings: [...feelings] };
}
function tagChipsOrEmpty(values) {
  return values.length
    ? `<div class="detail-tag-chips">${values.map(v => `<span class="detail-tag-chip">${_escapeHtml(v)}</span>`).join('')}</div>`
    : `<div class="detail-tag-empty">none yet</div>`;
}
function detailTagsPanelHtml(rows) {
  const { terrains, feelings } = pooledZoneTags(rows);
  return `<div class="detail-tags-panel cols-2">
    <div><div class="detail-tag-col-label">terrains</div>${tagChipsOrEmpty(terrains)}</div>
    <div><div class="detail-tag-col-label">emotions</div>${tagChipsOrEmpty(feelings)}</div>
  </div>`;
}

// Blended average across every row's quality_rating + experience_rating,
// same math as cardAvgRating() above but operating on raw rows directly.
function avgRatingFromRows(rows) {
  const vals = [];
  rows.forEach(r => { if (r.quality_rating) vals.push(r.quality_rating); if (r.experience_rating) vals.push(r.experience_rating); });
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function detailRatingsPanelHtml(rows) {
  const avg = avgRatingFromRows(rows);
  const ratedCount = rows.filter(r => r.quality_rating || r.experience_rating).length;
  return `<div class="detail-ratings-panel">
    <div class="detail-ratings-label">ratings</div>
    <div class="detail-rating-num">${avg ? avg.toFixed(1) : '—'}</div>
    <div class="detail-rating-stars">${avg ? '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg)) : 'no ratings yet'}</div>
    <div class="detail-rating-count">${ratedCount} ${ratedCount === 1 ? 'rating' : 'ratings'}</div>
  </div>`;
}

function buildDetailHtml() {
  const id = libState.detailMediaId;
  const backBtn = `<button type="button" class="link-btn" onclick="backToGrid()">← back to list</button>`;
  if (libState.tab === 'public') {

      <div class="detail-main">

        ${detailTagsPanelHtml(rows)}
        ${addCta}

    const entries = rows.map(r => `<div class="lib-own-entry">

      <div class="lib-comment-zones">${summarizeZones(r.map_data)}</div>
      ${r.story_arc_map_data ? `<div class="lib-comment-zones">story arc — ${summarizeZones(r.story_arc_map_data)}</div>` : ''}
      ${ratingsLine(r) ? `<div class="lib-comment-ratings">${ratingsLine(r)}</div>` : ''}
      <div class="lib-comment-ratings">${r.is_public ? (r.is_author_public ? 'shared publicly, with your name' : 'shared publicly, anonymously') : 'private — only visible to you'}</div>
    </div>`).join('');
    const { posterHtml, subtitleHtml } = detailPosterAndSubtitle(rows[0].media, id);
    return backBtn + `<div class="detail-layout">
      <div>${posterHtml}</div>
      <div class="detail-main">

        ${subtitleHtml}
        ${rows.length === 1 && rows[0].about_sentence ? `<div class="detail-summary">${_escapeHtml(rows[0].about_sentence)}</div>` : ''}
        ${detailTagsPanelHtml(rows)}
        <div class="lib-own-entries">${entries}</div>
      </div>
      <div class="detail-sidebar">${detailRatingsPanelHtml(rows)}</div>
    </div>`;
  }
}

// ── SAVE-A-TITLE PANEL ──────────────────────────────────────────────────
// Bookmarks a title as to_read/done straight from the library room, with no
// review attached (about sentence / reading map / ratings). That full review
// flow lives only in matrix/media.html — this panel never touches it.
let saveSearchMode = 'book';
let saveSelectedMedia = null; // { title, media_type, external_id, external_source, cover_url/poster, canonical_link, author, year }
let saveManualCoverUrl = null;
let saveManualOpen = false;
let saveBusy = false;

function openSavePanel() {
  saveSearchMode = 'book'; saveSelectedMedia = null; saveManualCoverUrl = null; saveManualOpen = false; saveBusy = false;
  libState.showSavePanel = true;
  libState.detailMediaId = null; libState.detailSaveId = null; libState.authorFilter = null;
  render();
}
function closeSavePanel() { libState.showSavePanel = false; render(); }

function setSaveSearchMode(mode) {
  saveSearchMode = mode;
  document.querySelectorAll('.lib-save-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('libSaveResults').innerHTML = '';
  document.getElementById('libSaveSearchInput').value = '';
}

function toggleSaveManualEntry() {
  saveManualOpen = !saveManualOpen;
  saveSelectedMedia = null;
  render();
}

async function runSaveSearch() {
  const q = document.getElementById('libSaveSearchInput').value.trim();
  const resultsEl = document.getElementById('libSaveResults');
  if (q.length < 2) { resultsEl.innerHTML = '<div class="lib-save-status">type at least 2 characters first.</div>'; return; }
  const goBtn = document.getElementById('libSaveSearchBtn');
  goBtn.disabled = true; goBtn.textContent = 'searching…';
  resultsEl.innerHTML = '<div class="lib-save-status">searching…</div>';
  try {
    let items = [];
    if (saveSearchMode === 'book') {
      const data = await _fetchJSONWithRetry(`${SUPABASE_FUNCTIONS_URL}?type=book&q=${encodeURIComponent(q)}`);
      if (data.error) { resultsEl.innerHTML = '<div class="lib-save-status">search isn\'t working right now — enter it manually below.</div>'; return; }
      items = (data.items || []).map(it => {
        const info = it.volumeInfo || {};
        const isbn = (info.industryIdentifiers || []).find(id => id.type === 'ISBN_13') || (info.industryIdentifiers || [])[0];
        return {
          title: info.title || 'untitled',
          year: (info.publishedDate || '').slice(0, 4),
          poster: info.imageLinks?.thumbnail?.replace('http://', 'https://') || null,
          media_type: 'book',
          author: (info.authors || []).join(', ') || null,
          external_id: isbn?.identifier || it.id,
          external_source: 'google_books',
          canonical_link: info.infoLink || null,
        };
      }).slice(0, 8);
    } else {
      const data = await _fetchJSONWithRetry(`${SUPABASE_FUNCTIONS_URL}?q=${encodeURIComponent(q)}`);
      if (data.error) { resultsEl.innerHTML = '<div class="lib-save-status">search isn\'t working right now — enter it manually below.</div>'; return; }
      items = (Array.isArray(data) ? data : []).map(it => ({
        title: it.title, year: it.year,
        poster: it.poster && it.poster !== 'N/A' ? it.poster : null,
        media_type: 'movie',
        external_id: it.imdb_id, external_source: 'omdb',
        canonical_link: it.imdb_id ? `https://www.imdb.com/title/${it.imdb_id}/` : null,
      })).slice(0, 8);
    }
    if (!items.length) { resultsEl.innerHTML = '<div class="lib-save-status">no matches — try a different search, or enter it manually below.</div>'; return; }
    resultsEl.innerHTML = `<div class="lib-save-results">${items.map((item, i) => `<div class="lib-save-result-card" data-idx="${i}">
      ${item.poster ? `<img src="${_escapeHtml(item.poster)}" alt="">` : '<div class="lib-save-result-noimg"></div>'}
      <div class="lib-save-result-title">${_escapeHtml(item.title)}${item.year ? ` (${_escapeHtml(item.year)})` : ''}</div>
    </div>`).join('')}</div>`;
    resultsEl.querySelectorAll('.lib-save-result-card').forEach(card => {
      card.addEventListener('click', () => selectSaveResult(items[Number(card.dataset.idx)]));
    });
  } catch (e) {
    console.error('[library save search] failed:', e);
    resultsEl.innerHTML = '<div class="lib-save-status">search isn\'t working right now — enter it manually below.</div>';
  } finally {
    goBtn.disabled = false; goBtn.textContent = 'search';
  }
}

function selectSaveResult(item) {
  saveSelectedMedia = { ...item };
  saveManualOpen = false;
  render();
}

async function onSaveCoverPicked(event) {
  const file = event.target.files?.[0];
  if (!file || !currentUser) return;
  const statusEl = document.getElementById('libSaveCoverStatus');
  if (statusEl) statusEl.textContent = 'uploading…';
  try {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    const path = `${currentUser.id}/${crypto.randomUUID()}.${ext}`;
    const { error } = await sb.storage.from(MEDIA_COVER_BUCKET).upload(path, file, { contentType: file.type, upsert: false });
    if (error) throw error;
    const { data: pub } = sb.storage.from(MEDIA_COVER_BUCKET).getPublicUrl(path);
    saveManualCoverUrl = pub?.publicUrl || null;
    if (statusEl) statusEl.textContent = 'photo attached ✓';
  } catch (e) {
    console.error('[library save cover] failed:', e);
    if (statusEl) statusEl.textContent = "couldn't upload — try again";
  }
}

function currentSaveTitle() {
  return saveManualOpen
    ? document.getElementById('libSaveManualTitle').value.trim()
    : (saveSelectedMedia?.title || document.getElementById('libSaveSearchInput').value.trim());
}

// Looks for a `media` row that's already the same book/movie before creating a new
// one — external_id+external_source is an exact match for anything from search;
// manual entries (no external id) fall back to a title(+author) match so re-typing
// a title someone already added doesn't spawn a duplicate.
async function findExistingMediaId(mediaRow) {
  try {
    if (mediaRow.external_id && mediaRow.external_source) {
      const { data } = await sb.from('media').select('id')
        .eq('external_id', mediaRow.external_id).eq('external_source', mediaRow.external_source).limit(1);
      if (data?.[0]) return data[0].id;
    } else if (mediaRow.title) {
      let q = sb.from('media').select('id').ilike('title', mediaRow.title).eq('media_type', mediaRow.media_type);
      if (mediaRow.author) q = q.ilike('author', mediaRow.author);
      const { data } = await q.limit(1);
      if (data?.[0]) return data[0].id;
    }
  } catch (e) { console.error('[library] existing-media lookup failed:', e); }
  return null;
}

async function saveTitle(status) {
  if (saveBusy) return;
  const title = currentSaveTitle();
  if (!title) { HGModal.alert('hold on', 'add a title first.'); return; }
  saveBusy = true;
  document.querySelectorAll('.lib-save-actions .lib-save-btn').forEach(b => b.disabled = true);

  const mediaRow = saveManualOpen ? {
    title,
    author: document.getElementById('libSaveManualAuthor').value.trim() || null,
    media_type: document.getElementById('libSaveManualType').value,
    external_id: null, external_source: null,
    cover_url: saveManualCoverUrl,
    canonical_link: document.getElementById('libSaveManualLink').value.trim() || null,
    release_year: parseYear(document.getElementById('libSaveManualYear').value),
  } : {
    title,
    author: saveSelectedMedia?.author || null,
    media_type: saveSelectedMedia?.media_type || 'other',
    external_id: saveSelectedMedia?.external_id || null,
    external_source: saveSelectedMedia?.external_source || null,
    cover_url: saveSelectedMedia?.cover_url || saveSelectedMedia?.poster || null,
    canonical_link: saveSelectedMedia?.canonical_link || null,
    release_year: parseYear(saveSelectedMedia?.year),
  };

  try {
    let mediaId = await findExistingMediaId(mediaRow);
    if (!mediaId) {
      const { data: media, error: mErr } = await sb.from('media').insert(mediaRow).select().single();
      if (mErr) throw mErr;
      mediaId = media.id;
    }
    const { error: sErr } = await sb.from('media_saves').insert({ user_id: currentUser.id, media_id: mediaId, status });
    if (sErr) throw sErr;
    await fetchPrivateSaves();
    libState.showSavePanel = false;
    render();
  } catch (e) {
    console.error('[library save title] failed:', e);
    HGModal.alert('oops', "couldn't save that — try again");
    saveBusy = false;
    document.querySelectorAll('.lib-save-actions .lib-save-btn').forEach(b => b.disabled = false);
  }
}

function buildSavePanelHtml() {
  const backBtn = `<button type="button" class="link-btn" onclick="closeSavePanel()">← back to list</button>`;
  const selectedHtml = saveSelectedMedia ? `<div class="lib-save-selected">
    ${saveSelectedMedia.cover_url || saveSelectedMedia.poster ? `<img src="${_escapeHtml(saveSelectedMedia.cover_url || saveSelectedMedia.poster)}" alt="">` : '<div class="lib-card-noimg"></div>'}
    <div>${_escapeHtml(saveSelectedMedia.title)}${saveSelectedMedia.author ? `<div style="font-size:13px;color:#888;">${_escapeHtml(saveSelectedMedia.author)}</div>` : ''}</div>
  </div>` : '';
  const manualHtml = saveManualOpen ? `<div class="lib-save-manual">
    <input id="libSaveManualTitle" type="text" placeholder="title">
    <input id="libSaveManualAuthor" type="text" placeholder="author / director (optional)">
    <input id="libSaveManualYear" type="text" inputmode="numeric" placeholder="year released (optional)">
    <select id="libSaveManualType">
      <option value="book">book</option>
      <option value="movie">movie</option>
      <option value="tv">tv</option>
      <option value="other">other</option>
    </select>
    <input id="libSaveManualLink" type="text" placeholder="link (optional)">
    <div style="display:flex;align-items:center;gap:10px;">
      <label class="lib-save-btn" style="cursor:pointer;">upload cover photo<input type="file" accept="image/*" hidden onchange="onSaveCoverPicked(event)"></label>
      <span id="libSaveCoverStatus" style="font-family:var(--font-hand);font-size:13px;color:#888;"></span>
    </div>
  </div>` : '';
  return backBtn + `<div class="lib-save-panel">
    <div class="lib-detail-title" style="font-size:19px;">save a title to your list</div>
    <div class="lib-save-toggle">
      <button type="button" class="lib-save-mode-btn active" data-mode="book" onclick="setSaveSearchMode('book')">book</button>
      <button type="button" class="lib-save-mode-btn" data-mode="movie" onclick="setSaveSearchMode('movie')">movie / tv</button>
    </div>
    <div class="lib-save-search-row">
      <input id="libSaveSearchInput" class="lib-save-input" type="text" placeholder="type a title…" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();runSaveSearch();}">
      <button type="button" id="libSaveSearchBtn" class="lib-save-btn" onclick="runSaveSearch()">search</button>
    </div>
    <div id="libSaveResults"></div>
    ${selectedHtml}
    <button type="button" class="link-btn" style="margin:0;" onclick="toggleSaveManualEntry()">${saveManualOpen ? 'use search instead' : "can't find it? enter it manually"}</button>
    ${manualHtml}
    <div class="lib-save-actions">
      <button type="button" class="lib-save-btn" onclick="saveTitle('to_read')">+ to be read</button>
      <button type="button" class="lib-save-btn" onclick="saveTitle('done')">+ already read/watched</button>
    </div>
  </div>`;
}

function buildSaveDetailHtml() {
  const backBtn = `<button type="button" class="link-btn" onclick="backToGrid()">← back to list</button>`;
  const row = (privateSavesCache || []).find(r => r.id === libState.detailSaveId);
  if (!row) return backBtn + '<div class="lib-empty">not found.</div>';
  const title = row.media?.title || 'untitled';
  const otherStatus = row.status === 'done' ? 'to_read' : 'done';
  const otherLabel = otherStatus === 'done' ? 'mark as done reading' : 'mark as to be read';
  return backBtn + detailHeaderHtml(row.media, title, row.media_id) + `
    <div class="lib-add-cta">
      currently: ${row.status === 'done' ? 'done reading' : 'to be read'}<br><br>
      <a href="#" onclick="event.preventDefault(); setSaveStatus('${row.id}','${otherStatus}')">${otherLabel}</a>
      &nbsp;·&nbsp;
      <a href="../matrix/media.html?media=${encodeURIComponent(row.media_id)}">+ write a full review</a>
      &nbsp;·&nbsp;
      <a href="#" onclick="event.preventDefault(); removeSave('${row.id}')">remove from your list</a>
    </div>`;
}

async function setSaveStatus(id, status) {
  const { error } = await sb.from('media_saves').update({ status }).eq('id', id);
  if (error) { console.error('[library] status update failed:', error); return; }
  const row = (privateSavesCache || []).find(r => r.id === id);
  if (row) row.status = status;
  render();
}

async function removeSave(id) {
  const { error } = await sb.from('media_saves').delete().eq('id', id);
  if (error) { console.error('[library] remove failed:', error); return; }
  privateSavesCache = (privateSavesCache || []).filter(r => r.id !== id);
  backToGrid();
}

function openSaveDetail(saveId) {
  libState.detailSaveId = saveId;
  libState.detailMediaId = null;
  libState.authorFilter = null;
  render();
}

function buildAuthorBrowseHtml() {
  const backBtn = `<button type="button" class="link-btn" onclick="clearAuthorFilter()">← back</button>`;
  const header = `<div class="lib-detail-title">entries by ${_escapeHtml(libState.authorFilter.author)}</div>`;
  const cards = groupByMedia(authorBrowseCache);
  if (!cards.length) return backBtn + header + `<div class="lib-empty">no other public entries found.</div>`;
  return backBtn + header + `<div class="lib-grid">${cards.map(cardHtml).join('')}</div>`;
}

function buildBodyHtml() {
  const addLink = currentUser
    ? `<a class="lib-add-top" href="../matrix/media.html">+ add an entry</a>`
    : `<a class="lib-add-top" href="../users/login.html">log in to add an entry</a>`;
  const saveLink = (currentUser && libState.tab === 'private')
    ? `<a class="lib-add-top" href="#" onclick="event.preventDefault(); openSavePanel();">+ save a title</a>`
    : '';
  const tabsHtml = `<div class="lib-tabs">
    <button class="lib-tab-btn ${libState.tab === 'public' ? 'active' : ''}" onclick="switchTab('public')">collective library</button>
    <button class="lib-tab-btn ${libState.tab === 'private' ? 'active' : ''}" onclick="switchTab('private')">my shelf</button>
    ${saveLink}
    ${addLink}
  </div>`;
  if (libState.showSavePanel) return tabsHtml + buildSavePanelHtml();
  if (libState.authorFilter) return tabsHtml + buildAuthorBrowseHtml();
  if (libState.detailSaveId) return tabsHtml + buildSaveDetailHtml();
  if (libState.detailMediaId) return tabsHtml + buildDetailHtml();
  return tabsHtml + (libState.tab === 'public' ? buildPublicGridHtml() : buildPrivateGridHtml());
}

function renderModalBody(html) { document.getElementById('library-modal-body').innerHTML = html; }
function bindAuthorLinks() {
  document.querySelectorAll('.lib-author-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openAuthorBrowse(a.dataset.author, a.dataset.type); });
  });
}
function render() { renderModalBody(buildBodyHtml()); bindAuthorLinks(); }

function setTerrainFilter(v) { libState.filterTerrain = v || null; render(); }
function setFeelingFilter(v) { libState.filterFeeling = v || null; render(); }
function setMinRating(v) { libState.minRating = Number(v) || 0; render(); }

function openDetail(mediaId) {
  libState.detailMediaId = mediaId;
  libState.detailSaveId = null;
  libState.authorFilter = null;
  document.querySelector('#library-overlay .hg-modal').classList.add('detail-mode');
  render();
}
function backToGrid() {
  libState.detailMediaId = null; libState.detailSaveId = null; libState.authorFilter = null; libState.showSavePanel = false;
  document.querySelector('#library-overlay .hg-modal').classList.remove('detail-mode');
  render();
}

// Lets a logged-in visitor add a missing cover photo straight from the detail
// view, for either a public library entry or one of their own. Uses its own
// media-covers storage bucket (kept separate from matrix-photos so the two
// don't grow into one another as both collections scale up) — see the SQL
// in the media-covers bucket setup for the required bucket + RLS policies.
async function uploadDetailCover(event, mediaId) {
  const file = event.target.files?.[0];
  if (!file || !currentUser) return;
  const statusEl = document.getElementById('lib-cover-upload-status');
  if (statusEl) statusEl.textContent = 'uploading…';
  try {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    const path = `${currentUser.id}/${crypto.randomUUID()}.${ext}`;
    const { error: upErr } = await sb.storage.from('media-covers').upload(path, file, { contentType: file.type, upsert: false });
    if (upErr) throw upErr;
    const { data: pub } = sb.storage.from('media-covers').getPublicUrl(path);
    const coverUrl = pub?.publicUrl;
    const { error: updErr } = await sb.from('media').update({ cover_url: coverUrl }).eq('id', mediaId);
    if (updErr) throw updErr;
    (publicCache[libState.category] || []).forEach(r => { if (r.media_id === mediaId) r.cover_url = coverUrl; });
    (privateAllCache || []).forEach(r => { if (r.media_id === mediaId && r.media) r.media.cover_url = coverUrl; });
    (privateSavesCache || []).forEach(r => { if (r.media_id === mediaId && r.media) r.media.cover_url = coverUrl; });
    render();
  } catch (e) {
    console.error('[library] cover upload failed:', e);
    if (statusEl) statusEl.textContent = "couldn't upload — try again";
  }
}

// "other entries by this creator" — queried straight from media_submissions_public (same
// anonymous-readable view the grids use), since the raw `media` table is RLS-locked and
// can't be queried directly by anonymous/public visitors.
async function openAuthorBrowse(author, mediaType) {
  libState.detailMediaId = null;
  libState.authorFilter = { author, mediaType };
  renderModalBody('<div class="lib-loading">loading…</div>');
  const { data, error } = await sb.from('media_submissions_public').select('*').eq('author', author);
  if (error) console.error('[library] author browse failed:', error);
  authorBrowseCache = data || [];
  render();
}
function clearAuthorFilter() { libState.authorFilter = null; render(); }

async function switchTab(tab) {
  libState.tab = tab; libState.detailMediaId = null; libState.detailSaveId = null; libState.authorFilter = null; libState.showSavePanel = false;
  renderModalBody('<div class="lib-loading">loading…</div>');
  if (tab === 'public' && !publicCache[libState.category]) await fetchPublic(libState.category);
  if (tab === 'private' && currentUser) {
    if (!privateAllCache) await fetchPrivateAll();
    if (!privateSavesCache) await fetchPrivateSaves();
  }
  render();
}

async function openLibrary(category) {
  libState = { category, tab: 'public', detailMediaId: null, detailSaveId: null, filterTerrain: null, filterFeeling: null, minRating: 0, authorFilter: null, savesFilter: 'all', showSavePanel: false };
  document.getElementById('library-modal-title').textContent = CATEGORY_META[category].label;
  document.querySelector('#library-overlay .hg-modal').classList.remove('detail-mode');
  document.getElementById('library-overlay').classList.add('open');
  renderModalBody('<div class="lib-loading">loading…</div>');
  if (!publicCache[category]) await fetchPublic(category);
  render();
}
function closeLibrary() { document.getElementById('library-overlay').classList.remove('open'); }

document.getElementById('library-close').addEventListener('click', closeLibrary);
document.getElementById('library-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('library-overlay')) closeLibrary();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLibrary(); });

// ── Deep link: rooms/library.html?media=<media_id> opens straight to a title's detail ──
async function handleDeepLink() {
  const mediaId = new URLSearchParams(location.search).get('media');
  if (!mediaId) return;
  let { data } = await sb.from('media_submissions_public').select('media_id, media_type').eq('media_id', mediaId).limit(1);
  let row = data && data[0];
  if (!row) {
    const catalogResult = await sb.from('media_catalog_public').select('media_id, media_type').eq('media_id', mediaId).limit(1);
    row = catalogResult.data && catalogResult.data[0];
  }
  if (!row) return;
  const category = CATEGORY_META.visual.types.includes(row.media_type) ? 'visual' : 'book';
  await openLibrary(category);
  openDetail(mediaId);
}

// ── Thought bubble ──
const bubble = document.getElementById('thought-bubble');
const bubbleMessages = {
  'icon-bookshelf': "browse the texts people've read",
  'icon-projector': "browse the films & shows people've watched",
};
document.querySelectorAll('.room-icon').forEach(icon => {
  icon.addEventListener('mouseenter', () => {
    bubble.textContent = bubbleMessages[icon.id] || '';
    bubble.classList.add('visible');
  });
  icon.addEventListener('mouseleave', () => {
    bubble.classList.remove('visible');
  });
});

// ── Map dropdown ──
document.getElementById('map-btn').addEventListener('click', () => {
  document.getElementById('map-dropdown').classList.toggle('open');
});
document.addEventListener('click', e => {
  const mw = document.getElementById('map-wrap');
  if (mw && !mw.contains(e.target)) document.getElementById('map-dropdown').classList.remove('open');
});

// ── Gear / login / music (dynamic — logged-out visitors can still browse) ──
async function resolveUsername(user) {
  try {
    const { data: profile } = await sb.from('user-profiles').select('username').eq('id', user.id).single();
    return profile?.username || user.email.split('@')[0];
  } catch (e) { return user.email.split('@')[0]; }
}

document.addEventListener('DOMContentLoaded', () => {
  HeartabilityNav.init({
    mount: '#gear-slot', assetsBase: '../assets', authMode: 'dynamic', sb,
    profileHref: '../users/account-settings.html',
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      currentUser = session.user;
      privateAllCache = null;
      privateSavesCache = null;
      resolveUsername(session.user).then(username => HeartabilityNav.setAuthState({ loggedIn: true, username }));
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      privateAllCache = null;
      privateSavesCache = null;
      HeartabilityNav.setAuthState({ loggedIn: false });
      if (libState.tab === 'private') render();
    }
  });

  sb.auth.getSession().then(async ({ data: { session } }) => {
    if (session) {
      currentUser = session.user;
      const username = await resolveUsername(session.user);
      HeartabilityNav.setAuthState({ loggedIn: true, username });
    }
    handleDeepLink();
  });
});
</script>
