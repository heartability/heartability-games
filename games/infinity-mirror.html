<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<link rel="stylesheet" href="../assets/css/modal.css">
<script src="../assets/js/modal.js" defer></script>
<title>Character Builder — Heartability</title>
<meta name="robots" content="noindex,follow">
<style>

  @font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}

@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}
  
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #6579e2;
  --bg-dark: #dfe2ef;
  --panel-bg: #dfe2ef;
  --panel-border-dark: #6579e2;
  --panel-border-mid: #6579e2;
  --panel-border-light: #6579e2;
  --text-dark: #0a1a2e;
  --text-mid: #1a3a5a;
  --accent: #83d2e6;
  --font-game: "VT323", monospace;
  --mirror-bg: #ffffff;
}

body {
  min-height: 100dvh;
  background: transparent;
  font-family: var(--font-game);
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
html { background: transparent; }


.room {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}

.wall {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 0;
}

.instructions {
  font-family: var(--font-game);
  font-size: clamp(14px, 1.8vw, 18px);
  color: #6579e2;
  line-height: 1.8;
}
.step { color: #ff9040; }

.btn {
  background: var(--bg-dark);
  border: 3px solid var(--panel-border-dark);
  outline: 2px solid var(--panel-border-light);
  outline-offset: -4px;
  box-shadow: 2px 3px 0 2px rgba(0,0,0,0.4);
  padding: 6px 16px;
  font-family: var(--font-game);
  font-size: 18px;
  color: #6579e2;
  cursor: pointer;
  letter-spacing: 1px;
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: translate(2px,3px); box-shadow: none; }

.main-panel {
  width: 100%;
  max-width: 1050px;
  background: #dfe2ef;
  padding: 18px;
  margin-bottom: 20px;
}

.name-row { margin-bottom: 14px; }

.section-label {
  font-family: var(--font-game);
  font-size: 17px;
  color: var(--text-mid);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.name-input {
  width: 100%;
  max-width: 400px;
  background: #dfe2ef;
  border: 2px solid #8a7a5a;
  border-right-color: #5a4a2a;
  border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a;
  border-top-color: #c8b88a;
  padding: 6px 10px;
  font-family: var(--font-game);
  font-size: 23px;
  color: var(--text-dark);
  outline: none;
}
.name-input::placeholder { color: rgba(90,74,42,0.35); }

.two-col {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 16px;
}
@media(max-width: 700px) {
  .two-col { grid-template-columns: 1fr; }
  .mirror-col { order: -1; }
}

.selector-side { display: flex; flex-direction: column; gap: 10px; }

.category-section {
  background: #dfe2ef;
  border: 2px solid #6579e2;
  border-right-color: #3a4aaa;
  border-bottom-color: #3a4aaa;
  border-left-color: #5465c5;
  border-top-color: #5465c5;
  padding: 10px 12px;
}

.category-title {
  font-family: var(--font-game);
  font-size: 21px;
  color: var(--text-dark);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.parts-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
}

.part-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 5px 7px;
  background: var(--panel-bg);
  border: 2px solid #6579e2;
  border-right-color: #3a4aaa;
  border-bottom-color: #3a4aaa;
  border-left-color: #5465c5;
  border-top-color: #5465c5;
  cursor: pointer;
  transition: filter 0.1s;
  width: 100%;
  min-width: 0;
}
.part-btn:hover { filter: brightness(0.94); }
.part-btn.active {
  border-color: var(--accent) !important;
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  background: #fff0e0;
}
.part-btn img {
  width: 100%;
  max-width: 52px;
  height: 44px;
  object-fit: contain;
  pointer-events: none;
}
.part-btn .part-name {
  font-family: var(--font-game);
  font-size: 13px;
  color: var(--text-dark);
  text-align: center;
  pointer-events: none;
  text-transform: uppercase;
}
.part-btn.none-btn img { opacity: 0.3; }

/* MIRROR */
.mirror-col { display: flex; flex-direction: column; gap: 10px; }

.mirror-frame {
  background: url("../assets/elements/mirror-bg.png") center / cover no-repeat, var(--mirror-bg);
  border: 5px solid #6579e2;
  border-radius: 0;
  box-shadow:
    0 0 0 6px #83d2e6,
    0 0 0 10px #83d2e6,
    4px 8px 24px rgba(0,0,0,0.5);
  aspect-ratio: 0.72;
  position: relative;
  overflow: hidden;
  width: 100%;
}

/* Layered character display */
.char-layer {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0; left: 0;
  pointer-events: none;
}

/* Full-canvas exports: all layers are 777×1155px with parts in correct position.
   Stack them at 100% width/height — pixel-perfect, no manual offsets needed. */

.char-layer img {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  object-fit: fill;
}

.mirror-empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.mirror-empty-text {
  font-family: var(--font-game);
  font-size: 18px;
  color: rgba(100,80,40,0.3);
  text-align: center;
  line-height: 2;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.char-name-display {
  font-family: var(--font-game);
  font-size: 25px;
  color: var(--text-dark);
  text-align: center;
  letter-spacing: 2px;
  text-transform: uppercase;
  min-height: 28px;
}

/* ── GAME ROOM OVERLAY ─────────────────────────────────────────── */
@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
body, .wall { background: transparent; }

@keyframes gr-intro-wiggle {
  0%   { transform: rotate(0deg) scale(1); }
  18%  { transform: rotate(-11deg) scale(1.06); }
  38%  { transform: rotate(11deg) scale(1.06); }
  58%  { transform: rotate(-6deg) scale(1.02); }
  78%  { transform: rotate(6deg) scale(1.02); }
  100% { transform: rotate(0deg) scale(1); }
}
@keyframes gr-idle-pulse {
  0%,100% { transform: translateY(0)    rotate(-2deg) scale(1); }
  50%      { transform: translateY(-8px) rotate(2deg)  scale(1.03); }
}
</style>
</head>
<body>
<div class="room">
  <div class="wall">
    <div class="main-panel">
      <div class="two-col">
        <div class="selector-side">
          <div class="category-section">
            <div class="category-title">Body Color</div>
            <div class="parts-grid" id="grid-body"></div>
          </div>
          <div class="category-section">
            <div class="category-title">Hair</div>
            <div class="parts-grid" id="grid-hair"></div>
          </div>
          <div class="category-section">
            <div class="category-title">Eyes</div>
            <div class="parts-grid" id="grid-eyes"></div>
          </div>
          <div class="category-section">
            <div class="category-title">Mouth</div>
            <div class="parts-grid" id="grid-mouth"></div>
          </div>
        </div>

        <div class="mirror-col">
          <div class="mirror-frame">
            <div class="char-layer layer-body"  id="layerBody"></div>
            <div class="char-layer layer-hair"  id="layerHair"></div>
            <div class="char-layer layer-eyes"  id="layerEyes"></div>
            <div class="char-layer layer-mouth" id="layerMouth"></div>
            <div class="mirror-empty" id="mirrorEmpty">
              <div class="mirror-empty-text">pick a body<br>to begin</div>
            </div>
          </div>
          <div class="char-name-display" id="charNameDisplay"></div>
          <div class="name-row">
            <div class="section-label">name this archetype</div>
            <input class="name-input" id="charName" maxlength="30" placeholder="name this archetype" oninput="onNameChange()" />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// All image paths are relative — just drop your PNGs in assets/characters/
const ASSETS = {
  body_red:    "../assets/characters-thumbnail/01.01 RED_BODY.png",
  body_orange: "../assets/characters-thumbnail/02.01 ORANGE_BODY.png",
  body_yellow: "../assets/characters-thumbnail/03.01 YELLOW_BODY.png",
  body_green:  "../assets/characters-thumbnail/04.01 GREEN_BODY.png",
  body_cyan:   "../assets/characters-thumbnail/05.01 CYAN_BODY.png",
  body_blue:   "../assets/characters-thumbnail/06.01 BLUE_BODY.png",
  body_purple: "../assets/characters-thumbnail/07.01 PURPLE_BODY.png",
  body_pink:   "../assets/characters-thumbnail/08.01 PINK_BODY.png",

  eyes_open:       "../assets/characters-thumbnail/01.02 OPEN_EYES.png",
  eyes_closed:     "../assets/characters-thumbnail/02.02 EYES_CLOSED.png",
  eyes_cyclops:    "../assets/characters-thumbnail/03.02 SINGLE_EYE.png",
  eyes_glasses:    "../assets/characters-thumbnail/04.02 GLASSES.png",
  eyes_serious:    "../assets/characters-thumbnail/05.02 SERIOUS_EYES.png",
  eyes_up:         "../assets/characters-thumbnail/06.02 UP_EYES.png",
  eyes_sunglasses: "../assets/characters-thumbnail/07.02 SUNGLASSES.png",
  eyes_sideways:   "../assets/characters-thumbnail/08.02 SIDE_EYES.png",

  mouth_lips:     "../assets/characters-thumbnail/01.03 RED_LIPS.png",
  mouth_tongue:   "../assets/characters-thumbnail/02.03 TONGUE_SMILE.png",
  mouth_thin:     "../assets/characters-thumbnail/03.03 THIN_SMILE.png",
  mouth_flat:     "../assets/characters-thumbnail/04.03 FLAT_MOUTH.png",
  mouth_straight: "../assets/characters-thumbnail/05.03 STRAIGHT_MOUTH.png",
  mouth_sad:      "../assets/characters-thumbnail/06.03 SLIGHT_SAD.png",
  mouth_grin:     "../assets/characters-thumbnail/07.03 BIG_GRIN.png",
  mouth_smooch:   "../assets/characters-thumbnail/08.03 SMOOCH.png",

  hair_fire:     "../assets/characters-thumbnail/01.04 FIRE_HAIR.png",
  hair_flower:   "../assets/characters-thumbnail/02.04 ORANGE_HAIR.png",
  hair_rays:     "../assets/characters-thumbnail/03.04 RAY_HAIR.png",
  hair_spikes:   "../assets/characters-thumbnail/04.04 SPIKE_HAIR.png",
  hair_squiggle: "../assets/characters-thumbnail/05.04 SQUIGGLE_HAIR.png",
  hair_wings:    "../assets/characters-thumbnail/06.04 BLUE_HAIR.png",
  hair_pigtails: "../assets/characters-thumbnail/07.04 PIGTAIL_HAIR.png",
  hair_wideray:  "../assets/characters-thumbnail/08.04 WIDE_RAY.png",
};

// Full-canvas exports (777×1155px) used for the mirror display.
// Each PNG has transparent padding so all parts align automatically when stacked.
const FULL_ASSETS = {
  body_red:    "../assets/characters-full/01.01-RED_BODY.png",
  body_orange: "../assets/characters-full/02.01-ORANGE_BODY.png",
  body_yellow: "../assets/characters-full/03.01-YELLOW_BODY.png",
  body_green:  "../assets/characters-full/04.01-GREEN_BODY.png",
  body_cyan:   "../assets/characters-full/05.01-CYAN_BODY.png",
  body_blue:   "../assets/characters-full/06.01-BLUE_BODY.png",
  body_purple: "../assets/characters-full/07.01-PURPLE_BODY.png",
  body_pink:   "../assets/characters-full/08.01-PINK_BODY.png",

  eyes_open:       "../assets/characters-full/01.02-OPEN_EYES.png",
  eyes_closed:     "../assets/characters-full/02.02-EYES_CLOSED.png",
  eyes_cyclops:    "../assets/characters-full/03.02-SINGLE_EYE.png",
  eyes_glasses:    "../assets/characters-full/04.02-GLASSES.png",
  eyes_serious:    "../assets/characters-full/05.02-SERIOUS_EYES.png",
  eyes_up:         "../assets/characters-full/06.02-UP_EYES.png",
  eyes_sunglasses: "../assets/characters-full/07.02-SUNGLASSES.png",
  eyes_sideways:   "../assets/characters-full/08.02-SIDE_EYES.png",

  mouth_lips:     "../assets/characters-full/01.03-RED_LIPS.png",
  mouth_tongue:   "../assets/characters-full/02.03-TONGUE_SMILE.png",
  mouth_thin:     "../assets/characters-full/03.03-THIN_SMILE.png",
  mouth_flat:     "../assets/characters-full/04.03-FLAT_MOUTH.png",
  mouth_straight: "../assets/characters-full/05.03-STRAIGHT_MOUTH.png",
  mouth_sad:      "../assets/characters-full/06.03-SLIGHT_SAD.png",
  mouth_grin:     "../assets/characters-full/07.03-BIG_GRIN.png",
  mouth_smooch:   "../assets/characters-full/08.03-SMOOCH.png",

  hair_fire:     "../assets/characters-full/01.04-FIRE_HAIR.png",
  hair_flower:   "../assets/characters-full/02.04-ORANGE_HAIR.png",
  hair_rays:     "../assets/characters-full/03.04-RAY_HAIR.png",
  hair_spikes:   "../assets/characters-full/04.04-SPIKE_HAIR.png",
  hair_squiggle: "../assets/characters-full/05.04-SQUIGGLE_HAIR.png",
  hair_wings:    "../assets/characters-full/06.04-BLUE_HAIR.png",
  hair_pigtails: "../assets/characters-full/07.04-PIGTAIL_HAIR.png",
  hair_wideray:  "../assets/characters-full/08.04-WIDE_RAY.png",
};

const BODIES = [
  { id:"body_red",    label:"Red" },
  { id:"body_orange", label:"Orange" },
  { id:"body_yellow", label:"Yellow" },
  { id:"body_green",  label:"Green" },
  { id:"body_cyan",   label:"Cyan" },
  { id:"body_blue",   label:"Blue" },
  { id:"body_purple", label:"Purple" },
  { id:"body_pink",   label:"Pink" },
];
const HAIRS = [
  { id:"hair_fire",     label:"Fire" },
  { id:"hair_flower",   label:"Flower" },
  { id:"hair_rays",     label:"Rays" },
  { id:"hair_spikes",   label:"Spikes" },
  { id:"hair_squiggle", label:"Squiggle" },
  { id:"hair_wings",    label:"Wings" },
  { id:"hair_pigtails", label:"Pigtails" },
  { id:"hair_wideray",  label:"Wide Ray" },
];
const EYES = [
  { id:"eyes_open",       label:"Open" },
  { id:"eyes_closed",     label:"Closed" },
  { id:"eyes_cyclops",    label:"Cyclops" },
  { id:"eyes_glasses",    label:"Glasses" },
  { id:"eyes_serious",    label:"Serious" },
  { id:"eyes_up",         label:"Upward" },
  { id:"eyes_sunglasses", label:"Shades" },
  { id:"eyes_sideways",   label:"Sideways" },
];
const MOUTHS = [
  { id:"mouth_lips",     label:"Lips" },
  { id:"mouth_tongue",   label:"Tongue" },
  { id:"mouth_thin",     label:"Smile" },
  { id:"mouth_flat",     label:"Flat" },
  { id:"mouth_straight", label:"Teeth" },
  { id:"mouth_sad",      label:"Sad" },
  { id:"mouth_grin",     label:"Grin" },
  { id:"mouth_smooch",   label:"Smooch" },
];

let state = { name:"", body:null, hair:null, eyes:null, mouth:null };

// ── No persistence ───────────────────────────────────────
// Character resets on every visit — nothing is stored or restored.
function saveLocal() {}
function loadLocal() {}

// ── No-op save (state lives in memory only for this session) ──
function save() {}

function renderLayer(layerId, partId) {
  const layer = document.getElementById(layerId);
  layer.innerHTML = partId ? `<img src="${FULL_ASSETS[partId]}" alt="" />` : "";
}

function render() {
  document.getElementById("mirrorEmpty").style.display = state.body ? "none" : "flex";
  renderLayer("layerBody",  state.body);
  renderLayer("layerHair",  state.hair);
  renderLayer("layerEyes",  state.eyes);
  renderLayer("layerMouth", state.mouth);

  document.getElementById("charNameDisplay").textContent = state.name ? state.name.toUpperCase() : "";

  // active states
  document.querySelectorAll(".part-btn").forEach(b => b.classList.remove("active"));
  ["body","hair","eyes","mouth"].forEach(key => {
    if(state[key]) document.querySelector(`[data-id="${state[key]}"]`)?.classList.add("active");
  });
}

function makeGrid(containerId, items, stateKey, allowNone) {
  const container = document.getElementById(containerId);
  if(allowNone) {
    const btn = document.createElement("div");
    btn.className = "part-btn none-btn";
    btn.innerHTML = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 44'%3E%3Cline x1='4' y1='4' x2='48' y2='40' stroke='%23aaa' stroke-width='3'/%3E%3Cline x1='48' y1='4' x2='4' y2='40' stroke='%23aaa' stroke-width='3'/%3E%3C/svg%3E" alt="none"/><div class="part-name">none</div>`;
    btn.addEventListener("click", () => { state[stateKey] = null; save(); render(); });
    container.appendChild(btn);
  }
  items.forEach(item => {
    const btn = document.createElement("div");
    btn.className = "part-btn";
    btn.dataset.id = item.id;
    btn.innerHTML = `<img src="${ASSETS[item.id]}" alt="${item.label}" loading="lazy"/><div class="part-name">${item.label}</div>`;
    btn.addEventListener("click", () => {
      state[stateKey] = state[stateKey] === item.id ? null : item.id;
      save(); render();
    });
    container.appendChild(btn);
  });
}

function onNameChange() {
  state.name = document.getElementById("charName").value;
  save(); render();
}

// ── Respond to chart-room state requests (top-level, always registered) ──
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'request_state') {
    window.parent.postMessage({ type: 'char_state', state: state }, '*');
  }
});

// Signal to parent that this iframe is loaded and ready
try { window.parent.postMessage({ type: 'iframe_ready', game: 'character' }, '*'); } catch(e) {}

// ── Init ─────────────────────────────────────────────────
function init() {
  // Always start fresh — no saved character is restored.

  makeGrid("grid-body",  BODIES, "body",  false);
  makeGrid("grid-hair",  HAIRS,  "hair",  false);
  makeGrid("grid-eyes",  EYES,   "eyes",  false);
  makeGrid("grid-mouth", MOUTHS, "mouth", false);
  document.getElementById("charName").value = state.name || "";
  render();
}

init();
</script>

</body>
</html>
