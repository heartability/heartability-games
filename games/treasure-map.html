<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Map — Heartability</title>
<style>
@font-face {
  font-family: "ZoesHandwriting";
  src: url(../assets/fonts/ZoesHandwriting-Regular.ttf) format("truetype");
}

@font-face {
  font-family: "PFPixelscript";
  src: url(../assets/fonts/PFPixelscriptProRegular.ttf) format("truetype");
}
@import url("https://fonts.googleapis.com/css2?family=VT323&display=swap");

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --wall: #6579e2;
  --wall-mid: #6579e2;
  --panel-bg: #f0ead6;
  --panel-border: #6579e2;
  --panel-border-light: #83d2e6;
  --text-dark: #000000;
  --text-mid: #000000;
  --aqua: #FDF6E3;
  --font-hand: "ZoesHandwriting", cursive;
  --font-game: "VT323", monospace;
  --font-nums: "ZoesHandwriting", "VT323", monospace;
}

body { min-height: 100vh; background: var(--wall); font-family: var(--font-game); display: flex; flex-direction: column; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }

.room { min-height: 100vh; display: flex; flex-direction: column; }

.wall {
  flex: 1; background: var(--wall); position: relative;
  display: flex; flex-direction: column; align-items: center;
  padding: 24px 16px 0;
  padding-bottom: calc(10dvh + 16px + 24px);
  overflow-y: auto;
}
.wall::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(255,255,255,0.04) 59px, rgba(255,255,255,0.04) 60px);
}

.room-title { 
  font-family: "PFPixelscript", cursive; 
  font-size: clamp(10px,5.5vw,58px); 
  color: #6578e2; 
  text-shadow: 2px 3px 0 rgba(0,0,0,0.14); 
  text-align: center; margin-bottom: 4px; position: relative; z-index: 1; }

.topbar { width: 100%; max-width: 960px; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; position: relative; z-index: 1; gap: 10px; flex-wrap: wrap; }
.instructions { font-family: var(--font-hand); font-size: clamp(12px,1.8vw,16px); color: #a8cce8; line-height: 1.7; }
.instructions .step { color: var(--aqua); }

.rpg-panel {
  position: relative; z-index: 1; background: #f0ead6;
  width: 100%; max-width: 960px;
  padding: 18px; display: flex; flex-direction: column; gap: 14px;
}

.section-header { font-family: var(--font-hand); font-size: 17px; color: var(--text-mid); margin-bottom: 7px; letter-spacing: 0.5px; }

.map-input {
  width: 100%; background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  padding: 6px 10px; font-family: var(--font-hand); font-size: 20px; color: var(--text-dark); outline: none;
}
.map-input::placeholder { color: rgba(90,74,42,0.35); }
.map-input:focus { border-color: var(--aqua); outline: 1px solid var(--aqua); }

/* TWO COLUMN — map left, controls right on desktop */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  align-items: start;
}

/* On mobile: stack with controls ABOVE map */
@media (max-width: 680px) {
  .two-col {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
  }
  .side-panel { order: 1; }
  .map-col { order: 2; }
}

/* MAP CANVAS */
.map-canvas {
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  min-height: 380px; position: relative; overflow: hidden;
  cursor: crosshair;
}

@media (max-width: 680px) {
  .map-canvas { min-height: 300px; }
}

.map-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.map-placeholder-text { font-family: var(--font-hand); font-size: 18px; color: rgba(90,74,42,0.25); text-align: center; line-height: 1.8; }

/* MAP ITEMS */
.map-item {
  position: absolute; user-select: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  z-index: 5; cursor: pointer;
  transform: translate(-50%, -50%);
}
.map-item.selected-for-feeling {
  filter: drop-shadow(0 0 6px rgba(59,191,191,0.9));
}
.map-item-wrap { position: relative; display: inline-block; }
.map-item-img { width: 72px; height: auto; display: block; pointer-events: none; }
.map-item-tint {
  position: absolute; inset: -40px;
  pointer-events: none; border-radius: 50%;
  mix-blend-mode: multiply;
}
.map-item-delete {
  position: absolute; top: -10px; right: -10px;
  width: 20px; height: 20px; background: #c04040; color: white;
  border: 1px solid #8a2020;
  font-size: 14px; cursor: pointer; display: none;
  align-items: center; justify-content: center; font-family: var(--font-game);
  z-index: 10; line-height: 1; border-radius: 0;
}
.map-item:hover .map-item-delete { display: flex; }
/* Always show delete on touch devices */
@media (hover: none) {
  .map-item-delete { display: flex !important; top: -8px; right: -8px; width: 18px; height: 18px; font-size: 12px; }
}

@media (max-width: 625px) {
  .room-title { font-size: 22px !important; white-space: nowrap; }
}

.map-item-label {
  font-family: var(--font-hand); font-size: 13px; color: var(--text-dark);
  white-space: nowrap; pointer-events: none; text-align: center; line-height: 1.3;
  background: rgba(240,234,214,0.75); padding: 1px 4px;
}
.map-item-label .terrain-name { display: block; }
.map-item-label .feeling-name { display: block; font-size: 11px; color: #5a4a2a; }

/* SIDE PANEL */
.side-panel { display: flex; flex-direction: column; gap: 12px; }

/* STATUS BAR */
.status-bar {
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  padding: 8px 12px; font-family: var(--font-hand); font-size: 15px; color: var(--text-mid);
  min-height: 40px; line-height: 1.4;
}
.status-bar .status-active { color: var(--text-dark); font-size: 17px; }
.status-bar .status-hint { font-size: 13px; color: #7a6a5a; }

/* TERRAIN PALETTE */
.palette-section {
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  padding: 10px 12px;
}
.palette-items { display: flex; flex-wrap: wrap; gap: 6px; }
.palette-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 8px; background: #f0ead6;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  cursor: pointer; user-select: none; transition: filter 0.1s;
}
.palette-item:hover { filter: brightness(1.06); }
.palette-item.active {
  border-color: var(--aqua);
  outline: 2px solid var(--aqua); outline-offset: 1px;
  background: #e0f0f0;
}
.palette-item img { width: 38px; height: 32px; object-fit: contain; pointer-events: none; }
.palette-item-name { font-family: var(--font-game); font-size: 10px; color: var(--text-mid); pointer-events: none; letter-spacing: 0.5px; }

/* WEATHER CATEGORIES */
.weather-categories { display: flex; flex-direction: column; gap: 8px; }
.weather-category {
  padding: 8px 10px;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
}
.weather-category.sunny { background: #f2e6a8; ; border-color: #715f04; }
.weather-category.rainy { background: #ae87e2; border-color: #260156; }
.weather-category.windy { background: #a3eac9; border-color: #046957; }
.weather-category.snowy { background: rgb(108, 209, 234); border-color: #033f50; }

.weather-cat-header { font-family: var(--font-hand); font-size: 20px; margin-bottom: 6px; }
.sunny .weather-cat-header { color: #715f04; }
.rainy .weather-cat-header { color: #260156; }
.windy .weather-cat-header { color: #046957; }
.snowy .weather-cat-header { color: #033f50; }

.feeling-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.feeling-chip {
  padding: 4px 10px; font-family: var(--font-game); font-size: 13px;
  cursor: pointer; letter-spacing: 0.5px; border: 2px solid;
  user-select: none; transition: filter 0.1s;
}
.feeling-chip:hover { filter: brightness(0.92); }
.feeling-chip.active { outline: 2px solid var(--text-dark); outline-offset: 1px; }

.sunny .feeling-chip { background: #f8edb8; border-color: #715f04; color: #715f04; }
.rainy .feeling-chip { background: #c9b3e7; border-color: #260156; color: #260156; }
.windy .feeling-chip { background: #b6e7d0; border-color: #046957; color: #046957; }
.snowy .feeling-chip { background: #a0d7e6; border-color: #033f50; color: #033f50; }

/* BUTTONS */
.action-row { display: flex; gap: 8px; flex-wrap: wrap; }
.rpg-btn {
  background: var(--wall-mid); border: 3px solid var(--panel-border);
  outline: 2px solid var(--panel-border-light); outline-offset: -4px;
  padding: 7px 16px; font-family: var(--font-game); font-size: 15px;
  color: #a8cce8; cursor: pointer; letter-spacing: 1px;
}
.rpg-btn:hover { filter: brightness(1.15); }
.rpg-btn:active { transform: translate(1px,1px); }
.rpg-btn.primary { background: var(--aqua); color: #0a1a2e; }

/* ── GAME ROOM OVERLAY ─────────────────────────────────────────── */
body, .wall { background: #f0ead6; }


@keyframes gr-intro-wiggle {
  0%   { transform: rotate(0deg) scale(1); }
  18%  { transform: rotate(-11deg) scale(1.06); }
  38%  { transform: rotate(11deg) scale(1.06); }
  58%  { transform: rotate(-6deg) scale(1.02); }
  78%  { transform: rotate(6deg) scale(1.02); }
  100% { transform: rotate(0deg) scale(1); }
}
@keyframes gr-idle-pulse {
  0%,100% { transform: translateY(0)    rotate(-2deg) scale(1); }
  50%      { transform: translateY(-8px) rotate(2deg)  scale(1.03); }
}
/* ── SPIRAL MODE ─────────────────────────────────── */
.mode-toggle { display: flex; gap: 8px; margin-bottom: 10px; }

.rpg-btn.mode-active {
  background: var(--aqua);
  color: var(--text-dark);
  outline-color: var(--panel-border);
}

.spiral-canvas {
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  position: relative; overflow: hidden;
  display: none;
}

.spiral-canvas svg {
  width: 100%; height: auto; display: block;
}

.zone-prompt-box {
  margin-top: 8px;
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  padding: 10px 14px;
  font-family: var(--font-hand);
  font-size: 15px;
  color: var(--text-mid);
  min-height: 44px;
  line-height: 1.5;
  display: none;
}

.zone-prompt-box.show { display: block; }

/* ── PROMPT BOX TITLE ─────────────────────────────── */
.prompt-title {
  font-family: var(--font-hand);
  font-size: 13px;
  color: var(--text-mid);
  letter-spacing: 0.3px;
  margin-bottom: 4px;
  opacity: 0.7;
}

/* ── MAP SHAPE LABEL ──────────────────────────────── */
.map-shape-label {
  font-family: var(--font-hand);
  font-size: 17px;
  color: var(--text-mid);
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
.map-shape-sub {
  font-family: var(--font-hand);
  font-size: 12px;
  color: #aaa;
  margin-bottom: 6px;
  cursor: pointer;
  display: inline-block;
}
.map-shape-sub:hover { text-decoration: underline; color: #6579e2; }


/* ── BOTTOM ACTION BAR ────────────────────────────── */
.panel-action-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--panel-border);
}

/* ── SQUARE MODE ─────────────────────────────────── */
.square-canvas {
  background: #e8e0c8;
  border: 2px solid #8a7a5a; border-right-color: #5a4a2a; border-bottom-color: #5a4a2a;
  border-left-color: #c8b88a; border-top-color: #c8b88a;
  position: relative; overflow: hidden;
  display: none;
}
.square-canvas svg {
  width: 100%; height: auto; display: block;
}

/* ── GAME CONTEXT BANNER ─────────────────────────── */
.game-context-banner {
  width: 100%; max-width: 960px;
  background: #d4efda;
  border: 2px solid #6aaa7a; border-right-color: #4a8a5a; border-bottom-color: #4a8a5a;
  border-left-color: #9acca8; border-top-color: #9acca8;
  padding: 8px 14px;
  font-family: var(--font-hand); font-size: 15px; color: #1a4a2a;
  position: relative; z-index: 1; margin-bottom: 10px;
  display: none;
}

/* ── PANEL TITLEBAR ───────────────────────────────── */
.rpg-panel-titlebar {
  height: 38px; background: #e8e3da; border-bottom: 2px solid #bbb;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-hand); font-size: 16px; color: #555;
  margin: -18px -18px 0; /* bleed to panel edges */
  letter-spacing: 0.3px; flex-shrink: 0;
}

/* Mode toggle disabled state */
.rpg-btn:disabled { opacity: 0.38; cursor: not-allowed; pointer-events: none; }

</style>
</head>
<body>
<div class="room">
  <div class="wall">
    <!-- GAME CONTEXT BANNER — shown when playing an existing game -->
    <div class="game-context-banner" id="game-context"></div>

    <div class="rpg-panel">

      <div class="two-col">

        <!-- SIDE PANEL — name input + mode toggle + terrain + feelings -->
        <div class="side-panel">

          <div>
            <div class="section-header">name your dream</div>
            <input class="map-input" id="mapName" type="text" placeholder="i dream of..." maxlength="60" oninput="onNameInput()">
          </div>

          <!-- Map shape selector with label -->
          <div>
            <div class="map-shape-label">map shape</div>
            <div class="mode-toggle" style="margin:0;">
              <button class="rpg-btn mode-active" id="btn-spiral" onclick="setMode('spiral')">SPIRAL</button>
              <button class="rpg-btn" id="btn-square" onclick="setMode('square')">SQUARE</button>
            </div>
          </div>

          <div class="palette-section">
            <div class="section-header">terrain</div>
            <div class="palette-items" id="terrainPalette"></div>
          </div>

          <div>
            <div class="section-header">feelings</div>
            <div class="weather-categories" id="weatherCategories"></div>
          </div>

        </div>

        <!-- MAP AREA -->
        <div class="map-col">

        <!-- Map header: label left, buttons right -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
          <div class="section-header" style="margin-bottom:0;">your map</div>
          <div style="display:flex;gap:6px;">
          </div>
        </div>

          <!-- Spiral canvas (default) -->
          <div class="spiral-canvas" id="spiralCanvas" style="display:block;position:relative;">
            <svg id="spiralSvg" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
              <defs id="spiralDefs"></defs>
              <line x1="250" y1="0" x2="250" y2="400" stroke="rgba(138,122,90,0.15)" stroke-width="1"/>
              <line x1="0" y1="200" x2="500" y2="200" stroke="rgba(138,122,90,0.15)" stroke-width="1"/>
              <path id="spiralPath" fill="none" stroke="#b8a88a" stroke-width="1.5" stroke-linecap="round"/>
              <g id="zoneGroup"></g>
            </svg>
          </div>
          <div class="square-canvas" id="squareCanvas" style="display:none;position:relative;">
            <svg id="squareSvg" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
              <defs id="squareDefs"></defs>
              <g id="squareZoneGroup"></g>
            </svg>
          </div>

          <!-- Zone prompt below canvas -->
          <div style="margin-top:8px;">
            <div class="status-bar" id="zonePrompt" style="display:none;padding:8px 12px;">
              <div class="prompt-title" id="promptTitle"></div>
              <span id="promptText"></span>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────
const TERRAIN_IMGS = {
  dunes:     "../assets/elements/maps/dunes.png",
  forest:    "../assets/elements/maps/forest.png",
  meadow:    "../assets/elements/maps/meadow.png",
  mountains: "../assets/elements/maps/mountains.png",
  ocean:     "../assets/elements/maps/ocean.png",
  orchard:   "../assets/elements/maps/orchard.png",
  plateau:   "../assets/elements/maps/plateau.png",
  pond:      "../assets/elements/maps/pond.png",
  river:     "../assets/elements/maps/river.png",
  spring:    "../assets/elements/maps/spring.png",
  waterfall: "../assets/elements/maps/waterfall.png",
};

const TERRAIN = [
  { id:"mountains", label:"mountains" }, { id:"forest",    label:"forest"    },
  { id:"orchard",   label:"orchard"   }, { id:"meadow",    label:"meadow"    },
  { id:"dunes",     label:"dunes"     }, { id:"pond",      label:"pond"      },
  { id:"river",     label:"river"     }, { id:"ocean",     label:"ocean"     },
  { id:"waterfall", label:"waterfall" }, { id:"spring",    label:"spring"    },
  { id:"plateau",   label:"plateau"   },
];

const WEATHER_CATS = [
  { id:"sunny", label:"sunny", cls:"sunny", tint:"#f2e6a8", feelings:["trust","peace","joy","hope","confidence"]          },
  { id:"rainy", label:"rainy", cls:"rainy", tint:"#c9b3e7",  feelings:["shadows","worry","fear","depression","regret"]      },
  { id:"windy", label:"windy", cls:"windy", tint:"#b6e6cf", feelings:["surprise","curiosity","inspiration","excitement","courage"] },
  { id:"snowy", label:"snowy", cls:"snowy", tint:"#a0d7e6", feelings:["anger","avoidance","bitterness","apathy","shock"]   },
];

const ZONE_PROMPTS = [
  "zone one — what does it feel like to begin?",
  "zone two — what does it feel like when you take a big step forward?",
  "zone three — what does it feel like when you are tested?"
];

const SQUARE_ZONE_PROMPTS = [
  "corner one — what does it feel like to be a beginner",
  "corner two — what does it feel like to fail",
  "corner three — what does it feel like to recommit",
  "corner four — what does it feel like to improve your skill",
];

// Quadrant centers within the 500×400 viewBox — tuned to square-1.png quadrants
const SQUARE_ZONE_POSITIONS = [
  { x: 160, y: 114 },   // top-left     = 1
  { x: 340, y: 114 },   // top-right    = 2
  { x: 340, y: 286 },   // bottom-right = 3
  { x: 160, y: 286 },   // bottom-left  = 4
];
const SQUARE_LABELS = ['1', '2', '3', '4'];

// ── MODE ──────────────────────────────────────────────────────────────────
let currentMode = 'spiral';

// Shared selection tracker
let sel = { activeTerrain: null, activeFeeling: null, activeCat: null, activeTint: null };

const MAP_DESCRIPTIONS = {
  spiral: 'Spiral maps represent exploring iterative cycles that require divine trust.',
  square: 'Square maps represent building something with strict routines that require discipline.',
};

function setMode(mode) {
  currentMode = mode;
  const spiralEl = document.getElementById("spiralCanvas");
  const squareEl = document.getElementById("squareCanvas");
  const btnSp    = document.getElementById("btn-spiral");
  const btnSq    = document.getElementById("btn-square");

  if (mode === 'square') {
    spiralEl.style.display = 'none';
    squareEl.style.display = 'block';
    btnSq.classList.add('mode-active');
    btnSp.classList.remove('mode-active');
    document.getElementById("mapName").value = squareState.name || "";
    renderSquareZones();
    squareActiveZone = null;
  } else {
    spiralEl.style.display = 'block';
    squareEl.style.display = 'none';
    btnSp.classList.add('mode-active');
    btnSq.classList.remove('mode-active');
    document.getElementById("mapName").value = spiralState.name || "";
    renderZoneCircles();
    activeZone = null;
  }
  document.querySelectorAll(".palette-item").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".feeling-chip").forEach(c => c.classList.remove("active"));
  sel.activeTerrain = null; sel.activeFeeling = null;
  sel.activeCat = null;     sel.activeTint = null;

  // Show map type description in prompt box when mode is selected
  const prompt = document.getElementById("zonePrompt");
  const title  = document.getElementById("promptTitle");
  const text   = document.getElementById("promptText");
  title.style.display = '';
  title.textContent = mode === 'square' ? 'square map' : 'spiral map';
  text.textContent  = MAP_DESCRIPTIONS[mode];
  prompt.style.display = 'block';
}

function onNameInput() {
  if (currentMode === 'spiral') spiralSaveState();
  else squareSaveState();
}

// ── SPIRAL STATE ──────────────────────────────────────────────────────────
let spiralState = { name:"", zones:[{},{},{}] };
let activeZone  = null;
let ZONE_POSITIONS = [];

function spiralLoadState() {
  // No persistence — always start with a fresh map each visit.
  while (spiralState.zones.length < 3) spiralState.zones.push({});
}
function spiralSaveState() {
  // Keep in-memory name in sync; nothing is written to storage.
  spiralState.name = document.getElementById("mapName").value;
}
function updateSpiralStatus() {
  const prompt = document.getElementById("zonePrompt");
  const title  = document.getElementById("promptTitle");
  const text   = document.getElementById("promptText");
  if (activeZone === null) {
    prompt.style.display = 'none';
  } else {
    title.textContent = '';
    title.style.display = 'none';
    text.textContent = ZONE_PROMPTS[activeZone];
    prompt.style.display = 'block';
  }
}
function selectZone(i) {
  activeZone = i;
  renderZoneCircles();
  updateSpiralStatus();
}

// ── SQUARE STATE ──────────────────────────────────────────────────────────
let squareState     = { name:"", zones:[{},{},{},{}] };
let squareActiveZone = null;

function squareLoadState() {
  // No persistence — always start with a fresh map each visit.
  while (squareState.zones.length < 4) squareState.zones.push({});
}
function squareSaveState() {
  // Keep in-memory name in sync; nothing is written to storage.
  squareState.name = document.getElementById("mapName").value;
}
function updateSquareStatus() {
  const prompt = document.getElementById("zonePrompt");
  const title  = document.getElementById("promptTitle");
  const text   = document.getElementById("promptText");
  if (squareActiveZone === null) {
    prompt.style.display = 'none';
  } else {
    title.textContent = '';
    title.style.display = 'none';
    text.textContent = SQUARE_ZONE_PROMPTS[squareActiveZone];
    prompt.style.display = 'block';
  }
}
function selectSquareZone(i) {
  squareActiveZone = i;
  renderSquareZones();

// ── SPIRAL SVG BUILDER ────────────────────────────────────────────────────
function buildSpiralSVG() {
  const W = 500, H = 400;
  const cx = W / 2, cy = H / 2 - 10;
  const b = 13;

  // Replace drawn spiral path with PNG image
  const spiralSvg = document.getElementById('spiralSvg');
  // Remove old path if present, add image instead
  let existingImg = document.getElementById('spiralBgImg');
  if (!existingImg) {
    const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    img.setAttribute('id', 'spiralBgImg');
    img.setAttribute('href', '../assets/elements/spiral-3.png');
    img.setAttribute('x', '25'); img.setAttribute('y', '10');
    img.setAttribute('width', '450'); img.setAttribute('height', '380');
    img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    img.style.pointerEvents = 'none';
    spiralSvg.insertBefore(img, spiralSvg.querySelector('#zoneGroup'));
  }
  // Hide old drawn path
  document.getElementById('spiralPath').setAttribute('d', '');

  // Hardcoded positions to match PNG spiral
  // Zone 1: center, Zone 2: bottom right orange, Zone 3: upper area (circled)
  ZONE_POSITIONS = [
    { x: 245, y: 230 },  // center
    { x: 372, y: 288 },  // bottom right orange
    { x: 150, y: 75 },  // upper area
  ];
  renderZoneCircles();
}

function renderZoneCircles() {
  const zoneGroup = document.getElementById('zoneGroup');
  const defs      = document.getElementById('spiralDefs');
  zoneGroup.innerHTML = ''; defs.innerHTML = '';
  const R = 36;
  ZONE_POSITIONS.forEach((pos, i) => {
    const zone = spiralState.zones[i] || {};
    const isActive = activeZone === i;
    if (zone.tint) {
      const gradId = `halo-grad-${i}`;
      const grad = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
      grad.setAttribute('id', gradId); grad.setAttribute('cx','50%'); grad.setAttribute('cy','50%'); grad.setAttribute('r','50%');
      const s1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      s1.setAttribute('offset','0%'); s1.setAttribute('stop-color', zone.tint); s1.setAttribute('stop-opacity','1');
      const s2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      s2.setAttribute('offset','55%'); s2.setAttribute('stop-color', zone.tint); s2.setAttribute('stop-opacity','0.85');
      const s3 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      s3.setAttribute('offset','100%'); s3.setAttribute('stop-color', zone.tint); s3.setAttribute('stop-opacity','0');
      grad.appendChild(s1); grad.appendChild(s2); grad.appendChild(s3); defs.appendChild(grad);
      const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      halo.setAttribute('cx', pos.x); halo.setAttribute('cy', pos.y); halo.setAttribute('r', R + 48);
      halo.setAttribute('fill', `url(#${gradId})`); halo.style.pointerEvents = 'none';
      zoneGroup.appendChild(halo);
    }
    const hasTerrain = !!(zone.terrain && TERRAIN_IMGS[zone.terrain]);
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', pos.x); circle.setAttribute('cy', pos.y); circle.setAttribute('r', R);
    if (hasTerrain) {
      circle.setAttribute('fill', 'transparent');
      circle.setAttribute('stroke', isActive ? '#6579e2' : 'transparent');
    } else {
      circle.setAttribute('fill', isActive ? 'rgba(101,121,226,0.18)' : 'rgba(200,196,180,0.82)');
      circle.setAttribute('stroke', isActive ? '#6579e2' : '#8a7a5a');
    }
    circle.setAttribute('stroke-width', isActive ? '2.5' : '1.5');
    circle.style.cursor = 'pointer';
    zoneGroup.appendChild(circle);
    if (zone.terrain && TERRAIN_IMGS[zone.terrain]) {
      const clipId = `clip-z${i}`;
      const clip = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
      clip.setAttribute('id', clipId);
      const cc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      cc.setAttribute('cx', pos.x); cc.setAttribute('cy', pos.y); cc.setAttribute('r', R - 2);
      clip.appendChild(cc); defs.appendChild(clip);
      const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      img.setAttribute('x', pos.x - R); img.setAttribute('y', pos.y - R);
      img.setAttribute('width', R * 2); img.setAttribute('height', R * 2);
      img.setAttribute('href', TERRAIN_IMGS[zone.terrain]);
      img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      img.setAttribute('clip-path', `url(#${clipId})`); img.style.pointerEvents = 'none';
      zoneGroup.appendChild(img);
    }
    if (!hasTerrain || isActive) {
      const numEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      numEl.setAttribute('x', pos.x);
      numEl.setAttribute('y', pos.y + (hasTerrain ? R - 10 : 5));
      numEl.setAttribute('text-anchor', 'middle'); numEl.setAttribute('dominant-baseline', 'middle');
      numEl.setAttribute('fill', isActive ? '#6579e2' : '#5a4a2a');
      numEl.setAttribute('font-family', '"ZoesHandwriting", cursive');
      numEl.setAttribute('font-size', hasTerrain ? '15' : '26');
      numEl.style.pointerEvents = 'none'; numEl.textContent = i + 1;
      zoneGroup.appendChild(numEl);
    }
    if (zone.feeling) {
      const feelEl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      feelEl.setAttribute('x', pos.x); feelEl.setAttribute('y', pos.y + R + 18);
      feelEl.setAttribute('text-anchor', 'middle'); feelEl.setAttribute('fill', '#2a1e14');
      feelEl.setAttribute('font-family', '"ZoesHandwriting", cursive'); feelEl.setAttribute('font-size', '15');
      feelEl.setAttribute('font-weight', 'bold');
      feelEl.style.pointerEvents = 'none'; feelEl.textContent = zone.feeling;
      zoneGroup.appendChild(feelEl);
    }
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    hit.setAttribute('cx', pos.x); hit.setAttribute('cy', pos.y); hit.setAttribute('r', R + 6);
    hit.setAttribute('fill', 'transparent'); hit.style.cursor = 'pointer';
    hit.addEventListener('click', () => selectZone(i));
    zoneGroup.appendChild(hit);
  });
}

  const squareSvg = document.getElementById('squareSvg');

    const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    img.setAttribute('id', 'squareBgImg');
    img.setAttribute('href', '../assets/elements/square-1.png');
    img.setAttribute('x', '25'); img.setAttribute('y', '10');
    img.setAttribute('width', '450'); img.setAttribute('height', '380');
    img.setAttribute('preserveAspectRatio', 'xMidYMid meet');

}

// ── TERRAIN PALETTE ───────────────────────────────────────────────────────
function buildTerrain() {
  const tp = document.getElementById("terrainPalette");
  TERRAIN.forEach(t => {
    const el = document.createElement("div");
    el.className = "palette-item"; el.id = "terrain-btn-" + t.id;
    el.innerHTML = `<img src="${TERRAIN_IMGS[t.id]}" alt="${t.label}"><div class="palette-item-name">${t.label}</div>`;
    el.addEventListener("click", () => selectTerrain(t, el));
    tp.appendChild(el);
  });
}

function selectTerrain(t, el) {
  document.querySelectorAll(".palette-item").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  if (currentMode === 'spiral') {
    if (activeZone !== null) { spiralState.zones[activeZone].terrain = t.id; spiralSaveState(); renderZoneCircles(); }
    return;
  }
  if (currentMode === 'square') {
    if (squareActiveZone !== null) { squareState.zones[squareActiveZone].terrain = t.id; squareSaveState(); renderSquareZones(); }
    return;
  }
}

// ── WEATHER / FEELINGS ────────────────────────────────────────────────────
function buildWeather() {
  const wc = document.getElementById("weatherCategories");
  WEATHER_CATS.forEach(cat => {
    const section = document.createElement("div");
    section.className = `weather-category ${cat.cls}`;
    const header = document.createElement("div");
    header.className = "weather-cat-header"; header.textContent = cat.label;
    const chips = document.createElement("div"); chips.className = "feeling-chips";
    cat.feelings.forEach(feeling => {
      const chip = document.createElement("div");
      chip.className = "feeling-chip"; chip.textContent = feeling;
      chip.addEventListener("click", () => selectFeeling(feeling, cat, chip));
      chips.appendChild(chip);
    });
    section.appendChild(header); section.appendChild(chips); wc.appendChild(section);
  });
}

function selectFeeling(feeling, cat, el) {
  document.querySelectorAll(".feeling-chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  if (currentMode === 'spiral') {
    if (activeZone !== null) {
      spiralState.zones[activeZone].feeling = feeling;
      spiralState.zones[activeZone].tint    = cat.tint;
      spiralState.zones[activeZone].cat     = cat.id;
      spiralSaveState(); renderZoneCircles();
    }
    return;
  }
  if (currentMode === 'square') {
    if (squareActiveZone !== null) {
      squareState.zones[squareActiveZone].feeling = feeling;
      squareState.zones[squareActiveZone].tint    = cat.tint;
      squareState.zones[squareActiveZone].cat     = cat.id;
      squareSaveState(); renderSquareZones();
    }
    return;
  }
}

// ── CLEAR ─────────────────────────────────────────────────────────────────
function clearMap() {
  document.querySelectorAll(".feeling-chip").forEach(c => c.classList.remove("active"));
  document.querySelectorAll(".palette-item").forEach(p => p.classList.remove("active"));
  document.getElementById("mapName").value = "";
  if (currentMode === 'spiral') {
    spiralState = { name:"", zones:[{},{},{}] }; spiralSaveState();
    activeZone = null; renderZoneCircles(); updateSpiralStatus();
  } else {
    squareState = { name:"", zones:[{},{},{},{}] }; squareSaveState();
    squareActiveZone = null; renderSquareZones(); updateSquareStatus();
  }
}

// ── REPORT MAP STATE TO MATRIX ────────────────────────────────────────────
function reportMapState() {
  const isSpiral = currentMode === 'spiral';
  const mapState = isSpiral ? spiralState : squareState;
  const mapType  = currentMode;
  const mapName  = (document.getElementById("mapName").value || mapState.name || '').trim();
  const mapData  = { ...mapState, type: mapType };

  if (!mapState.zones.some(z => z.terrain)) {
    try { window.parent.postMessage({ type: 'map_save_failed', reason: 'add some terrain to your map first' }, '*'); } catch(e) {}
    return;
  }
  if (!mapName) {
    try { window.parent.postMessage({ type: 'map_save_failed', reason: 'name your dream first' }, '*'); } catch(e) {}
    return;
  }
  try { window.parent.postMessage({ type: 'map_ready', map_name: mapName, map_type: mapType, map_data: mapData }, '*'); } catch(e) {}
}

spiralLoadState();
squareLoadState();
buildTerrain();
buildWeather();
buildSpiralSVG();
buildSquareSVG();
document.getElementById("mapName").value = spiralState.name || "";
updateSpiralStatus();

// ── Listen for matrix triggering the state report ─────────
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'save_map') {
    reportMapState();
  }
});
</script>
