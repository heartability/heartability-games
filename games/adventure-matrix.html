<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventure Matrix — Heartability</title>
<style>
@font-face { font-family:"ZoesHandwriting"; src:url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype"); }
@font-face { font-family:"PFPixelscript";  src:url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype"); }

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --back-wall:  #f1ebe4;
  --side-col:   #e8e4dc;
  --line-col:   #111;
  --blue:       #6579e2;
  --aqua:       #83d2e6;
  --bw-top:    9%;  --bw-left:  15%;
  --bw-width: 70%;  --bw-height:70%;
}

html, body { width:100vw; height:100dvh; overflow:hidden; user-select:none; background:var(--side-col); }

/* ── ROOM LINES ── */
.room-lines { position:fixed; inset:0; z-index:2; pointer-events:none; }
.room-lines svg { width:100%; height:100%; display:block; overflow:visible; }

/* ── BACK WALL ── */
.back-wall {
  position:fixed;
  top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height);
  background:var(--back-wall);
  border:2px solid var(--line-col);
  z-index:3;
}

/* ── CONTENT PANEL — sits on back wall ── */
.content-panel {
  position:fixed;
  top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height);
  z-index:10;
  display:none;
  flex-direction:column;
  overflow:hidden;
}
.content-panel.active { display:flex; }

/* ── IFRAME PANEL ── */
.game-iframe {
  width:100%; height:100%;
  border:none; display:block;
}
/* Black border when back wall shows a game */
.content-panel.iframe-mode {
  border:3px solid #111;
  box-shadow: inset 0 0 0 2px #83d2e6;
}

/* ── STEP PANELS (map grid, phase select) ── */
.step-panel {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items: center;
  overflow-y: auto; padding:20px;
  font-family:var(--font-hand);
}
.step-header {
  width: 100%;
}

/* Map grid — centered in the step panel */
.map-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(120px, 180px));
  gap: 12px;
  padding: 4px;
  justify-content: center;
}
@media (max-width:600px) { .map-grid { grid-template-columns: repeat(2, 1fr); } }

.map-slot {
  border: 2px solid #ccc; background: #fdf6e3;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: stretch;
  padding: 8px 8px 6px; gap: 5px;
  font-family: var(--font-hand); text-align: center;
  transition: border-color .15s, box-shadow .12s, transform .1s;
  position: relative;
  aspect-ratio: 4/5;
}
.map-slot:hover { border-color: var(--blue); box-shadow: 2px 2px 0 var(--blue); transform: translateY(-2px); }
.map-slot.empty { border-style: dashed; border-color: #e0e0e0; cursor: default; background: transparent; }
.map-slot.empty:hover { transform: none; box-shadow: none; border-color: #e0e0e0; }

/* Wall nav buttons — archive / profile links inside back wall */
.wall-nav-btn {
  background: none;
  border: 1.5px solid var(--blue);
  font-family: var(--font-hand);
  font-size: clamp(11px, 1.1vw, 13px);
  color: var(--blue);
  padding: 4px 10px;
  cursor: pointer;
  transition: background .12s, color .12s;
}
.wall-nav-btn:hover { background: var(--blue); color: #fff; }

/* Add new button — inside back wall, bottom right corner */
.add-new-btn {
  position: fixed;
  bottom: calc(21% + 12px);
  right: calc(15% + 12px);
  z-index: 20;
  padding: 10px 18px;
  background: var(--blue);
  border: 2px solid #4a5bc4;
  box-shadow: 3px 3px 0 #3a4aaa;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.4vw, 16px);
  color: #fff;
  cursor: pointer;
  transition: all .05s;
  display: none;
}
.add-new-btn.visible { display: block; }
.add-new-btn:hover { background: #4a5bc4; }
.add-new-btn:active { box-shadow: none; transform: translate(3px,3px); }
.slot-name    { font-size: 12px; color: #333; line-height: 1.2; word-break: break-word; font-weight: 600; flex-shrink: 0; }
.slot-updated { font-size: 10px; color: #bbb; flex-shrink: 0; }
.slot-preview {
  flex: 1; min-height: 0; overflow: hidden;
  background: #e8e0c8; border: 1px solid #c8b88a;
}
.slot-preview svg { width: 100%; height: 100%; display: block; }

/* Delete button on map slot */
.slot-delete {
  position:absolute; top:5px; right:6px;
  font-size:13px; color:#ccc; background:none; border:none;
  cursor:pointer; line-height:1; padding:2px 4px;
  transition:color .12s; z-index:2;
}
.slot-delete:hover { color:#E8478B; }

/* Phase select */
.phase-wrap {
  flex:1; position:relative; display:flex; gap:10px;
  align-items:stretch; overflow:hidden;
}
.phase-map-area {
  flex:1 1 58%; min-width:0; position:relative;
  background:#e8e0c8;
  border:2px solid #8a7a5a; border-right-color:#5a4a2a; border-bottom-color:#5a4a2a;
  border-left-color:#c8b88a; border-top-color:#c8b88a;
  overflow:hidden;
}
.phase-map-area svg { width:100%; height:100%; display:block; }

/* Phase key — full-height right column (no longer overlapping the map) */
.phase-key {
  flex:0 0 42%; min-width:230px; max-width:440px;
  align-self:stretch; max-height:100%;
  background:rgba(245,240,234,0.97);
  border:2px solid #8a7a5a;
  padding:14px 16px; overflow-y:auto;
  display:flex; flex-direction:column;
  font-family:var(--font-hand);
}
.phase-key-title { font-size:12px; color:#aaa; letter-spacing:.3px; margin-bottom:8px; }
.phase-key-item {
  display:flex; gap:8px; align-items:flex-start;
  padding:7px 10px; margin-bottom:5px;
  border:1.5px solid #ccc; background:#fdf6e3;
  cursor:pointer; font-size:13px; color:#555; line-height:1.4;
  transition:all .1s;
}
.phase-key-item:hover { border-color:var(--blue); color:var(--blue); background:#f0edfa; }
.phase-key-item.selected { border-color:var(--blue); background:var(--blue); color:#fff; box-shadow:2px 2px 0 #3a4aaa; }
.phase-key-num { font-size:11px; opacity:.55; min-width:14px; padding-top:2px; }

.begin-btn {
  padding:12px 18px; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:16px; color:#fff;
  cursor:pointer; margin-top:10px; transition:all .05s; width:100%;
}
.begin-btn:hover { background:#4a5bc4; }
.begin-btn:active { box-shadow:none; transform:translate(2px,2px); }
.begin-btn:disabled { opacity:.38; cursor:not-allowed; transform:none !important; }

/* Step header bar */
.step-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; flex-shrink:0;
}
.step-header-title { font-size:17px; color:#333; }
.step-back {
  font-size:14px; color:var(--blue); cursor:pointer;
}
.step-back:hover { text-decoration:underline; }

/* Loading state */
.loading-msg { font-family:var(--font-hand); font-size:15px; color:#aaa; text-align:center; padding:40px; }

/* ── NAV BAR ── */
.room-nav {
  position:fixed; top:0; left:0; right:0; height:44px;
  background:#c9fff5; border-bottom:2px solid var(--line-col);
  z-index:200; display:flex; align-items:center;
  justify-content:space-between; padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(14px,1.6vw,20px); color:#111;
}
.nav-btn { cursor:pointer; padding:4px 8px; border-radius:2px; transition:background .15s; }
.nav-btn:hover { background:rgba(0,0,0,.08); }

/* ── HEART CHARACTER ── */
@keyframes idle-pulse {
  0%,100% { transform:translateY(0) rotate(-2deg) scale(1); }
  50%      { transform:translateY(-8px) rotate(2deg) scale(1.03); }
}
.char-heart {
  position:fixed; left:4vw; bottom:6vh;
  width:clamp(100px,14vw,220px);
  z-index:20; cursor:default;
}
.char-heart .char-img {
  display:block; width:100%; height:auto;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.28));
  animation:idle-pulse 3.6s ease-in-out 1s infinite;
}

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position:absolute; left:calc(100% - 8px); bottom:60%;
  min-width:clamp(160px,18vw,260px); max-width:clamp(180px,22vw,300px);
  background:#fff; border:2px solid #000; border-radius:50%;
  padding:14px 20px; font-family:var(--font-hand);
  font-size:clamp(11px,1.3vw,15px); color:#000; text-align:center;
  line-height:1.5; filter:drop-shadow(1px 3px 5px rgba(0,0,0,.2));
  z-index:21;
}
.bubble-btns { display:none; } /* buttons moved to back wall */

/* ── WALL BUTTONS — centered on the back wall ── */
.wall-btns {
  position:fixed;
  top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height);
  z-index:8;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  pointer-events:none;
}
.wall-btns.active { display:flex; }
.wall-btn {
  pointer-events:all;
  padding:14px 40px;
  background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:clamp(15px,1.8vw,20px); color:#fff;
  cursor:pointer; transition:all .05s; min-width:220px; text-align:center;
}
.wall-btn:hover { background:#4a5bc4; }
.wall-btn:active { box-shadow:none; transform:translate(3px,3px); }
.wall-btn.secondary {
  background:none; border-color:#ccc; color:#999; box-shadow:none;
}
.wall-btn.secondary:hover { border-color:var(--blue); color:var(--blue); }

/* ── SAVE & CONTINUE BUTTON — floats below back wall ── */
.save-continue-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(21% - 44px); /* floor area below back wall */
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 15;
  pointer-events: none;
}
.save-continue-bar.visible { display: flex; }

.save-continue-btn {
  pointer-events: all;
  padding: 14px 40px;
  background: var(--blue);
  border: 2px solid #4a5bc4;
  box-shadow: 3px 3px 0 #3a4aaa;
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.8vw, 20px);
  color: #fff;
  cursor: pointer;
  transition: all .05s;
  letter-spacing: .3px;
}
.save-continue-btn:hover { background: #4a5bc4; }
.save-continue-btn:active { box-shadow: none; transform: translate(3px, 3px); }
.save-continue-btn:disabled {
  opacity: .38; cursor: not-allowed;
  transform: none !important; box-shadow: 3px 3px 0 #3a4aaa;
}

.save-status-bar {
  position: fixed;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-hand);
  font-size: 14px;
  color: #6ab86a;
  z-index: 16;
  pointer-events: none;
}

/* ── MOBILE ── */
@media (max-width:768px) {
  :root {
    --bw-top:    44px; /* flush under nav */
    --bw-left:   0%;
    --bw-width:  100%;
    --bw-height: calc(100dvh - 44px);
  }
  /* Hide perspective lines on mobile — no side walls */
  .room-lines { display:none; }
  .back-wall { border-left:none; border-right:none; border-top:none; }
  .char-heart { display:none; }
  .thought-bubble { font-size:clamp(11px,3vw,14px); min-width:140px; left:calc(100% - 6px); }
  .phase-key { width:180px; font-size:12px; }
  .map-grid { grid-template-columns:repeat(2,1fr); }
  .save-continue-bar { height:auto; padding:10px 0; bottom:0; z-index:30; }
  .add-new-btn { bottom:12px; right:12px; }
  .journal-wall-overlay {
    top: 80px !important;
    left: 16px !important;
    right: 16px !important;
    width: auto !important;
    height: auto !important;
    bottom: 80px !important;
    border-radius: 4px !important;
  }
}

/* ── MOBILE PHASE SELECT ── */
.phase-key-drawer {
  position:absolute; bottom:0; left:0; right:0;
  background:#f5f0ea; border-top:2px solid #bbb;
  max-height:0; overflow:hidden;
  transition:max-height .35s ease;
  z-index:5;
}
.phase-key-drawer.open { max-height:80vh; overflow-y:auto; }
.phase-select-btn {
  position:absolute; bottom:12px; right:12px; z-index:6;
  padding:10px 16px;
  background:var(--blue); border:2px solid #4a5bc4;
  box-shadow:2px 2px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:14px; color:#fff;
  cursor:pointer; transition:all .05s;
}
.phase-select-btn:hover { background:#4a5bc4; }
.phase-select-btn:active { box-shadow:none; transform:translate(2px,2px); }
.phase-drawer-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; border-bottom:1px solid #ddd;
  font-family:var(--font-hand); font-size:13px; color:#aaa;
}
.phase-drawer-close {
  cursor:pointer; font-size:18px; color:#bbb;
  padding:2px 4px; transition:color .15s;
}
.phase-drawer-close:hover { color:#444; }
.login-modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5);
  z-index:300; display:none; align-items:center; justify-content:center;
}
.login-modal-overlay.open { display:flex; }
.login-modal-window {
  width:min(92vw,440px); background:#f5f0ea;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.35);
  overflow:hidden;
}
.login-modal-titlebar {
  height:38px; background:#e8e3da; border-bottom:2px solid #bbb;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; font-family:var(--font-hand); font-size:15px; color:#555;
}
.login-modal-close {
  cursor:pointer; font-size:20px; color:#bbb; padding:2px 4px; transition:color .15s;
}
.login-modal-close:hover { color:#444; }

/* Login form tabs */
.lm-tab-row {
  display:flex; border-bottom:2px solid #ccc; background:#e8e3da;
}
.lm-tab {
  flex:1; padding:10px; font-family:var(--font-hand); font-size:15px;
  text-align:center; cursor:pointer; color:#888; background:none; border:none;
  border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .15s;
}
.lm-tab.active { color:var(--blue); border-bottom-color:var(--blue); }

/* Login form body */
.lm-body { padding:20px 24px 16px; display:flex; flex-direction:column; gap:12px; }
.lm-form { display:none; flex-direction:column; gap:12px; }
.lm-form.active { display:flex; }
.lm-field { display:flex; flex-direction:column; gap:4px; }
.lm-label { font-family:var(--font-hand); font-size:12px; color:#888; }
.lm-input {
  font-family:var(--font-hand); font-size:15px; color:#222; background:#f5f0ea;
  border:1.5px solid #bbb; padding:8px 12px; outline:none; transition:border-color .15s;
  user-select:text;
}
.lm-input:focus { border-color:var(--blue); }
.lm-btn {
  padding:10px 18px; background:var(--blue); border:2px solid #4a5bc4;
  box-shadow:2px 2px 0 #3a4aaa; font-family:var(--font-hand); font-size:15px;
  color:#fff; cursor:pointer; transition:all .05s; margin-top:4px;
}
.lm-btn:hover { background:#4a5bc4; }
.lm-btn:active { box-shadow:none; transform:translate(2px,2px); }
.lm-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.lm-msg { font-family:var(--font-hand); font-size:12px; padding:6px 10px; display:none; }
.lm-msg.error   { display:block; color:#c0392b; background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.2); }
.lm-msg.success { display:block; color:#2d7a4f; background:rgba(45,122,79,.08); border:1px solid rgba(45,122,79,.2); }
.lm-footer { text-align:center; padding:0 24px 14px; font-family:var(--font-hand); font-size:11px; color:#aaa; }

/* ── JOURNAL WINDOW on back wall ── */
.journal-wall-overlay {
  position:fixed;
  top:calc(var(--bw-top) + 4%); left:calc(var(--bw-left) + 5%);
  width:calc(var(--bw-width) - 10%); height:calc(var(--bw-height) - 8%);
  z-index:20; display:none; flex-direction:column;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 4px 8px 24px rgba(0,0,0,.25);
  background:#e8e3da; border-radius:2px; overflow:hidden;
}
.journal-wall-overlay.open { display:flex; }

/* ── JOURNAL INLINE (step panel) ── */
.journal-inline {
  width:100%; height:100%; display:flex; overflow:hidden;
}
.journal-spine-inline {
  flex-shrink:0; width:18px; background:#e8e3da;
  border-right:1.5px solid #c8b88a;
  display:flex; flex-direction:column; justify-content:space-around;
  align-items:center; padding:12px 0;
}
.journal-spine-ring {
  width:14px; height:14px; border:2.5px solid #8a7a5a;
  border-radius:50%; background:#e8e4dc; flex-shrink:0;
}
.journal-page {
  flex:1; background:#f1ece4; padding:16px 20px 12px 16px;
  display:flex; flex-direction:column; gap:8px;
  background-image:linear-gradient(to bottom,transparent calc(100% - 1px),rgba(101,121,226,.1) 1px);
  background-size:100% 32px; background-position:0 52px; overflow:hidden;
}
.journal-page-header {
  border-bottom:1px solid rgba(101,121,226,.2); padding-bottom:6px; flex-shrink:0;
  font-family:var(--font-hand); font-size:clamp(12px,1.4vw,16px); color:#5a4a2a;
}
.journal-textarea {
  flex:1; resize:none; border:none; outline:none; background:transparent;
  font-family:var(--font-hand); font-size:clamp(13px,1.4vw,17px);
  color:#2a1e14; line-height:2; overflow-y:auto; user-select:text;
  caret-color:var(--blue);
}
.journal-textarea::placeholder { color:rgba(138,122,90,.35); font-style:italic; }
.journal-privacy {
  font-family:var(--font-hand); font-size:clamp(9px,.85vw,11px);
  color:#ccc; border-top:1px solid #e8e0d0; padding-top:6px; flex-shrink:0;
}

/* ── ADVENTURE MATRIX ─────────────────────────────────────
   Portable: this block + buildAdventureMatrix() can be lifted
   into the archive page so the moodboard renders identically.   */
.matrix-panel { padding:0; overflow:hidden; justify-content:flex-start; align-items:stretch; position:relative; }
.matrix-date {
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  font-family:var(--font-hand); font-size:clamp(13px,1.5vw,17px); color:#8a7a5a; z-index:6;
}
.matrix-archive-btn {
  position:absolute; top:8px; right:12px; z-index:6;
  font-family:var(--font-hand); font-size:clamp(12px,1.3vw,15px);
  color:#fff; background:var(--blue); border:2px solid #4a5bc4;
  box-shadow:2px 2px 0 #3a4aaa; padding:5px 14px; cursor:pointer; transition:all .05s;
}
.matrix-archive-btn:hover { background:#4a5bc4; }
.matrix-archive-btn:active { box-shadow:none; transform:translate(2px,2px); }

/* Header row holds the date + archive button, above the framed matrix */
.matrix-header { position:relative; height:34px; flex-shrink:0; }
/* Framed container — insets the matrix so it doesn't bleed into the wall edges */
.matrix-frame {
  flex:1; min-height:0; position:relative;
  margin:2px 20px 18px; overflow:hidden;
  border:2px solid var(--blue);
  box-shadow: 0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,0.35);
}

.adv-matrix { position:absolute; inset:0; overflow:hidden; }
.adv-grid {
  position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(184,168,138,.13) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(184,168,138,.13) 1px, transparent 1px);
  background-size:38px 38px;
}
.adv-axis { position:absolute; background:rgba(184,168,138,.5); pointer-events:none; }
.adv-axis-x { left:6%; right:6%; top:50%; height:1.5px; }
.adv-axis-y { top:7%; bottom:7%; left:50%; width:1.5px; }
.adv-axlabel {
  position:absolute; font-family:var(--font-hand); color:#5a4a2a;
  letter-spacing:.5px; pointer-events:none; font-size:clamp(14px,1.9vw,23px); z-index:4;
}
.adv-top    { top:2.5%;  left:50%; transform:translateX(-50%); }
.adv-bottom { bottom:2%; left:50%; transform:translateX(-50%); }
.adv-left   { left:2%;  top:50%; transform:translateY(-50%) rotate(180deg); writing-mode:vertical-rl; }
.adv-right  { right:2%; top:50%; transform:translateY(-50%); writing-mode:vertical-rl; }

.adv-item { position:absolute; z-index:3; text-align:center; }
.adv-cap  { font-family:var(--font-hand); font-size:clamp(10px,1.1vw,13px); color:#8a7a5a; margin-top:3px; }

.adv-map { width:clamp(150px,20vw,240px); }
.adv-map-svg { width:100%; aspect-ratio:5/4; }
.adv-map-svg svg { width:100%; height:100%; }

.adv-bingo { width:clamp(130px,16vw,200px); }

// ── SAVE & CONTINUE — progress tracker owns all saving ─────────
async function saveAndContinue() {
  const btn = document.getElementById('save-continue-btn');
  btn.disabled = true;
  btn.textContent = 'saving...';

  // Journal step — save notes directly
  if (currentStep === 'journal') {
    await saveJournalEntry();
    return;
  }

  const iframe = document.getElementById('game-iframe');
  if (!iframe) { btn.disabled = false; return; }

  if (currentStep === 'map') {
    // Tell treasure-map to run its save logic; response comes via map_saved postMessage
    iframe.contentWindow.postMessage({ type: 'save_map' }, '*');
  } else {
    // Request current state from character builder or bingo
    iframe.contentWindow.postMessage({ type: 'request_state' }, '*');
    // Fallback: re-enable if no response in 5s
    const label = currentStep === 'character'
      ? 'save character &amp; continue →'
      : 'save &amp; finish →';
    clearTimeout(window._saveFallback);
    window._saveFallback = setTimeout(() => {
      const b = document.getElementById('save-continue-btn');
      if (b && b.disabled) {
        b.disabled = false;
        b.innerHTML = label;
        showRoomStatus('something went wrong — try again', '#E8478B');
      }
    }, 5000);
  }
}

// ── ZONE PROMPTS ──────────────────────────────────────────
const SPIRAL_PROMPTS = [
  "phase one — what does it feel like to begin?",
  "phase two — what does it feel like when you take a big step forward?",
  "phase three — what does it feel like when you are tested?",
];
const SQUARE_PROMPTS = [
  "corner one — what does it feel like to be a beginner?",
  "corner two — what does it feel like to make a mistake?",
  "corner three — what does it feel like to recommit?",
  "corner four — what does it feel like to take a step forward?",
];

// Spiral zone polar positions (same as treasure-map)
const SPIRAL_THETA = [0.5, 9.4, 11.5, 13.3, 14.9];
const SQUARE_POS   = [ {x:160,y:114},{x:340,y:114},{x:340,y:286},{x:160,y:286} ];
const SQUARE_LABELS= ['1','2','3','4'];
const TERRAIN_IMGS = {
  dunes:"../assets/elements/maps/dunes.png", forest:"../assets/elements/maps/forest.png",
  meadow:"../assets/elements/maps/meadow.png", mountains:"../assets/elements/maps/mountains.png",

};

async function stepLoadGame() {
  if (!currentUser) {
    setBubble('log in to load your maps', []);
    showAddNew(false);
    showLoginModal();
    return;
  }
  setBubble('which dream are we chasing?', []);
  setSaveBtnVisible(false);
  showAddNew(true);

  try {
    const { data } = await sb.from('games').select('*')
      .eq('user_id', currentUser.id).eq('status','active')
      .order('updated_at',{ascending:false}).limit(8);

  } catch(e){}
  renderMapGrid(games);

function formatUpdated(dateStr) {
  if (!dateStr) return '';
  return 'last updated ' + new Date(dateStr).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

// ── SHARED SPIRAL RENDERER ────────────────────────────────
// Mirrors the treasure-map game: spiral-3.png background, 3 zones at fixed
// positions, full radial-halo tint, clipped terrain, bold feeling labels.
// interactive=true adds phase numbers + click targets (phase-select screen);
// the matrix and map thumbnails call it read-only (no numbers, no clicks).
const SPIRAL_ZONE_POS = [ {x:245,y:230}, {x:372,y:288}, {x:150,y:75} ];
function spiralZonesSVG(zones, opts){
  zones = zones || []; opts = opts || {};
  const interactive = !!opts.interactive;
  const R = 36;
  let defs = '<defs>', body = '', hits = '';
  SPIRAL_ZONE_POS.forEach((p,i) => {
    const z = zones[i] || {};
    const hasTerrain = !!(z.terrain && TERRAIN_IMGS[z.terrain]);
    if (z.tint) {
      defs += `<radialGradient id="sg${i}" cx="50%" cy="50%" r="50%">`
        + `<stop offset="0%" stop-color="${z.tint}" stop-opacity="1"/>`
        + `<stop offset="55%" stop-color="${z.tint}" stop-opacity=".85"/>`
        + `<stop offset="100%" stop-color="${z.tint}" stop-opacity="0"/></radialGradient>`;
      body += `<circle cx="${p.x}" cy="${p.y}" r="${R+48}" fill="url(#sg${i})" pointer-events="none"/>`;
    }
    if (hasTerrain) {
      defs += `<clipPath id="sc${i}"><circle cx="${p.x}" cy="${p.y}" r="${R-2}"/></clipPath>`;
      body += `<image x="${p.x-R}" y="${p.y-R}" width="${R*2}" height="${R*2}" href="${TERRAIN_IMGS[z.terrain]}" preserveAspectRatio="xMidYMid meet" clip-path="url(#sc${i})" pointer-events="none"/>`;
    } else {
      body += `<circle cx="${p.x}" cy="${p.y}" r="${R}" fill="rgba(200,196,180,.82)" stroke="#8a7a5a" stroke-width="1.5" pointer-events="none"/>`;
      if (interactive) body += `<text x="${p.x}" y="${p.y+5}" text-anchor="middle" dominant-baseline="middle" fill="#5a4a2a" font-family="ZoesHandwriting,cursive" font-size="26" pointer-events="none">${i+1}</text>`;
    }
    if (z.feeling) {
      body += `<text x="${p.x}" y="${p.y+R+18}" text-anchor="middle" fill="#2a1e14" font-family="ZoesHandwriting,cursive" font-size="15" font-weight="bold" pointer-events="none">${z.feeling}</text>`;
    }
    if (interactive) {
      hits += `<circle class="zone-hit" cx="${p.x}" cy="${p.y}" r="${R+8}" fill="transparent" style="cursor:pointer" onclick="selectPhase(${i})"/>`;
    }
  });
  defs += '</defs>';
  return `<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">`
    + defs
    + `<line x1="250" y1="0" x2="250" y2="400" stroke="rgba(138,122,90,.15)" stroke-width="1"/>`
    + `<line x1="0" y1="200" x2="500" y2="200" stroke="rgba(138,122,90,.15)" stroke-width="1"/>`
    + `<image href="../assets/elements/spiral-3.png" x="25" y="10" width="450" height="380" preserveAspectRatio="xMidYMid meet" style="pointer-events:none;"/>`
    + body + hits + `</svg>`;
}

function buildPreviewSVG(mapType, zones) {
  const SPIRAL_THETA = [0.5, 9.4, 11.5, 13.3, 14.9];
  const SQUARE_POS   = [{x:160,y:114},{x:340,y:114},{x:340,y:286},{x:160,y:286}];
  const R = 22;

  if (mapType === 'square') {
    let circles = '';
    SQUARE_POS.forEach((p, i) => {
      const z = zones[i] || {};
      const fill = z.tint || 'rgba(200,196,180,0.85)';
      circles += `<circle cx="${p.x}" cy="${p.y}" r="${R}" fill="${fill}" stroke="#8a7a5a" stroke-width="1.2"/>`;
      if (z.feeling) circles += `<text x="${p.x}" y="${p.y+R+11}" text-anchor="middle" fill="#5a4a2a" font-family="ZoesHandwriting,cursive" font-size="10">${z.feeling}</text>`;
    });
    return `<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
      <image href="../assets/elements/square-1.png" x="25" y="10" width="450" height="380" preserveAspectRatio="xMidYMid meet" style="pointer-events:none;"/>
      ${circles}
    </svg>`;
  }

  // Spiral — shared renderer (read-only: full tint, terrain, feelings; no numbers)
  return spiralZonesSVG(zones, { interactive:false });
}

function renderMapGrid(games) {
  let slots = '';
  for (let i = 0; i < 8; i++) {
    const g = games[i];
    if (g) {
      const zones   = (g.map_data || {}).zones || [];
      const preview = buildPreviewSVG(g.map_type || 'spiral', zones);
      const updated = formatUpdated(g.updated_at);
      const safeName = (g.map_name || 'untitled').replace(/'/g, "\\'");
      slots += `<div class="map-slot" onclick="selectMap('${g.id}')">
        <button class="slot-delete" title="delete map"
          onclick="event.stopPropagation(); deleteMap('${g.id}','${safeName}')">×</button>
        <div class="slot-name">${g.map_name || 'untitled'}</div>
        <div class="slot-preview">${preview}</div>
        ${updated ? `<div class="slot-updated">${updated}</div>` : ''}
      </div>`;
    } else {
      slots += `<div class="map-slot empty"></div>`;
    }
  }

  const html = `<div class="step-panel">
    <div class="step-header">
      <span class="step-header-title">your maps</span>
      <div style="display:flex;gap:6px;">
        <button class="wall-nav-btn" onclick="window.location.href='archive.html'">archive</button>
        <button class="wall-nav-btn" onclick="window.location.href='../users/profile.html'">my profile</button>
      </div>
    </div>
    <div class="map-grid">${slots}</div>
  </div>`;
  showPanel(html);
}

// ── STEP 3: SELECT MAP → PHASE SELECT ────────────────────
async function selectMap(gameId) {
  let game = null;
  try {
    const { data } = await sb.from('games').select('*').eq('id',gameId).single();
    game = data;
  } catch(e){}
  if (!game) return;
  activeGameId   = gameId;
  activeGameData = game;
  activePhase    = null;
  stepPhaseSelect();
}

function stepPhaseSelect() {
  if (!activeGameData) return;
  showAddNew(false);
  const mapType = activeGameData.map_type || 'spiral';
  const mapData = activeGameData.map_data || {};
  const zones   = mapData.zones || [];
  const prompts = mapType === 'square' ? SQUARE_PROMPTS : SPIRAL_PROMPTS;
  const zoneCount = mapType === 'square' ? 4 : 3;

  setBubble(`what are you navigating today?`, []);
  setSaveBtnVisible(false);

  const svgContent = mapType === 'square'
    ? buildSquareSVG(zones)
    : buildSpiralSVG(zones);

  let keyItems = '';
  for (let i=0; i<zoneCount; i++) {
    const label = mapType === 'square' ? SQUARE_LABELS[i] : (i+1);
    keyItems += `<div class="phase-key-item" id="key-${i}" onclick="selectPhase(${i})">
      <span class="phase-key-num">${label}.</span>
      <span>${prompts[i]}</span>
    </div>`;
  }

  const isMobile = window.innerWidth <= 768;

  const html = `<div class="step-panel" style="padding:12px;">
    <div class="step-header">
      <span class="step-back" onclick="stepLoadGame()">← back</span>
      <span class="step-header-title">${activeGameData.map_name||'your map'}</span>
      <span></span>
    </div>
    <div class="phase-wrap" style="position:relative;">
      <div class="phase-map-area" id="phase-map-area" style="${isMobile ? 'flex:1;' : ''}">
        ${svgContent}
      </div>
      ${isMobile ? `
        <!-- Mobile: floating button + bottom drawer -->
        <button class="phase-select-btn" id="phase-select-btn" onclick="openPhaseDrawer()">
          select phase →
        </button>
        <div class="phase-key-drawer" id="phase-key-drawer">
          <div class="phase-drawer-header">
            <span>where are you today?</span>
            <span class="phase-drawer-close" onclick="closePhaseDrawer()">×</span>
          </div>
          <div style="padding:10px 12px;">
            ${keyItems}
            <button class="begin-btn" id="begin-btn" disabled onclick="stepBegin()">begin →</button>
          </div>
        </div>
      ` : `
        <!-- Desktop: side-by-side key -->
        <div class="phase-key">
          <div class="phase-key-title">where are you today?</div>
          ${keyItems}
          <button class="begin-btn" id="begin-btn" disabled onclick="stepBegin()">begin →</button>
        </div>
      `}
    </div>
  </div>`;
  showPanel(html);
}

function openPhaseDrawer() {
  document.getElementById('phase-key-drawer')?.classList.add('open');
  const btn = document.getElementById('phase-select-btn');
  if (btn) btn.style.display = 'none';
}
function closePhaseDrawer() {
  document.getElementById('phase-key-drawer')?.classList.remove('open');
  const btn = document.getElementById('phase-select-btn');
  if (btn) btn.style.display = '';
}

function selectPhase(idx) {
  activePhase = `zone_${idx+1}`;
  document.querySelectorAll('.phase-key-item').forEach((el,i) =>
    el.classList.toggle('selected', i===idx));
  // Highlight zone circle in SVG
  document.querySelectorAll('.zone-hit').forEach((el,i) => {
    const circle = document.getElementById(`zone-circle-${i}`);
    if (circle) circle.setAttribute('stroke', i===idx ? '#6579e2' : 'transparent');
    const bg = document.getElementById(`zone-bg-${i}`);
    if (bg) bg.setAttribute('fill', i===idx ? 'rgba(101,121,226,0.25)' : 'rgba(200,196,180,0)');
  });
  document.getElementById('begin-btn').disabled = false;
  // On mobile, keep drawer open so user can tap begin
  if (window.innerWidth <= 768) openPhaseDrawer();
}

// ── STEP 4: BEGIN → CHARACTER BUILDER ────────────────────
function stepBegin() {
  if (!activePhase) return;
  currentStep = 'character';
  setBubble('who do you feel like today?', []);
  const src  = `../games/infinity-mirror.html?game_id=${activeGameId}&phase=${activePhase}&loop=true&mode=cloud`;
  showIframe(src);
  setSaveBtnVisible(true, 'loading...');
  document.getElementById('save-continue-btn').disabled = true;

// ── STEP 5: CHARACTER DONE → BINGO ───────────────────────
function stepBingo() {
  currentStep = 'bingo';
  setBubble('how full is your heart meter?', []);

function stepJournal() {

function skipJournal() {

}

async function saveJournalEntry() {
  // Tell the trail-notes iframe to save, then wait for journal_saved response
  const iframe = document.getElementById('game-iframe');
  if (iframe) {

// Deterministic string-seeded RNG so a given day always scatters the same way.
function _seedRand(str){
  let h = 1779033703 ^ (str ? str.length : 0);
  for (let i=0; i<(str||'').length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h<<13)|(h>>>19); }
  let s = h>>>0;
  return function(){ s = Math.imul(s ^ (s>>>15), 2246822507); s = Math.imul(s ^ (s>>>13), 3266489909); s ^= s>>>16; return (s>>>0)/4294967296; };
}
function _escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _firstWords(t,n){ if(!t) return ''; const w=t.trim().split(/\s+/); return w.slice(0,n).join(' ') + (w.length>n ? '…' : ''); }

function _buildCharStack(charState){
  if(!charState) return '';
  // Saved state stores bare IDs (e.g. "body_pink"); resolve each to its full-canvas PNG.
  // A value already containing "/" is treated as a ready URL (forward-compatible).
  const resolve = v => !v ? null
    : (typeof v === 'string' && v.includes('/') ? v : (CHAR_FULL_ASSETS[v] || null));
  // Same back→front order as the mirror: body, shoes, hair, eyes, mouth, acc (acc on top).
  const layers = [
    charState.body,
    charState.shoes,
    charState.hair,
    charState.eyes,
    charState.mouth,
    charState.acc,
  ].map(resolve).filter(Boolean);
  if(!layers.length) return '';
  return `<div class="adv-char-stack">${layers.map(s=>`<img src="${s}" alt="" onerror="this.style.display='none'">`).join('')}</div>`;
}

// PORTABLE: give it a day's data + a stable seed string, get matrix HTML back.
// data = { dateLabel, mapName, mapType, zones, bingoScore(0-24), charState,
//          journalText, journalImages[], archiveHref }
function buildAdventureMatrix(data, seedStr){
  const rnd = _seedRand(seedStr || 'matrix');
  const jit = r => (rnd()*2-1)*r;            // ± r
  const rot = r => ((rnd()*2-1)*r).toFixed(1);
  const pct = (a,b) => (a + rnd()*(b-a)).toFixed(1);

  // Treasure map (left)
  const mapItem = `<div class="adv-item adv-map" style="left:${(20+jit(5)).toFixed(1)}%;top:${(48+jit(8)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(5)}deg);">
      <div class="adv-map-svg">${buildPreviewSVG(data.mapType||'spiral', data.zones||[])}</div>
      <div class="adv-cap">${_escapeHtml(data.mapName||'my map')}</div></div>`;

  // Bingo (right) → heart meter
  const meterPct = Math.round(((data.bingoScore||0)/24)*100);
  const mode = (data.bingoScore||0)<=9 ? 'hard mode' : (data.bingoScore||0)<=19 ? 'medium mode' : 'easy mode';
  const bingoItem = `<div class="adv-item adv-bingo" style="left:${(78+jit(5)).toFixed(1)}%;top:${(50+jit(8)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(4)}deg);">
      <div class="adv-cap">heart meter</div>
      <div class="adv-meter"><div class="adv-meter-fill" style="width:${meterPct}%"></div></div>
      <div class="adv-mode">${mode}</div></div>`;

  // Character / infinity mirror (bottom)
  const charStack = _buildCharStack(data.charState);
  const charItem = charStack ? `<div class="adv-item adv-char" style="left:${(50+jit(7)).toFixed(1)}%;top:${(75+jit(6)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(5)}deg);">${charStack}</div>` : '';

  // Journal (top) → first 10 words
  const preview = _firstWords(data.journalText, 10);
  const journalItem = preview ? `<div class="adv-item adv-journal" style="left:${(50+jit(8)).toFixed(1)}%;top:${(22+jit(6)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(4)}deg);">
      <div class="adv-journal-text">${_escapeHtml(preview)}</div></div>` : '';

  // Photos scattered across the whole matrix
  let photos = '';
  (data.journalImages||[]).forEach(url => {
    photos += `<div class="adv-photo" style="left:${pct(14,86)}%;top:${pct(16,82)}%;transform:translate(-50%,-50%) rotate(${rot(10)}deg);"><img src="${url}" alt="" onerror="this.parentElement.style.display='none'"></div>`;
  });

  // Accent dots
  const dotColors = ['var(--blue)','var(--aqua)','#b8a88a','#c8b88a'];
  let dots = '';
  for (let i=0;i<12;i++){
    const sz = (8 + rnd()*14).toFixed(0);
    dots += `<span class="adv-dot" style="left:${pct(6,94)}%;top:${pct(8,92)}%;width:${sz}px;height:${sz}px;background:${dotColors[Math.floor(rnd()*dotColors.length)]};opacity:${(0.25+rnd()*0.35).toFixed(2)};"></span>`;
  }

  return `<div class="step-panel matrix-panel">
    <div class="matrix-header">
      <div class="matrix-date">${_escapeHtml(data.dateLabel||'')}</div>
      <button class="matrix-archive-btn" onclick="window.location.href='${data.archiveHref||'#'}'">archive →</button>
    </div>
    <div class="matrix-frame">
      <div class="adv-matrix">
        <div class="adv-grid"></div>
        <div class="adv-axis adv-axis-x"></div>
        <div class="adv-axis adv-axis-y"></div>
        <div class="adv-axlabel adv-top">journal</div>
        <div class="adv-axlabel adv-bottom">infinity mirror</div>
        <div class="adv-axlabel adv-left">treasure map</div>
        <div class="adv-axlabel adv-right">bingo</div>
        ${dots}
        ${mapItem}${bingoItem}${charItem}${journalItem}
        ${photos}
      </div>
    </div>
  </div>`;
}

// Assemble today's saved data from the DB (page-specific; archive will gather its own).
async function assembleTodayMatrixData(dateStr){
  const d = {
    dateLabel: new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),
    mapName: activeGameData?.map_name || 'my map',
    mapType: activeGameData?.map_type || 'spiral',
    zones: (activeGameData?.map_data||{}).zones || [],
    bingoScore: 0, charState: null, journalText: '', journalImages: [],
    archiveHref: `archive.html?game_id=${activeGameId}`,
  };
  try {
    const { data: daily } = await sb.from('daily_entries').select('*')
      .eq('game_id', activeGameId).eq('entry_date', dateStr).maybeSingle();
    if (daily){ d.charState = daily.character_data || null; d.bingoScore = daily.bingo_data?.score || 0; }
  } catch(e){}
  try {
    const { data: diary } = await sb.from('diary_entries').select('*')
      .eq('game_id', activeGameId).eq('entry_date', dateStr).maybeSingle();
    if (diary){
      d.journalText = diary.diary_text || '';
      if (Array.isArray(diary.image_urls)) d.journalImages = diary.image_urls.filter(Boolean);
      else if (diary.image_url) d.journalImages = [diary.image_url];
    }
  } catch(e){}
  return d;
}

async function stepDone() {
  currentStep = 'done';
  setBubble("your entry is complete!");
  const today = new Date().toLocaleDateString('en-CA');
  showPanel('<div class="step-panel matrix-panel"><div class="matrix-date" style="position:static;margin-top:40px;text-align:center;">gathering your day…</div></div>');
  const data = await assembleTodayMatrixData(today);
  showPanel(buildAdventureMatrix(data, `${activeGameId}|${today}`));
}

// ── POSTMESSAGE FROM IFRAMES ──────────────────────────────
window.addEventListener('message', async e => {
  const msg = e.data || {};
  if (!msg.type) return;

  // ── iframe signalled it's loaded and ready ───────────────
  if (msg.type === 'iframe_ready' && msg.game === 'character') {
    const btn = document.getElementById('save-continue-btn');
    if (btn && currentStep === 'character') {
      btn.disabled = false;
      btn.innerHTML = 'save character &amp; continue →';
    }
    return;
  }

  // New map built — advance to phase select
  if (msg.type === 'map_saved' && msg.game_id) {
    activeGameId   = msg.game_id;
    activeGameData = {
      id: msg.game_id, map_name: msg.map_name || 'my map',
      map_type: msg.map_type || 'spiral', map_data: msg.map_data || { zones:[] },
    };
    activePhase = null;
    setSaveBtnVisible(false);
    showRoomStatus('map saved ✓', '#6ab86a');
    stepPhaseSelect();
    return;
  }

  // Map save failed — re-enable button with reason
  if (msg.type === 'map_save_failed') {
    const btn = document.getElementById('save-continue-btn');
    if (btn) { btn.disabled = false; btn.innerHTML = 'save map &amp; continue →'; }
    showRoomStatus(msg.reason || 'add a goal name and some terrain first', '#E8478B');
    return;
  }

  // ── Character state received — save to daily_entries ───
  if (msg.type === 'char_state') {
    const charState = msg.state || {};
    if (!charState.body) {
      showRoomStatus('pick a body first!', '#E8478B');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'save character &amp; continue →';
      return;
    }
    const today = new Date().toLocaleDateString('en-CA');
    let saved = false;

    const { error } = await sb.from('daily_entries').upsert({
      game_id: activeGameId, user_id: currentUser.id,
      entry_date: today, map_phase: activePhase,
      character_data: charState,
    }, { onConflict: 'game_id,entry_date' });
    saved = !error;
    if (error) showRoomStatus('save failed', '#E8478B');

    if (saved) {
      showRoomStatus('character saved ✓', '#6ab86a');
      setSaveBtnVisible(false);
      stepBingo();
    } else {
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'save character &amp; continue →';
    }
    return;
  }

  // ── Bingo state received — save to daily_entries ───────
  if (msg.type === 'bingo_state') {
    const { marked: markedArr, score } = msg;
    if (!score || score === 0) {
      showRoomStatus('check some squares first!', '#E8478B');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'save &amp; finish →';
      return;
    }
    const today        = new Date().toLocaleDateString('en-CA');
    const energyScore  = Math.round((score / 24) * 100);
    const bingoPayload = { marked: markedArr, score };

    const { error } = await sb.from('daily_entries').upsert({
      game_id: activeGameId, user_id: currentUser.id,
      entry_date: today, bingo_data: bingoPayload, energy_score: energyScore,
    }, { onConflict: 'game_id,entry_date' });

    if (!error) {
      showRoomStatus('all saved ✓', '#6ab86a');
      setSaveBtnVisible(false);
      stepJournal();
    } else {
      showRoomStatus('save failed', '#E8478B');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'save &amp; finish →';
    }
    return;
  }

  // ── Journal saved ────────────────────────────────────────
  if (msg.type === 'journal_saved') {
    setSaveBtnVisible(false);
    stepDone();
    return;
  }
});

// ── SVG BUILDERS (read-only, zone click = phase select) ──
function buildSpiralSVG(zones) {
  return spiralZonesSVG(zones, { interactive:true });
}

function buildSquareSVG(zones) {
  const R=36;
  let defs='<defs>';
  let circles='';
  let hits='';

  SQUARE_POS.forEach((p,i)=>{
    const z=zones[i]||{};
    const hasTerrain=!!(z.terrain&&TERRAIN_IMGS[z.terrain]);
    if(z.tint){
      defs+=`<radialGradient id="sqg${i}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${z.tint}" stop-opacity=".5"/>
        <stop offset="65%" stop-color="${z.tint}" stop-opacity=".18"/>
        <stop offset="100%" stop-color="${z.tint}" stop-opacity="0"/>
      </radialGradient>`;
      circles+=`<circle cx="${p.x}" cy="${p.y}" r="${R+28}" fill="url(#sqg${i})" pointer-events="none"/>`;
    }
    if(hasTerrain){
      defs+=`<clipPath id="sqc${i}"><circle cx="${p.x}" cy="${p.y}" r="${R-2}"/></clipPath>`;
    }
    circles+=`<circle id="zone-bg-${i}" cx="${p.x}" cy="${p.y}" r="${R}"
      fill="rgba(200,196,180,0)" stroke="transparent" stroke-width="2.5"/>`;
    if(hasTerrain){
      circles+=`<image x="${p.x-R}" y="${p.y-R}" width="${R*2}" height="${R*2}"
        href="${TERRAIN_IMGS[z.terrain]}" preserveAspectRatio="xMidYMid meet"
        clip-path="url(#sqc${i})" pointer-events="none"/>`;
    } else {
      circles+=`<circle cx="${p.x}" cy="${p.y}" r="${R}"
        fill="rgba(200,196,180,.82)" stroke="#8a7a5a" stroke-width="1.5" pointer-events="none"/>
        <text x="${p.x}" y="${p.y+5}" text-anchor="middle" dominant-baseline="middle"
          fill="#5a4a2a" font-family="ZoesHandwriting,cursive" font-size="22" pointer-events="none">${SQUARE_LABELS[i]}</text>`;
    }
    if(z.feeling){
      circles+=`<text x="${p.x}" y="${p.y+R+13}" text-anchor="middle"
        fill="#5a4a2a" font-family="ZoesHandwriting,cursive" font-size="11"
        pointer-events="none">${z.feeling}</text>`;
    }
    hits+=`<circle class="zone-hit" cx="${p.x}" cy="${p.y}" r="${R+8}"
      fill="transparent" style="cursor:pointer" onclick="selectPhase(${i})"/>`;
  });
  defs+='</defs>';

  return `<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
    ${defs}
    <image href="../assets/elements/square-1.png" x="25" y="10" width="450" height="380" preserveAspectRatio="xMidYMid meet" style="pointer-events:none;"/>
    ${circles}${hits}
  </svg>`;
}
