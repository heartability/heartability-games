<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<title>Contact support — Heartability</title>
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:     "ZoesHandwriting", cursive;
  --font-pixel:    "PFPixelscript", cursive;
  --purple:        #6579e2;
  --purple-dark:   #4a5bc4;
  --purple-shadow: #3a4aaa;
  --blue-glow:     #83d2e6;
  --mint:          #c9fff5;
  --cream:         #f5f0ea;
  --cream-dark:    #e8e3da;
  --line-col:      #111;
}

html, body {
  width: 100vw;
  min-height: 100dvh;
  font-family: var(--font-hand);
  background: url('../assets/elements/garden-sky.png') center / cover no-repeat fixed;
  background-color: #5b7fe0;
}

.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #6578e2;
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(21px, 1.6vw, 25px);
  color: #fff;
}
.nav-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  color: inherit;
  text-decoration: none;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(0,0,0,0.08); }

.page-wrap {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 64px 16px 40px;
}

.window {
  width: 100%;
  max-width: 560px;
  background: var(--cream);
  box-shadow: 0 0 0 3px var(--purple), 0 0 0 6px var(--blue-glow), 6px 10px 40px rgba(0,0,0,0.35);
  overflow: hidden;
  animation: windowIn 0.35s ease both;
}

@keyframes windowIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.window-titlebar {
  height: 38px;
  background: var(--cream-dark);
  border-bottom: 2px solid #bbb;
  display: flex;
  align-items: center;
  padding: 0 18px;
  font-family: var(--font-hand);
  font-size: clamp(16px, 1.4vw, 20px);
  color: #555;
}

.window-body {
  padding: 26px 28px 24px;
}

h1 {
  font-family: var(--font-hand);
  font-weight: normal;
  font-size: clamp(24px, 2vw, 30px);
  line-height: 1.2;
  color: #333;
  margin: 0 0 8px;
}

.sub {
  color: #888;
  font-size: clamp(14px, 1.1vw, 15px);
  line-height: 1.5;
  margin: 0 0 22px;
}

label {
  display: block;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.1vw, 15px);
  color: #888;
  margin: 18px 0 6px;
}

input[type="email"],
input[type="text"],
textarea {
  width: 100%;
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.3vw, 17px);
  padding: 10px 12px;
  border: 1.5px solid #bbb;
  background: var(--cream);
  color: #222;
  outline: none;
  transition: border-color 0.2s;
}

input:focus, textarea:focus {
  border-color: var(--purple);
}

textarea { resize: vertical; min-height: 120px; }

.hint { font-size: 12px; color: #aaa; margin-top: 4px; }

/* Category chips — signature element: what you need, named plainly,
   picked by tapping rather than a generic dropdown. */
.chip-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 8px;
}

.chip-option { position: relative; }

.chip-option input {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}

.chip {
  border: 1.5px solid #bbb;
  background: var(--cream);
  padding: 12px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.chip .glyph { font-size: 17px; }
.chip .label { font-family: var(--font-hand); font-weight: normal; font-size: 15px; color: #333; }

.chip-option input:checked + .chip {
  border-color: var(--purple);
  box-shadow: 0 0 0 3px rgba(101, 121, 226, 0.16);
}

.honeypot { position: absolute; left: -9999px; }

button {
  margin-top: 26px;
  width: 100%;
  padding: 12px 18px;
  background: var(--purple);
  border: 2px solid var(--purple-dark);
  box-shadow: 2px 2px 0 var(--purple-shadow);
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.3vw, 18px);
  color: #fff;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.05s;
}
button:hover { background: var(--purple-dark); }
button:active { box-shadow: none; transform: translate(2px, 2px); }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.status {
  margin-top: 16px;
  font-size: 14px;
  font-family: var(--font-hand);
  padding: 8px 12px;
  text-align: center;
  display: none;
}
.status.show { display: block; }
.status.error { color: #c0392b; background: rgba(192,57,43,0.08); border: 1px solid rgba(192,57,43,0.2); }
.status.success { color: #2d7a4f; background: rgba(45,122,79,0.08); border: 1px solid rgba(45,122,79,0.2); }

</style>
</head>
<body>

<nav class="room-nav">
  <a class="nav-btn" href="../index.html" onclick="if(history.length>1){history.back();return false;}">← back</a>
  <span style="margin:0; font:inherit;">contact support</span>
</nav>

<div class="page-wrap">
  <main class="window">
    <div class="window-titlebar">contact support</div>
    <div class="window-body">
      <h1>Get in touch</h1>
      <p class="sub">Questions about your account, a charge, or anything else — send it here and we'll reply by email. No account needed.</p>

      <form id="support-form" novalidate>
        <div class="honeypot" aria-hidden="true">
          <label for="website">Leave this field empty</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <label for="email">Your email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
        <p class="hint">This is where we'll send our reply.</p>

        <label>What's this about?</label>
        <div class="chip-row">
          <div class="chip-option">
            <input type="radio" name="category" value="billing" id="cat-billing" required>
            <label for="cat-billing" class="chip"><span class="glyph">💳</span><span class="label">Billing</span></label>
          </div>
          <div class="chip-option">
            <input type="radio" name="category" value="account" id="cat-account">
            <label for="cat-account" class="chip"><span class="glyph">👤</span><span class="label">Account</span></label>
          </div>
          <div class="chip-option">
            <input type="radio" name="category" value="technical" id="cat-technical">
            <label for="cat-technical" class="chip"><span class="glyph">🛠</span><span class="label">Technical</span></label>
          </div>
          <div class="chip-option">
            <input type="radio" name="category" value="other" id="cat-other">
            <label for="cat-other" class="chip"><span class="glyph">✉️</span><span class="label">Something else</span></label>
          </div>
        </div>

        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Short summary" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell us what's going on..." required></textarea>

        <button type="submit" id="submit-btn">Send message</button>
        <p class="status" id="status"></p>
      </form>
    </div>
  </main>
</div>

  <script>
    // Point this at your deployed Edge Function URL, e.g.:
    // https://YOUR-PROJECT-REF.supabase.co/functions/v1/submit-support-ticket
    const ENDPOINT = "https://YOUR-PROJECT-REF.supabase.co/functions/v1/submit-support-ticket";
    const ANON_KEY = "YOUR-SUPABASE-ANON-KEY";

    const form = document.getElementById("support-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.className = "status";
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      const payload = {
        website: form.website.value, // honeypot
        email: form.email.value.trim(),
        category: form.category.value,
        subject: form.subject.value.trim(),
        message: form.message.value.trim(),
      };

      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": ANON_KEY,
            "Authorization": `Bearer ${ANON_KEY}`,
          },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Something went wrong.");
        }

        statusEl.textContent = "Sent — check your email for confirmation. We'll reply soon.";
        statusEl.className = "status show success";
        form.reset();
      } catch (err) {
        statusEl.textContent = err.message || "Couldn't send that. Please try again.";
        statusEl.className = "status show error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send message";
      }
    });
  </script>
</body>
</html>
