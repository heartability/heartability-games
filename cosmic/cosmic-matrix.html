<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Matrix — Heartability</title>
<style>
@font-face { font-family:"ZoesHandwriting"; src:url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype"); }
@font-face { font-family:"PFPixelscript";  src:url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype"); }

*{ margin:0; padding:0; box-sizing:border-box; }
:root{
  --font-hand:"ZoesHandwriting",cursive;
  --font-pixel:"PFPixelscript",cursive;
  --blue:#6579e2; --aqua:#83d2e6; --ink:#000f5a; --cream:#fdf6e3; --pink:#E8478B;
  --line:#111;
  --bw-top:9%; --bw-left:15%; --bw-width:70%; --bw-height:70%;
}
html,body{ width:100vw; height:100dvh; overflow:hidden; user-select:none;
  background:linear-gradient(#d7e7f3 0%, #eaf0ec 48%, var(--cream) 100%);
  font-family:var(--font-hand); color:var(--ink); }

/* NAV (matches adventure) */
.room-nav{ position:fixed; top:0; left:0; right:0; height:44px; background:#c9fff5;
  border-bottom:2px solid var(--line); z-index:200; display:flex; align-items:center;
  justify-content:space-between; padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(14px,1.6vw,20px); color:#111; }
.nav-btn{ cursor:pointer; padding:4px 8px; border-radius:2px; transition:background .15s; }
.nav-btn:hover{ background:rgba(0,0,0,.08); }

/* CONTENT PANEL — sits where the back wall would be (outside: no wall, soft frame) */
.content-panel{ position:fixed; top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height); z-index:10; display:none;
  flex-direction:column; overflow:hidden; }
.content-panel.active{ display:flex; }
.content-panel.active:not(.iframe-mode){ background:var(--cream); border:2px solid var(--aqua); box-shadow:0 8px 22px rgba(0,0,0,.08); }
.game-iframe{ width:100%; height:100%; border:none; display:block; }
.content-panel.iframe-mode{ border:3px solid #111; box-shadow:inset 0 0 0 2px var(--aqua); }
.panel-scroll{ width:100%; height:100%; overflow-y:auto; padding:22px; display:flex; flex-direction:column; align-items:center; }

/* HEART + BUBBLE (matches adventure: heart bottom-left, bubble to its RIGHT) */
@keyframes idle-pulse{ 0%,100%{ transform:translateY(0) rotate(-2deg) scale(1);} 50%{ transform:translateY(-8px) rotate(2deg) scale(1.03);} }
.char-heart{ position:fixed; left:4vw; bottom:6vh; width:clamp(100px,14vw,220px); z-index:20; }
.char-heart .char-img{ display:block; width:100%; height:auto; filter:drop-shadow(0 4px 10px rgba(0,0,0,.28)); animation:idle-pulse 3.6s ease-in-out 1s infinite; }
.thought-bubble{ position:absolute; left:calc(100% - 8px); bottom:60%;
  min-width:clamp(160px,18vw,260px); max-width:clamp(180px,22vw,300px);
  background:#fff; border:2px solid #000; border-radius:50%; padding:14px 20px;
  font-family:var(--font-hand); font-size:clamp(11px,1.3vw,15px); color:#000;
  text-align:center; line-height:1.5; filter:drop-shadow(1px 3px 5px rgba(0,0,0,.2)); z-index:21; }

/* SAVE BAR (matches adventure: floating blue button) */
.save-continue-bar{ position:fixed; bottom:0; left:0; right:0; height:calc(21% - 44px);
  display:none; align-items:center; justify-content:center; z-index:15; pointer-events:none; }
.save-continue-bar.visible{ display:flex; }
.save-continue-btn{ pointer-events:all; padding:14px 40px; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa; font-family:var(--font-hand);
  font-size:clamp(15px,1.8vw,20px); color:#fff; cursor:pointer; transition:all .05s; letter-spacing:.3px; text-transform:lowercase; }
.save-continue-btn:hover{ background:#4a5bc4; }
.save-continue-btn:active{ box-shadow:none; transform:translate(3px,3px); }
.save-continue-btn:disabled{ opacity:.38; cursor:not-allowed; transform:none!important; box-shadow:3px 3px 0 #3a4aaa; }
.save-status-bar{ position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
  font-family:var(--font-hand); font-size:14px; color:#6ab86a; z-index:16; pointer-events:none; }

/* SEASON HEADER */
.season-head{ text-align:center; margin-bottom:8px; }
.season-title{ font-family:var(--font-hand); font-size:clamp(24px,3.4vw,34px); color:var(--ink); }
.season-sub{ font-family:var(--font-hand); font-size:clamp(13px,1.5vw,16px); letter-spacing:2px; color:var(--blue); }

/* TIMELINE */
.timeline{ width:100%; max-width:520px; margin:10px auto 0; position:relative; }
.timeline::before{ content:""; position:absolute; left:22px; top:14px; bottom:14px; width:2px;
  background:repeating-linear-gradient(var(--blue) 0 5px, transparent 5px 11px); opacity:.5; }
.node{ display:flex; align-items:center; gap:14px; padding:9px 10px; margin:5px 0; position:relative; border:2px solid transparent; }
.node-dot{ width:30px; height:30px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-hand); font-size:17px; border:2px solid var(--blue); background:var(--cream); color:var(--blue); z-index:1; }
.node-body{ flex:1; min-width:0; }
.node-loc{ font-family:var(--font-hand); font-size:clamp(17px,2vw,20px); color:var(--ink); line-height:1.15; }
.node-meta{ font-family:var(--font-hand); font-size:clamp(12px,1.4vw,15px); color:var(--blue); margin-top:1px; }
.node-badge{ font-family:var(--font-hand); font-size:13px; letter-spacing:.5px; padding:2px 8px; flex-shrink:0; }
.node.available{ cursor:pointer; }
.node.available:hover{ border-color:var(--aqua); background:#eef6f9; }
.node.available .node-badge{ color:var(--aqua); }
.node.completed{ cursor:pointer; }
.node.completed .node-dot{ background:var(--pink); border-color:var(--pink); color:#fff; }
.node.completed:hover{ border-color:var(--pink); background:#fbe9f1; }
.node.completed .node-badge{ color:var(--pink); }
.node.locked{ opacity:.45; }
.node.locked .node-dot{ border-color:#9aa0b8; color:#9aa0b8; }
.node.locked .node-badge{ color:#9aa0b8; }
.node.current .node-dot{ box-shadow:0 0 0 3px rgba(131,210,230,.55); }
.node.just-done{ animation:flash 1.6s ease-out; }
@keyframes flash{ 0%{ background:#fff0a0;} 100%{ background:transparent;} }

/* GATE */
.gate{ margin:auto; max-width:420px; text-align:center; background:#eef6f9; border:2px solid var(--aqua); padding:28px 24px; }
.gate-title{ font-family:var(--font-hand); font-size:26px; color:var(--ink); margin-bottom:10px; }
.gate-text{ font-family:var(--font-hand); font-size:17px; color:var(--ink); line-height:1.4; margin-bottom:18px; }
.gate-btn{ font-family:var(--font-hand); font-size:18px; color:#fff; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa; padding:10px 24px; cursor:pointer; }
.gate-btn:hover{ background:#4a5bc4; }
.gate-btn:active{ box-shadow:none; transform:translate(3px,3px); }

/* JOURNAL */
.jr{ width:100%; max-width:520px; margin:0 auto; }
.jr-note{ font-family:var(--font-hand); font-size:16px; color:var(--blue); margin-bottom:8px; }
.jr-ta{ width:100%; min-height:150px; resize:vertical; font-family:var(--font-hand); font-size:17px; color:var(--ink);
  background:#fffdf5; border:2px solid #c8b88a; padding:10px; line-height:1.4; }
.jr-row{ display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap; }
.jr-upload{ font-family:var(--font-hand); font-size:15px; color:var(--blue); border:2px dashed var(--aqua); padding:8px 14px; cursor:pointer; }
.jr-preview{ max-height:90px; border:2px solid #c8b88a; display:none; }
.jr-preview.show{ display:block; }
.jr-status{ font-family:var(--font-hand); font-size:14px; margin-top:8px; min-height:16px; }

/* LOGIN MODAL */
.login-modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; display:none; align-items:center; justify-content:center; }
.login-modal-overlay.open{ display:flex; }
.login-modal-window{ width:min(92vw,440px); background:#f5f0ea;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.35); overflow:hidden; }
.login-modal-titlebar{ height:38px; background:#e8e3da; border-bottom:2px solid #bbb;
  display:flex; align-items:center; justify-content:space-between; padding:0 16px;
  font-family:var(--font-hand); font-size:15px; color:#555; }
.login-modal-close{ cursor:pointer; font-size:20px; color:#bbb; padding:2px 4px; transition:color .15s; }
.login-modal-close:hover{ color:#444; }
.lm-tab-row{ display:flex; border-bottom:2px solid #ccc; background:#e8e3da; }
.lm-tab{ flex:1; padding:10px; font-family:var(--font-hand); font-size:15px;
  text-align:center; cursor:pointer; color:#888; background:none; border:none;
  border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .15s; }
.lm-tab.active{ color:var(--blue); border-bottom-color:var(--blue); }
.lm-body{ padding:20px 24px 16px; display:flex; flex-direction:column; gap:12px; }
.lm-form{ display:none; flex-direction:column; gap:12px; }
.lm-form.active{ display:flex; }
.lm-field{ display:flex; flex-direction:column; gap:4px; }
.lm-label{ font-family:var(--font-hand); font-size:12px; color:#888; }
.lm-input{ font-family:var(--font-hand); font-size:15px; color:#222; background:#f5f0ea;
  border:1.5px solid #bbb; padding:8px 12px; outline:none; transition:border-color .15s; user-select:text; }
.lm-input:focus{ border-color:var(--blue); }
.lm-btn{ padding:10px 18px; background:var(--blue); border:2px solid #4a5bc4;
  box-shadow:2px 2px 0 #3a4aaa; font-family:var(--font-hand); font-size:15px;
  color:#fff; cursor:pointer; transition:all .05s; margin-top:4px; }
.lm-btn:hover{ background:#4a5bc4; }
.lm-btn:active{ box-shadow:none; transform:translate(2px,2px); }
.lm-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.lm-msg{ font-family:var(--font-hand); font-size:12px; padding:6px 10px; display:none; }
.lm-msg.error{ display:block; color:#c0392b; background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.2); }
.lm-msg.success{ display:block; color:#2d7a4f; background:rgba(45,122,79,.08); border:1px solid rgba(45,122,79,.2); }
.lm-footer{ text-align:center; padding:0 24px 14px; font-family:var(--font-hand); font-size:11px; color:#aaa; }

/* MOBILE */
@media (max-width:768px){
  :root{ --bw-top:44px; --bw-left:0%; --bw-width:100%; --bw-height:calc(100dvh - 44px); }
  .content-panel.active:not(.iframe-mode){ border:none; box-shadow:none; }
  .char-heart{ display:none; }
  .save-continue-bar{ height:auto; padding:10px 0; bottom:0; z-index:30; }
}
</style>
</head>
<body>

<nav class="room-nav">
  <span class="nav-btn" onclick="window.location.href='../games/game-room.html'">← back</span>
  <span>cosmic matrix</span>
  <span></span>
</nav>

<div class="content-panel" id="content-panel"></div>

<div class="char-heart" id="char-heart">
  <div class="thought-bubble" id="bubble">reading the sky…</div>
  <img class="char-img" src="../assets/elements/guides/heart.png" alt="Heart guide">
</div>

<div class="save-continue-bar" id="save-bar">
  <button class="save-continue-btn" id="save-btn" onclick="saveAndContinue()">continue →</button>
</div>
<div class="save-status-bar" id="status"></div>

<!-- LOGIN MODAL — direct form, no redirect -->
<div class="login-modal-overlay" id="login-modal">
  <div class="login-modal-window">
    <div class="login-modal-titlebar">
      <span>welcome</span>
      <span class="login-modal-close" onclick="closeLoginModal()">×</span>
    </div>
    <div class="lm-tab-row">
      <button class="lm-tab active" onclick="lmSwitchTab('login',this)">log in</button>
      <button class="lm-tab" onclick="lmSwitchTab('signup',this)">sign up</button>
    </div>
    <div class="lm-body">
      <div class="lm-form active" id="lm-form-login">
        <div class="lm-field">
          <label class="lm-label">email</label>
          <input class="lm-input" type="email" id="lm-email" placeholder="your@email.com" autocomplete="email"/>
        </div>
        <div class="lm-field">
          <label class="lm-label">password</label>
          <input class="lm-input" type="password" id="lm-password" placeholder="••••••••"/>
        </div>
        <div class="lm-msg" id="lm-login-msg"></div>
        <button class="lm-btn" id="lm-login-btn" onclick="lmLogin()">enter</button>
      </div>
      <div class="lm-form" id="lm-form-signup">
        <div class="lm-field">
          <label class="lm-label">username</label>
          <input class="lm-input" type="text" id="lm-username" placeholder="choose a name" maxlength="40" autocomplete="off"/>
        </div>
        <div class="lm-field">
          <label class="lm-label">email</label>
          <input class="lm-input" type="email" id="lm-su-email" placeholder="your@email.com" autocomplete="email"/>
        </div>
        <div class="lm-field">
          <label class="lm-label">password</label>
          <input class="lm-input" type="password" id="lm-su-password" placeholder="at least 6 characters" minlength="6"/>
        </div>
        <div class="lm-msg" id="lm-signup-msg"></div>
        <button class="lm-btn" id="lm-signup-btn" onclick="lmSignup()">create account</button>
      </div>
    </div>
    <div class="lm-footer">login to access the cosmic matrix</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   COSMIC MATRIX — orchestration spine
   Paid-gated. Sole writer of cosmic_phases + cosmic_bingo.
   Flow per phase:  select → character (iframe) → cosmic bingo (iframe) → journal.
   Entry identity is (game_id, map_phase): upsert on that key → no dup spiral nodes.
   ============================================================ */

// ── SUPABASE (same project as adventure-matrix) ─────────────
const SUPABASE_URL      = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MATRIX_PHOTO_BUCKET = 'matrix-photos';
const LOGIN_URL   = '../games/game-room.html';      // where auth lives
const UPGRADE_URL = '../users/membership.html';     // TODO: confirm your pricing/upgrade page

// ── STATE ───────────────────────────────────────────────────
let currentUser    = null;
let activeTemplate = null;   // cosmic_templates row
let activeGameId   = null;   // per-user cloned games row id
let activeMapData  = null;   // the season's map_data (phases + windows)
let activePhase    = null;   // map_phase key, e.g. 'moon_scorpio'
let currentStep    = null;   // 'character' | 'bingo' | 'journal'
let completedSet   = new Set();   // map_phase keys that have a character row
let cosmicBoard    = { marked:null };  // the season bingo board (cosmic_bingo.bingo_data)
let justDoneKey    = null;
let journalPending = null;   // {file} for the journal photo

// ── HELPERS ─────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function setBubble(t){ $('bubble').textContent = t; }
function showStatus(msg,color){ const el=$('status'); el.textContent=msg; el.style.color=color||'#6ab86a';
  clearTimeout(el._t); el._t=setTimeout(()=>el.textContent='',3000); }
function setSave(visible,label='continue →'){ const bar=$('save-bar'),btn=$('save-btn');
  bar.classList.toggle('visible',visible); if(btn){ btn.innerHTML=label; btn.disabled=false; } }
function showPanel(html){ const p=$('content-panel'); p.className='content-panel active'; p.innerHTML=`<div class="panel-scroll">${html}</div>`; }
function showIframe(src){ const p=$('content-panel'); p.className='content-panel active iframe-mode';
  p.innerHTML=`<iframe class="game-iframe" id="game-iframe" src="${src}"></iframe>`; }

function phases(){ return (activeMapData?.phases || []).slice().sort((a,b)=>Date.parse(a.opens_utc)-Date.parse(b.opens_utc)); }
function phaseByKey(k){ return phases().find(p=>p.map_phase===k); }
function nowMs(){ return Date.now(); }
function isOpen(p){ return nowMs() >= Date.parse(p.opens_utc); }
function currentPhaseKey(){
  const open = phases().filter(isOpen);
  return open.length ? open[open.length-1].map_phase : null;
}
function fmtOpens(p){
  const d=new Date(p.opens_utc);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' +
         d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

// ── BOOT ────────────────────────────────────────────────────
async function init(){
  try { const { data:{ session } } = await sb.auth.getSession(); currentUser = session?.user || null; } catch(e){}
  if (!currentUser){ return showLoginGate(); }

  // Paid gate: membership_status present and not 'free'
  let profile=null;
  try {
    const { data } = await sb.from('user-profiles')
      .select('membership_status, membership_tier, membership_expires_at')
      .eq('id', currentUser.id).maybeSingle();
    profile = data;
  } catch(e){}
  const status = profile?.membership_status || null;
  const paid = !!status && status !== 'free';
  if (!paid){ return showUpgradeGate(); }

  await loadSeason();
}

sb.auth.onAuthStateChange((event, session)=>{
  if (event==='SIGNED_IN' && session && !currentUser){ currentUser=session.user; init(); }
});

// ── GATES ───────────────────────────────────────────────────
function showLoginGate(){
  setBubble('the sky is waiting for you.');
  showPanel(`<div class="gate">
    <div class="gate-title">the cosmic matrix</div>
    <div class="gate-text">log in to walk the season's moon phases.</div>
    <button class="gate-btn" onclick="openLoginModal()">log in →</button>
  </div>`);
}

function openLoginModal(){ document.getElementById('login-modal').classList.add('open'); }
function closeLoginModal(){ document.getElementById('login-modal').classList.remove('open'); }
function lmSwitchTab(tab, btn){
  document.querySelectorAll('.lm-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.lm-form').forEach(f=>f.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('lm-form-'+tab).classList.add('active');
}
async function lmLogin(){
  const email=document.getElementById('lm-email').value.trim();
  const pass=document.getElementById('lm-password').value;
  const msg=document.getElementById('lm-login-msg');
  const btn=document.getElementById('lm-login-btn');
  msg.className='lm-msg'; msg.textContent=''; btn.disabled=true; btn.textContent='entering…';
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password:pass });
    if (error) throw error;
    closeLoginModal();
  } catch(e){
    msg.className='lm-msg error'; msg.textContent=e.message||'login failed';
    btn.disabled=false; btn.textContent='enter';
  }
}
async function lmSignup(){
  const name=document.getElementById('lm-username').value.trim();
  const email=document.getElementById('lm-su-email').value.trim();
  const pass=document.getElementById('lm-su-password').value;
  const msg=document.getElementById('lm-signup-msg');
  const btn=document.getElementById('lm-signup-btn');
  msg.className='lm-msg'; msg.textContent=''; btn.disabled=true; btn.textContent='creating…';
  try {
    const { error } = await sb.auth.signUp({ email, password:pass, options:{ data:{ username:name } } });
    if (error) throw error;
    msg.className='lm-msg success'; msg.textContent='check your email to confirm your account!';
    btn.textContent='sent!';
  } catch(e){
    msg.className='lm-msg error'; msg.textContent=e.message||'signup failed';
    btn.disabled=false; btn.textContent='create account';
  }
}
function showUpgradeGate(){
  setBubble('this ritual is for members.');
  showPanel(`<div class="gate">
    <div class="gate-title">a members' ritual</div>
    <div class="gate-text">the cosmic matrix guides you through each astrological season — one location per moon phase. it's part of membership.</div>
    <button class="gate-btn" onclick="window.location.href='${UPGRADE_URL}'">become a member →</button>
  </div>`);
}
function showNoSeason(){
  setBubble('no season is open right now.');
  showPanel(`<div class="gate">
    <div class="gate-title">between seasons</div>
    <div class="gate-text">there's no published cosmic season at the moment. check back when the next one begins.</div>
    <button class="gate-btn" onclick="window.location.href='${LOGIN_URL}'">back to the castle →</button>
  </div>`);
}

// ── SEASON LOAD + CLONE-ON-FIRST-OPEN ───────────────────────
async function loadSeason(){
  const param = new URLSearchParams(location.search).get('season'); // test hook: load unpublished by key
  let query = sb.from('cosmic_templates').select('*');
  query = param ? query.eq('season', param) : query.eq('is_published', true);
  let tpls=[];
  try { const { data } = await query; tpls = data || []; } catch(e){}
  if (!tpls.length){ return showNoSeason(); }

  let tpl;
  if (param){ tpl = tpls[0]; }
  else {
    const now = nowMs();
    tpl = tpls.find(t=>{
      const s=Date.parse(t.map_data?.season_start_utc), e=Date.parse(t.map_data?.season_end_utc);
      return s && e && now>=s && now<e;
    }) || tpls.slice().sort((a,b)=>Date.parse(b.map_data?.season_start_utc||0)-Date.parse(a.map_data?.season_start_utc||0))[0];
  }
  activeTemplate = tpl;
  activeMapData  = tpl.map_data;

  await ensureCosmicGame(tpl);
  if (!activeGameId){ showStatus('could not open this season — try again','#E8478B'); return; }
  await loadProgress();
  renderTimeline();
}

// Clone the season template into a per-user games row exactly once.
async function ensureCosmicGame(tpl){
  const season = tpl.map_data?.season || tpl.season;
  let game=null;
  try {
    const { data } = await sb.from('games').select('*')
      .eq('user_id', currentUser.id).eq('map_type','cosmic');
    game = (data||[]).find(g => g.map_data?.season === season) || null;
  } catch(e){}

  if (!game){
    try {
      const { data, error } = await sb.from('games').insert({
        user_id: currentUser.id,
        map_name: tpl.title || season,
        map_type: 'cosmic',
        map_data: tpl.map_data,     // carries season + phases; map_data->>'season' powers the unique index
        status: 'active',
      }).select().single();
      if (error) throw error;
      game = data;
    } catch(err){
      // Surface the real reason (constraint, RLS, etc.) — don't hide it.
      console.error('[cosmic clone] games insert failed:', err?.message || err, err);
      // A unique-index race is the one benign case: re-fetch the row that won.
      try {
        const { data } = await sb.from('games').select('*')
          .eq('user_id', currentUser.id).eq('map_type','cosmic');
        game = (data||[]).find(g => g.map_data?.season === season) || null;
      } catch(e){}
    }
  }
  if (game){ activeGameId = game.id; activeMapData = game.map_data || activeMapData; }
}

// Which phases are already lived (have a character row) + the season board.
async function loadProgress(){
  completedSet = new Set();
  try {
    const { data } = await sb.from('cosmic_phases')
      .select('map_phase, character_data')
      .eq('game_id', activeGameId).eq('user_id', currentUser.id);
    (data||[]).forEach(r=>{ if (r.character_data) completedSet.add(r.map_phase); });
  } catch(e){}
  try {
    const { data } = await sb.from('cosmic_bingo')
      .select('bingo_data').eq('game_id', activeGameId).eq('user_id', currentUser.id).maybeSingle();
    cosmicBoard = data?.bingo_data || { marked:null };
  } catch(e){ cosmicBoard = { marked:null }; }
}

// ── TIMELINE (the season-so-far view; spiral render is pass 2) ──
function renderTimeline(){
  currentStep = null; activePhase = null;
  setSave(false);
  setBubble("trust your intuition — choose where the moon has you.");
  const curKey = currentPhaseKey();

  const rows = phases().map(p=>{
    const open = isOpen(p);
    const done = completedSet.has(p.map_phase);
    const isCur = p.map_phase === curKey;
    const state = !open ? 'locked' : (done ? 'completed' : 'available');
    const badge = !open ? 'locked' : (done ? 'lived' : (isCur ? 'now' : 'open'));
    const meta  = !open ? ('opens ' + fmtOpens(p))
                        : (p.sign + (p.transits && p.transits.length ? ' · ' + p.transits.length + ' transit' + (p.transits.length>1?'s':'') : ' · no transits'));
    const click = open ? ` onclick="selectPhase('${p.map_phase}')"` : '';
    const just  = p.map_phase===justDoneKey ? ' just-done' : '';
    return `<div class="node ${state}${isCur?' current':''}${just}"${click}>
      <div class="node-dot">${done?'✦':p.phase}</div>
      <div class="node-body">
        <div class="node-loc">${p.location}</div>
        <div class="node-meta">${meta}</div>
      </div>
      <div class="node-badge">${badge}</div>
    </div>`;
  }).join('');

  showPanel(`
    <div class="season-head">
      <div class="season-title">${activeTemplate.title || 'cosmic season'}</div>
      <div class="season-sub">${phases().length} moon phases</div>
    </div>
    <div class="timeline">${rows}</div>`);
  justDoneKey = null;
}

// ── FLOW ────────────────────────────────────────────────────
function selectPhase(key){
  const p = phaseByKey(key);
  if (!p || !isOpen(p)) return;
  activePhase = key;
  stepCharacter();
}

function stepCharacter(){
  currentStep = 'character';
  const p = phaseByKey(activePhase);
  setBubble(`${p.location} — who do you feel like under this sky?`);
  showIframe(`../games/infinity-mirror.html?game_id=${activeGameId}&phase=${activePhase}&loop=true&mode=cloud`);
  setSave(true,'loading…'); $('save-btn').disabled = true;
}

function stepBingo(){
  currentStep = 'bingo';
  setBubble("mark the sky's invitations as you live them.");
  showIframe(`../cosmic/cosmic-bingo.html?season=${encodeURIComponent(activeMapData?.season||'')}`);
  setSave(true,'continue →');
}

function stepJournal(){
  currentStep = 'journal';
  setBubble('what do you want to remember from this phase?');
  showPanel(`<div class="jr">
    <div class="jr-note">a note from this moon phase — a feeling, an omen, something that happened.</div>
    <textarea class="jr-ta" id="jr-ta" placeholder="write freely…"></textarea>
    <div class="jr-row">
      <label class="jr-upload">+ add a photo
        <input type="file" id="jr-file" accept="image/*" hidden onchange="onJournalPhoto(event)">
      </label>
      <img class="jr-preview" id="jr-preview" alt="">
    </div>
    <div class="jr-status" id="jr-status"></div>
  </div>`);
  prefillJournal();
  setSave(true,'finish →');
}

async function prefillJournal(){
  try {
    const { data } = await sb.from('cosmic_phases').select('diary_text, matrix_images')
      .eq('game_id', activeGameId).eq('map_phase', activePhase).maybeSingle();
    if (data?.diary_text) $('jr-ta').value = data.diary_text;
    const img = (data?.matrix_images||[]).find(i=>i&&i.source==='journal');
    if (img){ const pv=$('jr-preview'); pv.src=img.url; pv.classList.add('show'); }
  } catch(e){}
}
function onJournalPhoto(ev){
  const f = ev.target.files?.[0]; if(!f) return;
  journalPending = { file:f };
  const pv=$('jr-preview'); pv.src=URL.createObjectURL(f); pv.classList.add('show');
}

function stepDone(){
  justDoneKey = activePhase;
  completedSet.add(activePhase);
  setSave(false);
  showStatus('phase complete ✦', '#E8478B');
  renderTimeline();
}

// ── SAVE & CONTINUE — matrix owns every write ───────────────
async function saveAndContinue(){
  const btn = $('save-btn'); btn.disabled = true; btn.textContent='saving…';

  if (currentStep === 'journal'){ await saveJournal(); return; }

  const iframe = $('game-iframe');
  if (!iframe){ btn.disabled=false; return; }
  iframe.contentWindow.postMessage({ type:'request_state' }, '*');
  clearTimeout(window._fb);
  window._fb = setTimeout(()=>{ if (btn.disabled){ btn.disabled=false;
    btn.innerHTML = currentStep==='character'?'continue →':'continue →';
    showStatus('something went wrong — try again','#E8478B'); } }, 5000);
}

async function saveJournal(){
  const text = ($('jr-ta')?.value || '').trim();
  // upload new photo (if any) to a deterministic per-phase path
  let newUrl = null;
  if (journalPending){
    try {
      const file = journalPending.file;
      const ext = (file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
      const path = `${currentUser.id}/${activeGameId}/${activePhase}/journal-${crypto.randomUUID()}.${ext}`;
      const { error } = await sb.storage.from(MATRIX_PHOTO_BUCKET).upload(path, file, { contentType:file.type, upsert:false });
      if (error) throw error;
      const { data:pub } = sb.storage.from(MATRIX_PHOTO_BUCKET).getPublicUrl(path);
      newUrl = pub?.publicUrl || null;
    } catch(err){ console.error('[journal photo]',err); jrStatus('couldn’t save photo — notes still saved', false); }
  }
  // merge matrix_images: keep non-journal, replace the single journal image
  let imgs=[];
  try {
    const { data } = await sb.from('cosmic_phases').select('matrix_images')
      .eq('game_id', activeGameId).eq('map_phase', activePhase).maybeSingle();
    imgs = Array.isArray(data?.matrix_images) ? data.matrix_images : [];
  } catch(e){}
  if (newUrl){ imgs = imgs.filter(i=>!(i&&i.source==='journal')); imgs.push({ url:newUrl, source:'journal' }); }

  const loc = phaseByKey(activePhase);
  try {
    const { error } = await sb.from('cosmic_phases').upsert({
      game_id: activeGameId, user_id: currentUser.id, map_phase: activePhase,
      diary_text: text, matrix_images: imgs,
      location_data: { sign:loc?.sign||null, location:loc?.location||null, opens_utc:loc?.opens_utc||null },
      updated_at: new Date().toISOString(),
    }, { onConflict:'game_id,map_phase' });
    if (error) throw error;
  } catch(err){
    console.error('[journal save]',err); jrStatus('something went wrong — try again', false);
    setSave(true,'finish →'); return;
  }
  journalPending = null;
  stepDone();
}
function jrStatus(msg,ok){ const el=$('jr-status'); if(el){ el.textContent=msg; el.style.color=ok?'#6ab86a':'#E8478B'; } }

// ── MESSAGE HANDLERS — iframes report, matrix writes ────────
window.addEventListener('message', async e=>{
  const msg = e.data || {}; if (!msg.type) return;

  // character builder loaded
  if (msg.type==='iframe_ready' && msg.game==='character'){
    if (currentStep==='character'){ const b=$('save-btn'); if(b){ b.disabled=false; b.innerHTML='continue →'; } }
    return;
  }

  // cosmic bingo loaded — hydrate it with the season board
  if (msg.type==='cosmic_bingo_ready'){
    const iframe=$('game-iframe');
    if (iframe && Array.isArray(cosmicBoard?.marked)){
      iframe.contentWindow.postMessage({ type:'load_state', marked:cosmicBoard.marked }, '*');
    }
    return;
  }

  // character state → cosmic_phases (idempotent on game_id, map_phase)
  if (msg.type==='char_state'){
    const charState = msg.state || {};
    if (!charState.body){ showStatus('pick a body first!','#E8478B'); const b=$('save-btn'); b.disabled=false; b.innerHTML='continue →'; return; }
    const loc = phaseByKey(activePhase);
    try {
      const { error } = await sb.from('cosmic_phases').upsert({
        game_id: activeGameId, user_id: currentUser.id, map_phase: activePhase,
        character_data: charState,
        location_data: { sign:loc?.sign||null, location:loc?.location||null, opens_utc:loc?.opens_utc||null },
        updated_at: new Date().toISOString(),
      }, { onConflict:'game_id,map_phase' });
      if (error) throw error;
      showStatus('character saved ✓','#6ab86a'); setSave(false); stepBingo();
    } catch(err){ console.error('[char save]',err); showStatus('save failed','#E8478B'); const b=$('save-btn'); b.disabled=false; b.innerHTML='continue →'; }
    return;
  }

  // season bingo board → cosmic_bingo (one row per user+game)
  if (msg.type==='bingo_state'){
    const { marked, score } = msg;
    cosmicBoard = { marked, score };
    try {
      const { error } = await sb.from('cosmic_bingo').upsert({
        game_id: activeGameId, user_id: currentUser.id,
        bingo_data: { marked, score }, updated_at: new Date().toISOString(),
      }, { onConflict:'user_id,game_id' });
      if (error) throw error;
      showStatus('board saved ✓','#6ab86a'); setSave(false); stepJournal();
    } catch(err){ console.error('[bingo save]',err); showStatus('save failed','#E8478B'); const b=$('save-btn'); b.disabled=false; b.innerHTML='continue →'; }
    return;
  }
});

init();
</script>
