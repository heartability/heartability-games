<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room — Heartability</title>
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --line-col:   #111;
}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background-image: url('../assets/elements/turret.jpeg');
  background-size: auto;
  background-position: center;
  background-repeat: repeat;
  font-family: var(--font-hand);
  user-select: none;
}

/* ─────────────────────────────────────────────────
   TOP NAV BAR  (matches game-select exactly)
───────────────────────────────────────────────── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #c9fff5;
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(14px, 1.6vw, 20px);
  color: #111;
}
.nav-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  pointer-events: none; white-space: nowrap;
  font-family: var(--font-hand); font-size: clamp(14px, 1.6vw, 20px);
}
.nav-btn { cursor: pointer; padding: 4px 8px; border-radius: 2px; transition: background 0.15s; }
.nav-btn:hover { background: rgba(0,0,0,0.08); }

/* ── Gear dropdown ── */
.gear-wrap { position: relative; }
.gear-btn {
  width: 30px; height: 30px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px; transition: background 0.15s; padding: 3px;
}
.gear-btn:hover { background: rgba(0,0,0,0.08); }
.gear-btn img { width: 22px; height: 22px; display: block; }
.gear-dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; min-width: 170px;
  background: #c9fff5; border: 2px solid var(--line-col);
  box-shadow: 3px 4px 0 rgba(0,0,0,0.12);
  z-index: 201; display: none; flex-direction: column; overflow: hidden;
}
.gear-dropdown.open { display: flex; }
.gear-item {
  font-family: var(--font-hand); font-size: clamp(13px, 1.3vw, 16px); color: #333;
  padding: 9px 14px; cursor: pointer; border: none; background: none;
  text-align: left; white-space: nowrap; transition: background 0.12s;
}
.gear-item:hover { background: rgba(0,0,0,0.07); }

/* ─────────────────────────────────────────────────
   PAGE LAYOUT
───────────────────────────────────────────────── */
.page-body {
  position: fixed;
  top: 44px;
  left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* ─────────────────────────────────────────────────
   CHAT WINDOW  (modal-window aesthetic)
───────────────────────────────────────────────── */
.chat-window {
  position: relative;
  width: clamp(320px, 88vw, 820px);
  height: clamp(400px, 84dvh, 700px);
  background: #f5f0ea;
  box-shadow: 0 0 0 3px #6579e2, 0 0 0 6px #83d2e6, 6px 10px 40px rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── title bar ─── */
.chat-titlebar {
  flex-shrink: 0;
  height: 42px;
  background: #e8e3da;
  border-bottom: 2px solid #bbb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-hand);
  font-size: clamp(14px, 1.6vw, 20px);
  color: #333;
  letter-spacing: 0.5px;
  position: relative;
}

/* ─── online indicator ─── */
.online-count {
  position: absolute;
  right: 14px;
  font-size: clamp(9px, 1vw, 12px);
  color: #888;
  font-family: var(--font-hand);
}
.online-dot {
  display: inline-block;
  width: 7px; height: 7px;
  background: #5cb85c;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}

/* ─── messages area ─── */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

.chat-message {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-width: 80%;
}
.chat-message.mine { align-self: flex-end; align-items: flex-end; }
.chat-message.theirs { align-self: flex-start; align-items: flex-start; }

.chat-bubble {
  padding: 9px 14px;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.4vw, 16px);
  line-height: 1.5;
  word-break: break-word;
  user-select: text;
}
.chat-message.mine .chat-bubble {
  background: #6579e2;
  color: #fff;
  border: 1.5px solid #4a5bc4;
}
.chat-message.theirs .chat-bubble {
  background: #fff;
  color: #222;
  border: 1.5px solid #ccc;
}

.chat-meta {
  font-size: clamp(9px, 0.9vw, 11px);
  color: #aaa;
  font-family: var(--font-hand);
  padding: 0 4px;
}

.chat-empty {
  text-align: center;
  color: #bbb;
  font-size: clamp(12px, 1.3vw, 15px);
  padding: 40px 0;
  font-style: italic;
  align-self: center;
  margin: auto;
}

/* ─── date divider ─── */
.chat-date-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 0;
  align-self: stretch;
}
.chat-date-divider span {
  font-size: 10px;
  color: #bbb;
  font-family: var(--font-hand);
  white-space: nowrap;
}
.chat-date-divider::before,
.chat-date-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #ddd;
}

/* ─── input area ─── */
.chat-input-area {
  flex-shrink: 0;
  border-top: 2px solid #ccc;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: #ede8e0;
}

.chat-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.chat-name-label {
  font-size: clamp(10px, 1vw, 12px);
  color: #888;
  white-space: nowrap;
  font-family: var(--font-hand);
}

.chat-name-input {
  width: calc(100% - 70px);
  font-family: var(--font-hand);
  font-size: clamp(11px, 1.2vw, 14px);
  color: #222;
  background: #f5f0ea;
  border: 1.5px solid #bbb;
  padding: 5px 10px;
  outline: none;
}
.chat-name-input:focus { border-color: #6579e2; }
.chat-name-input[readonly] { color: #888; background: #e8e3da; }

.chat-msg-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.chat-msg-input {
  flex: 1;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.3vw, 15px);
  color: #222;
  background: #f5f0ea;
  border: 1.5px solid #bbb;
  padding: 8px 12px;
  outline: none;
  resize: none;
  height: 60px;
  line-height: 1.5;
}
.chat-msg-input:focus { border-color: #6579e2; }

.chat-send-btn {
  flex-shrink: 0;
  padding: 8px 18px;
  background: #6579e2;
  border: 2px solid #4a5bc4;
  box-shadow: 2px 2px 0 #3a4aaa;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.3vw, 15px);
  color: #fff;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.05s;
  white-space: nowrap;
  align-self: stretch;
}
.chat-send-btn:hover { background: #4a5bc4; }
.chat-send-btn:active { box-shadow: none; transform: translate(2px,2px); }
.chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.chat-status {
  font-size: clamp(9px, 0.9vw, 11px);
  color: #999;
  font-family: var(--font-hand);
  min-height: 13px;
}

/* ─────────────────────────────────────────────────
   MOBILE
───────────────────────────────────────────────── */
@media (max-width: 768px) {
  .room-nav { font-size: clamp(12px, 3.5vw, 16px); }
  .page-body { padding: 12px; }
  .chat-window { width: 70vw; height: calc(80dvh - 44px - 24px); }
}

</style>
</head>
<body>

<!-- TOP NAV BAR -->
<nav class="room-nav">
  <div class="gear-wrap" id="gear-wrap">
    <div class="gear-btn" id="gear-btn" onclick="toggleGear()">
      <img src="../assets/elements/gear icon.png" alt="menu">
    </div>
    <div class="gear-dropdown" id="gear-dropdown">
      <button class="gear-item" onclick="window.location.href='../users/profile.html'">view profile</button>
      <button class="gear-item" id="gear-logout">sign out</button>
    </div>
  </div>
  <span class="nav-title">the turret</span>
  <div style="display:flex;align-items:center;gap:4px;">
    <span class="nav-btn" id="nav-back">← back</span>
    <span class="nav-btn" id="nav-next">next →</span>
  </div>
</nav>

<div class="page-body">
  <div class="chat-window">

    <div class="chat-titlebar">
      turret-chat
      <span class="online-count" id="online-count"></span>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="chat-empty" id="chat-empty">you could be the first</div>
    </div>

    <div class="chat-input-area">
      <div class="chat-name-row">
        <input class="chat-name-input" id="chat-name" type="text"
               placeholder="your name" maxlength="40" autocomplete="off">
      </div>
      <div class="chat-msg-row">
        <textarea class="chat-msg-input" id="chat-msg"
                  placeholder="type something..." maxlength="500"></textarea>
        <button class="chat-send-btn" id="chat-send" onclick="sendMessage()">Send</button>
      </div>
      <div class="chat-status" id="chat-status"></div>
    </div>

  </div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPA_URL = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
  const TABLE    = 'chatroom';

  const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

  /* ─── LocalStorage name persistence ─── */
  const NAME_KEY = 'hb_chat_name';

  function initNameField() {
    const nameEl   = document.getElementById('chat-name');
    const statusEl = document.getElementById('chat-status');
    const saved    = localStorage.getItem(NAME_KEY);
    if (saved) {
      nameEl.value    = saved;
      nameEl.readOnly = true;
      nameEl.style.color = '#888';
      statusEl.textContent = 'chatting as ' + saved + ' · not you? clear your browser data';
    }
  }

  /* ─── Helpers ─── */
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function myName() {
    return localStorage.getItem(NAME_KEY) ||
           document.getElementById('chat-name').value.trim() ||
           null;
  }

  function renderMessage(msg) {
    const savedName = localStorage.getItem(NAME_KEY);
    const isMine    = savedName && msg.name === savedName;
    const el        = document.createElement('div');
    el.className    = 'chat-message ' + (isMine ? 'mine' : 'theirs');
    el.dataset.id   = msg.id;
    el.innerHTML = `
      <div class="chat-bubble">${escapeHtml(msg.message)}</div>
      <div class="chat-meta">${escapeHtml(msg.name || 'anonymous')} · ${formatTime(msg.created_at)}</div>
    `;
    return el;
  }

  function scrollToBottom() {
    const container = document.getElementById('chat-messages');
    container.scrollTop = container.scrollHeight;
  }

  /* ─── Load existing messages ─── */
  async function loadMessages() {
    const { data, error } = await supa
      .from(TABLE)
      .select('*')
      .order('created_at', { ascending: true })
      .limit(200);

    if (error) { console.error('Chat load error:', error); return; }

    const container = document.getElementById('chat-messages');
    const empty     = document.getElementById('chat-empty');

    if (data && data.length > 0) {
      empty.style.display = 'none';
      container.querySelectorAll('.chat-message, .chat-date-divider').forEach(e => e.remove());

      let lastDate = null;
      data.forEach(msg => {
        const msgDate = new Date(msg.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
        if (msgDate !== lastDate) {
          const divider = document.createElement('div');
          divider.className = 'chat-date-divider';
          divider.innerHTML = `<span>${msgDate}</span>`;
          container.appendChild(divider);
          lastDate = msgDate;
        }
        container.appendChild(renderMessage(msg));
      });

      scrollToBottom();
    }
  }

  /* ─── Send message ─── */
  window.sendMessage = async function () {
    const nameEl   = document.getElementById('chat-name');
    const msgEl    = document.getElementById('chat-msg');
    const statusEl = document.getElementById('chat-status');
    const sendBtn  = document.getElementById('chat-send');

    const message = msgEl.value.trim();
    if (!message) return;

    const name = nameEl.value.trim() || null;

    sendBtn.disabled = true;

    const { error } = await supa.from(TABLE).insert({ name, message });

    if (error) {
      statusEl.textContent = 'something went wrong, try again';
      sendBtn.disabled = false;
      return;
    }

    // Lock name on first successful send
    if (name && !localStorage.getItem(NAME_KEY)) {
      localStorage.setItem(NAME_KEY, name);
      nameEl.readOnly    = true;
      nameEl.style.color = '#888';
      statusEl.textContent = 'chatting as ' + name + ' · not you? clear your browser data';
    }

    msgEl.value      = '';
    sendBtn.disabled = false;
    msgEl.focus();
  };

  /* ─── Send on Enter (Shift+Enter for newline) ─── */
  document.getElementById('chat-msg').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  /* ─── Realtime ─── */
  supa
    .channel('chat-room')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: TABLE }, payload => {
      const container = document.getElementById('chat-messages');
      const empty     = document.getElementById('chat-empty');
      empty.style.display = 'none';
      container.appendChild(renderMessage(payload.new));
      scrollToBottom();
    })
    .subscribe();

  /* ─── Nav ─── */
  window.toggleGear = function () {
    document.getElementById('gear-dropdown').classList.toggle('open');
  };
  document.addEventListener('click', e => {
    const wrap = document.getElementById('gear-wrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('gear-dropdown').classList.remove('open');
    }
  });
  document.getElementById('nav-back').addEventListener('click', () => { history.length > 1 ? history.back() : window.location.href = '../users/profile.html'; });
  document.getElementById('nav-next').addEventListener('click', () => { window.location.href = '../index.html'; });
  document.getElementById('gear-logout').addEventListener('click', async () => {
    await supa.auth.signOut();
    window.location.href = '../users/login.html';
  });

  /* ─── Init ─── */
  initNameField();
  loadMessages();

})();
</script>

</body>
</html>
