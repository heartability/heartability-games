<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="../assets/elements/favicon.png">
  <link rel="stylesheet" href="../assets/css/modal.css">
  <script src="../assets/js/modal.js" defer></script>
  <script>
    window.onTurnstileLoad = function () {
      window.turnstileReady = true;
      if (window.onTurnstileReadyCallback) window.onTurnstileReadyCallback();
    };
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
  <title>Login — Heartability</title>
  <meta name="description" content="Log in to Heartability to access your matrix, profile, and saved progress.">
  <meta name="robots" content="noindex,follow">
  <meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
  <style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:     "ZoesHandwriting", cursive;
  --font-pixel:    "PFPixelscript", cursive;
  --purple:        #6e83d3;
  --purple-dark:   #4a5bc4;
  --purple-shadow: #3a4aaa;
  --blue-glow:     #83d2e6;
  --mint:          #c9fff5;
  --cream:         #dfe2ef;
  --cream-dark:    #cdd3ec;
  --line-col:      #111;
  --side-col:      #e8e4dc;
}

html, body {
  width: 100vw;
  min-height: 100dvh;
  font-family: var(--font-hand);
  user-select: none;
  background: url('../assets/elements/patio-sky.png') center / cover no-repeat fixed;
  background-color: #5b7fe0;
}

/* ── TOP NAV ── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #6e83d3;
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(21px, 1.6vw, 25px);
  color: #fff;
}
.nav-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  color: inherit;
  text-decoration: none;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(0,0,0,0.08); }

/* ── PAGE BODY ── */
.page-body {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 64px 16px 40px;
  z-index: 10;
}

/* ── LOGIN WINDOW ── */
.login-window {
  width: min(90%, 460px);
  background: var(--cream);
  box-shadow: 0 0 0 4px var(--purple), 6px 10px 40px rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: windowIn 0.35s ease both;
}

@keyframes windowIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── TABS ── */
.tab-row {
  display: flex;
  border-bottom: 2px solid #ccc;
  background: var(--cream-dark);
}
.tab {
  flex: 1;
  padding: 10px;
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.4vw, 18px);
  text-align: center;
  cursor: pointer;
  color: #888;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: color 0.2s;
}
.tab.active {
  color: var(--purple);
  border-bottom-color: var(--purple);
}

/* ── FORM AREA ── */
.login-body {
  padding: 24px 28px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.form { display: none; flex-direction: column; gap: 14px; }
.form.active { display: flex; }

.field { display: flex; flex-direction: column; gap: 5px; }

label {
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.1vw, 15px);
  color: #888;
}

input[type="text"],
input[type="email"],
input[type="password"] {
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.4vw, 18px);
  color: #222;
  background: var(--cream);
  border: 1.5px solid #bbb;
  padding: 8px 12px;
  outline: none;
  transition: border-color 0.2s;
  user-select: text;
}
input:focus { border-color: var(--purple); }

/* ── BUTTON ── */
.btn-submit {
  padding: 10px 18px;
  background: var(--purple);
  border: 2px solid var(--purple-dark);
  box-shadow: 2px 2px 0 var(--purple-shadow);
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.4vw, 18px);
  color: #fff;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.05s;
  margin-top: 4px;
}
.btn-submit:hover  { background: var(--purple-dark); }
.btn-submit:active { box-shadow: none; transform: translate(2px,2px); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.forgot-link {
  align-self: flex-end;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1vw, 14px);
  color: #999;
  text-decoration: none;
  cursor: pointer;
  margin-top: -6px;
}
.forgot-link:hover { color: var(--purple); text-decoration: underline; }

/* ── MESSAGES ── */
.msg {
  font-size: clamp(13px, 1.1vw, 15px);
  padding: 8px 12px;
  font-family: var(--font-hand);
  display: none;
}
.msg.error   { display: block; color: #c0392b; background: rgba(192,57,43,0.08); border: 1px solid rgba(192,57,43,0.2); }
.msg.success { display: block; color: #2d7a4f; background: rgba(45,122,79,0.08); border: 1px solid rgba(45,122,79,0.2); }

/* ── FOOTER ── */
.login-footer {
  text-align: center;
  padding: 0 28px 18px;
  font-size: clamp(12px, 1vw, 14px);
  color: #aaa;
  font-family: var(--font-hand);
}

  </style>
</head>
<body>

<nav class="room-nav">
  <a class="nav-btn" href="../rooms/game-room.html">back</a>
  <h1 class="nav-title" style="margin:0; font:inherit; position:static; display:inline;">login</h1>
  <a class="nav-btn" href="../index.html">home</a>
</nav>

<div class="page-body">
  <div class="login-window">

    <div class="tab-row">
      <button class="tab active" onclick="switchTab('login', this)">log in</button>
      <button class="tab" onclick="switchTab('signup', this)">sign up</button>
    </div>

    <div class="login-body">

      <!-- Login -->
      <form class="form active" id="form-login" onsubmit="handleLogin(event)">
        <div class="field">
          <label>email</label>
          <input type="email" id="login-email" placeholder="your@email.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label>password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
          <a class="forgot-link" onclick="handleForgotPassword()">forgot password?</a>
        </div>
        <div class="msg" id="login-msg"></div>
        <button type="submit" class="btn-submit" id="login-btn">enter</button>
      </form>

      <!-- Signup -->
      <form class="form" id="form-signup" onsubmit="handleSignup(event)">
        <div class="field">
          <label>username</label>
          <input type="text" id="signup-username" placeholder="choose a name" required maxlength="40" autocomplete="off" />
        </div>
        <div class="field">
          <label>email</label>
          <input type="email" id="signup-email" placeholder="your@email.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label>password</label>
          <input type="password" id="signup-password" placeholder="at least 6 characters" required minlength="6" />
        </div>
        <div id="signup-turnstile"></div>
        <div class="msg" id="signup-msg"></div>
        <button type="submit" class="btn-submit" id="signup-btn">create account!</button>
      </form>

      <!-- Waitlist (shown instead of signup once capacity is reached) -->
      <div class="form" id="form-waitlist">
        <div class="msg error cap-notice" style="display:block;">we have reached capacity but are opening up more space soon! sign up for updates</div>
        <div class="field">
          <label>email</label>
          <input type="email" id="waitlist-email" placeholder="your@email.com" required autocomplete="email" />
        </div>
        <div class="msg" id="waitlist-msg"></div>
        <button type="button" class="btn-submit" id="waitlist-btn" onclick="handleWaitlistSignup()">join waitlist</button>
      </div>

    </div>

    <div class="login-footer">start exploring your dreams</div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-init.js"></script>
<script>
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = '../rooms/bed.html';
  });

  let signupCapFull = null;
  let turnstileWidgetId = null;

  function ensureTurnstileRendered() {
    if (turnstileWidgetId !== null || !window.turnstileReady) return;
    const container = document.getElementById('signup-turnstile');
    if (!container || container.offsetParent === null) return;
    turnstileWidgetId = turnstile.render('#signup-turnstile', { sitekey: '0x4AAAAAAEMGtLq6PNPzXkxz', size: 'flexible' });
  }
  window.onTurnstileReadyCallback = ensureTurnstileRendered;

  async function checkSignupCapacity() {
    if (signupCapFull !== null) return signupCapFull;
    const { data, error } = await sb.rpc('get_signup_capacity');
    signupCapFull = !error && data && data[0] ? data[0].is_full : false;
    return signupCapFull;
  }

  function isCapError(error) {
    const msg = (error.message || '').toLowerCase();
    return msg.includes('signup_cap_reached') || msg.includes('database error saving new user');
  }

  async function switchTab(tab, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.msg').forEach(m => { if (m.id !== 'waitlist-msg' && !m.classList.contains('cap-notice')) { m.className = 'msg'; m.textContent = ''; } });

    if (tab === 'signup') {
      const full = await checkSignupCapacity();
      document.getElementById(full ? 'form-waitlist' : 'form-signup').classList.add('active');
      if (!full) ensureTurnstileRendered();
    } else {
      document.getElementById('form-' + tab).classList.add('active');
    }
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'entering...';
    const { error } = await sb.auth.signInWithPassword({
      email:    document.getElementById('login-email').value.trim(),
      password: document.getElementById('login-password').value
    });
    if (error) {
      showMsg('login-msg', error.message, 'error');
      btn.disabled = false; btn.textContent = 'enter';
    } else {
      showMsg('login-msg', 'welcome back! loading your profile...', 'success');
      setTimeout(() => window.location.href = '../rooms/bed.html', 800);
    }
  }

  async function handleForgotPassword() {
    const email = document.getElementById('login-email').value.trim();
    if (!email) {
      showMsg('login-msg', 'enter your email above first, then click "forgot password?"', 'error');
      return;
    }
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/users/reset-password.html'
    });
    if (error) {
      showMsg('login-msg', error.message, 'error');
    } else {
      showMsg('login-msg', 'check your email for a link to reset your password.', 'success');
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    const btn = document.getElementById('signup-btn');
    btn.disabled = true; btn.textContent = 'creating...';
    const username = document.getElementById('signup-username').value.trim();
    const email    = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const captchaToken = turnstileWidgetId !== null ? turnstile.getResponse(turnstileWidgetId) : undefined;
    if (!captchaToken) {
      showMsg('signup-msg', 'please complete the checkbox verification.', 'error');
      btn.disabled = false; btn.textContent = 'create account!';
      return;
    }
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username }, captchaToken } });
    if (error) {
      if (turnstileWidgetId !== null) turnstile.reset(turnstileWidgetId);
      if (isCapError(error)) {
        signupCapFull = true;
        document.getElementById('form-signup').classList.remove('active');
        document.getElementById('form-waitlist').classList.add('active');
        document.getElementById('waitlist-email').value = email;
        return;
      }
      showMsg('signup-msg', error.message, 'error');
      btn.disabled = false; btn.textContent = 'create account!';
      return;
    }
    showMsg('signup-msg', 'account created! taking you to membership options...', 'success');
    setTimeout(() => window.location.href = 'membership.html', 1000);
  }

  async function handleWaitlistSignup() {
    const btn = document.getElementById('waitlist-btn');
    const email = document.getElementById('waitlist-email').value.trim();
    if (!email) return;
    btn.disabled = true; btn.textContent = 'joining...';
    const { error } = await sb.from('waitlist').insert({ email });
    if (error) {
      const alreadyOn = error.code === '23505';
      showMsg('waitlist-msg', alreadyOn ? "you're already on the list!" : error.message, alreadyOn ? 'success' : 'error');
    } else {
      showMsg('waitlist-msg', "you're on the list! we'll email you when space opens up.", 'success');
    }
    btn.disabled = false; btn.textContent = 'join waitlist';
  }

  if (new URLSearchParams(window.location.search).get('tab') === 'signup') {
    switchTab('signup', document.querySelector('.tab-row .tab:nth-child(2)'));
  }
</script>

</body>
</html>
