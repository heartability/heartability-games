<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile — Heartability</title>
  <style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:     "ZoesHandwriting", cursive;
  --font-pixel:    "PFPixelscript", cursive;
  --purple:        #6579e2;
  --purple-dark:   #4a5bc4;
  --purple-shadow: #3a4aaa;
  --blue-glow:     #83d2e6;
  --mint:          #c9fff5;
  --cream:         #f5f0ea;
  --cream-dark:    #e8e3da;
  --line-col:      #111;
  --side-col:      #e8e4dc;
}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: var(--side-col);
  font-family: var(--font-hand);
  user-select: none;
}

/* ── ROOM BACKGROUND ── */
.room-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.room-bg svg { width: 100%; height: 100%; display: block; }
.room-back-wall {
  position: fixed;
  top: 9%; left: 15%;
  width: 70%; height: 70%;
  background: #f0ece4;
  border: 2px solid var(--line-col);
  z-index: 1;
  pointer-events: none;
}

/* ── TOP NAV ── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: var(--mint);
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(14px, 1.6vw, 20px);
  color: #111;
}
.nav-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(0,0,0,0.08); }

/* ── ROOM ICONS — absolute positions within back wall ── */
.room-icons {
  position: fixed;
  top: 9%; left: 15%;
  width: 70%; height: 70%;
  z-index: 10;
  display: none;
}
.room-icons.active { display: block; }

.room-icon {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 10px;
  border-radius: 4px;
  transition: transform 0.15s;
  transform-origin: bottom center;
}
.room-icon:hover { transform: translateY(-5px); }
.room-icon:active { transform: translateY(-2px); }

/* ── PER-ICON POSITION & SIZE — adjust these ── */

/* SETTINGS — top left */
#icon-settings {
  top:  4%;
  left: 4%;
}
#icon-settings img { width: clamp(45px, 7vw, 75px); }

/* LEADERBOARD — center of wall, horizontally centered */
#icon-leaderboard {
  top:  28%;
  left: 50%;
  transform: translateX(-50%);
}
#icon-leaderboard:hover { transform: translateX(-50%) translateY(-5px); }
#icon-leaderboard:active { transform: translateX(-50%) translateY(-2px); }
#icon-leaderboard img { width: clamp(130px, 18vw, 280px); }

/* CHATROOM — center of wall, right third */
#icon-chatroom {
  top:  32%;
  right: 8%;
}
#icon-chatroom img { width: clamp(100px, 13vw, 200px); }

/* CALENDAR — center of wall, left third */
#icon-calendar {
  top:  32%;
  left: 12%;
}
#icon-calendar img { width: clamp(120px, 11vw, 180px); }

.room-icon img {
  height: auto;
  filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.18));
  transition: filter 0.15s;
}
.room-icon:hover img { filter: drop-shadow(2px 6px 14px rgba(101,121,226,0.4)); }

.room-icon-label {
  font-family: var(--font-hand);
  font-size: clamp(10px, 1.1vw, 13px);
  color: #555;
  text-align: center;
  line-height: 1.3;
  white-space: nowrap;
}

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position: absolute;
  left: calc(100% - 8px);
  bottom: 62%;
  min-width: clamp(140px, 16vw, 220px);
  max-width: clamp(160px, 20vw, 260px);
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 12px 18px;
  font-family: var(--font-hand);
  font-size: clamp(11px, 1.2vw, 14px);
  color: #000;
  text-align: center;
  line-height: 1.5;
  filter: drop-shadow(1px 3px 5px rgba(0,0,0,0.18));
  z-index: 21;
  opacity: 0;
  transform: scale(0.92) translateY(4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}
.thought-bubble.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

/* ── HEART CHARACTER ── */
@keyframes idle-pulse {
  0%,100% { transform: translateY(0) rotate(-2deg) scale(1); }
  50%      { transform: translateY(-8px) rotate(2deg) scale(1.03); }
}
.char-heart {
  position: fixed;
  left: 18vw;
  bottom: 18vh;
  width: clamp(120px, 16vw, 230px);
  z-index: 20;
  pointer-events: none;
}
.char-heart img {
  display: block;
  width: 100%; height: auto;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25));
  animation: idle-pulse 3.6s ease-in-out 1s infinite;
}

/* ── MODAL OVERLAY ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open {
  display: flex;
  animation: fadeIn 0.2s ease both;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ── MODAL WINDOW ── */
.modal-window {
  background: var(--cream);
  box-shadow: 0 0 0 3px var(--purple), 0 0 0 6px var(--blue-glow), 6px 10px 40px rgba(0,0,0,0.35);
  overflow: hidden;
  width: min(92vw, 520px);
  max-height: 82dvh;
  display: flex;
  flex-direction: column;
  animation: windowIn 0.25s ease both;
}
.modal-window.wide { width: min(92vw, 680px); }

@keyframes windowIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.modal-titlebar {
  height: 38px;
  background: var(--cream-dark);
  border-bottom: 2px solid #bbb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.4vw, 16px);
  color: #555;
  flex-shrink: 0;
}
.modal-close {
  cursor: pointer;
  font-size: 20px;
  color: #bbb;
  line-height: 1;
  padding: 2px 4px;
  transition: color 0.15s;
}
.modal-close:hover { color: #444; }

.modal-body {
  padding: 20px 22px;
  overflow-y: auto;
  flex: 1;
}
.modal-body.no-pad { padding: 0; overflow-y: auto; }

/* ── SETTINGS ROWS ── */
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,0.07);
  font-size: clamp(12px, 1.3vw, 15px);
  color: #333;
  gap: 12px;
}
.setting-row:last-of-type { border-bottom: none; }
.setting-label { color: #888; white-space: nowrap; }
.setting-value { font-weight: 600; font-size: clamp(12px, 1.2vw, 14px); text-align: right; word-break: break-all; }

.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

.btn-action {
  padding: 7px 14px;
  background: none;
  border: 1.5px solid var(--purple);
  font-family: var(--font-hand);
  font-size: clamp(11px, 1.1vw, 13px);
  color: var(--purple);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.btn-action:hover { background: var(--purple); color: white; }

.btn-upgrade-inline {
  padding: 8px 16px;
  background: var(--purple);
  border: 2px solid var(--purple-dark);
  box-shadow: 2px 2px 0 var(--purple-shadow);
  font-family: var(--font-hand);
  font-size: clamp(11px, 1.1vw, 13px);
  color: #fff;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.05s;
  white-space: nowrap;
}
.btn-upgrade-inline:hover  { background: var(--purple-dark); }
.btn-upgrade-inline:active { box-shadow: none; transform: translate(2px,2px); }

/* ── LEADERBOARD ── */
.leaderboard-header {
  display: grid;
  grid-template-columns: 36px 1fr 100px;
  gap: 8px;
  padding: 6px 10px 8px;
  font-family: var(--font-hand);
  font-size: clamp(10px, 1vw, 12px);
  color: #aaa;
  letter-spacing: 0.3px;
  border-bottom: 1px solid #e0dbd0;
}
.leaderboard-row {
  display: grid;
  grid-template-columns: 36px 1fr 100px;
  gap: 8px;
  padding: 9px 10px;
  border-bottom: 1px solid rgba(0,0,0,0.05);
  font-size: clamp(12px, 1.2vw, 14px);
  color: #333;
  transition: background 0.1s;
  align-items: center;
}
.leaderboard-row:last-child { border-bottom: none; }
.leaderboard-row:hover { background: rgba(101,121,226,0.04); }
.leaderboard-row.is-me { background: rgba(101,121,226,0.08); border-left: 3px solid var(--purple); padding-left: 7px; }
.lb-rank { font-family: monospace; font-size: clamp(12px, 1.2vw, 15px); color: #aaa; text-align: center; }
.lb-rank.top3 { color: var(--purple); font-weight: bold; }
.lb-username { font-family: var(--font-hand); font-weight: 600; word-break: break-all; }
.lb-username.is-me::after { content: ' (you)'; color: var(--purple); font-size: 11px; font-weight: normal; }
.lb-saves { text-align: right; font-family: var(--font-hand); color: #555; }
.lb-divider { padding: 8px 10px; text-align: center; color: #ccc; font-size: 12px; letter-spacing: 1px; }
.lb-empty { padding: 30px 20px; text-align: center; font-family: var(--font-hand); color: #bbb; font-style: italic; font-size: 14px; line-height: 1.7; }
.lb-loading { padding: 24px; text-align: center; font-family: var(--font-hand); color: #aaa; font-size: 14px; }
.lb-refresh { font-size: 11px; color: #aaa; cursor: pointer; margin-left: auto; padding: 0 4px; }
.lb-refresh:hover { color: var(--purple); }

/* ── LOADING ── */
#loading-state {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-pixel);
  font-size: clamp(18px, 2vw, 24px);
  color: var(--blue-glow);
  text-shadow: 0 0 20px rgba(131,210,230,0.6);
  z-index: 50;
}

/* ── LEGAL FOOTER ── */
.legal-footer {
  position: fixed;
  bottom: 12px;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--font-hand);
  font-size: clamp(10px, 1vw, 12px);
  color: #aaa;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.legal-footer a { color: #111; text-decoration: none; transition: color 0.15s; }
.legal-footer a:hover { color: var(--purple); }
.legal-footer span { color: #ccc; }

  </style>
</head>
<body>

<!-- ROOM BACKGROUND -->
<div class="room-bg" aria-hidden="true">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="0"   y1="0"   x2="50" y2="30" stroke="#111" stroke-width=".18"/>
    <line x1="100" y1="0"   x2="50" y2="30" stroke="#111" stroke-width=".18"/>
    <line x1="0"   y1="100" x2="50" y2="30" stroke="#111" stroke-width=".18"/>
    <line x1="100" y1="100" x2="50" y2="30" stroke="#111" stroke-width=".18"/>
  </svg>
</div>
<div class="room-back-wall" aria-hidden="true"></div>

<!-- NAV -->
<nav class="room-nav">
  <span class="nav-btn" onclick="history.length > 1 ? history.back() : window.location.href='../games/game-select.html'">back</span>
  <span style="font-family:var(--font-hand);font-size:clamp(13px,1.5vw,15px);">welcome, <span id="display-username"></span></span>
  <span class="nav-btn" id="btn-signout">sign out</span>
</nav>

<!-- LOADING -->
<div id="loading-state">loading your space ♡</div>

<!-- ROOM ICONS -->
<div class="room-icons" id="main-content">
  <div class="room-icon" id="icon-settings" onclick="openModal('settings')">
    <img src="../assets/elements/settings.png" alt="account settings" />
  </div>
  <div class="room-icon" id="icon-leaderboard" onclick="openModal('leaderboard')">
    <img src="../assets/elements/leaderboard.png" alt="leaderboard" />
  </div>
  <div class="room-icon" id="icon-chatroom" onclick="window.location.href='../users/chatroom.html'">
    <img src="../assets/elements/chatroom.png" alt="chat room" />
  </div>
  <div class="room-icon" id="icon-calendar" onclick="window.location.href='/users/archive.html'">
    <img src="../assets/elements/calendar.png" alt="map archive" />
  </div>
</div>

<!-- HEART CHARACTER -->
<div class="char-heart" aria-hidden="true">
  <div class="thought-bubble" id="thought-bubble">hello! ♡</div>
  <img src="../assets/elements/guides/heart.png" alt="" />
</div>

<!-- MODAL: ACCOUNT SETTINGS -->
<div class="modal-overlay" id="modal-settings" onclick="closeOnOverlay(event,'settings')">
  <div class="modal-window">
    <div class="modal-titlebar">
      account settings
      <span class="modal-close" onclick="closeModal('settings')">×</span>
    </div>
    <div class="modal-body">
      <div class="setting-row">
        <span class="setting-label">username</span>
        <span class="setting-value" id="settings-username">—</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">email</span>
        <span class="setting-value" id="settings-email">—</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">password</span>
        <span class="setting-value">••••••••</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">membership</span>
        <span class="setting-value" id="settings-membership" style="color:var(--purple);">—</span>
      </div>
      <div class="btn-row">
        <button class="btn-action" onclick="editUsername()">edit username</button>
        <button class="btn-action" onclick="changePassword()">change password</button>
        <button class="btn-action" id="btn-upgrade-settings" onclick="goToUpgrade()" style="display:none;">upgrade membership</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: LEADERBOARD -->
<div class="modal-overlay" id="modal-leaderboard" onclick="closeOnOverlay(event,'leaderboard')">
  <div class="modal-window">
    <div class="modal-titlebar">
      weekly leaderboard
      <div style="display:flex;gap:12px;align-items:center;">
        <span class="lb-refresh" onclick="loadLeaderboard()" title="refresh">↻</span>
        <span class="modal-close" onclick="closeModal('leaderboard')">×</span>
      </div>
    </div>
    <div class="modal-body no-pad">
      <div id="leaderboard-content">
        <div class="lb-loading">loading this week's rankings...</div>
      </div>
    </div>
  </div>
</div>


<!-- LEGAL FOOTER -->
<footer class="legal-footer">
  <a href="../legal/privacy-policy.html">privacy policy</a>
  <span>·</span>
  <a href="../legal/refund-policy.html">refund policy</a>
  <span>·</span>
  <a href="../legal/support.html">support</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL      = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── Modal helpers ─────────────────────────────────────────
  window.openModal = function (id) {
    document.getElementById('modal-' + id).classList.add('open');
  };
  window.closeModal = function (id) {
    document.getElementById('modal-' + id).classList.remove('open');
  };
  window.closeOnOverlay = function (e, id) {
    if (e.target === e.currentTarget) closeModal(id);
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape')
      document.querySelectorAll('.modal-overlay.open').forEach(el => el.classList.remove('open'));
  });

  // ── Auth check ───────────────────────────────────────────
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    await loadProfile(session.user);
  }

  async function loadProfile(user) {
    const { data: profile } = await sb
      .from('user-profiles')
      .select('*')
      .eq('id', user.id)
      .single();

    const username = profile?.username || 'explorer';
    document.getElementById('display-username').textContent  = username;
    document.getElementById('settings-username').textContent = username;
    document.getElementById('settings-email').textContent    = user.email;

    const membershipStatus = profile?.membership_status || 'free';
    applyMembershipUI(membershipStatus);

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').classList.add('active');
  }

  // ── Membership UI ─────────────────────────────────────────
  function applyMembershipUI(status) {
    const membershipEl = document.getElementById('settings-membership');
    const upgradeBtn   = document.getElementById('btn-upgrade-settings');
    if (status === 'founding') {
      membershipEl.textContent = '✦ founding member';
      membershipEl.style.color = 'var(--purple-dark)';
      upgradeBtn.style.display = 'none';
    } else if (status === 'basic') {
      membershipEl.textContent = 'basic member';
      membershipEl.style.color = 'var(--purple)';
      upgradeBtn.textContent   = 'upgrade to founding member';
      upgradeBtn.style.display = 'inline-block';
    } else {
      membershipEl.textContent = 'free member';
      membershipEl.style.color = '#aaa';
      upgradeBtn.textContent   = 'upgrade membership';
      upgradeBtn.style.display = 'inline-block';
    }
  }

  window.goToUpgrade = function () { window.location.href = '/users/membership.html'; };

  // ── Edit username ─────────────────────────────────────────
  window.editUsername = async function () {
    const newName = prompt('enter new username:');
    if (!newName || !newName.trim()) return;
    const { data: { session } } = await sb.auth.getSession();
    const { error } = await sb.from('user-profiles')
      .update({ username: newName.trim() })
      .eq('id', session.user.id);
    if (!error) {
      document.getElementById('display-username').textContent  = newName.trim();
      document.getElementById('settings-username').textContent = newName.trim();
    } else { alert('error: ' + error.message); }
  };

  // ── Change password ───────────────────────────────────────
  window.changePassword = async function () {
    const newPass = prompt('enter new password (min 6 characters):');
    if (!newPass || newPass.length < 6) return;
    const { error } = await sb.auth.updateUser({ password: newPass });
    if (error) alert('error: ' + error.message);
  };

  // ── Sign out ──────────────────────────────────────────────
  document.getElementById('btn-signout').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  // ── Leaderboard ───────────────────────────────────────────
  window.loadLeaderboard = async function () {
    const el = document.getElementById('leaderboard-content');
    el.innerHTML = '<div class="lb-loading">loading rankings...</div>';
    const { data, error } = await sb.rpc('get_weekly_leaderboard');
    if (error || !data?.length) {
      el.innerHTML = `<div class="lb-empty">no entries this week yet — make a save today to get on the board ♡<br>
        <span style="font-size:12px;color:#ccc;">rankings reset every 7 days</span></div>`;
      return;
    }
    const myRow   = data.find(r => r.is_me);
    const topRows = data.slice(0, 20);
    const myInTop = topRows.some(r => r.is_me);
    let html = `<div class="leaderboard-header"><span>#</span><span>player</span><span style="text-align:right">saves</span></div>`;
    topRows.forEach(r => {
      const rankLabel = r.rank <= 3 ? ['🥇','🥈','🥉'][r.rank - 1] : r.rank;
      html += `<div class="leaderboard-row${r.is_me ? ' is-me' : ''}">
        <span class="lb-rank${r.rank <= 3 ? ' top3' : ''}">${rankLabel}</span>
        <span class="lb-username${r.is_me ? ' is-me' : ''}">${r.username}</span>
        <span class="lb-saves">${r.weekly_saves} day${r.weekly_saves !== 1 ? 's' : ''}</span>
      </div>`;
    });
    if (!myInTop && myRow) {
      html += `<div class="lb-divider">· · ·</div>
        <div class="leaderboard-row is-me">
          <span class="lb-rank">${myRow.rank}</span>
          <span class="lb-username is-me">${myRow.username}</span>
          <span class="lb-saves">${myRow.weekly_saves} day${myRow.weekly_saves !== 1 ? 's' : ''}</span>
        </div>`;
    }
    el.innerHTML = html;
  };

  // ── Thought bubble ────────────────────────────────────────
  const bubble = document.getElementById('thought-bubble');
  const bubbleMessages = {
    'icon-settings':    "manage your membership settings, update your password or username.",
    'icon-leaderboard': 'see where you rank this week!',
    'icon-calendar':    'reflect on your journey so far <3',
    'icon-chatroom':    'hang out with other players ♡',
  };

  document.querySelectorAll('.room-icon').forEach(icon => {
    icon.addEventListener('mouseenter', () => {
      bubble.textContent = bubbleMessages[icon.id] || '♡';
      bubble.classList.add('visible');
    });
    icon.addEventListener('mouseleave', () => {
      bubble.classList.remove('visible');
    });
  });

  init();
  setTimeout(window.loadLeaderboard, 600);
})();
</script>

</body>
</html>
