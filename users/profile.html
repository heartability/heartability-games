<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile — Heartability</title>
  <style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:     "ZoesHandwriting", cursive;
  --font-pixel:    "PFPixelscript", cursive;
  --purple:        #6579e2;
  --purple-dark:   #4a5bc4;
  --purple-shadow: #3a4aaa;
  --blue-glow:     #83d2e6;
  --mint:          #c9fff5;
  --cream:         #f5f0ea;
  --cream-dark:    #e8e3da;
  --line-col:      #111;
}

html, body {
  width: 100vw;
  min-height: 100dvh;
  background-image: url('../assets/elements/stars.gif');
  background-size: auto;
  background-position: center;
  background-repeat: repeat;
  font-family: var(--font-hand);
  user-select: none;
}

/* ── TOP NAV ── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: var(--mint);
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(14px, 1.6vw, 20px);
  color: #111;
}
.nav-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(0,0,0,0.08); }

/* ── PAGE BODY ── */
.page-wrap {
  min-height: 100dvh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 52px 20px 48px;
}

.page-body {
  width: 100%;
  max-width: 860px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── WINDOW SHELL (shared) ── */
.window {
  background: var(--cream);
  border-radius: 4px;
  box-shadow: 0 0 0 3px var(--purple), 0 0 0 6px var(--blue-glow), 4px 8px 28px rgba(0,0,0,0.28);
  overflow: hidden;
  animation: windowIn 0.35s ease both;
}
.window:nth-child(2) { animation-delay: 0.05s; }
.window:nth-child(3) { animation-delay: 0.1s;  }
.window:nth-child(4) { animation-delay: 0.15s; }
.window:nth-child(5) { animation-delay: 0.2s;  }

@keyframes windowIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.window-titlebar {
  height: 38px;
  background: var(--cream-dark);
  border-bottom: 2px solid #bbb;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.4vw, 16px);
  color: #555;
  gap: 10px;
}

.window-body {
  padding: 20px 22px;
}

/* ── WELCOME HEADING ── */
.welcome-heading {
  font-family: var(--font-pixel);
  font-size: clamp(20px, 5vw, 40px);
  color: #fff;
  text-shadow: 0 0 40px rgba(131,210,230,0.55), 0 2px 12px rgba(0,0,0,0.5);
  text-align: center;
  padding: 30px 0 18px;
  letter-spacing: 1px;
  line-height: 1.15;
}

/* ── SECTION GRID ── */
.section-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

@media (max-width: 580px) {
  .section-grid { grid-template-columns: 1fr; }
}

/* ── SETTINGS ROWS ── */
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,0.07);
  font-size: clamp(12px, 1.3vw, 15px);
  color: #333;
  gap: 12px;
}
.setting-row:last-of-type { border-bottom: none; }
.setting-label { color: #888; white-space: nowrap; }
.setting-value { font-weight: 600; font-size: clamp(12px, 1.2vw, 14px); text-align: right; word-break: break-all; }

.btn-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.btn-action {
  padding: 7px 14px;
  background: none;
  border: 1.5px solid var(--purple);
  font-family: var(--font-hand);
  font-size: clamp(11px, 1.1vw, 13px);
  color: var(--purple);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.btn-action:hover { background: var(--purple); color: white; }

/* ── SAVED DATA ── */
.saved-data-wrap {
  position: relative;
}

/* locked overlay for free users */
.saved-lock-overlay {
  position: absolute;
  inset: 0;
  background: rgba(245,240,234,0.88);
  backdrop-filter: blur(2px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px;
  text-align: center;
  z-index: 10;
}

.lock-icon {
  font-size: 28px;
  line-height: 1;
}

.lock-msg {
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.3vw, 15px);
  color: #666;
  line-height: 1.5;
  max-width: 200px;
}

.btn-upgrade-inline {
  padding: 8px 16px;
  background: var(--purple);
  border: 2px solid var(--purple-dark);
  box-shadow: 2px 2px 0 var(--purple-shadow);
  font-family: var(--font-hand);
  font-size: clamp(11px, 1.1vw, 13px);
  color: #fff;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.05s;
  white-space: nowrap;
}
.btn-upgrade-inline:hover  { background: var(--purple-dark); }
.btn-upgrade-inline:active { box-shadow: none; transform: translate(2px,2px); }

/* saved items */
.saved-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,0.07);
  font-size: clamp(12px, 1.3vw, 15px);
}
.saved-item:last-child { border-bottom: none; }
.saved-icon { font-size: 20px; }
.saved-name { flex: 1; color: #333; }

.saved-link {
  font-family: var(--font-hand);
  font-size: clamp(9px, 0.9vw, 11px);
  padding: 3px 8px;
  background: rgba(101,121,226,0.1);
  border: 1px solid var(--purple);
  color: var(--purple);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.saved-link:hover {
  background: var(--purple);
  color: #fff;
}

.saved-tag {
  font-family: var(--font-hand);
  font-size: clamp(9px, 0.9vw, 11px);
  padding: 3px 8px;
  background: var(--cream-dark);
  border: 1px solid #ccc;
  color: #aaa;
}

/* ── MINI ARCHIVE PANEL ── */
.mini-archive-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
}

.mini-game-dropdown {
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.2vw, 14px);
  border: 1.5px solid var(--purple);
  background: var(--cream);
  color: #333;
  padding: 5px 10px;
  cursor: pointer;
  outline: none;
  flex: 1;
  min-width: 160px;
  max-width: 300px;
}
.mini-game-dropdown:focus { border-color: var(--blue-glow); }

.mini-month-nav {
  display: flex;
  align-items: center;
  gap: 10px;
}
.mini-month-btn {
  font-family: monospace;
  font-size: 14px;
  background: none;
  border: 1.5px solid var(--purple);
  color: var(--purple);
  width: 28px; height: 28px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.mini-month-btn:hover { background: var(--purple); color: #fff; }
.mini-month-label {
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.3vw, 15px);
  color: #555;
  min-width: 130px;
  text-align: center;
}

/* Mini calendar grid */
.mini-cal-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-bottom: 3px;
}
.mini-cal-day-label {
  text-align: center;
  font-family: monospace;
  font-size: 10px;
  color: #bbb;
  padding: 2px 0;
}
.mini-cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}
.mini-cal-cell {
  height: 32px;
  border: 1px solid rgba(101,121,226,.12);
  background: rgba(255,255,255,.35);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mini-cal-cell.filler { background: transparent; border-color: transparent; }
.mini-cal-cell.has-entry {
  border-color: var(--purple);
  background: rgba(101,121,226,.05);
  cursor: pointer;
}
.mini-cal-cell.has-entry:hover { border-color: var(--blue-glow); background: rgba(101,121,226,.1); }
.mini-cal-cell.is-today { border-color: var(--blue-glow); box-shadow: 0 0 0 1px var(--blue-glow); }

.mini-cal-date {
  font-family: monospace;
  font-size: 9px;
  color: #ccc;
  position: absolute;
  top: 3px; left: 4px;
  line-height: 1;
}
.mini-cal-cell.has-entry .mini-cal-date { color: var(--purple); }
.mini-cal-cell.is-today .mini-cal-date  { color: var(--blue-glow); }

.mini-cal-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-left: 10px; /* nudge right of the date number */
}

.mini-archive-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}
.mini-entry-count {
  font-family: var(--font-hand);
  font-size: clamp(11px, 1vw, 12px);
  color: #bbb;
}

/* ── LOADING ── */
#loading-state {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-pixel);
  font-size: clamp(18px, 2vw, 24px);
  color: var(--blue-glow);
  text-shadow: 0 0 20px rgba(131,210,230,0.6);
}

#main-content { display: none; }

/* ── LEADERBOARD ── */
.leaderboard-wrap {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.leaderboard-header {
  display: grid;
  grid-template-columns: 36px 1fr 100px;
  gap: 8px;
  padding: 6px 10px 8px;
  font-family: var(--font-hand);
  font-size: clamp(10px, 1vw, 12px);
  color: #aaa;
  letter-spacing: 0.3px;
  border-bottom: 1px solid #e0dbd0;
}
.leaderboard-row {
  display: grid;
  grid-template-columns: 36px 1fr 100px;
  gap: 8px;
  padding: 9px 10px;
  border-bottom: 1px solid rgba(0,0,0,0.05);
  font-size: clamp(12px, 1.2vw, 14px);
  color: #333;
  transition: background 0.1s;
  align-items: center;
}
.leaderboard-row:last-child { border-bottom: none; }
.leaderboard-row:hover { background: rgba(101,121,226,0.04); }
.leaderboard-row.is-me {
  background: rgba(101,121,226,0.08);
  border-left: 3px solid var(--purple);
  padding-left: 7px;
}
.lb-rank {
  font-family: var(--font-game, monospace);
  font-size: clamp(12px, 1.2vw, 15px);
  color: #aaa;
  text-align: center;
}
.lb-rank.top3 { color: var(--purple); font-weight: bold; }
.lb-username { font-family: var(--font-hand); font-weight: 600; word-break: break-all; }
.lb-username.is-me::after { content: ' (you)'; color: var(--purple); font-size: 11px; font-weight: normal; }
.lb-saves { text-align: right; font-family: var(--font-hand); color: #555; }
.lb-words { text-align: right; font-family: var(--font-hand); color: #aaa; font-size: clamp(11px, 1vw, 12px); }
.lb-divider {
  padding: 8px 10px;
  text-align: center;
  color: #ccc;
  font-size: 12px;
  letter-spacing: 1px;
}
.lb-empty {
  padding: 30px 20px;
  text-align: center;
  font-family: var(--font-hand);
  color: #bbb;
  font-style: italic;
  font-size: 14px;
  line-height: 1.7;
}
.lb-loading {
  padding: 24px; text-align: center;
  font-family: var(--font-hand); color: #aaa; font-size: 14px;
}
.lb-refresh {
  font-size: 11px; color: #aaa; cursor: pointer;
  margin-left: auto; padding: 0 4px;
}
.lb-refresh:hover { color: var(--purple); }

  </style>
</head>
<body>

<nav class="room-nav">
  <span class="nav-btn" onclick="window.location.href='../games/game-select.html'">back</span>
  <span class="nav-title">my profile</span>
  <span class="nav-btn" id="btn-signout">sign out</span>
</nav>

<div id="loading-state">loading your space ♡</div>

<div class="page-wrap">
<div class="page-body" id="main-content">

  <!-- Welcome heading -->
  <div class="welcome-heading">Welcome, <span id="display-username">loading...</span></div>

  <!-- Section grid -->
  <div class="section-grid">

    <!-- Account Settings -->
    <div class="window">
      <div class="window-titlebar">account settings</div>
      <div class="window-body">
        <div class="setting-row">
          <span class="setting-label">username</span>
          <span class="setting-value" id="settings-username">—</span>
        </div>
        <div class="setting-row">
          <span class="setting-label">email</span>
          <span class="setting-value" id="settings-email">—</span>
        </div>
        <div class="setting-row">
          <span class="setting-label">password</span>
          <span class="setting-value">••••••••</span>
        </div>
        <div class="setting-row">
          <span class="setting-label">membership</span>
          <span class="setting-value" id="settings-membership" style="color:var(--purple);">—</span>
        </div>
        <div class="btn-row">
          <button class="btn-action" onclick="editUsername()">edit username</button>
          <button class="btn-action" onclick="changePassword()">change password</button>
          <button class="btn-action" id="btn-upgrade-settings" onclick="goToUpgrade()" style="display:none;">upgrade membership</button>
        </div>
      </div>
    </div>

    <!-- Leaderboard (right column) -->
    <div class="window" id="leaderboard-window">
      <div class="window-titlebar">
        weekly leaderboard
        <span class="lb-refresh" onclick="loadLeaderboard()" title="refresh">↻</span>
      </div>
      <div class="window-body" style="padding:0;">
        <div id="leaderboard-content">
          <div class="lb-loading">loading this week's rankings...</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Mini Archive Panel -->
  <div class="window" id="mini-archive-window">
    <div class="window-titlebar">
      <span>map archive</span>
      <span id="mini-archive-subtitle" style="font-size:12px;color:#aaa;"></span>
    </div>
    <div class="window-body">

      <div class="mini-archive-header">
        <select class="mini-game-dropdown" id="mini-game-dropdown" onchange="onMiniGameChange()">
          <option value="">loading maps...</option>
        </select>
        <div class="mini-month-nav">
          <button class="mini-month-btn" onclick="miniChangeMonth(-1)">◄</button>
          <div class="mini-month-label" id="mini-month-label"></div>
          <button class="mini-month-btn" onclick="miniChangeMonth(1)">►</button>
        </div>
      </div>

      <div class="mini-cal-header">
        <div class="mini-cal-day-label">SUN</div>
        <div class="mini-cal-day-label">MON</div>
        <div class="mini-cal-day-label">TUE</div>
        <div class="mini-cal-day-label">WED</div>
        <div class="mini-cal-day-label">THU</div>
        <div class="mini-cal-day-label">FRI</div>
        <div class="mini-cal-day-label">SAT</div>
      </div>
      <div class="mini-cal-grid" id="mini-cal-grid"></div>

      <div class="mini-archive-footer">
        <span class="mini-entry-count" id="mini-entry-count"></span>
        <a class="saved-link" id="mini-archive-link" href="/users/archive.html">view full archive</a>
      </div>

    </div>
  </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL      = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── Auth check ───────────────────────────────────────────
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    await loadProfile(session.user);
  }

  async function loadProfile(user) {
    const { data: profile } = await sb
      .from('user-profiles')
      .select('*')
      .eq('id', user.id)
      .single();

    const username = profile?.username || 'explorer';

    document.getElementById('display-username').textContent  = username;
    document.getElementById('settings-username').textContent = username;
    document.getElementById('settings-email').textContent    = user.email;

    // ── MEMBERSHIP STATUS ─────────────────────────────────
    const membershipStatus = profile?.membership_status || 'free';
    applyMembershipUI(membershipStatus);

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').style.display  = 'flex';

    // Load mini archive panel
    loadMiniGames(user.id);
  }

  // ── Membership UI ─────────────────────────────────────────
  function applyMembershipUI(status) {
    const membershipEl  = document.getElementById('settings-membership');
    const upgradeBtn    = document.getElementById('btn-upgrade-settings');

    if (status === 'founding') {
      membershipEl.textContent = '✦ founding member';
      membershipEl.style.color = 'var(--purple-dark)';
      upgradeBtn.style.display = 'none';

    } else if (status === 'basic') {
      membershipEl.textContent = 'basic member';
      membershipEl.style.color = 'var(--purple)';
      upgradeBtn.textContent   = 'upgrade to founding member';
      upgradeBtn.style.display = 'inline-block';

    } else {
      // free
      membershipEl.textContent = 'free member';
      membershipEl.style.color = '#aaa';
      upgradeBtn.textContent   = 'upgrade membership';
      upgradeBtn.style.display = 'inline-block';
    }
  }

  // ── Upgrade redirect ──────────────────────────────────────
  window.goToUpgrade = function () {
    window.location.href = '/users/membership.html';
  };

  // ── Edit username ─────────────────────────────────────────
  window.editUsername = async function () {
    const newName = prompt('enter new username:');
    if (!newName || !newName.trim()) return;
    const { data: { session } } = await sb.auth.getSession();
    const { error } = await sb.from('user-profiles')
      .update({ username: newName.trim() })
      .eq('id', session.user.id);
    if (!error) {
      document.getElementById('display-username').textContent  = newName.trim();
      document.getElementById('settings-username').textContent = newName.trim();
    } else {
      alert('error: ' + error.message);
    }
  };

  // ── Change password ───────────────────────────────────────
  window.changePassword = async function () {
    const newPass = prompt('enter new password (min 6 characters):');
    if (!newPass || newPass.length < 6) return;
    const { error } = await sb.auth.updateUser({ password: newPass });
    if (error) alert('error: ' + error.message);
  };

  // ── Sign out ──────────────────────────────────────────────
  document.getElementById('btn-signout').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  // ── Leaderboard ───────────────────────────────────────────
  window.loadLeaderboard = async function () {
    const el = document.getElementById('leaderboard-content');
    el.innerHTML = '<div class="lb-loading">loading rankings...</div>';

    const { data, error } = await sb.rpc('get_weekly_leaderboard');

    if (error || !data?.length) {
      el.innerHTML = `<div class="lb-empty">
        no entries this week yet — make a save today to get on the board ♡<br>
        <span style="font-size:12px;color:#ccc;">rankings reset every 7 days</span>
      </div>`;
      return;
    }

    // Find current user's row (may not be in top results)
    const myRow   = data.find(r => r.is_me);
    const topRows = data.slice(0, 20);
    const myInTop = topRows.some(r => r.is_me);

    let html = `<div class="leaderboard-header">
      <span>#</span>
      <span>player</span>
      <span style="text-align:right">saves</span>
    </div>`;

    topRows.forEach(r => {
      const rankLabel = r.rank <= 3
        ? ['🥇','🥈','🥉'][r.rank - 1]
        : r.rank;
      html += `<div class="leaderboard-row${r.is_me ? ' is-me' : ''}">
        <span class="lb-rank${r.rank <= 3 ? ' top3' : ''}">${rankLabel}</span>
        <span class="lb-username${r.is_me ? ' is-me' : ''}">${r.username}</span>
        <span class="lb-saves">${r.weekly_saves} day${r.weekly_saves !== 1 ? 's' : ''}</span>
      </div>`;
    });

    // If user exists but isn't in top 20, show them below a divider
    if (!myInTop && myRow) {
      html += `<div class="lb-divider">· · ·</div>`;
      html += `<div class="leaderboard-row is-me">
        <span class="lb-rank">${myRow.rank}</span>
        <span class="lb-username is-me">${myRow.username}</span>
        <span class="lb-saves">${myRow.weekly_saves} day${myRow.weekly_saves !== 1 ? 's' : ''}</span>
      </div>`;
    }

    el.innerHTML = html;
  };

  // ── Mini Archive ──────────────────────────────────────────
  const MINI_PHASE_COLORS = {
    zone_1: '#d4d9ff', zone_2: '#a8b4f0',
    zone_3: '#6579e2', zone_4: '#4a5bc4', zone_5: '#2a3b9a',
  };

  let miniAllGames    = [];
  let miniActiveId    = null;
  let miniAllEntries  = [];
  let miniEntryMap    = {};
  let miniViewYear    = new Date().getFullYear();
  let miniViewMonth   = new Date().getMonth();

  function miniLocalToday() { return new Date().toLocaleDateString('en-CA'); }

  async function loadMiniGames(userId) {
    const { data } = await sb.from('games')
      .select('id, map_name, map_type, status')
      .eq('user_id', userId)
      .order('updated_at', { ascending: false });
    miniAllGames = data || [];

    const dd = document.getElementById('mini-game-dropdown');
    dd.innerHTML = '';
    if (!miniAllGames.length) {
      dd.innerHTML = '<option value="">no maps yet</option>';
      document.getElementById('mini-archive-window').style.display = 'none';
      return;
    }
    miniAllGames.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g.id;
      opt.textContent = (g.map_name || 'untitled') + ' (' + (g.map_type || 'spiral') + ')';
      dd.appendChild(opt);
    });
    miniActiveId = miniAllGames[0]?.id || null;
    if (miniActiveId) dd.value = miniActiveId;
    await loadMiniEntries(userId);
  }

  window.onMiniGameChange = async function () {
    miniActiveId = document.getElementById('mini-game-dropdown').value;
    const { data: { session } } = await sb.auth.getSession();
    await loadMiniEntries(session.user.id);
  };

  async function loadMiniEntries(userId) {
    if (!miniActiveId) return;
    const { data } = await sb.from('daily_entries')
      .select('entry_date, map_phase')
      .eq('game_id', miniActiveId)
      .eq('user_id', userId)
      .order('entry_date', { ascending: true });
    miniAllEntries = data || [];
    miniEntryMap   = {};
    miniAllEntries.forEach(e => { miniEntryMap[e.entry_date] = e; });

    const game = miniAllGames.find(g => g.id === miniActiveId);
    document.getElementById('mini-archive-subtitle').textContent = game?.map_name || '';
    document.getElementById('mini-entry-count').textContent =
      miniAllEntries.length + ' entr' + (miniAllEntries.length === 1 ? 'y' : 'ies') + ' total';
    document.getElementById('mini-archive-link').href =
      '/users/archive.html?game_id=' + miniActiveId;

    renderMiniCalendar();
  }

  function renderMiniCalendar() {
    const months = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    document.getElementById('mini-month-label').textContent =
      months[miniViewMonth] + ' ' + miniViewYear;

    const firstDay    = new Date(miniViewYear, miniViewMonth, 1).getDay();
    const daysInMonth = new Date(miniViewYear, miniViewMonth + 1, 0).getDate();
    const today       = miniLocalToday();
    const grid        = document.getElementById('mini-cal-grid');
    grid.innerHTML    = '';

    for (let i = 0; i < firstDay; i++) {
      const cell = document.createElement('div');
      cell.className = 'mini-cal-cell filler';
      grid.appendChild(cell);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = miniViewYear + '-'
        + String(miniViewMonth + 1).padStart(2, '0') + '-'
        + String(d).padStart(2, '0');
      const entry = miniEntryMap[dateStr];
      const cell  = document.createElement('div');
      cell.className = 'mini-cal-cell'
        + (entry    ? ' has-entry' : '')
        + (dateStr === today ? ' is-today'  : '');

      const dateEl = document.createElement('div');
      dateEl.className = 'mini-cal-date';
      dateEl.textContent = d;
      cell.appendChild(dateEl);

      if (entry) {
        const dot = document.createElement('div');
        dot.className = 'mini-cal-dot';
        dot.style.background = MINI_PHASE_COLORS[entry.map_phase] || '#6579e2';
        cell.appendChild(dot);
        cell.onclick = () => {
          window.location.href = '/users/archive.html?game_id=' + miniActiveId;
        };
      }

      grid.appendChild(cell);
    }
  }

  window.miniChangeMonth = function (dir) {
    miniViewMonth += dir;
    if (miniViewMonth > 11) { miniViewMonth = 0; miniViewYear++; }
    if (miniViewMonth < 0)  { miniViewMonth = 11; miniViewYear--; }
    renderMiniCalendar();
  };

  init();
  // Load leaderboard after a short delay so profile loads first
  setTimeout(window.loadLeaderboard, 600);
})();
</script>

</body>
</html>
