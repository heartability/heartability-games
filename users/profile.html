<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="../assets/elements/favicon.png">
  <link rel="stylesheet" href="../assets/css/modal.css">
  <script src="../assets/js/modal.js" defer></script>
  <link rel="stylesheet" href="../assets/css/room-slider.css">
  <script src="../assets/js/room-slider.js" defer></script>
  <title>My Room — Heartability</title>
  <meta name="description" content="Your Heartability bedroom — visit your dream archive, and manage your account settings.">
  <meta name="robots" content="noindex,follow">
  <meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview.png">
  <style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:     "ZoesHandwriting", cursive;
  --font-pixel:    "PFPixelscript", cursive;
  --purple:        #6579e2;
  --purple-dark:   #4a5bc4;
  --purple-shadow: #3a4aaa;
  --blue-glow:     #83d2e6;
  --mint:          #c9fff5;
  --cream:         #f5f0ea;
  --cream-dark:    #e8e3da;
  --line-col:      #111;
  --side-col:      #e8e4dc;
}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: var(--side-col);
  font-family: var(--font-hand);
  user-select: none;
}

/* ── ROOM BACKGROUND ── */
.room-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
.room-bg svg { width: 100%; height: 100%; display: block; }
.room-back-wall {
  position: absolute;
  top: 9%; left: 15%;
  width: 70%; height: 70%;
  background: #f0ece4;
  border: 2px solid var(--line-col);
  z-index: 1;
  pointer-events: none;
}

/* ── TOP NAV ── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #6578e2;
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(21px, 1.6vw, 25px);
  color: #fff;
}
.nav-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  pointer-events: none; white-space: nowrap;
  font-family: var(--font-hand); font-size: clamp(22px, 1.6vw, 28px);
  margin: 0; font-weight: normal;
}
.nav-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  color: inherit;
  text-decoration: none;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(0,0,0,0.08); }

/* ── Gear dropdown ── */
.gear-wrap { position: relative; }
.gear-btn {
  width: 30px; height: 30px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 3px; transition: background 0.15s; padding: 3px;
}
.gear-btn:hover { background: rgba(0,0,0,0.08); }
.gear-btn img { width: 22px; height: 22px; display: block; }
.gear-dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; min-width: 170px;
  background: #6578e2; border: 2px solid var(--line-col);
  box-shadow: 3px 4px 0 rgba(0,0,0,0.12);
  z-index: 201; display: none; flex-direction: column; overflow: hidden;
}
.gear-dropdown.open { display: flex; }
.gear-item {
  font-family: var(--font-hand); font-size: clamp(15px, 1.3vw, 18px); color: #fff;
  padding: 9px 14px; cursor: pointer; border: none; background: none;
  text-align: left; white-space: nowrap; transition: background 0.12s;
}
.gear-item:hover { background: rgba(0,0,0,0.07); }

/* ── ROOM ICONS — full room-stage ── */
.room-icons {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: none;
}
.room-icons.active { display: block; }

.room-icon {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  padding: 10px;
  border-radius: 4px;
  transition: transform 0.15s;
  transform-origin: bottom center;
}
.room-icon:hover { transform: translateY(-5px); }
.room-icon:active { transform: translateY(-2px); }

/* ── PER-ICON POSITION & SIZE — adjust these ── */

/* DRESSER — lower-left, sits on floor */
#icon-dresser {
  bottom: 17cqh;
  left: 18cqw;
}
#icon-dresser img { width: clamp(200px, 28cqw, 480px); }

/* BED — lower-center/right, sits on floor */
#icon-bed {
  bottom: 13cqh;
  right: 18cqw;
}
#icon-bed img { width: clamp(200px, 33cqw, 550px); }

/* EXCLAIM — enter the matrix, upper-right wall */
#icon-exclaim {
  bottom:  43cqh;
  right: 2cqw;
}
#icon-exclaim img { width: clamp(60px, 9cqw, 130px); }

/* Portrait/vertical viewports are handled by the room slider
   (assets/css/room-slider.css) instead of squeezing this layout. */

.room-icon img {
  height: auto;
  filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.18));
  transition: filter 0.15s;
}
.room-icon:hover img { filter: drop-shadow(2px 6px 14px rgba(101,121,226,0.4)); }

.room-icon-label {
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.1vw, 15px);
  color: #555;
  text-align: center;
  line-height: 1.3;
  white-space: nowrap;
}

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position: absolute;
  left: calc(100% - 8px);
  bottom: 62%;
  min-width: clamp(140px, 16cqw, 220px);
  max-width: clamp(160px, 20cqw, 260px);
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 12px 18px;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.2cqw, 16px);
  color: #000;
  text-align: center;
  line-height: 1.5;
  filter: drop-shadow(1px 3px 5px rgba(0,0,0,0.18));
  z-index: 21;
  opacity: 0;
  transform: scale(0.92) translateY(4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}
.thought-bubble.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

/* ── HEART CHARACTER ── */
@keyframes idle-pulse {
  0%,100% { transform: translateY(0) rotate(-2deg) scale(1); }
  50%      { transform: translateY(-8px) rotate(2deg) scale(1.03); }
}
.char-heart {
  position: absolute;
  left: 10cqw;
  bottom: 10cqh;
  width: clamp(120px, 16cqw, 230px);
  z-index: 20;
  pointer-events: none;
  transition: left 0.7s cubic-bezier(0.4,0,0.2,1), bottom 0.7s cubic-bezier(0.4,0,0.2,1);
}

/* The fixed-width portrait stage is much more square than the fluid desktop
   canvas these cqw/cqh values were tuned for, so the heart guide (anchored
   near the dresser icon's much larger artwork) needs to run smaller here to
   avoid overlapping it. */
@media (orientation: portrait) {
  .char-heart { width: clamp(70px, 10cqw, 180px); }
}

.char-heart img {
  display: block;
  width: 100%; height: auto;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25));
  animation: idle-pulse 3.6s ease-in-out 1s infinite;
}

/* ── MATRIX PICKER POPUP ── */
.matrix-picker-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
.matrix-picker-overlay.open { display: flex; animation: fadeIn 0.2s ease both; }
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.matrix-picker-popup { background: var(--cream); box-shadow: 0 0 0 3px var(--purple), 0 0 0 6px var(--blue-glow), 6px 10px 40px rgba(0,0,0,0.35); width: min(92vw, 400px); overflow: hidden; animation: windowIn 0.25s ease both; }
@keyframes windowIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.matrix-picker-titlebar { height: 38px; background: var(--cream-dark); border-bottom: 2px solid #bbb; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-family: var(--font-hand); font-size: clamp(21px, 1.4vw, 24px); color: #555; }
.popup-close { cursor: pointer; font-size: 23px; color: #bbb; line-height: 1; padding: 2px 4px; transition: color 0.15s; }
.popup-close:hover { color: #444; }
.matrix-picker-body { display: flex; flex-direction: column; gap: 10px; padding: 20px 18px; }
.matrix-pick-btn { display: block; text-decoration: none; font-family: var(--font-hand); font-size: clamp(18px,2vw,23px); color: #fff; background: var(--purple); border: 2px solid var(--purple-dark); box-shadow: 3px 3px 0 var(--purple-shadow); padding: 12px 20px; cursor: pointer; text-align: center; transition: background .1s; }
.matrix-pick-btn:hover { background: var(--purple-dark); }
.matrix-pick-btn:active { box-shadow: none; transform: translate(3px,3px); }
.matrix-pick-btn small { display: block; font-size: clamp(16px,1.2vw,17px); opacity: .75; margin-top: 2px; }

/* ── LOADING ── */
#loading-state {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-pixel);
  font-size: clamp(21px, 2vw, 28px);
  color: var(--blue-glow);
  text-shadow: 0 0 20px rgba(131,210,230,0.6);
  z-index: 50;
}

/* ── LEGAL FOOTER ── */
.legal-footer {
  position: fixed;
  bottom: 12px;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1vw, 14px);
  color: #aaa;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.legal-footer a { color: #111; text-decoration: none; transition: color 0.15s; }
.legal-footer a:hover { color: var(--purple); }
.legal-footer span { color: #ccc; }

  </style>
</head>
<body>

<!-- NAV -->
<nav class="room-nav">
  <div class="gear-wrap" id="gear-wrap">
    <div class="gear-btn" id="gear-btn" onclick="toggleGear()">
      <img src="../assets/elements/gear icon.png" alt="menu">
    </div>
    <div class="gear-dropdown" id="gear-dropdown">
      <button class="gear-item" onclick="toggleGear(); window.location.href='account-settings.html'">account settings</button>
      <button class="gear-item" id="btn-signout">sign out</button>
    </div>
  </div>
  <h1 class="nav-title">welcome, <span id="display-username"></span></h1>
  <div style="display:flex;align-items:center;gap:4px;">
    <a class="nav-btn" href="../games/game-room.html">game room →</a>
  </div>
</nav>

<!-- LOADING -->
<div id="loading-state">loading your room</div>

<div class="room-scroll"><div class="scene room-stage">

  <!-- ROOM BACKGROUND -->
  <div class="room-bg" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0"   y1="0"   x2="50" y2="30" stroke="#111" stroke-width=".18"/>
      <line x1="100" y1="0"   x2="50" y2="30" stroke="#111" stroke-width=".18"/>
      <line x1="0"   y1="100" x2="50" y2="30" stroke="#111" stroke-width=".18"/>
      <line x1="100" y1="100" x2="50" y2="30" stroke="#111" stroke-width=".18"/>
    </svg>
  </div>
  <div class="room-back-wall" aria-hidden="true"></div>

  <!-- ROOM ICONS -->
  <div class="room-icons" id="main-content">
    <div class="room-icon" id="icon-dresser" onclick="window.location.href='account-settings.html'">
      <img src="../assets/elements/dresser.png" alt="account settings" />
    </div>
    <div class="room-icon" id="icon-bed" onclick="window.location.href='../matrix/archive.html'">
      <img src="../assets/elements/bed.png" alt="adventure archive" />
    </div>
    <div class="room-icon" id="icon-exclaim" onclick="openMatrixPicker()">
      <img src="../assets/elements/exclaim.png" alt="enter the matrix" />
    </div>
  </div>

  <!-- HEART CHARACTER -->
  <div class="char-heart" id="char-heart">
    <div class="thought-bubble" id="thought-bubble">hello!</div>
    <img src="../assets/elements/guides/heart.png" alt="" />
  </div>

</div></div>

<!-- MATRIX PICKER POPUP -->
<div class="matrix-picker-overlay" id="matrix-picker-overlay" onclick="if(event.target===this)closeMatrixPicker()">
  <div class="matrix-picker-popup">
    <div class="matrix-picker-titlebar">
      <span>choose a matrix</span>
      <span class="popup-close" onclick="closeMatrixPicker()">&#x2715;</span>
    </div>
    <div class="matrix-picker-body">
      <a class="matrix-pick-btn" href="../matrix/daily-matrix.html">
        daily matrix
        <small>track your archetype and adventure of the day</small>
      </a>
      <a class="matrix-pick-btn" href="../matrix/dream-matrix.html">
        dream matrix
        <small>track the experience of pursuing your dreams</small>
      </a>
      <a class="matrix-pick-btn" href="../matrix/cosmic-matrix.html">
        cosmic matrix
        <small>track the cosmic influences guiding your life</small>
      </a>
    </div>
  </div>
</div>

<!-- LEGAL FOOTER -->
<footer class="legal-footer">
  <a href="../legal/privacy-policy.html">privacy policy</a>
  <span>·</span>
  <a href="../legal/refund-policy.html">refund policy</a>
  <span>·</span>
  <a href="../legal/support.html">support</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL      = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── Gear menu ─────────────────────────────────────────────
  window.toggleGear = function () {
    document.getElementById('gear-dropdown').classList.toggle('open');
  };
  document.addEventListener('click', e => {
    const wrap = document.getElementById('gear-wrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('gear-dropdown').classList.remove('open');
    }
  });

  // ── Matrix picker popup ─────────────────────────────────────
  window.openMatrixPicker = function () {
    document.getElementById('matrix-picker-overlay').classList.add('open');
  };
  window.closeMatrixPicker = function () {
    document.getElementById('matrix-picker-overlay').classList.remove('open');
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeMatrixPicker();
  });

  // ── Auth check ───────────────────────────────────────────
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    await loadProfile(session.user);
  }

  async function loadProfile(user) {
    const { data: profile } = await sb
      .from('user-profiles')
      .select('*')
      .eq('id', user.id)
      .single();

    const username = profile?.username || 'explorer';
    document.getElementById('display-username').textContent = username;

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').classList.add('active');
  }

  // ── Sign out ──────────────────────────────────────────────
  document.getElementById('btn-signout').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  // ── Thought bubble ────────────────────────────────────────
  const bubble = document.getElementById('thought-bubble');
  const bubbleMessages = {
    'icon-dresser': 'access your account settings',
    'icon-bed':     'view the dream archive',
    'icon-exclaim': 'enter the matrix',
  };

  document.querySelectorAll('.room-icon').forEach(icon => {
    icon.addEventListener('mouseenter', () => {
      bubble.textContent = bubbleMessages[icon.id] || '';
      bubble.classList.add('visible');
    });
    icon.addEventListener('mouseleave', () => {
      bubble.classList.remove('visible');
    });
  });

  init();
})();
</script>

</body>
</html>
