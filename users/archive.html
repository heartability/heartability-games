<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Archive — Heartability</title>
<style>
@font-face { font-family:"ZoesHandwriting"; src:url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype"); }
@font-face { font-family:"PFPixelscript";  src:url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype"); }
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --font-game:  "VT323", monospace;
  --purple:     #6579e2;
  --purple-dk:  #4a5bc4;
  --purple-sh:  #3a4aaa;
  --aqua:       #83d2e6;
  --mint:       #c9fff5;
  --cream:      #f5f0ea;
  --cream-dk:   #e8e3da;
  --panel-bg:   #f0ead6;
}

html, body { min-height:100dvh; background:#e8e3da; font-family:var(--font-hand); user-select:none; }

/* ── NAV ── */
.room-nav {
  position:fixed; top:0; left:0; right:0; height:44px;
  background:var(--mint); border-bottom:2px solid #111;
  z-index:200; display:flex; align-items:center; justify-content:space-between;
  padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(14px,1.6vw,20px); color:#111;
}
.nav-btn { cursor:pointer; padding:4px 8px; transition:background .15s; }
.nav-btn:hover { background:rgba(0,0,0,.08); }

/* Game selector dropdown */
/* ── PAGE HEADER — title + game selector ── */
.page-header {
  position:relative;
  width:100%;
}
.page-game-title {
  font-family:var(--font-pixel);
  font-size:clamp(20px, 2.8vw, 36px);
  color:#222; font-weight:normal; line-height:1.1;
  padding-right:240px; /* leave room for dropdown */
}
.game-select-wrap {
  position:absolute; top:0; right:0;
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-hand); font-size:14px;
}
.game-dropdown {
  font-family:var(--font-hand); font-size:18px;
  border:1.5px solid var(--purple); background:var(--cream);
  color:#333; padding:5px 10px; cursor:pointer;
  max-width:260px; outline:none;
}
.game-dropdown:focus { border-color:var(--aqua); }
.page-wrap {
  min-height:100dvh; padding:80px 20px 48px;
  display:flex; flex-direction:column; align-items:center;
}
.page-body {
  width:100%; max-width:1200px;
  display:flex; flex-direction:column; gap:24px;
  padding:0 4px; /* breathing room for box-shadows */
}

/* Top row: graph + map side by side, tops aligned */
.top-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:start;
  gap:20px;
}
.top-row > * { min-width:0; min-height:0; }

@media (max-width:700px) {
  .page-body { padding:0 8px; }
  .top-row { grid-template-columns:1fr; }
  .graph-area { padding:12px 8px 12px; }
  .graph-y { width:56px; padding-right:6px; }
  .graph-right-pad { width:56px; }
}

/* Map window SVG */
.map-window-body { padding:16px; display:flex; flex-direction:column; gap:8px; }
.map-svg-wrap {
  flex:1; background:#e8e0c8;
  border:1.5px solid #b8a88a;
  overflow:hidden; min-height:200px;
}
.map-svg-wrap svg { width:100%; height:100%; display:block; }

/* ── WINDOW ── */
.window {
  background:var(--cream);
  box-shadow:0 0 0 3px var(--purple), 0 0 0 6px var(--aqua), 4px 8px 28px rgba(0,0,0,.28);
  overflow:hidden;
  animation:windowIn .35s ease both;
}
@keyframes windowIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

.window-titlebar {
  height:38px; background:var(--cream-dk); border-bottom:2px solid #bbb;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; font-family:var(--font-hand); font-size:clamp(13px,1.4vw,16px); color:#555;
}
.window-body { padding:20px 20px 24px; }

/* ── MONTH NAV ── */
.month-nav {
  display:flex; align-items:center; justify-content:center; gap:24px; margin-bottom:16px;
}
.month-btn {
  font-family:var(--font-game); font-size:20px;
  background:none; border:1.5px solid var(--purple); color:var(--purple);
  width:34px; height:34px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s;
}
.month-btn:hover { background:var(--purple); color:#fff; }
.month-label {
  font-family:var(--font-hand); font-size:clamp(18px,2.2vw,26px); color:#333;
  min-width:200px; text-align:center;
}

/* ── CALENDAR ── */
.cal-header {
  display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px;
}
.cal-day-label {
  text-align:center; font-family:var(--font-game); font-size:13px; color:#aaa; padding:4px 0;
}
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }

.cal-cell {
  aspect-ratio:1; border:1.5px solid rgba(101,121,226,.15);
  background:rgba(255,255,255,.4); position:relative;
  cursor:default; transition:border-color .15s, transform .1s;
  overflow:hidden;
}
.cal-cell.filler { background:transparent; border-color:transparent; }
.cal-cell.has-entry {
  border-color:var(--purple); cursor:pointer;
  background:rgba(101,121,226,.05);
}
.cal-cell.has-entry:hover { border-color:var(--aqua); transform:scale(1.05); z-index:2; box-shadow:0 0 0 2px var(--aqua); }
.cal-cell.is-today { border-color:var(--aqua); box-shadow:0 0 0 1px var(--aqua); }

.cal-date {
  position:absolute; top:3px; left:4px;
  font-family:var(--font-game); font-size:10px; color:#aaa; line-height:1; z-index:2;
}
.cal-cell.has-entry .cal-date { color:var(--purple); }
.cal-cell.is-today .cal-date  { color:var(--aqua); }

/* Zone visual inside calendar cell */
.cal-zone-circle {
  position:absolute;
  width:78%; aspect-ratio:1;
  border-radius:50%;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  overflow:hidden;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:2px;
  z-index:1;
}
.cal-terrain-img {
  position:absolute;
  width:72%; height:72%;
  top:50%; left:50%; transform:translate(-50%,-52%);
  object-fit:contain; opacity:0.85;
}
.cal-feeling-label {
  position:absolute; bottom:10%; z-index:2;
  width:100%; text-align:center;
  font-family:var(--font-hand);
  font-size:clamp(7px, 1.1vw, 12px);
  color:#2a1e14; line-height:1.2;
  text-shadow:0 0 6px rgba(255,255,255,0.9);
}

/* Phase tint strip at top */
.cal-phase-strip {
  position:absolute; top:0; left:0; right:0; height:3px;
}

/* Tiny character inside calendar cell */
.cal-char {
  position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
  width:22px; height:28px; z-index:3;
  opacity:0.6;
}
.cal-char-layer {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.cal-char-layer img { width:100%; height:100%; object-fit:contain; }

/* ── EMPTY STATE ── */
.empty-month {
  text-align:center; padding:40px 20px;
  font-family:var(--font-hand); font-style:italic; color:#bbb; font-size:15px; line-height:1.8;
}

/* ── BAR GRAPH ── */
.graph-area {
  padding:0 20px 20px;
  overflow-x:auto;
}
.graph-wrap {
  display:flex; gap:0; align-items:stretch;
}
/* Y axis */
.graph-y {
  display:flex; flex-direction:column; justify-content:space-between;
  padding-bottom:36px;
  flex-shrink:0; width:80px; padding-right:10px; padding-top:4px;
}
.y-label {
  font-family:var(--font-game); font-size:11px; color:#aaa;
  text-align:right; line-height:1; position:relative;
}
.y-label.reading-zone {
  font-size:10px; color:rgba(101,121,226,.6); font-style:italic;
}
/* Bars area */
.graph-bars-scroll { flex:1; position:relative; display:flex; flex-direction:column; }
.graph-bars-inner {
  display:flex; align-items:flex-end; gap:6px;
  flex:1; min-height:180px; padding:4px 0 0 0;
  position:relative; width:100%;
  border-left:1.5px solid rgba(101,121,226,.25);
  border-bottom:1.5px solid rgba(101,121,226,.25);
}
/* Right spacer to mirror y-axis width for visual symmetry */
.graph-right-pad {
  flex-shrink:0; width:80px;
}
/* Difficulty band fills — solid background strips */
.diff-band {
  position:absolute; left:0; right:0; pointer-events:none;
}
.diff-band-label {
  position:absolute; right:4px; font-family:var(--font-game); font-size:9px;
  color:rgba(101,121,226,.55); line-height:1; bottom:3px;
}

/* X-axis label row — sits BELOW the graph border */
.graph-x-labels {
  display:flex; gap:6px; padding-left:0; padding-top:4px;
}
.bar-x-label {
  font-family:var(--font-game); font-size:9px; color:#ccc;
  text-align:center; line-height:1.4; flex:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.bar-x-label--active { color:var(--purple); }

.bar-col {
  flex:1;
  height:100%;
  display:flex; align-items:flex-end;
}
.bar-fill {
  width:100%; border-radius:2px 2px 0 0;
  min-height:2px; transition:height .3s ease;
  position:relative; cursor:pointer;
}
.bar-fill:hover { filter:brightness(1.12); }
.bar-score {
  font-family:var(--font-game); font-size:10px; color:rgba(255,255,255,.85);
  position:absolute; top:-14px; left:50%; transform:translateX(-50%);
  white-space:nowrap;
}

/* Week navigation row inside graph area */
.graph-week-nav {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:8px; flex-shrink:0;
}

/* Week navigation buttons in graph titlebar */
.week-nav-btn {
  background:none; border:1.5px solid rgba(101,121,226,.35);
  color:var(--purple); font-family:var(--font-game); font-size:14px;
  width:26px; height:26px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s; padding:0;
}
.week-nav-btn:hover:not(:disabled) { background:var(--purple); color:#fff; }
.week-nav-btn:disabled { opacity:0.25; cursor:default; }

/* Taller calendar titlebar for month label */
#cal-window .window-titlebar {
  height:64px;
}

/* Phase legend — gradient bar */
.phase-legend {
  padding:10px 20px 14px;
  border-top:1px solid rgba(101,121,226,.1);
}
.legend-gradient-bar {
  height:8px; border-radius:2px;
  background:linear-gradient(to right,#d4d9ff,#a8b4f0,#6579e2,#4a5bc4,#2a3b9a);
  margin-bottom:4px;
}
.legend-gradient-labels {
  display:flex; justify-content:space-between;
  font-family:var(--font-game); font-size:9px; color:#aaa;
}

/* Graph column — dropdown above, window stays compact */
.graph-col {
  display:flex; flex-direction:column; gap:8px; min-width:0;
}
#graph-window {
  display:flex; flex-direction:column; flex:1; min-width:0;
}
.graph-area {
  flex:1; padding:16px 20px 20px; overflow-x:auto;
  display:flex; flex-direction:column;
}
.graph-wrap {
  flex:1; display:flex; gap:0; align-items:stretch;
}

/* ── DETAIL POPUP ── */
.detail-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.55);
  z-index:500; display:none; align-items:center; justify-content:center; padding:20px;
}
.detail-overlay.open { display:flex; }
.detail-window {
  background:var(--cream); border-radius:4px;
  box-shadow:0 0 0 3px var(--purple), 0 0 0 6px var(--aqua), 8px 12px 40px rgba(0,0,0,.4);
  width:clamp(300px,92vw,560px); max-height:90dvh; overflow-y:auto;
  animation:windowIn .2s ease both;
}
.detail-titlebar {
  height:38px; background:var(--cream-dk); border-bottom:2px solid #bbb;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; font-family:var(--font-hand); font-size:14px; color:#555;
  position:sticky; top:0; z-index:2;
}
.detail-close { cursor:pointer; font-size:18px; color:#aaa; padding:4px; }
.detail-close:hover { color:var(--purple); }
.detail-body { padding:20px 24px; display:flex; flex-direction:column; align-items:center; gap:14px; }

/* Character mirror — tall enough for feet/rollerblades */
.detail-mirror {
  width:220px; height:310px; position:relative;
  border:2px solid var(--purple); background:#fff;
  border-radius:50% / 42%; overflow:hidden;
  box-shadow:0 0 0 3px var(--aqua);
}
.detail-layer {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
}
.detail-layer img { width:100%; height:100%; object-fit:contain; }

.detail-char-name { font-family:var(--font-pixel); font-size:22px; color:#333; }
.detail-date      { font-family:var(--font-hand); font-size:13px; color:#aaa; }

.detail-meta {
  width:100%; display:flex; flex-direction:column; gap:8px;
}
.detail-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 12px; background:rgba(101,121,226,.06);
  border:1px solid rgba(101,121,226,.12);
}
.detail-row-label { font-family:var(--font-game); font-size:13px; color:#aaa; }
.detail-row-value { font-family:var(--font-hand); font-size:15px; color:#333; }

.detail-phase-badge {
  display:inline-block; padding:3px 10px;
  font-family:var(--font-game); font-size:13px; letter-spacing:.5px;
  border-radius:2px;
}

.detail-energy-bar-wrap {
  width:100%; height:12px; background:rgba(101,121,226,.15);
  border:1px solid rgba(101,121,226,.2); overflow:hidden;
}
.detail-energy-bar { height:100%; transition:width .4s ease; }

/* ── JOURNAL VIEW (inside detail window) ── */
#journal-view { display:none; flex-direction:column; }
.journal-back-btn {
  cursor:pointer; font-family:var(--font-hand); font-size:14px; color:#888;
  padding:2px 4px; transition:color .15s;
}
.journal-back-btn:hover { color:var(--purple); }
.journal-body {
  padding:24px 28px; flex:1; overflow-y:auto;
}
.journal-text {
  font-family:var(--font-hand); font-size:clamp(14px,1.5vw,17px);
  color:#333; line-height:1.8; white-space:pre-wrap; user-select:text;
}
.journal-empty {
  font-family:var(--font-hand); font-size:15px; color:#bbb;
  font-style:italic; text-align:center; padding:32px 0;
}

/* ── MAP WINDOW — fills its row height ── */
#map-window { display:flex; flex-direction:column; }
.map-window-body { flex:1; display:flex; flex-direction:column; }
.map-svg-wrap { flex:1; min-height:280px; }

/* ── MAP SELECTOR SCREEN ── */
#map-selector {
  display:none; position:fixed; inset:0;
  padding-top:44px; background:#e8e3da; z-index:50; overflow-y:auto;
  align-items:center; justify-content:center;
}
.map-sel-inner {
  max-width:900px; margin:0 auto;
  padding:28px clamp(16px,3vw,48px) 48px;
}
.map-sel-window {
  background:var(--cream);
  box-shadow:0 0 0 3px var(--purple), 0 0 0 6px var(--aqua), 4px 8px 28px rgba(0,0,0,.28);
  overflow:hidden;
  animation:windowIn .35s ease both;
}
.map-sel-titlebar {
  height:38px; background:var(--cream-dk); border-bottom:2px solid #bbb;
  display:flex; align-items:center; padding:0 16px;
  font-family:var(--font-hand); font-size:clamp(13px,1.4vw,16px); color:#555;
}
.map-grid {
  display:grid;
  grid-template-columns:repeat(4, minmax(140px,1fr));
  gap:16px;
  padding:20px;
}
@media (max-width:700px) { .map-grid { grid-template-columns:repeat(2,1fr); } }

.map-slot {
  border:2px solid #ccc; background:#fdf6e3;
  cursor:pointer; display:flex; flex-direction:column;
  align-items:stretch; padding:8px 8px 6px; gap:5px;
  font-family:var(--font-hand); text-align:center;
  transition:border-color .15s, box-shadow .12s, transform .1s;
  position:relative; aspect-ratio:4/5;
}
.map-slot:hover { border-color:var(--purple); box-shadow:2px 2px 0 var(--purple); transform:translateY(-2px); }
.map-slot.empty { border-style:dashed; border-color:#e0e0e0; cursor:default; background:transparent; }
.map-slot.empty:hover { transform:none; box-shadow:none; border-color:#e0e0e0; }
.slot-name { font-size:13px; color:#333; line-height:1.2; word-break:break-word; font-weight:600; flex-shrink:0; }
.slot-updated { font-size:10px; color:#bbb; flex-shrink:0; }
.slot-preview { flex:1; min-height:0; overflow:hidden; background:#e8e0c8; border:1px solid #c8b88a; }
.slot-preview svg { width:100%; height:100%; display:block; }
.slot-delete {
  position:absolute; top:5px; right:6px;
  font-size:14px; color:#ccc; background:none; border:none;
  cursor:pointer; line-height:1; padding:2px 4px;
  transition:color .12s; z-index:2;
}
.slot-delete:hover { color:#E8478B; }

/* ── LOADING ── */
#loading-state {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-pixel); font-size:24px;
  color:var(--aqua); text-shadow:0 0 20px rgba(131,210,230,.6);
  background:#e8e3da; z-index:999;
}
#main-content { display:none; }
</style>
</head>
<body>

<nav class="room-nav">
  <span class="nav-btn" onclick="handleBack()">← back</span>
  <span style="font-family:var(--font-hand);font-size:clamp(18px,2.2vw,28px);">adventure archive</span>
  <span class="nav-btn" onclick="window.location.href='chart-room.html'">chart room →</span>
</nav>

<div id="loading-state" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-pixel);font-size:24px;color:var(--aqua);background:#e8e3da;z-index:999;">loading your archive...</div>

<!-- MAP SELECTOR -->
<div id="map-selector">
  <div class="map-sel-inner">
    <div class="map-sel-window">
      <div class="map-sel-titlebar">your maps</div>
      <div class="map-grid" id="map-grid"></div>
    </div>
  </div>
</div>

<div class="page-wrap">
  <div class="page-body" id="main-content">

    <!-- TOP ROW: bar chart + map -->
    <div class="top-row">

      <!-- GRAPH COLUMN -->
      <div class="graph-col">
        <select id="game-dropdown" onchange="onGameChange()" style="display:none;"></select>
        <div class="window" id="graph-window">
        <div class="window-titlebar">
          <span>energy over time</span>
          <span style="font-size:12px;color:#aaa;">hearts / session</span>
        </div>
        <div class="graph-area">
          <!-- Week navigation row -->
          <div class="graph-week-nav">
            <button class="week-nav-btn" id="graph-prev-week" onclick="changeWeekPage(1)" title="previous week">◄</button>
            <span id="week-label" style="font-family:var(--font-game);font-size:11px;color:#aaa;"></span>
            <button class="week-nav-btn" id="graph-next-week" onclick="changeWeekPage(-1)" title="next week">►</button>
          </div>
          <div class="graph-wrap">
            <div class="graph-y" id="graph-y"></div>
            <div class="graph-bars-scroll">
              <div class="graph-bars-inner" id="graph-bars"></div>
              <div class="graph-x-labels" id="graph-x-labels"></div>
            </div>
            <div class="graph-right-pad"></div>
          </div>
        </div>
        <div class="phase-legend" id="phase-legend"></div>
        <div class="empty-month" id="graph-empty" style="display:none;">
          no energy data yet — complete the daily loop to build your graph
        </div>
      </div><!-- /graph-window -->
      </div><!-- /graph-col -->

      <!-- MAP WINDOW -->
      <div class="window" id="map-window">
        <div class="window-titlebar">
          <span id="map-window-title">your map</span>
          <span id="map-window-type" style="font-size:12px;color:#aaa;"></span>
        </div>
        <div class="map-window-body">
          <div class="map-svg-wrap" id="map-svg-wrap"></div>
        </div>
      </div>

    </div><!-- /top-row -->

    <!-- CALENDAR WINDOW: full width below -->
    <div class="window" id="cal-window">
      <div class="window-titlebar" style="justify-content:center;gap:20px;">
        <button class="month-btn" onclick="changeMonth(-1)">◄</button>
        <div class="month-label" id="month-label" style="min-width:180px;font-size:clamp(15px,1.8vw,22px);"></div>
        <button class="month-btn" onclick="changeMonth(1)">►</button>
      </div>
      <div class="window-body">
        <div class="cal-header">
          <div class="cal-day-label">SUN</div>
          <div class="cal-day-label">MON</div>
          <div class="cal-day-label">TUE</div>
          <div class="cal-day-label">WED</div>
          <div class="cal-day-label">THU</div>
          <div class="cal-day-label">FRI</div>
          <div class="cal-day-label">SAT</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div style="display:flex;justify-content:flex-end;padding-top:8px;">
          <span id="cal-entry-count" style="font-size:12px;color:#aaa;font-family:var(--font-game);"></span>
        </div>
        <div class="empty-month" id="cal-empty" style="display:none;">
          no entries for this map this month
        </div>

// ── MAP SVG BUILDER ───────────────────────────────────────
function buildMapSVG(mapType, zones) {
  if (mapType === 'square') return buildSquareSVG(zones || []);
  return buildSpiralSVG(zones || []);
}

function buildSpiralSVG(zones) {
  const cx=250, cy=190, b=13;
  const pts=[];
  for(let i=0;i<=700;i++){
    const t=0.1+(15.4)*i/700;
    pts.push([cx+b*t*Math.cos(t), cy-b*t*Math.sin(t)]);
  }
  const d=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const thetas=[0.5,9.4,11.5,13.3,14.9];
  const pos=thetas.map(t=>({x:cx+b*t*Math.cos(t),y:cy-b*t*Math.sin(t)}));
  return buildZonesSVG('spiral', pos, zones, d);
}

function buildSquareSVG(zones) {
  const extra = `<rect x="50" y="28" width="400" height="344" fill="none" stroke="#b8a88a" stroke-width="1.5"/>
    <line x1="250" y1="28" x2="250" y2="372" stroke="#b8a88a" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="50" y1="200" x2="450" y2="200" stroke="#b8a88a" stroke-width="1" stroke-dasharray="4 4"/>`;
  return buildZonesSVG('square', SQUARE_POS, zones, null, extra);
}

function buildZonesSVG(type, positions, zones, spiralPath, extra) {
  const R=32;
  let defs='<defs>';
  let els='';

  positions.forEach((pos,i) => {
    const z=zones[i]||{};
    if(z.tint){
      defs+=`<radialGradient id="ag${i}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${z.tint}" stop-opacity=".5"/>
        <stop offset="100%" stop-color="${z.tint}" stop-opacity="0"/>
      </radialGradient>`;
      els+=`<circle cx="${pos.x}" cy="${pos.y}" r="${R+24}" fill="url(#ag${i})"/>`;
    }
    if(z.terrain && TERRAIN_IMGS[z.terrain]){
      defs+=`<clipPath id="ac${i}"><circle cx="${pos.x}" cy="${pos.y}" r="${R-2}"/></clipPath>`;
      els+=`<image x="${pos.x-R}" y="${pos.y-R}" width="${R*2}" height="${R*2}"
        href="${TERRAIN_IMGS[z.terrain]}" clip-path="url(#ac${i})" preserveAspectRatio="xMidYMid meet"/>`;
    } else {
      els+=`<circle cx="${pos.x}" cy="${pos.y}" r="${R}" fill="rgba(200,196,180,.8)" stroke="#8a7a5a" stroke-width="1.2"/>`;
      els+=`<text x="${pos.x}" y="${pos.y+5}" text-anchor="middle" dominant-baseline="middle"
        fill="#5a4a2a" font-family="ZoesHandwriting,cursive" font-size="20">${i+1}</text>`;
    }
    if(z.feeling){
      els+=`<text x="${pos.x}" y="${pos.y+R+14}" text-anchor="middle"
        fill="#2a1e14" font-family="ZoesHandwriting,cursive" font-size="14" font-weight="bold">${z.feeling}</text>`;
    }
  });
  defs+='</defs>';

  const spiral = spiralPath
    ? `<line x1="250" y1="0" x2="250" y2="400" stroke="rgba(138,122,90,.12)" stroke-width="1"/>
       <line x1="0" y1="200" x2="500" y2="200" stroke="rgba(138,122,90,.12)" stroke-width="1"/>
       <path fill="none" stroke="#b8a88a" stroke-width="1.5" stroke-linecap="round" d="${spiralPath}"/>` : '';

  return `<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
    ${defs}${spiral}${extra||''}${els}
  </svg>`;
}

function renderCalendar() {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('month-label').textContent = monthNames[viewMonth] + ' ' + viewYear;

  const firstDay  = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const today     = localToday();
  const grid      = document.getElementById('cal-grid');
  grid.innerHTML  = '';

  // Check if any entries this month
  const monthStr  = viewYear + '-' + String(viewMonth+1).padStart(2,'0');
  const hasMonth  = allEntries.some(e => e.entry_date.startsWith(monthStr));
  document.getElementById('cal-empty').style.display = hasMonth ? 'none' : 'block';
  if (!hasMonth && allEntries.length === 0) {
    document.getElementById('cal-empty').style.display = 'block';
  }

  // Filler cells
  for (let i=0; i<firstDay; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell filler';
    grid.appendChild(cell);
  }

  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = viewYear + '-' + String(viewMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const entry   = entryMap[dateStr];
    const cell    = document.createElement('div');
    cell.className = 'cal-cell' + (entry ? ' has-entry' : '') + (dateStr===today ? ' is-today' : '');

    // Date number
    const dateEl = document.createElement('div');
    dateEl.className = 'cal-date';
    dateEl.textContent = d;
    cell.appendChild(dateEl);

    if (entry) {
      // Look up zone data from the active game's map_data
      const zoneIndex = entry.map_phase
        ? parseInt(entry.map_phase.replace('zone_', '')) - 1
        : -1;
      const game     = allGames.find(g => g.id === activeGameId);
      const zoneData = (game?.map_data?.zones || [])[zoneIndex] || {};

      // Zone circle: radial gradient fade (opaque center → transparent edge) + terrain PNG + feeling
      const circle = document.createElement('div');
      circle.className = 'cal-zone-circle';
      const tint     = zoneData.tint || phaseColor(entry.map_phase);
      const tintFade = tint.replace(/,\s*[\d.]+\)$/, ', 0)');
      circle.style.background = `radial-gradient(circle, ${tint} 0%, ${tintFade} 100%)`;

      if (zoneData.terrain && TERRAIN_IMGS[zoneData.terrain]) {
        const terrainImg = document.createElement('img');
        terrainImg.className = 'cal-terrain-img';
        terrainImg.src = TERRAIN_IMGS[zoneData.terrain];
        terrainImg.alt = '';
        circle.appendChild(terrainImg);
      }

      if (zoneData.feeling) {
        const feelEl = document.createElement('div');
        feelEl.className = 'cal-feeling-label';
        feelEl.textContent = zoneData.feeling;
        circle.appendChild(feelEl);
      }

      cell.appendChild(circle);

      // Character — sits on top of zone circle
      const char = entry.character_data;
      if (char?.body) {
        const charWrap = document.createElement('div');
        charWrap.className = 'cal-char';
        const layers = [
          {key:'body', id:char.body},
          {key:'acc',  id:char.acc},
          {key:'hair', id:char.hair},
          {key:'eyes', id:char.eyes},
          {key:'mouth',id:char.mouth},
        ];
        layers.forEach(l => {
          if (!l.id) return;
          const layer = document.createElement('div');
          layer.className = 'cal-char-layer';
          layer.innerHTML = `<img src="${FULL[l.id]||''}" alt=""/>`;
          charWrap.appendChild(layer);
        });
        cell.appendChild(charWrap);
      }

      cell.onclick = () => openDetail(entry, dateStr);
    }

    grid.appendChild(cell);
  }
}

// ── BAR GRAPH ─────────────────────────────────────────────
let weekPage = 0;

function changeWeekPage(dir) {
  weekPage += dir;
  renderBarGraph();
}

function getWeekSunday(weekOffset) {
  const now = new Date();
  const local = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  local.setDate(local.getDate() - local.getDay() - weekOffset * 7);
  return local;
}

function renderBarGraph() {
  const barsEl  = document.getElementById('graph-bars');
  const yEl     = document.getElementById('graph-y');
  const emptyEl = document.getElementById('graph-empty');
  const legEl   = document.getElementById('phase-legend');
  barsEl.innerHTML = ''; yEl.innerHTML = ''; legEl.innerHTML = '';

  const allWithEnergy = allEntries.filter(e => e.energy_score != null);

  // Clamp weekPage: don't go further back than the earliest entry's week
  if (allWithEnergy.length) {
    const earliest = new Date(allWithEnergy[0].entry_date + 'T00:00:00');
    const earliestSunday = new Date(earliest);
    earliestSunday.setDate(earliest.getDate() - earliest.getDay());
    const todaySunday = getWeekSunday(0);
    const maxPage = Math.round((todaySunday - earliestSunday) / (7 * 86400000));
    weekPage = Math.max(0, Math.min(weekPage, maxPage));
  } else {
    weekPage = 0;
  }

  // Build the 7 days of this week
  const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const sunday = getWeekSunday(weekPage);
  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    const dateStr = d.toLocaleDateString('en-CA');
    weekDays.push({ dateStr, name: DAY_NAMES[i], num: d.getDate(), month: d.getMonth(), entry: entryMap[dateStr] || null });
  }

  // Week label: e.g. "May 4 – 10"
  const first = weekDays[0], last = weekDays[6];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const weekLabel = first.month === last.month
    ? `${monthNames[first.month]} ${first.num} – ${last.num}`
    : `${monthNames[first.month]} ${first.num} – ${monthNames[last.month]} ${last.num}`;
  document.getElementById('week-label').textContent = weekLabel;

  // Button state
  const prevBtn = document.getElementById('graph-prev-week');
  const nextBtn = document.getElementById('graph-next-week');
  if (prevBtn) prevBtn.disabled = allWithEnergy.length === 0 || weekPage >= Math.round((getWeekSunday(0) - getWeekSunday(weekPage + 1 > 0 ? weekPage : 0)) / (7*86400000));
  if (nextBtn) nextBtn.disabled = weekPage <= 0;

  // Check if any entries exist this week
  const hasAnyEntry = weekDays.some(d => d.entry?.energy_score != null);
  if (!allWithEnergy.length) {
    emptyEl.style.display = 'block';
  } else {
    emptyEl.style.display = 'none';
  }

  const MAX_HEARTS = 24;

  // ── Y axis ──
  const yLabels = ['easy', 'medium', 'hard'];
  yLabels.forEach((lbl, i) => {
    const el = document.createElement('div');
    el.className = 'y-label' + (i > 0 && i < 4 ? ' reading-zone' : '');
    el.textContent = lbl;
    yEl.appendChild(el);
  });

  // ── Difficulty bands ──
  const diffBands = [
    { bottom:'79.2%', height:'20.8%', color:'rgba(42,59,154,.10)',  label:'easy (20–24)'   },
    { bottom:'37.5%', height:'41.7%', color:'rgba(101,121,226,.07)', label:'medium (10–19)' },
    { bottom:'0%',    height:'37.5%', color:'rgba(168,180,240,.07)', label:'hard (0–9)'     },
  ];
  diffBands.forEach(b => {
    const band = document.createElement('div');
    band.className = 'diff-band';
    band.style.bottom = b.bottom; band.style.height = b.height;
    band.style.background = b.color;
    band.style.borderTop = '1px solid rgba(101,121,226,.15)';
    const lbl = document.createElement('div');
    lbl.className = 'diff-band-label'; lbl.textContent = b.label;
    band.appendChild(lbl); barsEl.appendChild(band);
  });

  // ── 7 columns (one per day) ──
  const usedPhases = new Set();
  const xLabelsEl = document.getElementById('graph-x-labels');
  xLabelsEl.innerHTML = '';

  weekDays.forEach(day => {
    const col = document.createElement('div');
    col.className = 'bar-col';

    if (day.entry && day.entry.energy_score != null) {
      const score  = Math.min(day.entry.energy_score, 100);
      const hearts = Math.round(score / 100 * MAX_HEARTS);
      const heightPct = hearts / MAX_HEARTS * 100;
      const color = phaseColor(day.entry.map_phase);
      usedPhases.add(day.entry.map_phase);

      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.height = heightPct + '%';
      fill.style.background = color;
      fill.title = `${day.name} ${day.num} · ${phaseLabel(day.entry.map_phase)} · ${hearts} hearts`;
      fill.onclick = () => openDetail(day.entry, day.dateStr);

      const scoreEl = document.createElement('div');
      scoreEl.className = 'bar-score';
      scoreEl.textContent = hearts;
      fill.appendChild(scoreEl);
      col.appendChild(fill);
    }

    barsEl.appendChild(col);

    // X label: day name + date number
    const xLbl = document.createElement('div');
    xLbl.className = 'bar-x-label' + (day.entry ? ' bar-x-label--active' : '');
    xLbl.innerHTML = `${day.name}<br>${day.num}`;
    xLabelsEl.appendChild(xLbl);
  });

  // ── Legend ──
  legEl.innerHTML = `
    <div class="legend-gradient-bar"></div>
    <div class="legend-gradient-labels">
      <span>zone 1</span><span>zone 2</span><span>zone 3</span><span>zone 4</span><span>zone 5</span>
    </div>`;
}

// ── PHASE PROMPTS (placeholders) ─────────────────────────
const SPIRAL_PROMPTS = {
  zone_1: 'zone one — what does it feel like to imagine your goal coming true?',
  zone_2: 'zone two — what does it feel like to begin?',
  zone_3: 'zone three — what does it feel like when you get into a good rhythm?',
  zone_4: 'zone four — what does it feel like when you take a big step forward?',
  zone_5: 'zone five — what does it feel like when you are tested?',
};
const SQUARE_PROMPTS = {
  zone_1: 'corner one — what does it feel like to be a beginner',
  zone_2: 'corner two — what does it feel like to fail',
  zone_3: 'corner three — what does it feel like to recommit',
  zone_4: 'corner four — what does it feel like to improve your skill',
};

// ── DETAIL POPUP ──────────────────────────────────────────
function openDetail(entry, dateStr) {
  const char   = entry.character_data || {};
  const hearts = Math.round((entry.energy_score??0) / 100 * 24);
  const diff   = getDifficulty(hearts);

  document.getElementById('detail-title').textContent = formatShortDate(dateStr);
  document.getElementById('detail-date').textContent  = formatDateLabel(dateStr);
  document.getElementById('detail-char-name').textContent = char.name || '';

  renderCharLayer(document.getElementById('dl-body'),  char.body);
  renderCharLayer(document.getElementById('dl-acc'),   char.acc);
  renderCharLayer(document.getElementById('dl-hair'),  char.hair);
  renderCharLayer(document.getElementById('dl-eyes'),  char.eyes);
  renderCharLayer(document.getElementById('dl-mouth'), char.mouth);

  const meta = document.getElementById('detail-meta');
  meta.innerHTML = '';

  const detailZoneIdx  = entry.map_phase ? parseInt(entry.map_phase.replace('zone_', '')) - 1 : -1;
  const detailGame     = allGames.find(g => g.id === activeGameId);
  const detailZone     = (detailGame?.map_data?.zones || [])[detailZoneIdx] || {};
  const mapType        = detailGame?.map_type || 'spiral';
  const promptSet      = mapType === 'square' ? SQUARE_PROMPTS : SPIRAL_PROMPTS;
  const prompt         = promptSet[entry.map_phase] || '';

  // Phase row — prompt only, no zone label
  const phaseRow = document.createElement('div');
  phaseRow.className = 'detail-row';
  phaseRow.style.alignItems = 'flex-start';
  phaseRow.innerHTML = `<span class="detail-row-label">phase</span>
    <span style="text-align:right;max-width:72%;">
      ${prompt
        ? `<span style="font-family:var(--font-hand);font-size:12px;color:#333;display:block;">${prompt}</span>`
        : `<span class="detail-row-value" style="color:${phaseColor(entry.map_phase)}">${phaseLabel(entry.map_phase)}</span>`
      }
    </span>`;
  meta.appendChild(phaseRow);

  // Location row — terrain · feeling from game zone data
  const detailLocation = detailZone.terrain && detailZone.feeling
    ? `${detailZone.terrain} of ${detailZone.feeling}`
    : detailZone.terrain || detailZone.feeling || entry.map_location || '—';
  const locRow = document.createElement('div');
  locRow.className = 'detail-row';
  locRow.innerHTML = `<span class="detail-row-label">location</span>
    <span class="detail-row-value">${detailLocation}</span>`;
  meta.appendChild(locRow);

  // Energy only (difficulty removed)
  const energyRow = document.createElement('div');
  energyRow.className = 'detail-row';
  energyRow.innerHTML = `<span class="detail-row-label">energy</span>
    <span class="detail-row-value">${hearts} / 24 hearts</span>`;
  meta.appendChild(energyRow);

  // Adventure notes — opens journal view
  const notesRow = document.createElement('div');
  notesRow.className = 'detail-row';
  notesRow.style.cursor = 'pointer';
  notesRow.innerHTML = `<span class="detail-row-label">adventure notes</span>
    <span class="detail-row-value" style="color:var(--purple);">read →</span>`;
  notesRow.onclick = () => openJournal(dateStr, activeGameId);
  meta.appendChild(notesRow);

  document.getElementById('detail-view').style.display = 'block';
  document.getElementById('journal-view').style.display = 'none';
  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
}
function handleOverlayClick(e) { if (e.target === document.getElementById('detail-overlay')) closeDetail(); }
document.addEventListener('keydown', e => { if (e.key==='Escape') closeDetail(); });

// ── JOURNAL ───────────────────────────────────────────────
function showDetailView() {
  document.getElementById('journal-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
}

async function openJournal(dateStr, gameId) {
  const contentEl = document.getElementById('journal-content');
  contentEl.innerHTML = '<div class="journal-empty">loading...</div>';

  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('journal-view').style.display = 'flex';

  const { data, error } = await sb.from('diary_entries')
    .select('diary_text')
    .eq('game_id', gameId)
    .eq('entry_date', dateStr)
    .maybeSingle();

  if (error || !data?.diary_text) {
    contentEl.innerHTML = '<div class="journal-empty">no adventure notes for this day yet ✦</div>';
  } else {
    contentEl.innerHTML = `<div class="journal-text">${data.diary_text}</div>`;
  }
}

// ── ENTRY LOADING ─────────────────────────────────────────
async function loadEntries() {
  if (!activeGameId) return;
  const { data } = await sb.from('daily_entries')
    .select('entry_date, map_location, map_phase, character_data, bingo_data, energy_score')
    .eq('game_id', activeGameId)
    .eq('user_id', currentUser.id)
    .order('entry_date', { ascending:true });
  allEntries = data || [];
  entryMap   = buildEntryMap(allEntries);
  weekPage   = 0; // reset to most recent week on map switch
  const game = allGames.find(g => g.id === activeGameId);
  document.getElementById('cal-entry-count').textContent = allEntries.length + ' entries';
  // Update dropdown to reflect active game
  const dd = document.getElementById('game-dropdown');
  if (dd) dd.value = activeGameId;
  renderCalendar();
  renderBarGraph();
  renderMap();
}

// ── INIT ─────────────────────────────────────────────────
async function init() {
  try {
    const { data:{ session } } = await sb.auth.getSession();
    currentUser = session?.user || null;
  } catch(e) {}
  if (!currentUser) {
    document.getElementById('loading-state').textContent = 'please log in to view your archive';
    return;
  }
  await loadGames();
  const params = new URLSearchParams(window.location.search);
  const urlId  = params.get('game_id');
  if (urlId && allGames.find(g => g.id === urlId)) {
    await selectMapForArchive(urlId);
  } else {
    document.getElementById('loading-state').style.display = 'none';
    showMapSelector();
  }
}

init();
</script>
