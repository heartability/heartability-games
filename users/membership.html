<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="../assets/elements/favicon.png">
  <link rel="stylesheet" href="../assets/css/modal.css">
  <script src="../assets/js/modal.js" defer></script>
  <title>Membership — Heartability</title>
  <meta name="description" content="See Heartability membership options and unlock the dream matrix tracker, cosmic matrix ritual, and other member-only features.">
  <meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
  <style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:     "ZoesHandwriting", cursive;
  --font-pixel:    "PFPixelscript", cursive;
  --purple:        #6e83d3;
  --purple-dark:   #4a5bc4;
  --purple-shadow: #3a4aaa;
  --blue-glow:     #83d2e6;
  --line-col:      #111;
}

html, body {
  width: 100vw;
  min-height: 100dvh;
  font-family: var(--font-hand);
  user-select: none;
  background: url('../assets/elements/gradient.png') center / cover no-repeat fixed;
  background-color: #5b7fe0;
}

/* ── LOADING ── */
#loading-state {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-pixel);
  font-size: clamp(21px, 2vw, 28px);
  color: var(--blue-glow);
  text-shadow: 0 0 20px rgba(131,210,230,0.6);
}
#main-content { display: none; }

/* ── PAGE CONTENT ── */
.page-content {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 54px 16px 70px;
  gap: 10px;
}

.banner {
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.4vw, 18px);
  border-radius: 2px;
  padding: 10px 18px;
  display: none;
  text-align: center;
}
.banner.success  { display: block; background: rgba(45,122,79,0.15); border: 1.5px solid rgba(45,122,79,0.4); color: #e0ffe8; }
.banner.cancelled { display: block; background: rgba(192,57,43,0.12); border: 1.5px solid rgba(192,57,43,0.3); color: #ffe8e8; }

/* ── TIERS ROW ── */
.tiers {
  display: flex;
  gap: 2%;
  align-items: flex-start;
  justify-content: center;
  width: 100%;
  z-index: 4;
}

/* center title image between blobs */
.membership-title {
  flex: 0 0 18%;
  width: 18%;
  min-width: 300px;
  max-width: 8000px;
  height: auto;
  display: block;
  margin-top: 2px;
  z-index: 3;
}

.tier {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.tier-label {
  font-family: var(--font-hand);
  font-size: clamp(16px, 2vw, 25px);
  color: rgba(255,255,255,0.9);
  text-align: center;
}

.tier-blob {
  position: relative;
  width: 100%;
  transition: transform 0.2s;
}
.tier:hover .tier-blob { transform: scale(1.03); }
.tier:active .tier-blob { transform: scale(0.98); }

.tier-blob img.blob-img {
  width: 100%;
  height: auto;
  display: block;
}

.blob-benefits {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 1.5vh, 18px);
  padding: 18% 12%;
  pointer-events: none;
}

.benefit {
  font-family: var(--font-hand);
  font-size: clamp(14px, 2vw, 23px);
  color: #fff;
  text-align: center;
  line-height: 1.3;
  text-shadow: 0 1px 4px rgba(0,0,0,0.25);
}

/* ── CLOSE BUTTON ── */
.close-btn {
  position: fixed;
  top: 18px; right: 22px;
  z-index: 20;
  font-family: var(--font-hand);
  font-size: clamp(18px, 1.8vw, 24px);
  color: rgba(255,255,255,0.7);
  background: none;
  border: none;
  cursor: pointer;
  line-height: 1;
  transition: color 0.15s;
}
.close-btn:hover { color: #fff; }

/* ── BILLING PICKER POPUP ── */
.billing-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
}
.billing-overlay.open { display: flex; }

.billing-popup {
  background: #dfe2ef;
  box-shadow: 0 0 0 4px var(--purple), 4px 8px 28px rgba(0,0,0,0.35);
  padding: 32px 28px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  min-width: 280px;
  max-width: 480px;
  width: 90vw;
  animation: popIn 0.18s ease both;
}

#pricing-table-slot { width: 100%; font-family: var(--font-hand); text-align: center; color: #333; }
@keyframes popIn {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}

.billing-popup h2 {
  font-family: var(--font-hand);
  font-size: clamp(20px, 2vw, 28px);
  color: #333;
  text-align: center;
}

.billing-cancel {
  font-family: var(--font-hand);
  font-size: clamp(13px, 1vw, 16px);
  color: #999;
  cursor: pointer;
  background: none;
  border: none;
}
.billing-cancel:hover { color: #555; }

/* ── FOOTER ── */
.legal-footer {
  position: fixed;
  bottom: 12px; left: 0; right: 0;
  text-align: center;
  font-family: var(--font-hand);
  font-size: clamp(14px, 3vw, 20px);
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.legal-footer a { color: rgba(255,255,255,0.65); text-decoration: none; transition: color 0.15s; }
.legal-footer a:hover { color: #fff; }
.legal-footer span { color: rgba(255,255,255,0.3); }

/* ── MOBILE: stack vertically ── */
@media (max-width: 600px) {
  .membership-title {
    flex: none;
    width: clamp(160px, 55vw, 260px);
    order: -1;
  }
  .tiers {
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .tier {
    width: 80%;
    max-width: 320px;
    flex: none;
  }
}

  </style>
</head>
<body>

<div id="loading-state">loading</div>

<div class="page-content" id="main-content">

  <div class="banner" id="banner"></div>

  <div class="tiers">

    <!-- FREE -->
    <div class="tier" onclick="window.location.href='../rooms/bed.html'" title="free membership">
      <div class="tier-blob">
        <img class="blob-img" src="../assets/elements/free.png" alt="free membership">
      </div>
    </div>

    <img class="membership-title" src="../assets/elements/membership.png" alt="membership options">

    <!-- COMMUNITY -->
    <div class="tier" id="tier-community" onclick="checkout()" title="community membership">
      <div class="tier-blob">
        <img class="blob-img" src="../assets/elements/dream.png" alt="community membership">
      </div>
    </div>

  </div>

</div>

<button class="close-btn" id="close-btn" title="close" aria-label="close">&#x2715;</button>

<!-- BILLING PICKER -->
<div class="billing-overlay" id="billing-overlay" onclick="if(event.target===this)closeBillingPicker()">
  <div class="billing-popup">
    <h2>how would you like to pay?</h2>
    <div id="pricing-table-slot">loading...</div>
    <button class="billing-cancel" onclick="closeBillingPicker()">never mind</button>
  </div>
</div>

<footer class="legal-footer">
  <a href="../legal/privacy-policy.html">privacy policy</a>
  <span>·</span>
  <a href="../legal/refund-policy.html">refund policy</a>
  <span>·</span>
  <a href="../legal/support.html">support</a>
  <span>·</span>
  <a href="../legal/bug-report.html">report a bug</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-init.js"></script>
<script async src="https://js.stripe.com/v3/pricing-table.js"></script>
<script>
(function () {

  document.getElementById('close-btn').addEventListener('click', () => {
    if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
      window.location.href = document.referrer;
    } else if (history.length > 1) {
      history.back();
    } else {
      window.location.href = '../rooms/game-room.html';
    }
  });

  const STRIPE_PUBLISHABLE_KEY = 'pk_live_51TTUhnA6JE5MLfPsiqvAnl4HCQcdMnl9jP8vR5PGfO8kFHFWkLmAo9PaOsHMuCiUfIQGDq3BmSQQxA6pJbp7GqLs00zZjnhFDK';
  const PRICING_TABLE_ID       = 'prctbl_1TvKzDA6JE5MLfPsaTxkdoJp';

  let currentSession = null;

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const banner = document.getElementById('banner');
    if (params.get('success') === 'true') {
      banner.textContent = 'welcome to heartability! your membership is now active';
      banner.className = 'banner success';
    } else if (params.get('cancelled') === 'true') {
      banner.textContent = "no worries — you can join whenever you're ready";
      banner.className = 'banner cancelled';
    }

    const { data: { session } } = await sb.auth.getSession();
    currentSession = session;

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').style.display  = 'flex';
  }

  let pricingTableLoaded = false;

  window.checkout = async function () {
    if (!currentSession) {
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('billing-overlay').classList.add('open');
    if (pricingTableLoaded) return;

    const slot = document.getElementById('pricing-table-slot');
    try {
      const res = await fetch(
        `${SUPABASE_URL}/functions/v1/create-pricing-table-session`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentSession.access_token}`
          }
        }
      );
      const { clientSecret, error } = await res.json();
      if (error) throw new Error(error);

      slot.innerHTML = '';
      const table = document.createElement('stripe-pricing-table');
      table.setAttribute('pricing-table-id', PRICING_TABLE_ID);
      table.setAttribute('publishable-key', STRIPE_PUBLISHABLE_KEY);
      table.setAttribute('customer-session-client-secret', clientSecret);
      slot.appendChild(table);
      pricingTableLoaded = true;
    } catch (err) {
      console.error(err);
      slot.textContent = err.message || 'something went wrong — please try again';
    }
  };

  window.closeBillingPicker = function () {
    document.getElementById('billing-overlay').classList.remove('open');
  };

  init();
})();
</script>

</body>
</html>
