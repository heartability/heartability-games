<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="../assets/elements/favicon.png">
  <link rel="stylesheet" href="../assets/css/modal.css">
  <script src="../assets/js/modal.js" defer></script>
  <title>Membership — Heartability</title>
  <meta name="description" content="See Heartability membership options and unlock the dream matrix tracker, cosmic matrix ritual, and other member-only features.">
  <meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview.png">
  <style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:     "ZoesHandwriting", cursive;
  --font-pixel:    "PFPixelscript", cursive;
  --purple:        #6579e2;
  --purple-dark:   #4a5bc4;
  --purple-shadow: #3a4aaa;
  --blue-glow:     #83d2e6;
  --line-col:      #111;
}

html, body {
  width: 100vw;
  min-height: 100dvh;
  font-family: var(--font-hand);
  user-select: none;
  background: url('../assets/elements/gradient.png') center / cover no-repeat fixed;
  background-color: #5b7fe0;
}

/* ── NAV ── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #4970fc;
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(18px, 1.6vw, 22px);
  color: #fff;
}
.nav-btn { cursor: pointer; padding: 4px 8px; border-radius: 2px; transition: background 0.15s; color: inherit; text-decoration: none; }
.nav-btn:hover { background: rgba(0,0,0,0.08); }
.nav-title { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; white-space: nowrap; margin: 0; font: inherit; }
.gear-wrap { position: relative; }
.gear-btn { width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 3px; transition: background 0.15s; padding: 3px; }
.gear-btn:hover { background: rgba(0,0,0,0.08); }
.gear-btn img { width: 22px; height: 22px; display: block; }
.gear-dropdown { position: absolute; top: calc(100% + 4px); left: 0; min-width: 170px; background: #c9fff5; border: 2px solid var(--line-col); box-shadow: 3px 4px 0 rgba(0,0,0,0.12); z-index: 201; display: none; flex-direction: column; overflow: hidden; }
.gear-dropdown.open { display: flex; }
.gear-item { font-family: var(--font-hand); font-size: clamp(13px,1.3vw,16px); color: #333; padding: 9px 14px; cursor: pointer; border: none; background: none; text-align: left; white-space: nowrap; transition: background 0.12s; }
.gear-item:hover { background: rgba(0,0,0,0.07); }

/* ── LOADING ── */
#loading-state {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-pixel);
  font-size: clamp(18px, 2vw, 24px);
  color: var(--blue-glow);
  text-shadow: 0 0 20px rgba(131,210,230,0.6);
}
#main-content { display: none; }

/* ── PAGE CONTENT ── */
.page-content {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 54px 16px 70px;
  gap: 10px;
}

.banner {
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.4vw, 16px);
  border-radius: 2px;
  padding: 10px 18px;
  display: none;
  text-align: center;
}
.banner.success  { display: block; background: rgba(45,122,79,0.15); border: 1.5px solid rgba(45,122,79,0.4); color: #e0ffe8; }
.banner.cancelled { display: block; background: rgba(192,57,43,0.12); border: 1.5px solid rgba(192,57,43,0.3); color: #ffe8e8; }

/* ── TIERS ROW ── */
.tiers {
  display: flex;
  gap: 2%;
  align-items: flex-start;
  justify-content: center;
  width: 100%;
}

/* center title image between blobs */
.membership-title {
  flex: 0 0 18%;
  width: 18%;
  min-width: 120px;
  max-width: 240px;
  height: auto;
  display: block;
  margin-top: 2px;
}

.tier {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.tier-label {
  font-family: var(--font-hand);
  font-size: clamp(14px, 2vw, 22px);
  color: rgba(255,255,255,0.9);
  text-align: center;
}

.tier-blob {
  position: relative;
  width: 100%;
  transition: transform 0.2s;
}
.tier:hover .tier-blob { transform: scale(1.03); }
.tier:active .tier-blob { transform: scale(0.98); }

.tier-blob img.blob-img {
  width: 100%;
  height: auto;
  display: block;
}

.blob-benefits {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 1.5vh, 18px);
  padding: 18% 12%;
  pointer-events: none;
}

.benefit {
  font-family: var(--font-hand);
  font-size: clamp(12px, 2vw, 20px);
  color: #fff;
  text-align: center;
  line-height: 1.3;
  text-shadow: 0 1px 4px rgba(0,0,0,0.25);
}

/* ── ALREADY A MEMBER ── */
.already-member {
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.2vw, 16px);
  color: rgba(255,255,255,0.7);
  text-align: center;
}
.already-member a { color: #fff; text-decoration: underline; cursor: pointer; }

/* ── BILLING PICKER POPUP ── */
.billing-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
}
.billing-overlay.open { display: flex; }

.billing-popup {
  background: #f5f0ea;
  box-shadow: 0 0 0 3px var(--purple), 0 0 0 6px var(--blue-glow), 4px 8px 28px rgba(0,0,0,0.35);
  padding: 32px 28px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  min-width: 280px;
  max-width: 360px;
  animation: popIn 0.18s ease both;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}

.billing-popup h2 {
  font-family: var(--font-hand);
  font-size: clamp(16px, 2vw, 22px);
  color: #333;
  text-align: center;
}

.billing-btns {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}

.billing-btn {
  font-family: var(--font-hand);
  font-size: clamp(14px, 1.6vw, 18px);
  color: #fff;
  background: var(--purple);
  border: none;
  padding: 12px 20px;
  cursor: pointer;
  transition: background 0.15s;
  text-align: center;
}
.billing-btn:hover { background: var(--purple-dark); }
.billing-btn small { display: block; font-size: 0.75em; opacity: 0.85; margin-top: 2px; }

.billing-cancel {
  font-family: var(--font-hand);
  font-size: clamp(11px, 1vw, 14px);
  color: #999;
  cursor: pointer;
  background: none;
  border: none;
}
.billing-cancel:hover { color: #555; }

/* ── FOOTER ── */
.legal-footer {
  position: fixed;
  bottom: 12px; left: 0; right: 0;
  text-align: center;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1vw, 15px);
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.legal-footer a { color: rgba(255,255,255,0.65); text-decoration: none; transition: color 0.15s; }
.legal-footer a:hover { color: #fff; }
.legal-footer span { color: rgba(255,255,255,0.3); }

/* ── MOBILE: stack vertically ── */
@media (max-width: 600px) {
  .tiers {
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .membership-title {
    flex: none;
    width: clamp(160px, 55vw, 260px);
    order: -1;
  }
  .tier {
    width: 80%;
    max-width: 320px;
    flex: none;
  }
}

  </style>
</head>
<body>

<nav class="room-nav">
  <div class="gear-wrap" id="gear-wrap">
    <div class="gear-btn" onclick="toggleGear()">
      <img src="../assets/elements/gear icon.png" alt="menu">
    </div>
    <div class="gear-dropdown" id="gear-dropdown">
      <button class="gear-item" onclick="window.location.href='profile.html'">view profile</button>
      <button class="gear-item" id="gear-logout">sign out</button>
    </div>
  </div>
  <h1 class="nav-title">membership options</h1>
  <div style="display:flex;align-items:center;gap:4px;">
    <a class="nav-btn" href="profile.html" onclick="if(history.length>1){history.back();return false;}">← back</a>
    <a class="nav-btn" href="../index.html">home →</a>
  </div>
</nav>

<div id="loading-state">loading</div>

<div class="page-content" id="main-content">

  <div class="banner" id="banner"></div>

  <div class="tiers">

    <!-- FREE -->
    <div class="tier" onclick="window.location.href='profile.html'" title="free membership">
      <div class="tier-blob">
        <img class="blob-img" src="../assets/elements/free.png" alt="free membership">
      </div>
    </div>

    <img class="membership-title" src="../assets/elements/membership.png" alt="membership options">

    <!-- COMMUNITY -->
    <div class="tier" id="tier-community" onclick="checkout()" title="community membership">
      <div class="tier-blob">
        <img class="blob-img" src="../assets/elements/dream.png" alt="community membership">
      </div>
    </div>

  </div>

  <div class="already-member">
    already a member? <a href="profile.html">go to your profile</a>
  </div>

</div>

<!-- BILLING PICKER -->
<div class="billing-overlay" id="billing-overlay" onclick="if(event.target===this)closeBillingPicker()">
  <div class="billing-popup">
    <h2>how would you like to pay?</h2>
    <div class="billing-btns">
      <button class="billing-btn" onclick="launchCheckout('monthly')">
        monthly
        <small>$8 / month</small>
      </button>
      <button class="billing-btn" onclick="launchCheckout('yearly')">
        yearly
        <small>$88 / year — save $8!</small>
      </button>
    </div>
    <button class="billing-cancel" onclick="closeBillingPicker()">never mind</button>
  </div>
</div>

<footer class="legal-footer">
  <a href="../legal/privacy-policy.html">privacy policy</a>
  <span>·</span>
  <a href="../legal/refund-policy.html">refund policy</a>
  <span>·</span>
  <a href="../legal/support.html">support</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function toggleGear() { document.getElementById('gear-dropdown').classList.toggle('open'); }
document.addEventListener('click', e => {
  const w = document.getElementById('gear-wrap');
  if (w && !w.contains(e.target)) document.getElementById('gear-dropdown').classList.remove('open');
});

(function () {
  const SUPABASE_URL      = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('gear-logout').addEventListener('click', async () => {
    await sb.auth.signOut();
    window.location.href = 'login.html';
  });

  const PRICE_IDS = {
    community_monthly: 'price_1TX47YA6JE5MLfPsIZAXk3QY',
    community_yearly:  'price_1Tga4bA6JE5MLfPsJ5pzjRgo',
  };

  let currentSession = null;

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const banner = document.getElementById('banner');
    if (params.get('success') === 'true') {
      banner.textContent = 'welcome to heartability! your membership is now active';
      banner.className = 'banner success';
    } else if (params.get('cancelled') === 'true') {
      banner.textContent = "no worries — you can join whenever you're ready";
      banner.className = 'banner cancelled';
    }

    const { data: { session } } = await sb.auth.getSession();
    currentSession = session;

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').style.display  = 'flex';
  }

  window.checkout = function () {
    if (!currentSession) {
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('billing-overlay').classList.add('open');
  };

  window.closeBillingPicker = function () {
    document.getElementById('billing-overlay').classList.remove('open');
  };

  window.launchCheckout = async function (cadence) {
    closeBillingPicker();
    const priceId = cadence === 'yearly' ? PRICE_IDS.community_yearly : PRICE_IDS.community_monthly;
    const tier = document.getElementById('tier-community');
    tier.style.opacity = '0.6';
    tier.style.pointerEvents = 'none';
    try {
      const res = await fetch(
        `${SUPABASE_URL}/functions/v1/create-checkout-session`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentSession.access_token}`
          },
          body: JSON.stringify({ priceId, tier: 'dream', paymentMode: 'subscription' })
        }
      );
      const { url, error } = await res.json();
      if (error) throw new Error(error);
      window.open(url, '_blank');
    } catch (err) {
      console.error(err);
      alert('something went wrong — please try again');
    } finally {
      setTimeout(() => {
        tier.style.opacity = '';
        tier.style.pointerEvents = '';
      }, 1500);
    }
  };

  init();
})();
</script>

</body>
</html>
