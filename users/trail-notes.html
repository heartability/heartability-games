<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Trail Notes — Heartability</title>
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:   "ZoesHandwriting", cursive;
  --font-pixel:  "PFPixelscript", cursive;
  --back-wall:   #f0ece4;
  --side-col:    #dbd6ce;
  --line-col:    #111;
  --blue:        #6579e2;
  --aqua:        #83d2e6;
  --bw-top:    9%;
  --bw-left:   15%;
  --bw-width:  70%;
  --bw-height: 70%;
}

html, body {
  width: 100vw; height: 100dvh;
  overflow: hidden; user-select: none;
  background: var(--side-col);
}

/* ── Room lines ── */
.room-lines { position:fixed; inset:0; z-index:2; pointer-events:none; }
.room-lines svg { width:100%; height:100%; display:block; overflow:visible; }

/* ── Back wall ── */
.back-wall {
  position:fixed;
  top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height);
  background:var(--back-wall); border:2px solid var(--line-col);
  z-index:3; pointer-events:none;
}

/* ── Nav bar ── */
.room-nav {
  position:fixed; top:0; left:0; right:0; height:44px;
  background:#c9fff5; border-bottom:2px solid var(--line-col);
  z-index:200; display:flex; align-items:center;
  justify-content:space-between;
  padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(14px,1.6vw,20px); color:#111;
}
.nav-btn { cursor:pointer; padding:4px 8px; transition:background .15s; }
.nav-btn:hover { background:rgba(0,0,0,.08); }
.nav-title { position:absolute; left:50%; transform:translateX(-50%); pointer-events:none; white-space:nowrap; font-family:var(--font-hand); font-size:clamp(16px,2vw,24px); }
.gear-wrap { position:relative; }
.gear-btn { width:30px; height:30px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:3px; transition:background 0.15s; padding:3px; }
.gear-btn:hover { background:rgba(0,0,0,0.08); }
.gear-btn img { width:22px; height:22px; display:block; }
.gear-dropdown { position:absolute; top:calc(100% + 4px); left:0; min-width:170px; background:#c9fff5; border:2px solid var(--line-col); box-shadow:3px 4px 0 rgba(0,0,0,0.12); z-index:201; display:none; flex-direction:column; overflow:hidden; }
.gear-dropdown.open { display:flex; }
.gear-item { font-family:var(--font-hand); font-size:clamp(13px,1.3vw,16px); color:#333; padding:9px 14px; cursor:pointer; border:none; background:none; text-align:left; white-space:nowrap; transition:background 0.12s; }
.gear-item:hover { background:rgba(0,0,0,0.07); }

/* ─────────────────────────────────────────────────
   OUTSIDE-JOURNAL CONTROLS  z:4
   Map selector label + dropdown sit above the notebook.
───────────────────────────────────────────────── */
.journal-controls {
  position: fixed;
  top: calc(var(--bw-top) + 1.5%);
  left: calc(var(--bw-left) + 7%);
  width: calc(var(--bw-width) - 14%);
  z-index: 4;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.map-prompt-label {
  font-family: var(--font-pixel);
  font-size: clamp(13px, 1.4vw, 18px);
  color: #6579e2;
}
.journal-controls-right {
  display: flex; align-items: center; gap: 10px; width: 100%;
}
.game-selector {
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.3vw, 16px);
  border: 1.5px solid #6579e2; background: #6579e2;
  color: #fff; padding: 4px 8px; cursor: pointer; outline: none;
  max-width: clamp(140px, 18vw, 240px);
}
.game-selector:focus { border-color: #4a5bc4; }
.game-selector option { background: #fff; color: #333; }
.save-btn {
  padding: 5px 16px;
  background: var(--blue);
  border: 2px solid #4a5bc4; box-shadow: 2px 2px 0 #3a4aaa;
  font-family: var(--font-hand); font-size: clamp(12px, 1.3vw, 16px);
  color: #fff; cursor: pointer; transition: all .05s; white-space: nowrap;
}
.save-btn:hover { background: #4a5bc4; }
.save-btn:active { box-shadow: none; transform: translate(2px,2px); }

/* ─────────────────────────────────────────────────
   NOTEBOOK  z:4  — now single page only (right side)
───────────────────────────────────────────────── */
.notebook {
  position: fixed;
  top: calc(var(--bw-top) + 10%);
  left: calc(var(--bw-left) + 7%);
  width: calc(var(--bw-width) - 14%);
  height: calc(var(--bw-height) - 16%);
  z-index: 4;
  display: flex;
  filter: drop-shadow(4px 8px 18px rgba(0,0,0,.28));
}

/* Spiral binding — left edge of single page */
.notebook-spine {
  flex: 0 0 20px;
  background: #e8e3da;
  border: 1.5px solid #c8b88a;
  border-right: none;
  border-radius: 3px 0 0 3px;
  display: flex; flex-direction: column;
  justify-content: space-around; align-items: center;
  padding: 12px 0;
  overflow: hidden;
}
.spine-ring {
  width: 16px; height: 16px;
  border: 2.5px solid #8a7a5a;
  border-radius: 50%;
  background: var(--side-col);
  flex-shrink: 0;
}

/* Single writing page */
.notebook-right {
  flex: 1;
  background: #fff9f0;
  border: 1.5px solid #c8b88a;
  border-radius: 0 3px 3px 0;
  padding: 22px 24px 16px 20px;
  display: flex; flex-direction: column; gap: 10px;
  background-image:
    linear-gradient(to bottom, transparent calc(100% - 1px), rgba(101,121,226,.1) 1px);
  background-size: 100% 32px;
  background-position: 0 60px;
}

/* Date header row — just the date, no internal selector */
.notebook-header {
  display: flex; align-items: baseline;
  border-bottom: 1px solid rgba(101,121,226,.2);
  padding-bottom: 8px; flex-shrink: 0;
}
.notebook-date {
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.5vw, 18px);
  color: #5a4a2a;
}

.privacy-note {
  font-family: var(--font-hand);
  font-size: clamp(9px, 0.85vw, 11px);
  color: #ccc; line-height: 1.5; flex-shrink: 0;
  border-top: 1px solid #e8e0d0; padding-top: 8px;
}

/* The textarea */
.diary-area {
  flex: 1; resize: none; border: none; outline: none;
  background: transparent;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.4vw, 17px);
  color: #2a1e14; line-height: 2;
  overflow-y: auto; user-select: text;
  caret-color: var(--blue);
  min-height: 0; /* allows flex shrink so scroll works */
}
.diary-area::placeholder {
  color: rgba(138,122,90,.35);
  font-style: italic;
}
.diary-area:focus { outline: none; }

/* Save status — below the journal controls */
.save-status {
  position: fixed;
  top: calc(var(--bw-top) + 1.5%);
  right: calc(100% - var(--bw-left) - var(--bw-width) + 1%);
  font-family: var(--font-hand);
  font-size: clamp(10px, 1vw, 13px);
  color: var(--blue);
  z-index: 5;
}

/* ── Heart character ── */
.char-heart {
  position: fixed;
  left: clamp(10px, 3vw, 50px);
  bottom: clamp(4vh, 8vh, 14vh);
  width: clamp(80px, 11vw, 180px);
  z-index: 5;
}
.char-heart .char-img {
  display: block; width: 100%; height: auto;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,.28));
  animation: idle-float 3.8s ease-in-out infinite;
}
@keyframes idle-float {
  0%,100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-8px) rotate(2deg); }
}
.thought-bubble {
  position: absolute;
  left: calc(100% + 4px); bottom: 55%;
  min-width: clamp(140px,16vw,240px);
  background: #fff; border: 2px solid #000; border-radius: 50%;
  padding: 10px 16px;
  font-family: var(--font-hand); font-size: clamp(10px,1.1vw,14px);
  color: #000; text-align: center; line-height: 1.5;
  filter: drop-shadow(1px 3px 5px rgba(0,0,0,.18));
  display: none;
}
.char-heart.active .thought-bubble { display: block; }

/* ── Not logged in state ── */
.locked-overlay {
  position: absolute; inset: 0;
  background: rgba(245,240,234,.92);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; z-index: 2;
  border-radius: 0 3px 3px 0;
  text-align: center; padding: 24px;
}
.locked-overlay.show { display: flex; }
.locked-msg {
  font-family: var(--font-hand);
  font-size: clamp(13px,1.3vw,16px);
  color: #5a4a2a; line-height: 1.6;
}
.locked-btn {
  padding: 8px 20px; background: var(--blue);
  border: 2px solid #4a5bc4; box-shadow: 2px 2px 0 #3a4aaa;
  font-family: var(--font-hand); font-size: 15px; color: #fff;
  cursor: pointer; transition: all .05s;
}
.locked-btn:hover { background: #4a5bc4; }

/* ── Mobile ── */
@media (max-width: 768px) {
  /* Switch body to scrollable on mobile */
  html, body { overflow-y: auto; height: auto; min-height: 100dvh; }

  /* Hide perspective room on mobile — too cramped */
  .room-lines, .back-wall { display: none; }

  /* Controls become normal flow at top */
  .journal-controls {
    position: relative;
    top: auto; left: auto; width: 100%;
    padding: 56px 16px 10px;
    background: var(--side-col);
    display: flex !important;
  }
  .map-prompt-label { font-size: clamp(16px, 5vw, 22px); }
  .game-selector    { font-size: clamp(13px, 4vw, 16px); flex: 1; max-width: none; }
  .save-btn         { font-size: clamp(13px, 4vw, 16px); }

  /* Notebook becomes normal flow, auto height, scrollable textarea */
  .notebook {
    position: relative;
    top: auto; left: auto;
    width: calc(100% - 32px);
    height: auto;
    min-height: 70dvh;
    margin: 0 16px 32px;
    flex-direction: row;
    filter: drop-shadow(2px 4px 10px rgba(0,0,0,.22));
  }

  .notebook-spine {
    flex: 0 0 14px;
    flex-direction: column;
  }
  .spine-ring { width: 12px; height: 12px; }

  .notebook-right {
    flex: 1;
    height: auto;
    min-height: 70dvh;
  }

  /* Textarea scrolls freely */
  .diary-area {
    min-height: 50dvh;
    overflow-y: auto;
    font-size: clamp(14px, 4vw, 17px);
  }

  .save-status {
    position: relative;
    top: auto; right: auto;
    text-align: right;
    padding: 0 16px 8px;
    font-size: 13px;
  }

  /* Heart stays but smaller */
  .char-heart {
    display: none; /* too cramped on mobile */
  }
}

</style>
</head>
<body>

<!-- NAV -->
<nav class="room-nav">
  <div class="gear-wrap" id="gear-wrap">
    <div class="gear-btn" onclick="toggleGear()">
      <img src="../assets/elements/gear icon.png" alt="menu">
    </div>
    <div class="gear-dropdown" id="gear-dropdown">
      <button class="gear-item" onclick="window.location.href='../users/profile.html'">view profile</button>
      <button class="gear-item" id="gear-logout">sign out</button>
    </div>
  </div>
  <span class="nav-title">adventure log</span>
  <div style="display:flex;align-items:center;gap:4px;">
    <span class="nav-btn" onclick="window.location.href='game-select.html'">← back</span>
    <span class="nav-btn" onclick="window.location.href='archive.html'">archive →</span>
  </div>
</nav>

<!-- ROOM LINES -->
<div class="room-lines" aria-hidden="true">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="0"   y1="0"   x2="50" y2="30" stroke="#111" stroke-width="0.18"/>
    <line x1="100" y1="0"   x2="50" y2="30" stroke="#111" stroke-width="0.18"/>
    <line x1="0"   y1="100" x2="50" y2="30" stroke="#111" stroke-width="0.18"/>
    <line x1="100" y1="100" x2="50" y2="30" stroke="#111" stroke-width="0.18"/>
  </svg>
</div>

<!-- BACK WALL -->
<div class="back-wall"></div>

<!-- CONTROLS ABOVE NOTEBOOK -->
<div class="journal-controls" id="journal-controls" style="display:none;">
  <span class="map-prompt-label">Choose a map</span>
  <div class="journal-controls-right">
    <select class="game-selector" id="game-selector" onchange="onGameChange()">
      <option value="">select a map...</option>
    </select>
    <span style="flex:1;"></span>
    <button class="save-btn" onclick="saveEntry()">save</button>
  </div>
</div>

<!-- SAVE STATUS -->
<div class="save-status" id="save-status"></div>

<!-- NOTEBOOK — single page with spine -->
<div class="notebook">

  <!-- SPINE -->
  <div class="notebook-spine" id="spine-rings"></div>

  <!-- WRITING PAGE -->
  <div class="notebook-right" style="position:relative;">

    <div class="notebook-header">
      <div class="notebook-date" id="notebook-date"></div>
    </div>

    <textarea
      class="diary-area"
      id="diary-area"
      placeholder="anything you want to put on the record about today? (wins, losses, learning moments, etc.)"
      maxlength="4000"
    ></textarea>

    <div class="privacy-note">
      your entries are private and only visible to you. we never read or share your diary.
    </div>

    <!-- Locked overlay for non-logged-in users -->
    <div class="locked-overlay" id="locked-overlay">
      <div class="locked-msg">the diary is for founding members<br>log in to access your entries</div>
      <button class="locked-btn" onclick="window.location.href='game-select.html'">go to game room →</button>
    </div>

  </div>
</div>

<!-- HEART CHARACTER -->
<div class="char-heart" id="char-heart">
  <div class="thought-bubble">what do you want to remember when this day feels far away?</div>
  <img class="char-img" src="../assets/elements/guides/heart.png" alt="Heart guide character">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── SUPABASE ──────────────────────────────────────────────
const SUPABASE_URL      = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function toggleGear() { document.getElementById('gear-dropdown').classList.toggle('open'); }
document.addEventListener('click', e => { const w = document.getElementById('gear-wrap'); if (w && !w.contains(e.target)) document.getElementById('gear-dropdown').classList.remove('open'); });
document.getElementById('gear-logout').addEventListener('click', async () => { await sb.auth.signOut(); window.location.href = '../users/login.html'; });

// ── STATE ─────────────────────────────────────────────────
let currentUser   = null;
let activeGameId  = null;
let saveTimer     = null;
let currentEntry  = null; // loaded diary entry for today

function localToday() { return new Date().toLocaleDateString('en-CA'); }

function formatTodayLong() {
  return new Date().toLocaleDateString('en-US', {
    weekday:'long', month:'long', day:'numeric', year:'numeric'
  });
}

// ── SPINE RINGS ───────────────────────────────────────────
function buildSpineRings() {
  const spine = document.getElementById('spine-rings');
  for (let i = 0; i < 12; i++) {
    const ring = document.createElement('div');
    ring.className = 'spine-ring';
    spine.appendChild(ring);
  }
}

// ── GAME SELECTOR ─────────────────────────────────────────
async function loadGames() {
  const sel = document.getElementById('game-selector');
  const { data } = await sb.from('games')
    .select('id, map_name, map_type')
    .eq('user_id', currentUser.id)
    .eq('status', 'active')
    .order('updated_at', { ascending: false });

  if (!data?.length) {
    sel.innerHTML = '<option value="">no maps yet</option>';
    return;
  }
  sel.innerHTML = '';
  data.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g.id;
    opt.textContent = (g.map_name || 'untitled') + ' (' + (g.map_type||'spiral') + ')';
    sel.appendChild(opt);
  });

  // Auto-select from URL param or first game
  const params = new URLSearchParams(window.location.search);
  const urlId  = params.get('game_id');
  if (urlId && data.find(g => g.id === urlId)) {
    sel.value = urlId;
    activeGameId = urlId;
  } else {
    activeGameId = data[0].id;
    sel.value    = activeGameId;
  }
  await loadEntry();
}

function onGameChange() {
  activeGameId = document.getElementById('game-selector').value;
  loadEntry();
}

// ── LOAD TODAY'S ENTRY ────────────────────────────────────
async function loadEntry() {
  if (!activeGameId || !currentUser) return;
  const area = document.getElementById('diary-area');
  area.value = '';
  showStatus('loading...', '#aaa');

  const { data } = await sb.from('diary_entries')
    .select('id, diary_text')
    .eq('game_id', activeGameId)
    .eq('user_id', currentUser.id)
    .eq('entry_date', localToday())
    .maybeSingle();

  currentEntry = data;
  area.value = data?.diary_text || '';
  showStatus(data ? 'entry loaded ✓' : '', '#aaa');
  setTimeout(() => showStatus('', ''), 1500);
  area.focus();
}

// ── AUTO-SAVE removed — now manual via save button ────────

async function saveEntry() {
  if (!currentUser || !activeGameId) return;
  const text = document.getElementById('diary-area').value.trim();
  const btn  = document.querySelector('.save-btn');
  if (btn) { btn.textContent = 'saving...'; btn.disabled = true; }

  const { error } = await sb.from('diary_entries').upsert({
    game_id:    activeGameId,
    user_id:    currentUser.id,
    entry_date: localToday(),
    diary_text: text,
    updated_at: new Date().toISOString(),
  }, { onConflict: 'game_id,entry_date' });

  if (btn) { btn.disabled = false; btn.textContent = 'save'; }

  if (error) {
    showStatus('save failed', '#E8478B');
  } else {
    showStatus('saved', '#6ab86a');
    setTimeout(() => showStatus('', ''), 2000);
  }
}

function showStatus(msg, color) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.style.color = color || '#6579e2';
}

// ── HEART CHARACTER ───────────────────────────────────────
function initHeart() {
  const heart = document.getElementById('char-heart');
  heart.addEventListener('mouseenter', () => heart.classList.add('active'));
  heart.addEventListener('mouseleave', () => heart.classList.remove('active'));
}

// ── INIT ─────────────────────────────────────────────────
async function init() {
  buildSpineRings();
  document.getElementById('notebook-date').textContent = formatTodayLong();
  initHeart();

  try {
    const { data: { session } } = await sb.auth.getSession();
    currentUser = session?.user || null;
  } catch(e) {}

  if (!currentUser) {
    document.getElementById('locked-overlay').classList.add('show');
    document.getElementById('diary-area').disabled = true;
    return;
  }

  // Show controls above notebook
  document.getElementById('journal-controls').style.display = 'flex';

  await loadGames();
}

init();
</script>
</body>
</html>
