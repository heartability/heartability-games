<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trail Notes — Heartability</title>
<style>
@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --font-hand: "ZoesHandwriting", cursive;
  --blue: #6579e2;
  --aqua: #83d2e6;
  --cream: #f5f0ea;
  --cream-dark: #e8e3da;
  --brown: #5a4a2a;
}
html, body {
  width:100%; height:100dvh;
  background: var(--cream-dark);
  font-family: var(--font-hand);
  overflow: hidden;
  user-select: none;
}

/* ── NOTEPAD CANVAS ── */
.notepad-wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}
.notepad-inner {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 900px;
}
.notepad-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
  pointer-events: none;
}

/* ── DATE HEADER ── */
.note-date {
  position: absolute;
  top: 7%;
  left: 10%;
  right: 10%;
  text-align: center;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.4vw, 16px);
  color: #8a7a5a;
  pointer-events: none;
}

/* ── TEXT AREA ── */
.note-textarea {
  position: absolute;
  top: 15%;
  left: 8%;
  right: 8%;
  bottom: 14%;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: var(--font-hand);
  font-size: clamp(14px, 1.6vw, 19px);
  color: var(--brown);
  line-height: 2.1;
  caret-color: var(--blue);
  user-select: text;
  overflow-y: auto;
}
.note-textarea::placeholder {
  color: rgba(138,122,90,.35);
  font-style: italic;
}

/* ── BOTTOM CONTROLS ── */
.note-controls {
  position: absolute;
  bottom: 3%;
  left: 6%;
  right: 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* Nav arrows */
.nav-arrow {
  background: none;
  border: none;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.4vw, 16px);
  color: var(--blue);
  cursor: pointer;
  padding: 4px 8px;
  opacity: 0.7;
  transition: opacity 0.15s;
}
.nav-arrow:hover { opacity: 1; }
.nav-arrow:disabled { opacity: 0.2; cursor: default; }

/* Entry label */
.note-entry-label {
  font-family: var(--font-hand);
  font-size: clamp(10px, 1vw, 12px);
  color: #aaa;
  white-space: nowrap;
}

/* Save button */
.note-save-btn {
  padding: 6px 18px;
  background: var(--blue);
  border: 2px solid #4a5bc4;
  box-shadow: 2px 2px 0 #3a4aaa;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.3vw, 15px);
  color: #fff;
  cursor: pointer;
  transition: all 0.05s;
  white-space: nowrap;
}
.note-save-btn:hover { background: #4a5bc4; }
.note-save-btn:active { box-shadow: none; transform: translate(2px,2px); }
.note-save-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ── IMAGE UPLOAD ── */
.img-upload-btn {
  position: absolute;
  bottom: 10%;
  right: 2%;
  width: clamp(36px, 4vw, 52px);
  height: clamp(36px, 4vw, 52px);
  background: rgba(240,236,228,0.9);
  border: 1.5px solid #c8b88a;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  border-radius: 2px;
}
.img-upload-btn:hover { background: rgba(220,210,195,0.95); }
.img-upload-btn svg { width: 20px; height: 20px; opacity: 0.6; }
#img-file-input { display: none; }

/* ── UPLOADED IMAGE PREVIEW ── */
.uploaded-img-wrap {
  position: absolute;
  bottom: 15%;
  right: 7%;
  width: clamp(80px, 12vw, 140px);
  display: none;
}
.uploaded-img-wrap.has-img { display: block; }
.uploaded-img-preview {
  width: 100%;
  border: 2px solid #c8b88a;
  display: block;
  object-fit: cover;
}
.uploaded-img-remove {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 18px;
  height: 18px;
  background: #fff;
  border: 1.5px solid #ccc;
  border-radius: 50%;
  cursor: pointer;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888;
  line-height: 1;
}

/* ── STATUS ── */
.note-status {
  position: absolute;
  top: 3%;
  right: 6%;
  font-family: var(--font-hand);
  font-size: clamp(10px, 1vw, 12px);
  color: #6ab86a;
  opacity: 0;
  transition: opacity 0.3s;
}
.note-status.visible { opacity: 1; }
</style>
</head>
<body>

<div class="notepad-wrap">
  <div class="notepad-inner">
    <img class="notepad-bg" src="../assets/elements/open-journal.png" alt="notepad">

    <div class="note-status" id="note-status"></div>
    <div class="note-date" id="note-date"></div>

    <textarea class="note-textarea" id="note-textarea"
      placeholder="anything you want to put on the record about today..."
      maxlength="4000"></textarea>

    <!-- Image upload button -->
    <div class="img-upload-btn" onclick="document.getElementById('img-file-input').click()" title="add a photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5a4a2a" stroke-width="1.8" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
    </div>
    <input type="file" id="img-file-input" accept="image/*">

    <div class="uploaded-img-wrap" id="img-preview-wrap">
      <img class="uploaded-img-preview" id="img-preview" src="" alt="uploaded">
      <div class="uploaded-img-remove" onclick="removeImage()">✕</div>
    </div>

    <div class="note-controls">
      <button class="nav-arrow" id="btn-prev" onclick="goEntry(-1)" disabled>← prev</button>
      <span class="note-entry-label" id="entry-label"></span>
      <button class="nav-arrow" id="btn-next" onclick="goEntry(1)" disabled>next →</button>
      <button class="note-save-btn" id="btn-save" onclick="saveEntry()">save notes →</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

const params   = new URLSearchParams(window.location.search);
const GAME_ID  = params.get('game_id');
const PHASE    = params.get('phase');
const TODAY    = new Date().toLocaleDateString('en-CA');

let currentUser  = null;
let entries      = [];  // sorted newest first
let entryIndex   = 0;   // 0 = today (newest)
let pendingImage = null; // { file, base64 }
let isViewingOld = false;

// ── Init ──────────────────────────────────────────────────
async function init() {
  // Set date display
  document.getElementById('note-date').textContent =
    new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });

  try {
    const { data: { session } } = await sb.auth.getSession();
    currentUser = session?.user || null;
  } catch(e) {}

  await loadEntries();

  // Signal ready to parent
  try { window.parent.postMessage({ type: 'iframe_ready', game: 'journal' }, '*'); } catch(e) {}
}

// ── Load past entries ─────────────────────────────────────
async function loadEntries() {
  if (!currentUser || !GAME_ID) {
    updateNav();
    return;
  }
  try {
    const { data } = await sb.from('diary_entries')
      .select('*')
      .eq('game_id', GAME_ID)
      .eq('user_id', currentUser.id)
      .order('entry_date', { ascending: false })
      .limit(30);
    entries = data || [];
  } catch(e) {}

  // Check if today already has an entry
  const todayEntry = entries.find(e => e.entry_date === TODAY);
  if (todayEntry) {
    document.getElementById('note-textarea').value = todayEntry.diary_text || '';
  }
  entryIndex = 0;
  updateNav();
}

// ── Navigate entries ──────────────────────────────────────
function goEntry(dir) {
  const newIdx = entryIndex + dir;
  if (newIdx < 0 || newIdx >= entries.length) return;
  entryIndex = newIdx;
  const entry = entries[entryIndex];
  document.getElementById('note-textarea').value = entry.diary_text || '';
  const d = new Date(entry.entry_date + 'T12:00:00');
  document.getElementById('note-date').textContent =
    d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  isViewingOld = entry.entry_date !== TODAY;
  document.getElementById('btn-save').style.opacity = isViewingOld ? '0.3' : '1';
  document.getElementById('btn-save').disabled = isViewingOld;
  updateNav();
}

function updateNav() {
  const prev = document.getElementById('btn-prev');
  const next = document.getElementById('btn-next');
  const label = document.getElementById('entry-label');
  prev.disabled = entryIndex >= entries.length - 1;
  next.disabled = entryIndex <= 0;
  if (entries.length > 1) {
    label.textContent = `${entryIndex + 1} of ${entries.length}`;
  } else {
    label.textContent = '';
  }
}

// ── Image handling ────────────────────────────────────────
document.getElementById('img-file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    pendingImage = { file, base64: ev.target.result };
    document.getElementById('img-preview').src = ev.target.result;
    document.getElementById('img-preview-wrap').classList.add('has-img');
  };
  reader.readAsDataURL(file);
});

function removeImage() {
  pendingImage = null;
  document.getElementById('img-preview').src = '';
  document.getElementById('img-preview-wrap').classList.remove('has-img');
  document.getElementById('img-file-input').value = '';
}

// ── Save ──────────────────────────────────────────────────
async function saveEntry() {
  if (isViewingOld) return;
  const text = document.getElementById('note-textarea').value.trim();
  const btn  = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'saving...';

  let imageUrl = null;

  // Upload image if one is attached
  if (pendingImage && currentUser) {
    try {
      const ext  = pendingImage.file.name.split('.').pop();
      const path = `${currentUser.id}/${GAME_ID}/${TODAY}.${ext}`;
      const { error: upErr } = await sb.storage
        .from('trail-notes-images')
        .upload(path, pendingImage.file, { upsert: true });
      if (!upErr) {
        const { data: urlData } = sb.storage.from('trail-notes-images').getPublicUrl(path);
        imageUrl = urlData?.publicUrl || null;
      }
    } catch(e) {}
  }

  if (currentUser && GAME_ID) {
    const payload = {
      game_id:    GAME_ID,
      user_id:    currentUser.id,
      entry_date: TODAY,
      diary_text: text,
      updated_at: new Date().toISOString(),
    };
    if (imageUrl) payload.image_url = imageUrl;
    await sb.from('diary_entries').upsert(payload, { onConflict: 'game_id,entry_date' });
  }

  showStatus('saved ✓');
  btn.disabled = false; btn.textContent = 'save notes →';

  // Tell parent we're done
  try { window.parent.postMessage({ type: 'journal_saved' }, '*'); } catch(e) {}
}

function showStatus(msg) {
  const el = document.getElementById('note-status');
  el.textContent = msg;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 2500);
}

// ── Listen for parent requests ────────────────────────────
window.addEventListener('message', e => {
  if (e.data?.type === 'request_save') saveEntry();
});

init();
</script>
</body>
</html>
