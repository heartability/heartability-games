<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trail Notes — Heartability</title>
<style>
@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --font-hand: "ZoesHandwriting", cursive;
  --blue: #6579e2;
  --aqua: #83d2e6;
  --mint: #c9fff5;
  --cream: #f5f0ea;
  --cream-dark: #e8e3da;
  --brown: #5a4a2a;
  --line-col: #111;
}
html, body {
  width:100%; height:100dvh;
  background: var(--cream-dark);
  font-family: var(--font-hand);
  overflow: hidden;
  user-select: none;
}

/* ── NAV ── */
.room-nav {
  position: fixed; top:0; left:0; right:0; height:44px;
  background: var(--mint); border-bottom: 2px solid var(--line-col);
  z-index: 200; display:flex; align-items:center; justify-content:space-between;
  padding: 0 clamp(12px,2vw,28px);
  font-family: var(--font-hand); font-size: clamp(14px,1.6vw,20px); color:#111;
}
.nav-title {
  position:absolute; left:50%; transform:translateX(-50%);
  pointer-events:none; white-space:nowrap;
}
.nav-btn { cursor:pointer; padding:4px 8px; border-radius:2px; transition:background 0.15s; }
.nav-btn:hover { background:rgba(0,0,0,0.08); }
.gear-wrap { position:relative; }
.gear-btn { width:30px; height:30px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:3px; transition:background 0.15s; padding:3px; }
.gear-btn:hover { background:rgba(0,0,0,0.08); }
.gear-btn img { width:22px; height:22px; display:block; }
.gear-dropdown { position:absolute; top:calc(100% + 4px); left:0; min-width:170px; background:var(--mint); border:2px solid var(--line-col); box-shadow:3px 4px 0 rgba(0,0,0,0.12); z-index:201; display:none; flex-direction:column; overflow:hidden; }
.gear-dropdown.open { display:flex; }
.gear-item { font-family:var(--font-hand); font-size:clamp(13px,1.3vw,16px); color:#333; padding:9px 14px; cursor:pointer; border:none; background:none; text-align:left; white-space:nowrap; transition:background 0.12s; }
.gear-item:hover { background:rgba(0,0,0,0.07); }
.gear-music {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; padding: 8px 14px; border-top: 1px solid rgba(0,0,0,0.1);
}
.music-btn {
  cursor: pointer; background: none; border: none;
  padding: 2px; opacity: 0.65; transition: opacity 0.15s;
}
.music-btn:hover { opacity: 1; }
.music-btn img { width: 18px; height: 18px; display: block; }

/* Save button in nav — matches the plain text "back" button (no pill) */
.nav-save-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  background: none;
  border: none;
  font-family: var(--font-hand);
  font-size: clamp(14px,1.6vw,20px);
  color: #111;
  transition: background 0.15s;
  white-space: nowrap;
}
.nav-save-btn:hover { background:rgba(0,0,0,0.08); }
.nav-save-btn:disabled { opacity:0.4; cursor:not-allowed; background:none; }

/* ── NOTEPAD CANVAS ── */
.notepad-wrap {
  position: fixed;
  top: 44px; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
/* The inner box is sized to the journal image's true aspect ratio (set by JS
   on load via --book-ar) and capped so it stays centered and "smaller" on the
   page. Because the box matches the image proportions, the image never distorts. */
.notepad-inner {
  position: relative;
  --book-ar: 1.06; /* fallback width/height; JS overwrites with the real PNG ratio */
  width: min(840px, 100%, calc((100dvh - 76px) * var(--book-ar)));
  aspect-ratio: var(--book-ar);
}
.notepad-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
}

/* ── DATE HEADER (right page) ── */
.note-date {
  position: absolute;
  top: 13%;
  left: 55%;
  right: 9%;
  text-align: left;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.4vw, 16px);
  color: #8a7a5a;
  pointer-events: none;
}

/* ── TEXT AREA (right page) ── */
.note-textarea {
  position: absolute;
  top: 21%;
  left: 55%;
  right: 9%;
  bottom: 9%;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.4vw, 18px);
  color: var(--brown);
  line-height: 2.0;
  caret-color: var(--blue);
  user-select: text;
  overflow-y: auto;
}
.note-textarea::placeholder {
  color: rgba(138,122,90,.35);
  font-style: italic;
}

/* ── PAST-ENTRY NAVIGATION (bottom-right of right page) ── */
.entry-nav {
  position: absolute;
  bottom: 4%;
  left: 9%;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  z-index: 5;
}
.entry-nav-btn {
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.3vw, 16px);
  color: var(--blue);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 6px;
  opacity: 0.7;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.entry-nav-btn:hover { opacity: 1; }
#btn-newer { display: none; font-size: clamp(11px, 1.2vw, 14px); }

/* ── ENTRY LABEL (bottom-left of right page) ── */
.note-entry-label {
  position: absolute;
  bottom: 4%;
  left: 55%;
  text-align: left;
  font-family: var(--font-hand);
  font-size: clamp(10px, 1vw, 12px);
  color: #aaa;
  white-space: nowrap;
  pointer-events: none;
}

/* ── PAPERCLIP PHOTO UPLOAD (left page, top) ── */
.img-upload-btn {
  position: absolute;
  top: 0.5%;
  left: 26%;
  width: clamp(30px, 5%, 56px);
  height: auto;
  background: none;
  border: none;
  cursor: pointer;
  display: block;
  z-index: 6;
}
.img-upload-btn img { width: 100%; height: auto; display: block; }
#img-file-input { display: none; }

/* Wiggle to signal the paperclip is clickable (matches art-wall items) */
@keyframes paperclip-wiggle {
  0%,100% { transform: rotate(0deg); } 20% { transform: rotate(-3deg); }
  40% { transform: rotate(3deg); } 60% { transform: rotate(-2deg); } 80% { transform: rotate(2deg); }
}
.img-upload-btn.wiggling { animation: paperclip-wiggle 0.48s ease; }

/* ── UPLOAD CAPTION (left page, under the clip) ── */
.upload-note {
  position: absolute;
  top: 16%;
  left: 13%;
  width: 30%;
  font-family: var(--font-hand);
  font-size: clamp(11px, 1.15vw, 15px);
  color: #9a8a6a;
  line-height: 1.5;
  pointer-events: none;
}

/* ── UPLOADED IMAGE PREVIEW (left page, under the clip) ── */
.uploaded-img-wrap {
  position: absolute;
  top: 44%;
  left: 13%;
  width: clamp(70px, 28%, 160px);
  display: none;
  z-index: 5;
}
.uploaded-img-wrap.has-img { display: block; }
.uploaded-img-preview {
  width: 100%;
  border: 2px solid #c8b88a;
  display: block;
  object-fit: cover;
}
.uploaded-img-remove {
  position: absolute;
  top: -8px; right: -8px;
  width: 18px; height: 18px;
  background: #fff; border: 1.5px solid #ccc; border-radius: 50%;
  cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  color: #888; line-height: 1;
}

/* ── STATUS ── */
.note-status {
  position: absolute;
  top: 2%; right: 6%;
  font-family: var(--font-hand);
  font-size: clamp(10px, 1vw, 12px);
  color: #6ab86a;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 5;
}
.note-status.visible { opacity: 1; }

/* ── MINI POPUP ── */
.mini-popup-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.25);
  display: none; align-items: center; justify-content: center; z-index: 300;
}
.mini-popup-overlay.open { display: flex; }
.mini-popup {
  background: var(--cream); border: 2px solid var(--line-col);
  box-shadow: 4px 5px 0 rgba(0,0,0,0.15);
  padding: 22px 26px; max-width: 300px; text-align: center;
  font-family: var(--font-hand); color: var(--brown);
  animation: popIn 0.25s ease;
}
.mini-popup p { font-size: clamp(14px,1.5vw,18px); margin-bottom: 16px; line-height: 1.5; }
.mini-popup button {
  font-family: var(--font-hand); font-size: clamp(13px,1.3vw,16px);
  background: var(--mint); border: 2px solid var(--line-col);
  box-shadow: 2px 2px 0 rgba(0,0,0,0.12);
  padding: 5px 18px; cursor: pointer; color: #111;
}
.mini-popup button:active { box-shadow: none; transform: translate(2px,2px); }
@keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<audio id="bg-music" loop>
  <source src="https://dn720704.ca.archive.org/0/items/HildegardVonBingenCanticlesOfEcstasy/Hildegard%20von%20Bingen%20-%20Canticles%20Of%20Ecstasy.mp3" type="audio/mpeg">
</audio>

<nav class="room-nav">
  <div class="gear-wrap" id="gear-wrap">
    <div class="gear-btn" onclick="toggleGear()">
      <img src="../assets/elements/gear icon.png" alt="menu">
    </div>
    <div class="gear-dropdown" id="gear-dropdown">
      <button class="gear-item" onclick="window.location.href='../users/profile.html'">view profile</button>
      <button class="gear-item" id="gear-logout">sign out</button>
      <div class="gear-music">
        <button class="music-btn" onclick="seekBack()"  title="back 10s"><img src="../assets/elements/go back.png" alt="back"></button>
        <button class="music-btn" id="play-pause-btn" onclick="toggleMusic()"><img src="../assets/elements/play.png" id="pp-icon" alt="play"></button>
        <button class="music-btn" onclick="seekFwd()"   title="forward 10s"><img src="../assets/elements/go forward.png" alt="forward"></button>
      </div>
    </div>
  </div>
  <span class="nav-title">trail notes</span>
  <div style="display:flex;align-items:center;gap:4px;">
    <span class="nav-btn" onclick="history.back()">← back</span>
    <button class="nav-save-btn" id="btn-save" onclick="saveEntry()">save notes →</button>
  </div>
</nav>

<div class="notepad-wrap">
  <div class="notepad-inner">
    <img class="notepad-bg" id="notepad-bg" src="../assets/elements/open-journal.png" alt="notepad">

    <div class="note-status" id="note-status"></div>
    <div class="note-date" id="note-date"></div>

    <!-- Journal entry on the RIGHT page -->
    <textarea class="note-textarea" id="note-textarea"
      placeholder="anything you want to put on the record about today..."
      maxlength="4000"></textarea>

    <span class="note-entry-label" id="entry-label"></span>

    <!-- Past-entry navigation, bottom-right of right page -->
    <div class="entry-nav">
      <button class="entry-nav-btn" id="btn-newer" onclick="goEntry(-1)">newer entry →</button>
      <button class="entry-nav-btn" id="btn-prev" onclick="onPastEntries()">← past entries</button>
    </div>

    <!-- Paperclip photo upload (left page) -->
    <div class="img-upload-btn" id="img-upload-btn" onclick="document.getElementById('img-file-input').click()" title="add a photo">
      <img src="../assets/elements/paperclip.png" alt="add a photo">
    </div>
    <input type="file" id="img-file-input" accept="image/*">

    <p class="upload-note">Upload a picture of your travels today &mdash; a park you passed through, a flower you appreciated, a matcha that hit the spot, a selfie that captures your essence. Add it to your moodboard of the day.</p>

    <div class="uploaded-img-wrap" id="img-preview-wrap">
      <img class="uploaded-img-preview" id="img-preview" src="" alt="uploaded">
      <div class="uploaded-img-remove" onclick="removeImage()">✕</div>
    </div>
  </div>
</div>

<!-- Mini popup -->
<div class="mini-popup-overlay" id="mini-popup-overlay">
  <div class="mini-popup">
    <p id="mini-popup-text"></p>
    <button onclick="closePopup()">ok</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

function toggleGear() { document.getElementById('gear-dropdown').classList.toggle('open'); }
document.addEventListener('click', e => { const w = document.getElementById('gear-wrap'); if (w && !w.contains(e.target)) document.getElementById('gear-dropdown').classList.remove('open'); });
document.getElementById('gear-logout').addEventListener('click', async () => { await sb.auth.signOut(); window.location.href = '../users/login.html'; });

const params   = new URLSearchParams(window.location.search);
const GAME_ID  = params.get('game_id');
const PHASE    = params.get('phase');
const TODAY    = new Date().toLocaleDateString('en-CA');

let currentUser  = null;
let entries      = [];  // sorted newest first
let entryIndex   = 0;   // 0 = today (newest)
let pendingImage = null; // { file, base64 }
let isViewingOld = false;

// ── Keep the book at its true proportions (no distortion) ──
const bgImg = document.getElementById('notepad-bg');
function fitBook() {
  if (bgImg.naturalWidth && bgImg.naturalHeight) {
    document.querySelector('.notepad-inner').style
      .setProperty('--book-ar', (bgImg.naturalWidth / bgImg.naturalHeight).toFixed(4));
  }
}
if (bgImg.complete) fitBook(); else bgImg.addEventListener('load', fitBook);

// ── Init ──────────────────────────────────────────────────
async function init() {
  document.getElementById('note-date').textContent =
    new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });

  try {
    const { data: { session } } = await sb.auth.getSession();
    currentUser = session?.user || null;
  } catch(e) {}

  await loadEntries();

  try { window.parent.postMessage({ type: 'iframe_ready', game: 'journal' }, '*'); } catch(e) {}
}

// ── Load past entries ─────────────────────────────────────
async function loadEntries() {
  if (!currentUser || !GAME_ID) {
    updateNav();
    return;
  }
  try {
    const { data } = await sb.from('diary_entries')
      .select('*')
      .eq('game_id', GAME_ID)
      .eq('user_id', currentUser.id)
      .order('entry_date', { ascending: false })
      .limit(30);
    entries = data || [];
  } catch(e) {}

  const todayEntry = entries.find(e => e.entry_date === TODAY);
  if (todayEntry) {
    document.getElementById('note-textarea').value = todayEntry.diary_text || '';
  }
  entryIndex = 0;
  updateNav();
}

// ── Navigate entries ──────────────────────────────────────
// dir = +1 → older (further back), dir = -1 → newer (toward today)
function goEntry(dir) {
  const newIdx = entryIndex + dir;
  if (newIdx < 0 || newIdx >= entries.length) return;
  entryIndex = newIdx;
  const entry = entries[entryIndex];
  document.getElementById('note-textarea').value = entry.diary_text || '';
  const d = new Date(entry.entry_date + 'T12:00:00');
  document.getElementById('note-date').textContent =
    d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  isViewingOld = entry.entry_date !== TODAY;
  const saveBtn = document.getElementById('btn-save');
  saveBtn.style.opacity = isViewingOld ? '0.3' : '1';
  saveBtn.disabled = isViewingOld;
  updateNav();
}

function updateNav() {
  const newerBtn = document.getElementById('btn-newer');
  const label    = document.getElementById('entry-label');
  // "past entries" is always visible; "newer" only shows when viewing an older entry
  newerBtn.style.display = entryIndex > 0 ? 'inline' : 'none';
  label.textContent = entries.length > 1 ? `${entryIndex + 1} of ${entries.length}` : '';
}

// "← past entries": flip to the next older entry, or tell the user there aren't any
function onPastEntries() {
  if (entryIndex >= entries.length - 1) {
    showPopup('you have no past journal entries.');
    return;
  }
  goEntry(1);
}

function showPopup(msg) {
  document.getElementById('mini-popup-text').textContent = msg;
  document.getElementById('mini-popup-overlay').classList.add('open');
}
function closePopup() {
  document.getElementById('mini-popup-overlay').classList.remove('open');
}

// ── Music (copied from game room) ─────────────────────────
let musicPlaying = false;
function toggleMusic() {
  const audio = document.getElementById('bg-music');
  const icon  = document.getElementById('pp-icon');
  if (musicPlaying) { audio.pause(); icon.src = '../assets/elements/play.png'; }
  else              { audio.play().catch(()=>{}); icon.src = '../assets/elements/pause.png'; }
  musicPlaying = !musicPlaying;
}
function seekBack() { const a=document.getElementById('bg-music'); a.currentTime=Math.max(0,a.currentTime-10); }
function seekFwd()  { const a=document.getElementById('bg-music'); a.currentTime=Math.min(a.duration||0,a.currentTime+10); }

// ── Paperclip wiggle on hover (signals it's clickable) ────
const clipBtn = document.getElementById('img-upload-btn');
clipBtn.addEventListener('mouseenter', () => {
  if (!clipBtn.classList.contains('wiggling')) clipBtn.classList.add('wiggling');
});
clipBtn.addEventListener('animationend', () => clipBtn.classList.remove('wiggling'));

// ── Image handling ────────────────────────────────────────
document.getElementById('img-file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    pendingImage = { file, base64: ev.target.result };
    document.getElementById('img-preview').src = ev.target.result;
    document.getElementById('img-preview-wrap').classList.add('has-img');
  };
  reader.readAsDataURL(file);
});

function removeImage() {
  pendingImage = null;
  document.getElementById('img-preview').src = '';
  document.getElementById('img-preview-wrap').classList.remove('has-img');
  document.getElementById('img-file-input').value = '';
}

// ── Save ──────────────────────────────────────────────────
async function saveEntry() {
  if (isViewingOld) return;
  const text = document.getElementById('note-textarea').value.trim();
  const btn  = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'saving...';

  let imageUrl = null;

  if (pendingImage && currentUser) {
    try {
      const ext  = pendingImage.file.name.split('.').pop();
      const path = `${currentUser.id}/${GAME_ID}/${TODAY}.${ext}`;
      const { error: upErr } = await sb.storage
        .from('trail-notes-images')
        .upload(path, pendingImage.file, { upsert: true });
      if (!upErr) {
        const { data: urlData } = sb.storage.from('trail-notes-images').getPublicUrl(path);
        imageUrl = urlData?.publicUrl || null;
      }
    } catch(e) {}
  }

  if (currentUser && GAME_ID) {
    const payload = {
      game_id:    GAME_ID,
      user_id:    currentUser.id,
      entry_date: TODAY,
      diary_text: text,
      updated_at: new Date().toISOString(),
    };
    if (imageUrl) payload.image_url = imageUrl;
    await sb.from('diary_entries').upsert(payload, { onConflict: 'game_id,entry_date' });
  }

  showStatus('saved ✓');
  btn.disabled = false; btn.textContent = 'save notes →';

  try { window.parent.postMessage({ type: 'journal_saved' }, '*'); } catch(e) {}
}

function showStatus(msg) {
  const el = document.getElementById('note-status');
  el.textContent = msg;
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 2500);
}

window.addEventListener('message', e => {
  if (e.data?.type === 'request_save') saveEntry();
});

init();
</script>
</body>
</html>
