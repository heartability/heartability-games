<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="../assets/elements/favicon.png">
  <title>Reset Password — Heartability</title>
  <meta name="description" content="Set a new password for your Heartability account.">
  <meta name="robots" content="noindex,nofollow">
  <meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
  <style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:     "ZoesHandwriting", cursive;
  --purple:        #6e83d3;
  --purple-dark:   #4a5bc4;
  --purple-shadow: #3a4aaa;
  --cream:         #dfe2ef;
  --cream-dark:    #cdd3ec;
  --line-col:      #111;
}

html, body {
  width: 100vw;
  min-height: 100dvh;
  font-family: var(--font-hand);
  user-select: none;
  background: url('../assets/elements/patio-sky.png') center / cover no-repeat fixed;
  background-color: #5b7fe0;
}

.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #6e83d3;
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(21px, 1.6vw, 25px);
  color: #fff;
}
.nav-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  color: inherit;
  text-decoration: none;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(0,0,0,0.08); }

.page-body {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 64px 16px 40px;
  z-index: 10;
}

.reset-window {
  width: min(90%, 460px);
  background: var(--cream);
  box-shadow: 0 0 0 4px var(--purple), 6px 10px 40px rgba(0,0,0,0.35);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: windowIn 0.35s ease both;
}

@keyframes windowIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.reset-titlebar {
  padding: 14px 20px;
  background: var(--cream-dark);
  border-bottom: 2px solid #ccc;
  font-size: clamp(16px, 1.6vw, 20px);
  color: #555;
  text-align: center;
}

.reset-body {
  padding: 24px 28px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field { display: flex; flex-direction: column; gap: 5px; }

label {
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.1vw, 15px);
  color: #888;
}

input[type="password"] {
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.4vw, 18px);
  color: #222;
  background: var(--cream);
  border: 1.5px solid #bbb;
  padding: 8px 12px;
  outline: none;
  transition: border-color 0.2s;
  user-select: text;
}
input:focus { border-color: var(--purple); }

.btn-submit {
  padding: 10px 18px;
  background: var(--purple);
  border: 2px solid var(--purple-dark);
  box-shadow: 2px 2px 0 var(--purple-shadow);
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.4vw, 18px);
  color: #fff;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.05s;
  margin-top: 4px;
}
.btn-submit:hover  { background: var(--purple-dark); }
.btn-submit:active { box-shadow: none; transform: translate(2px,2px); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.msg {
  font-size: clamp(13px, 1.1vw, 15px);
  padding: 8px 12px;
  font-family: var(--font-hand);
  display: none;
}
.msg.error   { display: block; color: #c0392b; background: rgba(192,57,43,0.08); border: 1px solid rgba(192,57,43,0.2); }
.msg.success { display: block; color: #2d7a4f; background: rgba(45,122,79,0.08); border: 1px solid rgba(45,122,79,0.2); }

  </style>
</head>
<body>

<nav class="room-nav">
  <a class="nav-btn" href="login.html">back</a>
  <h1 class="nav-title" style="margin:0; font:inherit; position:static; display:inline;">reset password</h1>
  <a class="nav-btn" href="../index.html">home</a>
</nav>

<div class="page-body">
  <div class="reset-window">
    <div class="reset-titlebar" id="reset-titlebar">set a new password</div>
    <div class="reset-body">

      <form id="form-reset" onsubmit="handleReset(event)">
        <div class="field">
          <label>new password</label>
          <input type="password" id="reset-password" placeholder="at least 6 characters" required minlength="6" />
        </div>
        <div class="field">
          <label>confirm password</label>
          <input type="password" id="reset-password-confirm" placeholder="••••••••" required minlength="6" />
        </div>
        <div class="msg" id="reset-msg"></div>
        <button type="submit" class="btn-submit" id="reset-btn">save new password</button>
      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-init.js"></script>
<script>
  let recoveryReady = false;

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  // Supabase parses the recovery token from the URL fragment on load and
  // fires PASSWORD_RECOVERY. Don't await Supabase calls in here directly
  // (known supabase-js deadlock risk) — just flip a flag.
  sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
    }
  });

  setTimeout(() => {
    if (!recoveryReady) {
      document.getElementById('reset-titlebar').textContent = 'link expired';
      document.getElementById('form-reset').style.display = 'none';
      showMsg('reset-msg', 'this reset link is invalid or has expired. request a new one from the login page.', 'error');
    }
  }, 2500);

  async function handleReset(e) {
    e.preventDefault();
    const pass = document.getElementById('reset-password').value;
    const confirm = document.getElementById('reset-password-confirm').value;
    if (pass !== confirm) {
      showMsg('reset-msg', 'passwords do not match.', 'error');
      return;
    }
    const btn = document.getElementById('reset-btn');
    btn.disabled = true; btn.textContent = 'saving...';
    const { error } = await sb.auth.updateUser({ password: pass });
    if (error) {
      showMsg('reset-msg', error.message, 'error');
      btn.disabled = false; btn.textContent = 'save new password';
    } else {
      showMsg('reset-msg', 'password updated! taking you to your bedroom...', 'success');
      setTimeout(() => window.location.href = '../rooms/bed.html', 1200);
    }
  }
</script>

</body>
</html>
