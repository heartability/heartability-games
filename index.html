<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/elements/favicon.png">
<link rel="stylesheet" href="assets/css/modal.css">
<script src="assets/js/modal.js" defer></script>

<meta name="description" content="Heartability is an virtual world that turns your mind into an open world video game that helps you bring your dreams to life with daily rituals help you track your patterns, build hope, and rediscover optimism.">

<!-- Open Graph / Social sharing -->
<meta property="og:title" content="Heartability">
<meta property="og:description" content="Browser-based wellness games">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
<meta property="og:url" content="https://heartability-games.vercel.app">
<meta property="og:type" content="website">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">

<title>Heartability</title>
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelScript";
  src: url("assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}
@font-face {
  font-family: "Mazzy";
  src: url("assets/fonts/mazzy-TM.otf") format("opentype");
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
}

body {
  font-family: "ZoesHandwriting", cursive;
  overflow: scroll;
  position: relative;
  user-select: none;
}

/* Fixed bg div (added via JS) fills the true visual viewport on iOS */
.bg {
  position: fixed;
  inset: 0;
  background: #cfe8ff;
  overflow: hidden;
  z-index: 0;
}

.bg video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

/* ── CASTLE — centered, clickable ── */
.castle-link {
  position: fixed;
  bottom: 25%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  cursor: pointer;
  text-decoration: none;
  display: block;
  -webkit-tap-highlight-color: transparent;
}
.castle-img {
  display: block;
  width: clamp(340px, 62vw, 1150px);
  height: auto;
  opacity: 0;
}

/* ── HEART CHARACTER ── */
.heart-guide-wrap {
  position: fixed;
  bottom: 6vh;
  left: 4vw;
  z-index: 6;
  cursor: pointer;
  pointer-events: all;
  text-decoration: none;
  display: inline-block; /* needed so absolute child anchors correctly */
}
.heart-guide-img {
  width: clamp(80px, 12vw, 180px);
  height: auto;
  display: block;
  animation: heartFloat 4s ease-in-out infinite;
}
@keyframes heartFloat {
  0%,100% { transform: translateY(0px) rotate(-2deg); }
  50%      { transform: translateY(-10px) rotate(2deg); }
}

/* ── SPEECH BUBBLE — absolutely positioned relative to heart wrap ── */
.heart-bubble-wrap {
  position: absolute;
  left: calc(100% - 10px);
  top: calc(50% - 40px);
  z-index: 7;
  text-decoration: none;
}
.heart-bubble-wrap .speech-bubble {
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 14px 24px;
  font-family: "ZoesHandwriting", cursive;
  font-size: clamp(12px, 1.4vw, 18px);
  color: #000;
  text-align: center;
  line-height: 1.4;
  min-width: 180px;
  max-width: clamp(200px, 20vw, 300px);
  white-space: nowrap;
}

/* ── COPYRIGHT ── */
.copyright {
  position: fixed;
  bottom: 14px;
  right: 20px;
  font-family: "PFPixelScript", monospace;
  font-size: 9px;
  color: rgba(255,255,255,0.32);
  letter-spacing: 1px;
  z-index: 10;
}
.copyright a { color: inherit; text-decoration: none; }
.copyright a:hover { color: rgba(255,255,255,0.72); }

/* ── ARRIVAL SELECTION OVERLAY ── */
.arrival-overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(4, 6, 18, 0.62);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: clamp(90px, 16vh, 200px);
  cursor: pointer;
  opacity: 1;
  transition: opacity 0.45s ease;
}
.arrival-overlay.closed {
  opacity: 0;
  pointer-events: none;
}

.arrival-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(28px, 6vh, 64px);
  cursor: default;
  padding: 24px;
  width: min(92vw, 720px);
}

.arrival-heading {
  font-family: "Mazzy", cursive;
  font-weight: normal;
  color: #fff;
  font-size: clamp(28px, 4.5vw, 56px);
  text-align: center;
  text-shadow: 0 0 24px rgba(150, 190, 255, 0.55);
}

.arrival-options {
  display: flex;
  gap: clamp(28px, 7vw, 100px);
  align-items: flex-end;
  flex-wrap: wrap;
  justify-content: center;
}

.arrival-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.2s ease;
}
.arrival-option:hover,
.arrival-option:focus-visible { transform: translateY(-6px); }

.arrival-icon {
  height: clamp(182px, 20.6vw, 340px);
  width: auto;
  filter: drop-shadow(0 0 14px rgba(180, 210, 255, 0.55));
}

.arrival-label {
  font-family: "Mazzy", cursive;
  color: #fff;
  font-size: clamp(22px, 2.6vw, 34px);
  text-align: center;
}

.arrival-learn-more {
  align-self: flex-end;
  font-family: "Mazzy", cursive;
  color: #fff;
  opacity: 0.8;
  font-size: clamp(16px, 1.8vw, 22px);
  text-decoration: none;
}
.arrival-learn-more:hover,
.arrival-learn-more:focus-visible { opacity: 1; }

/* ── SCREEN READER ONLY ── */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
}

/* ══════════════════════════════════════════════════
   MOBILE
══════════════════════════════════════════════════ */
@media (max-width: 768px) {

  .bg {
    background-image: url("assets/elements/home-sky-m.png");
    background-position: center top;
  }

  .castle-img {
    width: clamp(240px, 88vw, 520px);
  }

  .heart-guide-wrap {
    bottom: 2vh;
    left: 4vw;
  }
  .heart-guide-img { width: clamp(60px, 20vw, 120px); }

  .heart-bubble-wrap {
    display: none;
  }
  .heart-bubble-wrap.visible { display: block; }
  .heart-bubble-wrap .speech-bubble {
    font-size: clamp(14px, 3.5vw, 21px);
    min-width: 140px;
    max-width: 50vw;
    white-space: normal;
  }

  .copyright { font-size: 6px; }

  .arrival-overlay {
    padding-top: clamp(60px, 11vh, 110px);
  }
  .arrival-panel {
    gap: clamp(24px, 5vh, 40px);
  }
  .arrival-heading {
    font-size: clamp(24px, 6.5vw, 34px);
  }
  .arrival-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "castle library"
      "matrix matrix";
    row-gap: clamp(24px, 5vh, 40px);
    column-gap: 14px;
    align-items: start;
    width: 100%;
  }
  .arrival-castle { grid-area: castle; }
  .arrival-library { grid-area: library; }
  .arrival-matrix { grid-area: matrix; }
  .arrival-icon { height: clamp(110px, 26vh, 170px); width: auto; }
  .arrival-label { font-size: clamp(17px, 4.5vw, 22px); }
}

/* ══════════════════════════════════════════════════
   REDUCED MOTION
══════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  .heart-guide-img { animation: none; }
}

</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <script>
    (function () {
      var isMobile = window.matchMedia('(max-width: 768px)').matches;
      if (isMobile) {
        document.write(
          '<video autoplay loop muted playsinline>' +
          '<source src="assets/elements/homepage-m.webm" type="video/webm">' +
          '<source src="assets/elements/homepage-m.mp4" type="video/mp4">' +
          '</video>'
        );
      } else {
        document.write(
          '<video autoplay loop muted playsinline>' +
          '<source src="assets/elements/homepage.webm" type="video/webm">' +
          '<source src="assets/elements/homepage.mp4" type="video/mp4">' +
          '</video>'
        );
      }
    }());
  </script>
</div>
<h1 class="sr-only">Heartability</h1>

<!-- Arrival selection overlay: shown on load, dismissed by clicking off a button -->
<div class="arrival-overlay closed" id="arrivalOverlay">
  <div class="arrival-panel">
    <h2 class="arrival-heading">where do you want to go?</h2>
    <div class="arrival-options">
      <a class="arrival-option arrival-castle" href="rooms/game-room.html">
        <img class="arrival-icon" src="assets/elements/home-gate.png" alt="Explore the castle">
        <span class="arrival-label">explore the castle</span>
      </a>
      <a class="arrival-option arrival-matrix" href="matrix/dream.html">
        <img class="arrival-icon" src="assets/elements/home-matrix.png" alt="Enter the matrix">
        <span class="arrival-label">enter the matrix</span>
      </a>
      <a class="arrival-option arrival-library" href="rooms/library.html">
        <img class="arrival-icon" src="assets/elements/home-shelf.png" alt="Visit the library">
        <span class="arrival-label">visit the library</span>
      </a>
    </div>
    <a class="arrival-learn-more" href="about.html">learn more</a>
  </div>
</div>

<picture>
  <source media="(max-width: 768px)" srcset="assets/elements/explore-dreams-m.png">
  <img class="dreams-banner"
       src="assets/elements/explore-dreams.png"
       alt="">
</picture>

<!-- Castle: centered, anchored to bottom -->
<a class="castle-link" href="rooms/game-room.html" aria-label="Enter Heartability">
  <img class="castle-img"
       src="assets/elements/castle.png"
       alt="Castle — click to enter">
</a>

<!-- Heart guide — bottom left, links to about page -->
<div class="heart-guide-wrap" id="heartGuideWrap">
  <a href="about.html" aria-label="About us">
    <img class="heart-guide-img"
         src="assets/elements/guides/heart.png"
         alt="Heart guide character">
  </a>
  <!-- Speech bubble sits to the right, also links to about -->
  <a class="heart-bubble-wrap" id="heartBubbleWrap" href="about.html">
    <div class="speech-bubble">Hey! What are you doing here?</div>
  </a>
</div>

<p class="copyright">©&nbsp;<a href="https://untolduntilmedia.com" target="_blank" rel="noopener">untold until media</a></p>

<script>
(function () {
  var overlay = document.getElementById('arrivalOverlay');
  var castleLink = document.querySelector('.castle-link');
  if (!overlay) return;

  if (castleLink) {
    castleLink.addEventListener('click', function (e) {
      if (!overlay.classList.contains('closed')) return;
      e.preventDefault();
      overlay.classList.remove('closed');
    });
  }

  overlay.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    overlay.classList.add('closed');
  });
}());

(function () {
  if (window.innerWidth > 768) return;

  /* Mobile: first tap on heart shows bubble; bubble itself navigates directly */
  const heartGuide = document.getElementById('heartGuideWrap');
  const bubbleWrap = document.getElementById('heartBubbleWrap');

  heartGuide.querySelector('a').addEventListener('click', (e) => {
    if (!bubbleWrap.classList.contains('visible')) {
      e.preventDefault();
      bubbleWrap.classList.add('visible');
    }
  });

  document.addEventListener('click', (e) => {
    if (!heartGuide.contains(e.target)) {
      bubbleWrap.classList.remove('visible');
    }
  });
}());
</script>
</body>
</html>
