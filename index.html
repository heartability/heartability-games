<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Open Graph / Social sharing -->
<meta property="og:title" content="Heartability">
<meta property="og:description" content="Browser-based wellness games">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview.png">
<meta property="og:url" content="https://heartability-games.vercel.app">
<meta property="og:type" content="website">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://heartability-games.vercel.app/assets/social-preview.png">

<title>Heartability</title>
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelScript";
  src: url("assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

/* ══════════════════════════════════════════════════
   TUNABLE KNOBS — adjust these, nothing else needed
══════════════════════════════════════════════════ */
:root {
  /* Where the castle's BUILDING MASS sits, as % down its own image.
     This is the shared optical center for the logo<->castle swap.
     Higher % = castle sits lower (more spire above center).
     Lower  % = castle sits higher. */
  --castle-anchor: 64%;

  --toggle-loop: 13s;   /* full logo->castle->logo cycle */
  --shimmer-loop: 9s;   /* iridescent sheen sweep */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  /* Gradient sky image; current blue kept as fallback underneath */
  background: #6578e2 url("assets/elements/sky.png") center / cover no-repeat;
  font-family: "ZoesHandwriting", cursive;
  overflow: hidden;
  position: relative;
  user-select: none;
}

/* ── SCENE ── */
.scene {
  position: relative;
  width: 100vw;
  height: 100vh;
  z-index: 1;
}

/* ── CORNER SPIRALS ──────────────────────────────────
   Wrapper handles position + mouse parallax (JS sets transform).
   Inner img handles a slow continuous float.
   Positions are rough — nudge top/left/right/bottom to taste.
─────────────────────────────────────────────────── */
.spiral {
  position: absolute;
  z-index: 1;
  pointer-events: none;
  will-change: transform;
  transition: transform 0.6s ease-out;   /* eases the parallax follow */
}
.spiral img {
  display: block;
  width: 100%;
  height: auto;
  opacity: 0.85;
}
.spiral-1 { top: 12vh; left: 4vw;  width: clamp(70px, 9vw, 130px); }
.spiral-2 { top: 27vh; left: 14vw; width: clamp(45px, 6vw, 85px); }
.spiral-3 { bottom: 8vh; right: 5vw; width: clamp(80px, 10vw, 150px); }

.spiral-1 img { animation: float1 15s ease-in-out infinite; }
.spiral-2 img { animation: float2 18s ease-in-out infinite; }
.spiral-3 img { animation: float3 16s ease-in-out infinite; }

@keyframes float1 {
  0%,100% { transform: translateY(0)    rotate(0deg); }
  50%      { transform: translateY(-9px) rotate(2deg); }
}
@keyframes float2 {
  0%,100% { transform: translateY(0)    rotate(0deg); }
  50%      { transform: translateY(7px)  rotate(-2deg); }
}
@keyframes float3 {
  0%,100% { transform: translateY(0)     rotate(0deg); }
  50%      { transform: translateY(-11px) rotate(2deg); }
}

/* ── TITLE TEXT IMAGES ── */
.title-heart {
  position: absolute;
  top: 8vh;
  left: 15vw;
  width: 40vw;
  height: auto;
  z-index: 4;
  pointer-events: none;
}
.title-ability {
  position: absolute;
  bottom: 8vh;
  right: 15vw;
  width: 40vw;
  height: auto;
  z-index: 4;
  pointer-events: none;
}

/* ── PORTAL ──────────────────────────────────────────
   portal-wrap     — positions the portal on the page
   portal-inner    — real-height container (rainbow defines height)
   castle-link     — fills portal-inner, whole oval is clickable
   rainbow-portal  — sits on top, pointer-events:none lets clicks through
   rainbow-shimmer — white sheen masked to the rainbow's exact shape
   castle-img / portal-logo — share ONE optical center, breathing swap
─────────────────────────────────────────────────── */
.portal-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: clamp(520px, 72vw, 900px);
  z-index: 2;
}
.portal-inner {
  position: relative;
  width: 100%;
}
.rainbow-portal {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
  position: relative;
  z-index: 2;
}

/* Iridescent sheen — shaped to the rainbow via mask-image (set in CSS +
   kept in sync with the mobile rainbow by JS). Soft-light so it only
   brightens the existing pastels; introduces no new colors. */
.rainbow-shimmer {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  mix-blend-mode: soft-light;
  background: linear-gradient(
    115deg,
    transparent 0%,
    rgba(255,255,255,0.42) 25%,
    transparent 50%,
    rgba(255,255,255,0.42) 75%,
    transparent 100%
  );
  background-size: 200% 200%;
  background-repeat: repeat;
  -webkit-mask-image: url("assets/elements/circle-rainbow.png");
          mask-image: url("assets/elements/circle-rainbow.png");
  -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
  -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
  animation: shimmerDrift var(--shimmer-loop) linear infinite;
}
@keyframes shimmerDrift {
  0%   { background-position: 0%   50%; }
  100% { background-position: 200% 50%; }   /* 2-peak gradient => seamless wrap */
}

.castle-link {
  position: absolute;
  inset: 0;
  cursor: pointer;
  text-decoration: none;
  z-index: 4;
}

.castle-img,
.portal-logo {
  position: absolute;
  top: 50%;
  left: 50%;
  display: block;
  filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35));
}

/* Logo: centered on its own middle = the shared optical center */
.portal-logo {
  width: clamp(140px, 18vw, 260px);
  height: auto;
  transform-origin: 50% 50%;
  transform: translate(-50%, -50%) scale(1);
  animation: logoBreathe var(--toggle-loop) ease-in-out infinite;
}

/* Castle: scaled + anchored on its BUILDING MASS (var --castle-anchor),
   not the spire tip, so the swap doesn't lurch upward. */
.castle-img {
  width: clamp(190px, 26vw, 330px);
  height: auto;
  transform-origin: 50% var(--castle-anchor);
  transform: translate(-50%, calc(0% - var(--castle-anchor))) scale(1);
  animation: castleBreathe var(--toggle-loop) ease-in-out infinite;
}

/* Hover the portal => freeze on the castle (the place you're about to enter) */
.castle-link:hover .castle-img  { animation: none; opacity: 1; }
.castle-link:hover .portal-logo { animation: none; opacity: 0; }

/* ── BREATHING SWAP KEYFRAMES ────────────────────────
   Wordmark recedes (shrink + fade) as castle advances (grow + fade in),
   reading as forward motion through the name into the castle.
─────────────────────────────────────────────────── */
@keyframes logoBreathe {
  0%   { opacity: 1; transform: translate(-50%, -50%) scale(1);    }
  27%  { opacity: 1; transform: translate(-50%, -50%) scale(1);    }
  42%  { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }  /* recede */
  77%  { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
  92%  { opacity: 1; transform: translate(-50%, -50%) scale(1);    }  /* advance back */
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1);    }
}
@keyframes castleBreathe {
  0%   { opacity: 0; transform: translate(-50%, calc(0% - var(--castle-anchor))) scale(0.91); }
  27%  { opacity: 0; transform: translate(-50%, calc(0% - var(--castle-anchor))) scale(0.91); }
  42%  { opacity: 1; transform: translate(-50%, calc(0% - var(--castle-anchor))) scale(1);    }  /* advance in */
  77%  { opacity: 1; transform: translate(-50%, calc(0% - var(--castle-anchor))) scale(1);    }
  92%  { opacity: 0; transform: translate(-50%, calc(0% - var(--castle-anchor))) scale(0.92); }  /* recede */
  100% { opacity: 0; transform: translate(-50%, calc(0% - var(--castle-anchor))) scale(0.91); }
}

/* ── HEART CHARACTER ── */
.heart-guide-wrap {
  position: absolute;
  bottom: 8vh;
  left: 4vw;
  z-index: 5;
  cursor: pointer;
  pointer-events: all;
}
.heart-guide-img {
  width: 15vw;
  height: auto;
  display: block;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
  animation: heartFloat 4s ease-in-out infinite;
}
@keyframes heartFloat {
  0%,100% { transform: translateY(0px) rotate(-2deg); }
  50%      { transform: translateY(-10px) rotate(2deg); }
}

/* ── SPEECH BUBBLE ── */
.heart-bubble-wrap {
  position: absolute;
  bottom: 22vh;
  left: 19vw;
  z-index: 6;
}
.heart-bubble-wrap .speech-bubble {
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 14px 24px;
  font-family: "ZoesHandwriting", cursive;
  font-size: clamp(10px, 1.4vw, 16px);
  color: #000000;
  text-align: center;
  line-height: 1.4;
  filter: drop-shadow(1px 3px 5px rgba(0,0,0,.2));
  min-width: 180px;
  max-width: clamp(200px, 20vw, 300px);
}

/* ── COPYRIGHT ── */
.copyright {
  position: fixed;
  bottom: 14px;
  right: 20px;
  font-family: "PFPixelScript", monospace;
  font-size: 8px;
  color: rgba(255,255,255,0.32);
  letter-spacing: 1px;
  z-index: 10;
}
.copyright a { color: inherit; text-decoration: none; }
.copyright a:hover { color: rgba(255,255,255,0.72); }

/* ── SCREEN READER ONLY ── */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
}

/* ══════════════════════════════════════════════════
   MOBILE
   Adjust .portal-wrap top% to move the rainbow up/down.
   Higher % = lower on screen. Lower % = higher on screen.
══════════════════════════════════════════════════ */
@media (max-width: 768px) {

  .title-heart {
    top: 11vh;
    left: 4vw;
    width: 80vw;
  }
  .title-ability {
    top: 60vh;
    bottom: auto;
    right: 4vw;
    width: 80vw;
  }

  /* Move the whole portal up — change top% to reposition */
  .portal-wrap {
    top: 45vh;
    width: 90vw;
  }

  .castle-img  { width: clamp(120px, 34vw, 210px); }
  .portal-logo { width: clamp(90px, 26vw, 200px); }

  /* spirals smaller + tucked in on phones */
  .spiral-1 { top: 6vh;  left: 3vw;  width: clamp(50px, 16vw, 90px); }
  .spiral-2 { top: 17vh; left: 12vw; width: clamp(34px, 11vw, 60px); }
  .spiral-3 { bottom: 4vh; right: 4vw; width: clamp(56px, 18vw, 100px); }

  .heart-guide-wrap {
    bottom: 2vh;
    left: 6vw;
  }
  .heart-guide-img { width: 25vw; }

  /* Speech bubble hidden by default, shown on heart tap */
  .heart-bubble-wrap {
    display: none;
    bottom: 10vh;
    left: 25vw;
  }
  .heart-bubble-wrap.visible { display: block; }
  .heart-bubble-wrap .speech-bubble {
    font-size: clamp(12px, 3.5vw, 18px);
    min-width: 140px;
    max-width: 45vw;
  }

  .copyright { font-size: 5px; }

}

/* ══════════════════════════════════════════════════
   REDUCED MOTION — static fallback
   Freeze every loop, show the wordmark, hide the castle,
   turn off the shimmer. (Hover-to-reveal-castle still works.)
══════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  .portal-logo,
  .castle-img,
  .heart-guide-img,
  .spiral img,
  .rainbow-shimmer { animation: none !important; }

  .portal-logo { opacity: 1; }
  .castle-img  { opacity: 0; }
  .rainbow-shimmer { opacity: 0; }
  .spiral { transition: none; }
}

</style>
</head>
<body>

<h1 class="sr-only">Heartability</h1>

<div class="scene">

  <!-- Corner spirals (rough placement — adjust freely) -->
  <div class="spiral spiral-1" data-depth="1.0">
    <img src="assets/elements/spiral-1.png" alt="" aria-hidden="true">
  </div>
  <div class="spiral spiral-2" data-depth="0.6">
    <img src="assets/elements/spiral-2.png" alt="" aria-hidden="true">
  </div>
  <div class="spiral spiral-3" data-depth="1.3">
    <img src="assets/elements/spiral-3.png" alt="" aria-hidden="true">
  </div>

  <!-- "stop spiraling" — top left -->
  <img class="title-heart"
       src="assets/elements/spiraling.png"
       alt="" aria-hidden="true">

  <!-- "start dreaming" — bottom right -->
  <img class="title-ability"
       src="assets/elements/dreaming.png"
       alt="" aria-hidden="true">

  <!-- Portal -->
  <div class="portal-wrap">
    <div class="portal-inner">

      <!-- Castle link sits behind rainbow, whole oval is clickable -->
      <a class="castle-link" href="../games/game-select.html" aria-label="Enter Heartability">
        <img class="portal-logo"
             src="assets/elements/logo.png"
             alt="Heartability">
        <img class="castle-img"
             src="assets/elements/castle.png"
             alt="Castle — click to enter">
      </a>

      <!-- Rainbow on top, pointer-events:none passes clicks through -->
      <img class="rainbow-portal"
           id="rainbowPortal"
           src="assets/elements/circle-rainbow.png"
           alt="" aria-hidden="true">

      <!-- Iridescent sheen, masked to the rainbow's shape -->
      <div class="rainbow-shimmer" id="rainbowShimmer" aria-hidden="true"></div>

    </div>
  </div>

  <!-- Heart guide — bottom left -->
  <div class="heart-guide-wrap" id="heartGuideWrap">
    <img class="heart-guide-img"
         src="assets/elements/guides/heart.png"
         alt="Heart guide character">
  </div>

  <!-- Speech bubble -->
  <div class="heart-bubble-wrap" id="heartBubbleWrap">
    <div class="speech-bubble">i heard there is a castle around here somewhere</div>
  </div>

</div>

<p class="copyright">©&nbsp;<a href="https://untolduntilmedia.com" target="_blank" rel="noopener">untold until media</a></p>

<script>
(function () {

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── Swap rainbow image + shimmer mask for mobile ── */
  function swapRainbow() {
    const img = document.getElementById('rainbowPortal');
    const shimmer = document.getElementById('rainbowShimmer');
    if (!img) return;
    const src = window.innerWidth <= 768
      ? 'assets/elements/circle-rainbow-m.png'
      : 'assets/elements/circle-rainbow.png';
    img.src = src;
    if (shimmer) {
      shimmer.style.webkitMaskImage = `url("${src}")`;
      shimmer.style.maskImage = `url("${src}")`;
    }
  }
  swapRainbow();
  window.addEventListener('resize', swapRainbow);

  /* ── Gentle corner-spiral parallax (skipped if reduced motion) ── */
  if (!reduceMotion) {
    const spirals = Array.from(document.querySelectorAll('.spiral'));
    const MAX = 10; // px of travel at depth 1.0
    window.addEventListener('mousemove', (e) => {
      const nx = (e.clientX / window.innerWidth)  * 2 - 1;  // -1..1
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      spirals.forEach((el) => {
        const depth = parseFloat(el.dataset.depth || '1');
        const x = (-nx * MAX * depth).toFixed(1);
        const y = (-ny * MAX * depth).toFixed(1);
        el.style.transform = `translate(${x}px, ${y}px)`;
      });
    });
  }

  /* ── Mobile: tap heart to toggle speech bubble ── */
  const heartGuide = document.getElementById('heartGuideWrap');
  const bubbleWrap = document.getElementById('heartBubbleWrap');

  heartGuide.addEventListener('click', () => {
    if (window.innerWidth <= 768) {
      bubbleWrap.classList.toggle('visible');
    }
  });

  /* Tap anywhere else to dismiss */
  document.addEventListener('click', (e) => {
    if (window.innerWidth <= 768 &&
        !heartGuide.contains(e.target) &&
        !bubbleWrap.contains(e.target)) {
      bubbleWrap.classList.remove('visible');
    }
  });

})();
</script>
</body>
</html>
