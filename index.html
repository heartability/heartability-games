<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/elements/favicon.png">
<link rel="stylesheet" href="assets/css/modal.css">
<script src="assets/js/modal.js" defer></script>

<meta name="description" content="Heartability is an aspirational virtual world where video-game rooms and gentle daily rituals help you track your feelings, build hope, and rediscover your optimism.">

<!-- Open Graph / Social sharing -->
<meta property="og:title" content="Heartability">
<meta property="og:description" content="Browser-based wellness games">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
<meta property="og:url" content="https://heartability-games.vercel.app">
<meta property="og:type" content="website">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">

<title>Heartability</title>
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelScript";
  src: url("assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
}

body {
  font-family: "ZoesHandwriting", cursive;
  overflow: scroll;
  position: relative;
  user-select: none;
}

/* Fixed bg div (added via JS) fills the true visual viewport on iOS */
.bg {
  position: fixed;
  inset: 0;
  background: #cfe8ff;
  overflow: hidden;
  z-index: 0;
}

.bg video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ── CASTLE — centered, clickable ── */
.castle-link {
  position: fixed;
  bottom: 25%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  cursor: pointer;
  text-decoration: none;
  display: block;
  -webkit-tap-highlight-color: transparent;
}
.castle-img {
  display: block;
  width: clamp(340px, 62vw, 1150px);
  height: auto;
  opacity: 0;
}

/* ── HEART CHARACTER ── */
.heart-guide-wrap {
  position: fixed;
  bottom: 6vh;
  left: 4vw;
  z-index: 6;
  cursor: pointer;
  pointer-events: all;
  text-decoration: none;
  display: inline-block; /* needed so absolute child anchors correctly */
}
.heart-guide-img {
  width: clamp(80px, 12vw, 180px);
  height: auto;
  display: block;
  animation: heartFloat 4s ease-in-out infinite;
}
@keyframes heartFloat {
  0%,100% { transform: translateY(0px) rotate(-2deg); }
  50%      { transform: translateY(-10px) rotate(2deg); }
}

/* ── SPEECH BUBBLE — absolutely positioned relative to heart wrap ── */
.heart-bubble-wrap {
  position: absolute;
  left: calc(100% - 10px);
  top: calc(50% - 40px);
  z-index: 7;
  text-decoration: none;
}
.heart-bubble-wrap .speech-bubble {
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 14px 24px;
  font-family: "ZoesHandwriting", cursive;
  font-size: clamp(12px, 1.4vw, 18px);
  color: #000;
  text-align: center;
  line-height: 1.4;
  min-width: 180px;
  max-width: clamp(200px, 20vw, 300px);
  white-space: nowrap;
}

/* ── COPYRIGHT ── */
.copyright {
  position: fixed;
  bottom: 14px;
  right: 20px;
  font-family: "PFPixelScript", monospace;
  font-size: 9px;
  color: rgba(255,255,255,0.32);
  letter-spacing: 1px;
  z-index: 10;
}
.copyright a { color: inherit; text-decoration: none; }
.copyright a:hover { color: rgba(255,255,255,0.72); }

/* ── SCREEN READER ONLY ── */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
}

/* ══════════════════════════════════════════════════
   MOBILE
══════════════════════════════════════════════════ */
@media (max-width: 768px) {

  .bg {
    background-image: url("assets/elements/home-sky-m.png");
    background-position: center top;
  }

  .castle-img {
    width: clamp(240px, 88vw, 520px);
  }

  .heart-guide-wrap {
    bottom: 2vh;
    left: 4vw;
  }
  .heart-guide-img { width: clamp(60px, 20vw, 120px); }

  .heart-bubble-wrap {
    display: none;
  }
  .heart-bubble-wrap.visible { display: block; }
  .heart-bubble-wrap .speech-bubble {
    font-size: clamp(14px, 3.5vw, 21px);
    min-width: 140px;
    max-width: 50vw;
    white-space: normal;
  }

  .copyright { font-size: 6px; }
}

/* ══════════════════════════════════════════════════
   REDUCED MOTION
══════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  .heart-guide-img { animation: none; }
}

</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <script>
    (function () {
      var isMobile = window.matchMedia('(max-width: 768px)').matches;
      if (isMobile) {
        document.write(
          '<video autoplay loop muted playsinline>' +
          '<source src="assets/elements/homepage-m.webm" type="video/webm">' +
          '<source src="assets/elements/homepage-m.mp4" type="video/mp4">' +
          '</video>'
        );
      } else {
        document.write(
          '<video autoplay loop muted playsinline>' +
          '<source src="assets/elements/homepage.webm" type="video/webm">' +
          '<source src="assets/elements/homepage.mp4" type="video/mp4">' +
          '</video>'
        );
      }
    }());
  </script>
</div>
<h1 class="sr-only">Heartability</h1>

<picture>
  <source media="(max-width: 768px)" srcset="assets/elements/explore-dreams-m.png">
  <img class="dreams-banner"
       src="assets/elements/explore-dreams.png"
       alt="">
</picture>

<!-- Castle: centered, anchored to bottom -->
<a class="castle-link" href="rooms/game-room.html" aria-label="Enter Heartability">
  <img class="castle-img"
       src="assets/elements/castle.png"
       alt="Castle — click to enter">
</a>

<!-- Heart guide — bottom left, links to about page -->
<div class="heart-guide-wrap" id="heartGuideWrap">
  <a href="about.html" aria-label="About us">
    <img class="heart-guide-img"
         src="assets/elements/guides/heart.png"
         alt="Heart guide character">
  </a>
  <!-- Speech bubble sits to the right, also links to about -->
  <a class="heart-bubble-wrap" id="heartBubbleWrap" href="about.html">
    <div class="speech-bubble">Hey! What are you doing here?</div>
  </a>
</div>

<p class="copyright">©&nbsp;<a href="https://untolduntilmedia.com" target="_blank" rel="noopener">untold until media</a></p>

<script>
(function () {
  if (window.innerWidth > 768) return;

  /* Mobile: first tap on heart shows bubble; bubble itself navigates directly */
  const heartGuide = document.getElementById('heartGuideWrap');
  const bubbleWrap = document.getElementById('heartBubbleWrap');

  heartGuide.querySelector('a').addEventListener('click', (e) => {
    if (!bubbleWrap.classList.contains('visible')) {
      e.preventDefault();
      bubbleWrap.classList.add('visible');
    }
  });

  document.addEventListener('click', (e) => {
    if (!heartGuide.contains(e.target)) {
      bubbleWrap.classList.remove('visible');
    }
  });
}());
</script>
</body>
</html>
