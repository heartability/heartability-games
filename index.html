<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Open Graph / Social sharing -->
<meta property="og:title" content="Heartability">
<meta property="og:description" content="Browser-based wellness games">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview.png">
<meta property="og:url" content="https://heartability-games.vercel.app">
<meta property="og:type" content="website">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://heartability-games.vercel.app/assets/social-preview.png">

<title>Heartability</title>
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelScript";
  src: url("assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw;
  height: 100vh;
  background: #6578e2;
  font-family: "ZoesHandwriting", cursive;
  overflow: hidden;
  position: relative;
  user-select: none;
}

/* ── STARFIELD ── */
#stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.star {
  position: absolute;
  background: #fff;
  clip-path: polygon(50% 0%,54% 43%,100% 50%,54% 57%,50% 100%,46% 57%,0% 50%,46% 43%);
  animation: twinkle var(--d, 2s) ease-in-out infinite var(--del, 0s);
}
@keyframes twinkle {
  0%,100% { opacity: 0.9; transform: scale(1) rotate(0deg); }
  50%      { opacity: 0.05; transform: scale(0.2) rotate(45deg); }
}

/* ── SCENE ── */
.scene {
  position: relative;
  width: 100vw;
  height: 100vh;
  z-index: 1;
}

/* ── TITLE TEXT IMAGES ── */
.title-heart {
  position: absolute;
  top: 8vh;
  left: 15vw;
  width: 40vw;
  height: auto;
  z-index: 4;
  pointer-events: none;
}
.title-ability {
  position: absolute;
  bottom: 8vh;
  right: 15vw;
  width: 40vw;
  height: auto;
  z-index: 4;
  pointer-events: none;
}

/* ── PORTAL ──────────────────────────────────────────
   portal-wrap  — positions the portal on the page
   portal-inner — real-height container (rainbow defines height)
   castle-link  — fills portal-inner, whole oval is clickable
   rainbow      — sits on top, pointer-events:none lets clicks through
   castle-img / portal-logo — centered, crossfade between each other
─────────────────────────────────────────────────── */
.portal-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: clamp(520px, 72vw, 900px);
  z-index: 2;
}
.portal-inner {
  position: relative;
  width: 100%;
}
.rainbow-portal {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
  position: relative;
  z-index: 3;
}
.castle-link {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-decoration: none;
  z-index: 2;
}
.castle-img,
.portal-logo {
  position: absolute;
  display: block;
  filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35));
}
.castle-img {
  width: clamp(150px, 20vw, 250px);
  height: auto;
  animation: castleFade 13s ease-in-out infinite;
}
.portal-logo {
  width: clamp(140px, 18vw, 260px);
  height: auto;
  animation: logoFade 13s ease-in-out infinite;
}
.castle-link:hover .castle-img  { animation: none; opacity: 1; }
.castle-link:hover .portal-logo { animation: none; opacity: 0; }

/* ── CROSSFADE KEYFRAMES ── */
@keyframes logoFade {
  0%         { opacity: 0; }
  10%        { opacity: 1; }
  30%        { opacity: 1; }
  42%        { opacity: 0; }
  100%       { opacity: 0; }
}
@keyframes castleFade {
  0%, 52%    { opacity: 0; }
  64%        { opacity: 1; }
  90%        { opacity: 1; }
  100%       { opacity: 0; }
}

/* ── HEART CHARACTER ── */
.heart-guide-wrap {
  position: absolute;
  bottom: 8vh;
  left: 4vw;
  z-index: 4;
  cursor: pointer;
  pointer-events: all;
}
.heart-guide-img {
  width: 15vw;
  height: auto;
  display: block;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
  animation: heartFloat 4s ease-in-out infinite;
}
@keyframes heartFloat {
  0%,100% { transform: translateY(0px) rotate(-2deg); }
  50%      { transform: translateY(-10px) rotate(2deg); }
}

/* ── SPEECH BUBBLE ── */
.heart-bubble-wrap {
  position: absolute;
  bottom: 22vh;
  left: 19vw;
  z-index: 6;
}
.heart-bubble-wrap .speech-bubble {
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 14px 24px;
  font-family: "ZoesHandwriting", cursive;
  font-size: clamp(10px, 1.4vw, 16px);
  color: #3a2560;
  text-align: center;
  line-height: 1.4;
  filter: drop-shadow(1px 3px 5px rgba(0,0,0,.2));
  min-width: 180px;
  max-width: clamp(200px, 20vw, 300px);
}

/* ── COPYRIGHT ── */
.copyright {
  position: fixed;
  bottom: 14px;
  right: 20px;
  font-family: "PFPixelScript", monospace;
  font-size: 8px;
  color: rgba(255,255,255,0.32);
  letter-spacing: 1px;
  z-index: 10;
}
.copyright a { color: inherit; text-decoration: none; }
.copyright a:hover { color: rgba(255,255,255,0.72); }

/* ── SCREEN READER ONLY ── */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
}

/* ══════════════════════════════════════════════════
   MOBILE
   Adjust .portal-wrap top% to move the rainbow up/down.
   Higher % = lower on screen. Lower % = higher on screen.
══════════════════════════════════════════════════ */
@media (max-width: 768px) {

  .title-heart {
    top: 11vh;
    left: 4vw;
    width: 80vw;
  }
  .title-ability {
    top: 60vh;
    bottom: auto;
    right: 4vw;
    width: 80vw;
  }

  /* Move the whole portal up — change top% to reposition */
  .portal-wrap {
    top: 45vh;
    width: 90vw;
  }

  .castle-img  { width: clamp(90px, 25vw, 160px); }
  .portal-logo { width: clamp(90px, 26vw, 200px); }

  .heart-guide-wrap {
    bottom: 2vh;
    left: 6vw;
  }
  .heart-guide-img { width: 25vw; }

  /* Speech bubble hidden by default, shown on heart tap */
  .heart-bubble-wrap {
    display: none;
    bottom: 10vh;
    left: 15vw;
  }
  .heart-bubble-wrap.visible { display: block; }
  .heart-bubble-wrap .speech-bubble {
    font-size: clamp(12px, 3.5vw, 18px);
    min-width: 140px;
    max-width: 65vw;
  }

  .copyright { font-size: 5px; }

}

</style>
</head>
<body>

<h1 class="sr-only">Heartability</h1>

<div id="stars"></div>

<div class="scene">

  <!-- "stop spiraling" — top left -->
  <img class="title-heart"
       src="assets/elements/spiraling.png"
       alt="" aria-hidden="true">

  <!-- "start playing" — bottom right -->
  <img class="title-ability"
       src="assets/elements/playing.png"
       alt="" aria-hidden="true">

  <!-- Portal -->
  <div class="portal-wrap">
    <div class="portal-inner">

      <!-- Castle link sits behind rainbow, whole oval is clickable -->
      <a class="castle-link" href="game-select.html" aria-label="Enter Heartability">
        <img class="portal-logo"
             src="assets/elements/logo.png"
             alt="Heartability">
        <img class="castle-img"
             src="assets/elements/castle.png"
             alt="Castle — click to enter">
      </a>

      <!-- Rainbow on top, pointer-events:none passes clicks through -->
      <img class="rainbow-portal"
           id="rainbowPortal"
           src="assets/elements/circle-rainbow.png"
           alt="" aria-hidden="true">

    </div>
  </div>

  <!-- Heart guide — bottom left -->
  <div class="heart-guide-wrap" id="heartGuideWrap">
    <img class="heart-guide-img"
         src="assets/elements/guides/heart.png"
         alt="Heart guide character">
  </div>

  <!-- Speech bubble -->
  <div class="heart-bubble-wrap" id="heartBubbleWrap">
    <div class="speech-bubble">i heard there is a castle around here somewhere</div>
  </div>

</div>

<p class="copyright">©&nbsp;<a href="https://untolduntilmedia.com" target="_blank" rel="noopener">untold until media</a></p>

<script>
(function () {

  /* ── Starfield ── */
  const field = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = (Math.random() * 5 + 2).toFixed(1);
    s.style.cssText = [
      `width:${sz}px`, `height:${sz}px`,
      `left:${(Math.random() * 100).toFixed(1)}%`,
      `top:${(Math.random() * 100).toFixed(1)}%`,
      `--d:${(1.4 + Math.random() * 3.2).toFixed(2)}s`,
      `--del:${(-Math.random() * 4).toFixed(2)}s`
    ].join(';');
    field.appendChild(s);
  }

  /* ── Swap rainbow image for mobile ── */
  function swapRainbow() {
    const img = document.getElementById('rainbowPortal');
    if (!img) return;
    img.src = window.innerWidth <= 768
      ? 'assets/elements/circle-rainbow-m.png'
      : 'assets/elements/circle-rainbow.png';
  }
  swapRainbow();
  window.addEventListener('resize', swapRainbow);

  /* ── Mobile: tap heart to toggle speech bubble ── */
  const heartGuide = document.getElementById('heartGuideWrap');
  const bubbleWrap = document.getElementById('heartBubbleWrap');

  heartGuide.addEventListener('click', () => {
    if (window.innerWidth <= 768) {
      bubbleWrap.classList.toggle('visible');
    }
  });

  /* Tap anywhere else to dismiss */
  document.addEventListener('click', (e) => {
    if (window.innerWidth <= 768 &&
        !heartGuide.contains(e.target) &&
        !bubbleWrap.contains(e.target)) {
      bubbleWrap.classList.remove('visible');
    }
  });

})();
</script>
</body>
</html>
