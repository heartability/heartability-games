<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/elements/favicon.png">
<link rel="stylesheet" href="assets/css/modal.css">
<script src="assets/js/modal.js" defer></script>

<meta name="description" content="Heartability is an aspirational virtual world where video-game rooms and gentle daily rituals help you track your feelings, build hope, and rediscover your optimism.">

<!-- Open Graph / Social sharing -->
<meta property="og:title" content="Heartability">
<meta property="og:description" content="Browser-based wellness games">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview.png">
<meta property="og:url" content="https://heartability-games.vercel.app">
<meta property="og:type" content="website">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://heartability-games.vercel.app/assets/social-preview.png">

<title>Heartability</title>
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelScript";
  src: url("assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
}

body {
  font-family: "ZoesHandwriting", cursive;
  overflow: scroll;
  position: relative;
  user-select: none;
}

/* Fixed bg div (added via JS) fills the true visual viewport on iOS */
.bg {
  position: fixed;
  inset: 0;
  background: url("assets/elements/home-sky.png") no-repeat center center / cover;
  z-index: 0;
}

/* ── WELCOME BANNER — anchored L ── */
.welcome-banner {
  position: fixed;
  top: 10vh;
  left: 0;
  width: 25%;
  height: auto;
  z-index: 2;
  pointer-events: none;
}

/* ── HEARTABILITY BANNER — full-width, anchored R ── */
.heartability-banner {
  position: fixed;
  bottom: 10vh;
  right: 0;
  width: 25%;
  height: auto;
  z-index: 2;
  pointer-events: none;
}

/* ── DREAMS BANNER — full-width, anchored R-L ── */
.dreams-banner {
  position: fixed;
  top: 0;
  right: 0;
  width: 100%;
  height: auto;
  z-index: 2;
  pointer-events: none;
}

/* ── CASTLE — centered, clickable ── */
.castle-link {
  position: fixed;
  bottom: 25%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  cursor: pointer;
  text-decoration: none;
  display: block;
  -webkit-tap-highlight-color: transparent;
}
.castle-img {
  display: block;
  width: clamp(320px, 44vw, 760px);
  height: auto;
  filter: drop-shadow(0 8px 24px rgba(80, 60, 140, 0.35));
  transition: filter 0.2s ease;
}
.castle-link:hover .castle-img {
  filter: drop-shadow(0 8px 32px rgba(120, 80, 200, 0.55));
}

/* ── HEART CHARACTER ── */
.heart-guide-wrap {
  position: fixed;
  bottom: 6vh;
  left: 4vw;
  z-index: 6;
  cursor: pointer;
  pointer-events: all;
}
.heart-guide-img {
  width: clamp(80px, 12vw, 180px);
  height: auto;
  display: block;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
  animation: heartFloat 4s ease-in-out infinite;
}
@keyframes heartFloat {
  0%,100% { transform: translateY(0px) rotate(-2deg); }
  50%      { transform: translateY(-10px) rotate(2deg); }
}

/* ── SPEECH BUBBLE ── */
.heart-bubble-wrap {
  position: fixed;
  bottom: 18vh;
  left: 15vw;
  z-index: 7;
}
.heart-bubble-wrap .speech-bubble {
  background: #fff;
  border: 2px solid #000;
  border-radius: 50%;
  padding: 14px 24px;
  font-family: "ZoesHandwriting", cursive;
  font-size: clamp(10px, 1.4vw, 16px);
  color: #000;
  text-align: center;
  line-height: 1.4;
  filter: drop-shadow(1px 3px 5px rgba(0,0,0,.2));
  min-width: 180px;
  max-width: clamp(200px, 20vw, 300px);
}

/* ── COPYRIGHT ── */
.copyright {
  position: fixed;
  bottom: 14px;
  right: 20px;
  font-family: "PFPixelScript", monospace;
  font-size: 8px;
  color: rgba(255,255,255,0.32);
  letter-spacing: 1px;
  z-index: 10;
}
.copyright a { color: inherit; text-decoration: none; }
.copyright a:hover { color: rgba(255,255,255,0.72); }

/* ── SCREEN READER ONLY ── */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
}

/* ══════════════════════════════════════════════════
   MOBILE
══════════════════════════════════════════════════ */
@media (max-width: 768px) {

  .bg {
    background-image: url("assets/elements/home-sky-m.png");
    background-position: center top;
  }

  .heartability-banner { display: none; }

  .dreams-banner {
    top: 2%;
    width: 100%;
  }

  .welcome-banner {
    width: 100%;
    top: 20%;
  }

  .castle-img {
    width: clamp(220px, 80vw, 420px);
  }

  .heart-guide-wrap {
    bottom: 2vh;
    left: 4vw;
  }
  .heart-guide-img { width: clamp(60px, 20vw, 120px); }

  .heart-bubble-wrap {
    display: none;
    bottom: 16vh;
    left: 24vw;
  }
  .heart-bubble-wrap.visible { display: block; }
  .heart-bubble-wrap .speech-bubble {
    font-size: clamp(12px, 3.5vw, 18px);
    min-width: 140px;
    max-width: 50vw;
  }

  .copyright { font-size: 5px; }
}

/* ══════════════════════════════════════════════════
   REDUCED MOTION
══════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  .heart-guide-img { animation: none; }
}

</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<h1 class="sr-only">Heartability</h1>

<!-- Welcome banner: stretches full width L→R; mobile version via <picture> -->
<picture>
  <source media="(max-width: 768px)" srcset="assets/elements/welcome-home-m.png">
  <img class="welcome-banner"
       src="assets/elements/welcome-home.png"
       alt="">
</picture>

<img class="heartability-banner"
     src="assets/elements/heartability.png"
     alt="">

<picture>
  <source media="(max-width: 768px)" srcset="assets/elements/explore-dreams-m.png">
  <img class="dreams-banner"
       src="assets/elements/explore-dreams.png"
       alt="">
</picture>

<!-- Castle: centered, anchored to bottom -->
<a class="castle-link" href="games/game-room.html" aria-label="Enter Heartability">
  <img class="castle-img"
       src="assets/elements/castle.png"
       alt="Castle — click to enter">
</a>

<!-- Heart guide — bottom left, links to about page -->
<a class="heart-guide-wrap" id="heartGuideWrap" href="about.html" aria-label="Learn more about us">
  <img class="heart-guide-img"
       src="assets/elements/guides/heart.png"
       alt="Heart guide character">
</a>

<!-- Speech bubble -->
<div class="heart-bubble-wrap" id="heartBubbleWrap">
  <div class="speech-bubble">click me to learn more about us</div>
</div>

<p class="copyright">©&nbsp;<a href="https://untolduntilmedia.com" target="_blank" rel="noopener">untold until media</a></p>

<script>
(function () {
  /* Mobile: first tap shows bubble, second tap follows the link */
  const heartGuide = document.getElementById('heartGuideWrap');
  const bubbleWrap = document.getElementById('heartBubbleWrap');

  if (window.innerWidth <= 768) {
    heartGuide.addEventListener('click', (e) => {
      if (!bubbleWrap.classList.contains('visible')) {
        e.preventDefault();
        bubbleWrap.classList.add('visible');
      }
    });

    document.addEventListener('click', (e) => {
      if (!heartGuide.contains(e.target) && !bubbleWrap.contains(e.target)) {
        bubbleWrap.classList.remove('visible');
      }
    });
  }
}());
</script>
</body>
</html>
