<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore the Castle — Heartability</title>
<style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:   "ZoesHandwriting", cursive;
  --font-pixel:  "PFPixelscript", cursive;
  --back-wall:   #f0ece4;
  --side-col:    #dbd6ce;
  --line-col:    #111;

  /*
    Vanishing point: 50% across, 30% down.

    Back wall rectangle corners sit exactly ON the four diagonal lines:
      t_top=0.30 → top edge at y=9%,  left=15%, right=85%,  width=70%
      t_bot=0.55 → bot edge at y=61.5%, left=27.5%, right=72.5%

    Since it's a rectangle (not a trapezoid) we use:
      top:   9%   left: 15%   width: 70%   height: 52.5%
    The top corners land on the top-left and top-right diagonal lines.
    The bottom corners land on the bottom-left and bottom-right diagonal lines.
  */
  --bw-top:    9%;
  --bw-left:   15%;
  --bw-width:  70%;
  --bw-height: 70%;
}

html, body {
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  user-select: none;
  /* side/ceiling fill color shows outside the back wall */
  background: var(--side-col);
}

/* ─────────────────────────────────────────────────
   LAYER ORDER (z-index)
   0  — body background (side wall color)
   2  — SVG diagonal lines
   3  — back wall rectangle  ← covers line intersections
   4  — wall art, heart
───────────────────────────────────────────────── */

/* ── Four diagonal lines ── */
.room-lines {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}
.room-lines svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}

/* ── Back wall: plain rectangle, ON TOP of lines ── */
.back-wall {
  position: fixed;
  top:    var(--bw-top);
  left:   var(--bw-left);
  width:  var(--bw-width);
  height: var(--bw-height);
  background: var(--back-wall);
  border: 2px solid var(--line-col);
  z-index: 3;
  pointer-events: none;
}

/* ─────────────────────────────────────────────────
   Door choices z:4
───────────────────────────────────────────────── */
.back-door {
  position: fixed;
  cursor: pointer;
  z-index: 4;
}
.back-door img {
  display: block;
  width: 100%;
  height: auto;
  filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.2));
  transition: filter 0.2s;
}
.back-door:hover img { filter: drop-shadow(4px 8px 16px rgba(0,0,0,0.35)); }

@keyframes art-wiggle {
  0%,100% { transform: rotate(0deg); }
  20%      { transform: rotate(-3deg); }
  40%      { transform: rotate(3deg); }
  60%      { transform: rotate(-2deg); }
  80%      { transform: rotate(2deg); }
}
.back-door.wiggling { animation: art-wiggle 0.48s ease; }

.garden-door  { left: 25vw; bottom: 21vh; width: 14vw; }
.library-door { left: 43vw; bottom: 21vh; width: 14vw; }
.gallery-door { right: 25vw; bottom: 21vh; width: 14vw; }

/* ─────────────────────────────────────────────────
   TOP NAV BAR  z:200
───────────────────────────────────────────────── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: #c9fff5;
  border-bottom: 2px solid var(--line-col);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(14px, 1.6vw, 20px);
  color: #111;
}
.nav-btn {
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 2px;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(0,0,0,0.08); }
.nav-title { text-align: center; }

/* ─────────────────────────────────────────────────
   SIDE WALL CLICK ZONES  z:1
───────────────────────────────────────────────── */
.side-wall {
  position: fixed;
  top: 44px;
  bottom: 0;
  width: 15vw;
  z-index: 1;
  cursor: pointer;
  background: transparent;
  transition: background 0.3s ease, box-shadow 0.3s ease;
}
.side-wall:hover {
  background: rgba(255,255,255,0.16);
  box-shadow: inset 0 0 60px rgba(255,255,255,0.22);
}
.side-wall-left  { left: 0; }
.side-wall-right { right: 0; }

/* ─────────────────────────────────────────────────
   CHARACTER  z:4
───────────────────────────────────────────────── */
@keyframes intro-wiggle {
  0%   { transform: rotate(0deg) scale(1); }
  18%  { transform: rotate(-11deg) scale(1.06); }
  38%  { transform: rotate(11deg) scale(1.06); }
  58%  { transform: rotate(-6deg) scale(1.02); }
  78%  { transform: rotate(6deg) scale(1.02); }
  100% { transform: rotate(0deg) scale(1); }
}
@keyframes idle-pulse {
  0%,100% { transform: translateY(0)    rotate(-2deg) scale(1); }
  50%      { transform: translateY(-8px) rotate(2deg)  scale(1.03); }
}
@keyframes hover-bounce {
  0%,100% { transform: translateY(0)     rotate(-3deg) scale(1.07); }
  50%      { transform: translateY(-14px) rotate(3deg)  scale(1.11); }
}

.char-heart {
  position: fixed;
  left: 15vw;
  bottom: 13vh;
  width: clamp(110px, 11vw, 150px);
  display: flex;
  align-items: flex-end;
  cursor: pointer;
  z-index: 4;
}
.char-heart .char-img {
  display: block;
  width: 100%;
  height: auto;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.28));
  animation:
    intro-wiggle 0.85s ease-out 0.35s 1 backwards,
    idle-pulse   3.6s ease-in-out 1.5s infinite;
}
.char-heart.active .char-img { animation: hover-bounce 0.55s ease-in-out infinite; }

.thought-bubble {
  position: absolute;
  left: calc(100% - 10px);
  top: calc(100% - 40px);
  width: clamp(180px, 28vw, 300px);
  aspect-ratio: 846 / 248;
  background-image: url('assets/elements/speech-box.png');
  background-size: 100% 100%;
  background-repeat: no-repeat;
  padding: 11% 8% 0 8%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-hand);
  font-size: clamp(12px, 1.4vw, 20px);
  color: #5a3a7a;
  text-align: center;
  line-height: 1.3;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
  z-index: 5;
}
.thought-bubble::after { display: none; }
.char-heart.active .thought-bubble { opacity: 1; }

/* ─────────────────────────────────────────────────
   MOBILE
───────────────────────────────────────────────── */
@media (max-width: 768px) {
  .garden-door  { left: 18vw; bottom: 21vh; width: 18vw; }
  .library-door { left: 39vw; bottom: 21vh; width: 18vw; }
  .gallery-door { right: 18vw; bottom: 21vh; width: 18vw; }
  .char-heart { left: 12vw; bottom: 15vh; width: clamp(80px, 28vw, 250px); }
  .thought-bubble { width: clamp(140px, 52vw, 280px); font-size: clamp(10px, 2.8vw, 15px); }
  .side-wall { width: 12vw; }
  .room-nav { font-size: clamp(12px, 3.5vw, 16px); }
}

</style>
</head>
<body>


<!-- TOP NAV BAR  z:200 -->
<nav class="room-nav">
  <span class="nav-btn" id="nav-back">back</span>
  <span class="nav-title">hallway</span>
  <span class="nav-btn" id="nav-next">next</span>
</nav>

<!-- SIDE WALL CLICK ZONES  z:1 -->
<div class="side-wall side-wall-left"  id="wall-left"  role="button" tabindex="0" aria-label="Go back"></div>
<div class="side-wall side-wall-right" id="wall-right" role="button" tabindex="0" aria-label="Keep exploring"></div>

<!-- FOUR DIAGONAL LINES  z:2
     All four corners → vanishing point (50%, 30%).
     SVG viewBox 0 0 100 100 with preserveAspectRatio=none
     so coordinates are always exactly % of the viewport. -->
<div class="room-lines" aria-hidden="true">
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="0"   y1="0"   x2="50" y2="30" stroke="#111" stroke-width="0.18"/>
    <line x1="100" y1="0"   x2="50" y2="30" stroke="#111" stroke-width="0.18"/>
    <line x1="0"   y1="100" x2="50" y2="30" stroke="#111" stroke-width="0.18"/>
    <line x1="100" y1="100" x2="50" y2="30" stroke="#111" stroke-width="0.18"/>
  </svg>
</div>

<!-- BACK WALL  z:3
     Rectangle whose corners land exactly on the four diagonal lines.
     Calculated: t_top=0.30 → top 9%, left 15%, width 70%
                 t_bot=0.55 → bottom at 61.5% from top → height 52.5% -->
<div class="back-wall"></div>

<!-- Door group  z:4 -->
<div class="back-door garden-door" id="garden-door"
     role="button" tabindex="0" aria-label="visit the garden">
  <img src="assets/elements/garden-door.png" alt="garden-door">
</div>

<div class="back-door library-door" id="library-door"
     role="button" tabindex="0" aria-label="visit the library">
  <img src="assets/elements/library-door.png" alt="library-door">
</div>

<div class="back-door gallery-door" id="gallery-door"
     role="button" tabindex="0" aria-label="visit the gallery">
  <img src="assets/elements/gallery-door.png" alt="gallery-door">
</div>

<!-- HEART GUIDE  z:4 -->
<div class="char-heart" id="char-heart">
  <div class="thought-bubble" id="heart-bubble"></div>
  <img class="char-img" src="assets/elements/guides/heart.png" alt="Heart guide character">
</div>

<script>
(function () {
  const heart  = document.getElementById('char-heart');
  const bubble = document.getElementById('heart-bubble');

  const messages = {
    'garden-door':  'take a break, smell the roses',
    'library-door': 'find something that inspires you',
    'gallery-door': 'there is always a secret waterfall',
    'wall-left':    'go back to the game builder',
    'wall-right':   'keep exploring the castle'
  };

  function triggerWiggle(el) {
    el.classList.remove('wiggling');
    void el.offsetWidth;
    el.classList.add('wiggling');
    el.addEventListener('animationend', () => el.classList.remove('wiggling'), { once: true });
  }

  function activate(id) { bubble.textContent = messages[id] || ''; heart.classList.add('active'); }
  function deactivate() { heart.classList.remove('active'); }

  Object.keys(messages).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('mouseenter', () => { activate(id); triggerWiggle(el); });
    el.addEventListener('mouseleave', deactivate);
  });

  heart.addEventListener('mouseenter', () => { bubble.textContent = 'where do you want to go?'; heart.classList.add('active'); });
  heart.addEventListener('mouseleave', deactivate);

  /* Navigation — nav bar buttons */
  document.getElementById('nav-back').addEventListener('click', () => { window.location.href = 'game-select.html'; });
  document.getElementById('nav-next').addEventListener('click', () => { window.location.href = '#'; });

  /* Navigation — side wall click zones */
  document.getElementById('wall-left').addEventListener('click',  () => { window.location.href = 'game-select.html'; });
  document.getElementById('wall-right').addEventListener('click', () => { window.location.href = '#'; });
  document.getElementById('wall-left').addEventListener('keydown',  e => { if (e.key === 'Enter' || e.key === ' ') window.location.href = 'game-select.html'; });
  document.getElementById('wall-right').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') window.location.href = '#'; });

})();
</script>

</body>
</html>
