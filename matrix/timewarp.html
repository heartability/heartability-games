<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<link rel="stylesheet" href="../assets/css/modal.css">
<script src="../assets/js/modal.js" defer></script>
<link rel="stylesheet" href="../assets/css/nav.css">
<title>Timewarp — Heartability</title>
<meta name="description" content="Set a timer and watch a themed timelapse play out over the exact length of your session — a small act of intention-setting while you wait.">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
<style>
@font-face { font-family:"ZoesHandwriting"; src:url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype"); }
@font-face { font-family:"PFPixelscript";  src:url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype"); }
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  color-scheme: light;
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --font-game:  "VT323", monospace;
  --line-col:   #111;
  --blue:       #6579e2;
  --blue-dk:    #4a5bc4;
  --blue-sh:    #3a4aaa;
  --aqua:       #83d2e6;
  --ink:        #000f5a;
  --cream:      #cdd3ec;
  --back-wall:  #f1ebe4;
}

html, body { width:100vw; min-height:100dvh; overflow-x:hidden; overflow-y:auto; user-select:none;
  background:url("../assets/elements/matrix-dream.png") center / cover no-repeat fixed;
  font-family:var(--font-hand); color:var(--ink); }

/* ── NAV BAR ── */
.room-nav {
  position:fixed; top:0; left:0; right:0; height:44px;
  background:#6e83d3; border-bottom:2px solid var(--line-col);
  z-index:200; display:flex; align-items:center;
  justify-content:space-between; padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(21px,1.6vw,25px); color:#fff;
}
.nav-title { position:absolute; left:50%; transform:translateX(-50%); pointer-events:none; white-space:nowrap; margin:0; font:inherit; }
.nav-btn { cursor:pointer; padding:4px 8px; border-radius:2px; transition:background .15s; color:inherit; text-decoration:none; background:none; border:none; font:inherit; }
.nav-btn:hover { background:rgba(0,0,0,.08); }

/* ── Map dropdown ── */
.map-wrap { position:relative; }
.map-btn { display:flex; align-items:center; gap:4px; }
.map-dropdown {
  position:absolute; top:calc(100% + 4px); right:0; min-width:170px;
  background:#6e83d3; border:2px solid var(--line-col);
  box-shadow:3px 4px 0 rgba(0,0,0,.12);
  z-index:201; display:none; flex-direction:column; overflow:hidden;
}
.map-dropdown.open { display:flex; }
.map-item {
  display:block;
  font-family:var(--font-hand); font-size:clamp(15px,1.3vw,18px); color:#fff;
  padding:9px 14px; cursor:pointer; border:none; background:none;
  text-align:left; white-space:nowrap; transition:background .12s;
  text-decoration:none;
}
.map-item:hover { background:rgba(0,0,0,.07); }
.map-item.current { color:rgba(255,255,255,.55); cursor:default; }
.map-item.current:hover { background:none; }

/* ── CONTENT PANEL — normal document flow so the whole page grows/scrolls
   instead of clipping into its own internal scrollbar; fullbleed (running
   step) overrides back to a fixed, viewport-covering box. ── */
.content-panel {
  position:relative; margin:64px auto 60px; width:min(92vw, 940px);
  z-index:10; display:none; flex-direction:column; align-items:center;
  padding:20px;
}
.content-panel.active { display:flex; }
.content-panel.fullbleed {
  position:fixed; margin:0; top:44px; left:0; width:100vw; height:calc(100dvh - 44px);
  padding:0; z-index:15;
}

/* ── PICKER STEP ── */
.picker-head { text-align:center; margin-bottom:18px; }
.picker-head h2 { font-size:clamp(24px,2.4vw,32px); font-weight:normal; color:var(--ink); }
.picker-head p { font-size:clamp(14px,1.2vw,16px); color:#555; margin-top:4px; }

.theme-grid {
  display:grid; grid-template-columns:repeat(4, 1fr);
  gap:14px; width:100%; max-width:800px;
}
@media (max-width:640px) { .theme-grid { grid-template-columns:repeat(2, 1fr); } }
.theme-card {
  border:2px solid var(--blue); background:var(--cream);
  cursor:pointer; padding:8px; display:flex; flex-direction:column; gap:6px;
  transition:border-color .15s, box-shadow .12s, transform .1s;
  aspect-ratio:4/5;
}
.theme-card:hover { box-shadow:3px 3px 0 var(--blue-sh); transform:translateY(-2px); }
.theme-card.selected { border-color:var(--blue-dk); box-shadow:3px 3px 0 var(--blue-sh); }
.theme-card-visual {
  flex:1; background-size:cover; background-position:center;
  background-color:var(--blue); display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:var(--font-hand); font-size:13px; text-align:center; padding:6px;
}
.theme-card-label {
  font-family:var(--font-hand); font-size:clamp(14px,1.2vw,16px); text-align:center; color:var(--ink);
}

.a11y-card { border-style:dashed; }
.a11y-card.selected { border-style:solid; }
.a11y-card-visual { font-family:var(--font-hand); font-size:34px; font-weight:600; }

/* ── SETUP / PREVIEW STEP ── */
.setup-panel { display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:520px; }
.setup-preview {
  width:100%; aspect-ratio:16/9; background:#000; overflow:hidden;
  border:3px solid var(--blue); position:relative;
}
.setup-preview video, .setup-preview .no-video-fallback { width:100%; height:100%; object-fit:cover; }
/* Forces the video onto its own GPU compositing layer — works around a
   known Chromium-family bug (seen in Arc) where a <video> paints solid
   black instead of its decoded frames. Harmless no-op where unaffected. */
.setup-preview video, .running-video { transform:translateZ(0); backface-visibility:hidden; }
.no-video-fallback {
  display:flex; align-items:center; justify-content:center;
  background:var(--blue); color:#fff; font-family:var(--font-hand); font-size:18px;
}
.setup-theme-label { font-size:clamp(18px,1.8vw,24px); color:var(--ink); }

.timer-fields { display:flex; align-items:center; gap:8px; }
.timer-fields input {
  width:64px; font-family:var(--font-game); font-size:28px; text-align:center;
  border:2px solid var(--blue); background:#fff; padding:4px;
}
.timer-fields span { font-family:var(--font-game); font-size:28px; }
.timer-hint { font-size:12px; color:#888; }

.sound-picker { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; font-size:14px; color:#555; }
.sound-picker-label { color:#555; }
.sound-option { display:flex; align-items:center; gap:4px; cursor:pointer; }

.btn-row { display:flex; gap:10px; }
.pixel-btn {
  font-family:var(--font-hand); font-size:16px; color:#fff; cursor:pointer;
  background:var(--blue); border:2px solid var(--blue-dk); box-shadow:3px 3px 0 var(--blue-sh);
  padding:8px 18px;
}
.pixel-btn:active { box-shadow:none; transform:translate(3px,3px); }
.pixel-btn.secondary { background:#8892b8; border-color:#6c7599; box-shadow:3px 3px 0 #565e82; }
.pixel-btn:disabled { opacity:.5; cursor:default; box-shadow:none; }

/* ── RUNNING STEP ── */
.running-panel { display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; position:relative; }
.running-video, .running-numeral { width:100%; height:100%; object-fit:cover; }
.running-numeral {
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
  background:var(--blue); color:#fff;
}
.running-numeral .theme-word { font-family:var(--font-hand); font-size:clamp(18px,2vw,26px); opacity:.85; }
.running-numeral .big-clock { font-family:var(--font-game); font-size:clamp(48px,8vw,96px); }
.countdown-overlay {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:var(--font-game); font-size:clamp(48px,8vw,96px);
  color:rgba(255,255,255,.85); text-shadow:1px 2px 6px rgba(0,0,0,.5);
  pointer-events:none; z-index:5;
}
.running-controls {
  position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
  display:flex; gap:10px; z-index:20;
}
.running-close-btn {
  position:absolute; top:14px; right:16px; z-index:30;
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.35); color:#fff; font-size:18px; line-height:1;
  border:none; border-radius:50%; cursor:pointer;
}
.running-close-btn:hover { background:rgba(0,0,0,.55); }

/* ── ROTATE HINT — on a narrow phone screen the timer is meant to be
   watched in landscape (propped up like a little clock), so hide the
   video/clock behind a rotate prompt until the device is actually turned.
   Pure CSS/media-query driven — reacts live to orientation change, no JS. ── */
.rotate-hint {
  display:none; position:absolute; inset:0; z-index:25;
  background:var(--blue); color:#fff; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; font-family:var(--font-hand); font-size:18px; text-align:center; padding:20px;
}
.rotate-hint-icon { font-size:44px; display:inline-block; animation:rotate-hint-spin 2.4s ease-in-out infinite; }
@keyframes rotate-hint-spin {
  0%, 40%, 100% { transform:rotate(0deg); }
  70%, 90% { transform:rotate(90deg); }
}
@media (max-width:768px) and (orientation:portrait) {
  .rotate-hint { display:flex; }
}

/* ── COMPLETION STEP ── */
.completion-panel {
  display:flex; flex-direction:column; align-items:center; gap:16px;
  background:var(--cream); border:3px solid var(--blue); padding:28px 32px;
  max-width:88vw;
}
.completion-panel h3 { font-size:clamp(20px,2vw,26px); font-weight:normal; color:var(--ink); text-align:center; }
.completion-goal { font-size:14px; color:#555; text-align:center; max-width:360px; }
.completion-hint { font-size:12px; color:#888; text-align:center; }

/* ── GOAL FIELD (setup step) ── */
.goal-field { width:100%; display:flex; flex-direction:column; gap:4px; }
.goal-label { font-size:13px; color:#666; }
.goal-optional { color:#999; font-weight:normal; }
.goal-field input {
  font-family:var(--font-hand); font-size:16px; color:var(--ink);
  border:2px solid var(--blue); background:#fff; padding:8px 10px;
}

/* ── MATRIX PICKER OVERLAY ── */
.tw-picker-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.tw-picker-overlay.open { display:flex; }
.tw-picker {
  background:var(--cream); box-shadow:0 0 0 4px var(--blue), 4px 8px 28px rgba(0,0,0,.35);
  width:min(92vw, 460px); max-height:80vh; display:flex; flex-direction:column; overflow:hidden;
}
.tw-picker-head {
  min-height:44px; background:#c3cae6; border-bottom:2px solid var(--blue);
  display:flex; align-items:center; justify-content:space-between; padding:8px 16px;
  font-family:var(--font-hand); font-size:clamp(18px,1.8vw,21px); color:#333;
}
.tw-picker-close {
  cursor:pointer; color:#888; font-size:20px; background:none; border:none;
  font-family:var(--font-hand); line-height:1; padding:2px;
}
.tw-picker-close:hover { color:var(--blue-dk); }
.tw-picker-body { padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
.tw-picker-section-title {
  font-family:var(--font-hand); font-size:13px; color:#777;
  text-transform:uppercase; letter-spacing:.04em;
}
.tw-picker-item {
  display:block; width:100%; text-align:left; margin-top:6px;
  font-family:var(--font-hand); font-size:15px; color:var(--ink);
  background:#fff; border:1.5px solid var(--blue); padding:9px 12px; cursor:pointer;
}
.tw-picker-item:hover { background:#eef0fa; }
.tw-picker-empty { font-size:13px; color:#999; font-style:italic; margin-top:6px; }
.tw-picker-status { font-size:14px; color:#888; text-align:center; padding:24px 0; }

@media (max-width:768px) {
  .content-panel { padding:14px; margin-top:56px; }
  .content-panel.fullbleed { top:52px; height:calc(100dvh - 52px); padding:0; margin:0; }
}
</style>
</head>
<body>

<nav class="room-nav">
  <div id="gear-slot"></div>
  <h1 class="nav-title">timewarp</h1>
  <div class="map-wrap" id="map-wrap">
    <button class="nav-btn map-btn" id="map-btn" onclick="toggleMap()">map ▾</button>
    <div class="map-dropdown" id="map-dropdown">
      <a class="map-item" href="../rooms/bed.html">bedroom</a>
      <a class="map-item" href="../rooms/game-room.html">game room</a>
      <a class="map-item" href="../rooms/patio.html">patio</a>
      <a class="map-item" href="../rooms/library.html">library</a>

</nav>

<div class="content-panel active" id="content-panel">

</div>

<div id="toast"></div>

<div class="tw-picker-overlay" id="tw-picker-overlay">
  <div class="tw-picker">
    <div class="tw-picker-head">
      <span>add this session to...</span>
      <button type="button" class="tw-picker-close" onclick="closeMatrixPicker()" aria-label="close">&#x2715;</button>
    </div>
    <div class="tw-picker-body" id="tw-picker-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/nav.js" defer></script>
<script>
// ── SUPABASE (nav-only — this page has no gated content or per-user data) ──
const SUPABASE_URL      = 'https://rrdfltqnrnvmqemyrfaj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyZGZsdHFucm52bXFlbXlyZmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTYxMjIsImV4cCI6MjA5MjUzMjEyMn0.u2nYIEepQQYr357GlMNPg0-1zermCbWenkjjfaGGZD4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const VIDEO_BUCKET = 'timelapse-videos';
const STATE_KEY = 'timelapseState';
const MIN_SECONDS = 10;
const MAX_SECONDS = 3 * 60 * 60;

const THEMES = [
  { slug: 'rainbow',   title: 'Rain becomes rainbow',   theme: 'Acceptance' },
  { slug: 'flower',    title: 'Flower blooming',        theme: 'Becoming' },
  { slug: 'fog',       title: 'Fog clearing',           theme: 'Clarity' },
  { slug: 'spider',    title: "Spider's web forming",   theme: 'Creative focus' },
  { slug: 'ice',       title: 'Ice cube melting',       theme: 'High adrenaline' },
  { slug: 'seed',      title: 'Seed pops through soil', theme: 'New beginning' },
  { slug: 'hourglass', title: 'Hourglass',              theme: 'Patience' },
  { slug: 'candle',    title: 'Candle burning',         theme: 'Ritual time' },
  { slug: 'sunrise',   title: 'Sunrise',                theme: 'Rise again' },
  { slug: 'tide',      title: 'High tide',              theme: 'Starting over' },
  { slug: 'sunset',    title: 'Sunset',                 theme: 'Wind down' },
];

const ONLY_NUMBERS_THEME = { slug: 'only-numbers', title: 'Only numbers', theme: 'take a moment' };
function findTheme(slug) {
  return THEMES.find(t => t.slug === slug) || ONLY_NUMBERS_THEME;
}

function videoUrl(slug) {
  return sb.storage.from(VIDEO_BUCKET).getPublicUrl(`${slug}.mp4`).data.publicUrl;
}
function posterUrl(slug) {
  return `../assets/elements/timelapse/${slug}.png`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveState(state) {
  try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {}
}
function clearState() {
  try { localStorage.removeItem(STATE_KEY); } catch (e) {}
}

function prefersReducedMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function fmtClock(ms) {
  const totalSec = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

const SOUND_OPTIONS = [
  { id: 'none',  label: 'no sound' },
  { id: 'bells', label: 'bells', file: 'bells_web.wav' },
  { id: 'gong',  label: 'gong',  file: 'gong_web.wav' },
  { id: 'omni',  label: 'omni',  file: 'omni_web.wav' },
];

function playCompletionSound(soundId) {
  const opt = SOUND_OPTIONS.find(o => o.id === soundId);
  if (!opt || !opt.file) return;
  try {
    new Audio(`../assets/sounds/${opt.file}`).play().catch(() => {});
  } catch (e) {}
}

const panel = document.getElementById('content-panel');
let tickIntervalId = null;
let currentUser = null;
let lastCompletedSession = null;

function esc(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function humanize(s) {
  if (!s) return '—';
  return s.toString().replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
function localTodayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function fmtDurationLabel(seconds) {
  if (seconds < 60) return `${seconds}s`;
  return `${Math.round(seconds / 60)} min`;
}

function render(html) { panel.innerHTML = html; }
function setFullbleed(on) { panel.classList.toggle('fullbleed', on); }

function hasUnfinishedTimer(state) {
  return !!state && currentRemaining(state) > 0;
}
function isTimerActive(state) {
  return !!state && state.pausedRemainingMs === null && currentRemaining(state) > 0;
}

// ── STEP: picker ──────────────────────────────────────────
function renderPicker() {
  setFullbleed(false);
  const cards = THEMES.map(t => `
    <div class="theme-card" data-slug="${t.slug}" onclick="selectTheme('${t.slug}')" title="${t.title}">
      <div class="theme-card-visual" style="background-image:url('${posterUrl(t.slug)}')"></div>
      <div class="theme-card-label">${t.theme}</div>
    </div>`).join('');

  render(`
    <div class="picker-head">
      <h2>choose a theme</h2>
      <p>set a timer, and watch it play out over the exact length of your session</p>
    </div>
    <div class="theme-grid">
      ${cards}
      <div class="theme-card a11y-card ${prefersReducedMotion() ? 'selected' : ''}" id="a11y-card" onclick="selectOnlyNumbers()" title="just a countdown, no video motion">
        <div class="theme-card-visual a11y-card-visual">Aa</div>
        <div class="theme-card-label">only numbers</div>
      </div>
    </div>
  `);
}

function selectOnlyNumbers() {
  renderSetup(ONLY_NUMBERS_THEME, true);
}

function selectTheme(slug) {
  renderSetup(THEMES.find(t => t.slug === slug), false);
}

// ── STEP: setup / preview ────────────────────────────────
function renderSetup(themeObj, textOnly) {
  setFullbleed(false);
  render(`
    <div class="setup-panel">
      <div class="setup-preview" id="setup-preview">
        ${textOnly
          ? `<div class="no-video-fallback">${themeObj.theme}</div>`
          : `<video id="preview-video" muted autoplay loop playsinline preload="auto" src="${videoUrl(themeObj.slug)}"></video>`}
      </div>
      <div class="setup-theme-label">${themeObj.theme}</div>
      <div class="goal-field">
        <label for="goal-input" class="goal-label">session goal <span class="goal-optional">(optional)</span></label>
        <input type="text" id="goal-input" maxlength="140" placeholder="what are you working toward?">
      </div>
      <div class="timer-fields">
        <input type="number" id="min-input" min="0" max="180" value="5" aria-label="minutes">
        <span>:</span>
        <input type="number" id="sec-input" min="0" max="59" value="0" aria-label="seconds">
      </div>
      <div class="timer-hint">10 seconds minimum, 3 hours maximum</div>
      <div class="sound-picker">
        <span class="sound-picker-label">🔔 sound when it ends:</span>
        ${SOUND_OPTIONS.map((opt, i) => `
          <label class="sound-option">
            <input type="radio" name="sound-choice" value="${opt.id}" ${i === 0 ? 'checked' : ''} ${opt.file ? `onclick="playCompletionSound('${opt.id}')"` : ''}>
            ${opt.label}
          </label>`).join('')}
      </div>
      <div class="btn-row">
        <button class="pixel-btn secondary" onclick="renderPicker()">choose another</button>
        <button class="pixel-btn" id="start-btn" onclick="startTimer('${themeObj.slug}', ${textOnly})" ${textOnly ? '' : 'disabled'}>start</button>
      </div>
    </div>
  `);

  if (!textOnly) {
    const video = document.getElementById('preview-video');
    const startBtn = document.getElementById('start-btn');
    video.addEventListener('loadedmetadata', () => { startBtn.disabled = false; }, { once: true });
  }
}

function readTimerSeconds() {
  const min = parseInt(document.getElementById('min-input').value, 10) || 0;
  const sec = parseInt(document.getElementById('sec-input').value, 10) || 0;
  return Math.min(MAX_SECONDS, Math.max(MIN_SECONDS, min * 60 + sec));
}

// ── STEP: running ─────────────────────────────────────────
function startTimer(slug, textOnly) {
  const timerSeconds = readTimerSeconds();
  const themeObj = findTheme(slug);
  const sound = document.querySelector('input[name="sound-choice"]:checked')?.value || 'none';
  const goal = (document.getElementById('goal-input')?.value || '').trim().slice(0, 140);

  let playbackRate = 1;
  let scrubMode = false;
  let nativeDuration = null;

  if (!textOnly) {
    const video = document.getElementById('preview-video');
    nativeDuration = video.duration || timerSeconds;
    const rawRate = nativeDuration / timerSeconds;
    // Chrome clamps HTMLMediaElement.playbackRate to ~0.0625x–16x and
    // silently plays at its own floor/ceiling outside that range instead
    // of the requested rate — that's what made short clips on long timers
    // finish early. Past that range, drive currentTime by hand each tick
    // instead of asking the browser for a native speed it won't honor.
    scrubMode = rawRate < 1 / 16 || rawRate > 16;
    playbackRate = scrubMode ? 1 : rawRate;
    // Stop the preview's own fetch/decode before handing off to the running
    // video — on a slow connection, two elements pulling the same clip at
    // once can starve the one that actually matters.
    video.pause();
    video.removeAttribute('src');
    video.load();
  }

  const state = {
    slug, timerSeconds, playbackRate, scrubMode, nativeDuration, textOnly, sound, goal,
    startedAt: Date.now(),
    pausedRemainingMs: null,
  };
  saveState(state);
  renderRunning(themeObj, state);
}

function renderRunning(themeObj, state) {
  render(`
    <div class="running-panel">
      <button class="running-close-btn" onclick="exitToPicker()" aria-label="close" title="close">&#x2715;</button>
      <div class="rotate-hint">
        <span class="rotate-hint-icon">📱</span>
        <div>turn your phone sideways<br>to watch</div>
      </div>
      ${state.textOnly
        ? `<div class="running-numeral"><div class="theme-word">${themeObj.theme}</div><div class="big-clock" id="big-clock">--:--</div></div>`
        : `<video class="running-video" id="running-video" src="${videoUrl(state.slug)}" muted playsinline preload="auto"></video>
           <div class="countdown-overlay" id="countdown-overlay"></div>`}
      <div class="running-controls">
        <button class="pixel-btn secondary" id="pause-btn" onclick="togglePause()">pause</button>
      </div>
    </div>
  `);

  setFullbleed(true);

  if (!state.textOnly) {
    const video = document.getElementById('running-video');

    if (state.scrubMode) {
      // Requested rate is outside what Chrome will actually honor — keep
      // the video paused for the whole session and step currentTime by
      // hand (see tick()) so progress still tracks the timer exactly.
      const initScrub = () => updateScrubFrame(loadState() || state);
      if (video.readyState >= 1) initScrub();
      else video.addEventListener('loadedmetadata', initScrub, { once: true });
    } else {
      try { video.playbackRate = state.playbackRate; } catch (e) {}

      const seekToOffset = () => {
        const remaining = currentRemaining(loadState() || state);
        if (remaining <= 0 || !video.duration) return;
        // Only seek if resuming meaningfully into the clip (paused/reloaded
        // mid-session) — seeking on a fresh start (target ≈ 0, already the
        // video's position) was interrupting the browser's initial buffering.
        const target = Math.max(0, video.duration - (remaining / 1000) * state.playbackRate);
        if (Math.abs(video.currentTime - target) > 0.35) video.currentTime = target;
      };
      const resumeIfShouldPlay = () => {
        const s = loadState();
        if (s && s.pausedRemainingMs === null && currentRemaining(s) > 0) {
          video.play().catch(() => {});
        }
      };

      if (video.readyState >= 1) seekToOffset();
      else video.addEventListener('loadedmetadata', seekToOffset, { once: true });

      // Calling play() before enough data is buffered can make the browser
      // silently pause itself (readyState stuck at HAVE_METADATA) and never
      // resume on its own — retry whenever it actually reports ready.
      video.addEventListener('canplay', resumeIfShouldPlay);
      resumeIfShouldPlay();
    }
  }

  window.addEventListener('beforeunload', beforeUnloadGuard);
  history.pushState({ timelapseRunning: true }, '', location.href);
  startTickLoop();
}

async function exitToPicker() {
  const state = loadState();
  if (hasUnfinishedTimer(state)) {
    const ok = await HGModal.confirm('leave timewarp?', "your timewarp session hasn't finished — leaving will end it.");
    if (!ok) return false;
  }
  clearInterval(tickIntervalId);
  window.removeEventListener('beforeunload', beforeUnloadGuard);
  clearState();
  renderPicker();
  return true;
}

function currentRemaining(state) {
  if (state.pausedRemainingMs !== null) return state.pausedRemainingMs;
  return state.timerSeconds * 1000 - (Date.now() - state.startedAt);
}

// Manually maps elapsed timer time onto a point in the clip, so a clip
// stretched or compressed past Chrome's ~0.0625x–16x playbackRate range
// still spans the full timer instead of finishing early/late.
function updateScrubFrame(state) {
  const video = document.getElementById('running-video');
  if (!video) return;
  const dur = video.duration || state.nativeDuration;
  if (!dur) return;
  const elapsed = state.timerSeconds * 1000 - currentRemaining(state);
  const progress = Math.min(1, Math.max(0, elapsed / (state.timerSeconds * 1000)));
  const target = progress * dur;
  if (Math.abs(video.currentTime - target) > 0.02) video.currentTime = target;
}

function beforeUnloadGuard(e) {
  if (isTimerActive(loadState())) {
    e.preventDefault();
    e.returnValue = '';
  }
}

function togglePause() {
  const state = loadState();
  if (!state) return;
  const video = document.getElementById('running-video');
  if (state.pausedRemainingMs === null) {
    state.pausedRemainingMs = Math.max(0, currentRemaining(state));
    if (video && !state.scrubMode) video.pause();
    document.getElementById('pause-btn').textContent = 'resume';
  } else {
    state.startedAt = Date.now() - (state.timerSeconds * 1000 - state.pausedRemainingMs);
    state.pausedRemainingMs = null;
    if (video) {
      if (state.scrubMode) updateScrubFrame(state);
      else video.play().catch(() => {});
    }
    document.getElementById('pause-btn').textContent = 'pause';
  }
  saveState(state);
}

function startTickLoop() {
  if (tickIntervalId) clearInterval(tickIntervalId);
  tick();
  tickIntervalId = setInterval(tick, 250);
}

function tick() {
  const state = loadState();
  if (!state) return;
  const remaining = currentRemaining(state);

  if (state.textOnly) {
    const clockEl = document.getElementById('big-clock');
    if (clockEl) clockEl.textContent = fmtClock(remaining);
  } else {
    const overlay = document.getElementById('countdown-overlay');
    if (overlay) overlay.textContent = fmtClock(remaining);
    const video = document.getElementById('running-video');
    if (video && state.scrubMode) {
      // Requested rate is outside Chrome's honored playbackRate range —
      // step the frame by hand so the clip still spans the full timer.
      if (state.pausedRemainingMs === null) updateScrubFrame(state);
    } else if (video && video.paused && !video.ended && state.pausedRemainingMs === null && remaining > 0) {
      // Watchdog: some networks/devices leave the browser paused on its own
      // (buffering stall) well after canplay already fired once. Since this
      // runs every 250ms anyway, just keep nudging play() back on whenever
      // the timer should be actively running — cheap, and self-heals
      // regardless of which event sequence caused the stall. video.ended is
      // excluded because within the normal playbackRate range the clip
      // finishing before the timer means it's genuinely done.
      video.play().catch(() => {});
    }
  }

  if (remaining <= 0 && state.pausedRemainingMs === null) {
    completeTimer(state);
  }
}

function completeTimer(state) {
  clearInterval(tickIntervalId);
  window.removeEventListener('beforeunload', beforeUnloadGuard);
  const video = document.getElementById('running-video');
  if (video) {
    video.loop = false;
    video.pause();
    if (video.duration) video.currentTime = video.duration;
  }
  playCompletionSound(state.sound);
  clearState();

  const controls = document.querySelector('.running-controls');
  if (controls) controls.remove();

  const themeObj = findTheme(state.slug);
  lastCompletedSession = { slug: state.slug, timerSeconds: state.timerSeconds, goal: state.goal || null };

  const panelEl = document.querySelector('.running-panel') || panel;
  const completion = document.createElement('div');
  completion.className = 'completion-panel';
  completion.style.position = 'absolute';
  completion.style.top = '50%';
  completion.style.left = '50%';
  completion.style.transform = 'translate(-50%, -50%)';
  const goalHtml = state.goal ? `<p class="completion-goal">goal: "${esc(state.goal)}"</p>` : '';
  const saveHtml = currentUser
    ? `<button class="pixel-btn" onclick="openMatrixPicker(lastCompletedSession)">save to a matrix</button>`
    : `<p class="completion-hint">log in to save this session to a matrix</p>`;
  completion.innerHTML = `
    <h3>${themeObj.theme} — complete</h3>
    ${goalHtml}
    ${saveHtml}
    <div class="btn-row">
      <button class="pixel-btn secondary" onclick="renderSetup(findTheme('${state.slug}'), ${state.textOnly})">restart</button>
      <button class="pixel-btn secondary" onclick="renderPicker()">choose another</button>
    </div>
  `;
  panelEl.appendChild(completion);
}

// ── SAVE SESSION TO A MATRIX ─────────────────────────────
async function loadMatrixOptions() {
  const today = localTodayStr();
  const [dailyRes, dreamRes, dreamsRes, cosmicRes] = await Promise.all([
    sb.from('daily_matrix').select('id').eq('user_id', currentUser.id).eq('entry_date', today).maybeSingle(),
    sb.from('dream_matrix').select('id, map_id, map_phase, updated_at').eq('user_id', currentUser.id).order('updated_at', { ascending: false }).limit(8),
    sb.from('dreams').select('id, map_name').eq('user_id', currentUser.id),
    sb.from('cosmic_matrix').select('id, transit_id, updated_at').eq('user_id', currentUser.id).order('updated_at', { ascending: false }).limit(8),
  ]);

  const mapNames = {};
  (dreamsRes.data || []).forEach(m => { mapNames[m.id] = m.map_name || 'untitled dream'; });

  const dreams = (dreamRes.data || []).map(row => ({
    id: row.id,
    label: `${mapNames[row.map_id] || 'dream'} — ${humanize(row.map_phase)}`,
  }));
  const cosmic = (cosmicRes.data || []).map(row => ({
    id: row.id,
    label: humanize(row.transit_id),
  }));

  return { dailyId: dailyRes.data?.id || null, dreams, cosmic };
}

function buildSessionMessageText(session) {
  const theme = findTheme(session.slug);
  const goalPart = session.goal ? `"${session.goal}" — ` : '';
  return `⏳ timewarp: ${goalPart}${fmtDurationLabel(session.timerSeconds)}, ${theme.theme.toLowerCase()}`;
}

async function attachSessionToMatrix(session, target) {
  const message = { id: crypto.randomUUID(), text: buildSessionMessageText(session), created_at: new Date().toISOString() };
  let rowId = target.id;

  if (target.table === 'daily_matrix' && !rowId) {
    rowId = crypto.randomUUID();
    const { error } = await sb.from('daily_matrix').upsert({
      id: rowId, user_id: currentUser.id, entry_date: localTodayStr(),
      journal_messages: [message], updated_at: new Date().toISOString(),
    }, { onConflict: 'id' });
    if (error) throw error;
  } else {
    const { data: current, error: readErr } = await sb.from(target.table)
      .select('journal_messages').eq('id', rowId).maybeSingle();
    if (readErr) throw readErr;
    const messages = (Array.isArray(current?.journal_messages) ? current.journal_messages : []).concat([message]);
    const { error } = await sb.from(target.table)
      .update({ journal_messages: messages, updated_at: new Date().toISOString() })
      .eq('id', rowId);
    if (error) throw error;
  }

  const { error: logErr } = await sb.from('timewarp_sessions').insert({
    user_id: currentUser.id,
    goal_text: session.goal || null,
    theme_slug: session.slug,
    theme_title: findTheme(session.slug).theme,
    duration_seconds: session.timerSeconds,
    matrix_table: target.table,
    matrix_row_id: rowId,
  });
  if (logErr) throw logErr;
}

function openMatrixPicker(session) {
  if (!currentUser) return;
  document.getElementById('tw-picker-overlay').classList.add('open');
  const body = document.getElementById('tw-picker-body');
  body.innerHTML = `<div class="tw-picker-status">loading your entries…</div>`;
  loadMatrixOptions().then(opts => renderPickerOptions(session, opts)).catch(err => {
    console.error('[timewarp picker]', err);
    body.innerHTML = `<div class="tw-picker-status">couldn't load your entries — try again</div>`;
  });
}

function closeMatrixPicker() {
  document.getElementById('tw-picker-overlay').classList.remove('open');
}

function renderPickerOptions(session, opts) {
  const body = document.getElementById('tw-picker-body');
  const dailyItem = `<button type="button" class="tw-picker-item" onclick="chooseMatrixTarget('daily_matrix', ${opts.dailyId ? `'${opts.dailyId}'` : 'null'})">today's daily entry${opts.dailyId ? '' : ' (new)'}</button>`;
  const dreamItems = opts.dreams.length
    ? opts.dreams.map(d => `<button type="button" class="tw-picker-item" onclick="chooseMatrixTarget('dream_matrix', '${d.id}')">${esc(d.label)}</button>`).join('')
    : `<div class="tw-picker-empty">no dream entries yet</div>`;
  const cosmicItems = opts.cosmic.length
    ? opts.cosmic.map(c => `<button type="button" class="tw-picker-item" onclick="chooseMatrixTarget('cosmic_matrix', '${c.id}')">${esc(c.label)}</button>`).join('')
    : `<div class="tw-picker-empty">no cosmic entries yet</div>`;

  body.innerHTML = `
    <div><div class="tw-picker-section-title">daily</div>${dailyItem}</div>
    <div><div class="tw-picker-section-title">dream</div>${dreamItems}</div>
    <div><div class="tw-picker-section-title">cosmic</div>${cosmicItems}</div>
  `;
  body.dataset.session = JSON.stringify(session);
}

async function chooseMatrixTarget(table, id) {
  const body = document.getElementById('tw-picker-body');
  const session = JSON.parse(body.dataset.session || '{}');
  body.innerHTML = `<div class="tw-picker-status">saving…</div>`;
  try {
    await attachSessionToMatrix(session, { table, id });
    closeMatrixPicker();
    await HGModal.alert('saved', 'this session was added to your journal ✓');
  } catch (err) {
    console.error('[timewarp save]', err);
    body.innerHTML = `<div class="tw-picker-status">something went wrong — try again</div>`;
  }
}

// ── Map dropdown ──────────────────────────────────────────
function toggleMap() { document.getElementById('map-dropdown').classList.toggle('open'); }
document.addEventListener('click', e => {
  const mw = document.getElementById('map-wrap');
  if (mw && !mw.contains(e.target)) document.getElementById('map-dropdown').classList.remove('open');
});
document.querySelectorAll('.map-item[href]').forEach(link => {
  link.addEventListener('click', async (e) => {
    if (!isTimerActive(loadState())) return;
    e.preventDefault();
    const ok = await HGModal.confirm('leave timewarp?', 'your timer is still running — progress will keep counting down in the background if you leave.');
    if (ok) window.location.href = e.currentTarget.href;
  });
});

// ── Browser back button — while a timer session is open, "back" should
// return to the picker (this page), not navigate to whatever page linked
// here. renderRunning() pushes a same-URL history entry to make that
// possible; popstate fires instead of a real navigation.
window.addEventListener('popstate', async () => {
  if (!hasUnfinishedTimer(loadState())) return;
  const proceeded = await exitToPicker();
  if (!proceeded) history.pushState({ timelapseRunning: true }, '', location.href);
});

// ── Init ──────────────────────────────────────────────────
async function resolveUsername(user) {
  try {
    const { data: profile } = await sb.from('user-profiles').select('username').eq('id', user.id).single();
    return profile?.username || user.email.split('@')[0];
  } catch (e) { return user.email.split('@')[0]; }
}

function init() {
  const existing = loadState();
  if (existing) {
    const themeObj = findTheme(existing.slug);
    {
      const remaining = currentRemaining(existing);
      if (remaining <= 0 && existing.pausedRemainingMs === null) {
        clearState();
        renderPicker();
      } else {
        renderRunning(themeObj, existing);
        return;
      }
      return;
    }
  }
  renderPicker();
}

document.addEventListener('DOMContentLoaded', () => {
  HeartabilityNav.init({
    mount: '#gear-slot',
    assetsBase: '../assets',
    authMode: 'dynamic',
    sb: sb,
    profileHref: '../users/account-settings.html',
    music: { src: 'https://dn720704.ca.archive.org/0/items/HildegardVonBingenCanticlesOfEcstasy/Hildegard%20von%20Bingen%20-%20Canticles%20Of%20Ecstasy.mp3' },
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      currentUser = session.user;
      resolveUsername(session.user).then(username => {
        HeartabilityNav.setAuthState({ loggedIn: true, username });
      });
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      HeartabilityNav.setAuthState({ loggedIn: false });
    }
  });

  sb.auth.getSession().then(async ({ data: { session } }) => {
    if (session) {
      currentUser = session.user;
      const username = await resolveUsername(session.user);
      HeartabilityNav.setAuthState({ loggedIn: true, username });
    }
  });

  init();
});
</script>
