<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Matrix — Heartability</title>
<style>
@font-face { font-family:"ZoesHandwriting"; src:url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype"); }
@font-face { font-family:"PFPixelscript";  src:url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype"); }

*{ margin:0; padding:0; box-sizing:border-box; }
:root{
  --font-hand:"ZoesHandwriting",cursive;
  --font-pixel:"PFPixelscript",cursive;
  --blue:#6579e2; --aqua:#83d2e6; --ink:#000f5a; --cream:#fdf6e3; --pink:#E8478B;
  --line:#111;
  --bw-top:9%; --bw-left:15%; --bw-width:70%; --bw-height:70%;
}
html,body{ width:100vw; height:100dvh; overflow:hidden; user-select:none;
  background:url("../assets/elements/cosmic-sky.png") center / cover no-repeat fixed;
  font-family:var(--font-hand); color:var(--ink); }

/* NAV (matches adventure) */
.room-nav{ position:fixed; top:0; left:0; right:0; height:44px; background:#c9fff5;
  border-bottom:2px solid var(--line); z-index:200; display:flex; align-items:center;
  justify-content:space-between; padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(14px,1.6vw,20px); color:#111; }
.nav-btn{ cursor:pointer; padding:4px 8px; border-radius:2px; transition:background .15s; }
.nav-btn:hover{ background:rgba(0,0,0,.08); }
.nav-title{ position:absolute; left:50%; transform:translateX(-50%); pointer-events:none; white-space:nowrap; }
.gear-wrap { position:relative; }
.gear-btn { width:30px; height:30px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:3px; transition:background .15s; padding:3px; }
.gear-btn:hover { background:rgba(0,0,0,.08); }
.gear-btn img { width:22px; height:22px; display:block; }
.gear-dropdown { position:absolute; top:calc(100% + 4px); left:0; min-width:170px; background:#c9fff5; border:2px solid var(--line); box-shadow:3px 4px 0 rgba(0,0,0,.12); z-index:201; display:none; flex-direction:column; overflow:hidden; }
.gear-dropdown.open { display:flex; }
.gear-item { font-family:var(--font-hand); font-size:clamp(13px,1.3vw,16px); color:#333; padding:9px 14px; cursor:pointer; border:none; background:none; text-align:left; white-space:nowrap; transition:background .12s; }
.gear-item:hover { background:rgba(0,0,0,.07); }

/* CONTENT PANEL — sits where the back wall would be (outside: no wall, soft frame) */
.content-panel{ position:fixed; top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height); z-index:10; display:none;
  flex-direction:column; overflow:hidden; }
.content-panel.active{ display:flex; }
.content-panel.active:not(.iframe-mode){ background:var(--cream); border:2px solid var(--aqua); box-shadow:0 8px 22px rgba(0,0,0,.08); }
.game-iframe{ width:100%; height:100%; border:none; display:block; }
.content-panel.iframe-mode{ border:3px solid #111; box-shadow:inset 0 0 0 2px var(--aqua); }
.panel-scroll{ width:100%; height:100%; overflow-y:auto; padding:22px; display:flex; flex-direction:column; align-items:center; }

/* HEART + BUBBLE (matches adventure: heart bottom-left, bubble to its RIGHT) */
@keyframes idle-pulse{ 0%,100%{ transform:translateY(0) rotate(-2deg) scale(1);} 50%{ transform:translateY(-8px) rotate(2deg) scale(1.03);} }
.char-heart{ position:fixed; left:4vw; bottom:6vh; width:clamp(100px,14vw,220px); z-index:20; }
.char-heart .char-img{ display:block; width:100%; height:auto; filter:drop-shadow(0 4px 10px rgba(0,0,0,.28)); animation:idle-pulse 3.6s ease-in-out 1s infinite; }
.thought-bubble{ position:absolute; left:calc(100% - 8px); bottom:60%;
  min-width:clamp(160px,18vw,260px); max-width:clamp(180px,22vw,300px);
  background:#fff; border:2px solid #000; border-radius:50%; padding:14px 20px;
  font-family:var(--font-hand); font-size:clamp(11px,1.3vw,15px); color:#000;
  text-align:center; line-height:1.5; filter:drop-shadow(1px 3px 5px rgba(0,0,0,.2)); z-index:21; }

/* SAVE BAR (matches adventure: floating blue button) */
.save-continue-bar{ position:fixed; bottom:0; left:0; right:0; height:calc(21% - 44px);
  display:none; align-items:center; justify-content:center; z-index:15; pointer-events:none; }
.save-continue-bar.visible{ display:flex; }
.save-continue-btn{ pointer-events:all; padding:14px 40px; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa; font-family:var(--font-hand);
  font-size:clamp(15px,1.8vw,20px); color:#fff; cursor:pointer; transition:all .05s; letter-spacing:.3px; text-transform:lowercase; }
.save-continue-btn:hover{ background:#4a5bc4; }
.save-continue-btn:active{ box-shadow:none; transform:translate(3px,3px); }
.save-continue-btn:disabled{ opacity:.38; cursor:not-allowed; transform:none!important; box-shadow:3px 3px 0 #3a4aaa; }
.save-status-bar{ position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
  font-family:var(--font-hand); font-size:14px; color:#6ab86a; z-index:16; pointer-events:none; }

/* SEASON HEADER */
.season-head{ text-align:center; margin-bottom:8px; }
.season-title{ font-family:var(--font-hand); font-size:clamp(24px,3.4vw,34px); color:var(--ink); }
.season-sub{ font-family:var(--font-hand); font-size:clamp(13px,1.5vw,16px); letter-spacing:2px; color:var(--blue); }

/* MAP OVERLAYS — fixed title + progress bar, only visible on season map */
#map-season-title{ position:fixed; top:7vh; left:11vw; font-family:var(--font-hand);
  font-size:clamp(28px,3.8vw,46px); color:rgba(201,255,245,0.85); z-index:15; pointer-events:none; display:none; }
#map-progress{ position:fixed; top:7vh; right:11vw; z-index:15; pointer-events:none;
  display:none; background:rgba(201,255,245,0.10); border:1px solid rgba(201,255,245,0.28);
  padding:6px 10px 8px; min-width:350px; }
#map-progress-label{ font-family:var(--font-hand); font-size:9px; color:rgba(201,255,245,0.7);
  letter-spacing:1.5px; margin-bottom:4px; }
#map-progress-track{ width:100%; height:12px; background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.18); position:relative; }
#map-score-fill{ height:100%; background:linear-gradient(90deg,#E8478B,#f3a0c4); width:0%; transition:width .3s; }
#map-score-label{ font-family:var(--font-hand); font-size:9px; color:rgba(201,255,245,0.7);
  text-align:right; margin-top:2px; }

/* TIMELINE */
.timeline{ width:100%; max-width:520px; margin:10px auto 0; position:relative; }
.timeline::before{ content:""; position:absolute; left:22px; top:14px; bottom:14px; width:2px;
  background:repeating-linear-gradient(var(--blue) 0 5px, transparent 5px 11px); opacity:.5; }
.node{ display:flex; align-items:center; gap:14px; padding:9px 10px; margin:5px 0; position:relative; border:2px solid transparent; }
.node-dot{ width:30px; height:30px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-hand); font-size:17px; border:2px solid var(--blue); background:var(--cream); color:var(--blue); z-index:1; }
.node-body{ flex:1; min-width:0; }
.node-loc{ font-family:var(--font-hand); font-size:clamp(17px,2vw,20px); color:var(--ink); line-height:1.15; }
.node-meta{ font-family:var(--font-hand); font-size:clamp(12px,1.4vw,15px); color:var(--blue); margin-top:1px; }
.node-badge{ font-family:var(--font-hand); font-size:13px; letter-spacing:.5px; padding:2px 8px; flex-shrink:0; }
.node.available{ cursor:pointer; }
.node.available:hover{ border-color:var(--aqua); background:#eef6f9; }
.node.available .node-badge{ color:var(--aqua); }
.node.completed{ cursor:pointer; }
.node.completed .node-dot{ background:var(--pink); border-color:var(--pink); color:#fff; }
.node.completed:hover{ border-color:var(--pink); background:#fbe9f1; }
.node.completed .node-badge{ color:var(--pink); }
.node.locked{ opacity:.45; }
.node.locked .node-dot{ border-color:#9aa0b8; color:#9aa0b8; }
.node.locked .node-badge{ color:#9aa0b8; }
.node.current .node-dot{ box-shadow:0 0 0 3px rgba(131,210,230,.55); }
.node.just-done{ animation:flash 1.6s ease-out; }
@keyframes flash{ 0%{ background:#fff0a0;} 100%{ background:transparent;} }

/* GATE */
.gate{ margin:auto; max-width:420px; text-align:center; background:#eef6f9; border:2px solid var(--aqua); padding:28px 24px; }
.gate-title{ font-family:var(--font-hand); font-size:26px; color:var(--ink); margin-bottom:10px; }
.gate-text{ font-family:var(--font-hand); font-size:17px; color:var(--ink); line-height:1.4; margin-bottom:18px; }
.gate-btn{ font-family:var(--font-hand); font-size:18px; color:#fff; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa; padding:10px 24px; cursor:pointer; }
.gate-btn:hover{ background:#4a5bc4; }
.gate-btn:active{ box-shadow:none; transform:translate(3px,3px); }

/* SEASON SELECTOR */
.map-grid{ display:grid; grid-template-columns:repeat(3,minmax(200px,320px)); gap:18px; justify-content:center; padding:4px; }
@media (max-width:600px){ .map-grid{ grid-template-columns:repeat(2,1fr); } }
.map-slot{ border:2px solid #ccc; background:var(--cream); cursor:pointer; display:flex; flex-direction:column;
  padding:20px 18px 16px; gap:8px; font-family:var(--font-hand); text-align:center;
  transition:border-color .15s, box-shadow .12s, transform .1s; }
.map-slot:hover{ border-color:var(--blue); box-shadow:2px 2px 0 var(--blue); transform:translateY(-2px); }
.slot-name{ font-size:clamp(22px,2.4vw,28px); color:var(--ink); font-weight:600; line-height:1.2; }
.slot-updated{ font-size:16px; color:#bbb; }
.slot-badge{ display:inline-block; font-size:16px; letter-spacing:.5px; padding:4px 12px; margin-top:2px; }
.slot-badge.active{ color:var(--aqua); border:1px solid var(--aqua); }
.slot-badge.past{ color:#bbb; border:1px solid #ddd; }
.slot-badge.upcoming{ color:var(--blue); border:1px solid var(--blue); }

/* PLANET SELECTOR */
.planet-grid{ display:flex; flex-wrap:wrap; gap:30px 26px; justify-content:center; padding:10px; max-width:840px; }
.planet-slot{ position:relative; width:126px; display:flex; flex-direction:column; align-items:center; gap:9px; }
.planet-halo{ position:absolute; top:38px; left:50%; width:170px; height:170px; transform:translate(-50%,-50%);
  border-radius:50%; pointer-events:none; filter:blur(4px); opacity:.55; transition:opacity .2s; }
.planet-disc{ position:relative; width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:38px; color:#fff; background:rgba(10,10,25,0.32); border:2px solid rgba(255,255,255,0.4);
  transition:transform .15s, border-color .15s, box-shadow .15s; }
.planet-name{ font-family:var(--font-hand); font-size:14px; letter-spacing:.5px; color:rgba(201,255,245,0.85); text-align:center; }
.planet-soon{ font-family:var(--font-hand); font-size:9px; letter-spacing:1.5px; color:rgba(201,255,245,0.4); text-transform:uppercase; }
.planet-slot.unlocked .planet-disc{ cursor:pointer; border-color:rgba(255,255,255,0.65); }
.planet-slot.unlocked:hover .planet-disc{ transform:translateY(-4px) scale(1.06); box-shadow:0 8px 20px rgba(0,0,0,.35); }
.planet-slot.unlocked:hover .planet-halo{ opacity:.85; }
.planet-slot.locked .planet-halo{ opacity:.18; filter:blur(4px) grayscale(.5); }
.planet-slot.locked .planet-disc{ opacity:.45; cursor:default; }
.planet-slot.locked .planet-name{ color:rgba(201,255,245,0.4); }
.planet-lock{ position:absolute; bottom:-4px; right:-4px; font-size:13px; background:rgba(10,10,20,.6);
  border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; z-index:2; }

/* JOURNAL (chat-style, matches adventure) */
.jrc-panel{ width:100%; height:100%; padding:8px; display:flex; flex-direction:column; overflow:hidden; }
.jrc-window{ width:100%; height:100%; background:#f5f0ea;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.35);
  display:flex; flex-direction:column; overflow:hidden; }
.jrc-titlebar{ flex-shrink:0; height:38px; background:#e8e3da; border-bottom:2px solid #bbb;
  display:flex; align-items:center; justify-content:center; position:relative;
  font-family:var(--font-hand); font-size:clamp(13px,1.5vw,18px); color:#333; letter-spacing:.5px; }
.jrc-date{ position:absolute; right:12px; font-size:clamp(9px,1vw,12px); color:#999; font-family:var(--font-hand); }
.jrc-messages{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:9px; scroll-behavior:smooth; }
.jrc-msg-wrap{ display:flex; align-items:flex-start; gap:8px; }
.jrc-msg-wrap.right{ flex-direction:row-reverse; align-self:flex-end; }
.jrc-msg-wrap.left{ flex-direction:row; align-self:flex-start; }
.jrc-avatar{ flex-shrink:0; width:52px; height:52px; border-radius:50%; overflow:hidden; position:relative; border:1.5px solid #ccc; background:#f0ebe2; }
.jrc-avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.jrc-msg{ display:flex; flex-direction:column; gap:3px; max-width:72%; }
.jrc-msg-wrap.right .jrc-msg{ align-items:flex-end; }
.jrc-msg-wrap.left  .jrc-msg{ align-items:flex-start; }
.jrc-bubble{ padding:11px 16px; font-family:var(--font-hand); font-size:clamp(14px,1.6vw,19px); line-height:1.5; word-break:break-word; user-select:text; }
.jrc-msg-wrap.right .jrc-bubble{ background:var(--blue); color:#fff; border:1.5px solid #4a5bc4; }
.jrc-msg-wrap.left  .jrc-bubble{ background:#fff; color:#222; border:1.5px solid #ccc; }
.jrc-bubble img{ display:block; width:210px; max-width:100%; margin-bottom:6px; object-fit:cover; border:3px solid rgba(255,255,255,.6); }
.jrc-msg-wrap.left .jrc-bubble img{ border-color:#e3ddd2; }
.jrc-meta{ font-size:clamp(11px,1vw,13px); color:#aaa; font-family:var(--font-hand); padding:0 4px; }
.jrc-empty{ margin:auto; text-align:center; color:#9a8a6a; font-style:italic;
  font-size:clamp(13px,1.4vw,16px); line-height:1.6; max-width:84%; padding:24px 0; }
.jrc-date-divider{ display:flex; align-items:center; gap:10px; padding:2px 0; align-self:stretch; }
.jrc-date-divider span{ font-size:12px; color:#bbb; font-family:var(--font-hand); white-space:nowrap; }
.jrc-date-divider .divider-location{ font-size:13px; color:#a09080; font-family:var(--font-hand); white-space:nowrap; }
.jrc-date-divider::before, .jrc-date-divider::after{ content:''; flex:1; height:1px; background:#ddd; }
.jrc-input-area{ flex-shrink:0; border-top:2px solid #ccc; padding:10px 14px; display:flex; flex-direction:column; gap:7px; background:#ede8e0; }
.jrc-img-chip{ position:relative; width:70px; display:none; }
.jrc-img-chip.has-img{ display:block; }
.jrc-img-chip img{ width:100%; border:1.5px solid #c8b88a; display:block; object-fit:cover; aspect-ratio:1; }
.jrc-img-x{ position:absolute; top:-7px; right:-7px; width:18px; height:18px; padding:0; line-height:1;
  background:#fff; border:1.5px solid #ccc; border-radius:50%; cursor:pointer; font-size:10px; color:#888;
  display:flex; align-items:center; justify-content:center; }
.jrc-img-x:hover{ color:var(--pink); border-color:var(--pink); }
.jrc-msg-row{ display:flex; gap:8px; align-items:stretch; }
.jrc-msg-input{ flex:1; font-family:var(--font-hand); font-size:clamp(12px,1.3vw,15px); color:#222;
  background:#f5f0ea; border:1.5px solid #bbb; padding:8px 11px; outline:none; resize:none; height:58px; line-height:1.5; }
.jrc-msg-input:focus{ border-color:var(--blue); }
.jrc-btn-stack{ flex-shrink:0; display:flex; flex-direction:column; gap:6px; width:58px; }
.jrc-plus-btn{ flex:1; background:rgba(255,255,255,.72); border:2px solid var(--blue); box-shadow:2px 2px 0 var(--aqua);
  font-family:var(--font-hand); font-size:20px; color:var(--blue); cursor:pointer; line-height:1; padding:0; transition:all .05s; }
.jrc-plus-btn:hover{ background:var(--blue); color:#fff; }
.jrc-plus-btn:active{ box-shadow:none; transform:translate(2px,2px); }
.jrc-send-btn{ flex:1; background:var(--blue); border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:clamp(12px,1.3vw,15px); color:#fff; cursor:pointer; padding:0; transition:all .05s; }
.jrc-send-btn:hover{ background:#4a5bc4; }
.jrc-send-btn:active{ box-shadow:none; transform:translate(2px,2px); }
.jrc-send-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.jrc-status{ font-size:clamp(9px,.9vw,11px); color:#999; font-family:var(--font-hand); min-height:13px; }
.jrc-status.ok{ color:#6ab86a; }
.jrc-status.err{ color:var(--pink); }
.jrc-confirm{ display:none; align-items:center; flex-wrap:wrap; gap:8px; padding-top:7px; border-top:1px dashed #ccc;
  font-family:var(--font-hand); font-size:clamp(11px,1.2vw,14px); color:#8a7a5a; }
.jrc-confirm.open{ display:flex; }
.jrc-confirm button{ font-family:var(--font-hand); font-size:clamp(11px,1.2vw,14px); cursor:pointer; padding:5px 12px; transition:all .05s; }
.jrc-confirm-send{ background:var(--blue); color:#fff; border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa; }
.jrc-confirm-send:hover{ background:#4a5bc4; }
.jrc-confirm-send:active{ box-shadow:none; transform:translate(2px,2px); }
.jrc-confirm-skip{ background:none; border:none; color:#8a7a5a; text-decoration:underline; }
.jrc-confirm-skip:hover{ color:var(--pink); }

/* LOGIN MODAL */
.login-modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; display:none; align-items:center; justify-content:center; }
.login-modal-overlay.open{ display:flex; }
.login-modal-window{ width:min(92vw,440px); background:#f5f0ea;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.35); overflow:hidden; }
.login-modal-titlebar{ height:38px; background:#e8e3da; border-bottom:2px solid #bbb;
  display:flex; align-items:center; justify-content:space-between; padding:0 16px;
  font-family:var(--font-hand); font-size:15px; color:#555; }
.login-modal-close{ cursor:pointer; font-size:20px; color:#bbb; padding:2px 4px; transition:color .15s; }
.login-modal-close:hover{ color:#444; }
.lm-tab-row{ display:flex; border-bottom:2px solid #ccc; background:#e8e3da; }
.lm-tab{ flex:1; padding:10px; font-family:var(--font-hand); font-size:15px;
  text-align:center; cursor:pointer; color:#888; background:none; border:none;
  border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .15s; }
.lm-tab.active{ color:var(--blue); border-bottom-color:var(--blue); }
.lm-body{ padding:20px 24px 16px; display:flex; flex-direction:column; gap:12px; }
.lm-form{ display:none; flex-direction:column; gap:12px; }
.lm-form.active{ display:flex; }
.lm-field{ display:flex; flex-direction:column; gap:4px; }
.lm-label{ font-family:var(--font-hand); font-size:12px; color:#888; }
.lm-input{ font-family:var(--font-hand); font-size:15px; color:#222; background:#f5f0ea;
  border:1.5px solid #bbb; padding:8px 12px; outline:none; transition:border-color .15s; user-select:text; }
.lm-input:focus{ border-color:var(--blue); }
.lm-btn{ padding:10px 18px; background:var(--blue); border:2px solid #4a5bc4;
  box-shadow:2px 2px 0 #3a4aaa; font-family:var(--font-hand); font-size:15px;
  color:#fff; cursor:pointer; transition:all .05s; margin-top:4px; }
.lm-btn:hover{ background:#4a5bc4; }
.lm-btn:active{ box-shadow:none; transform:translate(2px,2px); }
.lm-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.lm-msg{ font-family:var(--font-hand); font-size:12px; padding:6px 10px; display:none; }
.lm-msg.error{ display:block; color:#c0392b; background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.2); }
.lm-msg.success{ display:block; color:#2d7a4f; background:rgba(45,122,79,.08); border:1px solid rgba(45,122,79,.2); }
.lm-footer{ text-align:center; padding:0 24px 14px; font-family:var(--font-hand); font-size:11px; color:#aaa; }

/* MAP MODE — panel goes transparent so sky shows through the SVG */
.content-panel.map-mode{ background:transparent !important; border:none !important; box-shadow:none !important; overflow:visible !important; }

/* PHASE JOURNAL POP-OUT */
.pj-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:300; display:none; align-items:center; justify-content:center; }
.pj-overlay.open{ display:flex; }
.pj-window{ width:min(92vw,480px); max-height:80vh; background:#f5f0ea;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.4);
  display:flex; flex-direction:column; overflow:hidden; }

// ── PLANET SELECTOR (entry screen — planetary body, then zodiac) ──
// Colors follow classical planet associations; Sun/Mercury/Venus/Mars/Jupiter
// reuse the CHAR_FULL body-color palette so the whole app shares one language.
const PLANETS = [
  { id:'sun',     symbol:'☉', name:'sun',     color:'#f5d033', locked:false },
  { id:'moon',    symbol:'☽', name:'moon',    color:'#cfe3ea', locked:true  },
  { id:'mercury', symbol:'☿', name:'mercury', color:'#f0922b', locked:true  },

  { id:'saturn',  symbol:'♄', name:'saturn',  color:'#5a5470', locked:true  },
];
function hexA(hex, alpha){ // hex "#rrggbb" + alpha 0-1 → "#rrggbbaa"
  const v = Math.round(Math.max(0,Math.min(1,alpha))*255).toString(16).padStart(2,'0');
  return hex + v;
}
function showPlanetSelector(){
  setBubble('choose a planetary body.');

// ── SEASON LOAD + CLONE-ON-FIRST-OPEN ───────────────────────
async function loadSeason(){
  const param = new URLSearchParams(location.search).get('season'); // test hook: load by key
  let query = sb.from('cosmic_templates').select('*');
  query = param ? query.eq('season', param) : query.eq('is_published', true);
  let tpls=[];
  try { const { data } = await query; tpls = data || []; } catch(e){}
  if (!tpls.length){ return showNoSeason(); }

  // ?season= param: bypass selector (dev/direct link)
  if (param){ return openSeason(tpls[0]); }
  // Always show selector at root URL
  showSeasonSelector(tpls);
}

function showSeasonSelector(tpls){
  setBubble('choose a season.');
  setSave(false);
  const now = nowMs();
  const slots = tpls.slice().sort((a,b)=>Date.parse(b.map_data?.season_start_utc||0)-Date.parse(a.map_data?.season_start_utc||0))
    .map((t,i)=>{
      const s=Date.parse(t.map_data?.season_start_utc), e=Date.parse(t.map_data?.season_end_utc);
      const isActive = s && e && now>=s && now<e;
      const isPast   = e && now>=e;
      const badge    = isActive ? '<span class="slot-badge active">now</span>'
                     : isPast   ? '<span class="slot-badge past">past</span>'
                     :            '<span class="slot-badge upcoming">upcoming</span>';
      const phases   = Array.isArray(t.map_data?.phases) ? t.map_data.phases.length : '?';
      const dates    = (t.map_data?.season_start_utc && t.map_data?.season_end_utc)
        ? new Date(t.map_data.season_start_utc).toLocaleDateString('en-US',{month:'short',day:'numeric'})
          + ' – ' + new Date(t.map_data.season_end_utc).toLocaleDateString('en-US',{month:'short',day:'numeric'})
        : '';
      return `<div class="map-slot" onclick="selectSeason(${i})" data-idx="${i}">
        <div class="slot-name">${(t.title||t.season).replace(/\s*(season\s*)?\d{4}/i,'')}</div>
        ${dates ? `<div class="slot-updated">${dates}</div>` : ''}
        <div class="slot-updated">${phases} moon phases</div>
        ${badge}
      </div>`;
    }).join('');
  // stash for selectSeason
  window._cosmicSeasonList = tpls.slice().sort((a,b)=>Date.parse(b.map_data?.season_start_utc||0)-Date.parse(a.map_data?.season_start_utc||0));
  const p = $('content-panel');
  // static placeholder cards for upcoming seasons
  const placeholders = [
    { name: 'Leo', dates: 'Jul 22 – Aug 22' },
    { name: 'Virgo', dates: 'Aug 23 – Sep 22' },
  ].map(p => `<div class="map-slot" style="opacity:.5;cursor:default;pointer-events:none;">
    <div class="slot-name">${p.name}</div>
    <div class="slot-updated">${p.dates}</div>
    <span class="slot-badge upcoming">upcoming</span>
  </div>`).join('');

  const panel = $('content-panel');
  panel.className = 'content-panel active map-mode';
  panel.innerHTML = `
    <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto;">
      <div style="text-align:center;margin-bottom:36px;">
        <span style="font-family:var(--font-hand);font-size:clamp(32px,4vw,52px);color:#c9fff5;">choose a season</span>
      </div>
      <div class="map-grid">${slots}${placeholders}</div>
    </div>`;
}

async function selectSeason(idx){
  const tpl = window._cosmicSeasonList?.[idx];
  if (!tpl) return;
  await openSeason(tpl);
}

async function openSeason(tpl){
  activeTemplate = tpl;
  activeMapData  = tpl.map_data;
  await ensureCosmicGame(tpl);
  if (!activeGameId){ showStatus('could not open this season — try again','#E8478B'); return; }
  await loadProgress();
  renderSeasonMap();
}

// Clone the season template into a per-user games row exactly once.
async function ensureCosmicGame(tpl){
  const season = tpl.map_data?.season || tpl.season;
  let game=null;
  try {
    const { data } = await sb.from('games').select('*')
      .eq('user_id', currentUser.id).eq('map_type','cosmic');
    game = (data||[]).find(g => g.map_data?.season === season) || null;
  } catch(e){}

  if (!game){
    try {
      const { data, error } = await sb.from('games').insert({
        user_id: currentUser.id,
        map_name: tpl.title || season,
        map_type: 'cosmic',
        map_data: tpl.map_data,     // carries season + phases; map_data->>'season' powers the unique index
        status: 'active',
      }).select().single();
      if (error) throw error;
      game = data;
    } catch(err){
      // Surface the real reason (constraint, RLS, etc.) — don't hide it.
      console.error('[cosmic clone] games insert failed:', err?.message || err, err);
      // A unique-index race is the one benign case: re-fetch the row that won.
      try {
        const { data } = await sb.from('games').select('*')
          .eq('user_id', currentUser.id).eq('map_type','cosmic');
        game = (data||[]).find(g => g.map_data?.season === season) || null;
      } catch(e){}
    }
  }
  if (game){ activeGameId = game.id; activeMapData = game.map_data || activeMapData; }
}

// Which phases are already lived (have a character row) + the season board.
async function loadProgress(){
  completedSet = new Set();
  completedData = new Map();
  try {
    const { data } = await sb.from('cosmic_matrix')
      .select('map_phase, character_data')
      .eq('game_id', activeGameId).eq('user_id', currentUser.id);
    (data||[]).forEach(r=>{
      if (r.character_data){
        completedSet.add(r.map_phase);
        completedData.set(r.map_phase, r.character_data);
      }
    });
  } catch(e){}
  try {
    const { data } = await sb.from('cosmic_bingo')
      .select('bingo_data').eq('game_id', activeGameId).eq('user_id', currentUser.id).maybeSingle();
    cosmicBoard = data?.bingo_data || { marked:null };
  } catch(e){ cosmicBoard = { marked:null }; }
}

  { tint:'#c9b3e7', feelings:['shadows','worry','fear','depression','regret'] },
  { tint:'#b6e6cf', feelings:['surprise','curiosity','inspiration','excitement','courage'] },
  { tint:'#a0d7e6', feelings:['anger','avoidance','bitterness','apathy','shock'] },
];
function tintFromLocation(loc){
  if (!loc) return null;
  const words = loc.trim().toLowerCase().split(/\s+/);
  for (const cat of WEATHER_CATS){
    if (words.some(w => cat.feelings.includes(w))) return cat.tint;
  }
  return null;
}

function buildSeasonMapSVG(){
  const ps = phases();
  _mapPhases = ps;
  const N  = ps.length;
  if (!N) return '<div style="color:#c9fff5;font-family:var(--font-hand);padding:40px;text-align:center;">no phases yet</div>';

  const W=800, H=540, CX=400, CY=272, RX=285, RY=198, R=33;
  const score = Array.isArray(cosmicBoard?.marked)
    ? cosmicBoard.marked.filter((v,i)=>v && i!==12).length : 0;

  // ── defs: filters + gradients ──────────────────────────────
  let defs = `<defs>
    <filter id="cm-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="cm-node-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cm-meter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8478B"/>
      <stop offset="100%" stop-color="#f3a0c4"/>
    </linearGradient>`;

  // clip paths + tint gradients for all nodes
  ps.forEach((ph,i)=>{
    const x=nodeX(i,N,CX,RX), y=nodeY(i,N,CY,RY);
    const done=completedSet.has(ph.map_phase);
    const open=isOpen(ph);
    if (done || open){
      defs += `<clipPath id="nc${i}"><circle cx="${x}" cy="${y}" r="${R}"/></clipPath>`;
      const charData = done ? (completedData.get(ph.map_phase)||{}) : {};
      const tint = (done ? tintFromLocation(ph.location) : null) || '#c9fff5';
      const op   = done ? 0.85 : 0.4;
      defs += `<radialGradient id="hg${i}" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="${tint}" stop-opacity="${op}"/>
        <stop offset="45%"  stop-color="${tint}" stop-opacity="${+(op*0.6).toFixed(2)}"/>
        <stop offset="100%" stop-color="${tint}" stop-opacity="0"/>
      </radialGradient>`;
    }
  });
  defs += '</defs>';

  // ── aurora rings ───────────────────────────────────────────
  const aurora = [
    `<ellipse cx="${CX}" cy="${CY}" rx="${RX+80}" ry="${RY+55}" fill="none" stroke="#7b3fa0" stroke-width="160" opacity="0.22" filter="url(#cm-blur)"/>`,
    `<ellipse cx="${CX}" cy="${CY}" rx="${RX+20}" ry="${RY+14}" fill="none" stroke="#3a8aaa" stroke-width="90" opacity="0.28" filter="url(#cm-blur)"/>`,
    `<ellipse cx="${CX}" cy="${CY}" rx="${RX-10}" ry="${RY-7}" fill="none" stroke="#c9fff5" stroke-width="40" opacity="0.14" filter="url(#cm-blur)"/>`,
  ].join('');

  // ── season progress meter (top-right) ──────────────────────
  const MX=596, MY=4, MW=200, MH=40, barW=MW-28;
  const fillW = Math.round((score/24)*barW);
  const meter = `<g font-family="ZoesHandwriting,cursive">
    <rect x="${MX}" y="${MY}" width="${MW}" height="${MH}" rx="2" fill="rgba(201,255,245,0.10)" stroke="rgba(201,255,245,0.28)" stroke-width="1"/>
    <text x="${MX+10}" y="${MY+13}" font-size="9" fill="rgba(201,255,245,0.7)" letter-spacing="1.5">SEASON PROGRESS</text>
    <rect x="${MX+10}" y="${MY+19}" width="${barW}" height="12" rx="1" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    ${fillW>0?`<rect x="${MX+10}" y="${MY+19}" width="${fillW}" height="12" rx="1" fill="url(#cm-meter)"/>`:''}
    <text x="${MX+MW-8}" y="${MY+35}" text-anchor="end" font-size="9" fill="rgba(201,255,245,0.7)">${score} of 24</text>
  </g>`;

  // ── season title (top-left) ────────────────────────────────
  const titleText = (activeTemplate?.title||'cosmic season').replace(/\s+\d{4}$/,'');
  const title = `<text x="4" y="36" font-family="ZoesHandwriting,cursive" font-size="clamp(38px,4vw,46px)" fill="rgba(201,255,245,0.85)">${escSvg(titleText)}</text>`;

  // ── nodes ──────────────────────────────────────────────────
  let nodes = '';
  ps.forEach((ph,i)=>{
    const x = nodeX(i,N,CX,RX), y = nodeY(i,N,CY,RY);
    const done = completedSet.has(ph.map_phase);
    const open = isOpen(ph);
    const isCur = ph.map_phase === currentPhaseKey();
    const isJust = ph.map_phase === justDoneKey;

    // label: wrap long names at ~16 chars
    const loc = ph.location || ph.map_phase;
    const labelLines = wrapLabel(loc, 16);
    const labelY = y + R + 14;
    const labelFill = done ? 'rgba(255,255,255,0.9)' : open ? 'rgba(201,255,245,0.75)' : 'rgba(255,255,255,0.28)';
    const labelSvg = labelLines.map((ln,li)=>
      `<text x="${x}" y="${labelY + li*13}" text-anchor="middle" font-family="ZoesHandwriting,cursive" font-size="11" fill="${labelFill}" pointer-events="none">${escSvg(ln)}</text>`
    ).join('');

    const terrainUrl = terrainFromLocation(ph.location);
    const terrainImg = terrainUrl
      ? `<image href="${terrainUrl}" x="${x-R}" y="${y-R}" width="${R*2}" height="${R*2}" preserveAspectRatio="xMidYMid meet" clip-path="url(#nc${i})" pointer-events="none"/>`
      : '';

    if (done){
      const charData = completedData.get(ph.map_phase) || {};
      const tint = tintFromLocation(ph.location) || '#c9fff5';

      nodes += `<g onclick="handleMapClick(${i})" style="cursor:pointer">
        <circle cx="${x}" cy="${y}" r="${R+48}" fill="url(#hg${i})" pointer-events="none"/>
        <circle cx="${x}" cy="${y}" r="${R}" fill="transparent"/>
        ${terrainImg || `<circle cx="${x}" cy="${y}" r="${R}" fill="${tint}" fill-opacity="0.35" pointer-events="none"/>`}
        ${isJust?`<circle cx="${x}" cy="${y}" r="${R+6}" fill="none" stroke="${tint}" stroke-width="1.5" opacity="0.5" pointer-events="none"/>`:''}
        ${labelSvg}
      </g>`;
    } else if (open){
      nodes += `<g onclick="handleMapClick(${i})" style="cursor:pointer">
        <circle cx="${x}" cy="${y}" r="${R+48}" fill="url(#hg${i})" pointer-events="none"/>
        <circle cx="${x}" cy="${y}" r="${R}" fill="transparent" stroke="#c9fff5" stroke-width="1.8" ${isCur?'':'stroke-dasharray="5 3"'}/>
        ${terrainImg}
        <text x="${x}" y="${y+5}" text-anchor="middle" dominant-baseline="middle" font-family="ZoesHandwriting,cursive" font-size="14" fill="rgba(201,255,245,0.9)" pointer-events="none">${escSvg(ph.phase||String(i+1))}</text>
        ${labelSvg}
      </g>`;
    } else {
      nodes += `<g pointer-events="none">
        <circle cx="${x}" cy="${y}" r="${R}" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" stroke-dasharray="4 3"/>
        <text x="${x}" y="${y+5}" text-anchor="middle" dominant-baseline="middle" font-family="ZoesHandwriting,cursive" font-size="12" fill="rgba(255,255,255,0.28)">${escSvg(ph.phase||String(i+1))}</text>
        ${labelSvg}
      </g>`;
    }
  });

  // update fixed HTML overlays
  const titleEl = document.getElementById('map-season-title');
  if (titleEl) titleEl.textContent = titleText;
  const scoreEl = document.getElementById('map-score-fill');
  const scoreLabel = document.getElementById('map-score-label');
  if (scoreEl) scoreEl.style.width = Math.round((score/24)*100)+'%';
  if (scoreLabel) scoreLabel.textContent = score+' of 24';

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;overflow:visible;">
    ${defs}${aurora}${nodes}
  </svg>`;
}

function nodeX(i,N,cx,rx){ return Math.round(cx + rx * Math.cos(2*Math.PI*i/N - Math.PI/2)); }
function nodeY(i,N,cy,ry){ return Math.round(cy + ry * Math.sin(2*Math.PI*i/N - Math.PI/2)); }
function wrapLabel(str, maxLen){
  if (str.length <= maxLen) return [str];
  const mid = str.lastIndexOf(' ', Math.floor(str.length/2)+4);
  if (mid <= 0) return [str];
  return [str.slice(0,mid), str.slice(mid+1)];
}
function escSvg(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return (s||'').replace(/'/g,"\\'"); }

// ── PHASE JOURNAL POP-OUT (read-only, completed phases) ──────
async function showPhaseJournal(phaseKey){
  const ph = phaseByKey(phaseKey);
  $('pj-title').textContent = ph?.location || phaseKey;
  $('pj-meta').textContent  = ph ? (ph.sign + (ph.transits?.length ? ' · '+ph.transits.length+' transit'+(ph.transits.length>1?'s':'') : '')) : '';
  $('pj-messages').innerHTML = `<div class="jrc-empty">loading…</div>`;
  $('pj-overlay').classList.add('open');

  try {
    const { data } = await sb.from('cosmic_matrix')
      .select('journal_messages,updated_at')
      .eq('game_id',activeGameId).eq('map_phase',phaseKey).eq('user_id',currentUser.id)
      .maybeSingle();
    const msgs = jrcRowMessages(data||{});
    const container = $('pj-messages');
    if (!msgs.length){
      container.innerHTML = `<div class="jrc-empty">no notes for this phase yet.</div>`;
      return;
    }
    container.innerHTML = '';
    const _pjIdx = phases().map(p=>p.map_phase).indexOf(phaseKey);
    const _pjSide = _pjIdx % 2 === 0 ? 'left' : 'right';
    const _pjChar = completedData.get(phaseKey) || null;
    const _pjLoc  = ph?.location || '';
    msgs.forEach(msg=>{
      jrcMaybeDivider(container, jrcDay(msg.created_at||data.updated_at), _pjLoc);
      container.appendChild(renderJournalMessage(msg, _pjSide, _pjChar));
    });
    container.scrollTop = container.scrollHeight;
  } catch(e){
    console.error('[phase journal]',e);
    $('pj-messages').innerHTML = `<div class="jrc-empty">couldn't load notes.</div>`;
  }
}
function closePhaseJournal(){ $('pj-overlay').classList.remove('open'); }

let _redoPhaseKey = null;

function redoPhase(){

  closePhaseJournal();

  activePhase = key;
  stepCharacter();
}

// ── JOURNAL HELPERS ──────────────────────────────────────────
function jrcEscape(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jrcTime(iso){ return new Date(iso||Date.now()).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function jrcDay(iso){ return new Date(iso||Date.now()).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function jrcRowMessages(row){ const arr=Array.isArray(row?.journal_messages)?row.journal_messages:[]; return arr.slice().sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0)); }

function buildAvatar(charData){
  if (!charData) return '<div class="jrc-avatar"></div>';
  const layers = ['body','eyes','mouth','hair','shoes','acc'];
  const imgs = layers.map(k => charData[k] && CHAR_FULL_ASSETS[charData[k]]
    ? `<img src="${CHAR_FULL_ASSETS[charData[k]]}" alt="">`
    : '').join('');
  return `<div class="jrc-avatar">${imgs}</div>`;
}

function renderJournalMessage(msg, side, charData){
  const wrap=document.createElement('div');
  wrap.className='jrc-msg-wrap '+(side==='right'?'right':'left');
  const img=msg.image_url?`<img src="${jrcEscape(msg.image_url)}" alt="" onerror="this.style.display='none'">`:''
  const txt=msg.text?`<span class="jrc-bubble-txt">${jrcEscape(msg.text)}</span>`:'';
  const avatar=buildAvatar(charData);
  wrap.innerHTML=`${avatar}<div class="jrc-msg"><div class="jrc-bubble">${img}${txt}</div><div class="jrc-meta">${jrcTime(msg.created_at)}</div></div>`;
  return wrap;
}

function jrcScrollBottom(){ const c=document.getElementById('jrc-messages'); if(c) c.scrollTop=c.scrollHeight; }

function jrcMaybeDivider(container, dayLabel, location){
  const last=[...container.querySelectorAll('.jrc-date-divider span')].pop();
  if(last&&last.textContent===dayLabel) return;
  const div=document.createElement('div');
  div.className='jrc-date-divider';
  const locHtml=location?`<span class="divider-location">${jrcEscape(location)}</span> · `:'';
  div.innerHTML=`${locHtml}<span>${dayLabel}</span>`;
  container.appendChild(div);
}

function showJournalStatus(msg,ok){
  const el=document.getElementById('jrc-status'); if(!el) return;
  el.textContent=msg; el.className='jrc-status '+(ok?'ok':'err');
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.textContent=''; el.className='jrc-status'; },3000);
}

async function loadJournalEntries(){
  journal.entries=[]; journal.pendingImage=null;
  const dateEl=document.getElementById('jrc-date');
  if(dateEl) dateEl.textContent=jrcDay();
  if(!currentUser||!activeGameId) return;

  let rows=[];
  try {
    const { data } = await sb.from('cosmic_matrix')
      .select('map_phase,journal_messages,matrix_images,updated_at')
      .eq('game_id',activeGameId).eq('user_id',currentUser.id)
      .order('updated_at',{ascending:true});
    rows=data||[];
  } catch(e){ console.error('[journal load]',e); }

  rows=rows.filter(r=>r.map_phase===activePhase||jrcRowMessages(r).length);
  journal.entries=rows;

  const container=document.getElementById('jrc-messages');
  const empty=document.getElementById('jrc-empty');
  if(!container) return;
  container.querySelectorAll('.jrc-msg,.jrc-date-divider').forEach(e=>e.remove());

  // Build a phase order index so alternation is consistent across sessions
  const phaseOrder = phases().map(p=>p.map_phase);
  const phaseLocation = Object.fromEntries(phases().map(p=>[p.map_phase, p.location||'']));

  let anyMsg=false;
  rows.forEach(row=>{
    const phaseIdx = phaseOrder.indexOf(row.map_phase);
    const side = phaseIdx % 2 === 0 ? 'left' : 'right';
    const charData = completedData.get(row.map_phase) || null;
    const location = phaseLocation[row.map_phase] || '';
    jrcRowMessages(row).forEach(msg=>{
      jrcMaybeDivider(container, jrcDay(msg.created_at||row.updated_at), location);
      container.appendChild(renderJournalMessage(msg, side, charData));
      anyMsg=true;
    });
  });
  if(empty) empty.style.display=anyMsg?'none':'block';
  jrcScrollBottom();
}

function onJournalImagePicked(e){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    journal.pendingImage={file,base64:ev.target.result};
    document.getElementById('jrc-img-preview').src=ev.target.result;
    document.getElementById('jrc-img-chip').classList.add('has-img');
  };
  reader.readAsDataURL(file);
}

function removeJournalImage(){
  journal.pendingImage=null;
  const chip=document.getElementById('jrc-img-chip');
  if(chip){ chip.classList.remove('has-img'); document.getElementById('jrc-img-preview').src=''; }
  const f=document.getElementById('jr-file'); if(f) f.value='';
}

async function sendJournalMessage(){
  const msgEl=document.getElementById('jrc-msg');
  const sendBtn=document.getElementById('jrc-send');
  const text=(msgEl?.value||'').trim();
  if(!text&&!journal.pendingImage) return false;
  if(!(currentUser&&activeGameId&&activePhase)){ showJournalStatus('not signed in',false); return false; }
  if(sendBtn) sendBtn.disabled=true;

  let imageUrl=null;
  if(journal.pendingImage){
    try {
      const file=journal.pendingImage.file;
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
      const path=`${currentUser.id}/${activeGameId}/${activePhase}/journal-${crypto.randomUUID()}.${ext}`;
      const { error:upErr } = await sb.storage.from(MATRIX_PHOTO_BUCKET).upload(path,file,{contentType:file.type,upsert:false});
      if(upErr) throw upErr;
      const { data:pub } = sb.storage.from(MATRIX_PHOTO_BUCKET).getPublicUrl(path);
      imageUrl=pub?.publicUrl||null;
    } catch(err){
      console.error('[journal image]',err);
      showJournalStatus("couldn't attach photo — try again",false);
      if(sendBtn) sendBtn.disabled=false;
      return false;
    }
  }

  const message={id:crypto.randomUUID(),text,image_url:imageUrl,created_at:new Date().toISOString()};

  let currentRow={};
  try {
    const { data } = await sb.from('cosmic_matrix')
      .select('journal_messages,matrix_images').eq('game_id',activeGameId).eq('map_phase',activePhase).maybeSingle();
    currentRow=data||{};
  } catch(e){}
  const messages=(Array.isArray(currentRow.journal_messages)?currentRow.journal_messages:[]).concat([message]);
  let imgs=Array.isArray(currentRow.matrix_images)?currentRow.matrix_images:[];
  if(imageUrl) imgs=imgs.concat([{url:imageUrl,source:'journal'}]);

  const loc=phaseByKey(activePhase);
  try {
    const { error } = await sb.from('cosmic_matrix').upsert({
      game_id:activeGameId, user_id:currentUser.id, map_phase:activePhase,
      journal_messages:messages, matrix_images:imgs,
      location_data:{sign:loc?.sign||null,location:loc?.location||null,opens_utc:loc?.opens_utc||null},
      updated_at:new Date().toISOString(),
    },{onConflict:'game_id,map_phase'});
    if(error) throw error;
  } catch(err){
    console.error('[journal send]',err);
    showJournalStatus('something went wrong — try again',false);
    if(sendBtn) sendBtn.disabled=false;
    return false;
  }

  const container=document.getElementById('jrc-messages');
  const empty=document.getElementById('jrc-empty');
  if(empty) empty.style.display='none';
  const _phaseIdx = phases().map(p=>p.map_phase).indexOf(activePhase);
  const _side = _phaseIdx % 2 === 0 ? 'left' : 'right';
  jrcMaybeDivider(container, jrcDay(message.created_at), phaseByKey(activePhase)?.location||'');
  container.appendChild(renderJournalMessage(message, _side, completedData.get(activePhase)||null));
  if(msgEl) msgEl.value='';
  removeJournalImage();
  document.getElementById('jrc-confirm')?.classList.remove('open');
  if(sendBtn) sendBtn.disabled=false;
  showJournalStatus('saved ✓',true);
  jrcScrollBottom();
  if(msgEl) msgEl.focus();
  return true;
}

async function saveJournalEntry(){
  const msgEl=document.getElementById('jrc-msg');
  const hasUnsent=!!((msgEl&&msgEl.value.trim())||journal.pendingImage);
  if(hasUnsent){
    document.getElementById('jrc-confirm')?.classList.add('open');
    showJournalStatus('you have unsent notes',false);
    setSave(true,'continue →');
    return;
  }
  finishJournal();
}
function finishJournal(){
  document.getElementById('jrc-confirm')?.classList.remove('open');
  setSave(false);
  stepDone();
}
async function confirmSendAndContinue(){ const ok=await sendJournalMessage(); if(ok) finishJournal(); }
function confirmSkipUnsent(){
  const msgEl=document.getElementById('jrc-msg'); if(msgEl) msgEl.value='';
  removeJournalImage(); finishJournal();
}

function stepDone(){
  justDoneKey = activePhase;
  completedSet.add(activePhase);
  setSave(false);
  showStatus('phase complete ✦', '#E8478B');
  renderSeasonMap();
}

// ── SAVE & CONTINUE — matrix owns every write ───────────────
async function saveAndContinue(){
  const btn = $('save-btn'); btn.disabled = true; btn.textContent='saving…';

  if (currentStep === 'journal'){ await saveJournalEntry(); return; }

  const iframe = $('game-iframe');
  if (!iframe){ btn.disabled=false; return; }
  if (currentStep === 'bingo') _bingoRequested = true;
  iframe.contentWindow.postMessage({ type:'request_state' }, '*');
  clearTimeout(window._fb);
  window._fb = setTimeout(()=>{ if (btn.disabled){ btn.disabled=false;
    btn.innerHTML='continue →'; showStatus('something went wrong — try again','#E8478B'); } }, 5000);
}

// ── MESSAGE HANDLERS — iframes report, matrix writes ────────
window.addEventListener('message', async e=>{
  const msg = e.data || {}; if (!msg.type) return;

  // character builder loaded
  if (msg.type==='iframe_ready' && msg.game==='character'){
    if (currentStep==='character'){ const b=$('save-btn'); if(b){ b.disabled=false; b.innerHTML='continue →'; } }
    return;
  }

  // cosmic bingo loaded — hydrate it with the season board
  if (msg.type==='cosmic_bingo_ready'){
    const iframe=$('game-iframe');
    if (iframe && Array.isArray(cosmicBoard?.marked)){
      iframe.contentWindow.postMessage({ type:'load_state', marked:cosmicBoard.marked }, '*');
    }
    return;
  }

  // character state → cosmic_matrix (idempotent on game_id, map_phase)
  if (msg.type==='char_state'){
    const charState = msg.state || {};
    if (!charState.body){ showStatus('pick a body first!','#E8478B'); const b=$('save-btn'); b.disabled=false; b.innerHTML='continue →'; return; }
    const loc = phaseByKey(activePhase);
    try {
      const { error } = await sb.from('cosmic_matrix').upsert({
        game_id: activeGameId, user_id: currentUser.id, map_phase: activePhase,
        character_data: charState,
        location_data: { sign:loc?.sign||null, location:loc?.location||null, opens_utc:loc?.opens_utc||null },
        updated_at: new Date().toISOString(),
      }, { onConflict:'game_id,map_phase' });
      if (error) throw error;
      completedData.set(activePhase, charState);
      showStatus('character saved ✓','#6ab86a'); setSave(false); stepBingo();
    } catch(err){ console.error('[char save]',err); showStatus('save failed','#E8478B'); const b=$('save-btn'); b.disabled=false; b.innerHTML='continue →'; }
    return;
  }

  // season bingo board → cosmic_bingo (one row per user+game)
  if (msg.type==='bingo_state'){
    const { marked, score } = msg;
    cosmicBoard = { marked, score };
    // Live notifyParent updates: just keep in-memory, no advance
    if (!_bingoRequested) return;
    _bingoRequested = false;
    try {
      const { error } = await sb.from('cosmic_bingo').upsert({
        game_id: activeGameId, user_id: currentUser.id,
        bingo_data: { marked, score }, updated_at: new Date().toISOString(),
      }, { onConflict:'user_id,game_id' });
      if (error) throw error;
      showStatus('board saved ✓','#6ab86a'); setSave(false); stepJournal();
    } catch(err){ console.error('[bingo save]',err); showStatus('save failed','#E8478B'); _bingoRequested=false; const b=$('save-btn'); b.disabled=false; b.innerHTML='continue →'; }
    return;
  }
});

init();
</script>

<div class="pj-overlay" id="pj-overlay" onclick="if(event.target===this)closePhaseJournal()">
  <div class="pj-window">
    <div class="pj-titlebar">
      <span id="pj-title"></span>
      <button class="pj-close" onclick="closePhaseJournal()">✕</button>
    </div>
    <div class="pj-meta" id="pj-meta"></div>
    <div class="pj-messages" id="pj-messages"></div>
    <div class="pj-footer">
      <button class="pj-redo-btn" onclick="redoPhase()">redo this phase →</button>
    </div>
  </div>
</div>
