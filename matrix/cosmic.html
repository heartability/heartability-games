<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<link rel="stylesheet" href="../assets/css/modal.css">
<script src="../assets/js/modal.js" defer></script>
<script src="../assets/js/treasure-map.js"></script>
<link rel="stylesheet" href="../assets/css/nav.css">
<title>Cosmic Matrix — Heartability</title>
<meta name="description" content="Follow how cosmic transits influence your world with the Cosmic Matrix.">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
<style>
@font-face { font-family:"ZoesHandwriting"; src:url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype"); }
@font-face { font-family:"PFPixelscript";  src:url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype"); }
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; }
:root{
  --font-hand:"ZoesHandwriting",cursive;
  --font-pixel:"PFPixelscript",cursive;
  --font-game:"VT323",monospace;
  --blue:#6e83d3; --aqua:#83d2e6; --ink:#000f5a; --cream:#cdd3ec; --pink:#E8478B;
  --line:#111;
  --bw-top:9%; --bw-left:15%; --bw-width:70%; --bw-height:70%;
}
html,body{ width:100vw; height:100dvh; overflow-x:hidden; overflow-y:auto; user-select:none;
  background:url("../assets/elements/cosmic-sky.png") center / cover no-repeat fixed;
  font-family:var(--font-hand); color:var(--ink); }

/* NAV (matches adventure) */
.room-nav{ position:fixed; top:0; left:0; right:0; height:44px; background:#6e83d3;
  border-bottom:2px solid var(--line); z-index:200; display:flex; align-items:center;
  justify-content:space-between; padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(21px,1.6vw,25px); color:#fff; }
.nav-btn{ cursor:pointer; padding:4px 8px; border-radius:2px; transition:background .15s; color:inherit; text-decoration:none; }
.nav-btn:hover{ background:rgba(0,0,0,.08); }
.nav-title{ position:absolute; left:50%; transform:translateX(-50%); pointer-events:none; white-space:nowrap; margin:0; font:inherit; }

/* ── PANEL SCROLL REGION — no-op by default (just a plain wrapper); becomes
   the scroll container for iframe-mode steps on mobile, see the max-width:
   768px block. ── */
.panel-scroll-region{ display:contents; }

/* CONTENT PANEL — sits where the back wall would be (outside: no wall, soft frame) */
.content-panel{ position:fixed; top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height); z-index:10; display:none;
  flex-direction:column; overflow:hidden; }
.content-panel.active{ display:flex; }
.content-panel.active:not(.iframe-mode){ background:transparent; border:none; box-shadow:none; }
/* ── IFRAME PANEL — anchored near the top like every other step, just wider
   than the back-wall proportions so builder UIs have room to breathe. Unlike
   other steps it isn't fixed to the viewport: it sits in normal document
   flow, so if its content runs taller than the screen, the whole page grows
   and scrolls with it (via html/body's overflow-y) instead of clipping into
   its own internal scrollbar — and #save-bar and #char-heart, which follow
   right after it in the DOM, trail along below instead of floating fixed
   on top of it. ── */
.game-iframe{ width:100%; height:70vh; border:none; display:block; flex-shrink:0; }
.content-panel.iframe-mode{
  border:none; box-shadow:none; background:transparent;
  position:relative; top:auto; left:auto;
  width:min(1050px, 94vw); height:auto;
  margin:var(--bw-top) auto 0;
  overflow:visible;
}
.panel-scroll{ width:100%; height:100%; overflow-y:auto; padding:22px; display:flex; flex-direction:column; align-items:center; }

/* HEART + BUBBLE (matches adventure: heart bottom-left, bubble to its RIGHT) */
@keyframes idle-pulse{ 0%,100%{ transform:translateY(0) rotate(-2deg) scale(1);} 50%{ transform:translateY(-8px) rotate(2deg) scale(1.03);} }
.char-heart{ position:fixed; left:4vw; bottom:6vh; width:clamp(100px,14vw,220px); z-index:20; }
.char-heart .char-img{ display:block; width:100%; height:auto; animation:idle-pulse 3.6s ease-in-out 1s infinite; }
.thought-bubble{ position:absolute; left:calc(100% - 8px); bottom:60%;
  min-width:clamp(160px,18vw,260px); max-width:clamp(180px,22vw,300px);
  background:#fff; border:2px solid #000; border-radius:50%; padding:14px 20px;
  font-family:var(--font-hand); font-size:clamp(13px,1.3vw,17px); color:#000;
  text-align:center; line-height:1.5; z-index:21; }

/* ── FLOW TIMER — countdown badge + extend prompt near the heart ── */
.timer-badge {
  position:absolute; top:-74px; left:50%; transform:translateX(-50%);
  background:#fff; border:4px solid var(--blue); border-radius:40px;
  padding:8px 32px; font-family:var(--font-hand); font-size:clamp(30px,3vw,38px);
  color:var(--ink); white-space:nowrap; z-index:401; display:none;
  box-shadow:4px 4px 0 rgba(0,0,0,.15);
}
.timer-badge.active { display:block; }
.timer-badge.warn { color:#E8478B; border-color:#E8478B; animation:timer-warn-pulse 1s ease-in-out infinite; }
@keyframes timer-warn-pulse {
  0%,100% { transform:translateX(-50%) scale(1); }
  50%     { transform:translateX(-50%) scale(1.08); }
}
.timer-extend {
  position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
  width:230px; background:#fff; border:2px solid #E8478B; border-radius:8px;
  padding:12px 14px; font-family:var(--font-hand); font-size:15px; color:#000;
  text-align:center; z-index:402; display:none;
  box-shadow:3px 4px 0 rgba(0,0,0,.15);
}
.timer-extend.active { display:block; }
.timer-extend-msg { margin-bottom:9px; line-height:1.4; }
.timer-extend-btns { display:flex; gap:8px; justify-content:center; }
.timer-extend-btn {
  flex:1; padding:7px 8px; font-family:var(--font-hand); font-size:13px; cursor:pointer;
  border:2px solid #4a5bc4; background:var(--blue); color:#fff; box-shadow:2px 2px 0 #3a4aaa;
  transition:all .05s;
}
.timer-extend-btn:hover { background:#4a5bc4; }
.timer-extend-btn:active { box-shadow:none; transform:translate(2px,2px); }
.timer-extend-btn.ghost { background:none; border-color:#ccc; color:#999; box-shadow:none; }
.timer-extend-btn.ghost:hover { border-color:#E8478B; color:#E8478B; }

/* ── WALL BUTTON — reused for the welcome step's mode choice ── */
.wall-btn {
  padding:14px 40px;
  background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:clamp(17px,1.8vw,23px); color:#fff;
  cursor:pointer; transition:all .05s; min-width:220px; text-align:center;
}
.wall-btn:hover { background:#4a5bc4; }
.wall-btn:active { box-shadow:none; transform:translate(3px,3px); }
.wall-btn.secondary {
  background:none; border-color:#ccc; color:#999; box-shadow:none;
}
.wall-btn.secondary:hover { border-color:var(--blue); color:var(--blue); }

/* ── WELCOME STEP — timed/untimed mode choice before the timed portion ── */
.welcome-panel { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; width:100%; min-height:100%; }
.welcome-title { font-family:var(--font-hand); font-size:clamp(30px,3.2vw,44px); color:#fff; text-align:center; }
.welcome-sub { font-family:var(--font-hand); font-size:clamp(17px,1.7vw,22px); color:var(--ink); text-align:center; margin-top:-8px; }
.welcome-modes { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
.welcome-why {
  font-family:var(--font-hand); font-size:15px; color:var(--ink);
  text-decoration:underline; cursor:pointer; margin-top:2px;
}
.welcome-why:hover { color:#E8478B; }

/* SAVE BAR (matches adventure: floating blue button) */
.save-continue-bar{ position:fixed; bottom:0; left:0; right:0; height:calc(21% - 44px);
  display:none; align-items:center; justify-content:center; z-index:15; pointer-events:none; }
.save-continue-bar.visible{ display:flex; }
.save-continue-btn{ pointer-events:all; padding:14px 40px; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa; font-family:var(--font-hand);
  font-size:clamp(17px,1.8vw,23px); color:#fff; cursor:pointer; transition:all .05s; letter-spacing:.3px; text-transform:lowercase; }
.save-continue-btn:hover{ background:#4a5bc4; }
.save-continue-btn:active{ box-shadow:none; transform:translate(3px,3px); }
.save-continue-btn:disabled{ opacity:.38; cursor:not-allowed; transform:none!important; box-shadow:3px 3px 0 #3a4aaa; }

/* Iframe-mode steps (character builder, bingo) now grow taller than the
   viewport in normal flow (see .content-panel.iframe-mode) — keep the
   continue bar and heart character in flow right after it instead of
   pinned to the viewport bottom/corner, so they trail the frame instead of
   floating on top of it. Mobile keeps its own fixed footer (see the
   max-width:768px block) since that panel scrolls internally instead of
   growing the page. */
@media (min-width:769px) {
  body:has(.content-panel.iframe-mode) .save-continue-bar {
    position: static;
    height: auto;
    padding: 24px 0 12px;
  }
  body:has(.content-panel.iframe-mode) .char-heart {
    position: relative;
    left: auto; bottom: auto;
    margin: 0 0 40px 4vw;
  }
  /* The flow timer badge floats 74px above the heart's own box (see
     .timer-badge) — when it's showing, give the heart extra top margin so
     the badge clears the continue button above instead of sitting on it. */
  body:has(.content-panel.iframe-mode) .char-heart:has(.timer-badge.active) {
    margin-top: 100px;
  }
}

.save-status-bar{ position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
  font-family:var(--font-hand); font-size:16px; color:#6ab86a; z-index:16; pointer-events:none; }

/* SEASON HEADER */
.season-head{ text-align:center; margin-bottom:8px; position:relative; z-index:6; padding-top:56px; }
.season-title{ font-family:var(--font-hand); font-size:clamp(30px,3.4vw,42px); color:#fff; }
.season-sub{ font-family:var(--font-hand); font-size:clamp(15px,1.5vw,18px); letter-spacing:2px; color:rgba(201,255,245,0.7); }

/* TRANSIT SELECTOR — past/future nav buttons + heart-meter icon (links to the
   standalone season bingo board) + today's transit card list */
.transit-nav-btn{ position:fixed; top:7vh; z-index:15; font-family:var(--font-hand);
  font-size:clamp(14px,1.4vw,18px); color:rgba(201,255,245,0.85);
  background:rgba(255,255,255,.08); border:1.5px solid rgba(201,255,245,.4);
  padding:8px 16px; cursor:pointer; transition:background .15s, border-color .15s; }
.transit-nav-btn:hover{ background:rgba(201,255,245,.15); border-color:rgba(201,255,245,.85); }
.transit-nav-btn.past{ left:11vw; }
.transit-nav-btn.future{ right:11vw; }
.transit-heart-icon{ position:fixed; top:1.5vh; right:11vw; z-index:16; width:46px; cursor:pointer; }
.transit-heart-icon .hm-box{ padding:2px; }
.transit-heart-icon .hm-track{ height:34px; }
.transit-today-list{ position:relative; z-index:6; display:flex; flex-direction:column;
  align-items:center; gap:14px; padding:10px 20px 40px; max-width:520px; margin:0 auto; }
.transit-card{ width:min(420px,90%); background:rgba(255,255,255,.08);
  border:1.5px solid rgba(201,255,245,.4); padding:16px 20px; cursor:pointer;
  transition:background .15s, border-color .15s; text-align:center; }
.transit-card:hover{ background:rgba(201,255,245,.12); border-color:rgba(201,255,245,.8); }
.transit-card.just-done{ animation:flash 1.6s ease-out; }
.transit-card-name{ font-family:var(--font-hand); font-size:clamp(20px,2.2vw,28px); color:#fff; }
.transit-card-time{ font-family:var(--font-game); font-size:14px; color:rgba(201,255,245,.7); margin-top:4px; }
.transit-card-badge{ font-family:var(--font-hand); font-size:14px; letter-spacing:.5px; margin-top:8px; }
.transit-card-badge.done{ color:var(--pink); }
.transit-card-badge.open{ color:rgba(201,255,245,.9); }
.transit-empty{ text-align:center; color:rgba(201,255,245,.5); font-family:var(--font-hand);
  font-style:italic; padding:40px 0; }

/* TRANSITS POPUP — shared by the past-transits and future-transits lists */
.transits-row-clickable{ cursor:pointer; }
.transits-row-clickable:hover{ background:rgba(101,121,226,.08); }

/* COSMIC-ONLY MATRIX RENDER TWEAKS — location moves to internal-action
   (bottom-left, see renderMatrix()), this transit's planet glyphs take its
   old external-action spot (top-left), and the shared per-entry bingo
   meter is hidden since bingo is now the standalone cosmic-bingo.html
   season page. Scoped to this page only — matrix-render.js itself is
   untouched, dream/daily keep the shared renderer's original layout. */
.adv-matrix .adv-bingo{ display:none; }
.cosmic-transit-glyphs{ position:absolute; left:27%; top:30%; transform:translate(-50%,-50%);
  display:flex; gap:8px; align-items:center; justify-content:center; z-index:5; pointer-events:none; }
.cosmic-transit-glyph{ width:clamp(30px,4vw,46px); height:clamp(30px,4vw,46px); object-fit:contain;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.4)); }
/* Shared renderer defaults these dark (#3a4aaa / #7a86bb) for dream/daily's
   lighter matrix background — cosmic's is the dark sky, so flip to white. */
.matrix-panel .matrix-date{ color:#fff; }
.adv-matrix .adv-axlbl{ color:#fff; }
.adv-matrix .adv-cap{ color:#fff; }
.transits-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; display:none; align-items:center; justify-content:center; padding:18px; }
.transits-overlay.open{ display:flex; }
.transits-window{ width:min(92vw,420px); max-height:80vh; background:#dfe2ef;
  box-shadow:0 0 0 4px var(--blue), 6px 10px 40px rgba(0,0,0,.35);
  display:flex; flex-direction:column; overflow:hidden; }
.transits-titlebar{ flex-shrink:0; height:38px; background:#cdd3ec; border-bottom:2px solid var(--blue);
  display:flex; align-items:center; justify-content:space-between; padding:0 16px;
  font-family:var(--font-hand); font-size:25px; color:#555; }
.transits-close{ cursor:pointer; font-size:23px; color:#bbb; padding:2px 4px; transition:color .15s; }
.transits-close:hover{ color:#444; }
.transits-body{ flex:1; overflow-y:auto; padding:6px 18px 18px; }
.transits-empty{ text-align:center; color:#aaa; font-family:var(--font-hand); font-style:italic; padding:24px 0; }
.transits-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:10px 0; border-bottom:1px solid rgba(101,121,226,.12);
  font-family:var(--font-hand); font-size:17px; color:#333; }
.transits-row:last-child{ border-bottom:none; }
.transits-row-time{ font-family:var(--font-game); font-size:14px; color:#999; white-space:nowrap; }

/* TIMELINE */
.timeline{ width:100%; max-width:520px; margin:10px auto 0; position:relative; }
.timeline::before{ content:""; position:absolute; left:22px; top:14px; bottom:14px; width:2px;
  background:repeating-linear-gradient(var(--blue) 0 5px, transparent 5px 11px); opacity:.5; }
.node{ display:flex; align-items:center; gap:14px; padding:9px 10px; margin:5px 0; position:relative; border:2px solid transparent; }
.node-dot{ width:30px; height:30px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-hand); font-size:20px; border:2px solid var(--blue); background:var(--cream); color:var(--blue); z-index:1; }
.node-body{ flex:1; min-width:0; }
.node-loc{ font-family:var(--font-hand); font-size:clamp(20px,2vw,23px); color:var(--ink); line-height:1.15; }
.node-meta{ font-family:var(--font-hand); font-size:clamp(14px,1.4vw,17px); color:var(--blue); margin-top:1px; }
.node-badge{ font-family:var(--font-hand); font-size:15px; letter-spacing:.5px; padding:2px 8px; flex-shrink:0; }
.node.available{ cursor:pointer; }
.node.available:hover{ border-color:var(--aqua); background:#eef6f9; }
.node.available .node-badge{ color:var(--aqua); }
.node.completed{ cursor:pointer; }
.node.completed .node-dot{ background:var(--pink); border-color:var(--pink); color:#fff; }
.node.completed:hover{ border-color:var(--pink); background:#fbe9f1; }
.node.completed .node-badge{ color:var(--pink); }
.node.locked{ opacity:.45; }
.node.locked .node-dot{ border-color:#9aa0b8; color:#9aa0b8; }
.node.locked .node-badge{ color:#9aa0b8; }
.node.current .node-dot{ box-shadow:0 0 0 3px rgba(131,210,230,.55); }
.node.just-done{ animation:flash 1.6s ease-out; }
@keyframes flash{ 0%{ background:#fff0a0;} 100%{ background:transparent;} }

/* GATE */
.gate{ margin:auto; max-width:420px; text-align:center; background:#eef1fa; border:2px solid var(--blue); padding:28px 24px; }
.gate-title{ font-family:var(--font-hand); font-size:32px; color:var(--ink); margin-bottom:10px; }
.gate-text{ font-family:var(--font-hand); font-size:20px; color:var(--ink); line-height:1.4; margin-bottom:18px; }
.gate-btn{ font-family:var(--font-hand); font-size:21px; color:#fff; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa; padding:10px 24px; cursor:pointer; }
.gate-btn:hover{ background:#4a5bc4; }
.gate-btn:active{ box-shadow:none; transform:translate(3px,3px); }

/* PICKER GRID — shared by the planet selector and the sign selector */
.picker-grid{ display:flex; flex-wrap:wrap; gap:30px 26px; justify-content:center; padding:10px; max-width:840px; }
.picker-grid.grid-3{ display:grid; grid-template-columns:repeat(3, 126px); gap:34px 46px; justify-content:center; }
.picker-disc img{ width:48px; height:48px; object-fit:contain; }
.picker-slot{ position:relative; width:126px; display:flex; flex-direction:column; align-items:center; gap:9px; }
.picker-halo{ position:absolute; top:38px; left:50%; width:170px; height:170px; transform:translate(-50%,-50%);
  border-radius:50%; pointer-events:none; filter:blur(4px); opacity:.55; transition:opacity .2s; }
.picker-disc{ position:relative; width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:44px; color:#fff; background:rgba(10,10,25,0.32); border:2px solid rgba(255,255,255,0.4);
  transition:transform .15s, border-color .15s, box-shadow .15s; }
.picker-name{ font-family:var(--font-hand); font-size:16px; letter-spacing:.5px; color:rgba(201,255,245,0.85); text-align:center; }
.picker-soon{ font-family:var(--font-hand); font-size:9px; letter-spacing:1.5px; color:rgba(201,255,245,0.4); text-transform:uppercase; }
.picker-slot.unlocked .picker-disc{ cursor:pointer; border-color:rgba(255,255,255,0.65); }
.picker-slot.unlocked:hover .picker-disc{ transform:translateY(-4px) scale(1.06); box-shadow:0 8px 20px rgba(0,0,0,.35); }
.picker-slot.unlocked:hover .picker-halo{ opacity:.85; }
.picker-slot.locked .picker-halo{ opacity:.18; filter:blur(4px) grayscale(.5); }
.picker-slot.locked .picker-disc{ opacity:.45; cursor:default; }
.picker-slot.locked .picker-name{ color:rgba(201,255,245,0.4); }

/* JOURNAL (chat-style, matches adventure) */
.jrc-panel{ padding:8px; overflow:hidden; justify-content:center; align-items:center; }
.jrc-window{ width:75%; height:75%; background:#dfe2ef;
  box-shadow:0 0 0 4px var(--blue), 6px 10px 40px rgba(0,0,0,.35);
  display:flex; flex-direction:column; overflow:hidden; }
.jrc-titlebar{ flex-shrink:0; height:38px; background:#cdd3ec; border-bottom:2px solid var(--blue);
  display:flex; align-items:center; justify-content:center; position:relative;
  font-family:var(--font-hand); font-size:clamp(16px,1.5vw,22px); color:#333; letter-spacing:.5px; }
.jrc-date{ position:absolute; right:12px; font-size:clamp(10px,1vw,14px); color:#999; font-family:var(--font-hand); }
.jrc-messages{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:9px; scroll-behavior:smooth; }
.jrc-msg-wrap{ display:flex; align-items:flex-start; gap:8px; }
.jrc-msg-wrap.right{ flex-direction:row-reverse; align-self:flex-end; }
.jrc-msg-wrap.left{ flex-direction:row; align-self:flex-start; }
.jrc-avatar{ flex-shrink:0; width:52px; height:52px; border-radius:50%; overflow:hidden; position:relative; border:1.5px solid #ccc; background:#e5e8f5; }
.jrc-avatar img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

/* Step header bar — back link atop steps reached via "continue" */
.step-panel {
  width:100%; height:100%; min-height:0;
  display:flex; flex-direction:column;
  align-items: center; justify-content: center;
  overflow-y: auto; padding:20px;
  font-family:var(--font-hand);
}
.step-header {
  width: 100%; display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; flex-shrink:0;
}
.step-header-title { font-size:25px; color:#fff; }
.step-back { font-size:16px; color:#fff; cursor:pointer; }
.step-back:hover { text-decoration:underline; }

/* Archetype picker — reuse a saved cast member or build a new one */
.arch-picker-loading { padding: 20px; font-family: var(--font-hand); color: #7a86bb; }
.arch-picker {
  width: 100%; flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px;
}
.arch-picker-title { font-family: var(--font-hand); font-size: clamp(25px,2.4vw,35px); color: #fff; text-align: center; }
.arch-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(120px, 180px));
  gap: 12px;
  padding: 4px;
  justify-content: center;
}
@media (max-width:600px) { .arch-grid { grid-template-columns: repeat(2, 1fr); } }
.arch-card {

/* ── LOCATION BUILDER — user builds their own experience of a transit
   (terrain + emotional climate), ported from daily.html's dayquest builder.
   .loc-overlay spans the full viewport but stays pointer-events:none so nav
   clicks pass through it (see project memory on the daily-matrix nav-blocked
   bug); .loc-scroll is the actual interactive/scrollable region. ── */
.loc-overlay { position:fixed; inset:0; z-index:300; background:none; display:none; pointer-events:none; }
.loc-overlay.open { display:block; }
.loc-scroll {
  position:absolute; top:var(--bw-top); left:0; right:0; bottom:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; align-items:center;
  padding:0 0 40px; pointer-events:auto;
}
.loc-card {
  width:var(--bw-width); height:auto; min-height:var(--bw-height); max-height:none;
  padding:18px 20px; font-family:var(--font-hand);
  background:#dfe2ef; border:3px solid var(--blue);
  box-shadow:0 0 0 3px var(--blue), 6px 10px 40px rgba(0,0,0,.4);

.loc-body { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto 1fr; gap:16px 24px; align-items:start; }
@media (max-width:640px){ .loc-body { grid-template-columns:1fr; } }
.loc-preview-col { min-width:0; display:flex; flex-direction:column; align-items:center; }
.loc-terrain-col { min-width:0; }
.loc-climate-col { grid-column:1 / -1; min-width:0; }
.loc-map-frame {
  width:min(100%, 300px); aspect-ratio:1/1; background:#cdd3ec;
  border:2px solid var(--blue); border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:#5465c5; border-top-color:#5465c5;
}
.loc-map-frame svg { width:100%; height:100%; display:block; }
.loc-section-label { font-size:22px; color:#7a86bb; letter-spacing:.4px; margin:0 0 8px; }

.loc-terrain {

.loc-climate {

  border-left-color:#5465c5; border-top-color:#5465c5;
}
.loc-climate.sunny { background:#f2e6a8; border-color:#715f04; }
.loc-climate.rainy { background:#ae87e2; border-color:#260156; }
.loc-climate.windy { background:#a3eac9; border-color:#046957; }
.loc-climate.snowy { background:#6cd1ea; border-color:#033f50; }
.loc-climate-head { font-size:clamp(30px,3vw,41px); margin-bottom:8px; }
.loc-climate.sunny .loc-climate-head { color:#715f04; }
.loc-climate.rainy .loc-climate-head { color:#260156; }
.loc-climate.windy .loc-climate-head { color:#046957; }
.loc-climate.snowy .loc-climate-head { color:#033f50; }
.loc-chips { display:flex; flex-wrap:wrap; gap:5px; }
.loc-chip {
  padding:5px 14px; font-family:var(--font-hand); font-size:clamp(18px,1.8vw,25px); letter-spacing:.4px;
  cursor:pointer; user-select:none; border:2px solid; transition:filter .1s;
}
.loc-chip:hover { filter:brightness(.92); }
.loc-chip.active { outline:2px solid #111; outline-offset:1px; }
.loc-climate.sunny .loc-chip { background:#f8edb8; border-color:#715f04; color:#715f04; }
.loc-climate.rainy .loc-chip { background:#c9b3e7; border-color:#260156; color:#260156; }
.loc-climate.windy .loc-chip { background:#b6e7d0; border-color:#046957; color:#046957; }
.loc-climate.snowy .loc-chip { background:#a0d7e6; border-color:#033f50; color:#033f50; }
.loc-foot { display:none; align-items:center; justify-content:center; margin-top:20px; flex-shrink:0; pointer-events:none; }
.loc-overlay.open .loc-foot { display:flex; }
.loc-foot > * { pointer-events:all; }

/* MAP MODE — panel goes transparent so sky shows through, and fills the
   whole viewport below the nav instead of the --bw-* "wall panel" box other
   steps use — the zodiac grid and transit selector are full-screen sky
   experiences, not bounded content, so they should resize to fit the page
   rather than becoming a scrollable box within a fixed-height panel. */
.content-panel.map-mode{
  background:transparent !important; border:none !important; box-shadow:none !important; overflow:visible !important;
  top:44px !important; left:0 !important; width:100% !important; height:calc(100dvh - 44px) !important;
}


/* MOBILE */
@media (max-width:768px){
  :root{ --bw-top:44px; --bw-left:0%; --bw-width:100%; --bw-height:calc(100dvh - 44px); }
  .content-panel.active:not(.iframe-mode){ border:none; box-shadow:none; }
  /* Heart guide + bubble are desktop-only, but the flow timer still needs to
     show somewhere — keep the (invisible) char-heart container around as an
     anchor and re-pin the timer badge to the bottom-left as its own pill. */
  .char-heart .char-img, .char-heart .thought-bubble { display:none; }
  .timer-badge {
    position:fixed; top:auto; left:14px; bottom:14px; transform:none;
    padding:5px 16px; font-size:16px; border-width:2px; border-radius:20px;
    box-shadow:2px 2px 0 rgba(0,0,0,.15);
  }
  .timer-badge.warn { animation:none; }
  .timer-extend {
    position:fixed; top:auto; bottom:14px; left:14px; transform:none;
    width:min(230px, calc(100vw - 28px));
  }
  .save-continue-bar{ height:auto; padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px)); bottom:0; z-index:30; background:var(--cream); border-top:2px solid var(--blue); }
  /* leave room below the panel so the continue bar doesn't sit on top of it */
  body:has(.save-continue-bar.visible) .content-panel{ --bw-height: calc(100dvh - 44px - 100px); }

  /* season map title + progress meter were overlapping — stack them instead */
  #map-season-title{ top:54px; left:0; right:0; text-align:center; font-size:clamp(30px,7vw,42px); }
  #map-progress{ top:104px; left:50%; right:auto; transform:translateX(-50%); min-width:0; width:min(320px,84vw); }

  /* iframe panels (character step, cosmic bingo) used to scroll away with the
     whole page — tall content would scroll its top rows up under the fixed
     nav bar, AND the continue bar (a separate fixed sibling) would float on
     top of whatever content was currently in view instead of trailing it.
     Fix: .panel-scroll-region becomes the single pinned-below-nav scroll
     container for both the panel and the continue bar, so the continue
     button flows in normal document order after the panel's content instead
     of floating fixed over it, while the whole region still stays below the
     nav rather than scrolling under it. Only kicks in for iframe steps;
     non-iframe steps keep their own self-contained fixed box below. */
  body:has(.content-panel.iframe-mode) .panel-scroll-region {
    display:flex; flex-direction:column; align-items:center;
    position:fixed; top:44px; left:0; right:0; bottom:0;
    overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  }
  body:has(.content-panel.iframe-mode) .content-panel.iframe-mode {
    position:static; width:94vw; height:auto; max-height:none; overflow:visible;
    margin:0 auto;
  }
  body:has(.content-panel.iframe-mode) .save-continue-bar {
    position:static; height:auto; padding:0; margin:20px 0 30px; z-index:auto;
  }

  /* zodiac picker grid: fixed 126px columns overflowed narrow screens
     and forced horizontal scrolling — shrink slots to fit within the panel width */
  .picker-grid.grid-3{ grid-template-columns:repeat(3, 88px); gap:20px 8px; }
  .picker-grid.grid-3 .picker-slot{ width:88px; }
  .picker-grid.grid-3 .picker-disc{ width:56px; height:56px; }
  .picker-grid.grid-3 .picker-disc img{ width:32px; height:32px; }
  .picker-grid.grid-3 .picker-halo{ width:110px; height:110px; top:28px; }
  .picker-grid.grid-3 .picker-name{ font-size:14px; }

  /* transit selector: past/future buttons + heart icon move to fixed
     bottom corners instead of crowding the top of the panel */
  .transit-nav-btn{ top:auto; bottom:14px; font-size:13px; padding:6px 10px; }
  .transit-nav-btn.past{ left:14px; }
  .transit-nav-btn.future{ right:14px; }
  .transit-heart-icon{ top:auto; bottom:64px; right:14px; width:38px; }
}
</style>

<script>
/* ============================================================
   COSMIC MATRIX — orchestration spine
   Paid-gated. Sole writer of cosmic_matrix. cosmic_bingo (the season's
   board) is now owned by the standalone cosmic-bingo.html page.
   Flow per transit: location (user-built) → character → library → journal
   → matrix render.
   No `games` table — cosmic_bingo is the season anchor (1 row per user per
   season, holds the cloned transit_data); cosmic_matrix's per-transit rows
   just carry that same map_id. Entry identity is (map_id, transit_id):
   upsert on that key → no dup rows.
   ============================================================ */

// Same-origin game iframes don't auto-size to their content by default, so
// once loaded we measure the real document height and apply it directly —
// this is what lets the frame grow to fit instead of scrolling internally.
function autoSizeIframe(iframe){
  const resize = () => {
    try {
      const doc = iframe.contentDocument;
      const h = doc && doc.documentElement.scrollHeight;
      if (h) iframe.style.height = h + 'px';
    } catch (e) { /* cross-origin — keep fallback height */ }
  };
  iframe.addEventListener('load', () => {
    resize();
    try {
      if ('ResizeObserver' in window && iframe.contentDocument) {
        new ResizeObserver(resize).observe(iframe.contentDocument.documentElement);
      }
    } catch (e) {}
  });
}

function showIframe(src, backFn){ const p=$('content-panel'); p.className='content-panel active iframe-mode';
  const backHtml = backFn

    : '';
  p.innerHTML=backHtml+`<iframe class="game-iframe" id="game-iframe" src="${src}"></iframe>`;
  autoSizeIframe($('game-iframe')); }

function transits(){ return (activeMapData?.transits || []).slice().sort((a,b)=>Date.parse(a.utc)-Date.parse(b.utc)); }
function transitByKey(k){ return transits().find(t=>t.transit_id===k); }
function nowMs(){ return Date.now(); }
// "today" is a UTC calendar day — a transit dated today counts as active
// (clickable) regardless of whether its exact hour has passed yet.
function todayRangeUTC(){
  const n = new Date();
  const start = Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate());
  return [start, start + 86400000];
}
function todaysTransits(){
  const [start,end] = todayRangeUTC();
  return transits().filter(t=>{ const ms=Date.parse(t.utc); return ms>=start && ms<end; });
}
function pastTransits(){
  const [start] = todayRangeUTC();
  return transits().filter(t=>Date.parse(t.utc) < start);
}
function futureTransits(){
  const [,end] = todayRangeUTC();
  return transits().filter(t=>Date.parse(t.utc) >= end);
}
function isActiveTransit(t){ return Date.parse(t.utc) < todayRangeUTC()[1]; }
function fmtTransitTime(t){
  const d=new Date(t.utc);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' +
         d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

function hexA(hex, alpha){ // hex "#rrggbb" + alpha 0-1 → "#rrggbbaa"

}

// tpl.season is a slug like "cancer-2026" — match on its leading word.
function seasonSignId(season){ return (season||'').toLowerCase().split(/[^a-z]/)[0]; }
function tplForSign(tpls, signId){ return (tpls||[]).find(t => seasonSignId(t.season) === signId) || null; }

// A template only counts as the "live" season if today falls inside its own
// [season_start_utc, season_end_utc) window — a published template whose
// season has already ended (or hasn't started yet) shouldn't present as the
// open, current experience just because it exists in the DB. Templates
// without boundary fields fail open (always current) rather than vanishing.
function isSeasonCurrent(tpl){
  const td = tpl?.transit_data || {};
  const startMs = Date.parse(td.season_start_utc);
  const endMs = Date.parse(td.season_end_utc);
  if (isNaN(startMs) || isNaN(endMs)) return true;
  const now = Date.now();
  return now >= startMs && now < endMs;
}
function seasonLockInfo(tpl){
  if (!tpl) return { locked:true, label:'coming soon' };
  if (isSeasonCurrent(tpl)) return { locked:false, label:'' };
  const startMs = Date.parse(tpl.transit_data?.season_start_utc);
  const label = (!isNaN(startMs) && Date.now() < startMs) ? 'coming soon' : 'season ended';
  return { locked:true, label };
}

async function openZodiacSeason(signId){
  const tpl = tplForSign(window._zodiacTpls, signId);
  if (!tpl || !isSeasonCurrent(tpl)) return;
  await openSeason(tpl);
}

// Clone the season template into the user's cosmic_bingo row exactly once.
// cosmic_bingo is the season anchor (1 row per user per season): it holds
// the map_id every cosmic_matrix transit row groups under, plus the
// transit_data clone and the bingo board itself — so this also primes
// cosmicBoard (read-only here; the standalone cosmic-bingo.html owns writes).
async function ensureCosmicSeason(tpl){
  const season = tpl.transit_data?.season || tpl.season;
  let row=null;
  try {
    const { data } = await sb.from('cosmic_bingo').select('*').eq('user_id', currentUser.id);
    row = (data||[]).find(r => r.transit_data?.season === season) || null;
  } catch(e){}

  if (!row){
    try {
      const { data, error } = await sb.from('cosmic_bingo').insert({
        map_id: crypto.randomUUID(),
        user_id: currentUser.id,
        transit_data: tpl.transit_data,     // carries season + transits; transit_data->>'season' powers the unique index
        bingo_data: { marked:null },
      }).select().single();
      if (error) throw error;
      row = data;
    } catch(err){
      // Surface the real reason (constraint, RLS, etc.) — don't hide it.
      console.error('[cosmic clone] cosmic_bingo insert failed:', err?.message || err, err);
      // A unique-index race is the one benign case: re-fetch the row that won.
      try {
        const { data } = await sb.from('cosmic_bingo').select('*').eq('user_id', currentUser.id);
        row = (data||[]).find(r => r.transit_data?.season === season) || null;
      } catch(e){}
    }
  }
  if (row){
    activeMapId   = row.map_id;
    activeMapData = row.transit_data || activeMapData;
    cosmicBoard   = row.bingo_data || { marked:null };
  }
}

async function loadProgress(){

      .select('transit_id, character_data')
      .eq('map_id', activeMapId).eq('user_id', currentUser.id);

        completedSet.add(r.transit_id);
        completedData.set(r.transit_id, r.character_data);
      }
    });
  } catch(e){}
}

function escAttr(s){ return (s||'').replace(/'/g,"\\'"); }

function buildTransitSelectorView(){
  const today = todaysTransits();
  const titleText = (activeTemplate?.title || activeMapData?.season || 'cosmic season');
  const centerHtml = today.length
    ? today.map(t => `
        <div class="transit-card${t.transit_id===justDoneKey?' just-done':''}" onclick="selectTransit('${escAttr(t.transit_id)}')">
          <div class="transit-card-name">${escSvg(t.name||t.transit_id)}</div>
          <div class="transit-card-time">${fmtTransitTime(t)}</div>
          ${completedSet.has(t.transit_id) ? '<div class="transit-card-badge done">tracked ✓</div>' : '<div class="transit-card-badge open">track this →</div>'}
        </div>`).join('')
    : `<div class="transit-empty">no transits today.</div>`;

  const score = Array.isArray(cosmicBoard?.marked) ? cosmicBoard.marked.filter((v,i)=>v&&i!==12).length : 0;
  const hmPct = Math.max(0, Math.min(100, Math.round((score/24)*100)));
  const hmFull = score >= 24;
  const hmHeartPos = Math.max(6, Math.min(94, hmPct));
  const heartInner = hmFull
    ? `<img class="hm-full-img" src="../assets/elements/heart-gold.png" alt="bingo complete">`
    : `<div class="hm-box"><div class="hm-track"><div class="hm-fill" style="height:${hmPct}%"></div></div>
        <img class="hm-heart" src="../assets/elements/heart-pink.png" alt="heart meter" style="bottom:${hmHeartPos}%"></div>`;

  return `<div style="position:relative;width:100%;height:100%;">
    <button class="transit-nav-btn past" onclick="openPastTransitsPopup()">← past transits</button>
    <button class="transit-nav-btn future" onclick="openFutureTransitsPopup()">future transits →</button>
    <div class="transit-heart-icon" title="season bingo board" onclick="goToCosmicBingo()">${heartInner}</div>
    <div class="season-head">
      <div class="season-title">${escSvg(titleText)}</div>
      <div class="season-sub">TODAY'S TRANSITS</div>
    </div>
    <div class="transit-today-list">${centerHtml}</div>
  </div>`;
}

// ── FLOW TIMER — timed mode runs the location builder through character ───
function msToClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function startFlowTimer() {
  if (!dailyTimedMode) return;
  timerEndAt = Date.now() + TIMER_DURATION_MS;
  document.getElementById('timer-badge').classList.add('active');
  clearInterval(timerTickHandle);
  timerTickHandle = setInterval(tickFlowTimer, 1000);
  tickFlowTimer();
}

function tickFlowTimer() {
  const badge = document.getElementById('timer-badge');
  const remaining = timerEndAt - Date.now();
  if (remaining <= 0) {
    clearInterval(timerTickHandle);
    timerTickHandle = null;
    badge.classList.remove('active', 'warn');
    handleTimerExpire();
    return;
  }
  badge.textContent = msToClock(remaining);
  badge.classList.toggle('warn', remaining <= 60000);
}

// Stops the countdown outright — used entering the (untimed) journal step,
// on completion, and whenever the flow resets.
function stopFlowTimer() {
  clearInterval(timerTickHandle);
  timerTickHandle = null;
  timerEndAt = null;
  document.getElementById('timer-badge').classList.remove('active', 'warn');
  clearExtendPrompt();
}

function handleTimerExpire() {
  extendEndAt = Date.now() + TIMER_EXTEND_WINDOW_MS;
  document.getElementById('timer-extend').classList.add('active');
  clearInterval(extendTickHandle);
  extendTickHandle = setInterval(tickExtendPrompt, 1000);
  tickExtendPrompt();
}

function tickExtendPrompt() {
  const remaining = extendEndAt - Date.now();
  if (remaining <= 0) {
    clearInterval(extendTickHandle);
    extendTickHandle = null;
    expireAndWipe();
    return;
  }
  document.getElementById('timer-extend-msg').textContent =
    `time's up! extend 11 min? (${Math.ceil(remaining / 1000)}s)`;
}

function clearExtendPrompt() {
  clearInterval(extendTickHandle);
  extendTickHandle = null;
  document.getElementById('timer-extend').classList.remove('active');
}

function extendFlowTimer() {
  clearExtendPrompt();
  timerEndAt = Date.now() + TIMER_DURATION_MS;
  document.getElementById('timer-badge').classList.add('active');
  clearInterval(timerTickHandle);
  timerTickHandle = setInterval(tickFlowTimer, 1000);
  tickFlowTimer();
}

// Extend window lapsed unanswered — clear this phase's in-progress entry (if
// any row was already saved) and send the user back to the season map.
async function expireAndWipe() {
  clearExtendPrompt();
  stopFlowTimer();
  clearTimeout(window._fb);
  if (activeTransit) {
    try { await sb.from('cosmic_matrix').delete().eq('map_id', activeMapId).eq('transit_id', activeTransit.transit_id); }
    catch (e) { console.error('[timer] wipe failed', e); }
  }
  activeTransit = null;
  activeLocation = null;
  activeMatrixEntryId = null;
  hidePanel();
  setSave(false);
  await HGModal.alert(
    "time's up",
    "your progress for this transit was cleared. take a breath, then try again whenever you're ready."
  );
  showTransitSelector();
}

// Restores whatever terrain/feeling was already confirmed instead of wiping
// the draft — so going back from the character step doesn't undo this
// transit's location.
function openLocationBuilder(){
  locDraft = activeLocation
    ? { name: activeLocation.name||null, terrain: activeLocation.terrain||null, feeling: activeLocation.feeling||null, tint: activeLocation.tint||null, cat: activeLocation.cat||null }

function pickLocationTerrain(id){

}
function pickLocationFeeling(feeling,cat,tint){
  locDraft.feeling = feeling; locDraft.cat = cat; locDraft.tint = tint;
  document.querySelectorAll('.loc-chip').forEach(el=>el.classList.remove('active'));

}
function refreshLocationConfirm(){
  $('loc-confirm').disabled = !(locDraft.terrain && locDraft.feeling);
}

// One centered destination — terrain image + tint glow + feeling label
function renderLocationPreview(){
  const R=50, cx=150, cy=110;
  let defs='', body='';
  if (locDraft.tint){
    defs += `<radialGradient id="loctint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${locDraft.tint}" stop-opacity="1"/>
      <stop offset="55%" stop-color="${locDraft.tint}" stop-opacity=".85"/>
      <stop offset="100%" stop-color="${locDraft.tint}" stop-opacity="0"/></radialGradient>`;
    body += `<circle cx="${cx}" cy="${cy}" r="${R+40}" fill="url(#loctint)"/>`;
  }
  if (locDraft.terrain && TERRAIN_IMGS[locDraft.terrain]){
    body += `<image x="${cx-R}" y="${cy-R}" width="${R*2}" height="${R*2}"
      href="${TERRAIN_IMGS[locDraft.terrain]}" preserveAspectRatio="xMidYMid meet"/>
      <text x="${cx}" y="${cy-R-8}" text-anchor="middle" fill="#000000"
        font-family="ZoesHandwriting,cursive" font-size="16" font-weight="bold">${locDraft.terrain} of</text>`;
  } else {
    body += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(200,196,180,.5)"
      stroke="#6e83d3" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#7a86bb"
        font-family="ZoesHandwriting,cursive" font-size="13">pick a terrain</text>`;
  }
  if (locDraft.feeling){
    body += `<text x="${cx}" y="${cy+R+22}" text-anchor="middle" fill="#000000"
      font-family="ZoesHandwriting,cursive" font-size="16" font-weight="bold">${locDraft.feeling}</text>`;
  }
  $('loc-map-frame').innerHTML = `<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}</svg>`;
}

async function confirmLocation(){

  activeLocation = { name: locDraft.name||null, terrain: locDraft.terrain, feeling: locDraft.feeling, tint: locDraft.tint, cat: locDraft.cat };

    const { error } = await sb.from('cosmic_matrix').upsert({

async function useArchetype(archetype){
  const charState = {
    name: archetype.name, body: archetype.body,
    hair: archetype.hair, eyes: archetype.eyes, mouth: archetype.mouth,
  };
  await saveCharacterAndAdvance(charState, { fork: false, archetypeId: archetype.id });
}

// Saves charState to cosmic_matrix and advances the flow. When fork is true
// (built fresh via the character builder), also adds it to the user's
// reusable cast — picking a saved archetype never touches that table again.
// archetypeId links the entry back to character_archetypes for the archive's
// per-archetype location history; forked entries get their id after insert.
async function saveCharacterAndAdvance(charState, { fork, archetypeId }){
  try {
    // New archetypes are inserted before the matrix row so the row can be
    // stamped with the real archetype_id in the same save.
    let finalArchetypeId = archetypeId || null;
    if (fork) {
      const { data: newArch, error: forkErr } = await sb.from('character_archetypes').insert({
        user_id: currentUser.id, name: charState.name || null,
        body: charState.body, hair: charState.hair,
        eyes: charState.eyes, mouth: charState.mouth,
      }).select().single();
      if (forkErr) console.error('[archetypes] save failed:', forkErr);
      else finalArchetypeId = newArch.id;
    }

    const { error } = await sb.from('cosmic_matrix').upsert({
      map_id: activeMapId, user_id: currentUser.id, transit_id: activeTransit.transit_id,
      character_data: charState,
      archetype_id: finalArchetypeId,
      updated_at: new Date().toISOString(),
    }, { onConflict:'map_id,transit_id' });
    if (error) throw error;
    completedData.set(activeTransit.transit_id, charState);

    showStatus('character saved ✓','#6ab86a'); setSave(false); stepLibrary();
  } catch(err){ console.error('[char save]',err); HGModal.alert('oops','save failed'); const b=$('save-btn'); b.disabled=false; b.innerHTML='continue →'; }
}

// ── JOURNAL HELPERS ──────────────────────────────────────────
function jrcEscape(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jrcTime(iso){ return new Date(iso||Date.now()).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function jrcDay(iso){ return new Date(iso||Date.now()).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function jrcRowMessages(row){ const arr=Array.isArray(row?.journal_messages)?row.journal_messages:[]; return arr.slice().sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0)); }

function buildAvatar(charData){
  if (!charData) return '<div class="jrc-avatar"></div>';
  const layers = ['body','eyes','mouth','hair'];
  const imgs = layers.map(k => charData[k] && CHAR_FULL_ASSETS[charData[k]]
    ? `<img src="${CHAR_FULL_ASSETS[charData[k]]}" alt="">`
    : '').join('');
  return `<div class="jrc-avatar">${imgs}</div>`;
}

function renderJournalMessage(msg, side, charData){
  const wrap=document.createElement('div');
  wrap.className='jrc-msg-wrap '+(side==='right'?'right':'left');
  const img=msg.image_url?`<img src="${jrcEscape(msg.image_url)}" alt="" onerror="this.style.display='none'">`:''
  const txt=msg.text?`<span class="jrc-bubble-txt">${jrcEscape(msg.text)}</span>`:'';
  const avatar=buildAvatar(charData);
  wrap.innerHTML=`${avatar}<div class="jrc-msg"><div class="jrc-bubble">${img}${txt}</div><div class="jrc-meta">${jrcTime(msg.created_at)}</div></div>`;
  return wrap;
}

function jrcScrollBottom(){ const c=document.getElementById('jrc-messages'); if(c) c.scrollTop=c.scrollHeight; }

function jrcMaybeDivider(container, dayLabel, location){
  const last=[...container.querySelectorAll('.jrc-date-divider span')].pop();
  if(last&&last.textContent===dayLabel) return;
  const div=document.createElement('div');
  div.className='jrc-date-divider';
  const locHtml=location?`<span class="divider-location">${jrcEscape(location)}</span> · `:'';
  div.innerHTML=`${locHtml}<span>${dayLabel}</span>`;
  container.appendChild(div);
}

function showJournalStatus(msg,ok){
  const el=document.getElementById('jrc-status'); if(!el) return;
  el.textContent=msg; el.className='jrc-status '+(ok?'ok':'err');
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.textContent=''; el.className='jrc-status'; },3000);
}

async function loadJournalEntries(){
  journal.entries=[]; journal.pendingImage=null;
  const dateEl=document.getElementById('jrc-date');
  if(dateEl) dateEl.textContent=jrcDay();
  if(!currentUser||!activeMapId) return;

  let rows=[];
  try {
    const { data } = await sb.from('cosmic_matrix')
      .select('transit_id,journal_messages,matrix_images,location_data,updated_at')
      .eq('map_id',activeMapId).eq('user_id',currentUser.id)
      .order('updated_at',{ascending:true});
    rows=data||[];
  } catch(e){ console.error('[journal load]',e); }

  rows=rows.filter(r=>r.transit_id===activeTransit.transit_id||jrcRowMessages(r).length);
  journal.entries=rows;

  const container=document.getElementById('jrc-messages');
  const empty=document.getElementById('jrc-empty');
  if(!container) return;
  container.querySelectorAll('.jrc-msg,.jrc-date-divider').forEach(e=>e.remove());

  // Build a transit order index so alternation is consistent across sessions
  const transitOrder = transits().map(t=>t.transit_id);
  const transitLabel = row => {
    const l = row.location_data;
    if (l?.name) return l.name;
    if (l?.terrain && l?.feeling) return `the ${l.terrain} of ${l.feeling}`;
    return transitByKey(row.transit_id)?.name || '';
  };

  let anyMsg=false;
  rows.forEach(row=>{
    const idx = transitOrder.indexOf(row.transit_id);
    const side = idx % 2 === 0 ? 'left' : 'right';
    const charData = completedData.get(row.transit_id) || null;
    const location = transitLabel(row);
    jrcRowMessages(row).forEach(msg=>{
      jrcMaybeDivider(container, jrcDay(msg.created_at||row.updated_at), location);
      container.appendChild(renderJournalMessage(msg, side, charData));
      anyMsg=true;
    });
  });
  if(empty) empty.style.display=anyMsg?'none':'block';
  jrcScrollBottom();
}

function onJournalImagePicked(e){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    journal.pendingImage={file,base64:ev.target.result};
    document.getElementById('jrc-img-preview').src=ev.target.result;
    document.getElementById('jrc-img-chip').classList.add('has-img');
  };
  reader.readAsDataURL(file);
}

function removeJournalImage(){
  journal.pendingImage=null;
  const chip=document.getElementById('jrc-img-chip');
  if(chip){ chip.classList.remove('has-img'); document.getElementById('jrc-img-preview').src=''; }
  const f=document.getElementById('jr-file'); if(f) f.value='';
}

async function sendJournalMessage(){
  const msgEl=document.getElementById('jrc-msg');
  const sendBtn=document.getElementById('jrc-send');
  const text=(msgEl?.value||'').trim();
  if(!text&&!journal.pendingImage) return false;
  if(!(currentUser&&activeMapId&&activeTransit)){ HGModal.alert('oops','not signed in'); return false; }
  if(sendBtn) sendBtn.disabled=true;

  let imageUrl=null;
  if(journal.pendingImage){
    try {
      const file=journal.pendingImage.file;
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
      const path=`${currentUser.id}/${activeMapId}/${activeTransit.transit_id}/journal-${crypto.randomUUID()}.${ext}`;
      const { error:upErr } = await sb.storage.from(MATRIX_PHOTO_BUCKET).upload(path,file,{contentType:file.type,upsert:false});
      if(upErr) throw upErr;
      const { data:pub } = sb.storage.from(MATRIX_PHOTO_BUCKET).getPublicUrl(path);
      imageUrl=pub?.publicUrl||null;
    } catch(err){
      console.error('[journal image]',err);
      HGModal.alert('oops',"couldn't attach photo — try again");
      if(sendBtn) sendBtn.disabled=false;
      return false;
    }
  }

  const message={id:crypto.randomUUID(),text,image_url:imageUrl,created_at:new Date().toISOString()};

  let currentRow={};
  try {
    const { data } = await sb.from('cosmic_matrix')
      .select('journal_messages,matrix_images').eq('map_id',activeMapId).eq('transit_id',activeTransit.transit_id).maybeSingle();
    currentRow=data||{};
  } catch(e){}
  const messages=(Array.isArray(currentRow.journal_messages)?currentRow.journal_messages:[]).concat([message]);
  let imgs=Array.isArray(currentRow.matrix_images)?currentRow.matrix_images:[];
  if(imageUrl) imgs=imgs.concat([{url:imageUrl,source:'journal'}]);

  try {
    const { error } = await sb.from('cosmic_matrix').upsert({
      map_id:activeMapId, user_id:currentUser.id, transit_id:activeTransit.transit_id,
      journal_messages:messages, matrix_images:imgs,
      updated_at:new Date().toISOString(),
    },{onConflict:'map_id,transit_id'});
    if(error) throw error;
  } catch(err){
    console.error('[journal send]',err);
    HGModal.alert('oops','something went wrong — try again');
    if(sendBtn) sendBtn.disabled=false;
    return false;
  }

  const container=document.getElementById('jrc-messages');
  const empty=document.getElementById('jrc-empty');
  if(empty) empty.style.display='none';
  const _idx = transits().map(t=>t.transit_id).indexOf(activeTransit.transit_id);
  const _side = _idx % 2 === 0 ? 'left' : 'right';
  const _locLabel = activeLocation?.name || (activeLocation ? `the ${activeLocation.terrain} of ${activeLocation.feeling}` : (activeTransit?.name||''));
  jrcMaybeDivider(container, jrcDay(message.created_at), _locLabel);
  container.appendChild(renderJournalMessage(message, _side, completedData.get(activeTransit.transit_id)||null));
  if(msgEl) msgEl.value='';
  removeJournalImage();
  if(sendBtn) sendBtn.disabled=false;
  showJournalStatus('saved ✓',true);
  jrcScrollBottom();
  if(msgEl) msgEl.focus();
  return true;
}

async function saveJournalEntry(){
  const msgEl=document.getElementById('jrc-msg');
  const hasUnsent=!!((msgEl&&msgEl.value.trim())||journal.pendingImage);
  if(hasUnsent){
    setSave(true,'continue →');
    const send = await HGModal.confirm(
      'do you want to save this entry?', '',
      { stacked:true, confirmLabel:'send message', cancelLabel:'continue without saving', cancelVariant:'link' }
    );
    if (send) await confirmSendAndContinue(); else confirmSkipUnsent();
    return;
  }
  finishJournal();
}
function finishJournal(){
  setSave(false);
  stepMatrix();
}
async function confirmSendAndContinue(){ const ok=await sendJournalMessage(); if(ok) finishJournal(); else setSave(true,'continue →'); }
function confirmSkipUnsent(){
  const msgEl=document.getElementById('jrc-msg'); if(msgEl) msgEl.value='';
  removeJournalImage(); finishJournal();
}

// ── STEP: THE COSMIC MATRIX (native, no iframe) ───────────
// Same scrapbook as dream.html/daily.html — rendering + interactive editing
// (drag/rotate/resize, add photo/sticker/text, the save button) all live in
// matrix-render.js. See MatrixRender.buildHTML/createMatrixEditor. This file
// only resolves this transit's cosmic_matrix row id and wires step navigation.
// Unlike dream/daily, cosmic_matrix rows aren't addressed by a client-minted
// id — they're upserted by (map_id, transit_id) — so the row's own id is
// looked up lazily the first time this transit's matrix is shown.
let _matrixEditor = null;
function getMatrixEditor(){
  if (_matrixEditor) return _matrixEditor;
  _matrixEditor = MatrixRender.createMatrixEditor({
    sb, table: 'cosmic_matrix',
    getEntryId: () => activeMatrixEntryId,
    getUserId: () => currentUser?.id,
    status: (msg, color) => showStatus(msg, color),
    onChange: renderMatrix,
  });
  return _matrixEditor;
}

let _matrixSeed = 'matrix';
async function renderMatrix(){
  if (!activeMatrixEntryId){
    try {
      const { data: row } = await sb.from('cosmic_matrix').select('id')
        .eq('map_id', activeMapId).eq('transit_id', activeTransit.transit_id).maybeSingle();
      activeMatrixEntryId = row?.id || null;
    } catch(e){ console.error('[cosmic matrix] row lookup failed', e); }
  }
  const data = await MatrixRender.assemble(sb, activeMatrixEntryId, activeMapData, 'cosmic_matrix');
  data.mapName = activeLocation?.name
    || (activeLocation ? `${activeLocation.terrain} of ${activeLocation.feeling}` : null)
    || activeTransit?.name || 'this transit';

  // Cosmic-only layout tweak: the shared renderer's default spot for the
  // location item is external-action (top-left) — for cosmic that quadrant
  // is reserved for this transit's planet glyphs instead (see below), so
  // give location a default of internal-action (bottom-left), where the
  // shared renderer's per-entry bingo meter used to sit (bingo is now the
  // standalone cosmic-bingo.html season page, so that item is hidden via
  // CSS below rather than removed from matrix-render.js, which dream/daily
  // still use unchanged). Only sets a default — a manually dragged position
  // (data.matrixLayout.map already present) always wins.
  if (!data.matrixLayout) data.matrixLayout = {};
  if (!data.matrixLayout.map) data.matrixLayout.map = { x: 27, y: 71 };

  showPanel(MatrixRender.buildHTML(data, _matrixSeed, {
    showAddPhoto: false, showEditNotes: false, showFrame: true, editable: true,
  }));
  const panel = $('content-panel');
  const editor = getMatrixEditor();
  editor.attachInteractions(panel);
  MatrixRender.attachMatrix(panel, {
    onRemovePhoto: url => editor.removeMatrixPhoto(url),
  });

  // Cosmic-only: this transit's planet glyphs go where location used to sit
  // (external-action, top-left). matrix-render.js has no concept of
  // "planets in this transit" (that's cosmic-specific transit_data), so
  // this is layered on after the shared render instead of touching that
  // shared file — non-draggable, just a small badge cluster.
  const matrixEl = panel.querySelector('.adv-matrix');
  if (matrixEl) matrixEl.insertAdjacentHTML('beforeend', buildTransitGlyphsHTML(activeTransit));
}

function buildTransitGlyphsHTML(transit){
  const planets = Array.isArray(transit?.planets) ? transit.planets : [];
  if (!planets.length) return '';
  const imgs = planets.map(p =>
    `<img src="../assets/elements/glyphs/${p}.png" alt="${p}" class="cosmic-transit-glyph" onerror="this.style.display='none'">`
  ).join('');
  return `<div class="cosmic-transit-glyphs">${imgs}</div>`;
}

async function stepMatrix(){
  currentStep = 'matrix';
  setBubble('transit tracked!');
  showPanel('<div class="step-panel matrix-panel"><div class="matrix-date" style="position:static;margin-top:40px;text-align:center;">gathering this transit…</div></div>');
  setSave(true, 'back to transits →');
  _matrixSeed = `${activeMapId}|${activeTransit.transit_id}`;
  await renderMatrix();
}

// "back to transits →" on the matrix step — marks the transit complete and returns.
function stepDone(){
  justDoneKey = activeTransit.transit_id;
  completedSet.add(activeTransit.transit_id);
  setSave(false);
  showTransitSelector();
}

// ── SAVE & CONTINUE — matrix owns every write ───────────────
async function saveAndContinue(){
  const btn = $('save-btn'); btn.disabled = true; btn.textContent='saving…';

  if (currentStep === 'journal'){ await saveJournalEntry(); return; }
  if (currentStep === 'library'){ await saveLibrarySelection(); return; }
  if (currentStep === 'matrix'){ stepDone(); return; }

  const iframe = $('game-iframe');
  if (!iframe){ btn.disabled=false; return; }
  iframe.contentWindow.postMessage({ type:'request_state' }, '*');
  clearTimeout(window._fb);
  window._fb = setTimeout(()=>{ if (btn.disabled){ btn.disabled=false;
    btn.innerHTML='continue →'; HGModal.alert('oops','something went wrong — try again'); } }, 5000);
}

// ── MESSAGE HANDLERS — character builder iframe reports, matrix writes ──
window.addEventListener('message', async e=>{
  const msg = e.data || {}; if (!msg.type) return;

  // character builder loaded
  if (msg.type==='iframe_ready' && msg.game==='character'){
    if (currentStep==='character'){ const b=$('save-btn'); if(b){ b.disabled=false; b.innerHTML='continue →'; } }
    return;
  }

  // character state → cosmic_matrix (idempotent on map_id, transit_id)
  if (msg.type==='char_state'){
    const charState = msg.state || {};
    if (!charState.body){ HGModal.alert('oops','pick a body first!'); const b=$('save-btn'); b.disabled=false; b.innerHTML='continue →'; return; }
    if (!charState.name || !charState.name.trim()){ HGModal.alert('oops','name this archetype first!'); const b=$('save-btn'); b.disabled=false; b.innerHTML='continue →'; return; }
    await saveCharacterAndAdvance(charState, { fork: true });
    return;
  }

  // ── Inventory "add an entry" iframe finished submitting ─────
  if (msg.type==='media_entry_saved'){
    inventoryPanel.onMediaSaved();
    return;
  }
});

document.addEventListener('DOMContentLoaded', () => {
  buildLocationPalette();
  HeartabilityNav.init({
    mount: '#gear-slot',
    assetsBase: '../assets',
    authMode: 'dynamic',
    sb: sb,
    profileHref: '../users/account-settings.html',
    music: { src: 'https://dn720704.ca.archive.org/0/items/HildegardVonBingenCanticlesOfEcstasy/Hildegard%20von%20Bingen%20-%20Canticles%20Of%20Ecstasy.mp3' },
    onSignOut: () => { currentUser = null; },
  });
  init();
});
</script>
