<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<link rel="stylesheet" href="../assets/css/modal.css">
<script src="../assets/js/modal.js" defer></script>
<script src="../assets/js/treasure-map.js"></script>
<link rel="stylesheet" href="../assets/css/nav.css">
<title>Cosmic Matrix — Heartability</title>
<meta name="description" content="Follow how cosmic transits influence your world with the Cosmic Matrix.">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
<style>
@font-face { font-family:"ZoesHandwriting"; src:url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype"); }
@font-face { font-family:"PFPixelscript";  src:url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype"); }
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

*{ margin:0; padding:0; box-sizing:border-box; }
:root{
  --font-hand:"ZoesHandwriting",cursive;
  --font-pixel:"PFPixelscript",cursive;
  --font-game:"VT323",monospace;
  --blue:#6e83d3; --aqua:#83d2e6; --ink:#000f5a; --cream:#cdd3ec; --pink:#E8478B;
  --line:#111;
  --bw-top:9%; --bw-left:15%; --bw-width:70%; --bw-height:70%;
}
html,body{ width:100vw; height:100dvh; overflow-x:hidden; overflow-y:auto; user-select:none;
  background:url("../assets/elements/matrix-cosmic.png") center / cover no-repeat fixed;
  font-family:var(--font-hand); color:var(--ink); }

/* NAV (matches adventure) */
.room-nav{ position:fixed; top:0; left:0; right:0; height:44px; background:#6e83d3;
  border-bottom:2px solid var(--line); z-index:200; display:flex; align-items:center;
  justify-content:space-between; padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(21px,1.6vw,25px); color:#fff; }
.nav-btn{ cursor:pointer; padding:4px 8px; border-radius:2px; transition:background .15s; color:inherit; text-decoration:none; }
.nav-btn:hover{ background:rgba(0,0,0,.08); }
.nav-title{ position:absolute; left:50%; transform:translateX(-50%); pointer-events:none; white-space:nowrap; margin:0; font:inherit; }

/* ── PANEL SCROLL REGION — no-op by default (just a plain wrapper); becomes
   the scroll container for iframe-mode steps on mobile, see the max-width:
   768px block. ── */
.panel-scroll-region{ display:contents; }

/* CONTENT PANEL — sits where the back wall would be (outside: no wall, soft frame) */
.content-panel{ position:fixed; top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height); z-index:10; display:none;
  flex-direction:column; overflow:hidden; }
.content-panel.active{ display:flex; }
.content-panel.active:not(.iframe-mode){ background:transparent; border:none; box-shadow:none; }
/* ── IFRAME PANEL — anchored near the top like every other step, just wider
   than the back-wall proportions so builder UIs have room to breathe. Unlike
   other steps it isn't fixed to the viewport: it sits in normal document
   flow, so if its content runs taller than the screen, the whole page grows
   and scrolls with it (via html/body's overflow-y) instead of clipping into
   its own internal scrollbar — and #save-bar, which follows right after it
   in the DOM, trails along below instead of floating fixed on top of it. ── */
.game-iframe{ width:100%; height:70vh; border:none; display:block; flex-shrink:0; }
.content-panel.iframe-mode{
  border:none; box-shadow:none; background:transparent;
  position:relative; top:auto; left:auto;
  width:min(1050px, 94vw); height:auto;
  margin:var(--bw-top) auto 0;
  overflow:visible;
}
.panel-scroll{ width:100%; height:100%; overflow-y:auto; padding:22px; display:flex; flex-direction:column; align-items:center; }

/* MATRIX PAGE TOGGLE — switches between daily/dream/cosmic */
.matrix-toggle{ position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  z-index:210; display:flex; gap:clamp(24px,4vw,48px); }
.matrix-toggle-link{ font-family:var(--font-hand); font-size:clamp(19px,2.2vw,26px);
  color:#fff; text-decoration:none; padding-bottom:2px; border-bottom:2px solid transparent; }
.matrix-toggle-link:hover{ opacity:.8; }
.matrix-toggle-link.active{ border-bottom-color:#fff; }

/* SAVE BAR (matches adventure: floating blue button) */
.save-continue-bar{ position:fixed; bottom:0; left:0; right:0; height:calc(21% - 44px);
  display:none; align-items:center; justify-content:center; z-index:15; pointer-events:none; }
.save-continue-bar.visible{ display:flex; }
.save-continue-btn{ pointer-events:all; padding:14px 40px; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa; font-family:var(--font-hand);
  font-size:clamp(17px,1.8vw,23px); color:#fff; cursor:pointer; transition:all .05s; letter-spacing:.3px; text-transform:lowercase; }
.save-continue-btn:hover{ background:#4a5bc4; }
.save-continue-btn:active{ box-shadow:none; transform:translate(3px,3px); }
.save-continue-btn:disabled{ opacity:.38; cursor:not-allowed; transform:none!important; box-shadow:3px 3px 0 #3a4aaa; }

.save-status-bar{ position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
  font-family:var(--font-hand); font-size:16px; color:#6ab86a; z-index:16; pointer-events:none; }

/* ── QUADRANT POPUP — reuses the site-standard modal shell (modal.css's
   .hg-modal-overlay/.hg-modal/.hg-modal-titlebar/.hg-modal-close), just
   wider (game content, not a small alert) and with a scrollable body. The
   matrix canvas (#matrix-panel-host) stays visible/dimmed behind it. Hosts
   the transit picker (auto-opened on load when no transit is active yet)
   and the character/library/journal panels — the location terrain/climate builder
   uses its own separate #loc-overlay instead (see below), same pattern as
   daily.html's #dq-overlay. ── */
.quad-popup-window {
  width: min(1050px, 94vw); max-height: calc(100vh - 84px);
  display: flex; flex-direction: column;
}
/* Narrower variant for content that doesn't need the full game-panel width —
   currently just the recent-transits list (see showTransitSelector). */
.quad-popup-window.narrow-popup { width: min(600px, 92vw); }
.quad-popup-window .hg-modal-body {
  flex: 1; min-height: 0; padding: 0; display: flex; flex-direction: column;
}
.quad-popup-window .panel-scroll-region {
  display: flex; flex-direction: column;
  flex: 1; min-height: 0; overflow-y: auto; padding: 20px;
}
.quad-popup-window .content-panel {
  position: static; width: 100%; height: auto; display: flex; flex-shrink: 0;
  overflow: visible; margin: 0;
}
.quad-popup-window .save-continue-bar {
  position: static; height: auto; padding: 14px 0 4px; z-index: auto; flex-shrink: 0;
}
.quad-popup-window .lib-window {
  width: 100%; height: 100%; max-width: none; max-height: none; box-shadow: none; border: none;
}
.quad-popup-window .lib-titlebar { display: none; }
/* Journal panel brings its own bordered/shadowed card too — same "box
   nested in a box" fix as .lib-window above. */
.quad-popup-window .jrc-window {
  width: 100%; height: 100%; max-width: none; max-height: none; box-shadow: none; border: none;
}
/* The "recent transits" heading was styled for the dark cosmic-sky
   background (light/cyan text) — now that it renders inside the light
   popup, darken it for contrast. */
.quad-popup-window .season-title { color:#3a4aaa; }

/* loc-overlay (the terrain/climate builder) stays its own independent
   top-level modal — not nested inside the quad-popup shell — same pattern
   as daily.html's dq-overlay. */
.loc-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.loc-title { font-size:clamp(22px,2.2vw,30px); color:#3a4aaa; font-family:var(--font-hand); }
.loc-title-row .loc-close { margin:0; font-size:32px; color:#aaa; cursor:pointer; line-height:1; border:none; background:none; padding:2px 6px; }
.loc-title-row .loc-close:hover { color:#E8478B; }

/* RECENT TRANSITS — the sole transit-selection/switch UI now (no season
   grouping or separate past/future popups — season-based browsing lives in
   the archive instead). Rendered inside the quadrant popup (see
   openTransitPopup/showTransitSelector) as one chronological, scrollable
   list covering past, today, and future transits for the live season. */
.season-head{ text-align:center; margin-bottom:8px; }
.season-title{ font-family:var(--font-hand); font-size:clamp(30px,3.4vw,42px); color:#fff; }
.transits-list{ width:100%; max-width:520px; margin:0 auto; padding:6px 4px 20px; overflow-y:auto; }
.transits-row-clickable{ cursor:pointer; }
.transits-row-clickable:hover{ background:rgba(101,121,226,.08); }
.transits-row.just-done{ animation:flash 1.6s ease-out; }

/* COSMIC-ONLY MATRIX RENDER TWEAKS — location moves to internal-action
   (bottom-left, see renderMatrix()); the vacated external-action spot
   (top-left) becomes the "what's transiting?" tile instead (the 'bingo'
   quadrant key, repurposed — see QUADRANT_PROMPTS) before a transit is
   picked, then the clickable glyph badge below once one is active; the
   shared per-entry bingo meter itself is hidden since bingo is now the
   standalone cosmic-bingo.html season page. Scoped to this page only —
   matrix-render.js itself is untouched, dream/daily keep the shared
   renderer's original layout. */
.adv-matrix .adv-bingo{ display:none; }
/* Once a transit is active, this clickable badge (this transit's planet
   glyphs, or a fallback icon) takes the "what's transiting?" tile's spot —
   same top-left position, same click-to-switch behavior, just no more
   dashed prompt box now that it's "filled" (see buildTransitBadgeHTML). */
.cosmic-transit-badge{ position:absolute; left:27%; top:30%; transform:translate(-50%,-50%);
  z-index:5; display:flex; gap:6px; align-items:center; justify-content:center;
  cursor:pointer; padding:10px 14px; border-radius:6px; transition:background .12s; }
.cosmic-transit-badge:hover{ background:rgba(255,255,255,.15); }
.cosmic-transit-glyph{ width:39px; height:39px; object-fit:contain;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
.cosmic-transit-glyph-aspect{ width:28.5px; height:28.5px; opacity:.85; }
.cosmic-transit-badge-fallback{ font-family:var(--font-hand); font-size:26px; color:#fff; }

/* TRANSIT READING PANEL — scientific-label style breakdown of the active
   transit (planets + aspect), opened when a transit is selected (see
   selectTransit/openTransitReading). Slides in from the right, independent
   of the quad-popup modal (closed whenever that opens — see
   openQuadrantPopup) so it never sits behind it. */
.reading-side-panel{ position:fixed; top:60px; right:14px; width:min(300px,88vw);
  max-height:calc(100vh - 140px); overflow-y:auto; z-index:150;
  background:var(--cream); border:2px solid var(--blue);
  border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:var(--aqua); border-top-color:var(--aqua);
  box-shadow:3px 3px 0 rgba(0,0,0,.25);
  transform:translateX(calc(100% + 24px)); transition:transform .28s ease;
  padding:20px 16px 22px; }
.reading-side-panel.open{ transform:translateX(0); }
.reading-side-close{ position:absolute; top:4px; right:10px; font-size:20px; color:#888; cursor:pointer; line-height:1; }
.reading-side-close:hover{ color:var(--pink); }
.reading-aspect-label{ font-family:var(--font-hand); font-size:19px; color:var(--blue); text-align:center; margin:6px 0 18px; }
.reading-row{ display:flex; align-items:flex-start; justify-content:center; gap:10px; }
.reading-item{ display:flex; flex-direction:column; align-items:center; width:88px; flex-shrink:0; }
.reading-item-glyph{ width:28px; height:28px; object-fit:contain; }
.reading-item-dash{ width:2px; height:14px; background:var(--blue); margin:4px 0; }
.reading-item-text{ font-family:var(--font-game); font-size:12px; line-height:1.35; color:var(--ink); text-align:center; }
.reading-item-aspect{ padding-top:5px; }
/* The location quadrant is moved to bottom-left, and the "what's
   transiting?" tile takes over its old top-left spot (see renderMatrix) —
   the empty-state prompt tiles need the same repositioning, since matrix-
   render.js only knows its normal defaults (map→top-left, bingo→bottom-left).
   Scoped to the prompts only (not .adv-map, which is draggable — !important
   here would fight dragging via inline style). */
.adv-quad-prompt[data-quadrant="map"]{ left:27% !important; top:71% !important; }
.adv-quad-prompt[data-quadrant="bingo"]{ left:27% !important; top:30% !important; }
/* Shared renderer defaults these dark (#3a4aaa / #7a86bb) for dream/daily's
   lighter matrix background — cosmic's is the dark sky, so flip to white.
   Axis labels (external/internal/action/feeling) stay the shared dark blue
   to match dream/daily. */
.matrix-panel .matrix-date{ color:#fff; }
.adv-matrix .adv-cap{ color:#fff; }
.transits-empty{ text-align:center; color:#aaa; font-family:var(--font-hand); font-style:italic; padding:24px 0; }
.transits-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:10px 0; border-bottom:1px solid rgba(101,121,226,.12);
  font-family:var(--font-hand); font-size:17px; color:#333; }
.transits-row:last-child{ border-bottom:none; }
.transits-row-time{ font-family:var(--font-game); font-size:14px; color:#999; white-space:nowrap; }

/* TIMELINE */
.timeline{ width:100%; max-width:520px; margin:10px auto 0; position:relative; }
.timeline::before{ content:""; position:absolute; left:22px; top:14px; bottom:14px; width:2px;
  background:repeating-linear-gradient(var(--blue) 0 5px, transparent 5px 11px); opacity:.5; }
.node{ display:flex; align-items:center; gap:14px; padding:9px 10px; margin:5px 0; position:relative; border:2px solid transparent; }
.node-dot{ width:30px; height:30px; flex-shrink:0; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-hand); font-size:20px; border:2px solid var(--blue); background:var(--cream); color:var(--blue); z-index:1; }
.node-body{ flex:1; min-width:0; }
.node-loc{ font-family:var(--font-hand); font-size:clamp(20px,2vw,23px); color:var(--ink); line-height:1.15; }
.node-meta{ font-family:var(--font-hand); font-size:clamp(14px,1.4vw,17px); color:var(--blue); margin-top:1px; }
.node-badge{ font-family:var(--font-hand); font-size:15px; letter-spacing:.5px; padding:2px 8px; flex-shrink:0; }
.node.available{ cursor:pointer; }
.node.available:hover{ border-color:var(--aqua); background:#eef6f9; }
.node.available .node-badge{ color:var(--aqua); }
.node.completed{ cursor:pointer; }
.node.completed .node-dot{ background:var(--pink); border-color:var(--pink); color:#fff; }
.node.completed:hover{ border-color:var(--pink); background:#fbe9f1; }
.node.completed .node-badge{ color:var(--pink); }
.node.locked{ opacity:.45; }
.node.locked .node-dot{ border-color:#9aa0b8; color:#9aa0b8; }
.node.locked .node-badge{ color:#9aa0b8; }
.node.current .node-dot{ box-shadow:0 0 0 3px rgba(131,210,230,.55); }
.node.just-done{ animation:flash 1.6s ease-out; }
@keyframes flash{ 0%{ background:#fff0a0;} 100%{ background:transparent;} }

/* GATE */
.gate{ margin:auto; max-width:420px; text-align:center; background:#eef1fa; border:2px solid var(--blue); padding:28px 24px; }
.gate-title{ font-family:var(--font-hand); font-size:32px; color:var(--ink); margin-bottom:10px; }
.gate-text{ font-family:var(--font-hand); font-size:20px; color:var(--ink); line-height:1.4; margin-bottom:18px; }
.gate-btn{ font-family:var(--font-hand); font-size:21px; color:#fff; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa; padding:10px 24px; cursor:pointer; }
.gate-btn:hover{ background:#4a5bc4; }
.gate-btn:active{ box-shadow:none; transform:translate(3px,3px); }

/* Journal CSS moved to matrix-journal.js (ensureStyles()), which injects it once. */

/* Step header bar — back link atop steps reached via "continue" */
.step-panel {
  width:100%; height:100%; min-height:0;
  display:flex; flex-direction:column;
  align-items: center; justify-content: center;
  overflow-y: auto; padding:20px;
  font-family:var(--font-hand);
}
.step-header {
  width: 100%; display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; flex-shrink:0;
}
.step-header-title { font-size:25px; color:#fff; }
.step-back { font-size:16px; color:#fff; cursor:pointer; }
.step-back:hover { text-decoration:underline; }

/* Archetype picker — reuse a saved cast member or build a new one */
.arch-picker-loading { padding: 20px; font-family: var(--font-hand); color: #7a86bb; }
.arch-picker {
  width: 100%; flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px;
}
.arch-picker-title { font-family: var(--font-hand); font-size: clamp(25px,2.4vw,35px); color: #fff; text-align: center; }
.arch-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(120px, 180px));
  gap: 12px;
  padding: 4px;
  justify-content: center;
}
@media (max-width:600px) { .arch-grid { grid-template-columns: repeat(2, 1fr); } }
.arch-card {
  border: 2px solid var(--blue); background: var(--cream);
  cursor: pointer; display: flex; flex-direction: column;
  align-items: stretch;
  padding: 8px 8px 6px; gap: 5px;
  font-family: var(--font-hand); text-align: center;
  transition: border-color .15s, box-shadow .12s, transform .1s;
  position: relative;
  aspect-ratio: 4/5;
}
.arch-card:hover { border-color: var(--blue); box-shadow: 2px 2px 0 var(--blue); transform: translateY(-2px); }
.arch-card-name { font-size: 17px; color: #3a2e1e; }
.arch-card-new { border-style: dashed; border-color: var(--blue); justify-content: center; align-items: center; }
.arch-card-new:hover { border-color: var(--blue); }
.arch-card-plus { font-size: 46px; line-height: 1; color: var(--blue); font-family: var(--font-game); }
.arch-card-new:hover .arch-card-plus { color: var(--blue); }
.arch-stack { position:relative; width:100%; aspect-ratio:1; }
.arch-stack img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }

/* ── INVENTORY PANEL (media/tools tie-in, between character and journal) ──
   CSS moved to matrix-inventory.js (ensureStyles()), which injects it once. ── */

/* ── LOCATION BUILDER — user builds their own experience of a transit
   (terrain + emotional climate), ported from daily.html's dayquest builder.
   .loc-overlay spans the full viewport but stays pointer-events:none so nav
   clicks pass through it (see project memory on the daily-matrix nav-blocked
   bug); .loc-scroll is the actual interactive/scrollable region. ── */
.loc-overlay { position:fixed; inset:0; z-index:300; background:none; display:none; pointer-events:none; }
.loc-overlay.open { display:block; }
.loc-scroll {
  position:absolute; top:var(--bw-top); left:0; right:0; bottom:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; align-items:center;
  padding:0 0 40px; pointer-events:auto;
}
.loc-card {
  width:var(--bw-width); height:auto; min-height:var(--bw-height); max-height:none;
  padding:18px 20px; font-family:var(--font-hand);
  background:#dfe2ef; border:3px solid var(--blue);
  box-shadow:0 0 0 3px var(--blue), 6px 10px 40px rgba(0,0,0,.4);
  pointer-events:auto; flex-shrink:0;
}
.loc-body { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto 1fr; gap:16px 24px; align-items:start; }
@media (max-width:640px){ .loc-body { grid-template-columns:1fr; } }
.loc-preview-col { min-width:0; display:flex; flex-direction:column; align-items:center; }
.loc-terrain-col { min-width:0; }
.loc-climate-col { grid-column:1 / -1; min-width:0; }
.loc-map-frame {
  width:min(100%, 300px); aspect-ratio:1/1; background:#cdd3ec;
  border:2px solid var(--blue); border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:#5465c5; border-top-color:#5465c5;
}
.loc-map-frame svg { width:100%; height:100%; display:block; }
.loc-section-label { font-size:22px; color:#7a86bb; letter-spacing:.4px; margin:0 0 8px; }
.loc-cat-tabs { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
.loc-cat-btn {
  padding:4px 10px; background:#dfe2ef;
  border:2px solid var(--blue); border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:#5465c5; border-top-color:#5465c5;
  font-family:var(--font-hand); font-size:13px; letter-spacing:.5px;
  color:#3a4aaa; cursor:pointer; user-select:none; transition:filter .1s;
}
.loc-cat-btn:hover { filter:brightness(1.06); }
.loc-cat-btn.active { border-color:#3a4aaa; outline:2px solid #3a4aaa; outline-offset:1px; background:#e0f0f0; }
.loc-palette { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
.loc-terrain {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 6px; background:#dfe2ef; cursor:pointer; user-select:none;
  border:2px solid var(--blue); border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:#5465c5; border-top-color:#5465c5; transition:filter .1s;
}
.loc-terrain:hover { filter:brightness(1.06); }
.loc-terrain.active { border-color:#3a4aaa; outline:2px solid #3a4aaa; outline-offset:1px; background:#e0f0f0; }
.loc-terrain img { width:60px; height:50px; object-fit:contain; pointer-events:none; }
.loc-terrain span { font-size:13px; color:#3a4aaa; letter-spacing:.4px; pointer-events:none; }
.loc-climates { display:flex; flex-direction:column; gap:8px; }
.loc-climate {
  padding:7px 9px; border:2px solid var(--blue); border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:#5465c5; border-top-color:#5465c5;
}
.loc-climate.sunny { background:#f2e6a8; border-color:#715f04; }
.loc-climate.rainy { background:#ae87e2; border-color:#260156; }
.loc-climate.windy { background:#a3eac9; border-color:#046957; }
.loc-climate.snowy { background:#6cd1ea; border-color:#033f50; }
.loc-climate-head { font-size:clamp(30px,3vw,41px); margin-bottom:8px; }
.loc-climate.sunny .loc-climate-head { color:#715f04; }
.loc-climate.rainy .loc-climate-head { color:#260156; }

<script>
/* ============================================================
   COSMIC MATRIX — orchestration spine
   Paid-gated. Sole writer of cosmic_matrix. No more zodiac-season gating or
   cosmic_bingo linkage — cosmic_transits is a flat, ever-growing calendar of
   individual transits (ingresses/stations/aspects/lunations), computed via
   Swiss Ephemeris and populated straight into Supabase (no app code writes
   to it). Flow per transit: location (user-built) → character → library →
   journal → matrix render.
   No `games` table, no per-season anchor row — cosmic_matrix's per-transit
   rows are addressed directly by (user_id, transit_id): upsert on that key
   → no dup rows.
   ============================================================ */


const MATRIX_PHOTO_BUCKET = 'matrix-photos';
const LOGIN_URL   = '../rooms/game-room.html';      // where auth lives
const UPGRADE_URL = '../users/membership.html';     // TODO: confirm your pricing/upgrade page

// ── STATE ───────────────────────────────────────────────────
let currentUser    = null;
let allTransits    = [];     // every cosmic_transits row (global reference data), fetched once
let activeTransit  = null;   // the selected cosmic_transits row {transit_id, planet, planet_b, transit_type, sign, sign_b, name, exact_utc}
let activeLocation = null;   // user-built {name,terrain,feeling,tint,cat} for activeTransit
let activeMatrixEntryId = null;   // cosmic_matrix row id for (currentUser.id, activeTransit.transit_id) — resolved lazily in renderMatrix()
let currentStep    = null;   // 'location' | 'character' | 'library' | 'journal' — whichever popup is open
let completedSet   = new Set();   // transit_id keys that have a character row
let completedData  = new Map();   // transit_id → character_data
let justDoneKey    = null;

// ── HELPERS ─────────────────────────────────────────────────
const $ = id => document.getElementById(id);
// No-op — there's no heart guide to show this text anymore, but call sites
// throughout this file still pass guidance strings, so keep the function.
function setBubble(t){}
function showStatus(msg,color){ const el=$('status'); el.textContent=msg; el.style.color=color||'#6ab86a';
  clearTimeout(el._t); el._t=setTimeout(()=>el.textContent='',3000); }

// ── MATRIX PAGE TOGGLE — guards against leaving mid-rearrange ─────
async function matrixNav(e, url){
  e.preventDefault();
  const dirty = _matrixEditor && _matrixEditor.isDirty && _matrixEditor.isDirty();
  if (dirty) {
    const save = await HGModal.confirm(
      'unsaved changes',
      'you moved something on your matrix that hasn’t been saved yet. save before leaving?',
      { confirmLabel: 'save & leave', cancelLabel: 'stay' }
    );
    if (!save) return false;
    const host = $('matrix-panel-host');
    if (host) await _matrixEditor.saveAllPositions(host);
  }
  window.location.href = url;
  return false;
}
function setSave(visible,label='continue →'){ const bar=$('save-bar'),btn=$('save-btn');
  bar.classList.toggle('visible',visible); if(btn){ btn.innerHTML=label; btn.disabled=false; } }
function showPanel(html){ const p=$('quad-popup-body'); p.className='content-panel active'; p.innerHTML=`<div class="panel-scroll">${html}</div>`; }
function hidePanel(){ const p=$('quad-popup-body'); p.className='content-panel'; p.innerHTML=''; }
// The persistent matrix canvas (always visible, not a popup step).
function showMatrixPanel(html){
  const p = $('matrix-panel-host');
  p.innerHTML = html;
  void p.offsetHeight;
  p.querySelectorAll('.mx-note, .adv-sticker, .adv-photo').forEach(el => {
    const t = el.style.transform;
    el.style.transform = 'none';
    void el.offsetHeight;
    el.style.transform = t;
  });
}

// Same-origin game iframes don't auto-size to their content by default, so
// once loaded we measure the real document height and apply it directly —
// this is what lets the frame grow to fit instead of scrolling internally.
function autoSizeIframe(iframe){
  const resize = () => {
    try {
      const doc = iframe.contentDocument;
      const h = doc && doc.documentElement.scrollHeight;
      if (h) iframe.style.height = h + 'px';
    } catch (e) { /* cross-origin — keep fallback height */ }
  };
  iframe.addEventListener('load', () => {
    resize();
    try {
      if ('ResizeObserver' in window && iframe.contentDocument) {
        new ResizeObserver(resize).observe(iframe.contentDocument.documentElement);
      }
    } catch (e) {}
  });
}

function showIframe(src){ const p=$('quad-popup-body'); p.className='content-panel active iframe-mode';
  p.innerHTML=`<iframe class="game-iframe" id="game-iframe" src="${src}"></iframe>`;
  autoSizeIframe($('game-iframe')); }

function transits(){ return allTransits.slice().sort((a,b)=>Date.parse(a.exact_utc)-Date.parse(b.exact_utc)); }
function transitByKey(k){ return transits().find(t=>t.transit_id===k); }
function nowMs(){ return Date.now(); }
// "today" is a UTC calendar day — a transit dated today counts as active
// (clickable) regardless of whether its exact hour has passed yet.
function todayRangeUTC(){
  const n = new Date();
  const start = Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate());
  return [start, start + 86400000];
}
function isActiveTransit(t){ return Date.parse(t.exact_utc) < todayRangeUTC()[1]; }
function fmtTransitTime(t){
  const d=new Date(t.exact_utc);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' +
         d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

// ── BOOT ────────────────────────────────────────────────────
async function init(){
  try { const { data:{ session } } = await sb.auth.getSession(); currentUser = session?.user || null; } catch(e){}
  if (!currentUser){ return showLoginGate(); }

  // Paid gate: membership_status present and not 'free'
  let profile=null;
  try {
    const { data } = await sb.from('user-profiles')
      .select('username, membership_status, membership_tier, membership_expires_at')
      .eq('id', currentUser.id).maybeSingle();
    profile = data;
  } catch(e){}
  HeartabilityNav.setAuthState({ loggedIn: true, username: profile?.username || currentUser.email });
  const status = profile?.membership_status || null;
  const paid = HeartabilityMembership.isPaid(status);
  if (!paid){ return showUpgradeGate(); }

  await stepInitial();
}

// ── LANDING — land on the matrix canvas (see renderMatrix), then
// immediately open the transit picker on top of it — this is purely a
// transit tracker now (no season/sign picker), so there's no reason to make
// the user click into the "what's transiting?" quadrant just to see what's
// trackable. The matrix underneath stays locked (map/library/char) until a
// transit + location are picked, same as before. ──
async function stepInitial(){
  const list = await loadAllTransits();
  if (!list.length){ return showNoTransits(); }
  await loadProgress();
  await renderMatrix();
  if (!activeTransit) openTransitPopup();
}

sb.auth.onAuthStateChange((event, session)=>{
  if (event==='SIGNED_IN' && session && !currentUser){ currentUser=session.user; init(); }
});

// ── TRANSIT LOAD ─────────────────────────────────────────────
// Fetches the whole cosmic_transits calendar once and caches it in
// allTransits — it's global reference data (not per-user, not per-season),
// so there's no clone-on-open step and no map_id to mint.
async function loadAllTransits(){
  if (allTransits.length) return allTransits;
  try {
    const { data } = await sb.from('cosmic_transits').select('*').order('exact_utc', { ascending: true });
    allTransits = data || [];
  } catch(e){ console.error('[cosmic transits] load failed', e); }
  return allTransits;
}

// Which transits are already lived (have a character row).
async function loadProgress(){
  completedSet = new Set();
  completedData = new Map();
  try {
    const { data } = await sb.from('cosmic_matrix')
      .select('transit_id, character_data')
      .eq('user_id', currentUser.id);
    (data||[]).forEach(r=>{
      if (r.character_data){
        completedSet.add(r.transit_id);
        completedData.set(r.transit_id, r.character_data);
      }
    });
  } catch(e){}
}

const { TERRAIN_IMGS, TERRAIN_ORDER, WEATHER_CATS } = TreasureMap;

// ── BODY COLOR TABLE (mirrors CHAR_FULL_ASSETS slugs in infinity-mirror.html) ──

function resolveCharAsset(v){ return !v ? null : (v.includes('/') ? v : (CHAR_FULL_ASSETS[v]||null)); }

// ── TRANSIT SELECTOR (main view) ─────────────────────────────
function escSvg(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return (s||'').replace(/'/g,"\\'"); }

function showTransitSelector(){
  currentStep = null; activeTransit = null; activeLocation = null; activeMatrixEntryId = null;
  setSave(false);
  setBubble('choose a transit to track.');
  document.getElementById('quad-popup-window').classList.add('narrow-popup');
  const p = $('quad-popup-body');
  p.className = 'content-panel active';
  p.innerHTML = buildTransitSelectorView();
  // Cap the list to ~11 rows tall (then scroll) instead of growing the popup
  // to fit every transit — measured off a real row so it holds regardless of
  // font metrics/zoom.
  const list = p.querySelector('.transits-list');
  const firstRow = list?.querySelector('.transits-row');
  if (list && firstRow) list.style.maxHeight = (firstRow.offsetHeight * 11) + 'px';
  renderMatrix();
}

// One scrollable list covering every transit this season — past, today, and
// future — in place of the old season-title/today's-cards/past+future-popup
// trio. Season-level browsing (by sign, by planet, across past seasons)
// belongs to the archive, not here; this just needs to let you track today's
// (or a missed past) transit, or glance at what's coming.
function buildTransitSelectorView(){
  const list = transits();
  const rowsHtml = list.length
    ? list.map(t => {
        const clickable = isActiveTransit(t);
        return `<div class="transits-row${clickable ? ' transits-row-clickable' : ''}${t.transit_id===justDoneKey?' just-done':''}"${clickable ? ` onclick="selectTransit('${escAttr(t.transit_id)}')"` : ''}>
          <span>${escSvg(t.name||t.transit_id)}${completedSet.has(t.transit_id) ? ' ✓' : ''}</span>
          <span class="transits-row-time">${fmtTransitTime(t)}</span>
        </div>`;
      }).join('')
    : `<div class="transits-empty">no transits yet.</div>`;

  return `<div class="season-head">
      <div class="season-title">recent transits</div>
    </div>
    <div class="transits-list">${rowsHtml}</div>`;
}

// ── FLOW ────────────────────────────────────────────────────
// Picking a transit just closes the picker and sets it active — it does NOT
// jump straight into the location builder anymore. "where are you?" (the
// map quadrant) unlocks on the next render; building the location is a
// separate, deliberate click from there. Also how you switch to a different
// (already-active) transit — see openTransitPopup.
function selectTransit(transitId){
  const t = transitByKey(transitId);
  if (!t || !isActiveTransit(t)) return; // future transits aren't clickable
  activeTransit = t;
  activeLocation = null;
  activeMatrixEntryId = null;
  closeQuadrantPopup();
  renderMatrix();
  openTransitReading(t);
}

// ── LOCATION BUILDER — user builds their own experience of this transit
// (terrain + emotional climate), ported from daily.html's dayquest builder.
let locDraft = { name:null, terrain:null, feeling:null, tint:null, cat:null };

function buildLocationPalette(){
  const pal = $('loc-palette');
  pal.innerHTML = TreasureMap.TERRAIN.map(t => `
    <div class="loc-terrain" id="loc-terrain-${t.id}" data-cat="${t.cat}" onclick="pickLocationTerrain('${t.id}')">
      <img src="${TERRAIN_IMGS[t.id]}" alt="${t.id}">
      <span>${t.id}</span>
    </div>`).join('');
  TreasureMap.renderTerrainCatTabs($('loc-cat-tabs'), pal, { btnClass: 'loc-cat-btn' });
  const cl = $('loc-climates');
  cl.innerHTML = WEATHER_CATS.map(cat => `
    <div class="loc-climate ${cat.id}">
      <div class="loc-climate-head">${cat.label}</div>
      <div class="loc-chips">
        ${cat.feelings.map(f => `<span class="loc-chip" id="loc-chip-${f}"
            onclick="pickLocationFeeling('${f}','${cat.id}','${cat.tint}')">${f}</span>`).join('')}
      </div>
    </div>`).join('');
}

// Restores whatever terrain/feeling was already confirmed instead of wiping
// the draft — so going back from the character step doesn't undo this
// transit's location.
function openLocationBuilder(){
  locDraft = activeLocation
    ? { name: activeLocation.name||null, terrain: activeLocation.terrain||null, feeling: activeLocation.feeling||null, tint: activeLocation.tint||null, cat: activeLocation.cat||null }
    : { name:null, terrain:null, feeling:null, tint:null, cat:null };
  document.querySelectorAll('.loc-terrain.active, .loc-chip.active').forEach(el=>el.classList.remove('active'));
  if (locDraft.terrain) $(`loc-terrain-${locDraft.terrain}`)?.classList.add('active');
  if (locDraft.feeling) $(`loc-chip-${locDraft.feeling}`)?.classList.add('active');
  renderLocationPreview();
  refreshLocationConfirm();
  $('loc-overlay').classList.add('open');
}
function closeLocationBuilder(){ $('loc-overlay').classList.remove('open'); }

function pickLocationTerrain(id){
  locDraft.terrain = id;
  document.querySelectorAll('.loc-terrain').forEach(el=>el.classList.remove('active'));
  $(`loc-terrain-${id}`)?.classList.add('active');
  renderLocationPreview(); refreshLocationConfirm();
}
function pickLocationFeeling(feeling,cat,tint){
  locDraft.feeling = feeling; locDraft.cat = cat; locDraft.tint = tint;
  document.querySelectorAll('.loc-chip').forEach(el=>el.classList.remove('active'));
  $(`loc-chip-${feeling}`)?.classList.add('active');
  renderLocationPreview(); refreshLocationConfirm();
}
function refreshLocationConfirm(){
  $('loc-confirm').disabled = !(locDraft.terrain && locDraft.feeling);
}

// One centered destination — terrain image + tint glow + feeling label
function renderLocationPreview(){
  const R=50, cx=150, cy=110;
  let defs='', body='';
  if (locDraft.tint){
    defs += `<radialGradient id="loctint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${locDraft.tint}" stop-opacity="1"/>
      <stop offset="55%" stop-color="${locDraft.tint}" stop-opacity=".85"/>
      <stop offset="100%" stop-color="${locDraft.tint}" stop-opacity="0"/></radialGradient>`;
    body += `<circle cx="${cx}" cy="${cy}" r="${R+40}" fill="url(#loctint)"/>`;
  }
  if (locDraft.terrain && TERRAIN_IMGS[locDraft.terrain]){
    body += `<image x="${cx-R}" y="${cy-R}" width="${R*2}" height="${R*2}"
      href="${TERRAIN_IMGS[locDraft.terrain]}" preserveAspectRatio="xMidYMid meet"/>
      <text x="${cx}" y="${cy-R-8}" text-anchor="middle" fill="#000000"
        font-family="ZoesHandwriting,cursive" font-size="16" font-weight="bold">${locDraft.terrain} of</text>`;
  } else {
    body += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(200,196,180,.5)"
      stroke="#6e83d3" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#7a86bb"
        font-family="ZoesHandwriting,cursive" font-size="13">pick a terrain</text>`;
  }
  if (locDraft.feeling){
    body += `<text x="${cx}" y="${cy+R+22}" text-anchor="middle" fill="#000000"
      font-family="ZoesHandwriting,cursive" font-size="16" font-weight="bold">${locDraft.feeling}</text>`;
  }
  $('loc-map-frame').innerHTML = `<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}</svg>`;
}

async function confirmLocation(){
  if (!(locDraft.terrain && locDraft.feeling)) return;
  activeLocation = { name: locDraft.name||null, terrain: locDraft.terrain, feeling: locDraft.feeling, tint: locDraft.tint, cat: locDraft.cat };
  const btn = $('loc-confirm'); if (btn){ btn.disabled = true; btn.innerHTML='saving…'; }
  try {
    const { error } = await sb.from('cosmic_matrix').upsert({
      user_id: currentUser.id, transit_id: activeTransit.transit_id,
      location_data: activeLocation,
      updated_at: new Date().toISOString(),
    }, { onConflict:'user_id,transit_id' });
    if (error) throw error;
    showStatus('location saved ✓','#6ab86a');
    closeLocationBuilder();
    await renderMatrix();
  } catch(err){
    console.error('[location save]', err);
    HGModal.alert('oops','save failed');
    if (btn){ btn.disabled=false; btn.innerHTML='add to matrix →'; }
  }
}

function stepCharacter(){
  currentStep = 'character';
  const locLabel = activeLocation?.name || (activeLocation ? `the ${activeLocation.terrain} of ${activeLocation.feeling}` : 'this transit');
  setBubble(`who are you in ${locLabel}?`);

function openCharacterBuilder(){

  setSave(true,'loading…'); $('save-btn').disabled = true;

// ── ARCHETYPE PICKER — reuse a saved cast member or build new ─
function _buildArchStack(charData){
  const layers = ['body','hair','eyes','mouth'].map(k => resolveCharAsset(charData[k])).filter(Boolean);
  if (!layers.length) return '';
  return `<div class="arch-stack">${layers.map(s=>`<img src="${s}" alt="" onerror="this.style.display='none'">`).join('')}</div>`;
}

async function showArchetypePicker(){
  currentStep = 'character';
  const p = $('quad-popup-body');
  p.className = 'content-panel active';
  p.innerHTML = `<div class="panel-scroll"><div class="arch-picker-loading">loading your cast…</div></div>`;
  setSave(false);

  const { data, error } = await sb.from('character_archetypes')
    .select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
  if (error) console.error('[archetypes] fetch failed:', error);
  renderArchetypePicker(data || []);
}

function renderArchetypePicker(archetypes){
  if (currentStep !== 'character') return;
  const cards = archetypes.map(a => `
    <button class="arch-card" data-id="${a.id}" type="button">
      ${_buildArchStack(a)}
      <div class="arch-card-name">${(a.name || 'unnamed')}</div>
    </button>`).join('');
  showPanel(`
    <div class="step-panel">
      <div class="arch-picker">
        <div class="arch-picker-title">choose an archetype for today</div>
        <div class="arch-grid">
          ${cards}
          <button class="arch-card arch-card-new" id="arch-new-btn" type="button">
            <div class="arch-card-plus">+</div>
            <div class="arch-card-name">create new</div>
          </button>
        </div>
      </div>
    </div>`);
  document.querySelectorAll('.arch-card[data-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const a = archetypes.find(x => x.id === btn.dataset.id);
      if (a) useArchetype(a);
    });
  });
  document.getElementById('arch-new-btn').addEventListener('click', openCharacterBuilder);
}

async function useArchetype(archetype){
  const charState = {
    name: archetype.name, body: archetype.body,
    hair: archetype.hair, eyes: archetype.eyes, mouth: archetype.mouth,
  };
  await saveCharacterAndAdvance(charState, { fork: false, archetypeId: archetype.id });
}

// Saves charState to cosmic_matrix (this transit's location is already
// saved by this point — the location quadrant is filled in first — so this
// only ever touches character_data/archetype_id). When fork is true (built
// fresh via the character builder), also adds it to the user's reusable
// cast — picking a saved archetype never touches that table again.
async function saveCharacterAndAdvance(charState, { fork, archetypeId }){
  try {
    // New archetypes are inserted before the matrix row so the row can be
    // stamped with the real archetype_id in the same save.
    let finalArchetypeId = archetypeId || null;
    if (fork) {
      const { data: newArch, error: forkErr } = await sb.from('character_archetypes').insert({
        user_id: currentUser.id, name: charState.name || null,
        body: charState.body, hair: charState.hair,
        eyes: charState.eyes, mouth: charState.mouth,
      }).select().single();
      if (forkErr) console.error('[archetypes] save failed:', forkErr);
      else finalArchetypeId = newArch.id;
    }

    const { error } = await sb.from('cosmic_matrix').upsert({
      user_id: currentUser.id, transit_id: activeTransit.transit_id,
      character_data: charState,
      archetype_id: finalArchetypeId,
      updated_at: new Date().toISOString(),
    }, { onConflict:'user_id,transit_id' });
    if (error) throw error;
    completedData.set(activeTransit.transit_id, charState);
    completedSet.add(activeTransit.transit_id);
    justDoneKey = activeTransit.transit_id;

    showStatus('character saved ✓','#6ab86a');
    closeQuadrantPopup();
    await renderMatrix();
  } catch(err){ console.error('[char save]',err); HGModal.alert('oops','save failed'); const b=$('save-btn'); b.disabled=false; b.innerHTML='add to matrix →'; }
}

// ── THE INVENTORY (media/tools tie-in, between character and journal) ─────
// Lets the player tag books/movies/tools from their personal collection to
// this landscape before writing their journal. Panel logic lives in the
// shared matrix-inventory.js module (also used by dream.html/daily.html).
const inventoryPanel = MatrixInventory.createPanel({
  sb,
  getCurrentUser: () => currentUser,
  persist: async (fields) => {
    const { error } = await sb.from('cosmic_matrix').upsert({
      user_id: currentUser.id, transit_id: activeTransit.transit_id,
      updated_at: new Date().toISOString(),
      ...fields,
    }, { onConflict:'user_id,transit_id' });
    if (error) throw error;
  },
  onContinue: () => { closeQuadrantPopup(); renderMatrix(); },
  backStep: () => closeQuadrantPopup(),
});

function stepLibrary(){
  currentStep = 'library';
  setBubble('anything from your inventory echoing in this landscape?');
  const p=$('quad-popup-body');
  p.className='content-panel active';
  p.innerHTML=inventoryPanel.panelHtml();
  inventoryPanel.enter();
  setSave(true,'add to matrix →');
}

async function saveLibrarySelection(){
  const btn = $('save-btn');
  const result = await inventoryPanel.save();
  if (!result.ok) {
    HGModal.alert('oops','save failed');

// Panel logic lives in the shared matrix-journal.js module (also used by
// dream.html/daily.html). Messages persist on every send — there's no
// separate "done" step; closing the popup (×) is all that's needed.
// Row order alternation is keyed off the global transit calendar's order
// (not position among filtered/loaded rows) so a given transit always lands
// on the same side across sessions; character_data isn't selected per-row
// (cosmic_matrix doesn't need it re-fetched) — completedData already holds
// it from the transit picker's own query.
const journalPanel = MatrixJournal.createPanel({
  sb,
  getCurrentUser: () => currentUser,
  table: 'cosmic_matrix',
  charAssets: CHAR_FULL_ASSETS,
  placeholder: 'what feels important?',
  emptyText: 'you have no messages',
  allowPhoto: true,
  photoBucket: MATRIX_PHOTO_BUCKET,
  buildPhotoPath: (file, ext) => `${currentUser.id}/${activeTransit.transit_id}/journal-${crypto.randomUUID()}.${ext}`,
  isReady: () => !!activeTransit,
  identityColumns: ['user_id', 'transit_id'],
  buildUpsertBase: () => ({ user_id: currentUser.id, transit_id: activeTransit.transit_id }),
  rowMatchesActive: row => row.transit_id === activeTransit.transit_id,
  sideForRow: row => {
    const idx = transits().map(t => t.transit_id).indexOf(row.transit_id);
    return idx % 2 === 0 ? 'left' : 'right';
  },
  charDataForRow: row => completedData.get(row.transit_id) || null,
  locationLabelForRow: row => {
    const l = row.location_data;
    if (l?.name) return l.name;
    if (l?.terrain && l?.feeling) return `the ${l.terrain} of ${l.feeling}`;
    return transitByKey(row.transit_id)?.name || '';
  },
  loadHistoryRows: async () => {
    const { data } = await sb.from('cosmic_matrix')
      .select('transit_id, journal_messages, matrix_images, location_data, updated_at')
      .eq('user_id', currentUser.id)
      .order('updated_at', { ascending: true });
    return data || [];
  },
});

function stepJournal(){
  currentStep = 'journal';
  setBubble('what did you discover in this landscape?');
  const p=$('quad-popup-body');
  p.className='content-panel active';
  p.innerHTML=journalPanel.panelHtml();
  journalPanel.enter();
}

// ── STEP: THE COSMIC MATRIX (native, no iframe) ───────────
// Same scrapbook as dream.html/daily.html — rendering + interactive editing
// (drag/rotate/resize, add photo/sticker/text, the save button) all live in
// matrix-render.js. See MatrixRender.buildHTML/createMatrixEditor. This file
// only resolves this transit's cosmic_matrix row id and wires step navigation.
// Unlike dream/daily, cosmic_matrix rows aren't addressed by a client-minted
// id — they're upserted by (map_id, transit_id) — so the row's own id is
// looked up lazily the first time this transit's matrix is shown.
let _matrixEditor = null;
function getMatrixEditor(){
  if (_matrixEditor) return _matrixEditor;
  _matrixEditor = MatrixRender.createMatrixEditor({
    sb, table: 'cosmic_matrix',
    getEntryId: () => activeMatrixEntryId,
    getUserId: () => currentUser?.id,
    status: (msg, color) => showStatus(msg, color),
    onChange: renderMatrix,
    onQuadrantOpen: openQuadrant,
    onOpenJournal: openJournalPopup,
  });
  return _matrixEditor;
}

// The 'bingo' key is repurposed here — the real bingo meter is hidden
// (bingo is the standalone cosmic-bingo.html season page now), so this slot
// is reused as the "what's transiting?" tile instead: since hasBingo never
// goes true for cosmic_matrix rows (bingoScore is never populated from this
// table — see MatrixRender.assemble), it always renders as an open prompt,
// never "fills" — a permanent button to reopen the transit picker/switcher.
const QUADRANT_PROMPTS = {
  bingo: "what's transiting?", map: 'where are you?', library: "what's in your bag?", char: 'who are you?',
};

// Delegated click listener for the whole canvas (quadrant prompts, photo
// add/remove, notes) — bound once to the stable #matrix-panel-host and left
// in place for the page's lifetime (innerHTML swaps on every render, but the
// host node itself never does), so "what's transiting?" is clickable even
// on the very first render, before any transit is ever picked.
let _matrixClickWired = false;
function ensureMatrixClickWiring(panel){
  if (_matrixClickWired) return;
  MatrixRender.attachMatrix(panel, {
    onRemovePhoto: url => getMatrixEditor().removeMatrixPhoto(url),
    onQuadrantOpen: openQuadrant,
  });
  _matrixClickWired = true;
}

// Re-assemble + redraw the matrix in place — this is the landing view
// itself now (see stepInitial), not a final "step". With no activeTransit
// selected yet, "what's transiting?" (top-left) is the only unlocked
// prompt — it's how you pick one; "where are you?" (the location/map
// builder) stays locked until a transit is active, and library/char stay
// locked until this transit's location is confirmed.
let _matrixSeed = 'matrix';
async function renderMatrix(){
  const panel = $('matrix-panel-host');
  ensureMatrixClickWiring(panel);

  if (!activeTransit) {
    showMatrixPanel(MatrixRender.buildHTML({}, _matrixSeed, {
      showEditNotes: false, showFrame: true, editable: false,
      quadrantPrompts: QUADRANT_PROMPTS, lockedQuadrants: ['map', 'library', 'char'],
    }));
    return;
  }

  if (!activeMatrixEntryId){
    try {
      const { data: row } = await sb.from('cosmic_matrix').select('id')
        .eq('user_id', currentUser.id).eq('transit_id', activeTransit.transit_id).maybeSingle();
      activeMatrixEntryId = row?.id || null;
    } catch(e){ console.error('[cosmic matrix] row lookup failed', e); }
  }
  const data = await MatrixRender.assemble(sb, activeMatrixEntryId, null, 'cosmic_matrix');
  data.mapName = activeLocation?.name
    || (activeLocation ? `${activeLocation.terrain} of ${activeLocation.feeling}` : null)
    || activeTransit?.name || 'this transit';
  // Header title (matrix-date slot) — the selected transit's own name, not
  // the location description mapName carries (see assemble()'s doc comment).
  data.dateLabel = activeTransit?.name || 'this transit';
  const hasLocation = !!(data.locationData || data.sidequestData);

  // Cosmic-only layout tweak: the shared renderer's default spot for the
  // location item is external-action (top-left) — for cosmic that quadrant
  // is reserved for this transit's planet glyphs instead (see below), so
  // give location a default of internal-action (bottom-left), where the
  // shared renderer's per-entry bingo meter used to sit (bingo is now the
  // standalone cosmic-bingo.html season page, so that item is hidden via
  // CSS below rather than removed from matrix-render.js, which dream/daily
  // still use unchanged). Only sets a default — a manually dragged position
  // (data.matrixLayout.map already present) always wins.
  if (!data.matrixLayout) data.matrixLayout = {};
  if (!data.matrixLayout.map) data.matrixLayout.map = { x: 27, y: 71 };

  _matrixSeed = `${currentUser.id}|${activeTransit.transit_id}`;
  showMatrixPanel(MatrixRender.buildHTML(data, _matrixSeed, {
    showEditNotes: false, showFrame: true,
    editable: !!activeMatrixEntryId, showJournalTool: !!activeMatrixEntryId,
    // No 'bingo' key once a transit is active — the "what's transiting?"
    // prompt tile should disappear the same way "where are you?" disappears
    // once hasMap is true, replaced by the badge injected below instead.
    quadrantPrompts: { map: QUADRANT_PROMPTS.map, library: QUADRANT_PROMPTS.library, char: QUADRANT_PROMPTS.char },
    lockedQuadrants: hasLocation ? [] : ['library', 'char'],
  }));
  const editor = getMatrixEditor();
  editor.attachInteractions(panel);

  // Cosmic-only: once a transit is active, its planet glyphs (or a fallback
  // icon, so there's always something to click) take over the top-left spot
  // that "what's transiting?" vacated — a small clickable badge, not a
  // matrix-render.js quadrant item (that system has no concept of "planets
  // in this transit"), so it's layered on after the shared render and wired
  // with its own click handler straight to openTransitPopup (switch).
  const matrixEl = panel.querySelector('.adv-matrix');
  if (matrixEl) {
    matrixEl.insertAdjacentHTML('beforeend', buildTransitBadgeHTML(activeTransit));
    matrixEl.querySelector('.cosmic-transit-badge')?.addEventListener('click', openTransitPopup);
  }
}

function buildTransitBadgeHTML(transit){
  const planets = planetsOf(transit);
  const type = transitType(transit);
  const planetImgs = planets.map(p => `<img src="../assets/elements/glyphs/${p}.png" alt="${p}" class="cosmic-transit-glyph" onerror="this.style.display='none'">`);
  const typeImg = type
    ? `<img src="../assets/elements/glyphs/${TRANSIT_TYPE_READINGS[type].glyph}.png" alt="${type}" class="cosmic-transit-glyph cosmic-transit-glyph-aspect" onerror="this.style.display='none'">`
    : '';
  // With exactly two planets (an aspect between them), the type glyph reads
  // naturally between them (planet — aspect — planet); otherwise (e.g. a
  // single-planet retrograde/direct transit) just tack it on the end.
  const inner = planetImgs.length === 2
    ? planetImgs[0] + typeImg + planetImgs[1]
    : planetImgs.join('') + typeImg;
  return `<div class="cosmic-transit-badge" title="switch transits">${inner || '<span class="cosmic-transit-badge-fallback">⇄</span>'}</div>`;
}

// ── TRANSIT READING — "scientific label" style explainer for the active
// transit's planets + type (an aspect between two planets, e.g. "Saturn
// square Venus", or a single planet's motion, e.g. "Mercury retrograde"),
// opened when a transit is selected (see selectTransit). cosmic_transits
// carries the type as a real column now (transit_type: 'ingress' |
// 'station_retrograde' | 'station_direct' | 'new_moon' | 'full_moon' |
// 'conjunction' | 'sextile' | 'square' | 'trine' | 'opposition') — no more
// guessing it out of the name string.
function planetsOf(t){ return [t?.planet, t?.planet_b].filter(Boolean); }
const PLANET_READINGS = {
  sun: 'The sun wants to be seen (skills, performance, legacy)',
  moon: 'The moon wants to feel (emotions, cycles, intuition)',
  mercury: 'Mercury wants to find connections (reviewing, returning, realizing)',
  venus: 'Venus wants to love (devotion, values, aesthetics)',
  mars: 'Mars wants to take action (passion, effort, desire)',
  jupiter: 'Jupiter wants to create space (learn, trust, expand)',
  saturn: 'Saturn wants to create structure (lists, rules, frameworks)',
  uranus: 'Uranus wants to disrupt the room (spark, surprise, shock)',
  neptune: 'Neptune wants to explore the unknown (dream, dissociate, drown)',
  pluto: 'Pluto wants to transform (power, endings, rebirth)',
};
const SIGN_READINGS = {
  aries: 'Aries is the sign of youth',
  taurus: 'Taurus is the sign of pleasure',
  gemini: 'Gemini is the sign of performance',
  cancer: 'Cancer is the sign of feeling deeply',
  leo: 'Leo is the sign of attention',
  virgo: 'Virgo is the sign of order',
  libra: 'Libra is the sign of balance',
  scorpio: 'Scorpio is the sign of depth',
  sagittarius: 'Sagittarius is the sign of exploration',
  capricorn: 'Capricorn is the sign of structure',
  aquarius: 'Aquarius is the sign of the future',
  pisces: 'Pisces is the sign of the imagination',
};
const ASPECT_READINGS = {
  sextile:     { glyph:'sextile',  label:'Sextiles create secret pathways' },
  trine:       { glyph:'trine',    label:'Trines create harmony' },
  square:      { glyph:'square',   label:'Squares create friction' },
  opposition:  { glyph:'opposition', label:'Oppositions create tension' },
  conjunction: { glyph:'conjunct', label:'Conjunctions create partnership' },
};
const MOTION_READINGS = {
  retrograde: { glyph:'retrograde', label:'Retrograde! Time for review…' },
  direct:     { glyph:'direct',     label:'Going direct again!' },
};
const TRANSIT_TYPE_READINGS = { ...ASPECT_READINGS, ...MOTION_READINGS };
// Maps cosmic_transits.transit_type onto a TRANSIT_TYPE_READINGS key — plain
// ingresses/lunations have no aspect/motion reading card, so they map to null.
const TRANSIT_TYPE_TO_READING = {
  station_retrograde: 'retrograde', station_direct: 'direct',
  conjunction: 'conjunction', sextile: 'sextile', square: 'square',
  trine: 'trine', opposition: 'opposition',
};
function transitType(t){ return TRANSIT_TYPE_TO_READING[t?.transit_type] || null; }
function buildTransitReadingHTML(transit){
  const planets = planetsOf(transit);
  const type = transitType(transit);
  const typeInfo = type ? TRANSIT_TYPE_READINGS[type] : null;
  const heading = typeInfo ? `<div class="reading-aspect-label">${escSvg(typeInfo.label)}</div>` : '';
  const planetItem = p => PLANET_READINGS[p] ? `<div class="reading-item">
      <img src="../assets/elements/glyphs/${p}.png" alt="${p}" class="reading-item-glyph" onerror="this.style.display='none'">
      <div class="reading-item-dash"></div>
      <div class="reading-item-text">${escSvg(PLANET_READINGS[p])}</div>
    </div>` : '';
  const typeItem = typeInfo ? `<div class="reading-item reading-item-aspect">
      <img src="../assets/elements/glyphs/${typeInfo.glyph}.png" alt="${type}" class="reading-item-glyph" onerror="this.style.display='none'">
    </div>` : '';
  const signItem = s => SIGN_READINGS[s] ? `<div class="reading-item">
      <img src="../assets/elements/glyphs/${s}.png" alt="${s}" class="reading-item-glyph" onerror="this.style.display='none'">
      <div class="reading-item-dash"></div>
      <div class="reading-item-text">${escSvg(SIGN_READINGS[s])}</div>
    </div>` : '';
  const signs = [transit?.sign, transit?.sign_b].filter(Boolean);
  const row = (planets.length === 2
    ? planetItem(planets[0]) + typeItem + planetItem(planets[1])
    : planets.map(planetItem).join('') + typeItem)
    + signs.map(signItem).join('');
  return `${heading}<div class="reading-row">${row}</div>`;
}
function openTransitReading(transit){
  if (!transit) return;
  $('reading-side-body').innerHTML = buildTransitReadingHTML(transit);
  $('reading-side-panel').classList.add('open');
}
function closeTransitReading(){ $('reading-side-panel').classList.remove('open'); }

// ── QUADRANT POPUP SHELL — modal overlay hosting whichever quadrant's
// content is currently open. showPanel/showIframe (unchanged) render into
// #quad-popup-body inside it. No back-navigation chrome — each quadrant's
// content is self-contained; the popup's own × is the only way out. The
// location quadrant uses its own separate #loc-overlay instead (see below).
function openQuadrantPopup(title) {
  closeTransitReading();
  setQuadPopupTitle(title);
  document.getElementById('quad-popup-window').classList.remove('narrow-popup');
  document.getElementById('quad-popup-overlay').classList.add('open');
}
function setQuadPopupTitle(title) {
  document.getElementById('quad-popup-title').textContent = title || '';
}
function closeQuadrantPopup() {
  document.getElementById('quad-popup-overlay').classList.remove('open');
  hidePanel();
  setSave(false);
  currentStep = null;
}
function handleQuadPopupOverlayClick(e) {
  if (e.target === document.getElementById('quad-popup-overlay')) closeQuadrantPopup();
}

// Dispatches a quadrant click/dblclick (from the matrix canvas) to the
// right popup. "bingo" (the "what's transiting?" tile) is the only one
// that's never gated on activeTransit — it's how you get one in the first
// place, and how you switch to a different one later. map/library/char are
// all locked until a transit exists (library/char additionally wait on the
// location being confirmed), so this should only ever fire for those once
// they're unlocked — the guard is just a safety net.
function openQuadrant(quadrant) {
  if (quadrant === 'bingo') return openTransitPopup();
  if (!activeTransit) return;
  if (quadrant === 'map') return openLocationBuilder();
  if (quadrant === 'char') return openCharPopup();
  if (quadrant === 'library') return openLibraryPopup();
}
// Opens the recent-transits picker — loads the whole cosmic_transits
// calendar the first time (no season/sign picker — it's just one flat,
// ever-growing list now), then just reopens the already-loaded list on
// later visits. Picking a transit here only activates it (see selectTransit)
// — it never opens the location builder itself; that's a separate, explicit
// click on "where are you?" once this tile unlocks it.
async function openTransitPopup(){
  openQuadrantPopup(QUADRANT_PROMPTS.bingo);
  if (allTransits.length) { showTransitSelector(); return; }
  showPanel('<div class="loading-msg">reading the sky…</div>');
  const list = await loadAllTransits();
  if (!list.length) { closeQuadrantPopup(); showNoTransits(); return; }
  showTransitSelector();
}
function openCharPopup() {
  openQuadrantPopup(QUADRANT_PROMPTS.char);
  showArchetypePicker();
}
function openLibraryPopup() {
  openQuadrantPopup(QUADRANT_PROMPTS.library);
  stepLibrary();
}
function openJournalPopup() {
  if (!activeTransit) return;
  openQuadrantPopup('journal');
  stepJournal();
}

// ── SAVE & CONTINUE — matrix owns every write ───────────────
async function saveAndContinue(){
  const btn = $('save-btn'); btn.disabled = true; btn.textContent='saving…';

  if (currentStep === 'library'){ await saveLibrarySelection(); return; }

  const iframe = $('game-iframe');
  if (!iframe){ btn.disabled=false; return; }
  iframe.contentWindow.postMessage({ type:'request_state' }, '*');
  clearTimeout(window._fb);
  window._fb = setTimeout(()=>{ if (btn.disabled){ btn.disabled=false;
    btn.innerHTML='add to matrix →'; HGModal.alert('oops','something went wrong — try again'); } }, 5000);
}

// ── MESSAGE HANDLERS — character builder iframe reports, matrix writes ──
window.addEventListener('message', async e=>{
  const msg = e.data || {}; if (!msg.type) return;

  // character builder loaded
  if (msg.type==='iframe_ready' && msg.game==='character'){
    if (currentStep==='character'){ const b=$('save-btn'); if(b){ b.disabled=false; b.innerHTML='add to matrix →'; } }
    return;
  }

  // character state → cosmic_matrix (idempotent on map_id, transit_id)
  if (msg.type==='char_state'){
    const charState = msg.state || {};
    if (!charState.body){ HGModal.alert('oops','pick a body first!'); const b=$('save-btn'); b.disabled=false; b.innerHTML='add to matrix →'; return; }
    if (!charState.name || !charState.name.trim()){ HGModal.alert('oops','name this archetype first!'); const b=$('save-btn'); b.disabled=false; b.innerHTML='add to matrix →'; return; }
    await saveCharacterAndAdvance(charState, { fork: true });
    return;
  }

  // ── Inventory "add an entry" iframe finished submitting ─────
  if (msg.type==='media_entry_saved'){
    inventoryPanel.onMediaSaved();
    return;
  }
});

document.addEventListener('DOMContentLoaded', () => {
  buildLocationPalette();
  HeartabilityNav.init({
    mount: '#gear-slot',
    assetsBase: '../assets',
    authMode: 'dynamic',
    sb: sb,
    profileHref: '../users/account-settings.html',
    music: { src: 'https://dn720704.ca.archive.org/0/items/HildegardVonBingenCanticlesOfEcstasy/Hildegard%20von%20Bingen%20-%20Canticles%20Of%20Ecstasy.mp3' },
    onSignOut: () => { currentUser = null; },
  });
  init();
});
