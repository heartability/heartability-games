function _buildCharStack(charState){
  if(!charState) return '';
  // Saved state stores bare IDs (e.g. "body_pink"); resolve each to its full-canvas PNG.
  // A value already containing "/" is treated as a ready URL (forward-compatible).
  const resolve = v => !v ? null
    : (typeof v === 'string' && v.includes('/') ? v : (CHAR_FULL_ASSETS[v] || null));
  // Same back→front order as the mirror: body, shoes, hair, eyes, mouth, acc (acc on top).
  const layers = [
    charState.body,
    charState.shoes,
    charState.hair,
    charState.eyes,
    charState.mouth,
    charState.acc,
  ].map(resolve).filter(Boolean);
  if(!layers.length) return '';
  return `<div class="adv-char-stack">${layers.map(s=>`<img src="${s}" alt="" onerror="this.style.display='none'">`).join('')}</div>`;
}

// PORTABLE: give it a day's data + a stable seed string, get matrix HTML back.
// data = { dateLabel, mapName, mapType, zones, bingoScore(0-24), charState,
//          journalText, journalImages[], archiveHref }
// Quadrant geometry for photo placement (matrix %). Each quadrant lays photos
// on a 2-col grid that grows inward from the matrix's outer corner, so photos
// cluster in their quadrant without their bodies overlapping each other.
const QUADRANTS = {
  'external-action':  { x0:13, y0:17, dx:+1 },  // top-left  (map)
  'external-feeling': { x0:87, y0:17, dx:-1 },  // top-right (character)
  'internal-action':  { x0:13, y0:61, dx:+1 },  // bottom-left (heart)
  'internal-feeling': { x0:87, y0:61, dx:-1 },  // bottom-right (journal)
};
const PHOTO_COLS = 2, PHOTO_COL_GAP = 17, PHOTO_ROW_GAP = 16;
function photoSlot(quadrant, n){
  const q = QUADRANTS[quadrant] || QUADRANTS['internal-feeling'];
  const col = n % PHOTO_COLS, row = Math.floor(n / PHOTO_COLS);
  return { left: q.x0 + q.dx * col * PHOTO_COL_GAP, top: q.y0 + row * PHOTO_ROW_GAP };
}

function buildAdventureMatrix(data, seedStr){
  const rnd = _seedRand(seedStr || 'matrix');
  const jit = r => (rnd()*2-1)*r;            // ± r
  const rot = r => ((rnd()*2-1)*r).toFixed(1);
  const pct = (a,b) => (a + rnd()*(b-a)).toFixed(1);

  // MAP → top-left quadrant (external + action)
  // Show ONLY the day's chosen destination (sidequest_data → location_data),
  // not the entire map.
  const dayLoc = data.sidequestData || data.locationData || {};
  const mapCap = data.sidequestData?.name || data.mapName || 'my map';
  const mapItem = `<div class="adv-item adv-map" style="left:${(27+jit(2)).toFixed(1)}%;top:${(30+jit(2)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(3)}deg);">
      <div class="adv-map-svg">${buildSingleLocationSVG(dayLoc)}</div>
      <div class="adv-cap">${_escapeHtml(mapCap)}</div></div>`;

  // BINGO (heart meter) → bottom-left quadrant (internal + action)
  const meterPct = Math.round(((data.bingoScore||0)/24)*100);
  const mode = (data.bingoScore||0)<=9 ? 'hard mode' : (data.bingoScore||0)<=19 ? 'medium mode' : 'easy mode';
  const bingoItem = `<div class="adv-item adv-bingo" style="left:${(27+jit(2)).toFixed(1)}%;top:${(71+jit(2)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(3)}deg);">
      <div class="adv-cap">heart meter</div>
      <div class="adv-meter"><div class="adv-meter-fill" style="width:${meterPct}%"></div></div>
      <div class="adv-mode">${mode}</div></div>`;

  // CHARACTER / infinity mirror → top-right quadrant (external + feeling)
  const charStack = _buildCharStack(data.charState);
  const charItem = charStack ? `<div class="adv-item adv-char" style="left:${(73+jit(2)).toFixed(1)}%;top:${(30+jit(2)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(3)}deg);">${charStack}</div>` : '';

  // NOTES (journal) → bottom-right quadrant (internal + feeling)
  const preview = _firstWords(data.journalText, 10);
  const journalItem = preview ? `<div class="adv-item adv-journal" style="left:${(73+jit(2)).toFixed(1)}%;top:${(71+jit(2)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(3)}deg);">
      <div class="adv-journal-text">${_escapeHtml(preview)}</div></div>` : '';

  // Photos — placed inside their assigned quadrant, spaced on a 2-col grid so
  // each photo's main body stays visible (only edges may overlap).
  const quadCount = {};
  let photos = '';
  (data.matrixImages||[]).forEach(img => {
    if (!img || !img.url) return;
    const q = QUADRANTS[img.quadrant] ? img.quadrant : 'internal-feeling';
    const n = quadCount[q] || 0; quadCount[q] = n + 1;
    const slot = photoSlot(q, n);
    photos += `<div class="adv-photo" style="left:${(slot.left+jit(1.5)).toFixed(1)}%;top:${(slot.top+jit(1.5)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(8)}deg);"><img src="${img.url}" alt="" onerror="this.parentElement.style.display='none'"><button class="adv-photo-remove" data-url="${_escapeHtml(img.url)}" title="remove photo" aria-label="remove photo">✕</button></div>`;
  });

  return `<div class="step-panel matrix-panel">
    <div class="matrix-header">
      <div class="matrix-date">${_escapeHtml(data.dateLabel||'')}</div>
      <button class="matrix-photo-btn" onclick="openPhotoUpload()"> add photos</button>
      <button class="matrix-archive-btn" onclick="window.location.href='${data.archiveHref||'#'}'">archive →</button>
    </div>
    <div class="matrix-frame">
      <div class="adv-matrix">
        <div class="adv-grid"></div>
        <div class="adv-axis adv-axis-x"></div>
        <div class="adv-axis adv-axis-y"></div>
        <div class="adv-axlbl" style="left:50%;top:3.5%;transform:translate(-50%,-50%) translateZ(0);">external</div>
        <div class="adv-axlbl" style="left:96.5%;top:50%;transform:translate(-50%,-50%) translateZ(0);writing-mode:vertical-rl;">feeling</div>
        <div class="adv-axlbl" style="left:50%;top:96.5%;transform:translate(-50%,-50%) translateZ(0);">internal</div>
        <div class="adv-axlbl" style="left:3.5%;top:50%;transform:translate(-50%,-50%) rotate(180deg);writing-mode:vertical-rl;">action</div>
        ${mapItem}${bingoItem}${charItem}${journalItem}
        ${photos}
      </div>
    </div>
  </div>`;
}

// Assemble this playthrough's saved data from the DB by its row id.
// (archive gathers its own data separately.)
async function assembleTodayMatrixData(entryId){
  const d = {
    dateLabel: new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),
    mapName: activeGameData?.map_name || 'my map',
    mapType: activeGameData?.map_type || 'spiral',
    zones: (activeGameData?.map_data||{}).zones || [],
    mapPhase: null,                              // selected phase — used by single-phase matrix render
    locationData: null,                          // {terrain,feeling,tint} of the selected place — self-contained
    sidequestData: null,                         // sidequest snapshot {terrain,feeling,tint,name} when phase==='sidequest'
    bingoScore: 0, charState: null, journalText: '', matrixImages: [],
    archiveHref: `archive.html?game_id=${activeGameId}`,
  };
  try {
    const { data: row } = await sb.from('saved_data').select('*')
      .eq('id', entryId).eq('user_id', currentUser.id).maybeSingle();
    if (row){
      d.charState    = row.character_data || null;
      d.bingoScore   = row.bingo_data?.score || 0;
      d.mapPhase     = row.map_phase || null;
      d.locationData = row.location_data || null;
      d.sidequestData= row.sidequest_data || null;
      d.journalText  = (Array.isArray(row.journal_messages)
        ? row.journal_messages.map(m => m && m.text).filter(Boolean).join(' ')
        : '');
      // All matrix photos — manual uploads AND journal images — now live in
      // matrix_images, each tagged to a quadrant (journal images: 'internal-feeling').
      d.matrixImages = Array.isArray(row.matrix_images) ? row.matrix_images : [];
    }
  } catch(e){}
  return d;
}

async function stepDone() {
  currentStep = 'done';
  setBubble("your entry is complete!");
  showPanel('<div class="step-panel matrix-panel"><div class="matrix-date" style="position:static;margin-top:40px;text-align:center;">gathering your day…</div></div>');
  _matrixSeed = `${activeGameId}|${activeEntryId}`;
  await renderMatrix();
}

// Re-assemble + redraw the matrix in place (used after adding a photo).
let _matrixSeed = 'matrix';
async function renderMatrix() {
  const data = await assembleTodayMatrixData(activeEntryId);
  showPanel(buildAdventureMatrix(data, _matrixSeed));
}

// ── MATRIX PHOTO UPLOAD ───────────────────────────────────
let photoDraft = { file:null, quadrant:null };

function openPhotoUpload(){
  photoDraft = { file:null, quadrant:null };
  document.getElementById('photo-file').value = '';
  document.getElementById('photo-preview').innerHTML =
    '<span class="photo-drop-hint">tap to choose an image</span>';
  document.querySelectorAll('.photo-quad.selected').forEach(el => el.classList.remove('selected'));
  const st = document.getElementById('photo-status');
  st.textContent = ''; st.style.color = '#8a7a5a';
  document.getElementById('photo-add-btn').textContent = 'add to matrix';
  refreshPhotoAdd();
  document.getElementById('photo-overlay').classList.add('open');
}
function closePhotoUpload(){
  document.getElementById('photo-overlay').classList.remove('open');
}
function onPhotoPicked(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const st = document.getElementById('photo-status');
  if (!file.type.startsWith('image/')){
    st.style.color = '#E8478B'; st.textContent = 'that file isn’t an image';
    photoDraft.file = null; refreshPhotoAdd(); return;
  }
  photoDraft.file = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('photo-preview').innerHTML = `<img src="${ev.target.result}" alt="">`;
  };
  reader.readAsDataURL(file);
  st.textContent = '';
  refreshPhotoAdd();
}
function pickQuadrant(q, el){
  photoDraft.quadrant = q;
  document.querySelectorAll('.photo-quad').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  refreshPhotoAdd();
}
function refreshPhotoAdd(){
  document.getElementById('photo-add-btn').disabled = !(photoDraft.file && photoDraft.quadrant);
}

async function uploadMatrixPhoto(){
  if (!(photoDraft.file && photoDraft.quadrant)) return;
  const st  = document.getElementById('photo-status');
  const btn = document.getElementById('photo-add-btn');
  if (!currentUser){
    st.style.color = '#E8478B'; st.textContent = 'sign in to save photos';
    return;
  }
  btn.disabled = true; btn.textContent = 'uploading…';
  st.style.color = '#8a7a5a'; st.textContent = 'uploading…';

  try {
    const file = photoDraft.file;
    const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    const path = `${currentUser.id}/${activeEntryId}/${crypto.randomUUID()}.${ext}`;

    const { error: upErr } = await sb.storage
      .from(MATRIX_PHOTO_BUCKET)
      .upload(path, file, { contentType: file.type, upsert: false });
    if (upErr) throw upErr;

    const { data: pub } = sb.storage.from(MATRIX_PHOTO_BUCKET).getPublicUrl(path);
    const publicUrl = pub?.publicUrl;
    if (!publicUrl) throw new Error('could not resolve image url');

    // Append {url,quadrant} to saved_data.matrix_images (read-modify-write).
    const { data: row, error: readErr } = await sb.from('saved_data')
      .select('matrix_images').eq('id', activeEntryId).maybeSingle();
    if (readErr) throw readErr;
    const current = Array.isArray(row?.matrix_images) ? row.matrix_images : [];
    const next = [...current, { url: publicUrl, quadrant: photoDraft.quadrant }];

    const { error: updErr } = await sb.from('saved_data')
      .update({ matrix_images: next }).eq('id', activeEntryId);
    if (updErr) throw updErr;

    closePhotoUpload();
    showRoomStatus('photo added ✓', '#6ab86a');
    await renderMatrix();
  } catch (err) {
    console.error('[matrix photo] upload failed:', err);
    st.style.color = '#E8478B';
    st.textContent = err?.message ? `couldn’t add photo: ${err.message}` : 'couldn’t add photo — try again';
    btn.disabled = false; btn.textContent = 'add to matrix';
  }
}

// Remove a photo from the matrix: drop its reference from matrix_images, then
// delete the file from storage. Keyed by url (UUID filenames are unique).
async function removeMatrixPhoto(url){
  if (!url || !currentUser || !activeEntryId) return;
  try {
    const { data: row } = await sb.from('saved_data')
      .select('matrix_images').eq('id', activeEntryId).maybeSingle();
    const imgs = Array.isArray(row?.matrix_images) ? row.matrix_images : [];
    const next = imgs.filter(i => !(i && i.url === url));
    if (next.length === imgs.length) { await renderMatrix(); return; }  // nothing matched
    const { error } = await sb.from('saved_data')
      .update({ matrix_images: next }).eq('id', activeEntryId);
    if (error) throw error;
  } catch (err) {
    console.error('[matrix photo] remove failed:', err);
    showRoomStatus('couldn’t remove photo — try again', '#E8478B');
    return;
  }
  await deleteMatrixPhotoFiles([url]);   // best-effort storage cleanup
  showRoomStatus('photo removed', '#8a7a5a');
  await renderMatrix();
}

// One delegated listener handles every photo's ✕ (the panel's innerHTML is
// rebuilt on each render, so per-button listeners would be lost).
document.getElementById('content-panel').addEventListener('click', e => {
  const btn = e.target.closest('.adv-photo-remove');
  if (!btn) return;
  e.stopPropagation();
  removeMatrixPhoto(btn.dataset.url);
});

// ── POSTMESSAGE FROM IFRAMES ──────────────────────────────
window.addEventListener('message', async e => {
  const msg = e.data || {};
  if (!msg.type) return;

  // ── iframe signalled it's loaded and ready ───────────────
  if (msg.type === 'iframe_ready' && msg.game === 'character') {
    const btn = document.getElementById('save-continue-btn');
    if (btn && currentStep === 'character') {
      btn.disabled = false;
      btn.innerHTML = 'continue →';
    }
    return;
  }

  // Game reported its map state — matrix owns the DB write
  if (msg.type === 'map_ready') {
    const { map_name, map_type, map_data } = msg;
    const btn = document.getElementById('save-continue-btn');

    if (!activeGameId) {
      // New map — INSERT into games
      const { data: newGame, error } = await sb.from('games').insert({
        user_id: currentUser.id,
        map_name: map_name || 'my map',
        map_type: map_type || 'spiral',
        map_data: map_data || { zones: [] },
        status: 'active',
      }).select().single();
      if (error) {
        if (btn) { btn.disabled = false; btn.innerHTML = 'continue →'; }
        showRoomStatus('save failed — try again', '#E8478B');
        return;
      }
      activeGameId   = newGame.id;
      activeGameData = { id: newGame.id, map_name, map_type, map_data: map_data || { zones: [] } };
    } else {
      // Existing map — UPDATE games
      const { error } = await sb.from('games')
        .update({ map_name, map_type, map_data, updated_at: new Date().toISOString() })
        .eq('id', activeGameId).eq('user_id', currentUser.id);
      if (error) {
        if (btn) { btn.disabled = false; btn.innerHTML = 'continue →'; }
        showRoomStatus('save failed — try again', '#E8478B');
        return;
      }
      activeGameData = { ...activeGameData, map_name, map_type, map_data: map_data || { zones: [] } };
    }

    activePhase = null;
    setSaveBtnVisible(false);
    showRoomStatus('map saved ✓', '#6ab86a');
    stepPhaseSelect();
    return;
  }

  // Map save failed — re-enable button with reason
  if (msg.type === 'map_save_failed') {
    const btn = document.getElementById('save-continue-btn');
    if (btn) { btn.disabled = false; btn.innerHTML = 'continue →'; }
    showRoomStatus(msg.reason || 'add a goal name and some terrain first', '#E8478B');
    return;
  }

  // ── Character state received — save to saved_data ───
  if (msg.type === 'char_state') {
    const charState = msg.state || {};
    if (!charState.body) {
      showRoomStatus('pick a body first!', '#E8478B');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'continue →';
      return;
    }
    let saved = false;

    // Resolve the place for this entry: a self-contained snapshot (terrain +
    // feeling + tint) so the matrix/archive can redraw it WITHOUT the parent map.
    let mapLocation = null, sidequestData = null, locationData = null;
    if (activePhase === 'sidequest' && activeSidequest) {
      mapLocation   = activeSidequest.terrain || null;
      sidequestData = activeSidequest;
      locationData  = { terrain: activeSidequest.terrain || null,
                        feeling: activeSidequest.feeling || null,
                        tint:    activeSidequest.tint    || null };
    } else if (activePhase && activeGameData?.map_data?.zones) {
      const idx = parseInt(String(activePhase).split('_')[1], 10) - 1;
      const z = activeGameData.map_data.zones[idx] || {};
      mapLocation  = z.terrain || null;
      locationData = { terrain: z.terrain || null,
                       feeling: z.feeling || null,
                       tint:    z.tint    || null };
    }

    const { error } = await sb.from('saved_data').upsert({
      id: activeEntryId,
      game_id: activeGameId, user_id: currentUser.id,
      map_phase: activePhase,
      location_data: locationData,
      sidequest_data: sidequestData,
      character_data: charState,
    }, { onConflict: 'id' });
    saved = !error;
    if (error) showRoomStatus('save failed', '#E8478B');

    if (saved) {
      showRoomStatus('character saved ✓', '#6ab86a');
      setSaveBtnVisible(false);
      stepBingo();
    } else {
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'continue →';
    }
    return;
  }

  // ── Bingo state received — save to saved_data ───────
  if (msg.type === 'bingo_state') {
    const { marked: markedArr, score } = msg;
    if (!score || score === 0) {
      showRoomStatus('check some squares first!', '#E8478B');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'continue →';
      return;
    }
    const energyScore  = Math.round((score / 24) * 100);
    const bingoPayload = { marked: markedArr, score };

    const { error } = await sb.from('saved_data').upsert({
      id: activeEntryId,
      game_id: activeGameId, user_id: currentUser.id,
      bingo_data: bingoPayload, energy_score: energyScore,
    }, { onConflict: 'id' });

    if (!error) {
      showRoomStatus('all saved ✓', '#6ab86a');
      setSaveBtnVisible(false);
      stepJournal();
    } else {
      showRoomStatus('save failed', '#E8478B');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'continue →';
    }
    return;
  }

});

// ── SVG BUILDERS (read-only, zone click = phase select) ──
function buildSpiralSVG(zones) {
  return spiralZonesSVG(zones, { interactive:true });
}

function buildSquareSVG(zones) {
  const R=36;
  let defs='<defs>';
  let circles='';
  let hits='';

  SQUARE_POS.forEach((p,i)=>{
    const z=zones[i]||{};
    const hasTerrain=!!(z.terrain&&TERRAIN_IMGS[z.terrain]);
    if(z.tint){
      defs+=`<radialGradient id="sqg${i}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="${z.tint}" stop-opacity="1"/>
        <stop offset="55%" stop-color="${z.tint}" stop-opacity=".85"/>
        <stop offset="100%" stop-color="${z.tint}" stop-opacity="0"/>
      </radialGradient>`;
      circles+=`<circle cx="${p.x}" cy="${p.y}" r="${R+48}" fill="url(#sqg${i})" pointer-events="none"/>`;
    }
    if(hasTerrain){
      defs+=`<clipPath id="sqc${i}"><circle cx="${p.x}" cy="${p.y}" r="${R-2}"/></clipPath>`;
    }
    circles+=`<circle id="zone-bg-${i}" cx="${p.x}" cy="${p.y}" r="${R}"
      fill="rgba(200,196,180,0)" stroke="transparent" stroke-width="2.5"/>`;
    if(hasTerrain){
      circles+=`<image x="${p.x-R}" y="${p.y-R}" width="${R*2}" height="${R*2}"
        href="${TERRAIN_IMGS[z.terrain]}" preserveAspectRatio="xMidYMid meet"
        clip-path="url(#sqc${i})" pointer-events="none"/>`;
    } else {
      circles+=`<circle cx="${p.x}" cy="${p.y}" r="${R}"
        fill="rgba(200,196,180,.82)" stroke="#8a7a5a" stroke-width="1.5" pointer-events="none"/>
        <text x="${p.x}" y="${p.y+5}" text-anchor="middle" dominant-baseline="middle"
          fill="#5a4a2a" font-family="ZoesHandwriting,cursive" font-size="22" pointer-events="none">${SQUARE_LABELS[i]}</text>`;
    }
    if(z.feeling){
      circles+=`<text x="${p.x}" y="${p.y+R+13}" text-anchor="middle"
        fill="#5a4a2a" font-family="ZoesHandwriting,cursive" font-size="11"
        pointer-events="none">${z.feeling}</text>`;
    }
    hits+=`<circle class="zone-hit" cx="${p.x}" cy="${p.y}" r="${R+8}"
      fill="transparent" style="cursor:pointer" onclick="selectPhase(${i})"/>`;
  });
  defs+='</defs>';

  return `<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
    ${defs}
    <image href="../assets/elements/square-1.png" x="25" y="10" width="450" height="380" preserveAspectRatio="xMidYMid meet" style="pointer-events:none;"/>
    ${circles}${hits}
  </svg>`;
}

// ── INIT ──────────────────────────────────────────────────
// ── SIDEQUEST BUILDER ─────────────────────────────────────
let sqDraft = { name:'', terrain:null, feeling:null, tint:null, cat:null };

function buildSidequestPalette() {
  // terrain thumbnails
  const pal = document.getElementById('sq-palette');
  pal.innerHTML = TERRAIN_ORDER.map(id => `
    <div class="sq-terrain" id="sq-terrain-${id}" onclick="sidequestPickTerrain('${id}')">
      <img src="${TERRAIN_IMGS[id]}" alt="${id}">
      <span>${id}</span>
    </div>`).join('');
  // climate groups with feeling chips
  const cl = document.getElementById('sq-climates');
  cl.innerHTML = WEATHER_CATS.map(cat => `
    <div class="sq-climate ${cat.id}">
      <div class="sq-climate-head">${cat.label}</div>
      <div class="sq-chips">
        ${cat.feelings.map(f => `<span class="sq-chip" id="sq-chip-${f}"
            onclick="sidequestPickFeeling('${f}','${cat.id}','${cat.tint}')">${f}</span>`).join('')}
      </div>
    </div>`).join('');
}

function openSidequestBuilder() {
  sqDraft = { name:'', terrain:null, feeling:null, tint:null, cat:null };
  document.getElementById('sq-name').value = '';
  document.querySelectorAll('.sq-terrain.active, .sq-chip.active')
    .forEach(el => el.classList.remove('active'));
  renderSidequestPreview();
  document.getElementById('sq-confirm').disabled = true;
  document.getElementById('sq-overlay').classList.add('open');
}
function closeSidequestBuilder() {
  document.getElementById('sq-overlay').classList.remove('open');
}

function sidequestPickTerrain(id) {
  sqDraft.terrain = id;
  document.querySelectorAll('.sq-terrain').forEach(el => el.classList.remove('active'));
  document.getElementById(`sq-terrain-${id}`)?.classList.add('active');
  renderSidequestPreview();
  refreshSidequestConfirm();
}
function sidequestPickFeeling(feeling, cat, tint) {
  sqDraft.feeling = feeling; sqDraft.cat = cat; sqDraft.tint = tint;
  document.querySelectorAll('.sq-chip').forEach(el => el.classList.remove('active'));
  document.getElementById(`sq-chip-${feeling}`)?.classList.add('active');
  renderSidequestPreview();
  refreshSidequestConfirm();
}
function refreshSidequestConfirm() {
  // terrain + feeling required; name optional
  document.getElementById('sq-confirm').disabled = !(sqDraft.terrain && sqDraft.feeling);
}

// One centered destination — terrain image + tint glow + feeling label
function renderSidequestPreview() {
  const R = 50, cx = 150, cy = 110;
  let defs = '', body = '';
  if (sqDraft.tint) {
    defs += `<radialGradient id="sqtint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${sqDraft.tint}" stop-opacity="1"/>
      <stop offset="55%" stop-color="${sqDraft.tint}" stop-opacity=".85"/>
      <stop offset="100%" stop-color="${sqDraft.tint}" stop-opacity="0"/></radialGradient>`;
    body += `<circle cx="${cx}" cy="${cy}" r="${R+40}" fill="url(#sqtint)"/>`;
  }
  if (sqDraft.terrain && TERRAIN_IMGS[sqDraft.terrain]) {
    defs += `<clipPath id="sqclip"><circle cx="${cx}" cy="${cy}" r="${R-2}"/></clipPath>`;
    body += `<image x="${cx-R}" y="${cy-R}" width="${R*2}" height="${R*2}"
      href="${TERRAIN_IMGS[sqDraft.terrain]}" preserveAspectRatio="xMidYMid meet" clip-path="url(#sqclip)"/>
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#8a7a5a" stroke-width="1.5"/>`;
  } else {
    body += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(200,196,180,.5)"
      stroke="#8a7a5a" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#8a7a5a"
        font-family="ZoesHandwriting,cursive" font-size="13">pick a place</text>`;
  }
  if (sqDraft.feeling) {
    body += `<text x="${cx}" y="${cy+R+22}" text-anchor="middle" fill="#2a1e14"
      font-family="ZoesHandwriting,cursive" font-size="16" font-weight="bold">${sqDraft.feeling}</text>`;
  }
  document.getElementById('sq-map-frame').innerHTML =
    `<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}</svg>`;
}

function confirmSidequest() {
  if (!(sqDraft.terrain && sqDraft.feeling)) return;
  activeSidequest = {
    name:    document.getElementById('sq-name').value.trim() || 'a secret place',
    terrain: sqDraft.terrain,
    feeling: sqDraft.feeling,
    tint:    sqDraft.tint,
    cat:     sqDraft.cat,
  };
  activePhase = 'sidequest';
  closeSidequestBuilder();
  stepBegin();   // mints the entry id and continues into character → bingo → journal
}

// ── INIT ──────────────────────────────────────────────────
async function init() {
  buildSidequestPalette();
  try {
    const { data:{ session } } = await sb.auth.getSession();
    currentUser = session?.user || null;
  } catch(e) {}

  stepInitial();
}

init();
