<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventure Matrix — Heartability</title>
<style>
@font-face { font-family:"ZoesHandwriting"; src:url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype"); }
@font-face { font-family:"PFPixelscript";  src:url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype"); }

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --back-wall:  #f1ebe4;
  --line-col:   #111;
  --blue:       #6579e2;
  --aqua:       #83d2e6;
  --ink:        #000f5a;
  --cream:      #fdf6e3;
  --bw-top:    9%;  --bw-left:  15%;
  --bw-width: 70%;  --bw-height:70%;
}

html, body { width:100vw; height:100dvh; overflow:hidden; user-select:none;
  background:url("../assets/elements/sky.png") center / cover no-repeat fixed;
  font-family:var(--font-hand); color:var(--ink); }

/* ── CONTENT PANEL — sits where back wall was ── */
.content-panel { position:fixed; top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height); z-index:10; display:none;
  flex-direction:column; overflow:hidden; }
.content-panel.active { display:flex; }
.content-panel.active:not(.iframe-mode) { background:var(--cream); border:2px solid var(--aqua); box-shadow:0 8px 22px rgba(0,0,0,.08); }

/* ── IFRAME PANEL ── */
.game-iframe { width:100%; height:100%; border:none; display:block; }
.content-panel.iframe-mode { border:3px solid #111; box-shadow:inset 0 0 0 2px var(--aqua); }

/* ── STEP PANELS (map grid, phase select) ── */
.step-panel {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items: center;
  overflow-y: auto; padding:20px;
  font-family:var(--font-hand);
}
.step-header {
  width: 100%;
}

/* Map grid — centered in the step panel */
.map-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(120px, 180px));
  gap: 12px;
  padding: 4px;
  justify-content: center;
}
@media (max-width:600px) { .map-grid { grid-template-columns: repeat(2, 1fr); } }

.map-slot {
  border: 2px solid #ccc; background: #fdf6e3;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: stretch;
  padding: 8px 8px 6px; gap: 5px;
  font-family: var(--font-hand); text-align: center;
  transition: border-color .15s, box-shadow .12s, transform .1s;
  position: relative;
  aspect-ratio: 4/5;
}
.map-slot:hover { border-color: var(--blue); box-shadow: 2px 2px 0 var(--blue); transform: translateY(-2px); }
.map-slot.empty { border-style: dashed; border-color: #e0e0e0; cursor: default; background: transparent; }
.map-slot.empty:hover { transform: none; box-shadow: none; border-color: #e0e0e0; }

/* Wall nav buttons — archive / profile links inside back wall */
.wall-nav-btn {
  background: none;
  border: 1.5px solid var(--blue);
  font-family: var(--font-hand);
  font-size: clamp(11px, 1.1vw, 13px);
  color: var(--blue);
  padding: 4px 10px;
  cursor: pointer;
  transition: background .12s, color .12s;
}
.wall-nav-btn:hover { background: var(--blue); color: #fff; }

/* Add new button — inside back wall, bottom right corner */
.add-new-btn {
  position: fixed;
  bottom: calc(21% + 12px);
  right: calc(15% + 12px);
  z-index: 20;
  padding: 10px 18px;
  background: var(--blue);
  border: 2px solid #4a5bc4;
  box-shadow: 3px 3px 0 #3a4aaa;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.4vw, 16px);
  color: #fff;
  cursor: pointer;
  transition: all .05s;
  display: none;
}
.add-new-btn.visible { display: block; }
.add-new-btn:hover { background: #4a5bc4; }
.add-new-btn:active { box-shadow: none; transform: translate(3px,3px); }
.slot-name    { font-size: 12px; color: #333; line-height: 1.2; word-break: break-word; font-weight: 600; flex-shrink: 0; }
.slot-updated { font-size: 10px; color: #bbb; flex-shrink: 0; }
.slot-preview {
  flex: 1; min-height: 0; overflow: hidden;
  background: #e8e0c8; border: 1px solid #c8b88a;
}
.slot-preview svg { width: 100%; height: 100%; display: block; }

/* Delete button on map slot */
.slot-delete {
  position:absolute; top:5px; right:6px;
  font-size:13px; color:#ccc; background:none; border:none;
  cursor:pointer; line-height:1; padding:2px 4px;
  transition:color .12s; z-index:2;
}
.slot-delete:hover { color:#E8478B; }

/* Phase select */
.phase-wrap {
  flex:1; position:relative; display:flex; gap:10px;
  align-items:stretch; overflow:hidden;
}
.phase-map-area {
  flex:1 1 58%; min-width:0; position:relative;
  background:#e8e0c8;
  border:2px solid #8a7a5a; border-right-color:#5a4a2a; border-bottom-color:#5a4a2a;
  border-left-color:#c8b88a; border-top-color:#c8b88a;
  overflow:hidden;
}
.phase-map-area svg { width:100%; height:100%; display:block; }

/* Phase key — full-height right column (no longer overlapping the map) */
.phase-key {
  flex:0 0 42%; min-width:230px; max-width:440px;
  align-self:stretch; max-height:100%;
  background:rgba(245,240,234,0.97);
  border:2px solid #8a7a5a;
  padding:14px 16px; overflow-y:auto;
  display:flex; flex-direction:column;
  font-family:var(--font-hand);
}
.phase-key-title { font-size:12px; color:#aaa; letter-spacing:.3px; margin-bottom:8px; }
.phase-key-item {
  display:flex; gap:8px; align-items:flex-start;
  padding:7px 10px; margin-bottom:5px;
  border:1.5px solid #ccc; background:#fdf6e3;
  cursor:pointer; font-size:13px; color:#555; line-height:1.4;
  transition:all .1s;
}
.phase-key-item:hover { border-color:var(--blue); color:var(--blue); background:#f0edfa; }
.phase-key-item.selected { border-color:var(--blue); background:var(--blue); color:#fff; box-shadow:2px 2px 0 #3a4aaa; }
.phase-key-num { font-size:11px; opacity:.55; min-width:14px; padding-top:2px; }

.begin-btn {
  padding:12px 18px; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:16px; color:#fff;
  cursor:pointer; margin-top:10px; transition:all .05s; width:100%;
}
.begin-btn:hover { background:#4a5bc4; }
.begin-btn:active { box-shadow:none; transform:translate(2px,2px); }
.begin-btn:disabled { opacity:.38; cursor:not-allowed; transform:none !important; }

/* Step header bar */
.step-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; flex-shrink:0;
}
.step-header-title { font-size:17px; color:#333; }
.step-back {
  font-size:14px; color:var(--blue); cursor:pointer;
}
.step-back:hover { text-decoration:underline; }

/* Loading state */
.loading-msg { font-family:var(--font-hand); font-size:15px; color:#aaa; text-align:center; padding:40px; }

/* ── NAV BAR ── */
.room-nav {
  position:fixed; top:0; left:0; right:0; height:44px;
  background:#c9fff5; border-bottom:2px solid var(--line-col);
  z-index:200; display:flex; align-items:center;
  justify-content:space-between; padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(14px,1.6vw,20px); color:#111;
}
.nav-btn { cursor:pointer; padding:4px 8px; border-radius:2px; transition:background .15s; }
.nav-btn:hover { background:rgba(0,0,0,.08); }

/* ── HEART CHARACTER ── */
@keyframes idle-pulse {
  0%,100% { transform:translateY(0) rotate(-2deg) scale(1); }
  50%      { transform:translateY(-8px) rotate(2deg) scale(1.03); }
}
.char-heart {
  position:fixed; left:4vw; bottom:6vh;
  width:clamp(100px,14vw,220px);
  z-index:20; cursor:default;
}
.char-heart .char-img {
  display:block; width:100%; height:auto;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.28));
  animation:idle-pulse 3.6s ease-in-out 1s infinite;
}

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position:absolute; left:calc(100% - 8px); bottom:60%;
  min-width:clamp(160px,18vw,260px); max-width:clamp(180px,22vw,300px);
  background:#fff; border:2px solid #000; border-radius:50%;
  padding:14px 20px; font-family:var(--font-hand);
  font-size:clamp(11px,1.3vw,15px); color:#000; text-align:center;
  line-height:1.5; filter:drop-shadow(1px 3px 5px rgba(0,0,0,.2));
  z-index:21;
}
.bubble-btns { display:none; } /* buttons moved to back wall */

/* ── WALL BUTTONS — centered on the back wall ── */
.wall-btns {
  position:fixed;
  top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height);
  z-index:8;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  pointer-events:none;
}
.wall-btns.active { display:flex; }
.wall-btn {
  pointer-events:all;
  padding:14px 40px;
  background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:clamp(15px,1.8vw,20px); color:#fff;
  cursor:pointer; transition:all .05s; min-width:220px; text-align:center;
}
.wall-btn:hover { background:#4a5bc4; }
.wall-btn:active { box-shadow:none; transform:translate(3px,3px); }
.wall-btn.secondary {
  background:none; border-color:#ccc; color:#999; box-shadow:none;
}
.wall-btn.secondary:hover { border-color:var(--blue); color:var(--blue); }

/* ── SAVE & CONTINUE BUTTON — floats below back wall ── */
.save-continue-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(21% - 44px); /* floor area below back wall */
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 15;
  pointer-events: none;
}
.save-continue-bar.visible { display: flex; }

.save-continue-btn {
  pointer-events: all;
  padding: 14px 40px;
  background: var(--blue);
  border: 2px solid #4a5bc4;
  box-shadow: 3px 3px 0 #3a4aaa;
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.8vw, 20px);
  color: #fff;
  cursor: pointer;
  transition: all .05s;
  letter-spacing: .3px;
}
.save-continue-btn:hover { background: #4a5bc4; }
.save-continue-btn:active { box-shadow: none; transform: translate(3px, 3px); }
.save-continue-btn:disabled {
  opacity: .38; cursor: not-allowed;
  transform: none !important; box-shadow: 3px 3px 0 #3a4aaa;
}

.save-status-bar {
  position: fixed;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-hand);
  font-size: 14px;
  color: #6ab86a;
  z-index: 16;
  pointer-events: none;
}

/* ── MOBILE ── */
@media (max-width:768px) {
  :root {
    --bw-top:    44px;
    --bw-left:   0%;
    --bw-width:  100%;
    --bw-height: calc(100dvh - 44px);
  }
  .content-panel.active:not(.iframe-mode) { border:none; box-shadow:none; }
  .char-heart { display:none; }
  .thought-bubble { font-size:clamp(11px,3vw,14px); min-width:140px; left:calc(100% - 6px); }
  .phase-key { width:180px; font-size:12px; }
  .map-grid { grid-template-columns:repeat(2,1fr); }
  .save-continue-bar { height:auto; padding:10px 0; bottom:0; z-index:30; }
  .add-new-btn { bottom:12px; right:12px; }
  .journal-wall-overlay {
    top: 80px !important;
    left: 16px !important;
    right: 16px !important;
    width: auto !important;
    height: auto !important;
    bottom: 80px !important;
    border-radius: 4px !important;
  }
}

/* ── MOBILE PHASE SELECT ── */
.phase-key-drawer {
  position:absolute; bottom:0; left:0; right:0;
  background:#f5f0ea; border-top:2px solid #bbb;
  max-height:0; overflow:hidden;
  transition:max-height .35s ease;
  z-index:5;
}
.phase-key-drawer.open { max-height:80vh; overflow-y:auto; }
.phase-select-btn {
  position:absolute; bottom:12px; right:12px; z-index:6;
  padding:10px 16px;
  background:var(--blue); border:2px solid #4a5bc4;
  box-shadow:2px 2px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:14px; color:#fff;
  cursor:pointer; transition:all .05s;
}
.phase-select-btn:hover { background:#4a5bc4; }
.phase-select-btn:active { box-shadow:none; transform:translate(2px,2px); }
.phase-drawer-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; border-bottom:1px solid #ddd;
  font-family:var(--font-hand); font-size:13px; color:#aaa;
}
.phase-drawer-close {
  cursor:pointer; font-size:18px; color:#bbb;
  padding:2px 4px; transition:color .15s;
}
.phase-drawer-close:hover { color:#444; }
.login-modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5);
  z-index:300; display:none; align-items:center; justify-content:center;
}
.login-modal-overlay.open { display:flex; }
.login-modal-window {
  width:min(92vw,440px); background:#f5f0ea;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.35);
  overflow:hidden;
}
.login-modal-titlebar {
  height:38px; background:#e8e3da; border-bottom:2px solid #bbb;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; font-family:var(--font-hand); font-size:15px; color:#555;
}
.login-modal-close {
  cursor:pointer; font-size:20px; color:#bbb; padding:2px 4px; transition:color .15s;
}
.login-modal-close:hover { color:#444; }

/* Login form tabs */
.lm-tab-row {
  display:flex; border-bottom:2px solid #ccc; background:#e8e3da;
}
.lm-tab {
  flex:1; padding:10px; font-family:var(--font-hand); font-size:15px;
  text-align:center; cursor:pointer; color:#888; background:none; border:none;
  border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .15s;
}
.lm-tab.active { color:var(--blue); border-bottom-color:var(--blue); }

/* Login form body */
.lm-body { padding:20px 24px 16px; display:flex; flex-direction:column; gap:12px; }
.lm-form { display:none; flex-direction:column; gap:12px; }
.lm-form.active { display:flex; }
.lm-field { display:flex; flex-direction:column; gap:4px; }
.lm-label { font-family:var(--font-hand); font-size:12px; color:#888; }
.lm-input {
  font-family:var(--font-hand); font-size:15px; color:#222; background:#f5f0ea;
  border:1.5px solid #bbb; padding:8px 12px; outline:none; transition:border-color .15s;
  user-select:text;
}
.lm-input:focus { border-color:var(--blue); }
.lm-btn {
  padding:10px 18px; background:var(--blue); border:2px solid #4a5bc4;
  box-shadow:2px 2px 0 #3a4aaa; font-family:var(--font-hand); font-size:15px;
  color:#fff; cursor:pointer; transition:all .05s; margin-top:4px;
}
.lm-btn:hover { background:#4a5bc4; }
.lm-btn:active { box-shadow:none; transform:translate(2px,2px); }
.lm-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.lm-msg { font-family:var(--font-hand); font-size:12px; padding:6px 10px; display:none; }
.lm-msg.error   { display:block; color:#c0392b; background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.2); }
.lm-msg.success { display:block; color:#2d7a4f; background:rgba(45,122,79,.08); border:1px solid rgba(45,122,79,.2); }
.lm-footer { text-align:center; padding:0 24px 14px; font-family:var(--font-hand); font-size:11px; color:#aaa; }

/* ── JOURNAL WINDOW on back wall ── */
.journal-wall-overlay {
  position:fixed;
  top:calc(var(--bw-top) + 4%); left:calc(var(--bw-left) + 5%);
  width:calc(var(--bw-width) - 10%); height:calc(var(--bw-height) - 8%);
  z-index:20; display:none; flex-direction:column;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 4px 8px 24px rgba(0,0,0,.25);
  background:#e8e3da; border-radius:2px; overflow:hidden;
}
.journal-wall-overlay.open { display:flex; }

/* ── JOURNAL INLINE (step panel) ── */
.journal-inline {
  width:100%; height:100%; display:flex; overflow:hidden;
}
.journal-spine-inline {
  flex-shrink:0; width:18px; background:#e8e3da;
  border-right:1.5px solid #c8b88a;
  display:flex; flex-direction:column; justify-content:space-around;
  align-items:center; padding:12px 0;
}
.journal-spine-ring {
  width:14px; height:14px; border:2.5px solid #8a7a5a;
  border-radius:50%; background:#e8e4dc; flex-shrink:0;
}
.journal-page {
  flex:1; background:#f1ece4; padding:16px 20px 12px 16px;
  display:flex; flex-direction:column; gap:8px;
  background-image:linear-gradient(to bottom,transparent calc(100% - 1px),rgba(101,121,226,.1) 1px);
  background-size:100% 32px; background-position:0 52px; overflow:hidden;
}
.journal-page-header {
  border-bottom:1px solid rgba(101,121,226,.2); padding-bottom:6px; flex-shrink:0;
  font-family:var(--font-hand); font-size:clamp(12px,1.4vw,16px); color:#5a4a2a;
}
.journal-textarea {
  flex:1; resize:none; border:none; outline:none; background:transparent;
  font-family:var(--font-hand); font-size:clamp(13px,1.4vw,17px);
  color:#2a1e14; line-height:2; overflow-y:auto; user-select:text;
  caret-color:var(--blue);
}
.journal-textarea::placeholder { color:rgba(138,122,90,.35); font-style:italic; }
.journal-privacy {
  font-family:var(--font-hand); font-size:clamp(9px,.85vw,11px);
  color:#ccc; border-top:1px solid #e8e0d0; padding-top:6px; flex-shrink:0;
}

/* ── ADVENTURE MATRIX ─────────────────────────────────────
   Portable: this block + buildAdventureMatrix() can be lifted
   into the archive page so the moodboard renders identically.   */
.matrix-panel { padding:0; overflow:hidden; justify-content:flex-start; align-items:stretch; position:relative; }
.matrix-date {
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  font-family:var(--font-hand); font-size:clamp(13px,1.5vw,17px); color:#8a7a5a; z-index:6;
}
.matrix-archive-btn {
  position:absolute; top:8px; right:12px; z-index:6;
  font-family:var(--font-hand); font-size:clamp(12px,1.3vw,15px);
  color:#fff; background:var(--blue); border:2px solid #4a5bc4;
  box-shadow:2px 2px 0 #3a4aaa; padding:5px 14px; cursor:pointer; transition:all .05s;
}
.matrix-archive-btn:hover { background:#4a5bc4; }
.matrix-archive-btn:active { box-shadow:none; transform:translate(2px,2px); }

/* Header row holds the date + archive button, above the framed matrix */
.matrix-header { position:relative; height:34px; flex-shrink:0; }
/* Framed container — insets the matrix so it doesn't bleed into the wall edges */
.matrix-frame {
  width:76%; height:76%; margin:auto; align-self:center;
  position:relative; overflow:hidden;
  border:2px solid var(--blue);
  box-shadow: 0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,0.35);
}

.adv-matrix { position:absolute; top:0; left:0; width:100%; height:100%; overflow:hidden; background:url('../assets/elements/gradient.png') center/cover no-repeat; }
.adv-grid {
  position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(184,168,138,.13) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(184,168,138,.13) 1px, transparent 1px);
  background-size:38px 38px;
}
.adv-axis { position:absolute; background:rgba(184,168,138,.5); pointer-events:none; }
.adv-axis-x { left:6%; right:6%; top:50%; height:1.5px; }
.adv-axis-y { top:7%; bottom:7%; left:50%; width:1.5px; }

/* Axis descriptors — siblings of the items inside .adv-matrix (which paints
   reliably). translateZ(0) forces each onto its own layer so none get dropped. */
.adv-axlbl {
  position:absolute; z-index:5; white-space:nowrap;
  font-family:var(--font-hand); color:#5a4a2a; letter-spacing:.5px;
  font-size:clamp(14px,1.9vw,23px);
}

.adv-item { position:absolute; z-index:3; text-align:center; }
.adv-cap  { font-family:var(--font-hand); font-size:clamp(10px,1.1vw,13px); color:#8a7a5a; margin-top:3px; }

.adv-map { width:clamp(150px,20vw,240px); }
.adv-map-svg { width:100%; aspect-ratio:5/4; }
.adv-map-svg svg { width:100%; height:100%; }

.adv-bingo { width:clamp(130px,16vw,200px); }
.adv-meter { width:100%; height:14px; border:1.5px solid var(--blue); background:#e7e1d6; margin-top:2px; }
.adv-meter-fill { height:100%; background:linear-gradient(90deg,#E8478B,#f3a0c4); }
.adv-mode { font-family:var(--font-hand); font-size:clamp(10px,1.1vw,13px); color:#8a7a5a; margin-top:3px; }

.adv-char { width:clamp(90px,11vw,140px); }
.adv-char-stack { position:relative; width:100%; aspect-ratio:1; }
.adv-char-stack img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }

.adv-journal {
  width:clamp(150px,18vw,230px);
  background:rgba(255,255,255,.72); border:1.5px solid #c8b88a;
  padding:10px 12px; box-shadow:2px 3px 0 rgba(0,0,0,.06);
}
.adv-journal-text {
  font-family:var(--font-hand); font-size:clamp(12px,1.3vw,16px);
  color:#5a4a2a; line-height:1.4; font-style:italic;
}

.adv-photo { position:absolute; z-index:3; width:clamp(74px,9vw,118px); }
.adv-photo img {
  width:100%; display:block; border:4px solid #fff; border-bottom-width:18px;
  box-shadow:2px 3px 7px rgba(0,0,0,.18); object-fit:cover; aspect-ratio:1;
}
/* Remove control on each matrix photo — hover-reveal on desktop, always on touch */
.adv-photo-remove {
  position:absolute; top:-8px; right:-8px; z-index:4;
  width:20px; height:20px; padding:0; line-height:1;
  background:#fff; border:1.5px solid #ccc; border-radius:50%;
  color:#888; font-size:11px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .12s, color .12s, border-color .12s;
}
.adv-photo:hover .adv-photo-remove { opacity:1; }
.adv-photo-remove:hover { color:#E8478B; border-color:#E8478B; }
@media (hover: none) { .adv-photo-remove { opacity:1; } }

/* Add-photo button — top-left of the matrix header, mirrors the archive btn */
.matrix-photo-btn {
  position:absolute; top:8px; left:12px; z-index:6;
  font-family:var(--font-hand); font-size:clamp(12px,1.3vw,15px);
  color:var(--blue); background:rgba(255,255,255,.72);
  border:2px solid var(--blue); box-shadow:2px 2px 0 var(--aqua);
  padding:5px 14px; cursor:pointer; transition:all .05s;
}
.matrix-photo-btn:hover  { background:var(--blue); color:#fff; }
.matrix-photo-btn:active { box-shadow:none; transform:translate(2px,2px); }

/* ── PHOTO UPLOAD MODAL — framed to match the matrix ── */
.photo-overlay {
  position:fixed; inset:0; z-index:320;
  background:rgba(40,32,24,.45);
  display:none; align-items:center; justify-content:center; padding:18px;
}
.photo-overlay.open { display:flex; }
.photo-card {
  width:min(440px,94vw); max-height:92vh; overflow-y:auto;
  background:var(--back-wall);
  border:2px solid var(--blue);
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.4);
  padding:18px 20px; font-family:var(--font-hand);
}
.photo-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.photo-title { font-size:clamp(18px,2.2vw,24px); color:var(--blue); }
.photo-close { font-size:22px; color:#aaa; cursor:pointer; line-height:1; border:none; background:none; padding:2px 6px; }
.photo-close:hover { color:#E8478B; }
.photo-sub { font-size:13px; color:#8a7a5a; margin:2px 0 14px; }

.photo-drop { display:block; cursor:pointer; }
.photo-preview {
  width:100%; aspect-ratio:4/3; background:#e8e0c8;
  border:2px dashed #8a7a5a; display:flex; align-items:center; justify-content:center;
  overflow:hidden; margin-bottom:14px; transition:border-color .12s;
}
.photo-drop:hover .photo-preview { border-color:var(--blue); }
.photo-preview img { width:100%; height:100%; object-fit:cover; }
.photo-drop-hint { color:rgba(138,122,90,.7); font-style:italic; font-size:14px; }

.photo-quad-label { font-size:12px; color:#8a7a5a; letter-spacing:.4px; margin-bottom:6px; }
.photo-quad-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.photo-quad {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:12px 8px; background:#fdf6e3; border:1.5px solid #ccc;
  font-family:var(--font-hand); cursor:pointer; color:#555; transition:all .1s;
}
.photo-quad b { font-size:15px; color:#3a2e1e; }
.photo-quad span { font-size:10px; color:#8a7a5a; }
.photo-quad:hover { border-color:var(--blue); background:#f0edfa; }
.photo-quad.selected { border-color:var(--blue); background:var(--blue); box-shadow:2px 2px 0 #3a4aaa; }
.photo-quad.selected b, .photo-quad.selected span { color:#fff; }

.photo-status { font-size:13px; min-height:18px; margin-bottom:8px; color:#8a7a5a; }
.photo-add-btn {
  width:100%; padding:12px 18px; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:16px; color:#fff; cursor:pointer; transition:all .05s;
}
.photo-add-btn:hover  { background:#4a5bc4; }
.photo-add-btn:active { box-shadow:none; transform:translate(2px,2px); }
.photo-add-btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }

/* ── NATIVE JOURNAL — chat-style journal on the back wall ── */
.jrc-panel { padding:8px; overflow:hidden; justify-content:center; align-items:center; }
.jrc-window {
  width:100%; height:100%; background:#f5f0ea;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.35);
  display:flex; flex-direction:column; overflow:hidden;
}
.jrc-titlebar {
  flex-shrink:0; height:38px; background:#e8e3da; border-bottom:2px solid #bbb;
  display:flex; align-items:center; justify-content:center; position:relative;
  font-family:var(--font-hand); font-size:clamp(13px,1.5vw,18px); color:#333; letter-spacing:.5px;
}
.jrc-date { position:absolute; right:12px; font-size:clamp(9px,1vw,12px); color:#999; font-family:var(--font-hand); }
.jrc-messages {
  flex:1; overflow-y:auto; padding:14px 16px;
  display:flex; flex-direction:column; gap:9px; scroll-behavior:smooth;
}
.jrc-msg { display:flex; flex-direction:column; gap:3px; max-width:80%; }
.jrc-msg.today { align-self:flex-end; align-items:flex-end; }
.jrc-msg.past  { align-self:flex-start; align-items:flex-start; }
.jrc-bubble {
  padding:9px 13px; font-family:var(--font-hand); font-size:clamp(12px,1.4vw,16px);
  line-height:1.5; word-break:break-word; user-select:text;
}
.jrc-msg.today .jrc-bubble { background:var(--blue); color:#fff; border:1.5px solid #4a5bc4; }
.jrc-msg.past  .jrc-bubble { background:#fff; color:#222; border:1.5px solid #ccc; }
.jrc-bubble img { display:block; width:180px; max-width:100%; margin-bottom:6px; object-fit:cover; border:3px solid rgba(255,255,255,.6); }
.jrc-msg.past .jrc-bubble img { border-color:#e3ddd2; }
.jrc-meta { font-size:clamp(9px,.9vw,11px); color:#aaa; font-family:var(--font-hand); padding:0 4px; }
.jrc-empty {
  margin:auto; text-align:center; color:#9a8a6a; font-style:italic;
  font-size:clamp(11px,1.2vw,14px); line-height:1.6; max-width:84%; padding:24px 0;
}
.jrc-date-divider { display:flex; align-items:center; gap:10px; padding:2px 0; align-self:stretch; }
.jrc-date-divider span { font-size:10px; color:#bbb; font-family:var(--font-hand); white-space:nowrap; }
.jrc-date-divider::before, .jrc-date-divider::after { content:''; flex:1; height:1px; background:#ddd; }
.jrc-input-area {
  flex-shrink:0; border-top:2px solid #ccc; padding:10px 14px;
  display:flex; flex-direction:column; gap:7px; background:#ede8e0;
}
.jrc-img-chip { position:relative; width:70px; display:none; }
.jrc-img-chip.has-img { display:block; }
.jrc-img-chip img { width:100%; border:1.5px solid #c8b88a; display:block; object-fit:cover; aspect-ratio:1; }
.jrc-img-x {
  position:absolute; top:-7px; right:-7px; width:18px; height:18px; padding:0; line-height:1;
  background:#fff; border:1.5px solid #ccc; border-radius:50%; cursor:pointer; font-size:10px; color:#888;
  display:flex; align-items:center; justify-content:center;
}
.jrc-img-x:hover { color:#E8478B; border-color:#E8478B; }
.jrc-msg-row { display:flex; gap:8px; align-items:stretch; }
.jrc-msg-input {
  flex:1; font-family:var(--font-hand); font-size:clamp(12px,1.3vw,15px); color:#222;
  background:#f5f0ea; border:1.5px solid #bbb; padding:8px 11px; outline:none; resize:none;
  height:58px; line-height:1.5;
}
.jrc-msg-input:focus { border-color:var(--blue); }
.jrc-btn-stack { flex-shrink:0; display:flex; flex-direction:column; gap:6px; width:58px; }
.jrc-plus-btn {
  flex:1; background:rgba(255,255,255,.72); border:2px solid var(--blue); box-shadow:2px 2px 0 var(--aqua);
  font-family:var(--font-hand); font-size:20px; color:var(--blue); cursor:pointer; line-height:1; padding:0; transition:all .05s;
}
.jrc-plus-btn:hover  { background:var(--blue); color:#fff; }
.jrc-plus-btn:active { box-shadow:none; transform:translate(2px,2px); }
.jrc-send-btn {
  flex:1; background:var(--blue); border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:clamp(12px,1.3vw,15px); color:#fff; cursor:pointer; padding:0; transition:all .05s;
}
.jrc-send-btn:hover  { background:#4a5bc4; }
.jrc-send-btn:active { box-shadow:none; transform:translate(2px,2px); }
.jrc-send-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.jrc-status { font-size:clamp(9px,.9vw,11px); color:#999; font-family:var(--font-hand); min-height:13px; }
.jrc-status.ok  { color:#6ab86a; }
.jrc-status.err { color:#E8478B; }
.jrc-confirm {
  display:none; align-items:center; flex-wrap:wrap; gap:8px;
  padding-top:7px; border-top:1px dashed #ccc;
  font-family:var(--font-hand); font-size:clamp(11px,1.2vw,14px); color:#8a7a5a;
}
.jrc-confirm.open { display:flex; }
.jrc-confirm button { font-family:var(--font-hand); font-size:clamp(11px,1.2vw,14px); cursor:pointer; padding:5px 12px; transition:all .05s; }
.jrc-confirm-send { background:var(--blue); color:#fff; border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa; }
.jrc-confirm-send:hover  { background:#4a5bc4; }
.jrc-confirm-send:active { box-shadow:none; transform:translate(2px,2px); }
.jrc-confirm-skip { background:none; border:none; color:#8a7a5a; text-decoration:underline; }
.jrc-confirm-skip:hover { color:#E8478B; }

/* ── SIDEQUEST BUILDER MODAL ── */
.sq-overlay {
  position:fixed; inset:0; z-index:300;
  background:rgba(40,32,24,.45);
  display:none; align-items:center; justify-content:center;
  padding:18px;
}
.sq-overlay.open { display:flex; }
.sq-card {
  width:min(760px,94vw); max-height:92vh; overflow-y:auto;
  background:var(--back-wall);
  border:3px solid var(--blue);
  box-shadow:0 0 0 3px var(--aqua), 6px 10px 40px rgba(0,0,0,.4);
  padding:18px 20px; font-family:var(--font-hand);
}
.sq-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; }
.sq-title { font-size:clamp(18px,2.2vw,24px); color:var(--blue); }
.sq-close { font-size:22px; color:#aaa; cursor:pointer; line-height:1; border:none; background:none; padding:2px 6px; }
.sq-close:hover { color:#E8478B; }
.sq-sub { font-size:13px; color:#8a7a5a; margin-bottom:12px; }
.sq-name {
  width:100%; font-family:var(--font-hand); font-size:15px; color:#3a2e1e;
  padding:8px 10px; margin-bottom:14px;
  background:#fdf6e3; border:2px solid #8a7a5a;
  border-right-color:#5a4a2a; border-bottom-color:#5a4a2a;
  border-left-color:#c8b88a; border-top-color:#c8b88a;
}
.sq-name::placeholder { color:rgba(138,122,90,.55); font-style:italic; }
.sq-body { display:flex; gap:16px; align-items:flex-start; }
@media (max-width:640px){ .sq-body { flex-direction:column; } }
.sq-preview-col { flex:0 0 40%; min-width:0; }
.sq-controls-col { flex:1 1 60%; min-width:0; }
.sq-map-frame {
  width:100%; aspect-ratio:5/4;
  background:#e8e0c8;
  border:2px solid #8a7a5a; border-right-color:#5a4a2a; border-bottom-color:#5a4a2a;
  border-left-color:#c8b88a; border-top-color:#c8b88a;
}
.sq-map-frame svg { width:100%; height:100%; display:block; }
.sq-section-label { font-size:12px; color:#8a7a5a; letter-spacing:.4px; margin:0 0 6px; }

/* terrain palette */
.sq-palette { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.sq-terrain {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:5px 6px; background:#f0ead6; cursor:pointer; user-select:none;
  border:2px solid #8a7a5a; border-right-color:#5a4a2a; border-bottom-color:#5a4a2a;
  border-left-color:#c8b88a; border-top-color:#c8b88a;
  transition:filter .1s;
}
.sq-terrain:hover { filter:brightness(1.06); }
.sq-terrain.active { border-color:var(--aqua); outline:2px solid var(--aqua); outline-offset:1px; background:#e0f0f0; }
.sq-terrain img { width:34px; height:28px; object-fit:contain; pointer-events:none; }
.sq-terrain span { font-size:10px; color:#5a4a2a; letter-spacing:.4px; pointer-events:none; }

/* climates + feeling chips */
.sq-climates { display:flex; flex-direction:column; gap:8px; }
.sq-climate {
  padding:7px 9px;
  border:2px solid #8a7a5a; border-right-color:#5a4a2a; border-bottom-color:#5a4a2a;
  border-left-color:#c8b88a; border-top-color:#c8b88a;
}
.sq-climate.sunny { background:#f2e6a8; border-color:#715f04; }
.sq-climate.rainy { background:#ae87e2; border-color:#260156; }
.sq-climate.windy { background:#a3eac9; border-color:#046957; }
.sq-climate.snowy { background:#6cd1ea; border-color:#033f50; }
.sq-climate-head { font-size:18px; margin-bottom:5px; }
.sq-climate.sunny .sq-climate-head { color:#715f04; }
.sq-climate.rainy .sq-climate-head { color:#260156; }
.sq-climate.windy .sq-climate-head { color:#046957; }
.sq-climate.snowy .sq-climate-head { color:#033f50; }
.sq-chips { display:flex; flex-wrap:wrap; gap:5px; }
.sq-chip {
  padding:3px 9px; font-family:var(--font-hand); font-size:13px; letter-spacing:.4px;
  cursor:pointer; user-select:none; border:2px solid; transition:filter .1s;
}
.sq-chip:hover { filter:brightness(.92); }
.sq-chip.active { outline:2px solid #111; outline-offset:1px; }
.sq-climate.sunny .sq-chip { background:#f8edb8; border-color:#715f04; color:#715f04; }
.sq-climate.rainy .sq-chip { background:#c9b3e7; border-color:#260156; color:#260156; }
.sq-climate.windy .sq-chip { background:#b6e7d0; border-color:#046957; color:#046957; }
.sq-climate.snowy .sq-chip { background:#a0d7e6; border-color:#033f50; color:#033f50; }

.sq-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
.sq-btn {
  padding:10px 18px; font-family:var(--font-hand); font-size:15px; cursor:pointer;
  border:2px solid #4a5bc4; background:var(--blue); color:#fff; box-shadow:2px 2px 0 #3a4aaa;
  transition:all .05s;
}
.sq-btn:hover { background:#4a5bc4; }
.sq-btn:active { box-shadow:none; transform:translate(2px,2px); }
.sq-btn:disabled { opacity:.38; cursor:not-allowed; transform:none !important; box-shadow:2px 2px 0 #3a4aaa; }
.sq-btn.ghost { background:none; color:#999; border-color:#ccc; box-shadow:none; }
.sq-btn.ghost:hover { border-color:var(--blue); color:var(--blue); background:none; }

/* sidequest entry in the phase key */
.phase-key-item.sidequest-item {
  border-color:var(--blue); border-style:dashed; color:var(--blue);
  background:#f0edfa; margin-top:8px;
}
.phase-key-item.sidequest-item:hover { background:var(--blue); color:#fff; border-style:solid; }

@media (prefers-reduced-motion: reduce) {
  .sq-terrain, .sq-chip, .sq-btn { transition:none; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="room-nav">
  <span class="nav-btn" onclick="window.location.href='../index.html'">← back</span>
  <span>adventure matrix</span>
  <span></span>
</nav>

<!-- CONTENT PANEL -->
<div class="content-panel" id="content-panel">
  <!-- filled dynamically -->
</div>

<!-- WALL BUTTONS — centered on back wall for step choices -->
<div class="wall-btns" id="wall-btns"></div>

<!-- HEART CHARACTER + BUBBLE -->
<div class="char-heart" id="char-heart">
  <div class="thought-bubble" id="thought-bubble">
    <span id="bubble-text">loading...</span>
    <div class="bubble-btns" id="bubble-btns"></div>
  </div>
  <img class="char-img" src="../assets/elements/guides/heart.png" alt="Heart guide">
</div>

<!-- SAVE & CONTINUE BAR — shown during character and bingo steps -->
<div class="save-continue-bar" id="save-continue-bar">
  <button class="save-continue-btn" id="save-continue-btn" onclick="saveAndContinue()">
    continue →
  </button>
</div>
<div class="save-status-bar" id="save-status-bar"></div>

<!-- ADD NEW BUTTON — shown on map selector screen -->
<button class="add-new-btn" id="add-new-btn" onclick="stepNewGame()">+ add new</button>

<!-- LOGIN MODAL — direct form, no iframe -->
<div class="login-modal-overlay" id="login-modal">
  <div class="login-modal-window">
    <div class="login-modal-titlebar">
      <span>welcome</span>
      <span class="login-modal-close" onclick="closeLoginModal()">×</span>
    </div>
    <div class="lm-tab-row">
      <button class="lm-tab active" onclick="lmSwitchTab('login',this)">log in</button>
      <button class="lm-tab" onclick="lmSwitchTab('signup',this)">sign up</button>
    </div>
    <div class="lm-body">
      <!-- Log in form -->
      <div class="lm-form active" id="lm-form-login">
        <div class="lm-field">
          <label class="lm-label">email</label>
          <input class="lm-input" type="email" id="lm-email" placeholder="your@email.com" autocomplete="email"/>
        </div>
        <div class="lm-field">
          <label class="lm-label">password</label>
          <input class="lm-input" type="password" id="lm-password" placeholder="••••••••"/>
        </div>
        <div class="lm-msg" id="lm-login-msg"></div>
        <button class="lm-btn" id="lm-login-btn" onclick="lmLogin()">enter</button>
      </div>
      <!-- Sign up form -->
      <div class="lm-form" id="lm-form-signup">
        <div class="lm-field">
          <label class="lm-label">username</label>
          <input class="lm-input" type="text" id="lm-username" placeholder="choose a name" maxlength="40" autocomplete="off"/>
        </div>
        <div class="lm-field">
          <label class="lm-label">email</label>
          <input class="lm-input" type="email" id="lm-su-email" placeholder="your@email.com" autocomplete="email"/>
        </div>
        <div class="lm-field">
          <label class="lm-label">password</label>
          <input class="lm-input" type="password" id="lm-su-password" placeholder="at least 6 characters" minlength="6"/>
        </div>
        <div class="lm-msg" id="lm-signup-msg"></div>
        <button class="lm-btn" id="lm-signup-btn" onclick="lmSignup()">create account</button>
      </div>
    </div>
    <div class="lm-footer">login to access the matrix</div>
  </div>
</div>

<!-- SIDEQUEST BUILDER — secret one-location phase -->
<div class="sq-overlay" id="sq-overlay">
  <div class="sq-card">
    <div class="sq-head">
      <span class="sq-title">build a sidequest</span>
      <button class="sq-close" onclick="closeSidequestBuilder()">×</button>
    </div>
    <div class="sq-sub">a secret world you fall into.</div>
    <input class="sq-name" id="sq-name" type="text" maxlength="60" placeholder="name this location">
    <div class="sq-body">
      <div class="sq-preview-col">
        <div class="sq-section-label">your sidequest</div>
        <div class="sq-map-frame" id="sq-map-frame"></div>
      </div>
      <div class="sq-controls-col">
        <div class="sq-section-label">terrain</div>
        <div class="sq-palette" id="sq-palette"></div>
        <div class="sq-section-label">emotional climate</div>
        <div class="sq-climates" id="sq-climates"></div>
      </div>
    </div>
    <div class="sq-actions">
      <button class="sq-btn ghost" onclick="closeSidequestBuilder()">cancel</button>
      <button class="sq-btn" id="sq-confirm" disabled onclick="confirmSidequest()">enter sidequest →</button>
    </div>
  </div>
</div>

<!-- PHOTO UPLOAD — adds a picture to a chosen quadrant of the matrix -->
<div class="photo-overlay" id="photo-overlay">
  <div class="photo-card">
    <div class="photo-head">
      <span class="photo-title">✦ add a photo</span>
      <button class="photo-close" onclick="closePhotoUpload()">×</button>
    </div>
    <div class="photo-sub">pick an image and choose where it lands on your matrix.</div>

    <label class="photo-drop">
      <input type="file" id="photo-file" accept="image/*" hidden onchange="onPhotoPicked(event)">
      <div class="photo-preview" id="photo-preview">
        <span class="photo-drop-hint">tap to choose an image</span>
      </div>
    </label>

    <div class="photo-quad-label">which quadrant?</div>

const MATRIX_PHOTO_BUCKET = 'matrix-photos';

// Convert a stored public URL back to its in-bucket path so storage.remove()
// can act on it. Returns null for anything not in this bucket (e.g. legacy URLs).
function matrixPhotoPath(url){
  if (typeof url !== 'string') return null;
  const marker = `/object/public/${MATRIX_PHOTO_BUCKET}/`;
  const i = url.indexOf(marker);
  if (i === -1) return null;
  let p = url.slice(i + marker.length);
  const q = p.indexOf('?'); if (q !== -1) p = p.slice(0, q);   // strip any query string
  try { p = decodeURIComponent(p); } catch(e){}
  return p || null;
}

// Best-effort delete of one or more stored photos. Storage cleanup should never
// block or fail a save, so this swallows its own errors (just logs them).
async function deleteMatrixPhotoFiles(urls){
  const paths = (urls || []).map(matrixPhotoPath).filter(Boolean);
  if (!paths.length) return;
  try {
    await sb.storage.from(MATRIX_PHOTO_BUCKET).remove(paths);
  } catch(err){

}

// ── SHARED SPIRAL RENDERER ────────────────────────────────
// Mirrors the treasure-map game: spiral-3.png background, 3 zones at fixed
// positions, full radial-halo tint, clipped terrain, bold feeling labels.
// interactive=true adds phase numbers + click targets (phase-select screen);
// the matrix and map thumbnails call it read-only (no numbers, no clicks).
const SPIRAL_ZONE_POS = [ {x:245,y:230}, {x:372,y:288}, {x:150,y:75} ];
function spiralZonesSVG(zones, opts){
  zones = zones || []; opts = opts || {};
  const interactive = !!opts.interactive;
  const R = 36;
  let defs = '<defs>', body = '', hits = '';
  SPIRAL_ZONE_POS.forEach((p,i) => {
    const z = zones[i] || {};
    const hasTerrain = !!(z.terrain && TERRAIN_IMGS[z.terrain]);
    if (z.tint) {
      defs += `<radialGradient id="sg${i}" cx="50%" cy="50%" r="50%">`
        + `<stop offset="0%" stop-color="${z.tint}" stop-opacity="1"/>`
        + `<stop offset="55%" stop-color="${z.tint}" stop-opacity=".85"/>`
        + `<stop offset="100%" stop-color="${z.tint}" stop-opacity="0"/></radialGradient>`;
      body += `<circle cx="${p.x}" cy="${p.y}" r="${R+48}" fill="url(#sg${i})" pointer-events="none"/>`;
    }
    if (hasTerrain) {
      defs += `<clipPath id="sc${i}"><circle cx="${p.x}" cy="${p.y}" r="${R-2}"/></clipPath>`;
      body += `<image x="${p.x-R}" y="${p.y-R}" width="${R*2}" height="${R*2}" href="${TERRAIN_IMGS[z.terrain]}" preserveAspectRatio="xMidYMid meet" clip-path="url(#sc${i})" pointer-events="none"/>`;
    } else {
      body += `<circle cx="${p.x}" cy="${p.y}" r="${R}" fill="rgba(200,196,180,.82)" stroke="#8a7a5a" stroke-width="1.5" pointer-events="none"/>`;
      if (interactive) body += `<text x="${p.x}" y="${p.y+5}" text-anchor="middle" dominant-baseline="middle" fill="#5a4a2a" font-family="ZoesHandwriting,cursive" font-size="26" pointer-events="none">${i+1}</text>`;
    }
    if (z.feeling) {
      body += `<text x="${p.x}" y="${p.y+R+18}" text-anchor="middle" fill="#2a1e14" font-family="ZoesHandwriting,cursive" font-size="15" font-weight="bold" pointer-events="none">${z.feeling}</text>`;
    }
    if (interactive) {
      hits += `<circle class="zone-hit" cx="${p.x}" cy="${p.y}" r="${R+8}" fill="transparent" style="cursor:pointer" onclick="selectPhase(${i})"/>`;
    }
  });
  defs += '</defs>';
  return `<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">`
    + defs
    + `<line x1="250" y1="0" x2="250" y2="400" stroke="rgba(138,122,90,.15)" stroke-width="1"/>`
    + `<line x1="0" y1="200" x2="500" y2="200" stroke="rgba(138,122,90,.15)" stroke-width="1"/>`
    + `<image href="../assets/elements/spiral-3.png" x="25" y="10" width="450" height="380" preserveAspectRatio="xMidYMid meet" style="pointer-events:none;"/>`
    + body + hits + `</svg>`;
}

function buildPreviewSVG(mapType, zones) {
  const SPIRAL_THETA = [0.5, 9.4, 11.5, 13.3, 14.9];
  const SQUARE_POS   = [{x:160,y:114},{x:340,y:114},{x:340,y:286},{x:160,y:286}];
  const R = 22;

  if (mapType === 'square') {
    let circles = '';
    SQUARE_POS.forEach((p, i) => {
      const z = zones[i] || {};
      const fill = z.tint || 'rgba(200,196,180,0.85)';
      circles += `<circle cx="${p.x}" cy="${p.y}" r="${R}" fill="${fill}" stroke="#8a7a5a" stroke-width="1.2"/>`;
      if (z.feeling) circles += `<text x="${p.x}" y="${p.y+R+11}" text-anchor="middle" fill="#5a4a2a" font-family="ZoesHandwriting,cursive" font-size="10">${z.feeling}</text>`;
    });
    return `<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
      <image href="../assets/elements/square-1.png" x="25" y="10" width="450" height="380" preserveAspectRatio="xMidYMid meet" style="pointer-events:none;"/>
      ${circles}
    </svg>`;
  }

  // Spiral — shared renderer (read-only: full tint, terrain, feelings; no numbers)
  return spiralZonesSVG(zones, { interactive:false });
}

// The matrix map item shows ONLY the day's chosen destination (one terrain +
// tint glow + feeling), not the whole map. loc = {terrain, feeling, tint}.
function buildSingleLocationSVG(loc){
  loc = loc || {};
  const R = 58, cx = 150, cy = 108;
  let defs = '', body = '';
  if (loc.tint) {
    defs += `<radialGradient id="locglow" cx="50%" cy="50%" r="50%">`
      + `<stop offset="0%" stop-color="${loc.tint}" stop-opacity="1"/>`
      + `<stop offset="55%" stop-color="${loc.tint}" stop-opacity=".85"/>`
      + `<stop offset="100%" stop-color="${loc.tint}" stop-opacity="0"/></radialGradient>`;
    body += `<circle cx="${cx}" cy="${cy}" r="${R+44}" fill="url(#locglow)"/>`;
  }
  if (loc.terrain && TERRAIN_IMGS[loc.terrain]) {
    defs += `<clipPath id="locclip"><circle cx="${cx}" cy="${cy}" r="${R-2}"/></clipPath>`;
    body += `<image x="${cx-R}" y="${cy-R}" width="${R*2}" height="${R*2}" `
      + `href="${TERRAIN_IMGS[loc.terrain]}" preserveAspectRatio="xMidYMid meet" clip-path="url(#locclip)"/>`
      + `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#8a7a5a" stroke-width="1.5"/>`;
  } else {
    body += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(200,196,180,.55)" stroke="#8a7a5a" stroke-width="1.5"/>`;
  }
  if (loc.feeling) {
    body += `<text x="${cx}" y="${cy+R+22}" text-anchor="middle" fill="#2a1e14" `
      + `font-family="ZoesHandwriting,cursive" font-size="17" font-weight="bold">${_escapeHtml(loc.feeling)}</text>`;
  }
  return `<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;"><defs>${defs}</defs>${body}</svg>`;
}

function renderMapGrid(games) {
  let slots = '';
  for (let i = 0; i < 8; i++) {
    const g = games[i];

      const zones   = (g.map_data || {}).zones || [];

      const updated = formatUpdated(g.updated_at);
      const safeName = (g.map_name || 'untitled').replace(/'/g, "\\'");
      slots += `<div class="map-slot" onclick="selectMap('${g.id}')">
        <button class="slot-delete" title="delete map"
          onclick="event.stopPropagation(); deleteMap('${g.id}','${safeName}')">×</button>
        <div class="slot-name">${g.map_name || 'untitled'}</div>
        <div class="slot-preview">${preview}</div>
        ${updated ? `<div class="slot-updated">${updated}</div>` : ''}
      </div>`;
    } else {
      slots += `<div class="map-slot empty"></div>`;
    }
  }

  const html = `<div class="step-panel">
    <div class="step-header">
      <span class="step-header-title">your maps</span>
      <div style="display:flex;gap:6px;">
        <button class="wall-nav-btn" onclick="window.location.href='archive.html'">archive</button>
        <button class="wall-nav-btn" onclick="window.location.href='../users/profile.html'">my profile</button>
      </div>
    </div>
    <div class="map-grid">${slots}</div>
  </div>`;
  showPanel(html);
}

function stepPhaseSelect() {
  if (!activeGameData) return;
  activePhase = null;
  activeSidequest = null;
  showAddNew(false);
  const mapType = activeGameData.map_type || 'spiral';
  const mapData = activeGameData.map_data || {};
  const zones   = mapData.zones || [];
  const prompts = mapType === 'square' ? SQUARE_PROMPTS : SPIRAL_PROMPTS;
  const zoneCount = mapType === 'square' ? 4 : 3;

  setBubble(`what are you navigating today?`, []);
  setSaveBtnVisible(false);

  const svgContent = mapType === 'square'
    ? buildSquareSVG(zones)
    : buildSpiralSVG(zones);

  let keyItems = '';
  for (let i=0; i<zoneCount; i++) {
    const label = mapType === 'square' ? SQUARE_LABELS[i] : (i+1);
    keyItems += `<div class="phase-key-item" id="key-${i}" onclick="selectPhase(${i})">
      <span class="phase-key-num">${label}.</span>
      <span>${prompts[i]}</span>
    </div>`;
  }
  // Secret phase — opens the one-location builder instead of selecting a map zone
  keyItems += `<div class="phase-key-item sidequest-item" onclick="openSidequestBuilder()">
      <span class="phase-key-num">✦</span>
      <span>sidequest — fall into a secret little world</span>
    </div>`;

  const isMobile = window.innerWidth <= 768;

  const html = `<div class="step-panel" style="padding:12px;">
    <div class="step-header">
      <span class="step-back" onclick="stepLoadGame()">← back</span>
      <span class="step-header-title">${activeGameData.map_name||'your map'}</span>
      <span></span>
    </div>
    <div class="phase-wrap" style="position:relative;">
      <div class="phase-map-area" id="phase-map-area" style="${isMobile ? 'flex:1;' : ''}">
        ${svgContent}
      </div>
      ${isMobile ? `
        <!-- Mobile: floating button + bottom drawer -->
        <button class="phase-select-btn" id="phase-select-btn" onclick="openPhaseDrawer()">
          select phase →
        </button>
        <div class="phase-key-drawer" id="phase-key-drawer">
          <div class="phase-drawer-header">
            <span>where are you today?</span>
            <span class="phase-drawer-close" onclick="closePhaseDrawer()">&#x2715;</span>
          </div>
          <div style="padding:10px 12px;">
            ${keyItems}
            <button class="begin-btn" id="begin-btn" disabled onclick="stepBegin()">begin →</button>
          </div>
        </div>
      ` : `
        <!-- Desktop: side-by-side key -->
        <div class="phase-key">
          <div class="phase-key-title">where are you today?</div>
          ${keyItems}
          <button class="begin-btn" id="begin-btn" disabled onclick="stepBegin()">begin →</button>
        </div>
      `}
    </div>
  </div>`;
  showPanel(html);
}

  document.getElementById('phase-key-drawer')?.classList.remove('open');
  const btn = document.getElementById('phase-select-btn');
  if (btn) btn.style.display = '';
}

function selectPhase(idx) {
  activePhase = `zone_${idx+1}`;
  activeSidequest = null;   // picking a normal zone clears any sidequest draft
  document.querySelectorAll('.phase-key-item').forEach((el,i) =>
    el.classList.toggle('selected', i===idx));
  // Highlight zone circle in SVG
  document.querySelectorAll('.zone-hit').forEach((el,i) => {
    const circle = document.getElementById(`zone-circle-${i}`);
    if (circle) circle.setAttribute('stroke', i===idx ? '#6579e2' : 'transparent');
    const bg = document.getElementById(`zone-bg-${i}`);
    if (bg) bg.setAttribute('fill', i===idx ? 'rgba(101,121,226,0.25)' : 'rgba(200,196,180,0)');
  });
  document.getElementById('begin-btn').disabled = false;
  // On mobile, keep drawer open so user can tap begin
  if (window.innerWidth <= 768) openPhaseDrawer();
}

// ── STEP 4: BEGIN → CHARACTER BUILDER ────────────────────
function stepBegin() {
  if (!activePhase) return;
  activeEntryId = crypto.randomUUID();   // fresh saved_data row for this session
  currentStep = 'character';
  setBubble('who do you feel like today?', []);
  const src  = `../games/infinity-mirror.html?game_id=${activeGameId}&phase=${activePhase}&loop=true&mode=cloud`;
  showIframe(src);
  setSaveBtnVisible(true, 'loading...');
  document.getElementById('save-continue-btn').disabled = true;
}

// ── STEP 5: CHARACTER DONE → BINGO ───────────────────────
function stepBingo() {
  currentStep = 'bingo';
  setBubble('how full is your heart meter?', []);
  const src  = `../games/bingo.html?game_id=${activeGameId}&phase=${activePhase}&loop=true&mode=cloud`;
  showIframe(src);
  setSaveBtnVisible(true, 'continue →');
}

// ── STEP 6: BINGO DONE → JOURNAL (native, no iframe) ─────
function stepJournal() {
  currentStep = 'journal';
  clearTimeout(window._saveFallback);
  setBubble('write your adventure notes', []);
  showPanel(buildJournalPanel());
  loadJournalEntries();
  setSaveBtnVisible(true, 'continue →');
  // Plain Enter = newline (journaling, not quick chat); Cmd/Ctrl+Enter sends.
  const msgEl = document.getElementById('jrc-msg');
  if (msgEl) msgEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendJournalMessage(); }
  });
}

function skipJournal() {
  hidePanel();
  setSaveBtnVisible(false);
  stepDone();
}

// Continue pressed. Messages persist on every send, so the only thing left to
// handle is text/photo the user typed but never sent. "Warn, let me choose":
// reveal a confirm row and don't advance until they pick.
async function saveJournalEntry() {
  const msgEl = document.getElementById('jrc-msg');
  const hasUnsent = !!((msgEl && msgEl.value.trim()) || journal.pendingImage);
  if (hasUnsent) {
    document.getElementById('jrc-confirm')?.classList.add('open');
    showJournalStatus('you have unsent notes', false);
    setSaveBtnVisible(true, 'continue →');   // un-stick the bar from "saving..."
    return;
  }
  finishJournal();
}

function finishJournal() {
  document.getElementById('jrc-confirm')?.classList.remove('open');
  setSaveBtnVisible(false);
  stepDone();
}

async function confirmSendAndContinue() {
  const ok = await sendJournalMessage();
  if (ok) finishJournal();
}
function confirmSkipUnsent() {
  const msgEl = document.getElementById('jrc-msg');
  if (msgEl) msgEl.value = '';
  removeJournalImage();
  finishJournal();
}

// ── NATIVE JOURNAL (chat-style) ──────────────────────────
// Each send appends a message to saved_data.journal_messages (jsonb) on this
// playthrough's row. Photo'd messages also push into matrix_images
// (source:'journal') so matrix quadrant placement is untouched.
const journal = { entries: [], pendingImage: null };

function buildJournalPanel(){
  return `<div class="step-panel jrc-panel">
    <div class="jrc-window">
      <div class="jrc-titlebar">your journal<span class="jrc-date" id="jrc-date"></span></div>
      <div class="jrc-messages" id="jrc-messages">
        <div class="jrc-empty" id="jrc-empty">Upload a picture to your daily moodboard, or just write.<br>A park you passed through, a flower you appreciated, a matcha that hit the spot, a selfie that captures your essence.<br>What do you want to remember?</div>
      </div>
      <div class="jrc-input-area">
        <div class="jrc-img-chip" id="jrc-img-chip">
          <img id="jrc-img-preview" src="" alt="attached">
          <button class="jrc-img-x" onclick="removeJournalImage()" title="remove photo">✕</button>
        </div>
        <div class="jrc-msg-row">
          <textarea class="jrc-msg-input" id="jrc-msg" placeholder="what needs to be put on record about today?" maxlength="4000"></textarea>
          <div class="jrc-btn-stack">
            <button class="jrc-plus-btn" id="jrc-plus" title="add a photo" onclick="document.getElementById('jr-file').click()">+</button>
            <button class="jrc-send-btn" id="jrc-send" onclick="sendJournalMessage()">send</button>
          </div>
        </div>
        <input type="file" id="jr-file" accept="image/*" style="display:none" onchange="onJournalImagePicked(event)">
        <div class="jrc-status" id="jrc-status"></div>
        <div class="jrc-confirm" id="jrc-confirm">
          <span>you've got notes you haven't sent —</span>
          <button class="jrc-confirm-send" onclick="confirmSendAndContinue()">send &amp; continue</button>
          <button class="jrc-confirm-skip" onclick="confirmSkipUnsent()">continue without them →</button>
        </div>
      </div>
    </div>
  </div>`;
}

function jrcEscape(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jrcTime(iso){ return new Date(iso||Date.now()).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function jrcDay(iso){ return new Date(iso||Date.now()).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }

function jrcRowMessages(row){
  const arr = Array.isArray(row?.journal_messages) ? row.journal_messages : [];
  return arr.slice().sort((a,b)=> new Date(a.created_at||0) - new Date(b.created_at||0));
}

function renderJournalMessage(msg, isToday){
  const el = document.createElement('div');
  el.className = 'jrc-msg ' + (isToday ? 'today' : 'past');
  if (msg.id) el.dataset.id = msg.id;
  const img = msg.image_url ? `<img src="${jrcEscape(msg.image_url)}" alt="" onerror="this.style.display='none'">` : '';
  const txt = msg.text ? `<span class="jrc-bubble-txt">${jrcEscape(msg.text)}</span>` : '';
  el.innerHTML = `<div class="jrc-bubble">${img}${txt}</div><div class="jrc-meta">${jrcTime(msg.created_at)}</div>`;
  return el;
}

function jrcScrollBottom(){
  const c = document.getElementById('jrc-messages');
  if (c) c.scrollTop = c.scrollHeight;
}

// Append a date divider to the scroll only when the day changes.
function jrcMaybeDivider(container, dayLabel){
  const last = [...container.querySelectorAll('.jrc-date-divider span')].pop();
  if (last && last.textContent === dayLabel) return;
  const div = document.createElement('div');
  div.className = 'jrc-date-divider';
  div.innerHTML = `<span>${dayLabel}</span>`;
  container.appendChild(div);
}

async function loadJournalEntries(){
  journal.entries = []; journal.pendingImage = null;
  const dateEl = document.getElementById('jrc-date');
  if (dateEl) dateEl.textContent = jrcDay();
  if (!currentUser || !activeGameId) return;

  let rows = [];
  try {
    const { data } = await sb.from('saved_data')
      .select('id, journal_messages, matrix_images, created_at')
      .eq('game_id', activeGameId).eq('user_id', currentUser.id)
      .order('created_at',{ ascending:true }).limit(60);
    rows = data || [];
  } catch(e){ console.error('[journal load]', e); }

  // Past rows with any journal content, plus this playthrough's row even if blank.
  rows = rows.filter(r => r.id === activeEntryId || jrcRowMessages(r).length);
  journal.entries = rows;

  const container = document.getElementById('jrc-messages');
  const empty = document.getElementById('jrc-empty');
  if (!container) return;
  container.querySelectorAll('.jrc-msg, .jrc-date-divider').forEach(e=>e.remove());

  let anyMsg = false;
  rows.forEach(row => {
    const isToday = row.id === activeEntryId;
    jrcRowMessages(row).forEach(msg => {
      jrcMaybeDivider(container, jrcDay(msg.created_at || row.created_at));
      container.appendChild(renderJournalMessage(msg, isToday));
      anyMsg = true;
    });
  });
  if (empty) empty.style.display = anyMsg ? 'none' : 'block';
  jrcScrollBottom();
}

function onJournalImagePicked(e){
  const file = e.target.files && e.target.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = ev => {
    journal.pendingImage = { file, base64: ev.target.result };
    document.getElementById('jrc-img-preview').src = ev.target.result;
    document.getElementById('jrc-img-chip').classList.add('has-img');
  };
  reader.readAsDataURL(file);
}
function removeJournalImage(){
  journal.pendingImage = null;
  const chip = document.getElementById('jrc-img-chip');
  if (chip){ chip.classList.remove('has-img'); document.getElementById('jrc-img-preview').src = ''; }
  const f = document.getElementById('jr-file'); if (f) f.value = '';
}

// Append one message to the current playthrough's row. Returns true on success.
async function sendJournalMessage(){
  const msgEl   = document.getElementById('jrc-msg');
  const sendBtn = document.getElementById('jrc-send');
  const text = (msgEl?.value || '').trim();
  if (!text && !journal.pendingImage) return false;          // nothing to send
  if (!(currentUser && activeEntryId)){ showJournalStatus('not signed in', false); return false; }

  if (sendBtn) sendBtn.disabled = true;

  // 1) upload the staged photo, if any
  let imageUrl = null;
  if (journal.pendingImage){
    try {
      const file = journal.pendingImage.file;
      const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
      const path = `${currentUser.id}/${activeEntryId}/journal-${crypto.randomUUID()}.${ext}`;
      const { error: upErr } = await sb.storage.from(MATRIX_PHOTO_BUCKET)
        .upload(path, file, { contentType:file.type, upsert:false });
      if (upErr) throw upErr;
      const { data: pub } = sb.storage.from(MATRIX_PHOTO_BUCKET).getPublicUrl(path);
      imageUrl = pub?.publicUrl || null;
    } catch(err){
      console.error('[journal image] upload failed:', err);
      showJournalStatus('couldn’t attach photo — try again', false);
      if (sendBtn) sendBtn.disabled = false;
      return false;
    }
  }

  const message = { id: crypto.randomUUID(), text, image_url: imageUrl, created_at: new Date().toISOString() };

  // 2) read current row, append, merge matrix_images
  let row = {};
  try {
    const { data } = await sb.from('saved_data')
      .select('journal_messages, matrix_images').eq('id', activeEntryId).maybeSingle();
    row = data || {};
  } catch(e){}
  const messages  = (Array.isArray(row.journal_messages) ? row.journal_messages : []).concat([message]);
  let imgs = Array.isArray(row.matrix_images) ? row.matrix_images : [];
  if (imageUrl) imgs = imgs.concat([{ url:imageUrl, quadrant:'internal-feeling', source:'journal' }]);

  // 3) write
  try {
    const { error } = await sb.from('saved_data').upsert({
      id: activeEntryId, game_id: activeGameId, user_id: currentUser.id,
      journal_messages: messages, matrix_images: imgs,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'id' });
    if (error) throw error;
  } catch(err){
    console.error('[journal send] failed:', err);
    showJournalStatus('something went wrong — try again', false);
    if (sendBtn) sendBtn.disabled = false;
    return false;
  }

  // 4) reflect in the scroll
  const container = document.getElementById('jrc-messages');
  const empty = document.getElementById('jrc-empty');
  if (empty) empty.style.display = 'none';
  jrcMaybeDivider(container, jrcDay(message.created_at));
  container.appendChild(renderJournalMessage(message, true));

  if (msgEl) msgEl.value = '';
  removeJournalImage();
  document.getElementById('jrc-confirm')?.classList.remove('open');
  if (sendBtn) sendBtn.disabled = false;
  showJournalStatus('saved ✓', true);
  jrcScrollBottom();
  if (msgEl) msgEl.focus();
  return true;
}

function showJournalStatus(msg, ok){
  const el = document.getElementById('jrc-status');
  if (!el) return;
  el.textContent = msg;
  el.classList.remove('ok','err');
  el.classList.add(ok ? 'ok' : 'err');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent=''; el.classList.remove('ok','err'); }, 2600);
}

// ── STEP 7: DONE ──────────────────────────────────────────
// ── ADVENTURE MATRIX ─────────────────────────────────────
// Deterministic string-seeded RNG so a given day always scatters the same way.
function _seedRand(str){
  let h = 1779033703 ^ (str ? str.length : 0);
  for (let i=0; i<(str||'').length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h<<13)|(h>>>19); }
  let s = h>>>0;
  return function(){ s = Math.imul(s ^ (s>>>15), 2246822507); s = Math.imul(s ^ (s>>>13), 3266489909); s ^= s>>>16; return (s>>>0)/4294967296; };
}
function _escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _firstWords(t,n){ if(!t) return ''; const w=t.trim().split(/\s+/); return w.slice(0,n).join(' ') + (w.length>n ? '…' : ''); }
// Full-canvas character PNGs (777×1155, transparent padding so layers align).
