<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<link rel="stylesheet" href="../assets/css/modal.css">
<script src="../assets/js/modal.js" defer></script>
<title>Daily Matrix — Heartability</title>
<meta name="description" content="Track how today felt with Heartability's Daily Matrix — pick an archetype, build your emotional climate, and log any important occurrences or helpful tools.">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview.png">
<style>
@font-face { font-family:"ZoesHandwriting"; src:url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype"); }
@font-face { font-family:"PFPixelscript";  src:url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype"); }

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --back-wall:  #f1ebe4;
  --line-col:   #111;
  --blue:       #6579e2;
  --aqua:       #83d2e6;
  --ink:        #000f5a;
  --cream:      #fdf6e3;
  --bw-top:    9%;  --bw-left:  15%;
  --bw-width: 70%;  --bw-height:70%;
}

html, body { width:100vw; height:100dvh; overflow:hidden; user-select:none;
  background:url("../assets/elements/matrix-sky.png") center / cover no-repeat fixed;
  font-family:var(--font-hand); color:var(--ink); }

/* ── CONTENT PANEL — sits where back wall was ── */
.content-panel { position:fixed; top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height); z-index:10; display:none;
  flex-direction:column; overflow:hidden; }
.content-panel.active { display:flex; }
.content-panel.active:not(.iframe-mode) { background:transparent; border:none; box-shadow:none; }

/* ── IFRAME PANEL — floats free, sized to fit its content (see autoSizeIframe) ── */
.game-iframe { width:100%; height:70vh; border:none; display:block; }
.content-panel.iframe-mode {
  border:none; box-shadow:none; background:transparent; flex-direction:column;
  top:50%; left:50%; transform:translate(-50%,-50%);
  width:min(1050px, 94vw); height:auto; max-height:none;
  overflow:visible;
}
.iframe-prompt {
  flex-shrink:0; padding:10px 18px 8px;
  border-bottom:1px solid #6579e2;
  font-family:var(--font-hand);
}
.iframe-prompt-title { font-size: 28px; color:#000; }
.iframe-prompt-sub   { font-size: 38px); color:#000; margin-top:2px; }

/* ── STEP PANELS (map grid, phase select) ── */
.step-panel {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items: center; justify-content: center;
  overflow-y: auto; padding:20px;
  font-family:var(--font-hand);
}
.step-header {
  width: 100%;
}

/* Step header bar */
.step-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; flex-shrink:0;
}
.step-header-title { font-size:20px; color:#fff; }
.step-back {
  font-size:14px; color:var(--blue); cursor:pointer;
}
.step-back:hover { text-decoration:underline; }

/* Loading state */
.loading-msg { font-family:var(--font-hand); font-size:15px; color:#aaa; text-align:center; padding:40px; }

/* ── NAV BAR ── */
.room-nav {
  position:fixed; top:0; left:0; right:0; height:44px;
  background:#4970fc; border-bottom:2px solid var(--line-col);
  z-index:200; display:flex; align-items:center;
  justify-content:space-between; padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(18px,1.6vw,22px); color:#fff;
}
.nav-title { position:absolute; left:50%; transform:translateX(-50%); pointer-events:none; white-space:nowrap; margin:0; font:inherit; }
.nav-btn { cursor:pointer; padding:4px 8px; border-radius:2px; transition:background .15s; color:inherit; text-decoration:none; }
.nav-btn:hover { background:rgba(0,0,0,.08); }

/* ── Gear dropdown ── */
.gear-wrap { position:relative; }
.gear-btn { width:30px; height:30px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:3px; transition:background .15s; padding:3px; }
.gear-btn:hover { background:rgba(0,0,0,.08); }
.gear-btn img { width:22px; height:22px; display:block; }
.gear-dropdown { position:absolute; top:calc(100% + 4px); left:0; min-width:170px; background:#c9fff5; border:2px solid var(--line-col); box-shadow:3px 4px 0 rgba(0,0,0,.12); z-index:201; display:none; flex-direction:column; overflow:hidden; }
.gear-dropdown.open { display:flex; }
.gear-item { font-family:var(--font-hand); font-size:clamp(13px,1.3vw,16px); color:#333; padding:9px 14px; cursor:pointer; border:none; background:none; text-align:left; white-space:nowrap; transition:background .12s; }
.gear-item:hover { background:rgba(0,0,0,.07); }
.gear-music { display:flex; align-items:center; justify-content:center; gap:12px; padding:8px 14px; border-top:1px solid rgba(0,0,0,.1); }
.music-btn { cursor:pointer; background:none; border:none; padding:2px; opacity:.65; transition:opacity .15s; }
.music-btn:hover { opacity:1; }
.music-btn img { width:18px; height:18px; display:block; }

/* ── Login popup ── */
.login-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:300; display:none; align-items:flex-start; justify-content:flex-start; padding-top:46px; padding-left:clamp(12px,2vw,28px); }
.login-overlay.open { display:flex; }
.login-popup { background:#f5f0ea; box-shadow:0 0 0 3px var(--blue),0 0 0 6px var(--aqua),4px 8px 28px rgba(0,0,0,.35); width:clamp(280px,88vw,360px); overflow:hidden; animation:popIn .2s ease both; }
@keyframes popIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
.login-popup-titlebar { height:38px; background:#e8e3da; border-bottom:2px solid #bbb; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-family:var(--font-hand); font-size:20px; color:#555; }
.popup-close { cursor:pointer; color:#aaa; font-family:var(--font-hand); font-size:16px; padding:4px; line-height:1; }
.popup-close:hover { color:var(--blue); }
.login-popup-tabs { display:flex; border-bottom:2px solid #ccc; background:#e8e3da; }
.popup-tab { flex:1; padding:8px; font-family:var(--font-hand); font-size:18px; text-align:center; cursor:pointer; color:#888; background:none; border:none; border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .2s; }
.popup-tab.active { color:var(--blue); border-bottom-color:var(--blue); }
.login-popup-body { padding:18px 20px 14px; display:flex; flex-direction:column; gap:12px; }
.popup-form { display:none; flex-direction:column; gap:12px; }
.popup-form.active { display:flex; }
.popup-field { display:flex; flex-direction:column; gap:4px; }
.popup-label { font-family:var(--font-hand); font-size:15px; color:#aaa; }
.popup-input { font-family:var(--font-hand); font-size:18px; color:#222; background:#f5f0ea; border:1.5px solid #bbb; padding:7px 10px; outline:none; transition:border-color .2s; user-select:text; }
.popup-input:focus { border-color:var(--blue); }
.popup-btn { padding:9px; background:var(--blue); border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa; font-family:var(--font-hand); font-size:18px; color:white; cursor:pointer; transition:all .05s; margin-top:2px; }
.popup-btn:hover { background:#4a5bc4; }
.popup-btn:active { box-shadow:none; transform:translate(2px,2px); }
.popup-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.popup-msg { font-size:15px; font-family:var(--font-hand); padding:6px 10px; display:none; }
.popup-msg.error { display:block; color:#c0392b; background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.15); }
.popup-msg.success { display:block; color:#2e7d32; background:rgba(46,125,50,.08); border:1px solid rgba(46,125,50,.15); }

/* ── HEART CHARACTER ── */
@keyframes idle-pulse {
  0%,100% { transform:translateY(0) rotate(-2deg) scale(1); }
  50%      { transform:translateY(-8px) rotate(2deg) scale(1.03); }
}
.char-heart {
  position:fixed; left:4vw; bottom:6vh;
  width:clamp(100px,14vw,220px);
  z-index:400; cursor:default;
}
.char-heart .char-img {
  display:block; width:100%; height:auto;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.28));
  animation:idle-pulse 3.6s ease-in-out 1s infinite;
}

/* ── THOUGHT BUBBLE ── */
.thought-bubble {
  position:absolute; left:calc(100% - 8px); bottom:60%;
  min-width:clamp(160px,18vw,260px); max-width:clamp(180px,22vw,300px);
  background:#fff; border:2px solid #000; border-radius:50%;
  padding:14px 20px; font-family:var(--font-hand);
  font-size:clamp(11px,1.3vw,15px); color:#000; text-align:center;
  line-height:1.5; filter:drop-shadow(1px 3px 5px rgba(0,0,0,.2));
  z-index:21;
}
.bubble-btns { display:none; } /* buttons moved to back wall */

/* ── WALL BUTTONS — centered on the back wall ── */
.wall-btns {
  position:fixed;
  top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height);
  z-index:8;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  pointer-events:none;
}
.wall-btns.active { display:flex; }
.wall-btn {
  pointer-events:all;
  padding:14px 40px;
  background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:clamp(15px,1.8vw,20px); color:#fff;
  cursor:pointer; transition:all .05s; min-width:220px; text-align:center;
}
.wall-btn:hover { background:#4a5bc4; }
.wall-btn:active { box-shadow:none; transform:translate(3px,3px); }
.wall-btn.secondary {
  background:none; border-color:#ccc; color:#999; box-shadow:none;
}
.wall-btn.secondary:hover { border-color:var(--blue); color:var(--blue); }

/* ── SAVE & CONTINUE BUTTON — floats below back wall ── */
.save-continue-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(21% - 44px); /* floor area below back wall */
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 15;
  pointer-events: none;
}
.save-continue-bar.visible { display: flex; }

.save-continue-btn {
  pointer-events: all;
  padding: 14px 40px;
  background: var(--blue);
  border: 2px solid #4a5bc4;
  box-shadow: 3px 3px 0 #3a4aaa;
  font-family: var(--font-hand);
  font-size: clamp(15px, 1.8vw, 20px);
  color: #fff;
  cursor: pointer;
  transition: all .05s;
  letter-spacing: .3px;
}
.save-continue-btn:hover { background: #4a5bc4; }
.save-continue-btn:active { box-shadow: none; transform: translate(3px, 3px); }
.save-continue-btn:disabled {
  opacity: .38; cursor: not-allowed;
  transform: none !important; box-shadow: 3px 3px 0 #3a4aaa;
}

.save-status-bar {
  position: fixed;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-hand);
  font-size: 14px;
  color: #6ab86a;
  z-index: 16;
  pointer-events: none;
}

/* ── MOBILE ── */
@media (max-width:768px) {
  :root {
    --bw-top:    44px;
    --bw-left:   0%;
    --bw-width:  100%;
    --bw-height: calc(100dvh - 44px);
  }
  .content-panel.active:not(.iframe-mode) { border:none; box-shadow:none; }
  .char-heart { display:none; }
  .thought-bubble { font-size:clamp(11px,3vw,14px); min-width:140px; left:calc(100% - 6px); }
  .save-continue-bar { height:auto; padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px)); bottom:0; z-index:30; background:var(--cream); border-top:2px solid var(--aqua); }
  /* leave room below the panel so the continue bar doesn't sit on top of it */
  body.save-bar-visible .content-panel:not(.iframe-mode) { --bw-height: calc(100dvh - 44px - 100px); }
  /* iframe-mode (character builder) was centered with overflow:visible, so any
     content taller than the viewport was unreachable — anchor it below the nav
     and let it scroll instead. */
  .content-panel.iframe-mode {
    top:44px; left:0; transform:none; width:100%; max-width:100%;
    height:calc(100dvh - 44px - 100px);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .journal-wall-overlay {
    top: 80px !important;
    left: 16px !important;
    right: 16px !important;
    width: auto !important;
    height: auto !important;
    bottom: 80px !important;
    border-radius: 4px !important;
  }
}

/* ── MOBILE PHASE SELECT ── */
.login-modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5);
  z-index:300; display:none; align-items:center; justify-content:center;
}
.login-modal-overlay.open { display:flex; }
.login-modal-window {
  width:min(92vw,440px); background:#f5f0ea;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.35);
  overflow:hidden;
}
.login-modal-titlebar {
  height:38px; background:#e8e3da; border-bottom:2px solid #bbb;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; font-family:var(--font-hand); font-size:20px; color:#555;
}
.login-modal-close {
  cursor:pointer; font-size:20px; color:#bbb; padding:2px 4px; transition:color .15s;
}
.login-modal-close:hover { color:#444; }

/* Login form tabs */
.lm-tab-row {
  display:flex; border-bottom:2px solid #ccc; background:#e8e3da;
}
.lm-tab {
  flex:1; padding:10px; font-family:var(--font-hand); font-size:18px;
  text-align:center; cursor:pointer; color:#888; background:none; border:none;
  border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .15s;
}
.lm-tab.active { color:var(--blue); border-bottom-color:var(--blue); }

/* Login form body */
.lm-body { padding:20px 24px 16px; display:flex; flex-direction:column; gap:12px; }
.lm-form { display:none; flex-direction:column; gap:12px; }
.lm-form.active { display:flex; }
.lm-field { display:flex; flex-direction:column; gap:4px; }
.lm-label { font-family:var(--font-hand); font-size:15px; color:#888; }
.lm-input {
  font-family:var(--font-hand); font-size:18px; color:#222; background:#f5f0ea;
  border:1.5px solid #bbb; padding:8px 12px; outline:none; transition:border-color .15s;
  user-select:text;
}
.lm-input:focus { border-color:var(--blue); }
.lm-btn {
  padding:10px 18px; background:var(--blue); border:2px solid #4a5bc4;
  box-shadow:2px 2px 0 #3a4aaa; font-family:var(--font-hand); font-size:18px;
  color:#fff; cursor:pointer; transition:all .05s; margin-top:4px;
}
.lm-btn:hover { background:#4a5bc4; }
.lm-btn:active { box-shadow:none; transform:translate(2px,2px); }
.lm-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.lm-msg { font-family:var(--font-hand); font-size:15px; padding:6px 10px; display:none; }
.lm-msg.error   { display:block; color:#c0392b; background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.2); }
.lm-msg.success { display:block; color:#2d7a4f; background:rgba(45,122,79,.08); border:1px solid rgba(45,122,79,.2); }
.lm-footer { text-align:center; padding:0 24px 14px; font-family:var(--font-hand); font-size:11px; color:#aaa; }

/* ── JOURNAL WINDOW on back wall ── */
.journal-wall-overlay {
  position:fixed;
  top:calc(var(--bw-top) + 4%); left:calc(var(--bw-left) + 5%);
  width:calc(var(--bw-width) - 10%); height:calc(var(--bw-height) - 8%);
  z-index:20; display:none; flex-direction:column;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 4px 8px 24px rgba(0,0,0,.25);
  background:#e8e3da; border-radius:2px; overflow:hidden;
}
.journal-wall-overlay.open { display:flex; }

/* ── JOURNAL INLINE (step panel) ── */
.journal-inline {
  width:100%; height:100%; display:flex; overflow:hidden;
}
.journal-spine-inline {
  flex-shrink:0; width:18px; background:#e8e3da;
  border-right:1.5px solid #c8b88a;
  display:flex; flex-direction:column; justify-content:space-around;
  align-items:center; padding:12px 0;
}
.journal-spine-ring {
  width:14px; height:14px; border:2.5px solid #8a7a5a;
  border-radius:50%; background:#e8e4dc; flex-shrink:0;
}
.journal-page {
  flex:1; background:#f1ece4; padding:16px 20px 12px 16px;
  display:flex; flex-direction:column; gap:8px;
  background-image:linear-gradient(to bottom,transparent calc(100% - 1px),rgba(101,121,226,.1) 1px);
  background-size:100% 32px; background-position:0 52px; overflow:hidden;
}
.journal-page-header {
  border-bottom:1px solid rgba(101,121,226,.2); padding-bottom:6px; flex-shrink:0;
  font-family:var(--font-hand); font-size:clamp(12px,1.4vw,16px); color:#5a4a2a;
}
.journal-textarea {
  flex:1; resize:none; border:none; outline:none; background:transparent;
  font-family:var(--font-hand); font-size:clamp(13px,1.4vw,17px);
  color:#2a1e14; line-height:2; overflow-y:auto; user-select:text;
  caret-color:var(--blue);
}
.journal-textarea::placeholder { color:rgba(138,122,90,.35); font-style:italic; }
.journal-privacy {
  font-family:var(--font-hand); font-size:clamp(9px,.85vw,11px);
  color:#ccc; border-top:1px solid #e8e0d0; padding-top:6px; flex-shrink:0;
}

/* ── Daily MATRIX ─────────────────────────────────────
   Portable: this block + buildDailyMatrix() can be lifted
   into the archive page so the moodboard renders identically.   */
.matrix-panel { padding:0; overflow:hidden; justify-content:flex-start; align-items:stretch; position:relative; }
.matrix-date {
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  font-family:var(--font-hand); font-size:clamp(30px,3vw,36px); color:#fff; z-index:6;
}
/* Header row holds the date, above the matrix */
.matrix-header { position:relative; height:34px; flex-shrink:0; }
/* Framed container — insets the matrix so it doesn't bleed into the wall edges */
.matrix-frame {
  width:76%; height:76%; margin:auto; align-self:center;
  position:relative; overflow:hidden;
}

.adv-matrix { position:absolute; top:0; left:0; width:100%; height:100%; overflow:hidden; background:transparent; }
.adv-grid {
  position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(184,168,138,.13) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(184,168,138,.13) 1px, transparent 1px);
  background-size:38px 38px;
}
.adv-axis { position:absolute; background:rgba(184,168,138,.5); pointer-events:none; }
.adv-axis-x { left:6%; right:6%; top:50%; height:1.5px; }
.adv-axis-y { top:7%; bottom:7%; left:50%; width:1.5px; }

/* Axis descriptors — siblings of the items inside .adv-matrix (which paints
   reliably). translateZ(0) forces each onto its own layer so none get dropped. */
.adv-axlbl {
  position:absolute; z-index:5; white-space:nowrap;
  font-family:var(--font-hand); color:#5a4a2a; letter-spacing:.5px;
  font-size:clamp(14px,1.9vw,23px);
}

.adv-item { position:absolute; z-index:3; text-align:center; }
.adv-cap  { font-family:var(--font-hand); font-size:clamp(10px,1.1vw,13px); color:#8a7a5a; margin-top:3px; }

.adv-map { width:clamp(150px,20vw,240px); }
.adv-map-svg { width:100%; aspect-ratio:5/4; }
.adv-map-svg svg { width:100%; height:100%; }

.adv-bingo { width:clamp(130px,16vw,200px); }
.adv-meter { width:100%; height:14px; border:1.5px solid var(--blue); background:#e7e1d6; margin-top:2px; }
.adv-meter-fill { height:100%; background:linear-gradient(90deg,#E8478B,#f3a0c4); }
.adv-mode { font-family:var(--font-hand); font-size:clamp(10px,1.1vw,13px); color:#8a7a5a; margin-top:3px; }

.adv-char { width:clamp(90px,11vw,140px); }
.adv-char-stack { position:relative; width:100%; aspect-ratio:1; }
.adv-char-stack img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }

/* Archetype picker — reuse a saved cast member or build a new one */
.arch-picker-loading { padding: 20px; font-family: var(--font-hand); color: #8a7a5a; }
.arch-picker {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px;
}
.arch-picker-title { font-family: var(--font-hand); font-size: clamp(20px,2.4vw,28px); color: #3a2e1e; text-align: center; }
.arch-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(120px, 180px));
  gap: 12px;
  padding: 4px;
  justify-content: center;
}
@media (max-width:600px) { .arch-grid { grid-template-columns: repeat(2, 1fr); } }
.arch-card {
  border: 2px solid #ccc; background: #fdf6e3;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: stretch;
  padding: 8px 8px 6px; gap: 5px;
  font-family: var(--font-hand); text-align: center;
  transition: border-color .15s, box-shadow .12s, transform .1s;
  position: relative;
  aspect-ratio: 4/5;
}
.arch-card:hover { border-color: var(--blue); box-shadow: 2px 2px 0 var(--blue); transform: translateY(-2px); }
.arch-card-name { font-size: 15px; color: #3a2e1e; }
.arch-card-new { border-style: dashed; border-color: #c8b88a; justify-content: center; align-items: center; }
.arch-card-new:hover { border-color: var(--blue); }
.arch-card-plus { font-size: 40px; line-height: 1; color: #c8b88a; }
.arch-card-new:hover .arch-card-plus { color: var(--blue); }

.adv-journal {
  width:clamp(150px,18vw,230px);
  background:rgba(255,255,255,.72); border:1.5px solid #c8b88a;
  padding:10px 12px; box-shadow:2px 3px 0 rgba(0,0,0,.06);
}
.adv-journal-text {
  font-family:var(--font-hand); font-size:clamp(12px,1.3vw,16px);
  color:#5a4a2a; line-height:1.4; font-style:italic;
}

.adv-photo { position:absolute; z-index:3; width:clamp(74px,9vw,118px); }
.adv-photo img {
  width:100%; display:block; border:4px solid #fff; border-bottom-width:18px;
  box-shadow:2px 3px 7px rgba(0,0,0,.18); object-fit:cover; aspect-ratio:1;
}
/* Remove control on each matrix photo — hover-reveal on desktop, always on touch */
.adv-photo-remove {
  position:absolute; top:-8px; right:-8px; z-index:4;
  width:20px; height:20px; padding:0; line-height:1;
  background:#fff; border:1.5px solid #ccc; border-radius:50%;
  color:#888; font-size:11px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .12s, color .12s, border-color .12s;
}
.adv-photo:hover .adv-photo-remove { opacity:1; }
.adv-photo-remove:hover { color:#E8478B; border-color:#E8478B; }
@media (hover: none) { .adv-photo-remove { opacity:1; } }

/* Add-photo button — circular white plus, fixed top-right of page */
.matrix-photo-btn {
  position:fixed; top:9vh; right:40vw; z-index:100;
  width:40px; height:40px; border-radius:50%;
  font-size:24px; line-height:1; color:var(--blue);
  background:#fff; border:none;
  box-shadow:0 2px 8px rgba(0,0,0,0.18);
  cursor:pointer; transition:all .1s;
  display:flex; align-items:center; justify-content:center;
}
.matrix-photo-btn:hover  { background:var(--blue); color:#fff; box-shadow:0 3px 12px rgba(0,0,0,0.25); }
.matrix-photo-btn:active { transform:scale(0.93); }

/* ── PHOTO UPLOAD MODAL — framed to match the matrix ── */
.photo-overlay {
  position:fixed; inset:0; z-index:320;
  background:rgba(40,32,24,.45);
  display:none; align-items:center; justify-content:center; padding:18px;
}
.photo-overlay.open { display:flex; }
.photo-card {
  width:min(440px,94vw); max-height:92vh; overflow-y:auto;
  background:var(--back-wall);
  border:2px solid var(--blue);
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.4);
  padding:18px 20px; font-family:var(--font-hand);
}
.photo-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.photo-title { font-size:clamp(18px,2.2vw,24px); color:var(--blue); }
.photo-close { font-size:22px; color:#aaa; cursor:pointer; line-height:1; border:none; background:none; padding:2px 6px; }
.photo-close:hover { color:#E8478B; }
.photo-sub { font-size:13px; color:#8a7a5a; margin:2px 0 14px; }

.photo-drop { display:block; cursor:pointer; }
.photo-preview {
  width:100%; aspect-ratio:4/3; background:#e8e0c8;
  border:2px dashed #8a7a5a; display:flex; align-items:center; justify-content:center;
  overflow:hidden; margin-bottom:14px; transition:border-color .12s;
}
.photo-drop:hover .photo-preview { border-color:var(--blue); }
.photo-preview img { width:100%; height:100%; object-fit:cover; }
.photo-drop-hint { color:rgba(138,122,90,.7); font-style:italic; font-size:14px; }

.photo-quad-label { font-size:12px; color:#8a7a5a; letter-spacing:.4px; margin-bottom:6px; }
.photo-quad-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.photo-quad {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:12px 8px; background:#fdf6e3; border:1.5px solid #ccc;
  font-family:var(--font-hand); cursor:pointer; color:#555; transition:all .1s;
}
.photo-quad b { font-size:15px; color:#3a2e1e; }
.photo-quad span { font-size:10px; color:#8a7a5a; }
.photo-quad:hover { border-color:var(--blue); background:#f0edfa; }
.photo-quad.selected { border-color:var(--blue); background:var(--blue); box-shadow:2px 2px 0 #3a4aaa; }
.photo-quad.selected b, .photo-quad.selected span { color:#fff; }

.photo-status { font-size:13px; min-height:18px; margin-bottom:8px; color:#8a7a5a; }
.photo-add-btn {
  width:100%; padding:12px 18px; background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:16px; color:#fff; cursor:pointer; transition:all .05s;
}
.photo-add-btn:hover  { background:#4a5bc4; }
.photo-add-btn:active { box-shadow:none; transform:translate(2px,2px); }
.photo-add-btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }

/* ── NATIVE JOURNAL — chat-style journal on the back wall ── */
.jrc-panel { padding:8px; overflow:hidden; justify-content:center; align-items:center; }
.jrc-window {
  width:75%; height:75%; background:#f5f0ea;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 6px 10px 40px rgba(0,0,0,.35);
  display:flex; flex-direction:column; overflow:hidden;
}
.jrc-titlebar {
  flex-shrink:0; height:38px; background:#e8e3da; border-bottom:2px solid #bbb;
  display:flex; align-items:center; justify-content:center; position:relative;
  font-family:var(--font-hand); font-size:clamp(13px,1.5vw,18px); color:#333; letter-spacing:.5px;
}
.jrc-date { position:absolute; right:12px; font-size:clamp(9px,1vw,12px); color:#999; font-family:var(--font-hand); }
.jrc-messages {
  flex:1; overflow-y:auto; padding:14px 16px;
  display:flex; flex-direction:column; gap:9px; scroll-behavior:smooth;
}
.jrc-msg-wrap { display:flex; align-items:flex-start; gap:8px; }
.jrc-msg-wrap.right { flex-direction:row-reverse; align-self:flex-end; }
.jrc-msg-wrap.left  { flex-direction:row; align-self:flex-start; }
.jrc-avatar { flex-shrink:0; width:52px; height:52px; border-radius:50%; overflow:hidden; position:relative; border:1.5px solid #ccc; background:#f0ebe2; }
.jrc-avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.jrc-msg { display:flex; flex-direction:column; gap:3px; max-width:72%; }
.jrc-msg-wrap.right .jrc-msg { align-items:flex-end; }
.jrc-msg-wrap.left  .jrc-msg { align-items:flex-start; }
.jrc-bubble {
  padding:11px 16px; font-family:var(--font-hand); font-size:clamp(14px,1.6vw,19px);
  line-height:1.5; word-break:break-word; user-select:text;
}
.jrc-msg-wrap.right .jrc-bubble { background:var(--blue); color:#fff; border:1.5px solid #4a5bc4; }
.jrc-msg-wrap.left  .jrc-bubble { background:#fff; color:#222; border:1.5px solid #ccc; }
.jrc-bubble img { display:block; width:210px; max-width:100%; margin-bottom:6px; object-fit:cover; border:3px solid rgba(255,255,255,.6); }
.jrc-msg-wrap.left .jrc-bubble img { border-color:#e3ddd2; }
.jrc-meta { font-size:clamp(11px,1vw,13px); color:#aaa; font-family:var(--font-hand); padding:0 4px; }
.jrc-empty {
  margin:auto; text-align:center; color:#9a8a6a; font-style:italic;
  font-size:clamp(13px,1.4vw,16px); line-height:1.6; max-width:84%; padding:24px 0;
}
.jrc-date-divider { display:flex; align-items:center; gap:10px; padding:2px 0; align-self:stretch; }
.jrc-date-divider span { font-size:12px; color:#bbb; font-family:var(--font-hand); white-space:nowrap; }
.jrc-date-divider .divider-location { font-size:13px; color:#a09080; font-family:var(--font-hand); white-space:nowrap; }
.jrc-date-divider::before, .jrc-date-divider::after { content:''; flex:1; height:1px; background:#ddd; }
.jrc-input-area {
  flex-shrink:0; border-top:2px solid #ccc; padding:10px 14px;
  display:flex; flex-direction:column; gap:7px; background:#ede8e0;
}
.jrc-img-chip { position:relative; width:70px; display:none; }
.jrc-img-chip.has-img { display:block; }
.jrc-img-chip img { width:100%; border:1.5px solid #c8b88a; display:block; object-fit:cover; aspect-ratio:1; }
.jrc-img-x {
  position:absolute; top:-7px; right:-7px; width:18px; height:18px; padding:0; line-height:1;
  background:#fff; border:1.5px solid #ccc; border-radius:50%; cursor:pointer; font-size:10px; color:#888;
  display:flex; align-items:center; justify-content:center;
}
.jrc-img-x:hover { color:#E8478B; border-color:#E8478B; }
.jrc-msg-row { display:flex; gap:8px; align-items:stretch; }
.jrc-msg-input {
  flex:1; font-family:var(--font-hand); font-size:clamp(12px,1.3vw,15px); color:#222;
  background:#f5f0ea; border:1.5px solid #bbb; padding:8px 11px; outline:none; resize:none;
  height:58px; line-height:1.5;
}
.jrc-msg-input:focus { border-color:var(--blue); }
.jrc-btn-stack { flex-shrink:0; display:flex; flex-direction:column; gap:6px; width:58px; }
.jrc-plus-btn {
  flex:1; background:rgba(255,255,255,.72); border:2px solid var(--blue); box-shadow:2px 2px 0 var(--aqua);
  font-family:var(--font-hand); font-size:20px; color:var(--blue); cursor:pointer; line-height:1; padding:0; transition:all .05s;
}
.jrc-plus-btn:hover  { background:var(--blue); color:#fff; }
.jrc-plus-btn:active { box-shadow:none; transform:translate(2px,2px); }
.jrc-send-btn {
  flex:1; background:var(--blue); border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:clamp(12px,1.3vw,15px); color:#fff; cursor:pointer; padding:0; transition:all .05s;
}
.jrc-send-btn:hover  { background:#4a5bc4; }
.jrc-send-btn:active { box-shadow:none; transform:translate(2px,2px); }
.jrc-send-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.jrc-status { font-size:clamp(9px,.9vw,11px); color:#999; font-family:var(--font-hand); min-height:13px; }
.jrc-status.ok  { color:#6ab86a; }
.jrc-status.err { color:#E8478B; }
.jrc-confirm {
  display:none; align-items:center; flex-wrap:wrap; gap:8px;
  padding-top:7px; border-top:1px dashed #ccc;
  font-family:var(--font-hand); font-size:clamp(11px,1.2vw,14px); color:#8a7a5a;
}
.jrc-confirm.open { display:flex; }
.jrc-confirm button { font-family:var(--font-hand); font-size:clamp(11px,1.2vw,14px); cursor:pointer; padding:5px 12px; transition:all .05s; }
.jrc-confirm-send { background:var(--blue); color:#fff; border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa; }
.jrc-confirm-send:hover  { background:#4a5bc4; }
.jrc-confirm-send:active { box-shadow:none; transform:translate(2px,2px); }
.jrc-confirm-skip { background:none; border:none; color:#8a7a5a; text-decoration:underline; }
.jrc-confirm-skip:hover { color:#E8478B; }

/* ── DAYQUEST BUILDER MODAL ── */
.dq-overlay {
  position:fixed; inset:0; z-index:300;
  background:none;
  display:none; align-items:flex-start; justify-content:flex-start;
  padding:0;
}
.dq-overlay.open { display:flex; }
.dq-card {
  position:fixed;
  top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height);
  max-height:none; overflow-y:auto;
  padding:28px 36px;
  background:var(--back-wall);
  border:3px solid var(--blue);
  box-shadow:0 0 0 3px var(--aqua), 6px 10px 40px rgba(0,0,0,.4);
  padding:18px 20px; font-family:var(--font-hand);
}
.dq-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; }
.dq-close { font-size:28px; color:#aaa; cursor:pointer; line-height:1; border:none; background:none; padding:2px 6px; }
.dq-close:hover { color:#E8478B; }
.dq-sub { font-size:20px; color:#000; margin-bottom:12px; }
.__unused {
  width:100%; font-family:var(--font-hand); font-size:15px; color:#3a2e1e;
  padding:8px 10px; margin-bottom:14px;
  background:#fdf6e3; border:2px solid #8a7a5a;
  border-right-color:#5a4a2a; border-bottom-color:#5a4a2a;
  border-left-color:#c8b88a; border-top-color:#c8b88a;
}
.dq-name::placeholder { color:rgba(138,122,90,.55); font-style:italic; }
.dq-body {
  display:grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr;
  gap:16px 24px;
  align-items:start;
}
@media (max-width:640px){ .dq-body { grid-template-columns:1fr; } }
.dq-preview-col { min-width:0; display:flex; flex-direction:column; align-items:center; }
.dq-terrain-col { min-width:0; }
.dq-climate-col { grid-column: 1 / -1; min-width:0; }
.dq-map-frame {
  width:min(100%, 300px); aspect-ratio:1/1;
  background:#e8e0c8;
  border:2px solid #8a7a5a; border-right-color:#5a4a2a; border-bottom-color:#5a4a2a;
  border-left-color:#c8b88a; border-top-color:#c8b88a;
}
.dq-map-frame svg { width:100%; height:100%; display:block; }
.dq-section-label { font-size:14px; color:#8a7a5a; letter-spacing:.4px; margin:0 0 8px; }

/* terrain palette */
.dq-palette { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
.dq-terrain {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 6px; background:#f0ead6; cursor:pointer; user-select:none;
  border:2px solid #8a7a5a; border-right-color:#5a4a2a; border-bottom-color:#5a4a2a;
  border-left-color:#c8b88a; border-top-color:#c8b88a;
  transition:filter .1s;
}
.dq-terrain:hover { filter:brightness(1.06); }
.dq-terrain.active { border-color:var(--aqua); outline:2px solid var(--aqua); outline-offset:1px; background:#e0f0f0; }
.dq-terrain img { width:60px; height:50px; object-fit:contain; pointer-events:none; }
.dq-terrain span { font-size:11px; color:#5a4a2a; letter-spacing:.4px; pointer-events:none; }

/* climates + feeling chips */
.dq-climates { display:flex; flex-direction:column; gap:8px; }
.dq-climate {
  padding:7px 9px;
  border:2px solid #8a7a5a; border-right-color:#5a4a2a; border-bottom-color:#5a4a2a;
  border-left-color:#c8b88a; border-top-color:#c8b88a;
}
.dq-climate.sunny { background:#f2e6a8; border-color:#715f04; }
.dq-climate.rainy { background:#ae87e2; border-color:#260156; }
.dq-climate.windy { background:#a3eac9; border-color:#046957; }
.dq-climate.snowy { background:#6cd1ea; border-color:#033f50; }
.dq-climate-head { font-size:clamp(26px,3vw,36px); margin-bottom:8px; }
.dq-climate.sunny .dq-climate-head { color:#715f04; }
.dq-climate.rainy .dq-climate-head { color:#260156; }
.dq-climate.windy .dq-climate-head { color:#046957; }
.dq-climate.snowy .dq-climate-head { color:#033f50; }
.dq-chips { display:flex; flex-wrap:wrap; gap:5px; }
.dq-chip {
  padding:5px 14px; font-family:var(--font-hand); font-size:clamp(16px,1.8vw,22px); letter-spacing:.4px;
  cursor:pointer; user-select:none; border:2px solid; transition:filter .1s;
}
.dq-chip:hover { filter:brightness(.92); }
.dq-chip.active { outline:2px solid #111; outline-offset:1px; }
.dq-climate.sunny .dq-chip { background:#f8edb8; border-color:#715f04; color:#715f04; }
.dq-climate.rainy .dq-chip { background:#c9b3e7; border-color:#260156; color:#260156; }
.dq-climate.windy .dq-chip { background:#b6e7d0; border-color:#046957; color:#046957; }
.dq-climate.snowy .dq-chip { background:#a0d7e6; border-color:#033f50; color:#033f50; }

.dq-foot {
  display:none; align-items:center; justify-content:center;
  gap:16px; margin-top:14px; padding-top:14px;
  border-top:1px solid rgba(138,122,90,.35);
}
.dq-overlay.open .dq-foot { display:flex; }
.dq-btn {
  padding:10px 18px; font-family:var(--font-hand); font-size:15px; cursor:pointer;
  border:2px solid #4a5bc4; background:var(--blue); color:#fff; box-shadow:2px 2px 0 #3a4aaa;
  transition:all .05s;
}
.dq-btn:hover { background:#4a5bc4; }
.dq-btn:active { box-shadow:none; transform:translate(2px,2px); }
.dq-btn:disabled { opacity:.38; cursor:not-allowed; transform:none !important; box-shadow:2px 2px 0 #3a4aaa; }
.dq-btn.ghost { background:none; color:#999; border-color:#ccc; box-shadow:none; }
.dq-btn.ghost:hover { border-color:var(--blue); color:var(--blue); background:none; }

/* dayquest entry in the phase key */

@media (prefers-reduced-motion: reduce) {
  .dq-terrain, .dq-chip, .dq-btn { transition:none; }
}

/* ── MEMBER GATE ── */
.member-gate-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.6);
  z-index:350; display:none; align-items:center; justify-content:center;
}
.member-gate-overlay.open { display:flex; }
.member-gate {
  background:#f5f0ea;
  box-shadow:0 0 0 3px var(--blue), 0 0 0 6px var(--aqua), 4px 8px 28px rgba(0,0,0,.35);
  padding:36px 32px; max-width:400px; width:90%;
  text-align:center; display:flex; flex-direction:column; gap:16px;
  animation:popIn .2s ease both;
}
.member-gate-title { font-family:var(--font-hand); font-size:clamp(20px,2.5vw,28px); color:var(--blue); }
.member-gate-text { font-family:var(--font-hand); font-size:clamp(13px,1.4vw,16px); color:#555; line-height:1.5; }
.member-gate-btns { display:flex; flex-direction:column; gap:10px; }
.member-gate-btn {
  font-family:var(--font-hand); font-size:clamp(14px,1.6vw,18px); color:#fff;
  background:var(--blue); border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa;
  padding:12px 20px; cursor:pointer; transition:all .05s;
}
.member-gate-btn:hover { background:#4a5bc4; }
.member-gate-btn:active { box-shadow:none; transform:translate(2px,2px); }
.member-gate-btn.ghost { background:none; color:#999; border-color:#ccc; box-shadow:none; }
.member-gate-btn.ghost:hover { border-color:var(--blue); color:var(--blue); }
</style>
</head>

// Same-origin game iframes don't auto-size to their content by default, so
// once loaded we measure the real document height and apply it directly —
// this is what lets the frame grow to fit instead of scrolling internally.
function autoSizeIframe(iframe) {
  const resize = () => {
    try {
      const doc = iframe.contentDocument;
      const h = doc && doc.documentElement.scrollHeight;
      if (h) iframe.style.height = h + 'px';
    } catch (e) { /* cross-origin — keep fallback height */ }
  };
  iframe.addEventListener('load', () => {
    resize();
    try {
      if ('ResizeObserver' in window && iframe.contentDocument) {
        new ResizeObserver(resize).observe(iframe.contentDocument.documentElement);
      }
    } catch (e) {}
  });
}

// The matrix map item shows ONLY the day's chosen destination (one terrain +
// tint glow + feeling), not the whole map. loc = {terrain, feeling, tint}.
function buildSingleLocationSVG(loc){
  loc = loc || {};
  const R = 58, cx = 150, cy = 108;
  let defs = '', body = '';
  if (loc.tint) {
    defs += `<radialGradient id="locglow" cx="50%" cy="50%" r="50%">`
      + `<stop offset="0%" stop-color="${loc.tint}" stop-opacity="1"/>`
      + `<stop offset="55%" stop-color="${loc.tint}" stop-opacity=".85"/>`
      + `<stop offset="100%" stop-color="${loc.tint}" stop-opacity="0"/></radialGradient>`;
    body += `<circle cx="${cx}" cy="${cy}" r="${R+44}" fill="url(#locglow)"/>`;
  }
  if (loc.terrain && TERRAIN_IMGS[loc.terrain]) {
    body += `<image x="${cx-R}" y="${cy-R}" width="${R*2}" height="${R*2}" `
      + `href="${TERRAIN_IMGS[loc.terrain]}" preserveAspectRatio="xMidYMid meet"/>`
      + `<text x="${cx}" y="${cy-R-8}" text-anchor="middle" fill="#5a4a2a" `
      + `font-family="ZoesHandwriting,cursive" font-size="13">${loc.terrain}</text>`;
  } else {
    body += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(200,196,180,.55)" stroke="#8a7a5a" stroke-width="1.5"/>`;
  }
  if (loc.feeling) {
    body += `<text x="${cx}" y="${cy+R+22}" text-anchor="middle" fill="#2a1e14" `
      + `font-family="ZoesHandwriting,cursive" font-size="17" font-weight="bold">${_escapeHtml(loc.feeling)}</text>`;
  }
  return `<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;"><defs>${defs}</defs>${body}</svg>`;
}

  const { data, error } = await sb.from('character_archetypes')
    .select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
  if (error) console.error('[archetypes] fetch failed:', error);
  renderArchetypePicker(data || []);
}

function renderArchetypePicker(archetypes) {
  if (currentStep !== 'character') return;
  const panel = document.getElementById('content-panel');
  const cards = archetypes.map(a => `
    <button class="arch-card" data-id="${a.id}" type="button">
      ${_buildCharStack(a)}
      <div class="arch-card-name">${_escapeHtml(a.name || 'unnamed')}</div>
    </button>`).join('');
  panel.innerHTML = `
    <div class="arch-picker">
      <div class="arch-picker-title">choose an archetype for today</div>
      <div class="arch-grid">
        ${cards}
        <button class="arch-card arch-card-new" id="arch-new-btn" type="button">
          <div class="arch-card-plus">+</div>
          <div class="arch-card-name">create new</div>
        </button>
      </div>
    </div>`;
  panel.querySelectorAll('.arch-card[data-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const a = archetypes.find(x => x.id === btn.dataset.id);
      if (a) useArchetype(a);
    });
  });
  document.getElementById('arch-new-btn').addEventListener('click', openCharacterBuilder);
}

async function useArchetype(archetype) {
  const charState = {
    name: archetype.name, body: archetype.body,
    hair: archetype.hair, eyes: archetype.eyes, mouth: archetype.mouth,
  };
  await saveCharacterAndAdvance(charState, { fork: false, archetypeId: archetype.id });
}

// Saves charState to daily_matrix and advances the flow. When fork is true
// (built fresh via the character builder), also adds it to the user's
// reusable cast — picking a saved archetype never touches that table again.
// archetypeId links the entry back to character_archetypes for the archive's
// per-archetype location history; forked entries get their id after insert.
async function saveCharacterAndAdvance(charState, { fork, archetypeId }) {
  // Build location_data from the dayquest — full snapshot so matrix/archive
  // can redraw without any other reference.
  const locationData = activeDayquest ? {
    name:    activeDayquest.name    || null,
    terrain: activeDayquest.terrain || null,
    feeling: activeDayquest.feeling || null,
    tint:    activeDayquest.tint    || null,
    cat:     activeDayquest.cat     || null,
  } : null;

  // New archetypes are inserted before the matrix row so the row can be
  // stamped with the real archetype_id in the same save.
  let finalArchetypeId = archetypeId || null;
  if (fork) {
    const { data: newArch, error: forkErr } = await sb.from('character_archetypes').insert({
      user_id: currentUser.id, name: charState.name || null,
      body: charState.body, hair: charState.hair,
      eyes: charState.eyes, mouth: charState.mouth,
    }).select().single();
    if (forkErr) console.error('[archetypes] save failed:', forkErr);
    else finalArchetypeId = newArch.id;
  }

  const { error } = await sb.from('daily_matrix').upsert({
    id: activeEntryId,
    user_id: currentUser.id,
    entry_date: activeEntryDate,
    location_data: locationData,
    character_data: charState,
    archetype_id: finalArchetypeId,
  }, { onConflict: 'id' });

  if (error) {
    console.error('[daily save]', error);
    showRoomStatus('save failed', '#E8478B');
    const btn = document.getElementById('save-continue-btn');
    if (btn) { btn.disabled = false; btn.innerHTML = 'continue →'; }
    return;
  }

  showRoomStatus('character saved ✓', '#6ab86a');
  setSaveBtnVisible(false);
  stepBingo();
}

// ── STEP 5: CHARACTER DONE → BINGO ───────────────────────
function stepBingo() {
  currentStep = 'bingo';
  setBubble('how full is your heart meter?', []);
  const src  = `../games/bingo.html?game_id=${activeEntryId}&phase=${activePhase}&loop=true&mode=cloud`;
  showIframe(src, 'how are you feeling today?');
  setSaveBtnVisible(true, 'continue →');
}

// ── STEP 6: BINGO DONE → JOURNAL (native, no iframe) ─────
function stepJournal() {
  currentStep = 'journal';
  clearTimeout(window._saveFallback);
  setBubble('write your daily notes', []);
  showPanel(buildJournalPanel());
  loadJournalEntries();
  setSaveBtnVisible(true, 'continue →');
  // Plain Enter = newline (journaling, not quick chat); Cmd/Ctrl+Enter sends.
  const msgEl = document.getElementById('jrc-msg');
  if (msgEl) msgEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendJournalMessage(); }
  });
}

function skipJournal() {
  hidePanel();
  setSaveBtnVisible(false);
  stepDone();
}

// Continue pressed. Messages persist on every send, so the only thing left to
// handle is text/photo the user typed but never sent. "Warn, let me choose":
// reveal a confirm row and don't advance until they pick.
async function saveJournalEntry() {
  const msgEl = document.getElementById('jrc-msg');
  const hasUnsent = !!(msgEl && msgEl.value.trim());
  if (hasUnsent) {
    document.getElementById('jrc-confirm')?.classList.add('open');
    showJournalStatus('you have unsent notes', false);
    setSaveBtnVisible(true, 'continue →');   // un-stick the bar from "saving..."
    return;
  }
  finishJournal();
}

function finishJournal() {
  document.getElementById('jrc-confirm')?.classList.remove('open');
  setSaveBtnVisible(false);
  stepDone();
}

async function confirmSendAndContinue() {
  const ok = await sendJournalMessage();
  if (ok) finishJournal();
}
function confirmSkipUnsent() {
  const msgEl = document.getElementById('jrc-msg');
  if (msgEl) msgEl.value = '';
  finishJournal();
}

// ── NATIVE JOURNAL (chat-style) ──────────────────────────
// Each send appends a message to saved_data.journal_messages (jsonb) on this
// playthrough's row. Photo'd messages also push into matrix_images
// (source:'journal') so matrix quadrant placement is untouched.
const journal = { entries: [] };

function buildJournalPanel(){
  return `<div class="step-panel jrc-panel">
    <div class="jrc-window">
      <div class="jrc-titlebar">chat with past<span class="jrc-date" id="jrc-date"></span></div>
      <div style="padding:6px 16px 8px;font-family:var(--font-hand);font-size:clamp(11px,1.1vw,13px);color:#8a7a5a;border-bottom:1px solid #ddd;">what do you want to remember from today?</div>
      <div class="jrc-messages" id="jrc-messages">
        <div class="jrc-empty" id="jrc-empty">Write today down.<br>A park you passed through, a flower you appreciated, a matcha that hit the spot, a thought you don't want to lose.<br>What do you want to remember?</div>
      </div>
      <div class="jrc-input-area">

          <button class="jrc-confirm-skip" onclick="confirmSkipUnsent()">continue without them →</button>
        </div>

}

function jrcEscape(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function jrcTime(iso){ return new Date(iso||Date.now()).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function jrcDay(iso){ return new Date(iso||Date.now()).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }

function jrcRowMessages(row){
  const arr = Array.isArray(row?.journal_messages) ? row.journal_messages : [];
  return arr.slice().sort((a,b)=> new Date(a.created_at||0) - new Date(b.created_at||0));
}

function buildAvatar(charData){
  if (!charData) return '<div class="jrc-avatar"></div>';
  const layers = ['body','eyes','mouth','hair'];
  const imgs = layers.map(k => charData[k] && CHAR_FULL_ASSETS[charData[k]]
    ? `<img src="${CHAR_FULL_ASSETS[charData[k]]}" alt="">`
    : '').join('');
  return `<div class="jrc-avatar">${imgs}</div>`;
}

function renderJournalMessage(msg, side, charData){
  const wrap = document.createElement('div');
  wrap.className = 'jrc-msg-wrap ' + (side === 'right' ? 'right' : 'left');
  if (msg.id) wrap.dataset.id = msg.id;
  const img = msg.image_url ? `<img src="${jrcEscape(msg.image_url)}" alt="" onerror="this.style.display='none'">` : '';
  const txt = msg.text ? `<span class="jrc-bubble-txt">${jrcEscape(msg.text)}</span>` : '';
  const avatar = buildAvatar(charData);
  wrap.innerHTML = `${avatar}<div class="jrc-msg"><div class="jrc-bubble">${img}${txt}</div><div class="jrc-meta">${jrcTime(msg.created_at)}</div></div>`;
  return wrap;
}

function jrcScrollBottom(){
  const c = document.getElementById('jrc-messages');
  if (c) c.scrollTop = c.scrollHeight;
}

function jrcMaybeDivider(container, dayLabel, location){
  const last = [...container.querySelectorAll('.jrc-date-divider span')].pop();
  if (last && last.textContent === dayLabel) return;
  const div = document.createElement('div');
  div.className = 'jrc-date-divider';
  const locHtml = location ? `<span class="divider-location">${jrcEscape(location)}</span> · ` : '';
  div.innerHTML = `${locHtml}<span>${dayLabel}</span>`;
  container.appendChild(div);
}

async function loadJournalEntries(){
  journal.entries = [];
  const dateEl = document.getElementById('jrc-date');
  if (dateEl) dateEl.textContent = jrcDay();
  if (!currentUser) return;

  let rows = [];
  try {
    const { data } = await sb.from('daily_matrix')
      .select('id, journal_messages, created_at, character_data, location_data')
      .eq('user_id', currentUser.id)
      .order('created_at',{ ascending:true }).limit(60);
    rows = data || [];
  } catch(e){ console.error('[journal load]', e); }

  rows = rows.filter(r => r.id === activeEntryId || jrcRowMessages(r).length);
  journal.entries = rows;

  const container = document.getElementById('jrc-messages');
  const empty = document.getElementById('jrc-empty');
  if (!container) return;
  container.querySelectorAll('.jrc-msg-wrap, .jrc-date-divider').forEach(e=>e.remove());

  let anyMsg = false;
  rows.forEach((row, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    const charData = row.character_data || null;
    const _ld = row.location_data || {};
    const location = (_ld.terrain && _ld.feeling) ? `${_ld.terrain} of ${_ld.feeling}` : (_ld.terrain || _ld.feeling || '');
    jrcRowMessages(row).forEach(msg => {
      jrcMaybeDivider(container, jrcDay(msg.created_at || row.created_at), location);
      container.appendChild(renderJournalMessage(msg, side, charData));
      anyMsg = true;
    });
  });
  if (empty) empty.style.display = anyMsg ? 'none' : 'block';
  jrcScrollBottom();
}

// (journal photo helpers removed — text-only)

// Append one message to today's daily_matrix row. Returns true on success.
async function sendJournalMessage(){
  const msgEl   = document.getElementById('jrc-msg');
  const sendBtn = document.getElementById('jrc-send');
  const text = (msgEl?.value || '').trim();
  if (!text) return false;                                   // nothing to send
  if (!(currentUser && activeEntryId)){ showJournalStatus('not signed in', false); return false; }

  if (sendBtn) sendBtn.disabled = true;

  const message = { id: crypto.randomUUID(), text, created_at: new Date().toISOString() };

  // 1) read current row, append
  let row = {};
  try {
    const { data } = await sb.from('daily_matrix')
      .select('journal_messages').eq('id', activeEntryId).maybeSingle();
    row = data || {};
  } catch(e){}
  const messages = (Array.isArray(row.journal_messages) ? row.journal_messages : []).concat([message]);

  // 2) write
  try {
    const { error } = await sb.from('daily_matrix').upsert({
      id: activeEntryId, user_id: currentUser.id, entry_date: activeEntryDate,
      journal_messages: messages,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'id' });
    if (error) throw error;
  } catch(err){
    console.error('[journal send] failed:', err);
    showJournalStatus('something went wrong — try again', false);
    if (sendBtn) sendBtn.disabled = false;
    return false;
  }

  // 3) reflect in the scroll
  const container = document.getElementById('jrc-messages');
  const empty = document.getElementById('jrc-empty');
  if (empty) empty.style.display = 'none';
  const _rowIdx = journal.entries.findIndex(r => r.id === activeEntryId);
  const _side = _rowIdx % 2 === 0 ? 'left' : 'right';
  const _activeRow = journal.entries[_rowIdx] || {};
  const _ld = _activeRow.location_data || {};
  const _loc = (_ld.terrain && _ld.feeling) ? `${_ld.terrain} of ${_ld.feeling}` : (_ld.terrain || _ld.feeling || '');
  jrcMaybeDivider(container, jrcDay(message.created_at), _loc);
  container.appendChild(renderJournalMessage(message, _side, _activeRow.character_data || null));

  if (msgEl) msgEl.value = '';
  document.getElementById('jrc-confirm')?.classList.remove('open');
  if (sendBtn) sendBtn.disabled = false;
  showJournalStatus('saved ✓', true);
  jrcScrollBottom();
  if (msgEl) msgEl.focus();
  return true;
}

function showJournalStatus(msg, ok){
  const el = document.getElementById('jrc-status');
  if (!el) return;
  el.textContent = msg;
  el.classList.remove('ok','err');
  el.classList.add(ok ? 'ok' : 'err');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent=''; el.classList.remove('ok','err'); }, 2600);
}

// ── STEP 7: DONE ──────────────────────────────────────────
// ── DAILY MATRIX ─────────────────────────────────────
// Deterministic string-seeded RNG so a given day always scatters the same way.
function _seedRand(str){
  let h = 1779033703 ^ (str ? str.length : 0);
  for (let i=0; i<(str||'').length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h<<13)|(h>>>19); }
  let s = h>>>0;
  return function(){ s = Math.imul(s ^ (s>>>15), 2246822507); s = Math.imul(s ^ (s>>>13), 3266489909); s ^= s>>>16; return (s>>>0)/4294967296; };
}
function _escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _firstWords(t,n){ if(!t) return ''; const w=t.trim().split(/\s+/); return w.slice(0,n).join(' ') + (w.length>n ? '…' : ''); }
// Full-canvas character PNGs (777×1155, transparent padding so layers align).
// Mirrors FULL_ASSETS in infinity-mirror.html — keep in sync if those assets change.
const CHAR_FULL_ASSETS = {
  body_red:    "../assets/characters-full/01.01-RED_BODY.png",
  body_orange: "../assets/characters-full/02.01-ORANGE_BODY.png",
  body_yellow: "../assets/characters-full/03.01-YELLOW_BODY.png",

  eyes_open:       "../assets/characters-full/01.02-OPEN_EYES.png",

function _buildCharStack(charState){
  if(!charState) return '';
  // Saved state stores bare IDs (e.g. "body_pink"); resolve each to its full-canvas PNG.
  // A value already containing "/" is treated as a ready URL (forward-compatible).
  const resolve = v => !v ? null
    : (typeof v === 'string' && v.includes('/') ? v : (CHAR_FULL_ASSETS[v] || null));
  // Same back→front order as the mirror: body, hair, eyes, mouth.
  const layers = [
    charState.body,
    charState.hair,
    charState.eyes,
    charState.mouth,
  ].map(resolve).filter(Boolean);
  if(!layers.length) return '';
  return `<div class="adv-char-stack">${layers.map(s=>`<img src="${s}" alt="" onerror="this.style.display='none'">`).join('')}</div>`;
}

// PORTABLE: give it a day's data + a stable seed string, get matrix HTML back.
// data = { dateLabel, mapName, mapType, zones, bingoScore(0-24), charState,
//          journalText, journalImages[], archiveHref }
// Quadrant geometry for photo placement (matrix %). Each quadrant lays photos
// on a 2-col grid that grows inward from the matrix's outer corner, so photos
// cluster in their quadrant without their bodies overlapping each other.
const QUADRANTS = {
  'external-action':  { x0:13, y0:17, dx:+1 },  // top-left  (map)
  'external-feeling': { x0:87, y0:17, dx:-1 },  // top-right (character)
  'internal-action':  { x0:13, y0:61, dx:+1 },  // bottom-left (heart)
  'internal-feeling': { x0:87, y0:61, dx:-1 },  // bottom-right (journal)
};
const PHOTO_COLS = 2, PHOTO_COL_GAP = 17, PHOTO_ROW_GAP = 16;
function photoSlot(quadrant, n){
  const q = QUADRANTS[quadrant] || QUADRANTS['internal-feeling'];
  const col = n % PHOTO_COLS, row = Math.floor(n / PHOTO_COLS);
  return { left: q.x0 + q.dx * col * PHOTO_COL_GAP, top: q.y0 + row * PHOTO_ROW_GAP };
}

function buildDailyMatrix(data, seedStr){
  const rnd = _seedRand(seedStr || 'matrix');
  const jit = r => (rnd()*2-1)*r;            // ± r
  const rot = r => ((rnd()*2-1)*r).toFixed(1);
  const pct = (a,b) => (a + rnd()*(b-a)).toFixed(1);

  // MAP → top-left quadrant (external + action)
  // Show ONLY the day's chosen destination from location_data,
  // not the entire map.
  const dayLoc = data.locationData || {};
  const mapCap = data.locationData?.name || data.mapName || 'my map';
  const mapItem = `<div class="adv-item adv-map" style="left:${(27+jit(2)).toFixed(1)}%;top:${(30+jit(2)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(3)}deg);">
      <div class="adv-map-svg">${buildSingleLocationSVG(dayLoc)}</div>
      <div class="adv-cap">${_escapeHtml(mapCap)}</div></div>`;

  // BINGO (heart meter) → bottom-left quadrant (internal + action)
  const meterPct = Math.round(((data.bingoScore||0)/24)*100);
  const mode = (data.bingoScore||0)<=9 ? 'hard mode' : (data.bingoScore||0)<=19 ? 'medium mode' : 'easy mode';
  const bingoItem = `<div class="adv-item adv-bingo" style="left:${(27+jit(2)).toFixed(1)}%;top:${(71+jit(2)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(3)}deg);">
      <div class="adv-cap">heart meter</div>
      <div class="adv-meter"><div class="adv-meter-fill" style="width:${meterPct}%"></div></div>
      <div class="adv-mode">${mode}</div></div>`;

  // CHARACTER / infinity mirror → top-right quadrant (external + feeling)
  const charStack = _buildCharStack(data.charState);
  const charItem = charStack ? `<div class="adv-item adv-char" style="left:${(73+jit(2)).toFixed(1)}%;top:${(30+jit(2)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(3)}deg);">${charStack}</div>` : '';

  // NOTES (journal) → bottom-right quadrant (internal + feeling)
  const preview = _firstWords(data.journalText, 10);
  const journalItem = preview ? `<div class="adv-item adv-journal" style="left:${(73+jit(2)).toFixed(1)}%;top:${(71+jit(2)).toFixed(1)}%;transform:translate(-50%,-50%) rotate(${rot(3)}deg);">
      <div class="adv-journal-text">${_escapeHtml(preview)}</div></div>` : '';

  return `<div class="step-panel matrix-panel">
    <div class="matrix-header">
      <div class="matrix-date">${_escapeHtml(data.dateLabel||'')}</div>
    </div>
    <div class="matrix-frame">
      <div class="adv-matrix">
        <div class="adv-grid"></div>
        <div class="adv-axis adv-axis-x"></div>
        <div class="adv-axis adv-axis-y"></div>
        <div class="adv-axlbl" style="left:50%;top:3.5%;transform:translate(-50%,-50%) translateZ(0);">external</div>
        <div class="adv-axlbl" style="left:96.5%;top:50%;transform:translate(-50%,-50%) translateZ(0);writing-mode:vertical-rl;">feeling</div>
        <div class="adv-axlbl" style="left:50%;top:96.5%;transform:translate(-50%,-50%) translateZ(0);">internal</div>
        <div class="adv-axlbl" style="left:3.5%;top:50%;transform:translate(-50%,-50%) rotate(180deg);writing-mode:vertical-rl;">action</div>
        ${mapItem}${bingoItem}${charItem}${journalItem}
      </div>
    </div>
  </div>`;
}

// Assemble a day's saved data from daily_matrix by its row id.
async function assembleTodayMatrixData(entryId){
  const d = {
    dateLabel: new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),
    mapName: 'today',
    locationData: null,                          // {name,terrain,feeling,tint,cat} of today's place
    bingoScore: 0, charState: null, journalText: '', matrixImages: [],
  };
  try {
    const { data: row } = await sb.from('daily_matrix').select('*')
      .eq('id', entryId).eq('user_id', currentUser.id).maybeSingle();
    if (row){
      d.charState    = row.character_data || null;
      d.bingoScore   = row.bingo_data?.score || 0;
      d.locationData = row.location_data || null;
      d.journalText  = (Array.isArray(row.journal_messages)
        ? row.journal_messages.map(m => m && m.text).filter(Boolean).join(' ')
        : '');
      if (row.entry_date){
        // Render the matrix under the day it was actually saved (local-safe).
        const [y,m,dd] = String(row.entry_date).split('-').map(Number);
        if (y && m && dd) d.dateLabel = new Date(y, m-1, dd)
          .toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
      }
    }
  } catch(e){}
  return d;
}

async function stepDone() {
  currentStep = 'done';
  setBubble("see you tomorrow!");
  showPanel('<div class="step-panel matrix-panel"><div class="matrix-date" style="position:static;margin-top:40px;text-align:center;">gathering your day…</div></div>');
  _matrixSeed = activeEntryId;
  await renderMatrix(true);
}

// Re-assemble + redraw the matrix in place.
let _matrixSeed = 'matrix';
async function renderMatrix(seeYouTomorrow) {
  const data = await assembleTodayMatrixData(activeEntryId);
  if (seeYouTomorrow) data.seeYouTomorrow = true;
  showPanel(buildDailyMatrix(data, _matrixSeed));
}

// ── POSTMESSAGE FROM IFRAMES ──────────────────────────────
window.addEventListener('message', async e => {
  const msg = e.data || {};
  if (!msg.type) return;

  // ── iframe signalled it's loaded and ready ───────────────
  if (msg.type === 'iframe_ready' && msg.game === 'character') {
    const btn = document.getElementById('save-continue-btn');
    if (btn && currentStep === 'character') {
      btn.disabled = false;
      btn.innerHTML = 'continue →';
    }
    return;
  }

  // ── Character state received — save to saved_data ───
  if (msg.type === 'char_state') {
    const charState = msg.state || {};
    if (!charState.body) {
      showRoomStatus('pick a body first!', '#E8478B');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'continue →';
      return;
    }
    if (!charState.name || !charState.name.trim()) {
      showRoomStatus('name this archetype first!', '#E8478B');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'continue →';
      return;
    }
    await saveCharacterAndAdvance(charState, { fork: true });
    return;
  }

  // ── Bingo state received — save to saved_data ───────
  if (msg.type === 'bingo_state') {
    const { marked: markedArr, score } = msg;
    if (!score || score === 0) {
      showRoomStatus('check some squares first!', '#E8478B');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'continue →';
      return;
    }
    const energyScore  = Math.round((score / 24) * 100);
    const bingoPayload = { marked: markedArr, score };

    const { error } = await sb.from('daily_matrix').upsert({
      id: activeEntryId,
      user_id: currentUser.id,
      entry_date: activeEntryDate,
      bingo_data: bingoPayload, energy_score: energyScore,
    }, { onConflict: 'id' });

    if (!error) {
      showRoomStatus('all saved ✓', '#6ab86a');
      setSaveBtnVisible(false);
      stepJournal();
    } else {
      showRoomStatus('save failed', '#E8478B');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'continue →';
    }
    return;
  }

});


// ── DAYQUEST BUILDER ─────────────────────────────────────
let dqDraft = { name:'', terrain:null, feeling:null, tint:null, cat:null };

function buildDayquestPalette() {
  // terrain thumbnails
  const pal = document.getElementById('dq-palette');
  pal.innerHTML = TERRAIN_ORDER.map(id => `
    <div class="dq-terrain" id="dq-terrain-${id}" onclick="dayquestPickTerrain('${id}')">
      <img src="${TERRAIN_IMGS[id]}" alt="${id}">
      <span>${id}</span>
    </div>`).join('');
  // climate groups with feeling chips
  const cl = document.getElementById('dq-climates');
  cl.innerHTML = WEATHER_CATS.map(cat => `
    <div class="dq-climate ${cat.id}">
      <div class="dq-climate-head">${cat.label}</div>
      <div class="dq-chips">
        ${cat.feelings.map(f => `<span class="dq-chip" id="dq-chip-${f}"
            onclick="dayquestPickFeeling('${f}','${cat.id}','${cat.tint}')">${f}</span>`).join('')}
      </div>
    </div>`).join('');
}

function openDayquestBuilder() {
  dqDraft = { name:'', terrain:null, feeling:null, tint:null, cat:null };
  document.querySelectorAll('.dq-terrain.active, .dq-chip.active')
    .forEach(el => el.classList.remove('active'));
  renderDayquestPreview();
  document.getElementById('dq-confirm').disabled = true;
  document.getElementById('dq-overlay').classList.add('open');
}
function closeDayquestBuilder() {
  document.getElementById('dq-overlay').classList.remove('open');
}
// Daily tracker step one uses this same builder under a friendlier name.
const openLocationBuilder = openDayquestBuilder;

function dayquestPickTerrain(id) {
  dqDraft.terrain = id;
  document.querySelectorAll('.dq-terrain').forEach(el => el.classList.remove('active'));
  document.getElementById(`dq-terrain-${id}`)?.classList.add('active');
  renderDayquestPreview();
  refreshDayquestConfirm();
}
function dayquestPickFeeling(feeling, cat, tint) {
  dqDraft.feeling = feeling; dqDraft.cat = cat; dqDraft.tint = tint;
  document.querySelectorAll('.dq-chip').forEach(el => el.classList.remove('active'));
  document.getElementById(`dq-chip-${feeling}`)?.classList.add('active');
  renderDayquestPreview();
  refreshDayquestConfirm();
}
function refreshDayquestConfirm() {
  // terrain + feeling required; name optional
  document.getElementById('dq-confirm').disabled = !(dqDraft.terrain && dqDraft.feeling);
}

// One centered destination — terrain image + tint glow + feeling label
function renderDayquestPreview() {
  const R = 50, cx = 150, cy = 110;
  let defs = '', body = '';
  if (dqDraft.tint) {
    defs += `<radialGradient id="sqtint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${dqDraft.tint}" stop-opacity="1"/>
      <stop offset="55%" stop-color="${dqDraft.tint}" stop-opacity=".85"/>
      <stop offset="100%" stop-color="${dqDraft.tint}" stop-opacity="0"/></radialGradient>`;
    body += `<circle cx="${cx}" cy="${cy}" r="${R+40}" fill="url(#sqtint)"/>`;
  }
  if (dqDraft.terrain && TERRAIN_IMGS[dqDraft.terrain]) {
    body += `<image x="${cx-R}" y="${cy-R}" width="${R*2}" height="${R*2}"
      href="${TERRAIN_IMGS[dqDraft.terrain]}" preserveAspectRatio="xMidYMid meet"/>
      <text x="${cx}" y="${cy-R-8}" text-anchor="middle" fill="#5a4a2a"
        font-family="ZoesHandwriting,cursive" font-size="13">${dqDraft.terrain}</text>`;
  } else {
    body += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(200,196,180,.5)"
      stroke="#8a7a5a" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#8a7a5a"
        font-family="ZoesHandwriting,cursive" font-size="13">pick a place</text>`;
  }
  if (dqDraft.feeling) {
    body += `<text x="${cx}" y="${cy+R+22}" text-anchor="middle" fill="#2a1e14"
      font-family="ZoesHandwriting,cursive" font-size="16" font-weight="bold">${dqDraft.feeling}</text>`;
  }
  document.getElementById('dq-map-frame').innerHTML =
    `<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}</svg>`;
}

function confirmDayquest() {
  if (!(dqDraft.terrain && dqDraft.feeling)) return;
  activeDayquest = {
    name:    'today',
    terrain: dqDraft.terrain,
    feeling: dqDraft.feeling,
    tint:    dqDraft.tint,
    cat:     dqDraft.cat,
  };
  activePhase = 'dayquest';
  closeDayquestBuilder();
  stepBegin();   // mints the entry id and continues into character → bingo → journal
}

// ── INIT ──────────────────────────────────────────────────
async function init() {
  buildDayquestPalette();
  if (_storedRaw?.user) {
    currentUser = _storedRaw.user;
    sb.from('user-profiles').select('username').eq('id', currentUser.id).single()
      .then(({ data: p }) => updateGearMenu(p?.username || currentUser.email))
      .catch(() => updateGearMenu(currentUser.email));
    startToday();
  } else {
    setBubble('log in to begin');
    showLoginModal();
  }
}

init();
