<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/elements/favicon.png">
<link rel="stylesheet" href="../assets/css/modal.css">
<script src="../assets/js/modal.js" defer></script>
<script src="../assets/js/treasure-map.js"></script>
<link rel="stylesheet" href="../assets/css/nav.css">
<title>Daily Matrix — Heartability</title>
<meta name="description" content="Track how today felt with Heartability's Daily Matrix — pick an archetype, build your emotional climate, and log any important occurrences or helpful tools.">
<meta property="og:image" content="https://heartability-games.vercel.app/assets/social-preview-v2.png">
<style>
@font-face { font-family:"ZoesHandwriting"; src:url("../assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype"); }
@font-face { font-family:"PFPixelscript";  src:url("../assets/fonts/PFPixelscriptProRegular.ttf") format("truetype"); }
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --font-hand:  "ZoesHandwriting", cursive;
  --font-pixel: "PFPixelscript", cursive;
  --font-game:  "VT323", monospace;
  --back-wall:  #f1ebe4;
  --line-col:   #111;
  --blue:       #6e83d3;
  --aqua:       #83d2e6;
  --ink:        #000f5a;
  --cream:      #cdd3ec;
  --bw-top:    9%;  --bw-left:  15%;
  --bw-width: 70%;  --bw-height:70%;
}

html, body { width:100vw; height:100dvh; overflow-x:hidden; overflow-y:auto; user-select:none;
  background:url("../assets/elements/matrix-daily.png") center / cover no-repeat fixed;
  font-family:var(--font-hand); color:var(--ink); }

/* ── PANEL SCROLL REGION — no-op by default (just a plain wrapper); becomes
   the scroll container for iframe-mode steps on mobile, see the max-width:
   768px block. ── */
.panel-scroll-region { display:contents; }

/* ── CONTENT PANEL — sits where back wall was ── */
.content-panel { position:fixed; top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height); z-index:10; display:none;
  flex-direction:column; overflow:hidden; }
.content-panel.active { display:flex; }
.content-panel.active:not(.iframe-mode) { background:transparent; border:none; box-shadow:none; }

/* ── IFRAME PANEL — anchored near the top like every other step, just wider
   than the back-wall proportions so builder UIs have room to breathe. Unlike
   other steps it isn't fixed to the viewport: it sits in normal document
   flow, so if its content runs taller than the screen, the whole page grows
   and scrolls with it (via html/body's overflow-y) instead of clipping into
   its own internal scrollbar — and #save-continue-bar, which follows right
   after it in the DOM, trails along below instead of floating fixed on top
   of it. ── */
.game-iframe { width:100%; height:70vh; border:none; display:block; flex-shrink:0; }
.content-panel.iframe-mode {
  border:none; box-shadow:none; background:transparent;
  position:relative; top:auto; left:auto;
  width:min(1050px, 94vw); height:auto;
  margin:var(--bw-top) auto 0;
  overflow:visible;
}
.iframe-prompt {
  flex-shrink:0; padding:10px 18px 8px;
  border-bottom:1px solid #6e83d3;
  font-family:var(--font-hand);
}
.iframe-prompt-title { font-size: 35px; color:#000; }
.iframe-prompt-sub   { font-size: 17px; color:#000; margin-top:2px; }

/* ── STEP PANELS (map grid, phase select) ── */
.step-panel {
  width:100%; height:100%;
  display:flex; flex-direction:column;
  align-items: center; justify-content: center;
  overflow-y: auto; padding:20px;
  font-family:var(--font-hand);
}
.step-header {
  width: 100%;
}

/* Step header bar */
.step-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; flex-shrink:0;
}
.step-header-title { font-size:25px; color:#3a4aaa; }
.step-back {
  font-size:16px; color:var(--blue); cursor:pointer;
}
.step-back:hover { text-decoration:underline; }

/* Loading state */
.loading-msg { font-family:var(--font-hand); font-size:17px; color:#aaa; text-align:center; padding:40px; }

/* ── NAV BAR ── */
.room-nav {
  position:fixed; top:0; left:0; right:0; height:44px;
  background:#6e83d3; border-bottom:2px solid var(--line-col);
  z-index:200; display:flex; align-items:center;
  justify-content:space-between; padding:0 clamp(12px,2vw,28px);
  font-family:var(--font-hand); font-size:clamp(21px,1.6vw,25px); color:#fff;
}
.nav-title { position:absolute; left:50%; transform:translateX(-50%); pointer-events:none; white-space:nowrap; margin:0; font:inherit; }
.nav-btn { cursor:pointer; padding:4px 8px; border-radius:2px; transition:background .15s; color:inherit; text-decoration:none; }
.nav-btn:hover { background:rgba(0,0,0,.08); }

/* ── MATRIX PAGE TOGGLE — switches between daily/dream/cosmic ── */
.matrix-toggle {
  position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  z-index:210; display:flex; gap:clamp(24px,4vw,48px);
}
.matrix-toggle-link {
  font-family:var(--font-hand); font-size:clamp(19px,2.2vw,26px);
  color:#fff; text-decoration:none; padding-bottom:2px;
  border-bottom:2px solid transparent;
}
.matrix-toggle-link:hover { opacity:.8; }
.matrix-toggle-link.active { border-bottom-color:#fff; }

/* ── WALL BUTTONS — centered on the back wall ── */
.wall-btns {
  position:fixed;
  top:var(--bw-top); left:var(--bw-left);
  width:var(--bw-width); height:var(--bw-height);
  z-index:8;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  pointer-events:none;
}
.wall-btns.active { display:flex; }
.wall-btn {
  pointer-events:all;
  padding:14px 40px;
  background:var(--blue);
  border:2px solid #4a5bc4; box-shadow:3px 3px 0 #3a4aaa;
  font-family:var(--font-hand); font-size:clamp(17px,1.8vw,23px); color:#fff;
  cursor:pointer; transition:all .05s; min-width:220px; text-align:center;
}
.wall-btn:hover { background:#4a5bc4; }
.wall-btn:active { box-shadow:none; transform:translate(3px,3px); }
.wall-btn.secondary {
  background:none; border-color:#ccc; color:#999; box-shadow:none;
}
.wall-btn.secondary:hover { border-color:var(--blue); color:var(--blue); }

/* ── SAVE & CONTINUE BUTTON — floats below back wall ── */
.save-continue-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(21% - 44px); /* floor area below back wall */
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 15;
  pointer-events: none;
}
.save-continue-bar.visible { display: flex; }

.save-continue-btn {
  pointer-events: all;
  padding: 14px 40px;
  background: var(--blue);
  border: 2px solid #4a5bc4;
  box-shadow: 3px 3px 0 #3a4aaa;
  font-family: var(--font-hand);
  font-size: clamp(17px, 1.8vw, 23px);
  color: #fff;
  cursor: pointer;
  transition: all .05s;
  letter-spacing: .3px;
}
.save-continue-btn:hover { background: #4a5bc4; }
.save-continue-btn:active { box-shadow: none; transform: translate(3px, 3px); }
.save-continue-btn:disabled {
  opacity: .38; cursor: not-allowed;
  transform: none !important; box-shadow: 3px 3px 0 #3a4aaa;
}

/* ── QUADRANT POPUP — reuses the site-standard modal shell (modal.css's
   .hg-modal-overlay/.hg-modal/.hg-modal-titlebar/.hg-modal-close), just
   wider (game content, not a small alert) and with a scrollable body. The
   matrix canvas (#matrix-panel-host) stays visible/dimmed behind it. ── */
.quad-popup-window {
  width: min(1050px, 94vw); max-height: calc(100vh - 84px);
  display: flex; flex-direction: column;
}
.quad-popup-window .hg-modal-body {
  flex: 1; min-height: 0; padding: 0; display: flex; flex-direction: column;
}
/* display:flex (not the base .panel-scroll-region's display:contents) so
   this actually generates a box that can scroll. */
.quad-popup-window .panel-scroll-region {
  display: flex; flex-direction: column;
  flex: 1; min-height: 0; overflow-y: auto; padding: 20px;
}
.quad-popup-window .content-panel {
  /* Base .content-panel has overflow:hidden, which makes a flex item's
     automatic min-height resolve to 0 (spec: auto min-size is 0 when
     overflow isn't visible) — without flex-shrink:0 the flex algorithm
     would happily crush this down to fit the popup instead of letting
     panel-scroll-region's overflow-y:auto scroll to it. .content-panel.
     iframe-mode also brings its own `margin: var(--bw-top) auto 0` (a
     leftover from the old full-page back-wall layout, where it pushed the
     panel down below the fixed nav) — reset it to 0 here. */
  position: static; width: 100%; height: auto; display: flex; flex-shrink: 0;
  overflow: visible; margin: 0;
}
.quad-popup-window .save-continue-bar {
  position: static; height: auto; padding: 14px 0 4px; z-index: auto; flex-shrink: 0;
}
/* Native (non-iframe) panels — inventory, journal — brought their own
   bordered/shadowed card + inner titlebar, designed to stand alone on the
   old full back-wall panel. Inside the popup that reads as a box nested in
   a box, so strip their outer framing and hide their duplicate inner
   titlebar text (the popup's own .hg-modal-titlebar now carries the
   heading instead). */
.quad-popup-window .lib-window {
  width: 100%; height: 100%; max-width: none; max-height: none; box-shadow: none; border: none;
}
.quad-popup-window .lib-titlebar { display: none; }
/* Journal panel brings its own bordered/shadowed card too — same "box
   nested in a box" fix as .lib-window above. */
.quad-popup-window .jrc-window {
  width: 100%; height: 100%; max-width: none; max-height: none; box-shadow: none; border: none;
}

/* dq-overlay (the location/dayquest builder) stays its own independent
   top-level modal — not nested inside the quad-popup shell — since it's
   not nested inside anything else, its own bordered card is fine as-is. */
.dq-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.dq-title { font-size:clamp(22px,2.2vw,30px); color:#3a4aaa; font-family:var(--font-hand); }
.dq-title-row .dq-close { margin:0; }

.save-status-bar {
  position: fixed;
  bottom: 8px; left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-hand);
  font-size: 16px;
  color: #6ab86a;
  z-index: 16;
  pointer-events: none;
}

/* ── MOBILE ── */
@media (max-width:768px) {
  :root {
    --bw-top:    44px;
    --bw-left:   0%;
    --bw-width:  100%;
    --bw-height: calc(100dvh - 44px);
  }
  .content-panel.active:not(.iframe-mode) { border:none; box-shadow:none; }
  .matrix-toggle { gap:16px; bottom:8px; }
  .journal-wall-overlay {
    top: 80px !important;
    left: 16px !important;
    right: 16px !important;
    width: auto !important;
    height: auto !important;
    bottom: 80px !important;
    border-radius: 4px !important;
  }
}

/* ── MOBILE PHASE SELECT ── */
.login-modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5);
  z-index:300; display:none; align-items:center; justify-content:center;
}
.login-modal-overlay.open { display:flex; }
.login-modal-window {
  width:min(92vw,440px); background:#dfe2ef;
  box-shadow:0 0 0 4px var(--blue), 6px 10px 40px rgba(0,0,0,.35);
  overflow:hidden;
}
.login-modal-titlebar {
  height:38px; background:#cdd3ec; border-bottom:2px solid var(--blue);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; font-family:var(--font-hand); font-size:var(--modal-font-title,21px); color:#555;
}
.login-modal-close {
  cursor:pointer; font-size:23px; color:#bbb; padding:2px 4px; transition:color .15s;
}
.login-modal-close:hover { color:#444; }

/* Login form tabs */
.lm-tab-row {
  display:flex; border-bottom:2px solid var(--blue); background:#cdd3ec;
}
.lm-tab {
  flex:1; padding:10px; font-family:var(--font-hand); font-size:21px;
  text-align:center; cursor:pointer; color:#888; background:none; border:none;
  border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .15s;
}
.lm-tab.active { color:var(--blue); border-bottom-color:var(--blue); }

/* Login form body */
.lm-body { padding:20px 24px 16px; display:flex; flex-direction:column; gap:12px; }
.lm-form { display:none; flex-direction:column; gap:12px; }
.lm-form.active { display:flex; }
.lm-field { display:flex; flex-direction:column; gap:4px; }
.lm-label { font-family:var(--font-hand); font-size:17px; color:#888; }
.lm-input {
  font-family:var(--font-hand); font-size:var(--modal-font-body,19px); color:#222; background:#fff;
  border:1.5px solid var(--blue); padding:8px 12px; outline:none; transition:border-color .15s;
  user-select:text;
}
.lm-input:focus { border-color:var(--blue); }
.lm-btn {
  padding:10px 18px; background:var(--blue); border:2px solid #4a5bc4;
  box-shadow:2px 2px 0 #3a4aaa; font-family:var(--font-hand); font-size:21px;
  color:#fff; cursor:pointer; transition:all .05s; margin-top:4px;
}
.lm-btn:hover { background:#4a5bc4; }
.lm-btn:active { box-shadow:none; transform:translate(2px,2px); }
.lm-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.lm-msg { font-family:var(--font-hand); font-size:17px; padding:6px 10px; display:none; }
.lm-msg.error   { display:block; color:#c0392b; background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.2); }
.lm-msg.success { display:block; color:#2d7a4f; background:rgba(45,122,79,.08); border:1px solid rgba(45,122,79,.2); }
.lm-footer { text-align:center; padding:0 24px 14px; font-family:var(--font-hand); font-size:13px; color:#aaa; }

/* ── JOURNAL WINDOW on back wall ── */
.journal-wall-overlay {
  position:fixed;
  top:calc(var(--bw-top) + 4%); left:calc(var(--bw-left) + 5%);
  width:calc(var(--bw-width) - 10%); height:calc(var(--bw-height) - 8%);
  z-index:20; display:none; flex-direction:column;
  box-shadow:0 0 0 4px var(--blue), 4px 8px 24px rgba(0,0,0,.25);
  background:#cdd3ec; border-radius:2px; overflow:hidden;
}
.journal-wall-overlay.open { display:flex; }

/* ── JOURNAL INLINE (step panel) ── */
.journal-inline {
  width:100%; height:100%; display:flex; overflow:hidden;
}
.journal-spine-inline {
  flex-shrink:0; width:18px; background:#cdd3ec;
  border-right:1.5px solid #5465c5;
  display:flex; flex-direction:column; justify-content:space-around;
  align-items:center; padding:12px 0;
}
.journal-spine-ring {
  width:14px; height:14px; border:2.5px solid var(--blue);
  border-radius:50%; background:#e5e8f5; flex-shrink:0;
}
.journal-page {
  flex:1; background:#f1ece4; padding:16px 20px 12px 16px;
  display:flex; flex-direction:column; gap:8px;
  background-image:linear-gradient(to bottom,transparent calc(100% - 1px),rgba(101,121,226,.1) 1px);
  background-size:100% 32px; background-position:0 52px; overflow:hidden;
}
.journal-page-header {
  border-bottom:1px solid rgba(101,121,226,.2); padding-bottom:6px; flex-shrink:0;
  font-family:var(--font-hand); font-size:clamp(14px,1.4vw,18px); color:#3a4aaa;
}
.journal-textarea {
  flex:1; resize:none; border:none; outline:none; background:transparent;
  font-family:var(--font-hand); font-size:clamp(15px,1.4vw,20px);
  color:#2a1e14; line-height:2; overflow-y:auto; user-select:text;
  caret-color:var(--blue);
}
.journal-textarea::placeholder { color:rgba(122,134,187,.35); font-style:italic; }
.journal-privacy {
  font-family:var(--font-hand); font-size:clamp(10px,.85vw,13px);
  color:#ccc; border-top:1px solid #e8e0d0; padding-top:6px; flex-shrink:0;
}

/* Matrix scrapbook styles (matrix-panel, adv-*, hm-*, matrix-toolbar/save-btn,
   photo/sticker/text modal CSS) now live in matrix-render.js's injectStyles(). */

/* ── NATIVE JOURNAL — chat-style journal on the back wall ──
   CSS moved to matrix-journal.js (ensureStyles()), which injects it once. ── */

/* ── INVENTORY PANEL (media/tools tie-in, between bingo and journal) ──
   CSS moved to matrix-inventory.js (ensureStyles()), which injects it once. ── */

/* ── DAYQUEST BUILDER MODAL ──
   .dq-overlay spans the full viewport (including the nav strip above the
   back wall) but stays pointer-events:none so nav clicks pass through it —
   see project memory on the daily-matrix nav-blocked bug. .dq-scroll is the
   actual interactive/scrollable region: it's inset below the nav (top:var(
   --bw-top)) so it never overlaps that pass-through strip, which lets it
   safely be pointer-events:auto — real touch-scroll gestures need the
   scrolling element itself to be hit-testable, not just a pointer-events:
   auto descendant, so splitting these into two elements (rather than one
   div doing both jobs) is what makes the dayquest builder scrollable on
   mobile. The card sits in normal flow inside .dq-scroll (not position:
   absolute), so .dq-foot below it trails underneath even if the card's
   content stretches taller than the viewport. ── */
.dq-overlay {
  position:fixed; inset:0; z-index:300;
  background:none;
  display:none;
  pointer-events:none;
}
.dq-overlay.open { display:block; }
.dq-scroll {
  position:absolute; top:var(--bw-top); left:0; right:0; bottom:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column; align-items:center;
  padding:0 0 40px;
  pointer-events:auto;
}
.dq-card {
  width:var(--bw-width); height:auto; min-height:var(--bw-height);
  max-height:none;
  padding:18px 20px; font-family:var(--font-hand);
  background:var(--back-wall);
  border:3px solid var(--blue);
  box-shadow:0 0 0 3px var(--blue), 6px 10px 40px rgba(0,0,0,.4);
  pointer-events:auto;
  flex-shrink:0;
}
.dq-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; }
.dq-close { font-size:32px; color:#aaa; cursor:pointer; line-height:1; border:none; background:none; padding:2px 6px; }
.dq-close:hover { color:#E8478B; }
.dq-sub { font-size:23px; color:#000; margin-bottom:12px; }
.__unused {
  width:100%; font-family:var(--font-hand); font-size:17px; color:#3a2e1e;
  padding:8px 10px; margin-bottom:14px;
  background:#cdd3ec; border:2px solid var(--blue);
  border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:#5465c5; border-top-color:#5465c5;
}
.dq-name::placeholder { color:rgba(122,134,187,.55); font-style:italic; }
.dq-body {
  display:grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr;
  gap:16px 24px;
  align-items:start;
}
@media (max-width:640px){ .dq-body { grid-template-columns:1fr; } }
.dq-preview-col { min-width:0; display:flex; flex-direction:column; align-items:center; }
.dq-terrain-col { min-width:0; }
.dq-climate-col { grid-column: 1 / -1; min-width:0; }
.dq-map-frame {
  width:min(100%, 300px); aspect-ratio:1/1;
  background:#cdd3ec;
  border:2px solid var(--blue); border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:#5465c5; border-top-color:#5465c5;
}
.dq-map-frame svg { width:100%; height:100%; display:block; }
.dq-section-label { font-size:22px; color:#7a86bb; letter-spacing:.4px; margin:0 0 8px; }

/* terrain palette */
.dq-cat-tabs { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
.dq-cat-btn {
  padding:4px 10px; background:#dfe2ef;
  border:2px solid var(--blue); border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:#5465c5; border-top-color:#5465c5;
  font-family:var(--font-hand); font-size:13px; letter-spacing:.5px;
  color:#3a4aaa; cursor:pointer; user-select:none; transition:filter .1s;
}
.dq-cat-btn:hover { filter:brightness(1.06); }
.dq-cat-btn.active { border-color:#3a4aaa; outline:2px solid #3a4aaa; outline-offset:1px; background:#e0f0f0; }
.dq-palette { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
.dq-terrain {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 6px; background:#dfe2ef; cursor:pointer; user-select:none;
  border:2px solid var(--blue); border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:#5465c5; border-top-color:#5465c5;
  transition:filter .1s;
}
.dq-terrain:hover { filter:brightness(1.06); }
.dq-terrain.active { border-color:#3a4aaa; outline:2px solid #3a4aaa; outline-offset:1px; background:#e0f0f0; }
.dq-terrain img { width:60px; height:50px; object-fit:contain; pointer-events:none; }
.dq-terrain span { font-size:13px; color:#3a4aaa; letter-spacing:.4px; pointer-events:none; }

/* climates + feeling chips */
.dq-climates { display:flex; flex-direction:column; gap:8px; }
.dq-climate {
  padding:7px 9px;
  border:2px solid var(--blue); border-right-color:#3a4aaa; border-bottom-color:#3a4aaa;
  border-left-color:#5465c5; border-top-color:#5465c5;
}
.dq-climate.sunny { background:#f2e6a8; border-color:#715f04; }
.dq-climate.rainy { background:#ae87e2; border-color:#260156; }
.dq-climate.windy { background:#a3eac9; border-color:#046957; }
.dq-climate.snowy { background:#6cd1ea; border-color:#033f50; }
.dq-climate-head { font-size:clamp(30px,3vw,41px); margin-bottom:8px; }
.dq-climate.sunny .dq-climate-head { color:#715f04; }
.dq-climate.rainy .dq-climate-head { color:#260156; }
.dq-climate.windy .dq-climate-head { color:#046957; }
.dq-climate.snowy .dq-climate-head { color:#033f50; }
.dq-chips { display:flex; flex-wrap:wrap; gap:5px; }
.dq-chip {
  padding:5px 14px; font-family:var(--font-hand); font-size:clamp(18px,1.8vw,25px); letter-spacing:.4px;
  cursor:pointer; user-select:none; border:2px solid; transition:filter .1s;
}
.dq-chip:hover { filter:brightness(.92); }
.dq-chip.active { outline:2px solid #111; outline-offset:1px; }
.dq-climate.sunny .dq-chip { background:#f8edb8; border-color:#715f04; color:#715f04; }
.dq-climate.rainy .dq-chip { background:#c9b3e7; border-color:#260156; color:#260156; }
.dq-climate.windy .dq-chip { background:#b6e7d0; border-color:#046957; color:#046957; }
.dq-climate.snowy .dq-chip { background:#a0d7e6; border-color:#033f50; color:#033f50; }

.dq-foot {
  display:none; align-items:center; justify-content:center;
  margin-top:20px; flex-shrink:0;
  pointer-events:none;
}
.dq-overlay.open .dq-foot { display:flex; }
.dq-foot > * { pointer-events:all; }
.dq-btn {
  padding:10px 18px; font-family:var(--font-hand); font-size:17px; cursor:pointer;
  border:2px solid #4a5bc4; background:var(--blue); color:#fff; box-shadow:2px 2px 0 #3a4aaa;
  transition:all .05s;
}
.dq-btn:hover { background:#4a5bc4; }
.dq-btn:active { box-shadow:none; transform:translate(2px,2px); }
.dq-btn:disabled { opacity:.38; cursor:not-allowed; transform:none !important; box-shadow:2px 2px 0 #3a4aaa; }
.dq-btn.ghost { background:none; color:#999; border-color:#ccc; box-shadow:none; }
.dq-btn.ghost:hover { border-color:var(--blue); color:var(--blue); background:none; }

/* dayquest entry in the phase key */

@media (prefers-reduced-motion: reduce) {
  .dq-terrain, .dq-chip, .dq-btn { transition:none; }
}

/* ── MEMBER GATE ── */
.member-gate-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.6);
  z-index:350; display:none; align-items:center; justify-content:center;
}
.member-gate-overlay.open { display:flex; }
.member-gate {
  background:#dfe2ef;
  box-shadow:0 0 0 4px var(--blue), 4px 8px 28px rgba(0,0,0,.35);
  padding:36px 32px; max-width:400px; width:90%;
  text-align:center; display:flex; flex-direction:column; gap:16px;
  animation:popIn .2s ease both;
}
.member-gate-title { font-family:var(--font-hand); font-size:clamp(25px,2.5vw,35px); color:#3a4aaa; }
.member-gate-text { font-family:var(--font-hand); font-size:clamp(15px,1.4vw,18px); color:#555; line-height:1.5; }
.member-gate-btns { display:flex; flex-direction:column; gap:10px; }
.member-gate-btn {
  font-family:var(--font-hand); font-size:clamp(16px,1.6vw,21px); color:#fff;
  background:var(--blue); border:2px solid #4a5bc4; box-shadow:2px 2px 0 #3a4aaa;
  padding:12px 20px; cursor:pointer; transition:all .05s;
}
.member-gate-btn:hover { background:#4a5bc4; }
.member-gate-btn:active { box-shadow:none; transform:translate(2px,2px); }
.member-gate-btn.ghost { background:none; color:#999; border-color:#ccc; box-shadow:none; }
.member-gate-btn.ghost:hover { border-color:var(--blue); color:var(--blue); }

/* ── ARCHETYPE PICKER (reuses the in-game card style) ── */
.arch-picker-loading { padding: 20px; font-family: var(--font-hand); color: #7a86bb; }
.arch-picker {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px;
}
.arch-picker-title { font-family: var(--font-hand); font-size: clamp(25px,2.4vw,35px); color: #3a4aaa; text-align: center; }
.arch-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(120px, 180px));
  gap: 12px;
  padding: 4px;
  justify-content: center;
}
@media (max-width:600px) { .arch-grid { grid-template-columns: repeat(2, 1fr); } }
.arch-card {
  border: 2px solid var(--blue); background: #cdd3ec;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: stretch;
  padding: 8px 8px 6px; gap: 5px;
  font-family: var(--font-hand); text-align: center;
  transition: border-color .15s, box-shadow .12s, transform .1s;

}
.arch-card:hover { border-color: var(--blue); box-shadow: 2px 2px 0 var(--blue); transform: translateY(-2px); }
.arch-card-name { font-size: 17px; color: #3a2e1e; }
.arch-card-new { border-style: dashed; border-color: var(--blue); justify-content: center; align-items: center; }
.arch-card-new:hover { border-color: var(--blue); }
.arch-card-plus { font-size: 46px; line-height: 1; color: var(--blue); font-family: var(--font-game); }
.arch-card-new:hover .arch-card-plus { color: var(--blue); }
</style>

<script>
let currentUser = null;

// ── MATRIX PHOTO UPLOADS ──────────────────────────────────
// Same bucket + path convention as the dream matrix (userId/entryId/uuid.ext),
// so the existing storage policies (authenticated INSERT + public read) cover
// daily entries too without any new bucket-level policy.
const MATRIX_PHOTO_BUCKET = 'matrix-photos';

// Convert a stored public URL back to its in-bucket path so storage.remove()
// can act on it. Returns null for anything not in this bucket (e.g. legacy URLs).
function matrixPhotoPath(url){
  if (typeof url !== 'string') return null;
  const marker = `/object/public/${MATRIX_PHOTO_BUCKET}/`;
  const i = url.indexOf(marker);
  if (i === -1) return null;
  let p = url.slice(i + marker.length);
  const q = p.indexOf('?'); if (q !== -1) p = p.slice(0, q);   // strip any query string
  try { p = decodeURIComponent(p); } catch(e){}
  return p || null;
}

// Best-effort delete of one or more stored photos. Storage cleanup should never
// block or fail a save, so this swallows its own errors (just logs them).
async function deleteMatrixPhotoFiles(urls){
  const paths = (urls || []).map(matrixPhotoPath).filter(Boolean);
  if (!paths.length) return;
  try {
    await sb.storage.from(MATRIX_PHOTO_BUCKET).remove(paths);
  } catch(err){
    console.error('[matrix photo] storage cleanup failed:', err);
  }
}

// ── SESSION STATE ─────────────────────────────────────────
let activePhase     = null;
let currentStep     = null; // 'location' | 'character' | 'bingo' | 'library' | 'journal' — whichever popup is open
let activeEntryId   = null; // one uuid per day = one daily_matrix row
let activeEntryDate = null; // 'YYYY-MM-DD' (user's LOCAL day) for this entry
let activeDayquest = null; // {name,terrain,feeling,tint,cat} for today's location
let _pendingArchetype = null; // archetype selected in picker, confirmed by continue btn

// User's LOCAL calendar day — the daily limit resets at local midnight.
function localTodayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// ── LOGIN MODAL ───────────────────────────────────────────
function showLoginModal() {
  // Reset form state
  lmShowMsg('lm-login-msg', '', '');
  lmShowMsg('lm-signup-msg', '', '');
  document.getElementById('login-modal').classList.add('open');
}
function closeLoginModal() {
  document.getElementById('login-modal').classList.remove('open');
}

function lmSwitchTab(tab, btn) {
  document.querySelectorAll('.lm-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.lm-form').forEach(f => f.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('lm-form-' + tab).classList.add('active');
}

function lmShowMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'lm-msg' + (type ? ' ' + type : '');
}

async function lmLogin() {
  const btn = document.getElementById('lm-login-btn');
  btn.disabled = true; btn.textContent = 'entering...';
  const { error } = await sb.auth.signInWithPassword({
    email:    document.getElementById('lm-email').value.trim(),
    password: document.getElementById('lm-password').value,
  });
  if (error) {
    lmShowMsg('lm-login-msg', error.message, 'error');
    btn.disabled = false; btn.textContent = 'enter';
  }
}

async function lmSignup() {
  const btn      = document.getElementById('lm-signup-btn');
  btn.disabled = true; btn.textContent = 'creating...';
  const username = document.getElementById('lm-username').value.trim();
  const email    = document.getElementById('lm-su-email').value.trim();
  const password = document.getElementById('lm-su-password').value;
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
  if (error) {
    lmShowMsg('lm-signup-msg', error.message, 'error');
    btn.disabled = false; btn.textContent = 'create account';
    return;
  }
  lmShowMsg('lm-signup-msg', 'account created! loading your maps...', 'success');
  // onAuthStateChange will handle the rest
}

// Login form triggers SIGNED_IN after the user submits credentials
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_IN' && session && !currentUser) {
    currentUser = session.user;
    closeLoginModal();
    sb.from('user-profiles').select('username').eq('id', currentUser.id).single()
      .then(({ data: p }) => HeartabilityNav.setAuthState({ loggedIn: true, username: p?.username || currentUser.email }))
      .catch(() => HeartabilityNav.setAuthState({ loggedIn: true, username: currentUser.email }));
    stepInitial();
  } else if (event === 'SIGNED_OUT') {
    HeartabilityNav.setAuthState({ loggedIn: false });
  }
});

// ── STATUS BAR ────────────────────────────────────────────
function showRoomStatus(msg, color, duration=3000) {
  const el = document.getElementById('save-status-bar');
  el.textContent = msg;
  el.style.color = color || '#6ab86a';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent = ''; }, duration);
}

function setSaveBtnVisible(visible, label='continue →') {
  const bar = document.getElementById('save-continue-bar');
  const btn = document.getElementById('save-continue-btn');
  bar.classList.toggle('visible', visible);
  document.body.classList.toggle('save-bar-visible', visible);
  if (btn) {
    btn.innerHTML = label;
    btn.disabled = false;
  }
}

// ── SAVE & CONTINUE — progress tracker owns all saving ─────────
async function saveAndContinue() {
  const btn = document.getElementById('save-continue-btn');
  btn.disabled = true;
  btn.textContent = 'saving...';

  // Library step — save the tagged entries directly (no iframe involved)
  if (currentStep === 'library') {
    await saveLibrarySelection();
    return;
  }

  // Archetype picker — no iframe, use the pending selection
  if (_pendingArchetype) {
    const a = _pendingArchetype;
    _pendingArchetype = null;
    await useArchetype(a);
    return;
  }

  const iframe = document.getElementById('game-iframe');
  if (!iframe) { btn.disabled = false; return; }

  // Request current state from character builder or bingo
  {
    iframe.contentWindow.postMessage({ type: 'request_state' }, '*');
    // Fallback: re-enable if no response in 5s
    const label = 'add to matrix →';
    clearTimeout(window._saveFallback);
    window._saveFallback = setTimeout(() => {
      const b = document.getElementById('save-continue-btn');
      if (b && b.disabled) {
        b.disabled = false;
        b.innerHTML = label;
        HGModal.alert('oops', 'something went wrong — try again');
      }
    }, 5000);
  }
}

// ── ZONE PROMPTS ──────────────────────────────────────────
// Terrain images + ordered list + climates come from assets/js/treasure-map.js
// (window.TreasureMap) — single source of truth shared with treasure-map.html,
// cosmic.html, and dream.html.
const { TERRAIN_IMGS, TERRAIN_ORDER, WEATHER_CATS } = TreasureMap;

// ── BUBBLE HELPERS ────────────────────────────────────────
// Buttons go on the wall, not in a bubble (there's no heart guide to anchor
// one to anymore); text is currently unused by every call site.
function setBubble(text, buttons=[]) {
  const wall = document.getElementById('wall-btns');
  wall.innerHTML = '';
  if (buttons.length) {
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.className = 'wall-btn' + (b.secondary ? ' secondary' : '');
      el.textContent = b.label;
      el.onclick = b.action;
      wall.appendChild(el);
    });
    wall.classList.add('active');
  } else {
    wall.classList.remove('active');
  }
}

// ── MATRIX PAGE TOGGLE — guards against leaving mid-rearrange ─────
async function matrixNav(e, url) {
  e.preventDefault();
  const dirty = _matrixEditor && _matrixEditor.isDirty && _matrixEditor.isDirty();
  if (dirty) {
    const save = await HGModal.confirm(
      'unsaved changes',
      'you moved something on your matrix that hasn’t been saved yet. save before leaving?',
      { confirmLabel: 'save & leave', cancelLabel: 'stay' }
    );
    if (!save) return false;
    const host = document.getElementById('matrix-panel-host');
    if (host) await _matrixEditor.saveAllPositions(host);
  }
  window.location.href = url;
  return false;
}

// ── CONTENT PANEL HELPERS ────────────────────────────────
function showPanel(html) {
  const panel = document.getElementById('quad-popup-body');
  panel.innerHTML = html;
  panel.classList.remove('iframe-mode');
  panel.classList.add('active');
  document.getElementById('wall-btns').classList.remove('active');
}
function hidePanel() {
  const panel = document.getElementById('quad-popup-body');
  panel.classList.remove('active', 'iframe-mode');
  panel.innerHTML = '';
}
// The persistent matrix canvas (always visible, not a popup step) — holds
// location/bingo/char/library items + photos/stickers/text, per renderMatrix().
// Chrome occasionally fails to paint freshly-inserted transformed children
// after a big innerHTML swap — nudge each one's transform directly: clear
// it, force a layout read, then restore it, guaranteeing a repaint.
function showMatrixPanel(html) {
  const panel = document.getElementById('matrix-panel-host');
  panel.innerHTML = html;
  void panel.offsetHeight;
  panel.querySelectorAll('.mx-note, .adv-sticker, .adv-photo').forEach(el => {
    const t = el.style.transform;
    el.style.transform = 'none';
    void el.offsetHeight;
    el.style.transform = t;
  });
}
// Same-origin game iframes don't auto-size to their content by default, so
// once loaded we measure the real document height and apply it directly —
// this is what lets the frame grow to fit instead of scrolling internally.
function autoSizeIframe(iframe) {
  const resize = () => {
    try {
      const doc = iframe.contentDocument;
      const h = doc && doc.documentElement.scrollHeight;
      if (h) iframe.style.height = h + 'px';
    } catch (e) { /* cross-origin — keep fallback height */ }
  };
  iframe.addEventListener('load', () => {
    resize();
    try {
      if ('ResizeObserver' in window && iframe.contentDocument) {
        new ResizeObserver(resize).observe(iframe.contentDocument.documentElement);
      }
    } catch (e) {}
  });
}

function showIframe(src, prompt) {
  const panel = document.getElementById('quad-popup-body');
  const promptHtml = prompt
    ? `<div class="iframe-prompt"><div class="iframe-prompt-sub">${prompt}</div></div>`
    : '';
  panel.innerHTML = promptHtml + `<iframe class="game-iframe" src="${src}" id="game-iframe"></iframe>`;
  panel.classList.add('active', 'iframe-mode');
  document.getElementById('wall-btns').classList.remove('active');
  autoSizeIframe(document.getElementById('game-iframe'));
}


// ── LANDING — land directly on the matrix canvas (see renderMatrix); the
// location quadrant is the only unlocked one until it's filled in for
// today. If today's entry already exists (loaded earlier this same local
// day), pick up where it left off instead of resetting. ─────────────────
async function stepInitial() {
  if (!currentUser) {
    setBubble('log in to begin');
    showLoginModal();
    return;
  }
  activeEntryDate = localTodayStr();

  let existing = null;
  try {
    const { data } = await sb.from('daily_matrix')
      .select('*')
      .eq('user_id', currentUser.id)
      .eq('entry_date', activeEntryDate)
      .maybeSingle();
    existing = data || null;
  } catch(e){ console.error('[daily] today lookup failed', e); }

  if (existing) {
    activeEntryId = existing.id;
    activePhase   = 'dayquest';
    activeDayquest = existing.location_data || null;
  }
  await renderMatrix();
}

function formatUpdated(dateStr) {
  if (!dateStr) return '';
  return 'last updated ' + new Date(dateStr).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

// The matrix map item shows ONLY the day's chosen destination (one terrain +
// tint glow + feeling), not the whole map. loc = {terrain, feeling, tint}.
function buildSingleLocationSVG(loc){
  loc = loc || {};
  const R = 58, cx = 150, cy = 108;
  let defs = '', body = '';
  if (loc.tint) {
    defs += `<radialGradient id="locglow" cx="50%" cy="50%" r="50%">`
      + `<stop offset="0%" stop-color="${loc.tint}" stop-opacity="1"/>`
      + `<stop offset="55%" stop-color="${loc.tint}" stop-opacity=".85"/>`
      + `<stop offset="100%" stop-color="${loc.tint}" stop-opacity="0"/></radialGradient>`;
    body += `<circle cx="${cx}" cy="${cy}" r="${R+44}" fill="url(#locglow)"/>`;
  }
  if (loc.terrain && TERRAIN_IMGS[loc.terrain]) {
    body += `<image x="${cx-R}" y="${cy-R}" width="${R*2}" height="${R*2}" `
      + `href="${TERRAIN_IMGS[loc.terrain]}" preserveAspectRatio="xMidYMid meet"/>`
      + `<text x="${cx}" y="${cy-R-8}" text-anchor="middle" fill="#000000" `
      + `font-family="ZoesHandwriting,cursive" font-size="16" font-weight="bold">${loc.terrain} of</text>`;
  } else {
    body += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(200,196,180,.55)" stroke="#6e83d3" stroke-width="1.5"/>`;
  }
  if (loc.feeling) {
    body += `<text x="${cx}" y="${cy+R+22}" text-anchor="middle" fill="#000000" `
      + `font-family="ZoesHandwriting,cursive" font-size="17" font-weight="bold">${_escapeHtml(loc.feeling)}</text>`;
  }
  return `<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;"><defs>${defs}</defs>${body}</svg>`;
}

// ── STEP 4: BEGIN → CHOOSE ARCHETYPE OR CHARACTER BUILDER ─
// Re-opens the dayquest builder, restoring whatever terrain/feeling was
// already confirmed instead of wiping the draft — used when double-clicking
// the placed location item to redo it.
function openLocationPopup() {
  dqDraft = activeDayquest
    ? { name: activeDayquest.name || '', terrain: activeDayquest.terrain || null,
        feeling: activeDayquest.feeling || null, tint: activeDayquest.tint || null,
        cat: activeDayquest.cat || null }
    : { name:'', terrain:null, feeling:null, tint:null, cat:null };
  document.querySelectorAll('.dq-terrain.active, .dq-chip.active').forEach(el => el.classList.remove('active'));
  if (dqDraft.terrain) document.getElementById(`dq-terrain-${dqDraft.terrain}`)?.classList.add('active');
  if (dqDraft.feeling) document.getElementById(`dq-chip-${dqDraft.feeling}`)?.classList.add('active');
  renderDayquestPreview();
  refreshDayquestConfirm();
  document.getElementById('dq-overlay').classList.add('open');
}

function openCharacterBuilder() {
  setQuadPopupTitle('build a character');
  const src  = `../games/infinity-mirror.html?game_id=${activeEntryId}&phase=${activePhase}&loop=true&mode=cloud`;
  showIframe(src, 'create a character that represents your vibe today');
  setSaveBtnVisible(true, 'loading...');
  document.getElementById('save-continue-btn').disabled = true;
}

// ── ARCHETYPE PICKER — reuse a saved cast member or build new ─
async function showArchetypePicker() {
  currentStep = 'character';
  const panel = document.getElementById('quad-popup-body');
  panel.className = 'content-panel active';
  panel.innerHTML = `<div class="arch-picker-loading">loading your cast…</div>`;
  document.getElementById('wall-btns').classList.remove('active');
  setSaveBtnVisible(false);

  const { data, error } = await sb.from('character_archetypes')
    .select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
  if (error) console.error('[archetypes] fetch failed:', error);
  renderArchetypePicker(data || []);
}

function renderArchetypePicker(archetypes) {
  if (currentStep !== 'character') return;
  const panel = document.getElementById('quad-popup-body');
  const cards = archetypes.map(a => `
    <button class="arch-card" data-id="${a.id}" type="button">
      ${MatrixRender.buildCharStack(a)}
      <div class="arch-card-name">${_escapeHtml(a.name || 'unnamed')}</div>
    </button>`).join('');
  panel.innerHTML = `
    <div class="step-panel">
      <div class="arch-picker">
        <div class="arch-picker-title">choose an archetype</div>
        <div class="arch-grid">
          ${cards}
          <button class="arch-card arch-card-new" id="arch-new-btn" type="button">
            <div class="arch-card-plus">+</div>
            <div class="arch-card-name">create new</div>
          </button>
        </div>
      </div>
    </div>`;
  panel.querySelectorAll('.arch-card[data-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      panel.querySelectorAll('.arch-card.selected').forEach(el => el.classList.remove('selected'));
      btn.classList.add('selected');
      _pendingArchetype = archetypes.find(x => x.id === btn.dataset.id) || null;
      setSaveBtnVisible(true, 'add to matrix →');
    });
  });
  document.getElementById('arch-new-btn').addEventListener('click', openCharacterBuilder);
}

async function useArchetype(archetype) {
  const charState = {
    name: archetype.name, body: archetype.body,
    hair: archetype.hair, eyes: archetype.eyes, mouth: archetype.mouth,
  };
  await saveCharacterAndAdvance(charState, { fork: false, archetypeId: archetype.id });
}

// Saves charState to daily_matrix (today's location is already saved by
// this point — the location quadrant is filled in first — so this only
// ever touches character_data/archetype_id). When fork is true (built
// fresh via the character builder), also adds it to the user's reusable
// cast — picking a saved archetype never touches that table again.
async function saveCharacterAndAdvance(charState, { fork, archetypeId }) {
  let finalArchetypeId = archetypeId || null;
  if (fork) {
    const { data: newArch, error: forkErr } = await sb.from('character_archetypes').insert({
      user_id: currentUser.id, name: charState.name || null,
      body: charState.body, hair: charState.hair,
      eyes: charState.eyes, mouth: charState.mouth,
    }).select().single();
    if (forkErr) console.error('[archetypes] save failed:', forkErr);
    else finalArchetypeId = newArch.id;
  }

  const { error } = await sb.from('daily_matrix').upsert({
    id: activeEntryId,
    user_id: currentUser.id,
    entry_date: activeEntryDate,
    character_data: charState,
    archetype_id: finalArchetypeId,
  }, { onConflict: 'id' });

  if (error) {
    console.error('[daily save]', error);
    HGModal.alert('oops', 'save failed');
    const btn = document.getElementById('save-continue-btn');
    if (btn) { btn.disabled = false; btn.innerHTML = 'add to matrix →'; }
    return;
  }

  showRoomStatus('character saved ✓', '#6ab86a');
  closeQuadrantPopup();
  await renderMatrix();
}

// ── BINGO (heart meter) ──────────────────────────────────
function stepBingo() {
  currentStep = 'bingo';
  setBubble('how full is your heart meter?', []);
  const src  = `../games/bingo.html?game_id=${activeEntryId}&phase=${activePhase}&loop=true&mode=cloud`;
  showIframe(src);
  setSaveBtnVisible(true, 'add to matrix →');
}

// ── STEP 6: BINGO DONE → THE INVENTORY (native, no iframe) ─────
// Lets the player tag books/movies/tools from their personal collection to
// today's entry before writing their journal. Panel logic lives in the
// shared matrix-inventory.js module (also used by dream.html/cosmic.html).
const inventoryPanel = MatrixInventory.createPanel({
  sb,
  getCurrentUser: () => currentUser,
  persist: async (fields) => {
    const { error } = await sb.from('daily_matrix').upsert({
      id: activeEntryId, user_id: currentUser.id, entry_date: activeEntryDate,
      ...fields,
    }, { onConflict: 'id' });
    if (error) throw error;
  },
  onContinue: () => { closeQuadrantPopup(); renderMatrix(); },
  backStep: () => closeQuadrantPopup(),
});

function stepLibrary() {
  currentStep = 'library';
  setBubble('want to pull anything from your inventory into today?', []);
  showPanel(inventoryPanel.panelHtml());
  inventoryPanel.enter();
  setSaveBtnVisible(true, 'add to matrix →');
}

async function saveLibrarySelection(){
  const btn = document.getElementById('save-continue-btn');
  const result = await inventoryPanel.save();
  if (!result.ok) {
    HGModal.alert('oops', 'save failed');
    if (btn) { btn.disabled = false; btn.innerHTML = 'add to matrix →'; }
  }
}

// ── JOURNAL (native chat, opened from the on-canvas notes button) ───
// Messages persist on every send — there's no separate "done" step;
// closing the popup (×) is all that's needed. Panel logic lives in the
// shared matrix-journal.js module (also used by dream.html/cosmic.html).
const journalPanel = MatrixJournal.createPanel({
  sb,
  getCurrentUser: () => currentUser,
  table: 'daily_matrix',
  charAssets: MatrixRender.CHAR_FULL_ASSETS,
  placeholder: 'what happened today?',
  isReady: () => !!activeEntryId,
  identityColumns: ['id'],
  buildUpsertBase: () => ({ id: activeEntryId, user_id: currentUser.id, entry_date: activeEntryDate }),
  rowMatchesActive: row => row.id === activeEntryId,
  sideForRow: (row, i) => i % 2 === 0 ? 'left' : 'right',
  charDataForRow: row => row.character_data || null,
  locationLabelForRow: row => {
    const ld = row.location_data || {};
    return (ld.terrain && ld.feeling) ? `${ld.terrain} of ${ld.feeling}` : (ld.terrain || ld.feeling || '');
  },
  loadHistoryRows: async () => {
    const { data } = await sb.from('daily_matrix')
      .select('id, journal_messages, created_at, character_data, location_data')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: true }).limit(60);
    return data || [];
  },
});

function stepJournal() {
  currentStep = 'journal';
  clearTimeout(window._saveFallback);
  setBubble('what was important today?', []);
  showPanel(journalPanel.panelHtml());
  journalPanel.enter();
}

// ── STEP 7: DONE ──────────────────────────────────────────
// ── DAILY MATRIX ─────────────────────────────────────
// Rendering + interactive editing (drag/rotate/resize, add photo/sticker/
// text, the save button) all live in matrix-render.js now — see
// MatrixRender.buildHTML/createMatrixEditor. Data loading also goes through
// matrix-render.js's assemble() (single source of truth for pulling in
// library_entry_ids/library_save_ids/library_tool_ids etc.) — this file only
// handles step wiring.

// Lazily created once (it owns 3 modal DOM overlays — must not be recreated
// on every render). getUserId/getEntryId close over the page's own auth/
// step state so the editor always acts on whichever entry is active.
let _matrixEditor = null;
function getMatrixEditor(){
  if (_matrixEditor) return _matrixEditor;
  _matrixEditor = MatrixRender.createMatrixEditor({
    sb, table: 'daily_matrix',
    getEntryId: () => activeEntryId,
    getUserId: () => currentUser?.id,
    status: (msg, color) => showRoomStatus(msg, color),
    onChange: renderMatrix,
    onQuadrantOpen: openQuadrant,
    onOpenJournal: openJournalPopup,
  });
  return _matrixEditor;
}

const QUADRANT_PROMPTS = {
  map: 'where are you today?', bingo: 'how are you?',
  library: "what's in your bag?", char: 'who are you?',
};

// Re-assemble + redraw the matrix in place — this is the landing view
// itself now (see stepInitial), not a final "step". With no activeEntryId
// yet, the location quadrant is the only unlocked prompt; the other 3 stay
// locked until it's filled in.
let _matrixSeed = 'matrix';
async function renderMatrix() {
  const data = activeEntryId
    ? await MatrixRender.assemble(sb, activeEntryId, null, 'daily_matrix')
    : {};
  _matrixSeed = activeEntryId || 'matrix';
  showMatrixPanel(MatrixRender.buildHTML(data, _matrixSeed, {
    showEditNotes: false, showFrame: true,
    editable: !!activeEntryId, showJournalTool: !!activeEntryId,
    quadrantPrompts: QUADRANT_PROMPTS,
    lockedQuadrants: activeEntryId ? [] : ['bingo', 'library', 'char'],
  }));
  const panel = document.getElementById('matrix-panel-host');
  const editor = getMatrixEditor();
  editor.attachInteractions(panel);
  MatrixRender.attachMatrix(panel, {
    onRemovePhoto: url => editor.removeMatrixPhoto(url),
    onQuadrantOpen: openQuadrant,
  });
}

// ── QUADRANT POPUP SHELL — modal overlay hosting whichever quadrant's game
// is currently open. showPanel/showIframe (unchanged) render into
// #quad-popup-body inside it. No back-navigation chrome — each quadrant's
// game is self-contained; the popup's own × is the only way out. The
// location quadrant uses its own separate #dq-overlay instead (see below).
function openQuadrantPopup(title) {
  setQuadPopupTitle(title);
  document.getElementById('quad-popup-overlay').classList.add('open');
}
function setQuadPopupTitle(title) {
  document.getElementById('quad-popup-title').textContent = title || '';
}
function closeQuadrantPopup() {
  document.getElementById('quad-popup-overlay').classList.remove('open');
  hidePanel();
  setSaveBtnVisible(false);
  currentStep = null;
}
function handleQuadPopupOverlayClick(e) {
  if (e.target === document.getElementById('quad-popup-overlay')) closeQuadrantPopup();
}

// Dispatches a quadrant click/dblclick (from the matrix canvas) to the
// right popup. Bingo/library/char are locked until today's entry exists,
// so this should only ever fire for those once activeEntryId is set — the
// guard is just a safety net.
function openQuadrant(quadrant) {
  if (quadrant === 'map') return openLocationPopup();
  if (!activeEntryId) return;
  if (quadrant === 'bingo') return openBingoPopup();
  if (quadrant === 'char') return openCharPopup();
  if (quadrant === 'library') return openLibraryPopup();
}
function openBingoPopup() {
  openQuadrantPopup(QUADRANT_PROMPTS.bingo);
  stepBingo();
}
function openCharPopup() {
  openQuadrantPopup(QUADRANT_PROMPTS.char);
  showArchetypePicker();
}
function openLibraryPopup() {
  openQuadrantPopup(QUADRANT_PROMPTS.library);
  stepLibrary();
}
function openJournalPopup() {
  if (!activeEntryId) return;
  openQuadrantPopup('journal');
  stepJournal();
}

// ── POSTMESSAGE FROM IFRAMES ──────────────────────────────
window.addEventListener('message', async e => {
  const msg = e.data || {};
  if (!msg.type) return;

  // ── iframe signalled it's loaded and ready ───────────────
  if (msg.type === 'iframe_ready' && msg.game === 'character') {
    const btn = document.getElementById('save-continue-btn');
    if (btn && currentStep === 'character') {
      btn.disabled = false;
      btn.innerHTML = 'add to matrix →';
    }
    return;
  }

  // ── Character state received — save to saved_data ───
  if (msg.type === 'char_state') {
    const charState = msg.state || {};
    if (!charState.body) {
      HGModal.alert('oops', 'pick a body first!');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'add to matrix →';
      return;
    }
    if (!charState.name || !charState.name.trim()) {
      HGModal.alert('oops', 'name this archetype first!');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'add to matrix →';
      return;
    }
    await saveCharacterAndAdvance(charState, { fork: true });
    return;
  }

  // ── Bingo state received — save to saved_data ───────
  if (msg.type === 'bingo_state') {
    const { marked: markedArr, score } = msg;
    if (!score || score === 0) {
      HGModal.alert('oops', 'check some squares first!');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'add to matrix →';
      return;
    }
    const energyScore  = Math.round((score / 24) * 100);
    const bingoPayload = { marked: markedArr, score };

    const { error } = await sb.from('daily_matrix').upsert({
      id: activeEntryId,
      user_id: currentUser.id,
      entry_date: activeEntryDate,
      bingo_data: bingoPayload, energy_score: energyScore,
    }, { onConflict: 'id' });

    if (!error) {
      showRoomStatus('all saved ✓', '#6ab86a');
      closeQuadrantPopup();
      await renderMatrix();
    } else {
      HGModal.alert('oops', 'save failed');
      const btn = document.getElementById('save-continue-btn');
      btn.disabled = false; btn.innerHTML = 'add to matrix →';
    }
    return;
  }

  // ── Inventory "add an entry" iframe finished submitting ─────
  if (msg.type === 'media_entry_saved') {
    inventoryPanel.onMediaSaved();
    return;
  }

});

// ── DAYQUEST BUILDER ─────────────────────────────────────
let dqDraft = { name:'', terrain:null, feeling:null, tint:null, cat:null };

function buildDayquestPalette() {
  // terrain thumbnails
  const pal = document.getElementById('dq-palette');
  pal.innerHTML = TreasureMap.TERRAIN.map(t => `
    <div class="dq-terrain" id="dq-terrain-${t.id}" data-cat="${t.cat}" onclick="dayquestPickTerrain('${t.id}')">
      <img src="${TERRAIN_IMGS[t.id]}" alt="${t.id}">
      <span>${t.id}</span>
    </div>`).join('');
  TreasureMap.renderTerrainCatTabs(
    document.getElementById('dq-cat-tabs'), pal, { btnClass: 'dq-cat-btn' }
  );
  // climate groups with feeling chips
  const cl = document.getElementById('dq-climates');
  cl.innerHTML = WEATHER_CATS.map(cat => `
    <div class="dq-climate ${cat.id}">
      <div class="dq-climate-head">${cat.label}</div>
      <div class="dq-chips">
        ${cat.feelings.map(f => `<span class="dq-chip" id="dq-chip-${f}"
            onclick="dayquestPickFeeling('${f}','${cat.id}','${cat.tint}')">${f}</span>`).join('')}
      </div>
    </div>`).join('');
}

function closeDayquestBuilder() {
  document.getElementById('dq-overlay').classList.remove('open');
}

function dayquestPickTerrain(id) {
  dqDraft.terrain = id;
  document.querySelectorAll('.dq-terrain').forEach(el => el.classList.remove('active'));
  document.getElementById(`dq-terrain-${id}`)?.classList.add('active');
  renderDayquestPreview();
  refreshDayquestConfirm();
}
function dayquestPickFeeling(feeling, cat, tint) {
  dqDraft.feeling = feeling; dqDraft.cat = cat; dqDraft.tint = tint;
  document.querySelectorAll('.dq-chip').forEach(el => el.classList.remove('active'));
  document.getElementById(`dq-chip-${feeling}`)?.classList.add('active');
  renderDayquestPreview();
  refreshDayquestConfirm();
}
function refreshDayquestConfirm() {
  // terrain + feeling required; name optional
  document.getElementById('dq-confirm').disabled = !(dqDraft.terrain && dqDraft.feeling);
}

// One centered destination — terrain image + tint glow + feeling label
function renderDayquestPreview() {
  const R = 50, cx = 150, cy = 110;
  let defs = '', body = '';
  if (dqDraft.tint) {
    defs += `<radialGradient id="sqtint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${dqDraft.tint}" stop-opacity="1"/>
      <stop offset="55%" stop-color="${dqDraft.tint}" stop-opacity=".85"/>
      <stop offset="100%" stop-color="${dqDraft.tint}" stop-opacity="0"/></radialGradient>`;
    body += `<circle cx="${cx}" cy="${cy}" r="${R+40}" fill="url(#sqtint)"/>`;
  }
  if (dqDraft.terrain && TERRAIN_IMGS[dqDraft.terrain]) {
    body += `<image x="${cx-R}" y="${cy-R}" width="${R*2}" height="${R*2}"
      href="${TERRAIN_IMGS[dqDraft.terrain]}" preserveAspectRatio="xMidYMid meet"/>
      <text x="${cx}" y="${cy-R-8}" text-anchor="middle" fill="#000000"
        font-family="ZoesHandwriting,cursive" font-size="16" font-weight="bold">${dqDraft.terrain} of</text>`;
  } else {
    body += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(200,196,180,.5)"
      stroke="#6e83d3" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="#7a86bb"
        font-family="ZoesHandwriting,cursive" font-size="13">pick a terrain</text>`;
  }
  if (dqDraft.feeling) {
    body += `<text x="${cx}" y="${cy+R+22}" text-anchor="middle" fill="#000000"
      font-family="ZoesHandwriting,cursive" font-size="16" font-weight="bold">${dqDraft.feeling}</text>`;
  }
  document.getElementById('dq-map-frame').innerHTML =
    `<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg"><defs>${defs}</defs>${body}</svg>`;
}

async function confirmDayquest() {
  if (!(dqDraft.terrain && dqDraft.feeling)) return;
  const btn = document.getElementById('dq-confirm');
  if (btn) { btn.disabled = true; btn.textContent = 'saving...'; }
  activeDayquest = {
    terrain: dqDraft.terrain,
    feeling: dqDraft.feeling,
    tint:    dqDraft.tint,
    cat:     dqDraft.cat,
  };
  activePhase = 'dayquest';
  if (!activeEntryId) activeEntryId = crypto.randomUUID();
  activeEntryDate = activeEntryDate || localTodayStr();

  const { error } = await sb.from('daily_matrix').upsert({
    id: activeEntryId,
    user_id: currentUser.id,
    entry_date: activeEntryDate,
    location_data: activeDayquest,
  }, { onConflict: 'id' });

  if (error) {
    console.error('[daily save]', error);
    HGModal.alert('oops', 'save failed');
    if (btn) { btn.disabled = false; btn.textContent = 'add to matrix →'; }
    return;
  }

  showRoomStatus('location saved ✓', '#6ab86a');
  if (btn) { btn.disabled = false; btn.textContent = 'add to matrix →'; }
  closeDayquestBuilder();
  await renderMatrix();
}

// ── INIT ──────────────────────────────────────────────────
async function init() {
  HeartabilityNav.init({
    mount: '#gear-slot',
    assetsBase: '../assets',
    authMode: 'dynamic',
    sb: sb,
    profileHref: '../users/account-settings.html',
    music: { src: 'https://dn720704.ca.archive.org/0/items/HildegardVonBingenCanticlesOfEcstasy/Hildegard%20von%20Bingen%20-%20Canticles%20Of%20Ecstasy.mp3' },
    onSignOut: () => { currentUser = null; },
  });

  buildDayquestPalette();
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    sb.from('user-profiles').select('username').eq('id', currentUser.id).single()
      .then(({ data: p }) => HeartabilityNav.setAuthState({ loggedIn: true, username: p?.username || currentUser.email }))
      .catch(() => HeartabilityNav.setAuthState({ loggedIn: true, username: currentUser.email }));
    stepInitial();
  } else {
    stepInitial();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
