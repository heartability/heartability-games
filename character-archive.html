<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Character Archive — Heartability</title>
  <style>

@font-face {
  font-family: "ZoesHandwriting";
  src: url("assets/fonts/ZoesHandwriting-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "PFPixelscript";
  src: url("assets/fonts/PFPixelscriptProRegular.ttf") format("truetype");
}
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-hand:     "ZoesHandwriting", cursive;
  --font-pixel:    "PFPixelscript", cursive;
  --font-game:     "VT323", monospace;
  --purple:        #6579e2;
  --purple-dark:   #4a5bc4;
  --purple-shadow: #3a4aaa;
  --blue-glow:     #83d2e6;
  --mint:          #c9fff5;
  --cream:         #f5f0ea;
  --cream-dark:    #e8e3da;
}

html, body {
  min-height: 100dvh;
  background-image: url('assets/elements/stars.gif');
  background-size: auto;
  background-repeat: repeat;
  font-family: var(--font-hand);
  user-select: none;
}

/* ── NAV ── */
.room-nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: var(--mint);
  border-bottom: 2px solid #111;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(12px, 2vw, 28px);
  font-family: var(--font-hand);
  font-size: clamp(14px, 1.6vw, 20px);
  color: #111;
}
.nav-btn { cursor: pointer; padding: 4px 8px; border-radius: 2px; transition: background 0.15s; }
.nav-btn:hover { background: rgba(0,0,0,0.08); }

/* ── PAGE ── */
.page-wrap {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 64px 20px 48px;
}

.page-body {
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── WINDOW ── */
.window {
  background: var(--cream);
  border-radius: 4px;
  box-shadow: 0 0 0 3px var(--purple), 0 0 0 6px var(--blue-glow), 4px 8px 28px rgba(0,0,0,0.28);
  overflow: hidden;
  animation: windowIn 0.35s ease both;
}

@keyframes windowIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.window-titlebar {
  height: 38px;
  background: var(--cream-dark);
  border-bottom: 2px solid #bbb;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-family: var(--font-hand);
  font-size: clamp(13px, 1.4vw, 16px);
  color: #555;
  gap: 10px;
  justify-content: space-between;
}

.window-body { padding: 24px; }

/* ── MONTH HEADER ── */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  margin-bottom: 20px;
}

.month-btn {
  font-family: var(--font-game);
  font-size: 22px;
  background: none;
  border: 1.5px solid var(--purple);
  color: var(--purple);
  width: 36px; height: 36px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.month-btn:hover { background: var(--purple); color: white; }

.month-label {
  font-family: var(--font-pixel);
  font-size: clamp(20px, 2.5vw, 28px);
  color: #333;
  min-width: 220px;
  text-align: center;
}

/* ── CALENDAR GRID ── */
.cal-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 4px;
}

.cal-day-label {
  text-align: center;
  font-family: var(--font-game);
  font-size: 14px;
  color: #aaa;
  padding: 4px 0;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.cal-cell {
  aspect-ratio: 1;
  border: 1.5px solid rgba(101,121,226,0.15);
  background: rgba(255,255,255,0.4);
  border-radius: 2px;
  position: relative;
  cursor: default;
  transition: border-color 0.15s, transform 0.1s;
  overflow: hidden;
}

.cal-cell.empty { background: transparent; border-color: transparent; }

.cal-cell.other-month { opacity: 0.3; }

.cal-cell.has-save {
  border-color: var(--purple);
  cursor: pointer;
  background: rgba(101,121,226,0.05);
}
.cal-cell.has-save:hover {
  border-color: var(--blue-glow);
  transform: scale(1.04);
  z-index: 2;
  box-shadow: 0 0 0 2px var(--blue-glow);
}

.cal-cell.today {
  border-color: var(--blue-glow);
  box-shadow: 0 0 0 1px var(--blue-glow);
}

.cal-date {
  position: absolute;
  top: 4px; left: 5px;
  font-family: var(--font-game);
  font-size: 11px;
  color: #aaa;
  line-height: 1;
}

.cal-cell.has-save .cal-date { color: var(--purple); }
.cal-cell.today .cal-date { color: var(--blue-glow); }

/* Character preview inside cell */
.cal-char {
  position: absolute;
  inset: 14px 2px 2px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cal-char-layer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cal-char-layer img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* ── DETAIL POPUP ── */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.detail-overlay.open { display: flex; }

.detail-window {
  background: var(--cream);
  border-radius: 4px;
  box-shadow: 0 0 0 3px var(--purple), 0 0 0 6px var(--blue-glow), 8px 12px 40px rgba(0,0,0,0.4);
  width: clamp(300px, 90vw, 480px);
  overflow: hidden;
  animation: windowIn 0.2s ease both;
}

.detail-titlebar {
  height: 38px;
  background: var(--cream-dark);
  border-bottom: 2px solid #bbb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  font-family: var(--font-hand);
  font-size: 14px;
  color: #555;
}

.detail-close {
  cursor: pointer;
  font-size: 18px;
  color: #aaa;
  line-height: 1;
  padding: 4px;
}
.detail-close:hover { color: var(--purple); }

.detail-body {
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.detail-mirror {
  width: 180px;
  height: 220px;
  position: relative;
  border: 2px solid var(--purple);
  background: white;
  border-radius: 50% / 40%;
  overflow: hidden;
  box-shadow: 0 0 0 3px var(--blue-glow);
}

.detail-layer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.detail-layer img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.detail-name {
  font-family: var(--font-pixel);
  font-size: 22px;
  color: #333;
}

.detail-date {
  font-family: var(--font-hand);
  font-size: 13px;
  color: #aaa;
}

.detail-parts {
  font-family: var(--font-game);
  font-size: 14px;
  color: #888;
  text-align: center;
  line-height: 1.8;
}

.btn-load {
  padding: 10px 20px;
  background: var(--purple);
  border: 2px solid var(--purple-dark);
  box-shadow: 2px 2px 0 var(--purple-shadow);
  font-family: var(--font-hand);
  font-size: 14px;
  color: white;
  cursor: pointer;
  transition: all 0.05s;
  width: 100%;
}
.btn-load:hover  { background: var(--purple-dark); }
.btn-load:active { box-shadow: none; transform: translate(2px,2px); }

/* ── EMPTY STATE ── */
.empty-month {
  text-align: center;
  padding: 40px 20px;
  font-family: var(--font-hand);
  font-style: italic;
  color: #bbb;
  font-size: 15px;
  line-height: 1.8;
}

.empty-month a {
  color: var(--purple);
  text-decoration: none;
}
.empty-month a:hover { text-decoration: underline; }

/* ── STREAK BAR ── */
.streak-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(101,121,226,0.08);
  border-top: 1px solid rgba(101,121,226,0.15);
  font-family: var(--font-game);
  font-size: 15px;
  color: var(--purple);
}

.streak-num {
  font-size: 22px;
  color: var(--blue-glow);
}

/* ── LOADING ── */
#loading-state {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-pixel);
  font-size: 24px;
  color: var(--blue-glow);
  text-shadow: 0 0 20px rgba(131,210,230,0.6);
}

#main-content { display: none; }

  </style>

const FULL = {

// ── State ────────────────────────────────────────────────
let currentUser  = null;
let allSaves     = [];       // all saves from DB
let viewYear     = new Date().getFullYear();
let viewMonth    = new Date().getMonth(); // 0-indexed
let selectedSave = null;

// ── Helpers ──────────────────────────────────────────────
function localToday() {
  return new Date().toLocaleDateString('en-CA');
}

function formatDateLabel(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const date = new Date(y, m-1, d);
  return date.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}

function buildCharLayer(el, partId) {
  el.innerHTML = partId && FULL[partId]
    ? `<img src="${FULL[partId]}" alt="" />`
    : '';
}

// ── Streak calculation ───────────────────────────────────
function calcStreak(saves) {
  if (!saves.length) return 0;
  const dates = saves.map(s => s.saved_date).sort().reverse();
  const today = localToday();
  let streak = 0;
  let check = today;
  for (const d of dates) {
    if (d === check) {
      streak++;
      // decrement check by 1 day
      const dt = new Date(check + 'T12:00:00');
      dt.setDate(dt.getDate() - 1);
      check = dt.toLocaleDateString('en-CA');
    } else if (d < check) break;
  }
  return streak;
}

// ── Render calendar ──────────────────────────────────────
function renderCalendar() {
  const monthNames = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
  document.getElementById('month-label').textContent = `${monthNames[viewMonth]} ${viewYear}`;

  const grid    = document.getElementById('cal-grid');
  const today   = localToday();
  grid.innerHTML = '';

  // Build a lookup of saved_date -> save object for this month
  const saveMap = {};
  allSaves.forEach(s => { saveMap[s.saved_date] = s; });

  // First day of month, total days
  const firstDay  = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  // Count saves this month
  const monthSaves = allSaves.filter(s => {
    const [y,m] = s.saved_date.split('-').map(Number);
    return y === viewYear && m === viewMonth + 1;
  });

  // Empty leading cells
  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell empty';
    grid.appendChild(cell);
  }

  // Day cells
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const save    = saveMap[dateStr];
    const isToday = dateStr === today;

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (save ? ' has-save' : '') + (isToday ? ' today' : '');

    const dateLabel = document.createElement('div');
    dateLabel.className = 'cal-date';
    dateLabel.textContent = d;
    cell.appendChild(dateLabel);

    if (save?.save_data) {
      const sd = save.save_data;
      const charWrap = document.createElement('div');
      charWrap.className = 'cal-char';

      ['body','acc','hair','eyes','mouth'].forEach(key => {
        if (sd[key]) {
          const layer = document.createElement('div');
          layer.className = 'cal-char-layer';
          const img = document.createElement('img');
          img.src = FULL[sd[key]] || '';
          img.alt = '';
          layer.appendChild(img);
          charWrap.appendChild(layer);
        }
      });

      cell.appendChild(charWrap);
      cell.addEventListener('click', () => openDetail(save));
    }

    grid.appendChild(cell);
  }

  // Empty/save state
  const emptyEl = document.getElementById('empty-state');
  emptyEl.style.display = monthSaves.length === 0 ? 'block' : 'none';
}

// ── Detail popup ─────────────────────────────────────────
function openDetail(save) {
  selectedSave = save;
  const sd = save.save_data || {};

  document.getElementById('detail-title').textContent = formatDateLabel(save.saved_date);
  document.getElementById('detail-name').textContent  = sd.name ? sd.name.toUpperCase() : '(unnamed)';
  document.getElementById('detail-date').textContent  = formatDateLabel(save.saved_date);

  buildCharLayer(document.getElementById('dl-body'),  sd.body);
  buildCharLayer(document.getElementById('dl-acc'),   sd.acc);
  buildCharLayer(document.getElementById('dl-hair'),  sd.hair);
  buildCharLayer(document.getElementById('dl-eyes'),  sd.eyes);
  buildCharLayer(document.getElementById('dl-mouth'), sd.mouth);

  // Parts summary
  const labels = { body:'body', hair:'hair', eyes:'eyes', mouth:'mouth', acc:'accessory' };
  const parts = Object.entries(labels)
    .filter(([k]) => sd[k])
    .map(([k,l]) => `${l}: ${sd[k]?.replace(/^[a-z]+_/,'').replace(/_/g,' ')}`)
    .join('\n');
  document.getElementById('detail-parts').textContent = parts;

  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail(e) {
  if (e.target === document.getElementById('detail-overlay')) closeDetailBtn();
}
function closeDetailBtn() {
  document.getElementById('detail-overlay').classList.remove('open');
  selectedSave = null;
}

function loadIntoBuilder() {
  if (!selectedSave) return;
  try { localStorage.setItem('hb-char', JSON.stringify(selectedSave.save_data)); } catch(e){}
  window.location.href = 'infinity-mirror.html';
}

// ── Month navigation ─────────────────────────────────────
function changeMonth(dir) {
  viewMonth += dir;
  if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0;  viewYear++; }
  renderCalendar();
}

// ── Init ─────────────────────────────────────────────────
async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    currentUser = session.user;

    document.getElementById('archive-email').textContent = currentUser.email;

    // Load all character saves
    const { data, error } = await sb
      .from('game_saves')
      .select('saved_date, save_data')
      .eq('user_id', currentUser.id)
      .eq('game_name', 'character')
      .not('saved_date', 'is', null)
      .order('saved_date', { ascending: false });

    if (!error && data) {
      allSaves = data;
      document.getElementById('total-count').textContent  = allSaves.length;
      document.getElementById('streak-count').textContent = calcStreak(allSaves);
    }

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').style.display  = 'flex';
    renderCalendar();

  } catch(e) {
    console.error(e);
  }
}

init();
</script>

</body>
</html>
